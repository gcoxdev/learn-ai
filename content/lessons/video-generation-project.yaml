  version: 0.4.0-draft
  title: 'Project: trace and evaluate a tiny video generator'
  state: draft
  summary: A dot should cross a 16-pixel strip and pause halfway. Build three generators, spend a budget of four model calls, and write the checks that catch flicker, stray dots, and a vanished pause.
