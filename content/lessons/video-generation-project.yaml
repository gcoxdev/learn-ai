      - id: video-generation-project.catch.v2.4
        prompt: A generator leaves a visual glitch on 2% of frames, independently. What percentage of 24-frame clips contain at least one glitch?
        answer: 38.42
        feedback: 0.98²⁴ ≈ 0.616, so 1 − 0.616 = 0.384, or about 38%. A small per-frame rate becomes a large per-clip rate.
