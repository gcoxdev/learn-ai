        reason_answer: a
        reason_options:
          - id: a
            text: Use each newly computed state to calculate the next output.
          - id: b
            text: Reuse the original seed for all three outputs.
          - id: c
            text: Keep the quotient after dividing by 8 rather than the remainder.
        feedback: The state changes after every draw. Remove complete groups of 8 and keep what remains.
        id: randomness-reproducibility.base.v2.1
