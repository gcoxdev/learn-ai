schema_version: 0.2-draft
lesson:
  id: randomness-reproducibility
  version: 0.4.0-draft
  title: Repeat an experiment without confusing luck with truth
  state: draft
  summary: Same code, same data, Monday 87%, Tuesday 84%. Build a tiny random-number generator by hand, learn what a seed really controls, and stop mistaking a lucky run for a real improvement.
  slot: M02.6
  category: learning
  sources:
    - title: 'Python documentation: pseudorandom generators and seeds'
      url: https://docs.python.org/3/library/random.html
    - title: 'PyTorch documentation: reproducibility'
      url: https://docs.pytorch.org/docs/main/notes/randomness.html
  archetype: mechanism
objectives:
  - id: objective.randomness-reproducibility
    version: 3-draft
    statement: Trace a seeded pseudorandom sequence, and say what to hold fixed and what to vary when checking whether a result repeats.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - randomness-reproducibility.base.v3
      - randomness-reproducibility.transfer.v3
    prerequisites:
      - anyOf:
          - objective.random-variables
      - anyOf:
          - objective.algorithms-and-programs
scenes:
  - id: randomness-reproducibility.s1
    type: explanation
    depth: intuition
    objective_refs:
      - objective.randomness-reproducibility
    title: Same code, different score
    markdown: |-
      On Monday you train a small model and it scores 87% on your test set. On Tuesday you run exactly the same code on exactly the same data, and it scores 84%. Nothing changed. So what happened?

      Training quietly makes random choices. It shuffles the order of the examples, and it picks the model's starting weights at random. Different choices lead to a slightly different model, and a different score. (The probability lesson describes outcomes like this with **random variables**: numbers whose value you don't know until you look.)

      Here's the surprise: computers don't usually roll real dice. They use a **pseudorandom generator**, an ordinary calculation that produces numbers that *look* random. Because it's an ordinary calculation, it's **deterministic**: start it in the same place and it produces exactly the same numbers. The starting value you give it is called the **seed**. Same seed, same "random" numbers, every time.
    bridges:
      - random-variables
  - id: randomness-reproducibility.s2
    type: explanation
    depth: intuition
    objective_refs:
      - objective.randomness-reproducibility
    title: Build a random-number generator by hand
    markdown: |-
      Our teaching generator remembers one whole number, its **state**. To make the next number:

      1. Multiply the state by 3.
      2. Add 1.
      3. Divide by 8 and keep only the remainder (what's left after removing whole groups of 8).

      The result becomes the new state, and it's also the output. Start with seed 1:

      | State | × 3 + 1 | Remainder after ÷ 8 (output) |
      | ---: | ---: | ---: |
      | 1 | 4 | 4 |
      | 4 | 13 | 5 |
      | 5 | 16 | 0 |
      | 0 | 1 | 1 |

      The outputs 4, 5, 0, 1 look fairly jumbled. But the last output is 1, our seed, so the next output is 4 again. The sequence repeats forever: 4, 5, 0, 1, 4, 5, 0, 1…

      :::predict Start instead from seed 2. What are the first three outputs?
      3 × 2 + 1 = 7, so 7. Then 3 × 7 + 1 = 22, and 22 − 16 = 6. Then 3 × 6 + 1 = 19, and 19 − 16 = 3. So 7, 6, 3, and then 2, the seed, which starts the cycle again. Seed 2 lands in a completely different loop that never touches 4, 5, 0, or 1.
      :::
    bridges: []
  - id: randomness-reproducibility.s3
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.randomness-reproducibility
    title: A seed replays the whole sequence
    markdown: |-
      Here's our toy generator in Python, next to Python's real one:

      ```python run
      import random

      def toy_generator(seed, n):
          state = seed                      # the seed sets the starting state
          outputs = []
          for _ in range(n):
              state = (3 * state + 1) % 8   # times 3, plus 1, keep the remainder after dividing by 8
              outputs.append(state)         # the new state is also the output
          return outputs

      print("toy, seed 1:          ", toy_generator(1, 8))
      print("toy, seed 1 again:    ", toy_generator(1, 8))
      print("toy, seed 2:          ", toy_generator(2, 8))

      random.seed(42)                                   # Python's own generator, seeded
      first = [random.randint(0, 9) for _ in range(8)]  # eight digits from 0 to 9
      random.seed(42)                                   # same seed again...
      second = [random.randint(0, 9) for _ in range(8)]
      print("Python, seed 42:      ", first)
      print("Python, seed 42 again:", second)
      ```

      `%` is Python's remainder operator. The toy's two seed-1 lines match, and so do Python's two seed-42 lines. Change the second `random.seed(42)` to `random.seed(7)` and the lists no longer match.

      Python's generator (an algorithm called the Mersenne Twister) works on the same principle as our toy, a state updated by a fixed calculation, but its cycle is so long it would never repeat in the lifetime of the universe. Our toy repeats after four numbers and never produces 2, 3, 6, or 7 from seed 1, so keep it for tracing by hand.

      That predictability is exactly why a seed is useful for experiments, and why anything secret, like a password-reset code, should come from Python's `secrets` module instead: anyone who knows the seed can replay the numbers.
    bridges: []
  - id: randomness-reproducibility.s4
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.randomness-reproducibility
    title: The seed is only the starting line
    markdown: |-
      Two teammates both use seed 1 with our toy generator. Lena draws one number and uses it as a starting weight: she gets 4. Omar first draws one number to shuffle the data, *then* draws the weight: he gets 5. Same seed, different weight, because Omar's shuffle used up the first number in the sequence.

      :::mixup "If I set the seed, my experiment will repeat exactly."
      The seed fixes where the sequence starts, not how your program uses it. Adding a draw anywhere shifts every later number. And real training runs have other sources of variation: some calculations on graphics processors add numbers in a different order from run to run, and library versions change. PyTorch's documentation warns that fully reproducible results aren't promised across releases or platforms.
      :::

      So a useful record of a run lists the data version, the code version, the settings, the seed, and the library versions and hardware. With that, someone else, or you in six months, can rerun it and get the same answer, or at least find out why they didn't.
    bridges: []
  - id: randomness-reproducibility.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.randomness-reproducibility
    markdown: Run the toy generator from new seeds, then decide what a seed can and can't settle for shuffled data, crashing runs, and a "new record" score.
    takeaway: |-
      A seed lets you replay one run exactly, which is perfect for debugging. To show a change really helps, run several seeds and compare the spread, not the single best score.
  - id: randomness-reproducibility.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.randomness-reproducibility
    markdown: |-
      Pseudorandom seeds support repeatability, while multiple runs, recorded conditions, and suitable sampling reveal how much a result depends on chance.
  - id: randomness-reproducibility.s5
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.randomness-reproducibility
    title: One lucky run is not a result
    markdown: |-
      Suppose you train the same model with three different seeds and get test scores of 70, 80, and 90. The **mean** (average) is (70 + 80 + 90) ÷ 3 = 80, and the **spread** runs from 70 to 90. That spread is how much your result depends on luck alone.

      Rerunning the 90 seed will give 90 again, but it only replays the lucky run. Reporting "our model scores 90" hides the 70.

      :::predict You try a new training trick. With one seed it scores 86. Is the trick better than the old method's average of 80?
      You can't tell yet. 86 sits comfortably inside the old method's range of 70 to 90; the old method itself scored 90 once with no trick at all. Run the new method on several seeds too, then compare the two sets of scores.
      :::
    bridges: []
  - id: randomness-reproducibility.s6
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.randomness-reproducibility
    title: Fix the seed to debug, vary it to decide
    markdown: |-
      Seeds serve two different jobs, and good practitioners use both.

      | Goal | What to do with the seed | Why |
      | --- | --- | --- |
      | Chase down a weird result or a crash | Fix it | Replay the exact run and inspect it step by step |
      | Decide whether a change helps | Vary it | See the spread, so luck can't pass for progress |

      Here's Ana putting both to work. Her new data-cleaning step seems to raise accuracy by 2 points. Her first try crashes halfway, so she reruns with the same seed; the crash repeats at exactly the same step, and she finds a corrupted image in that batch and removes it. Then she runs the old and new pipelines with the same five seeds:

      | | Mean of 5 seeds | Range |
      | --- | ---: | ---: |
      | Old pipeline | 81 | 79–83 |
      | New pipeline | 83 | 82–84 |

      The new pipeline is higher on average, and even its worst run (82) beats the old pipeline's average. She reports both rows, not just the best number.
    bridges: []
