scenes:
- id: randomness-reproducibility.s1
  type: explanation
  depth: intuition
  objective_refs:
  - objective.randomness-reproducibility
  title: Why identical code can give different results
  markdown: 'Training programs may shuffle example order or choose starting weights using a number generator.
    A **random variable** describes a numerical outcome whose value is uncertain before it is observed. The
    probability bridge explains how probabilities describe such outcomes.


    A **pseudorandom generator** instead uses a deterministic calculation to produce a sequence designed to
    have useful random-like properties. Deterministic means that the same starting state and the same operations
    produce the same sequence. A **seed** is a value used to initialize that state. Random-looking output can
    therefore be repeatable.'
  text_mode: 'Training programs may shuffle example order or choose starting weights using a number generator.
    A **random variable** describes a numerical outcome whose value is uncertain before it is observed. The
    probability bridge explains how probabilities describe such outcomes.


    A **pseudorandom generator** instead uses a deterministic calculation to produce a sequence designed to
    have useful random-like properties. Deterministic means that the same starting state and the same operations
    produce the same sequence. A **seed** is a value used to initialize that state. Random-looking output can
    therefore be repeatable.'
  bridges:
  - random-variables
- id: randomness-reproducibility.s2
  type: explanation
  depth: intuition
  objective_refs:
  - objective.randomness-reproducibility
  title: Build a deliberately tiny generator
  markdown: 'Our teaching generator remembers one whole number called state. To get the next value, multiply
    the state by 3, add 1, then keep the remainder after dividing by 8. A remainder is what is left after taking
    away whole groups of 8.


    For state 1, compute 3 × 1 + 1 = 4. Four contains no complete group of 8, so the next state is 4. For state
    4, compute 13. Removing one group of 8 leaves 5. We return each new state as the next output. This is a
    traceable toy, not a recommended generator.'
  text_mode: 'Our teaching generator remembers one whole number called state. To get the next value, multiply
    the state by 3, add 1, then keep the remainder after dividing by 8. A remainder is what is left after taking
    away whole groups of 8.


    For state 1, compute 3 × 1 + 1 = 4. Four contains no complete group of 8, so the next state is 4. For state
    4, compute 13. Removing one group of 8 leaves 5. We return each new state as the next output. This is a
    traceable toy, not a recommended generator.'
  bridges: []
- id: randomness-reproducibility.s3
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.randomness-reproducibility
  title: Repeat the run and notice the cycle
  markdown: 'Starting at seed 1 gives outputs 4, 5, 0, 1, and then 4 again. For example, state 5 produces 16,
    whose remainder after division by 8 is 0. State 0 then produces 1.


    Restarting from seed 1 repeats this sequence. Continuing from state 5 does not restart it; the next output
    is 0. The cycle has only four values, and some possible outputs never appear in this run. Repeatability
    does not establish good random sampling. Real generators need much stronger statistical properties, and
    security-sensitive randomness has additional requirements beyond our lesson.'
  text_mode: 'Starting at seed 1 gives outputs 4, 5, 0, 1, and then 4 again. For example, state 5 produces
    16, whose remainder after division by 8 is 0. State 0 then produces 1.


    Restarting from seed 1 repeats this sequence. Continuing from state 5 does not restart it; the next output
    is 0. The cycle has only four values, and some possible outputs never appear in this run. Repeatability
    does not establish good random sampling. Real generators need much stronger statistical properties, and
    security-sensitive randomness has additional requirements beyond our lesson.'
  bridges: []
- id: randomness-reproducibility.s4
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.randomness-reproducibility
  title: A seed is only part of a reproducible record
  markdown: 'To repeat an experiment, record the data, code, settings, initial state, and relevant software
    and hardware environment. Also record the order of random draws: using one extra draw to shuffle a list
    can change which later value becomes a starting weight.


    AI libraries may use several generators, and some parallel operations do not produce identical results
    under every execution order. A fixed seed by itself therefore does not promise identical training results
    across library versions or devices. Framework documentation describes controls and remaining limits. The
    record should make the comparison reproducible to the degree the experiment requires.'
  text_mode: 'To repeat an experiment, record the data, code, settings, initial state, and relevant software
    and hardware environment. Also record the order of random draws: using one extra draw to shuffle a list
    can change which later value becomes a starting weight.


    AI libraries may use several generators, and some parallel operations do not produce identical results
    under every execution order. A fixed seed by itself therefore does not promise identical training results
    across library versions or devices. Framework documentation describes controls and remaining limits. The
    record should make the comparison reproducible to the degree the experiment requires.'
  bridges: []
- id: randomness-reproducibility.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.randomness-reproducibility
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: A seed can help repeat a particular computation. Evidence that a result holds more broadly requires
    checking more than that one repeated run.
- id: randomness-reproducibility.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.randomness-reproducibility
  markdown: Pseudorandom seeds support repeatability, while multiple runs, recorded conditions, and suitable
    sampling reveal how much a result depends on chance.
  text_mode: Pseudorandom seeds support repeatability, while multiple runs, recorded conditions, and suitable
    sampling reveal how much a result depends on chance.
- id: randomness-reproducibility.s5
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.randomness-reproducibility
  title: Separate a repeated run from repeated evidence
  markdown: 'Suppose three independently seeded training runs score 70, 80, and 90 on the same evaluation,
    where higher is better. Their average is (70 + 80 + 90) ÷ 3 = 80; their range spans 70 to 90.


    Repeating the seed that scored 90 confirms that particular run under controlled conditions. Reporting only
    90 hides the other outcomes. Running several seeds probes sensitivity to randomness; testing other representative
    examples probes sensitivity to the evaluation data. These answer different questions. A mean from three
    runs also does not establish performance on every future run.'
  text_mode: 'Suppose three independently seeded training runs score 70, 80, and 90 on the same evaluation,
    where higher is better. Their average is (70 + 80 + 90) ÷ 3 = 80; their range spans 70 to 90.


    Repeating the seed that scored 90 confirms that particular run under controlled conditions. Reporting only
    90 hides the other outcomes. Running several seeds probes sensitivity to randomness; testing other representative
    examples probes sensitivity to the evaluation data. These answer different questions. A mean from three
    runs also does not establish performance on every future run.'
  bridges: []
- id: randomness-reproducibility.s6
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.randomness-reproducibility
  title: Plan a useful experiment record
  markdown: 'Imagine a changed training method scores two points higher than an earlier method. Before crediting
    the change, compare repeated runs under comparable data and compute budgets. Preserve failures as well
    as successes, and report how much scores vary.


    For debugging, a fixed seed helps reproduce a surprising result and inspect the steps that caused it. For
    broader scientific evidence, intentionally vary seeds and appropriate evaluation conditions. Do not confuse
    the purpose of the fixed example with the purpose of the wider comparison. Our tiny generator demonstrates
    the mechanics of state; it does not simulate a modern model’s training quality.'
  text_mode: 'Imagine a changed training method scores two points higher than an earlier method. Before crediting
    the change, compare repeated runs under comparable data and compute budgets. Preserve failures as well
    as successes, and report how much scores vary.


    For debugging, a fixed seed helps reproduce a surprising result and inspect the steps that caused it. For
    broader scientific evidence, intentionally vary seeds and appropriate evaluation conditions. Do not confuse
    the purpose of the fixed example with the purpose of the wider comparison. Our tiny generator demonstrates
    the mechanics of state; it does not simulate a modern model’s training quality.'
  bridges: []
