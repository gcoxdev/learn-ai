    hint: 'Control a seed and observe what changes: trace the inputs, operation, and result before choosing.'
    remediation_scene: randomness-reproducibility.s2
    variants:
      - id: randomness-reproducibility.base.1
        prompt: What does a pseudorandom seed primarily control?
        options:
          - id: a
            text: The starting state of a generator
          - id: b
            text: The correctness of all labels
          - id: c
            text: The physical meaning of every feature
        answer: a
        feedback: A seed initializes a repeatable generation process.
        retired: true
      - id: randomness-reproducibility.base.2
        prompt: Same-seed repeatability establishes which property most directly?
        options:
          - id: b
            text: Generalization to every population
          - id: c
            text: Freedom from data leakage
          - id: a
            text: Repeatability under the recorded conditions
        answer: a
        feedback: Repeated numbers under controlled conditions are a limited but useful check.
        retired: true
  - id: randomness-reproducibility.transfer
    objective_ref: objective.randomness-reproducibility
    task: transfer
    response_type: single_choice
    points: 1
