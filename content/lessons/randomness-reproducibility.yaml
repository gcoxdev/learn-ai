assessment_families:
- id: randomness-reproducibility.base
  objective_ref: objective.randomness-reproducibility
  task: base
  response_type: single_choice
  points: 1
  hint: 'Control a seed and observe what changes: trace the inputs, operation, and result before choosing.'
  remediation_scene: randomness-reproducibility.s2
  variants:
  - id: randomness-reproducibility.base.1
    prompt: What does a pseudorandom seed primarily control?
    options:
    - id: a
      text: The starting state of a generator
    - id: b
      text: The correctness of all labels
    - id: c
      text: The physical meaning of every feature
    answer: a
    feedback: A seed initializes a repeatable generation process.
    retired: true
  - id: randomness-reproducibility.base.2
    prompt: Same-seed repeatability establishes which property most directly?
    options:
    - id: b
      text: Generalization to every population
    - id: c
      text: Freedom from data leakage
    - id: a
      text: Repeatability under the recorded conditions
    answer: a
    feedback: Repeated numbers under controlled conditions are a limited but useful check.
    retired: true
- id: randomness-reproducibility.transfer
  objective_ref: objective.randomness-reproducibility
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Record the moving parts: trace the inputs, operation, and result before choosing.'
  remediation_scene: randomness-reproducibility.s4
  variants:
  - id: randomness-reproducibility.transfer.1
    prompt: Only the best of 50 random runs is reported. What is missing?
    options:
    - id: b
      text: Proof that the method has no randomness
    - id: c
      text: A larger screenshot
    - id: a
      text: The selection procedure and performance variation
    answer: a
    feedback: Selective reporting can exaggerate typical performance.
    retired: true
  - id: randomness-reproducibility.transfer.2
    prompt: A run changes after a library update despite the same seed. Is that impossible?
    options:
    - id: c
      text: Yes; hardware never matters
    - id: a
      text: No; implementations and numerical execution can change
    - id: b
      text: Yes; a seed fixes all software behavior
    answer: a
    feedback: The full computational environment affects repeatability.
    retired: true
- id: randomness-reproducibility.base.v2
  objective_ref: objective.randomness-reproducibility
  task: base
  response_type: numeric_fields_with_reason
  points: 1
  hint: Work through the example one step at a time before answering.
  remediation_scene: randomness-reproducibility.s3
  variants:
  - prompt: Our toy generator replaces state with the remainder of (3 × state + 1) divided by 8. Starting at
      seed 0, give the next three outputs.
    answers:
      first: 1
      second: 4
      third: 5
    reason_answer: a
    reason_options:
    - id: a
      text: Use each newly computed state to calculate the next output.
    - id: b
      text: Reuse the original seed for all three outputs.
    - id: c
      text: Keep the quotient after dividing by 8 rather than the remainder.
    feedback: The state changes after every draw. Remove complete groups of 8 and keep what remains.
    id: randomness-reproducibility.base.v2.1
  - prompt: Our toy generator replaces state with the remainder of (3 × state + 1) divided by 8. Starting at
      seed 2, give the next three outputs.
    answers:
      first: 7
      second: 6
      third: 3
    reason_answer: a
    reason_options:
    - id: b
      text: Reuse the original seed for all three outputs.
    - id: c
      text: Keep the quotient after dividing by 8 rather than the remainder.
    - id: a
      text: Use each newly computed state to calculate the next output.
    feedback: The state changes after every draw. Remove complete groups of 8 and keep what remains.
    id: randomness-reproducibility.base.v2.2
  - prompt: Our toy generator replaces state with the remainder of (3 × state + 1) divided by 8. Starting at
      seed 3, give the next three outputs.
    answers:
      first: 2
      second: 7
      third: 6
    reason_answer: a
    reason_options:
    - id: c
      text: Keep the quotient after dividing by 8 rather than the remainder.
    - id: a
      text: Use each newly computed state to calculate the next output.
    - id: b
