  - id: randomness-reproducibility.transfer.v2
    objective_ref: objective.randomness-reproducibility
    task: transfer
    response_type: single_choice
    points: 1
    hint: Work through the example one step at a time before answering.
    remediation_scene: randomness-reproducibility.s4
    variants:
      - prompt: Two programs use the same seed, but one consumes an extra random draw before choosing a weight. Must their chosen weights match?
        answer: a
        options:
          - id: a
            text: No; they may use different positions in the generated sequence.
          - id: b
            text: Yes; each draw from a seed returns the same number.
          - id: c
            text: Yes; extra draws cannot change generator state.
        feedback: A seed initializes the sequence; subsequent draws advance its state.
        id: randomness-reproducibility.transfer.v2.1
        retired: true
      - prompt: Scores from three seeded runs are 70, 80, and 90. What report better represents these observations?
        answer: a
        options:
          - id: b
            text: Report only 90 because it is the strongest result.
          - id: c
            text: Report 90 three times by rerunning that seed.
          - id: a
            text: Report the average 80 and the observed range 70–90.
        feedback: The average and range retain information about the observed variability.
        id: randomness-reproducibility.transfer.v2.2
        retired: true
      - prompt: A tiny generator repeats a four-value cycle. What does this demonstrate?
        answer: a
        options:
          - id: c
            text: It generates a fresh unpredictable sequence each time it restarts.
          - id: a
            text: It is repeatable, but the cycle alone does not establish useful sampling quality.
          - id: b
            text: It samples every whole number between 0 and 7 equally in that run.
        feedback: Determinism and statistical quality are separate properties.
        id: randomness-reproducibility.transfer.v2.3
        retired: true
      - prompt: A training result changes after switching devices despite a fixed seed. What is a reasonable next check?
        answer: a
        options:
          - id: a
            text: Compare the software, operation choices, and determinism controls.
          - id: b
            text: Conclude that the stored seed has no role in any experiment.
          - id: c
            text: Assume the evaluation target automatically changed.
        feedback: Environment and operation behavior can affect repeatability beyond the initial seed.
        id: randomness-reproducibility.transfer.v2.4
        retired: true
  - id: randomness-reproducibility.base.v3
    objective_ref: objective.randomness-reproducibility
    task: base
    response_type: numeric_fields_with_reason
    points: 1
    hint: Each output becomes the next state. Multiply by 3, add 1, then take away whole groups of 8 and keep what's left.
    remediation_scene: randomness-reproducibility.s2
    numeric_fields:
      - id: first
        label: First output
      - id: second
        label: Second output
      - id: third
        label: Third output
    absolute_tolerance: 1e-6
    variants:
      - id: randomness-reproducibility.base.v3.1
        prompt: 'Use the lesson''s toy generator: new state = remainder of (3 × state + 1) ÷ 8, and each new state is the output. Starting from seed 5, what are the first three outputs?'
        answers:
          first: 0
          second: 1
          third: 4
        reason_answer: b
        reason_options:
          - id: a
            text: Restart from the seed to make each of the three outputs.
          - id: b
            text: Feed each output back in as the state for the next step.
          - id: c
            text: Keep how many whole 8s fit, rather than the remainder.
        feedback: 3 × 5 + 1 = 16, remainder 0. Then 3 × 0 + 1 = 1. Then 3 × 1 + 1 = 4. Restarting from 5 each time would give 0, 0, 0, since the state must move on after every draw.
      - id: randomness-reproducibility.base.v3.2
        prompt: 'Use the lesson''s toy generator: new state = remainder of (3 × state + 1) ÷ 8, and each new state is the output. Starting from seed 6, what are the first three outputs?'
        answers:
          first: 3
          second: 2
          third: 7
        reason_answer: c
        reason_options:
          - id: a
            text: Keep how many whole 8s fit, rather than the remainder.
          - id: b
            text: Restart from the seed to make each of the three outputs.
          - id: c
            text: Feed each output back in as the state for the next step.
        feedback: 3 × 6 + 1 = 19, and 19 − 16 = 3. Then 3 × 3 + 1 = 10, remainder 2. Then 3 × 2 + 1 = 7. Keeping the number of whole 8s instead would give 2 for the first output, not 3.
      - id: randomness-reproducibility.base.v3.3
        prompt: 'Use the lesson''s toy generator: new state = remainder of (3 × state + 1) ÷ 8, and each new state is the output. Starting from seed 7, what are the first three outputs?'
        answers:
          first: 6
          second: 3
          third: 2
        reason_answer: a
        reason_options:
          - id: a
            text: Feed each output back in as the state for the next step.
          - id: b
            text: Keep how many whole 8s fit, rather than the remainder.
          - id: c
            text: Restart from the seed to make each of the three outputs.
        feedback: 3 × 7 + 1 = 22, and 22 − 16 = 6. Then 3 × 6 + 1 = 19, remainder 3. Then 3 × 3 + 1 = 10, remainder 2. Restarting from 7 each time would repeat 6 three times.
      - id: randomness-reproducibility.base.v3.4
        prompt: 'Use the lesson''s toy generator: new state = remainder of (3 × state + 1) ÷ 8, and each new state is the output. Starting from seed 0, what are the first three outputs?'
        answers:
          first: 1
          second: 4
          third: 5
        reason_answer: b
        reason_options:
          - id: a
            text: Restart from the seed to make each of the three outputs.
          - id: b
            text: Feed each output back in as the state for the next step.
          - id: c
            text: Keep how many whole 8s fit, rather than the remainder.
        feedback: 3 × 0 + 1 = 1. Then 3 × 1 + 1 = 4. Then 3 × 4 + 1 = 13, and 13 − 8 = 5. The state must move on after each draw, or every output would be 1.
      - id: randomness-reproducibility.base.v3.5
        prompt: 'Use the lesson''s toy generator: new state = remainder of (3 × state + 1) ÷ 8, and each new state is the output. Starting from seed 3, what are the first three outputs?'
        answers:
          first: 2
          second: 7
          third: 6
        reason_answer: c
        reason_options:
          - id: a
            text: Keep how many whole 8s fit, rather than the remainder.
          - id: b
            text: Restart from the seed to make each of the three outputs.
          - id: c
            text: Feed each output back in as the state for the next step.
        feedback: 3 × 3 + 1 = 10, remainder 2. Then 3 × 2 + 1 = 7. Then 3 × 7 + 1 = 22, and 22 − 16 = 6. Keeping the whole 8s would give 1 for the first output instead of 2.
  - id: randomness-reproducibility.transfer.v3
    objective_ref: objective.randomness-reproducibility
    task: transfer
    response_type: single_choice
    points: 1
    hint: A fixed seed replays one run, which is ideal for debugging. Judging whether something really helps needs several seeds and a look at the spread.
    remediation_scene: randomness-reproducibility.s5
    variants:
      - id: randomness-reproducibility.transfer.v3.1
        prompt: Two teammates both use seed 42. One adds a line that shuffles the data before the starting weights are drawn. Their starting weights now differ. Why?
        options:
          - id: a
            text: Seed 42 gives different numbers on different laptops
          - id: b
            text: The shuffle used up draws, so the weights come later
          - id: c
            text: Shuffling the data resets the generator to a new seed
        answer: b
        feedback: The seed fixes where the sequence starts; every draw moves it along. The shuffle consumed the first numbers, so the weights were drawn from further down the same sequence. The seed itself didn't change.
      - id: randomness-reproducibility.transfer.v3.2
        prompt: Three runs of the same model with different seeds score 70, 80, and 90. Which report is most honest?
        options:
          - id: c
            text: 'Scores 90, from the best run, showing what it can do'
          - id: a
            text: 'Scores 80 on average, ranging from 70 to 90 over 3 seeds'
          - id: b
            text: 'Scores 80, from the middle run, since that one is typical'
        answer: a
        feedback: Giving the mean and the range shows both the typical result and how much it depends on luck. Reporting only the best run hides the 70, and reporting one middle run hides the spread.
      - id: randomness-reproducibility.transfer.v3.3
        prompt: An old method scored 80, 84, and 88 with three seeds. A new method scores 86 with one seed. What is the best conclusion?
        options:
          - id: a
            text: 86 is inside the old spread, so run the new method on more seeds
          - id: b
            text: The new method is better, since 86 beats the old average of 84
          - id: c
            text: The new method is worse, since 86 is below the old best of 88
        answer: a
        feedback: The old method alone ranges from 80 to 88, so one run of 86 could easily be luck. Comparing it with the old average or the old best treats a single seed as if it were the whole story.
      - id: randomness-reproducibility.transfer.v3.4
        prompt: A training run sometimes crashes with a strange error around step 5,000. What does fixing the seed help you do?
        options:
          - id: b
            text: See how often the crash happens across many different runs
          - id: c
            text: Make the finished model more accurate on brand-new data
          - id: a
            text: Replay the crashing run exactly, so you can inspect it
        answer: a
        feedback: A fixed seed makes the run repeat step for step, so you can stop just before the crash and look. Seeing how often it happens needs the opposite, many different seeds, and seeds don't change what the model learns to do well.
      - id: randomness-reproducibility.transfer.v3.5
        prompt: A website makes password-reset codes with Python's `random`, seeded with the current date. What is the problem?
        options:
          - id: c
            text: Anyone who guesses the date can replay the same codes
          - id: a
            text: Codes made from a date contain repeated digits too often
          - id: b
            text: A seed must be a single whole number, not a calendar date
        answer: c
        feedback: A pseudorandom generator is a fixed calculation, so the same seed replays the same numbers, and a date is easy to guess. Secret codes should come from Python's `secrets` module. Converting the date to a number wouldn't fix anything.
      - id: randomness-reproducibility.transfer.v3.6
        prompt: The same code with the same seed gives a slightly different score on a colleague's computer, which has a different graphics processor and library version. What is the most likely reason?
        options:
          - id: b
            text: Seeds only work on the computer where they were first set
          - id: a
            text: Some calculations run in a different order on that setup
          - id: c
            text: The model kept learning from the previous run's results
        answer: a
        feedback: Graphics processors and library versions can add numbers in a different order, and tiny rounding differences grow over training. A seed works the same everywhere, which is why records should list hardware and library versions too.
