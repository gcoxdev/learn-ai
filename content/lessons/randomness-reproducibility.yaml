schema_version: 0.2-draft
lesson:
  id: randomness-reproducibility
  version: 0.3.0-draft
  title: Repeat an experiment without confusing luck with truth
  state: draft
  summary: Step through a seeded number generator and distinguish repeating a run from showing that a result
    is reliable.
  slot: M02.6
  category: learning
  sources:
  - title: 'Python documentation: pseudorandom generators and seeds'
    url: https://docs.python.org/3/library/random.html
  - title: 'PyTorch documentation: reproducibility'
    url: https://docs.pytorch.org/docs/main/notes/randomness.html
  archetype: mechanism
objectives:
- id: objective.randomness-reproducibility
  version: 2-draft
  statement: Trace a deterministic pseudorandom sequence and identify what must be controlled and varied when
    checking repeatability and robustness.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - randomness-reproducibility.base.v2
  - randomness-reproducibility.transfer.v2
  prerequisites:
