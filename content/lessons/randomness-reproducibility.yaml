schema_version: 0.2-draft
lesson:
  id: randomness-reproducibility
  version: 0.1.0-draft
  title: Repeat an experiment without confusing luck with truth
  state: draft
  summary: Pseudorandom seeds support repeatability, while multiple runs, recorded conditions, and suitable sampling
    reveal how much a result depends on chance.
  slot: M02.6
  category: learning
  minutes: 12
  sources:
  - title: NumPy — absolute beginners’ guide
    url: https://numpy.org/doc/stable/user/absolute_beginners.html
  - title: Dive into Deep Learning — authors’ open textbook
    url: https://d2l.ai/
objectives:
- id: objective.randomness-reproducibility
  version: 1-draft
  statement: Pseudorandom seeds support repeatability, while multiple runs, recorded conditions, and suitable sampling
    reveal how much a result depends on chance.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - randomness-reproducibility.base
  - randomness-reproducibility.transfer
  prerequisites:
  - anyOf:
    - objective.random-variables
  - anyOf:
    - objective.algorithms-and-programs
scenes:
- id: randomness-reproducibility.s1
  title: Randomness has several roles
  type: explanation
  depth: intuition
  objective_refs:
  - objective.randomness-reproducibility
  markdown: Learning uses randomness to initialize parameters, shuffle examples, sample batches, or choose generated
    outputs. These operations affect different parts of a pipeline. Pseudorandom generators produce a deterministic
    sequence from a state, but the sequence is designed to behave usefully like random draws for specified purposes.
  text_mode: Learning uses randomness to initialize parameters, shuffle examples, sample batches, or choose generated
    outputs. These operations affect different parts of a pipeline. Pseudorandom generators produce a deterministic
    sequence from a state, but the sequence is designed to behave usefully like random draws for specified purposes.
  bridges: []
- id: randomness-reproducibility.s2
  title: Control a seed and observe what changes
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.randomness-reproducibility
  markdown: Run a toy learner twice with the same data order, initial state, seed, software, and computation settings.
    Matching results can verify repeatability under those conditions. Change the seed to inspect sensitivity to
    initialization or sampling. A result that appears only for one favorable seed needs cautious interpretation.
  text_mode: Run a toy learner twice with the same data order, initial state, seed, software, and computation settings.
    Matching results can verify repeatability under those conditions. Change the seed to inspect sensitivity to
    initialization or sampling. A result that appears only for one favorable seed needs cautious interpretation.
  bridges: []
- id: randomness-reproducibility.s3
  title: Distinguish three questions
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.randomness-reproducibility
  markdown: Can another run reproduce the same numbers? Does the method perform consistently across random variation?
    Does it work on a new population? Those are repeatability, statistical reliability, and generalization questions.
    Answering the first does not establish the other two.
  text_mode: Can another run reproduce the same numbers? Does the method perform consistently across random variation?
    Does it work on a new population? Those are repeatability, statistical reliability, and generalization questions.
    Answering the first does not establish the other two.
  bridges: []
- id: randomness-reproducibility.s4
  title: Record the moving parts
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.randomness-reproducibility
  markdown: Keep data versions, configuration, code revision, environment, and evaluation procedure with the result.
    Parallel execution and hardware kernels can add nondeterminism. Report a distribution or uncertainty across
    justified repetitions instead of selecting the best run. A seed is a useful control, not an explanation of why
    a method works.
  text_mode: Keep data versions, configuration, code revision, environment, and evaluation procedure with the result.
    Parallel execution and hardware kernels can add nondeterminism. Report a distribution or uncertainty across
    justified repetitions instead of selecting the best run. A seed is a useful control, not an explanation of why
    a method works.
  bridges: []
- id: randomness-reproducibility.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.randomness-reproducibility
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
- id: randomness-reproducibility.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.randomness-reproducibility
  markdown: Pseudorandom seeds support repeatability, while multiple runs, recorded conditions, and suitable sampling
    reveal how much a result depends on chance.
  text_mode: Pseudorandom seeds support repeatability, while multiple runs, recorded conditions, and suitable sampling
