  bridges: []
- id: stochastic-gradients.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.stochastic-gradients
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: A minibatch gives a cheaper, noisy estimate of the dataset gradient. How you sample and average
    examples affects both that estimate and the size of the update.
