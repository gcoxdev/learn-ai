schema_version: 0.2-draft
lesson:
  id: stochastic-gradients
  version: 0.3.0-draft
  title: Learn from a sample of examples at each step
  state: draft
  summary: Use a small group of examples for an update and see how averaging and sampling change the step.
  slot: M10.3
  category: learning
  sources:
  - title: Dive into Deep Learning — authors’ open textbook
    url: https://d2l.ai/
objectives:
- id: objective.stochastic-gradients
  version: 1-draft
  statement: Full-batch, stochastic, and minibatch descent use different gradient estimates; batch construction,
    averaging, and learning rate affect noise, cost, and convergence behavior.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - stochastic-gradients.base
  - stochastic-gradients.transfer
  prerequisites:
  - anyOf:
    - objective.update-consequence
  - anyOf:
    - objective.random-variables
scenes:
- id: stochastic-gradients.s1
  title: Choose how many examples contribute to a step
  type: explanation
  depth: intuition
  objective_refs:
  - objective.stochastic-gradients
  markdown: 'A **batch** is a group of examples processed together. Full-batch gradient descent uses the whole
    training dataset for each update. A **minibatch** uses a smaller group, usually chosen with some randomness.
    This is why the method is called **stochastic gradient descent (SGD)**.


    For equally weighted examples, the objective is often their average loss, and its gradient is the average
    of their gradients. Full-batch computes that average exactly for the dataset; a minibatch estimates it
    with less work per update.'
  text_mode: 'A **batch** is a group of examples processed together. Full-batch gradient descent uses the whole
    training dataset for each update. A **minibatch** uses a smaller group, usually chosen with some randomness.
    This is why the method is called **stochastic gradient descent (SGD)**.


    For equally weighted examples, the objective is often their average loss, and its gradient is the average
    of their gradients. Full-batch computes that average exactly for the dataset; a minibatch estimates it
    with less work per update.'
  bridges: []
- id: stochastic-gradients.s2
  title: Use a minibatch estimate
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.stochastic-gradients
  markdown: A minibatch computes the average over a selected subset. If two example gradients are 2 and 6,
    their mean is 4. With current weight 1 and learning rate 0.1, the descent update is 1 − 0.1 × 4 = 0.6.
    Summing instead of averaging changes the effective step scale.
  text_mode: A minibatch computes the average over a selected subset. If two example gradients are 2 and 6,
    their mean is 4. With current weight 1 and learning rate 0.1, the descent update is 1 − 0.1 × 4 = 0.6.
    Summing instead of averaging changes the effective step scale.
  bridges:
  - random-variables
- id: stochastic-gradients.s3
  title: Noise is tied to sampling
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.stochastic-gradients
  markdown: Representative random batches can provide useful estimates of the dataset gradient. Correlated
    or systematically selected batches can behave differently. A stochastic step may increase full-dataset
    loss even when the method improves it over time. Batch size also affects hardware efficiency, memory, and
    update frequency.
  text_mode: Representative random batches can provide useful estimates of the dataset gradient. Correlated
    or systematically selected batches can behave differently. A stochastic step may increase full-dataset
    loss even when the method improves it over time. Batch size also affects hardware efficiency, memory, and
    update frequency.
  bridges: []
- id: stochastic-gradients.s4
  title: Combine small batches with the right weights
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.stochastic-gradients
  markdown: 'Memory limits may require processing a batch in smaller pieces called **microbatches**. **Gradient
    accumulation** combines their gradients before making one update.


    Suppose a piece with 2 examples has mean gradient 3, and a piece with 6 examples has mean gradient 5. The
    combined mean is (2 × 3 + 6 × 5) / 8 = 4.5, not the unweighted average 4. Each example needs its intended
    contribution.


    When comparing runs, count examples or tokens processed, updates, elapsed time, and validation results.
    Equal effective batch sizes do not guarantee identical runs: ordering, random layers, normalization, and
    numerical precision can still differ.'
  text_mode: 'Memory limits may require processing a batch in smaller pieces called **microbatches**. **Gradient
    accumulation** combines their gradients before making one update.


    Suppose a piece with 2 examples has mean gradient 3, and a piece with 6 examples has mean gradient 5. The
