assessment_families:
  - id: stochastic-gradients.base
    objective_ref: objective.stochastic-gradients
    task: base
    response_type: single_choice
    points: 1
    hint: Average the example gradients in the batch first, then apply new weight = old weight − rate × average.
    remediation_scene: stochastic-gradients.s2
    variants:
      - id: stochastic-gradients.base.1
        retired: true
        prompt: Gradients 3 and 7 are averaged. What gradient is used?
        options:
          - id: c
            text: '4'
          - id: a
            text: '5'
          - id: b
            text: '10'
        answer: a
        feedback: The arithmetic mean is (3 + 7)/2.
      - id: stochastic-gradients.base.2
        retired: true
        prompt: 'Weight 2, average gradient 5, rate 0.1: new weight?'
        options:
          - id: a
            text: '1.5'
          - id: b
            text: '2.5'
          - id: c
            text: '0.5'
        answer: a
        feedback: Subtract the rate-scaled gradient.
  - id: stochastic-gradients.transfer
    objective_ref: objective.stochastic-gradients
    task: transfer
    response_type: single_choice
    points: 1
    hint: Ask how the batch was sampled and averaged before blaming the model.
    remediation_scene: stochastic-gradients.s4
    variants:
      - id: stochastic-gradients.transfer.1
        retired: true
        prompt: A minibatch step raises full-dataset loss. Is the implementation necessarily wrong?
        options:
          - id: a
            text: No; stochastic estimates can produce temporary increases
          - id: b
            text: Yes; every stochastic step must decrease every loss
          - id: c
            text: Only if the batch has one example
        answer: a
        feedback: A noisy gradient need not improve the complete objective at every step.
      - id: stochastic-gradients.transfer.2
        retired: true
        prompt: A batch reduction changes from mean to sum while rate stays fixed. What should be examined?
        options:
          - id: b
            text: Only the vocabulary size
          - id: c
            text: A guarantee that nothing changes
          - id: a
            text: The effective gradient and update scale
        answer: a
        feedback: Summing scales gradients with the contributing example count.
  - id: stochastic-gradients.base.v2
    objective_ref: objective.stochastic-gradients
    task: base
    response_type: numeric
    points: 1
    absolute_tolerance: 0.001
    hint: Average the per-example gradients in the minibatch (add them, divide by how many), then subtract learning rate × that average from the weight.
    remediation_scene: stochastic-gradients.s2
    variants:
      - id: stochastic-gradients.base.v2.1
        prompt: A minibatch of four examples has gradients 4, −2, 6, and 0 at weight 1.5. With learning rate 0.1, what is the new weight after one SGD step?
        answer: 1.3
        feedback: The average is (4 − 2 + 6 + 0) / 4 = 2, so the new weight is 1.5 − 0.1 × 2 = 1.3. Using the sum, 8, would give 0.7, a step four times too large.
      - id: stochastic-gradients.base.v2.2
        prompt: A minibatch of two examples has gradients 10 and 2 at weight 0. With learning rate 0.05, what is the new weight after one SGD step?
        answer: -0.3
        feedback: The average is (10 + 2) / 2 = 6, so the new weight is 0 − 0.05 × 6 = −0.3. Both gradients are positive, so the weight moves down.
      - id: stochastic-gradients.base.v2.3
        prompt: The bakery model predicts weight × boxes, and each order's gradient is 2 × boxes × (prediction − cost). At weight 2, a minibatch holds one order of 1 box costing $3 and one of 2 boxes costing $6. With learning rate 0.1, what is the new weight?
        answer: 2.5
        feedback: The gradients are 2 × 1 × (2 − 3) = −2 and 2 × 2 × (4 − 6) = −8, averaging −5. The new weight is 2 − 0.1 × (−5) = 2.5.
      - id: stochastic-gradients.base.v2.4
        prompt: A minibatch of three examples has gradients −3, −1, and −5 at weight 0.4. With learning rate 0.2, what is the new weight after one SGD step?
        answer: 1
        feedback: The average is −9 / 3 = −3, so the new weight is 0.4 − 0.2 × (−3) = 1. Subtracting a negative step moves the weight up.
  - id: stochastic-gradients.transfer.v2
    objective_ref: objective.stochastic-gradients
    task: transfer
    response_type: single_choice
    points: 1
    hint: Each minibatch gradient is a random estimate of the full-data gradient. Ask whether the batches are representative, whether sums and means are mixed up, and what each run has actually seen.
    remediation_scene: stochastic-gradients.s3
    variants:
      - id: stochastic-gradients.transfer.v2.1
        prompt: With batch size 8, the per-step training loss jumps up and down, sometimes rising for a few steps. Measured once per epoch on the full dataset, the loss falls steadily. What is the best explanation?
        options:
          - id: c
            text: The learning rate is too large, so training is diverging
          - id: a
            text: Small batches give noisy estimates, so some steps go uphill
          - id: b
            text: The gradient code has a bug that shows up on some batches
        answer: a
        feedback: Each step follows a noisy estimate from 8 examples, so individual steps can raise the loss while the overall trend improves. Divergence would make the full-dataset loss grow, not fall steadily.
      - id: stochastic-gradients.transfer.v2.2
        prompt: A sales dataset is stored sorted by region, and training reads batches in that order. The weights lurch in a new direction each time a new region starts. Which change targets the cause?
        options:
          - id: b
            text: Use a smaller batch so each step sees fewer examples
          - id: c
            text: Raise the learning rate so each region is learned faster
          - id: a
            text: Shuffle the data so every batch mixes all the regions
        answer: a
        feedback: Sorted batches are lopsided samples, so each one pulls toward its own region. Shuffling makes every batch a fair sample. Smaller batches or bigger steps would make the lurching worse, not better.
      - id: stochastic-gradients.transfer.v2.3
        prompt: A team switches its loss from the batch mean to the batch sum, keeping batch size 64 and the same learning rate. Training now blows up. Why?
        options:
          - id: c
            text: Summing moves the minimum to a different weight
          - id: b
            text: The gradient, and so each step, is now 64 times bigger
          - id: a
            text: Summing drops information that the mean had kept
        answer: b
        feedback: The sum is 64 times the mean, so its gradient and every step grow 64-fold at the same rate. The best weight for the sum and the mean is the same point; only the scale of the steps changed.
      - id: stochastic-gradients.transfer.v2.4
        prompt: After 1,000 steps each, a run with batch 512 has lower loss than a run with batch 32. A teammate concludes that batch 512 learns more efficiently. What's the problem with that comparison?
        options:
          - id: a
            text: The 512 run saw 16 times as many examples by that point
          - id: b
            text: The 32 run's loss is too noisy to compare at any point
          - id: c
            text: Larger batches reach lower loss for every model and task
        answer: a
        feedback: Equal steps isn't equal work. Compare at equal examples seen or equal compute time. Noise can be averaged out, and no batch size wins for every model and task.
      - id: stochastic-gradients.transfer.v2.5
        prompt: A batch is split into microbatches of 6 examples (mean gradient 2) and 2 examples (mean gradient 10). The code averages the two means and gets 6. What should the accumulated gradient be?
        options:
          - id: b
            text: 6, since each microbatch counts as one measurement
          - id: a
            text: 4, weighting each mean by its number of examples
          - id: c
            text: 16, adding the two totals and dividing by 2 pieces
        answer: a
        feedback: (6 × 2 + 2 × 10) / 8 = 32 / 8 = 4, so each example counts equally. Averaging the two means gives each of the 2 examples in the small microbatch twice its fair weight, and dividing the totals (12 and 20) by the 2 pieces instead of the 8 examples gives 16.
