lesson:
  id: stochastic-gradients
  version: 0.2.0-draft
  title: Learn from a sample of examples at each step
  state: draft
  summary: Use a small group of examples for an update and see how averaging and sampling change the step.
  slot: M10.3
  category: learning
  sources:
  - title: Dive into Deep Learning — authors’ open textbook
    url: https://d2l.ai/
objectives:
- id: objective.stochastic-gradients
  version: 1-draft
  statement: Full-batch, stochastic, and minibatch descent use different gradient estimates; batch construction,
    averaging, and learning rate affect noise, cost, and convergence behavior.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - stochastic-gradients.base
  - stochastic-gradients.transfer
  prerequisites:
  - anyOf:
    - objective.update-consequence
  - anyOf:
    - objective.random-variables
scenes:
- id: stochastic-gradients.s1
  title: A dataset objective averages examples
  type: explanation
  depth: intuition
  objective_refs:
  - objective.stochastic-gradients
  markdown: 'For equally weighted examples, the training objective often averages per-example losses. Its gradient
    is the average of their gradients. Full-batch descent computes that quantity over the entire dataset before
    each update. This can be costly when the dataset is large.


    A **batch** is a group of examples processed for a calculation. Full-batch uses the whole dataset; a **minibatch**
    uses a smaller group. **Stochastic** means randomness enters the procedure, usually through example selection.
    The usual name SGD, stochastic gradient descent, is also often used for minibatch updates.'
  text_mode: 'For equally weighted examples, the training objective often averages per-example losses. Its
    gradient is the average of their gradients. Full-batch descent computes that quantity over the entire dataset
    before each update. This can be costly when the dataset is large.


    A **batch** is a group of examples processed for a calculation. Full-batch uses the whole dataset; a **minibatch**
    uses a smaller group. **Stochastic** means randomness enters the procedure, usually through example selection.
    The usual name SGD, stochastic gradient descent, is also often used for minibatch updates.'
  bridges: []
- id: stochastic-gradients.s2
  title: Use a minibatch estimate
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.stochastic-gradients
  markdown: A minibatch computes the average over a selected subset. If two example gradients are 2 and 6,
    their mean is 4. With current weight 1 and learning rate 0.1, the descent update is 1 − 0.1 × 4 = 0.6.
    Summing instead of averaging changes the effective step scale.
  text_mode: A minibatch computes the average over a selected subset. If two example gradients are 2 and 6,
    their mean is 4. With current weight 1 and learning rate 0.1, the descent update is 1 − 0.1 × 4 = 0.6.
    Summing instead of averaging changes the effective step scale.
  bridges:
  - random-variables
- id: stochastic-gradients.s3
  title: Noise is tied to sampling
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.stochastic-gradients
  markdown: Representative random batches can provide useful estimates of the dataset gradient. Correlated
    or systematically selected batches can behave differently. A stochastic step may increase full-dataset
    loss even when the method improves it over time. Batch size also affects hardware efficiency, memory, and
    update frequency.
  text_mode: Representative random batches can provide useful estimates of the dataset gradient. Correlated
    or systematically selected batches can behave differently. A stochastic step may increase full-dataset
    loss even when the method improves it over time. Batch size also affects hardware efficiency, memory, and
    update frequency.
  bridges: []
- id: stochastic-gradients.s4
  title: Compare work and progress fairly
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.stochastic-gradients
  markdown: 'Count examples or tokens processed, optimizer updates, elapsed time, and validation behavior.
    Gradient accumulation can combine microbatches before an update, but correct weighting and reduction matter.
    Equal effective batch sizes do not guarantee identical runs when stochastic layers, normalization, ordering,
    or numerical precision differ.


    A **microbatch** is a smaller piece processed before one combined update. Suppose one piece has 2 examples
    with mean gradient 3 and another has 6 with mean gradient 5. The combined mean is (2 × 3 + 6 × 5)/8 = 4.5,
    not the unweighted average 4. Each example should receive the intended weight regardless of how memory
    constraints divide the batch.'
  text_mode: 'Count examples or tokens processed, optimizer updates, elapsed time, and validation behavior.
    Gradient accumulation can combine microbatches before an update, but correct weighting and reduction matter.
    Equal effective batch sizes do not guarantee identical runs when stochastic layers, normalization, ordering,
    or numerical precision differ.


    A **microbatch** is a smaller piece processed before one combined update. Suppose one piece has 2 examples
