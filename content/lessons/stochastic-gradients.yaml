assessment_families:
- id: stochastic-gradients.base
  objective_ref: objective.stochastic-gradients
  task: base
  response_type: single_choice
  points: 1
  hint: 'Use a minibatch estimate: trace the inputs, operation, and result before choosing.'
  remediation_scene: stochastic-gradients.s2
  variants:
  - id: stochastic-gradients.base.1
    prompt: Gradients 3 and 7 are averaged. What gradient is used?
    options:
    - id: c
      text: '4'
    - id: a
      text: '5'
    - id: b
      text: '10'
    answer: a
    feedback: The arithmetic mean is (3 + 7)/2.
  - id: stochastic-gradients.base.2
    prompt: 'Weight 2, average gradient 5, rate 0.1: new weight?'
    options:
    - id: a
      text: '1.5'
    - id: b
      text: '2.5'
    - id: c
      text: '0.5'
    answer: a
    feedback: Subtract the rate-scaled gradient.
- id: stochastic-gradients.transfer
  objective_ref: objective.stochastic-gradients
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Compare work and progress fairly: trace the inputs, operation, and result before choosing.'
  remediation_scene: stochastic-gradients.s4
  variants:
  - id: stochastic-gradients.transfer.1
    prompt: A minibatch step raises full-dataset loss. Is the implementation necessarily wrong?
    options:
    - id: a
      text: No; stochastic estimates can produce temporary increases
    - id: b
      text: Yes; every stochastic step must decrease every loss
    - id: c
      text: Only if the batch has one example
    answer: a
    feedback: A noisy gradient need not improve the complete objective at every step.
  - id: stochastic-gradients.transfer.2
    prompt: A batch reduction changes from mean to sum while rate stays fixed. What should be examined?
    options:
    - id: b
      text: Only the vocabulary size
    - id: c
      text: A guarantee that nothing changes
    - id: a
      text: The effective gradient and update scale
    answer: a
    feedback: Summing scales gradients with the contributing example count.
