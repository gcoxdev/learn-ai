schema_version: 0.2-draft
lesson:
  id: stochastic-gradients
  version: 0.3.0-draft
  title: Learn from a sample of examples at each step
  state: draft
  summary: Why read a million examples to take one step when thirty-two will do? See how random minibatches make training fast, noisy, and still accurate.
  slot: M10.3
  category: learning
  sources:
    - title: Dive into Deep Learning — authors’ open textbook
      url: https://d2l.ai/
    - title: A Stochastic Approximation Method (Robbins & Monro, 1951)
      url: https://doi.org/10.1214/aoms/1177729586
objectives:
  - id: objective.stochastic-gradients
    version: 2-draft
    statement: Full-batch, stochastic, and minibatch descent use different gradient estimates; batch construction, averaging, and learning rate affect noise, cost, and convergence behavior.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - stochastic-gradients.base.v2
      - stochastic-gradients.transfer.v2
    prerequisites:
      - anyOf:
          - objective.update-consequence
      - anyOf:
          - objective.random-variables
scenes:
  - id: stochastic-gradients.s1
    title: A million orders, one step
    type: explanation
    depth: intuition
    objective_refs:
      - objective.stochastic-gradients
    markdown: |-
      The bakery model now learns its price per box from a whole year of orders, a million of them. In the module's first lesson, the gradient for many examples was the *average* of their gradients. Taken literally, one step of gradient descent means computing a million gradients, averaging them, and moving the weight once. Then doing it all again for the next step.

      A pollster doesn't ask every voter; a few thousand chosen at random give a good estimate. Training does the same. Each step, pick a small random group of examples, average *their* gradients, and step. That small group is a **minibatch**, and the number of examples in it is the **batch size**, often 32 to a few thousand.

      | Method | Examples per step | Each step's gradient |
      | --- | --- | --- |
      | Full-batch gradient descent | All of them | Exact, but slow to compute |
      | Minibatch SGD | A random handful | A noisy estimate, cheap |
      | "Pure" SGD | One | Very noisy, cheapest |

      Using random samples is what makes it **stochastic gradient descent (SGD)**; *stochastic* means "involving chance." In practice, "SGD" almost always means the minibatch version. One pass through the whole training set is called an **epoch**.

      :::story Where the idea comes from
      In 1951, Herbert Robbins and Sutton Monro published "A Stochastic Approximation Method." They showed how to home in on a target using only noisy measurements: step in the direction each measurement suggests, and shrink the step size over time at the right rate. They weren't thinking about neural networks, but today's SGD is a direct descendant of their method.
      :::
  - id: stochastic-gradients.s2
    title: Average the batch, then step
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.stochastic-gradients
    markdown: |-
      Suppose a minibatch holds two orders, and their gradients at the current weight are 2 and 6. The minibatch gradient is their average, (2 + 6) / 2 = 4. With current weight 1 and learning rate 0.1, the update is the same rule as before:

      new weight = 1 − 0.1 × 4 = **0.6**

      :::papers Minibatch SGD in standard notation
      At step $t$, draw a random minibatch $\mathcal{B}_t$ of $B$ examples and compute

      $$g_t = \frac{1}{B}\sum_{i \in \mathcal{B}_t} \nabla \ell_i(w_t), \qquad w_{t+1} = w_t - \eta\, g_t$$

      Here $\ell_i$ is the loss on example $i$ and $g_t$ is the minibatch gradient. In our numbers, $B = 2$, the two gradients are 2 and 6, $g_t = 4$, $\eta = 0.1$, and $w_{t+1} = 0.6$. Because the batch is drawn at random, $g_t$ is on average equal to the full-dataset gradient. Statisticians call that an *unbiased* estimate.
      :::

      :::predict A colleague's code *adds* the batch's gradients instead of averaging them. With the same two orders, where does the weight land?
      The sum is 2 + 6 = 8, so the step is 0.1 × 8 = 0.8 and the weight lands at 0.2 instead of 0.6. The step is twice as big, and with a batch of 64 it would be 64 times as big. Averaging keeps the step size the same whatever the batch size. With summing, the learning rate has to shrink whenever the batch grows.
      :::
  - id: stochastic-gradients.s3
    title: Smaller batches, noisier steps
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.stochastic-gradients
    markdown: |-
      How noisy is a minibatch estimate? The program below makes 1,000 bakery orders at about \$3 a box, then measures the gradient at weight 2 from 500 different random batches of each size:

      ```python run
      import numpy as np

      rng = np.random.default_rng(0)
      boxes = rng.integers(1, 6, size=1000)              # 1000 orders of 1-5 boxes
      cost = 3 * boxes + rng.normal(0, 1, size=1000)     # about $3 a box, plus noise

      def grad(w, idx):
          x, y = boxes[idx], cost[idx]
          return np.mean(2 * x * (w * x - y))            # average over the batch

      w = 2.0
      print("full-batch gradient at w=2:", round(grad(w, np.arange(1000)), 2))
      for B in [1, 10, 100]:
          g = [grad(w, rng.choice(1000, size=B, replace=False)) for _ in range(500)]
          print(f"batch {B:3d}: mean {np.mean(g):7.2f}   spread (std) {np.std(g):6.2f}")

      for B in [1, 1000]:                                # 200 steps, rate 0.01
          w = 0.0
          for step in range(200):
              w -= 0.01 * grad(w, rng.choice(1000, size=B, replace=False))
          print(f"batch {B:4d}: weight after 200 steps = {w:.3f}")
      ```

      Every batch size is right *on average*: the means all sit near the full-batch −22.86. What changes is the spread, the **standard deviation** of the estimates: 18.55, then 5.85, then 1.80. Each tenfold increase in batch size shrinks it by about √10 ≈ 3.2. That's the familiar statistics rule: noise falls with the square root of the sample size.

      Now look at the last two lines. After 200 steps, single-example SGD reached weight 3.064 and full-batch descent reached 3.004. Full batch is a little closer, but it computed 200,000 example gradients to get there; SGD computed 200. Try changing `[1, 1000]` to `[1, 10, 1000]`.

      :::mixup "Noisy gradients are a flaw, so always use the biggest batch that fits in memory."
      Past a point, a bigger batch buys a slightly better direction at a much higher price per step. For the same amount of computation, many cheap noisy steps usually make more progress than a few exact ones. Hardware sets the other side: GPUs process a batch in parallel, so very small batches waste them. Practitioners pick a batch size that keeps the hardware busy, then tune the learning rate for it.
      :::

      **Shuffle** the data before splitting it into batches. If the orders are sorted, say all one-box orders first, each batch shows a lopsided slice, and the weight lurches in a new direction every time the slice changes.
  - id: stochastic-gradients.s4
    title: Big batches in small pieces
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.stochastic-gradients
    markdown: |-
      Sometimes the batch you want doesn't fit in memory. You can split it into smaller pieces called **microbatches**, compute each one's gradient, and combine them before taking a single step. This is **gradient accumulation**. Done right, it gives exactly the gradient of the full batch.

      "Done right" hides a trap. Suppose one microbatch has 2 examples with mean gradient 3, and another has 6 examples with mean gradient 5. Each example should count equally, so weight each mean by its size:

      $$\frac{2 \times 3 + 6 \times 5}{8} = \frac{36}{8} = 4.5$$

      Averaging the two means as if they were equal gives 4, which silently over-counts the two examples in the small microbatch. This bug is common when the last microbatch of an epoch is smaller than the rest.

      When you compare two runs with different batch sizes, compare them after the same number of *examples seen* (or the same compute time), not the same number of steps. A run with batch 512 has seen 16 times as many examples after 1,000 steps as a run with batch 32.
  - id: stochastic-gradients.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.stochastic-gradients
    markdown: Take minibatch steps by hand, then explain a jagged loss curve, an unshuffled dataset, a sum-versus-mean bug, and an unfair batch-size comparison.
    takeaway: |-
      A minibatch gives a cheaper, noisy estimate of the dataset gradient. How you sample and average examples affects both that estimate and the size of the update.
  - id: stochastic-gradients.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.stochastic-gradients
    markdown: |-
      A minibatch gives a cheaper, noisy estimate of the dataset gradient. How you sample and average examples affects both that estimate and the size of the update.
