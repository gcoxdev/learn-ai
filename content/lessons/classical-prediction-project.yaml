  - id: classical-prediction-project.base.v2
    objective_ref: objective.classical-prediction-project
    task: base
    response_type: single_choice
    points: 1
    hint: 'For each step, ask what the model would really know at prediction time, and whether the test rows have influenced any choice.'
    remediation_scene: classical-prediction-project.s3
    variants:
      - id: classical-prediction-project.base.v2.1
        prompt: A classmate adds fee_charged to the no-show model, and March accuracy jumps from 0.85 to 1.00. What explains the jump?
        options:
          - id: b
            text: The fee is a strong real signal, so the model improved
          - id: a
            text: The fee is charged after a no-show, so it leaks the label
          - id: c
            text: March happened to be an easier month than January or February
        answer: a
        feedback: The fee is recorded after the appointment is missed, so it isn't available when the reminder calls are made. It's a copy of the answer, not a signal. An easier month wouldn't produce a perfect score with one huge weight.
      - id: classical-prediction-project.base.v2.2
        prompt: You standardize lead_days before fitting logistic regression. Which mean and standard deviation should you use for the March rows?
        options:
          - id: c
            text: March's own, since those are the rows being predicted
          - id: b
            text: All 60 rows', since more data gives better estimates
          - id: a
            text: The 40 training rows', applied unchanged to March
        answer: a
        feedback: Scaling is a learned step, so it's fitted on training data and then applied to test data. Using all 60 rows or March's own statistics lets test information shape the model, a quiet form of leakage.
      - id: classical-prediction-project.base.v2.3
        prompt: Amara wants to know how the model will do on next month's appointments. Which split answers that?
        options:
          - id: a
            text: Train on January and February, test on March
          - id: b
            text: Shuffle the 60 rows and hold out a random 20
          - id: c
            text: Train on the 60 rows and test on March for more data
        answer: a
        feedback: A time split mirrors real use, where the model only ever sees the past. A shuffled split mixes March into training, and training on all 60 rows puts the test rows in the training set.
      - id: classical-prediction-project.base.v2.4
        prompt: After scoring March, a teammate changes the cutoff from 0.5 to 0.4 because it gets 18 of 20 right, and reports 90%. What is the problem?
        options:
          - id: c
            text: Cutoffs aren't learned weights, so the report is fine
          - id: a
            text: March chose the cutoff, so 90% is an optimistic estimate
          - id: b
            text: A lower cutoff lowers precision, so 90% is miscounted
        answer: a
        feedback: Any choice made by looking at the test rows turns them into a second validation set, and the winning score is flattered by luck. Fix the cutoff in advance or choose it on a validation month. The count of 18 may be right; what it measures is the problem.
      - id: classical-prediction-project.base.v2.5
        prompt: Why report the everyone-shows baseline when it flags no no-shows at all?
        options:
          - id: b
            text: It is the strongest baseline, so it is the one to beat
          - id: c
            text: It checks that no-shows are rare enough to model at all
          - id: a
            text: It shows the accuracy you get for free, about 65% here
        answer: a
        feedback: A model's accuracy only means something next to what doing nothing scores. Here that's 65%, so 85% is a 20-point gain, not 85 points. It isn't the strongest baseline; the rule of thumb scores 75%.
  - id: classical-prediction-project.calculate
    objective_ref: objective.classical-prediction-project
    task: base
    response_type: numeric
    points: 1
    hint: 'Build the four counts first (true positives, false positives, false negatives, true negatives), then divide by the right total: all rows for accuracy, real no-shows for recall, flagged rows for precision.'
    remediation_scene: classical-prediction-project.errors
    absolute_tolerance: 0.005
    variants:
      - id: classical-prediction-project.calculate.1
        prompt: March has 20 appointments and 7 no-shows. A model flags 6 appointments, and 5 of them really are no-shows. What is its recall on no-shows? Give a decimal to three places.
        answer: 0.714
        feedback: Recall divides caught no-shows by all real no-shows, 5 / 7 ≈ 0.714. Dividing by the 6 flagged would give precision (0.833) instead.
      - id: classical-prediction-project.calculate.2
        prompt: A rule flags 10 of 24 appointments, and 6 of the flagged ones really are no-shows. What is its precision? Give a decimal.
        answer: 0.6
        feedback: Precision divides true no-shows among the flags by all flags, 6 / 10 = 0.6. The number of appointments overall doesn't enter it.
      - id: classical-prediction-project.calculate.3
        prompt: Of 20 appointments, 7 are no-shows. A model flags 8, and 6 of those are real no-shows. What is its accuracy? Give a decimal.
        answer: 0.85
        feedback: 'True positives 6, false positives 2, false negatives 1, so true negatives are 20 − 6 − 2 − 1 = 11. Accuracy is (6 + 11) / 20 = 0.85.'
      - id: classical-prediction-project.calculate.4
        prompt: Of 25 test appointments, 8 are no-shows. What accuracy does the everyone-shows baseline score? Give a decimal.
        answer: 0.68
        feedback: Predicting "shows up" for everyone is right on the 17 who came, 17 / 25 = 0.68. That is the accuracy any model has to beat.
      - id: classical-prediction-project.calculate.5
        prompt: Of 30 appointments, 10 are no-shows. A model flags 9, and 6 of those are real no-shows. What is its recall? Give a decimal.
        answer: 0.6
        feedback: Recall is caught no-shows over real no-shows, 6 / 10 = 0.6. The 3 wrong flags lower precision, not recall.
  - id: classical-prediction-project.transfer.v2
    objective_ref: objective.classical-prediction-project
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Match the split to the question being asked, check each column against the moment of prediction, and read an interval as a range of plausible gains.'
    remediation_scene: classical-prediction-project.mistakes
    variants:
      - id: classical-prediction-project.transfer.v2.1
        prompt: A gym has three years of monthly records for each member and wants to predict who will cancel next month. Which test answers that question?
        options:
          - id: b
            text: Hold out a random 20% of member-months
          - id: c
            text: Hold out every member whose name starts with A to D
          - id: a
            text: Train on earlier months and test on the latest month
        answer: a
        feedback: '"Next month" is a forecast, so the test should be later in time than the training data. A random split lets the model learn from the future; holding out whole members answers a different question, how it does on brand-new members.'
      - id: classical-prediction-project.transfer.v2.2
        prompt: 'A model scores 18/20 on test rows and a baseline 15/20. The paired bootstrap 95% interval for the gain is −0.05 to 0.35. Which report is accurate?'
        options:
          - id: a
            text: The model looks better, but the gain could be near zero
          - id: b
            text: The model is 15 points better than the baseline
          - id: c
            text: The model is no better, since the interval includes zero
        answer: a
        feedback: The interval says gains from slightly negative to 35 points all fit the data, so the honest report is "promising, not settled." Stating 15 points ignores the uncertainty; declaring no difference mistakes a lack of evidence for evidence of no gain.
      - id: classical-prediction-project.transfer.v2.3
        prompt: A loan-default model makes 12 test mistakes, and 9 involve applicants with under six months of credit history. What is the best next step?
        options:
          - id: c
            text: Remove short-history applicants from the test set
          - id: a
            text: Gather more short-history cases and check on fresh data
          - id: b
            text: Raise the cutoff until those 9 cases come out right
        answer: a
        feedback: Error analysis points to where the model is weak; the fix is more data or a better feature for that group, checked on new data. Removing the group hides the problem, and tuning the cutoff on the test set turns it into a validation set.
      - id: classical-prediction-project.transfer.v2.4
        prompt: A rule catches all 7 no-shows but flags 12 appointments. A model catches 5 and flags 6. The front desk can make about 6 calls a day. Which is more useful, and why?
        options:
          - id: b
            text: The rule, because its recall is a perfect 1.00
          - id: a
            text: The model, because it catches more within 6 calls
          - id: c
            text: The model, because its test accuracy is higher
        answer: a
        feedback: With 6 calls, the rule can't be followed in full, while the model uses the calls well. The decision rests on the call budget, not on recall alone or accuracy alone. With 12 calls a day the rule would win.
      - id: classical-prediction-project.transfer.v2.5
        prompt: An employee-attrition model reaches 99% test accuracy. Its strongest feature is "exit interview completed." What should you do?
        options:
          - id: a
            text: Drop the feature; it's only filled in after someone leaves
          - id: b
            text: Keep it, since it's the model's strongest predictor
          - id: c
            text: Keep it, but test on a larger held-out sample first
        answer: a
        feedback: An exit interview happens after the person has decided to leave, so the column leaks the label. A bigger test set would just confirm the leak with more digits. Ask of every column whether you'd know it at the moment of prediction.
