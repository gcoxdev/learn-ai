schema_version: 0.2-draft
lesson:
  id: classical-prediction-project
  version: 0.3.0-draft
  title: 'Project: compare a baseline with a learned predictor'
  state: draft
  summary: Compare a simple baseline and a learned rule using a tiny dataset you can inspect.
  slot: M36.2
  category: learning
  minutes: 40
  sources:
  - title: An Introduction to Statistical Learning — authors’ materials
    url: https://www.statlearning.com/
objectives:
- id: objective.classical-prediction-project
  version: 1-draft
  statement: Run a small prediction comparison with fixed data roles, transparent arithmetic, and an explicit
    limitation; evaluation quality matters more than presenting a complex model.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - classical-prediction-project.base
  - classical-prediction-project.transfer
  prerequisites:
  - anyOf:
    - objective.prediction
  - anyOf:
    - objective.splits-and-leakage
  - anyOf:
    - objective.baselines-and-success
scenes:
- id: classical-prediction-project.s1
  title: A complete no-code dataset
  type: explanation
  depth: intuition
  objective_refs:
  - objective.classical-prediction-project
  markdown: 'Use this fictional regression task on paper or a spreadsheet. Training pairs (x,y): (0,1), (1,3),
    (2,5). Validation: (3,6). Sealed test: (4,9), (5,10). Compare A, the training-mean predictor, with B, the
    line y=2x+1 suggested by the training pairs. Record the data roles before calculating; these tiny invented
    values do not support a real-world deployment claim.


    “Sealed” here means you promise not to use those rows to choose or adjust the predictor; the app does not
    hide the printed values. Cover them while doing the earlier steps if that helps. In a real study, keep
    final test data separate from model development. The validation row is for choosing; the test rows are
    for the later report.'
  text_mode: 'Use this fictional regression task on paper or a spreadsheet. Training pairs (x,y): (0,1), (1,3),
    (2,5). Validation: (3,6). Sealed test: (4,9), (5,10). Compare A, the training-mean predictor, with B, the
    line y=2x+1 suggested by the training pairs. Record the data roles before calculating; these tiny invented
    values do not support a real-world deployment claim.


    “Sealed” here means you promise not to use those rows to choose or adjust the predictor; the app does not
    hide the printed values. Cover them while doing the earlier steps if that helps. In a real study, keep
    final test data separate from model development. The validation row is for choosing; the test rows are
    for the later report.'
  bridges: []
- id: classical-prediction-project.s2
  title: Choose before testing
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.classical-prediction-project
  markdown: The training mean is 3, so A predicts 3 everywhere. On validation, A’s absolute error is |3−6|=3;
    B predicts 7, with error 1. Select B by this prespecified mean-absolute-error rule, then open the test
    rows. Do not tune the formula after observing the test. An optional Python script may reproduce the same
    arithmetic, with no libraries required.
  text_mode: The training mean is 3, so A predicts 3 everywhere. On validation, A’s absolute error is |3−6|=3;
    B predicts 7, with error 1. Select B by this prespecified mean-absolute-error rule, then open the test
    rows. Do not tune the formula after observing the test. An optional Python script may reproduce the same
    arithmetic, with no libraries required.
  bridges:
  - arithmetic
  - statistics-evidence
- id: classical-prediction-project.s3
  title: Compute a reference result
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.classical-prediction-project
  markdown: 'On test, B predicts 9 and 11, giving errors 0 and 1: mean absolute error 0.5. A gives errors 6
    and 7: mean 6.5. Report both, including the selected model and selection rule. Two test rows provide little
    evidence about new ranges, noise, or subgroups; a low error here is an arithmetic exercise, not a reliability
    certificate.'
  text_mode: 'On test, B predicts 9 and 11, giving errors 0 and 1: mean absolute error 0.5. A gives errors
    6 and 7: mean 6.5. Report both, including the selected model and selection rule. Two test rows provide
    little evidence about new ranges, noise, or subgroups; a low error here is an arithmetic exercise, not
    a reliability certificate.'
  bridges: []
- id: classical-prediction-project.s4
  title: Save and review your report
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.classical-prediction-project
  markdown: 'Save the split table, predictions, error calculations, selection decision, and two limitations.
    For a classification extension, define a positive label and calculate a confusion matrix before choosing
    a metric. Review four criteria: no leakage, reproducible calculations, fair baseline, and bounded claims,
    scoring each 0–2. The browser checks your understanding; it does not inspect or grade your saved report.'
  text_mode: 'Save the split table, predictions, error calculations, selection decision, and two limitations.
    For a classification extension, define a positive label and calculate a confusion matrix before choosing
    a metric. Review four criteria: no leakage, reproducible calculations, fair baseline, and bounded claims,
    scoring each 0–2. The browser checks your understanding; it does not inspect or grade your saved report.'
  bridges: []
- id: classical-prediction-project.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.classical-prediction-project
  markdown: Try these questions to check the ideas behind your project. Use the lesson’s rubric for self or
    peer review of your work; the app does not grade the project artifact.
  text_mode: Try these questions to check the ideas behind your project. Use the lesson’s rubric for self or
    peer review of your work; the app does not grade the project artifact.
  takeaway: Fix the data roles and comparison rule, compute both models’ errors, and report what the small
    example can and cannot show.
- id: classical-prediction-project.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.classical-prediction-project
  markdown: Fix the data roles and comparison rule, compute both models’ errors, and report what the small
    example can and cannot show.
  text_mode: Fix the data roles and comparison rule, compute both models’ errors, and report what the small
    example can and cannot show.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - classical-prediction-project.s1
    - classical-prediction-project.s2
    - classical-prediction-project.s3
    - classical-prediction-project.s4
    - classical-prediction-project.check
    gate_refs:
    - gate.core
  scene_aliases:
    classical-prediction-project.recap: classical-prediction-project.check
assessment_families:
- id: classical-prediction-project.base
  objective_ref: objective.classical-prediction-project
  task: base
  response_type: single_choice
  points: 1
  hint: 'Choose before testing: trace the inputs, operation, and result before choosing.'
  remediation_scene: classical-prediction-project.s2
  variants:
  - id: classical-prediction-project.base.1
    prompt: What is the training-mean prediction for the supplied training set?
    options:
    - id: b
      text: '5'
    - id: c
      text: '6'
    - id: a
      text: '3'
    answer: a
    feedback: The mean of 1, 3, and 5 is 3.
  - id: classical-prediction-project.base.2
    prompt: Which candidate has lower validation absolute error?
    options:
    - id: c
      text: They tie at 3
    - id: a
      text: B, with error 1
    - id: b
      text: A, with error 1
    answer: a
    feedback: B predicts 7 for x=3 against target 6.
- id: classical-prediction-project.transfer
  objective_ref: objective.classical-prediction-project
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Submit a small report to yourself: trace the inputs, operation, and result before choosing.'
  remediation_scene: classical-prediction-project.s4
  variants:
  - id: classical-prediction-project.transfer.1
    prompt: What is B’s test mean absolute error?
    options:
    - id: c
      text: '6.5'
    - id: a
      text: '0.5'
    - id: b
      text: '1.5'
    answer: a
    feedback: Its errors are 0 and 1, whose mean is 0.5.
  - id: classical-prediction-project.transfer.2
    prompt: Can you tune B on the test rows and still call them untouched test data?
    options:
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    - id: c
      text: Only with a simple line
    answer: a
    feedback: Selection based on test results uses the held-out evidence.
