scenes:
- id: neural-forward-pass.s1
  title: Each layer transforms a representation
  type: explanation
  depth: intuition
  objective_refs:
  - objective.neural-forward-pass
  markdown: A dense layer multiplies inputs by weights, adds a bias, and may apply an activation. Later layers receive
    the resulting features. The forward pass computes these values for current parameters. It does not itself decide
    how parameters should change; a loss and differentiation procedure supply that learning connection.
  text_mode: A dense layer multiplies inputs by weights, adds a bias, and may apply an activation. Later layers
    receive the resulting features. The forward pass computes these values for current parameters. It does not itself
    decide how parameters should change; a loss and differentiation procedure supply that learning connection.
  bridges: []
- id: neural-forward-pass.s2
  title: Calculate a two-unit layer
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.neural-forward-pass
  markdown: Input [2, 1] enters units with weights [1, −1] and [0, 2], both with zero bias. Their pre-activation
    values are 1 and 2. ReLU keeps both positive values, giving [1, 2]. A final weighted sum with weights [3, 1]
    predicts 5. Each intermediate can be checked by hand.
  text_mode: Input [2, 1] enters units with weights [1, −1] and [0, 2], both with zero bias. Their pre-activation
    values are 1 and 2. ReLU keeps both positive values, giving [1, 2]. A final weighted sum with weights [3, 1]
    predicts 5. Each intermediate can be checked by hand.
  bridges:
  - matrices-tensors
- id: neural-forward-pass.s3
  title: Add the target and loss
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.neural-forward-pass
  markdown: If the target is 7 and squared loss is (prediction − target)², this example contributes 4. For a batch,
    specify whether losses are summed, averaged over examples, or averaged over another unit such as valid tokens.
    The reduction changes gradient scale and should match the intended objective.
  text_mode: If the target is 7 and squared loss is (prediction − target)², this example contributes 4. For a batch,
    specify whether losses are summed, averaged over examples, or averaged over another unit such as valid tokens.
    The reduction changes gradient scale and should match the intended objective.
  bridges: []
- id: neural-forward-pass.s4
  title: Trace shapes as well as numbers
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.neural-forward-pass
  markdown: A batch [B, input_features] becomes [B, hidden_features] and then [B, outputs] in this row-oriented
    convention. B is batch size. Preserve the pairing between predictions and targets. A forward trace is a foundation
    for gradient checking, architecture comparison, and inference debugging.
  text_mode: A batch [B, input_features] becomes [B, hidden_features] and then [B, outputs] in this row-oriented
    convention. B is batch size. Preserve the pairing between predictions and targets. A forward trace is a foundation
    for gradient checking, architecture comparison, and inference debugging.
  bridges: []
