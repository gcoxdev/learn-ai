schema_version: 0.2-draft
lesson:
  id: neural-forward-pass
  version: 0.2.2-draft
  title: Trace inputs through layers to a loss
  state: draft
  summary: 'Trace a two-layer machine on paper: every intermediate number has a job before the final prediction
    appears.'
  slot: M11.3
  category: learning
  sources:
  - title: Dive into Deep Learning — forward/backward computation
    url: https://d2l.ai/chapter_multilayer-perceptrons/backprop.html
  - title: Dive into Deep Learning — multilayer perceptrons
    url: https://d2l.ai/chapter_multilayer-perceptrons/mlp.html
  archetype: mechanism
objectives:
- id: objective.neural-forward-pass
  version: 2-draft
  statement: Calculate hidden pre-activations, ReLU outputs, and a second-layer prediction with fixed weights.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - neural-forward-pass.base.v2
  - neural-forward-pass.transfer.v2
  prerequisites:
  - anyOf:
    - objective.neurons
  - anyOf:
    - objective.nonlinearity
  - anyOf:
    - objective.matrices-tensors
scenes:
- id: neural-forward-pass.s1
  type: explanation
  depth: intuition
  objective_refs:
  - objective.neural-forward-pass
  title: Pass a message through two small machines
  markdown: |
    A **forward pass** calculates a model’s output from its inputs using the current weights and biases. A layered
    drawing helps us follow that calculation: circles hold values, and connections carry values multiplied by weights.
    The input layer holds the supplied numbers. A **hidden layer** is an intermediate stage, and the output layer
    holds the final result. Hidden does not mean mystical or secret; we can inspect every number in a small network.

    Explore the familiar circles-and-connections view below. This illustration has two inputs, two hidden layers,
    and one output. The next slides use a smaller example with one input and one hidden layer so we can work through
    each calculation by hand. Both follow the same idea: combine incoming values, apply the unit’s rule, and pass
    the result onward. During a forward pass, the weights and biases stay fixed.
  text_mode: |
    A **forward pass** calculates a model’s output from its inputs using the current weights and biases. A layered
    drawing helps us follow that calculation: circles hold values, and connections carry values multiplied by weights.
    The input layer holds the supplied numbers. A **hidden layer** is an intermediate stage, and the output layer
    holds the final result. Hidden does not mean mystical or secret; we can inspect every number in a small network.

    Explore the familiar circles-and-connections view below. This illustration has two inputs, two hidden layers,
    and one output. The next slides use a smaller example with one input and one hidden layer so we can work through
    each calculation by hand. Both follow the same idea: combine incoming values, apply the unit’s rule, and pass
    the result onward. During a forward pass, the weights and biases stay fixed.
  bridges:
  - neurons
  figure:
    kind: network-layers
    caption: Follow the values from left to right. Select a circle to inspect its incoming connections and calculation.
    description: Two input values feed three units in the first hidden layer, then two in the second hidden layer,
      and finally one output. Each non-input unit combines weighted incoming values and a bias. Hidden units apply
      ReLU. The controls reveal each layer and expose the same calculations in text.
- id: neural-forward-pass.s2
  type: explanation
  depth: intuition
  objective_refs:
  - objective.neural-forward-pass
  title: Give every arrow a number
  markdown: 'Our input is x=2. The first hidden unit uses h₁=max(0,2x−1); the second uses h₂=max(0,−x+3). The max
    rule is ReLU: keep a positive combined value and replace a negative value with zero. First calculate the values
    before ReLU, called **pre-activations**. They are 2×2−1=3 and −2+3=1. Then apply ReLU to get hidden activations
    h₁=3 and h₂=1. Do not discard the intermediate values; they help locate mistakes.'
  text_mode: 'Our input is x=2. The first hidden unit uses h₁=max(0,2x−1); the second uses h₂=max(0,−x+3). The max
    rule is ReLU: keep a positive combined value and replace a negative value with zero. First calculate the values
    before ReLU, called **pre-activations**. They are 2×2−1=3 and −2+3=1. Then apply ReLU to get hidden activations
    h₁=3 and h₂=1. Do not discard the intermediate values; they help locate mistakes.'
  bridges:
  - arithmetic
  - functions
- id: neural-forward-pass.s3
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.neural-forward-pass
  title: Combine the hidden clues
  markdown: The output rule is y=h₁+2h₂+1. Substitute the hidden values to get y=3+2×1+1=6. The output layer in
    this example has no final ReLU; its specified rule ends with the added bias. A different architecture could
    choose a different final operation. The calculation is completely determined by the input and settings. Calling
    6 a prediction does not establish whether 6 is useful; a task and a target are needed to judge it.
  text_mode: The output rule is y=h₁+2h₂+1. Substitute the hidden values to get y=3+2×1+1=6. The output layer in
    this example has no final ReLU; its specified rule ends with the added bias. A different architecture could
    choose a different final operation. The calculation is completely determined by the input and settings. Calling
    6 a prediction does not establish whether 6 is useful; a task and a target are needed to judge it.
  bridges: []
  figure:
    kind: neural-network
    caption: Each highlighted connection carries a value. Follow the sums before interpreting the final answer.
    description: The fixture uses h1=max(0,2x−1), h2=max(0,−x+3), and y=h1+2h2+1. At x=2, the hidden outputs are
      3 and 1 and the final output is 6. Changing x leaves the weights and biases fixed.
- id: neural-forward-pass.s4
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.neural-forward-pass
  title: Change the input while keeping the model fixed
  markdown: 'Try x=4. The hidden pre-activations are 7 and −1. ReLU turns them into 7 and 0, so the output is 7+2×0+1=8.
    Notice that the second unit contributes for x=2 but not for x=4. No learning occurred between these examples:
    the same parameters produced different activations because the input changed. This distinction separates stored
    model state from temporary values computed for one example.'
  text_mode: 'Try x=4. The hidden pre-activations are 7 and −1. ReLU turns them into 7 and 0, so the output is 7+2×0+1=8.
    Notice that the second unit contributes for x=2 but not for x=4. No learning occurred between these examples:
    the same parameters produced different activations because the input changed. This distinction separates stored
    model state from temporary values computed for one example.'
  bridges: []
- id: neural-forward-pass.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.neural-forward-pass
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: 'A forward pass computes values using fixed settings: combine, activate, pass onward. It does not update
    the settings.'
- id: neural-forward-pass.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.neural-forward-pass
  markdown: A forward pass applies parameterized transformations to a batch, preserving axis meanings and producing
    predictions whose loss is defined against the intended targets.
  text_mode: A forward pass applies parameterized transformations to a batch, preserving axis meanings and producing
    predictions whose loss is defined against the intended targets.
- id: neural-forward-pass.s5
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.neural-forward-pass
  title: Write the same computation in tables
  markdown: 'A matrix groups the weights for several units into a rectangular table. It is a compact way to perform
    the same multiply-and-add operations, not a different kind of reasoning. With two hidden units and one input,
    the first layer needs two input weights and two biases. The output needs two hidden-input weights and one bias:
    seven adjustable numbers in all. A batch can contain several inputs, each producing its own activations while
    sharing those seven parameters.'
  text_mode: 'A matrix groups the weights for several units into a rectangular table. It is a compact way to perform
    the same multiply-and-add operations, not a different kind of reasoning. With two hidden units and one input,
    the first layer needs two input weights and two biases. The output needs two hidden-input weights and one bias:
    seven adjustable numbers in all. A batch can contain several inputs, each producing its own activations while
    sharing those seven parameters.'
  bridges:
  - matrices-tensors
- id: neural-forward-pass.s6
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.neural-forward-pass
  title: Debug from the first wrong number
  markdown: Keep a trace with input, pre-activations, hidden activations, and output. If the final value is wrong,
    compare intermediate values from left to right. A sign error before ReLU can switch a contribution off; adding
    the output bias twice shifts the answer. Once a forward pass is understood, training adds a target, a loss,
    gradient calculations, and an update. The memory cue “combine, activate, pass” describes the forward computation
    without mixing in those later jobs.
  text_mode: Keep a trace with input, pre-activations, hidden activations, and output. If the final value is wrong,
    compare intermediate values from left to right. A sign error before ReLU can switch a contribution off; adding
    the output bias twice shifts the answer. Once a forward pass is understood, training adds a target, a loss,
    gradient calculations, and an update. The memory cue “combine, activate, pass” describes the forward computation
    without mixing in those later jobs.
  bridges: []
- id: neural-forward-pass.s7
  type: question
  depth: mechanics
  objective_refs:
  - objective.neural-forward-pass
  title: Find the switched-off clue
  markdown: With x=4, the second hidden pre-activation is −1. What value should enter the output rule from that
    hidden unit?
  text_mode: With x=4, the second hidden pre-activation is −1. What value should enter the output rule from that
    hidden unit?
  bridges: []
  question:
    response_type: single_choice
    options:
    - id: a
      text: '0'
    - id: b
      text: −1
    - id: c
      text: '1'
    answer: a
    reveal_markdown: ReLU replaces the negative pre-activation with zero. It does not pass it through or take its
      absolute value.
    hint: Trace the example using the rule from the preceding pages.
    id: neural-forward-pass.practice.v2.7
