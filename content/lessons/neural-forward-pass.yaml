schema_version: 0.2-draft
lesson:
  id: neural-forward-pass
  version: 0.1.0-draft
  title: Trace inputs through layers to a loss
  state: draft
  summary: A forward pass applies parameterized transformations to a batch, preserving axis meanings and producing
    predictions whose loss is defined against the intended targets.
  slot: M11.3
  category: learning
  minutes: 12
  sources:
  - title: Dive into Deep Learning — authors’ open textbook
    url: https://d2l.ai/
objectives:
- id: objective.neural-forward-pass
  version: 1-draft
  statement: A forward pass applies parameterized transformations to a batch, preserving axis meanings and producing
    predictions whose loss is defined against the intended targets.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - neural-forward-pass.base
  - neural-forward-pass.transfer
  prerequisites:
  - anyOf:
    - objective.neurons
  - anyOf:
