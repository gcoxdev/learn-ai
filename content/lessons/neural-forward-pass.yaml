assessment_families:
  - id: neural-forward-pass.base
    objective_ref: objective.neural-forward-pass
    task: base
    response_type: single_choice
    points: 1
    hint: 'Calculate a two-unit layer: trace the inputs, operation, and result before choosing.'
    remediation_scene: neural-forward-pass.s2
    variants:
      - id: neural-forward-pass.base.1
        prompt: Input [3, 1] dotted with weights [2, −1] and zero bias gives what?
        options:
          - id: c
            text: −1
          - id: a
            text: '5'
          - id: b
            text: '7'
        answer: a
        feedback: Compute 3 × 2 + 1 × (−1).
        retired: true
      - id: neural-forward-pass.base.2
        prompt: Prediction 4 and target 7 give what squared loss?
        options:
          - id: a
            text: '9'
          - id: b
            text: '3'
          - id: c
            text: '11'
        answer: a
        feedback: The residual is −3 and its square is 9.
        retired: true
  - id: neural-forward-pass.transfer
    objective_ref: objective.neural-forward-pass
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Trace shapes as well as numbers: trace the inputs, operation, and result before choosing.'
    remediation_scene: neural-forward-pass.s4
    variants:
      - id: neural-forward-pass.transfer.1
        prompt: A batch has 6 examples and the layer produces 4 outputs per example. Output shape?
        options:
          - id: a
            text: '[6, 4]'
          - id: b
            text: '[4, 6, 6]'
          - id: c
            text: '[24, 24]'
        answer: a
        feedback: Batch identity is retained while feature count changes.
        retired: true
      - id: neural-forward-pass.transfer.2
        prompt: The forward pass returns predictions but no optimizer runs. Have weights necessarily changed?
        options:
          - id: b
            text: Yes; every multiplication trains weights
          - id: c
            text: Only when an activation is nonlinear
          - id: a
            text: 'No'
        answer: a
        feedback: Forward computation uses current parameters; updates require a learning procedure.
        retired: true
  - id: neural-forward-pass.base.v2
    objective_ref: objective.neural-forward-pass
    task: base
    response_type: numeric_fields_with_reason
    points: 1
    hint: Compute each hidden pre-activation (2x − 1 and −x + 3), clip any negative one to 0 with ReLU, then put the two hidden values into y = h₁ + 2h₂ + 1.
    remediation_scene: neural-forward-pass.s2
    variants:
      - prompt: Use h₁=max(0,2x−1), h₂=max(0,−x+3), y=h₁+2h₂+1 at x=1. Record both hidden outputs and y.
        answers:
          h1: 1
          h2: 2
          y: 6
        reason_answer: a
        reason_options:
          - id: a
            text: Apply ReLU before combining hidden outputs.
          - id: b
            text: Add both pre-activations directly without ReLU.
          - id: c
            text: Apply ReLU to the weights before using the input.
        feedback: "Pre-activations are 2 × 1 − 1 = 1 and −1 + 3 = 2, both positive, so h₁ = 1 and h₂ = 2. Then y = 1 + 2 × 2 + 1 = 6."
        id: neural-forward-pass.base.v2.1
      - prompt: Use h₁=max(0,2x−1), h₂=max(0,−x+3), y=h₁+2h₂+1 at x=3. Record both hidden outputs and y.
        answers:
          h1: 5
          h2: 0
          y: 6
        reason_answer: a
        reason_options:
          - id: b
            text: Add both pre-activations directly without ReLU.
          - id: a
            text: Apply ReLU before combining hidden outputs.
          - id: c
            text: Apply ReLU to the weights before using the input.
        feedback: "Pre-activations are 5 and 0, so h₁ = 5 and h₂ = 0. Then y = 5 + 0 + 1 = 6: the second unit sits exactly at its corner and contributes nothing."
        id: neural-forward-pass.base.v2.2
      - prompt: Use h₁=max(0,2x−1), h₂=max(0,−x+3), y=h₁+2h₂+1 at x=0. Record both hidden outputs and y.
        answers:
          h1: 0
          h2: 3
          y: 7
        reason_answer: a
        reason_options:
          - id: c
            text: Apply ReLU to the weights before using the input.
          - id: b
            text: Add both pre-activations directly without ReLU.
          - id: a
            text: Apply ReLU before combining hidden outputs.
        feedback: "Pre-activations are −1 and 3. ReLU turns −1 into 0, so h₁ = 0 and h₂ = 3, and y = 0 + 2 × 3 + 1 = 7. Passing −1 through unclipped would give 6."
        id: neural-forward-pass.base.v2.3
      - prompt: Use h₁=max(0,2x−1), h₂=max(0,−x+3), y=h₁+2h₂+1 at x=5. Record both hidden outputs and y.
        answers:
          h1: 9
          h2: 0
          y: 10
        reason_answer: a
        reason_options:
          - id: c
            text: Apply ReLU to the weights before using the input.
          - id: b
            text: Add both pre-activations directly without ReLU.
          - id: a
            text: Apply ReLU before combining hidden outputs.
        feedback: "Pre-activations are 9 and −2. ReLU turns −2 into 0, so h₁ = 9, h₂ = 0, and y = 9 + 0 + 1 = 10. Using −2 unclipped would give 6."
        id: neural-forward-pass.base.v2.4
    numeric_fields:
      - id: h1
        label: Hidden output h₁
      - id: h2
        label: Hidden output h₂
      - id: y
        label: Final output y
    absolute_tolerance: 1e-6
  - id: neural-forward-pass.transfer.v2
    objective_ref: objective.neural-forward-pass
    task: transfer
    response_type: single_choice
    points: 1
    hint: A forward pass reads parameters and computes values; it never writes new parameters.
    remediation_scene: neural-forward-pass.s4
    variants:
      - prompt: The same frozen network produces different hidden activations for two inputs. What changed?
        answer: a
        retired: true
        options:
          - id: c
            text: The definition of a forward pass changed
          - id: b
            text: The stored weights necessarily changed
          - id: a
            text: The temporary values computed from the inputs
        feedback: Inputs can change activations while shared parameters remain fixed.
        id: neural-forward-pass.transfer.v2.1
      - prompt: Which record most helps locate a sign error in a two-layer calculation?
        answer: a
        retired: true
        options:
          - id: b
            text: Only the rounded final output
          - id: c
            text: Only the total count of training examples
          - id: a
            text: A trace of pre-activations, activations, and output
        feedback: Intermediate values reveal where the computation first diverges.
        id: neural-forward-pass.transfer.v2.2
      - prompt: A first layer has two one-input units with biases; a one-output layer uses both hidden values and a bias. How many adjustable numbers are there?
        answer: a
        retired: true
        options:
          - id: a
            text: '7'
          - id: b
            text: '5'
          - id: c
            text: '9'
        feedback: 'First layer: two weights plus two biases. Output: two weights plus one bias. Total seven.'
        id: neural-forward-pass.transfer.v2.3
      - prompt: Which operation makes this forward pass into a parameter update?
        answer: a
        retired: true
        options:
          - id: c
            text: Applying ReLU to hidden values
          - id: a
            text: A separate rule using gradients to change stored settings
          - id: b
            text: Evaluating the final output with the current settings
        feedback: The forward pass computes outputs; an optimizer update is a separate operation.
        id: neural-forward-pass.transfer.v2.4
  - id: neural-forward-pass.transfer.v3
    objective_ref: objective.neural-forward-pass
    task: transfer
    response_type: single_choice
    points: 1
    hint: Keep two things apart. The stored parameters are only read during a forward pass; the values computed from each input flow left to right and change with every example.
    remediation_scene: neural-forward-pass.s5
    variants:
      - id: neural-forward-pass.transfer.v3.1
        prompt: A layer maps 3 input features to 4 hidden units. You run a batch of 6 examples, stored one example per row. What is the shape of the hidden-value matrix?
        options:
          - id: b
            text: '[6, 3]'
          - id: a
            text: '[6, 4]'
          - id: c
            text: '[3, 4]'
          - id: d
            text: '[4, 6]'
        answer: a
        feedback: 'Each of the 6 rows (examples) gets 4 hidden values, so the shape is [6, 4]. [6, 3] is the input''s shape, [3, 4] is the weight matrix, and [4, 6] puts examples in columns, which contradicts the one-example-per-row layout.'
      - id: neural-forward-pass.transfer.v3.2
        prompt: A network takes 3 inputs, has one hidden layer of 4 units, and produces 2 outputs. Every hidden and output unit has a bias. How many parameters does it have?
        options:
          - id: c
            text: '20'
          - id: a
            text: '24'
          - id: b
            text: '26'
          - id: d
            text: '9'
        answer: b
        feedback: 'Hidden layer: 3 × 4 weights + 4 biases = 16. Output layer: 4 × 2 weights + 2 biases = 10. Total 26. Twenty counts only the weights, 24 forgets the output biases, and 9 counts units instead of parameters.'
      - id: neural-forward-pass.transfer.v3.3
        prompt: A deployed photo model produces different hidden values for a cat photo and a dog photo. Nobody has retrained it. What differs between the two runs?
        options:
          - id: a
            text: The stored weights, which adjust to each photo
          - id: b
            text: The biases, which shift with each photo's brightness
          - id: c
            text: The activation function picked for each layer
          - id: d
            text: The input pixels and everything computed from them
        answer: d
        feedback: The parameters and activation functions are identical for both photos; only the input differs, and so every pre-activation and hidden value computed from it differs too. A forward pass reads weights and biases without changing them.
      - id: neural-forward-pass.transfer.v3.4
        prompt: 'For the network h₁ = max(0, 2x − 1), h₂ = max(0, −x + 3), y = h₁ + 2h₂ + 1, a classmate traces x = 5 and writes: pre-activations 9 and −2, hidden values 9 and 2, output 14. What went wrong first?'
        options:
          - id: c
            text: ReLU was applied as an absolute value to −2
          - id: a
            text: The output bias was added twice at the end
          - id: b
            text: The second pre-activation should be +2, not −2
          - id: d
            text: The first hidden value should be clipped to 0
        answer: c
        feedback: 'The pre-activations are right (2 × 5 − 1 = 9 and −5 + 3 = −2), so the first wrong number is the hidden value 2: ReLU turns −2 into 0, not 2. The correct output is 9 + 0 + 1 = 10; the final line only looks wrong because it inherited that mistake.'
      - id: neural-forward-pass.transfer.v3.5
        prompt: During a week of testing, a model runs 10,000 forward passes on test photos with no optimizer attached. How much do its weights change?
        options:
          - id: b
            text: A little after each photo, as they do in training
          - id: a
            text: Not at all, because a forward pass only reads them
          - id: c
            text: Just the biases, which drift toward the test photos
          - id: d
            text: Just the weights feeding units that use ReLU
        answer: a
        feedback: A forward pass reads the parameters to compute outputs and never writes to them. Weights change only when a separate update step applies gradients, and there isn't one here. Biases and ReLU-layer weights are parameters like any other.
