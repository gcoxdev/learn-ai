scenes:
  - id: neural-forward-pass.s1
    type: explanation
    depth: intuition
    objective_refs:
      - objective.neural-forward-pass
    title: One sweep from input to answer
    markdown: |-
      Point your phone at a flower and an app names it in a blink. Ask a chatbot a question and it picks its next word. Both answers come from the same thing: a **forward pass**, one sweep of arithmetic from the input, through every layer in order, to the output, using the weights and biases the network already has.

      In the usual drawing, circles hold values and arrows carry them forward, each arrow multiplying by its weight. The **input layer** holds the numbers you feed in. A **hidden layer** is any layer in between: its values aren't the answer, but you can inspect them. The **output layer** holds the result.

      Explore the network below: two inputs, two hidden layers of three and two units, and one output. Select a circle to see its calculation. Every unit does what you did in the neuron lesson: combine incoming values, add its bias, apply its activation function, and pass the result on. The next scenes shrink the network to one input and one hidden layer so you can do every step by hand.
    bridges:
      - neurons
    figure:
      kind: network-layers
      caption: Follow the values from left to right. Select a circle to inspect its incoming connections and calculation.
      description: Two input values feed three units in the first hidden layer, then two in the second hidden layer, and finally one output. Each non-input unit combines weighted incoming values and a bias. Hidden units apply ReLU. The controls reveal each layer and expose the same calculations in text.
  - id: neural-forward-pass.s2
    type: explanation
    depth: intuition
    objective_refs:
      - objective.neural-forward-pass
    title: Give every arrow a number
    markdown: |-
      Our small network has one input $x$, two hidden ReLU units, and one output. The hidden units are

      $$h_1 = \max(0,\ 2x - 1), \qquad h_2 = \max(0,\ -x + 3)$$

      Feed in $x = 2$ and work in two stages:

      | Unit | Pre-activation | After ReLU |
      | --- | --- | ---: |
      | $h_1$ | $2 \times 2 - 1 = 3$ | 3 |
      | $h_2$ | $-2 + 3 = 1$ | 1 |

      As in the neuron lesson, a pre-activation is the value before ReLU. Both are positive here, so ReLU passes them through unchanged. Keep the pre-activations in your notes anyway: when a trace goes wrong, they're where you'll find the mistake, and the backpropagation lesson needs them too.
    bridges:
      - arithmetic
      - functions
  - id: neural-forward-pass.s3
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.neural-forward-pass
    title: Combine the hidden values, then score the answer
    markdown: |-
      The output unit reads both hidden values with weights 1 and 2, plus bias 1:

      $$y = h_1 + 2h_2 + 1 = 3 + 2 \times 1 + 1 = 6$$

      This output unit has no ReLU. That's common for the last layer of a network that predicts a number, because the answer may need to be negative. A yes/no classifier would end with a sigmoid instead.

      Is 6 any good? Only a target can say. Suppose the right answer for $x = 2$ is $t = 5$. The squared-error loss from the prediction lesson is $(y - t)^2 = (6 - 5)^2 = 1$. Computing the loss is the last step of a forward pass during training; when the model is simply being used, the pass stops at $y$.

      Step through the same calculation in the figure: set the input to 2, then move from "multiply, then add biases" to "combine the two values."
    bridges: []
    figure:
      kind: neural-network
      caption: Each highlighted connection carries a value. Follow the sums before interpreting the final answer.
      description: The fixture uses h1=max(0,2x−1), h2=max(0,−x+3), and y=h1+2h2+1. At x=2, the hidden outputs are 3 and 1 and the final output is 6. Changing x leaves the weights and biases fixed.
  - id: neural-forward-pass.s4
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.neural-forward-pass
    title: Same network, new input, different path
    markdown: |-
      :::predict Now feed in x = 4. Which hidden unit changes the most, and what's the output?
      The pre-activations are $2 \times 4 - 1 = 7$ and $-4 + 3 = -1$. ReLU keeps 7 and turns −1 into 0, so $y = 7 + 2 \times 0 + 1 = 8$. The second unit was contributing at $x = 2$ and is completely switched off at $x = 4$.
      :::

      Nothing about the network changed between the two inputs. The same seven parameters produced different hidden values, and even a different set of active units, because the input changed. For $x$ between 0.5 and 3 both units are on; above 3 only $h_1$ is; below 0.5 only $h_2$ is. Each region gets its own straight rule, joined at the corners: the bend from the nonlinearity lesson at work.

      :::mixup "Running the network on a new input adjusts its weights a little."
      A forward pass only *reads* the parameters. Weights change only when a separate update step writes new values into them; the next few lessons build that step. A deployed model can run millions of forward passes and end the day with exactly the weights it started with.
      :::
    bridges: []
  - id: neural-forward-pass.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.neural-forward-pass
    markdown: Trace the small network at new inputs, then count parameters, predict batch shapes, and find the first wrong number in a classmate's trace.
    takeaway: |-
      A forward pass reads the network's fixed weights and sweeps left to right: combine, add bias, activate, pass on, and finally compare with a target to get a loss. Different inputs can switch different units on and off.
  - id: neural-forward-pass.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.neural-forward-pass
    markdown: |-
      A forward pass applies parameterized transformations to a batch, preserving axis meanings and producing predictions whose loss is defined against the intended targets.
  - id: neural-forward-pass.s5
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.neural-forward-pass
    title: The same computation as matrices and batches
    markdown: |-
      Written with matrices, the whole network is two lines:

      $$h = \text{ReLU}(W_1 x + b_1), \qquad \hat{y} = W_2 h + b_2$$

      Here $W_1 = [2, -1]^\top$ holds the input weights, $b_1 = [-1, 3]$ the hidden biases, $W_2 = [1, 2]$ the output weights, and $b_2 = 1$. That's 2 + 2 + 2 + 1 = **7 parameters**. (The figure's 2 → 3 → 2 → 1 network has 2×3 + 3 + 3×2 + 2 + 2×1 + 1 = 20.)

      In practice you run a **batch**, a group of examples processed together. Code usually stores one example per row, so the multiplication is written `X @ W1` instead of $W_1 x$. The batch dimension rides along untouched: 2 examples in, 2 predictions out, every example sharing the same 7 parameters.

      ```python run
      import numpy as np

      X = np.array([[2.0], [4.0]])        # a batch of 2 examples, 1 feature each
      t = np.array([[5.0], [8.0]])        # their targets
      W1 = np.array([[2.0, -1.0]])        # shape (1, 2): input -> 2 hidden units
      b1 = np.array([-1.0, 3.0])
      W2 = np.array([[1.0], [2.0]])       # shape (2, 1): hidden -> output
      b2 = np.array([1.0])

      Z1 = X @ W1 + b1                    # hidden pre-activations, shape (2, 2)
      H = np.maximum(0, Z1)               # ReLU
      Y = H @ W2 + b2                     # predictions, shape (2, 1)
      loss = ((Y - t) ** 2).mean()        # mean squared error over the batch

      print("pre-activations:", Z1.tolist())
      print("hidden values:  ", H.tolist())
      print("predictions:    ", Y.ravel().tolist())
      print("loss:           ", loss)
      print("shapes: X", X.shape, " H", H.shape, " Y", Y.shape)
      print("parameters:", W1.size + b1.size + W2.size + b2.size)
      ```

      Both of our examples appear as rows: predictions 6 and 8, and with targets 5 and 8 the mean squared error is (1 + 0) / 2 = 0.5. Add $x = 0$ and $x = 5$ to the batch (with any targets) and predict the new shapes before you run it.
    bridges:
      - matrices-tensors
  - id: neural-forward-pass.s6
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.neural-forward-pass
    title: Debug from the first wrong number
    markdown: |-
      A classmate traces $x = 4$ and gets $y = 10$. Line their trace up against the correct one:

      | Quantity | Classmate | Correct |
      | --- | --- | --- |
      | Pre-activations | 7, −1 | 7, −1 |
      | Hidden values | 7, 1 | 7, 0 |
      | Output | 7 + 2 × 1 + 1 = 10 | 7 + 0 + 1 = 8 |

      Scan left to right and stop at the first mismatch: the hidden value 1. They took the absolute value of −1 instead of applying ReLU. Everything after that is correct arithmetic on a wrong number, so fixing the output line would have hidden the real bug.

      The same habit scales to real networks: print the values after each layer and compare with a reference, starting from the input. The memory cue for a forward pass is **combine, activate, pass**. Training adds gradients and an update on top; the next lessons build those one at a time.
    bridges: []
  - id: neural-forward-pass.s7
    type: question
    depth: mechanics
    objective_refs:
      - objective.neural-forward-pass
    title: Find the switched-off clue
    markdown: |-
      With x=4, the second hidden pre-activation is −1. What value should enter the output rule from that hidden unit?
    bridges: []
    question:
      response_type: single_choice
      options:
        - id: a
          text: '0'
        - id: b
          text: −1
        - id: c
          text: '1'
      answer: a
      reveal_markdown: |-
        ReLU replaces the negative pre-activation with zero. It does not pass it through or take its absolute value.
      hint: "ReLU keeps a positive pre-activation and replaces a negative one with zero. It never flips the sign."
      id: neural-forward-pass.practice.v2.7
