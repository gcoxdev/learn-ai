schema_version: 0.2-draft
lesson:
  id: neural-forward-pass
  version: 0.4.0-draft
  title: Trace inputs through layers to a loss
  state: draft
  summary: Every answer a neural network gives, from a flower name to a chatbot's next word, comes from one left-to-right sweep of arithmetic. Follow a number all the way through.
  slot: M11.3
  category: learning
  sources:
    - title: Dive into Deep Learning — forward/backward computation
      url: https://d2l.ai/chapter_multilayer-perceptrons/backprop.html
    - title: Dive into Deep Learning — multilayer perceptrons
      url: https://d2l.ai/chapter_multilayer-perceptrons/mlp.html
  archetype: mechanism
objectives:
  - id: objective.neural-forward-pass
    version: 3-draft
    statement: Calculate hidden pre-activations, ReLU outputs, and a second-layer prediction with fixed weights.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - neural-forward-pass.base.v2
      - neural-forward-pass.transfer.v3
    prerequisites:
      - anyOf:
          - objective.neurons
      - anyOf:
