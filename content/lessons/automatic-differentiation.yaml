assessment_families:
- id: automatic-differentiation.base
  objective_ref: objective.automatic-differentiation
  task: base
  response_type: single_choice
  points: 1
  hint: 'Trace a shared variable: trace the inputs, operation, and result before choosing.'
  remediation_scene: automatic-differentiation.s2
  variants:
  - id: automatic-differentiation.base.1
    prompt: For y = w² + w at w = 2, what derivative should reverse accumulation produce?
    options:
    - id: b
      text: '4'
    - id: c
      text: '3'
    - id: a
      text: '5'
    answer: a
    feedback: 'Both paths contribute: 2w + 1 = 5.'
    retired: true
  - id: automatic-differentiation.base.2
    prompt: How does automatic differentiation differ from finite differences?
    options:
    - id: c
      text: It always computes an exact global minimum
    - id: a
      text: It propagates local derivative rules rather than estimating from perturbed outputs
    - id: b
      text: It needs no computation graph or operations
    answer: a
    feedback: AD differentiates the executed function through its operations.
    retired: true
- id: automatic-differentiation.transfer
  objective_ref: objective.automatic-differentiation
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Check what is and is not differentiable: trace the inputs, operation, and result before choosing.'
  remediation_scene: automatic-differentiation.s4
  variants:
  - id: automatic-differentiation.transfer.1
    prompt: A shared parameter is used twice. What must backpropagation do?
    options:
    - id: c
      text: Treat each use as an unrelated parameter automatically
    - id: a
      text: Add derivative contributions from both uses
    - id: b
      text: Keep only the first contribution
    answer: a
    feedback: Shared computation creates multiple paths to the same parameter.
    retired: true
  - id: automatic-differentiation.transfer.2
    prompt: A tensor is detached before a loss. What may happen?
    options:
    - id: a
      text: That path no longer contributes gradients to earlier operations
    - id: b
      text: The earlier weights are guaranteed to improve
    - id: c
      text: The loss becomes a formal proof
    answer: a
    feedback: Detachment intentionally or accidentally breaks differentiation through that path.
    retired: true
- id: automatic-differentiation.base.v2
  objective_ref: objective.automatic-differentiation
  task: base
  response_type: numeric_fields_with_reason
  points: 1
  hint: Work through the example one step at a time before answering.
  remediation_scene: automatic-differentiation.s3
  variants:
  - prompt: Use L=w²+3w at w=1. Record L and its full derivative before any detachment.
    answers:
      loss: 4
      gradient: 5
    reason_answer: a
    reason_options:
    - id: a
      text: Add the derivatives from both branches.
    - id: c
      text: Multiply the two branch derivatives.
    - id: b
      text: Use the loss value as its derivative.
    feedback: The square branch contributes 2w and the linear branch contributes 3.
    id: automatic-differentiation.base.v2.1
  - prompt: Use L=w²+3w at w=3. Record L and its full derivative before any detachment.
    answers:
      loss: 18
      gradient: 9
    reason_answer: a
    reason_options:
    - id: c
      text: Multiply the two branch derivatives.
    - id: a
      text: Add the derivatives from both branches.
    - id: b
      text: Use the loss value as its derivative.
    feedback: The square branch contributes 2w and the linear branch contributes 3.
    id: automatic-differentiation.base.v2.2
  - prompt: Use L=w²+3w at w=0. Record L and its full derivative before any detachment.
    answers:
      loss: 0
      gradient: 3
    reason_answer: a
    reason_options:
    - id: c
      text: Multiply the two branch derivatives.
    - id: b
      text: Use the loss value as its derivative.
    - id: a
      text: Add the derivatives from both branches.
    feedback: The square branch contributes 2w and the linear branch contributes 3.
    id: automatic-differentiation.base.v2.3
  - prompt: Use L=w²+3w at w=-2. Record L and its full derivative before any detachment.
    answers:
      loss: -2
      gradient: -1
    reason_answer: a
    reason_options:
    - id: a
      text: Add the derivatives from both branches.
    - id: c
      text: Multiply the two branch derivatives.
    - id: b
      text: Use the loss value as its derivative.
    feedback: The square branch contributes 2w and the linear branch contributes 3.
    id: automatic-differentiation.base.v2.4
  numeric_fields:
  - id: loss
    label: Loss-expression value
  - id: gradient
    label: Derivative with respect to w
  absolute_tolerance: 1.0e-06
- id: automatic-differentiation.transfer.v2
  objective_ref: objective.automatic-differentiation
  task: transfer
  response_type: single_choice
  points: 1
  hint: Work through the example one step at a time before answering.
  remediation_scene: automatic-differentiation.s3
  variants:
  - prompt: A square branch is detached while a linear branch remains connected. Why can the forward result still
      look normal?
    answer: a
    options:
    - id: b
      text: Detachment must replace the square’s value with zero
    - id: c
      text: The optimizer silently repairs missing derivative paths
    - id: a
      text: Detachment changes derivative connections without changing the stored value
    feedback: Values and derivative connectivity are different properties of the computation.
    id: automatic-differentiation.transfer.v2.1
  - prompt: Two backward passes each add gradient 5 to initially zero storage, with no clearing. What is stored?
    answer: a
    options:
    - id: a
      text: '10'
    - id: c
      text: '25'
    - id: b
      text: '5'
    feedback: Accumulation adds contributions; clear or scale according to the intended update rule.
    id: automatic-differentiation.transfer.v2.2
  - prompt: Which describes finite differences rather than autodiff?
    answer: a
    options:
    - id: b
      text: Combine local derivative rules through executed operations
    - id: c
      text: Propagate sensitivities through a recorded graph
    - id: a
      text: Perturb an input and compare the resulting output changes
    feedback: Finite differences approximate derivatives by evaluating nearby inputs.
    id: automatic-differentiation.transfer.v2.3
  - prompt: Autodiff matches a hand calculation but training still optimizes the wrong target. What should be inspected?
    answer: a
    options:
    - id: b
      text: Whether more decimal places in the derivative would redefine the target
    - id: a
      text: The implemented objective and data flow
    - id: c
      text: Whether a backward call can infer the intended task
    feedback: A correct derivative of the wrong objective remains the wrong training signal.
    id: automatic-differentiation.transfer.v2.4
