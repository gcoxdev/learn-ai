assessment_families:
  - id: automatic-differentiation.base
    objective_ref: objective.automatic-differentiation
    task: base
    response_type: single_choice
    points: 1
    hint: 'Trace a shared variable: trace the inputs, operation, and result before choosing.'
    remediation_scene: automatic-differentiation.s2
    variants:
      - id: automatic-differentiation.base.1
        prompt: For y = w² + w at w = 2, what derivative should reverse accumulation produce?
        options:
          - id: b
            text: '4'
          - id: c
            text: '3'
          - id: a
            text: '5'
        answer: a
        feedback: 'Both paths contribute: 2w + 1 = 5.'
        retired: true
      - id: automatic-differentiation.base.2
        prompt: How does automatic differentiation differ from finite differences?
        options:
          - id: c
            text: It always computes an exact global minimum
          - id: a
            text: It propagates local derivative rules rather than estimating from perturbed outputs
          - id: b
            text: It needs no computation graph or operations
        answer: a
        feedback: AD differentiates the executed function through its operations.
        retired: true
  - id: automatic-differentiation.transfer
    objective_ref: objective.automatic-differentiation
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Check what is and is not differentiable: trace the inputs, operation, and result before choosing.'
    remediation_scene: automatic-differentiation.s4
    variants:
      - id: automatic-differentiation.transfer.1
        prompt: A shared parameter is used twice. What must backpropagation do?
        options:
          - id: c
            text: Treat each use as an unrelated parameter automatically
          - id: a
            text: Add derivative contributions from both uses
          - id: b
            text: Keep only the first contribution
        answer: a
        feedback: Shared computation creates multiple paths to the same parameter.
        retired: true
      - id: automatic-differentiation.transfer.2
        prompt: A tensor is detached before a loss. What may happen?
        options:
          - id: a
            text: That path no longer contributes gradients to earlier operations
          - id: b
            text: The earlier weights are guaranteed to improve
          - id: c
            text: The loss becomes a formal proof
        answer: a
        feedback: Detachment intentionally or accidentally breaks differentiation through that path.
        retired: true
  - id: automatic-differentiation.base.v2
    objective_ref: objective.automatic-differentiation
    task: base
    response_type: numeric_fields_with_reason
    points: 1
    hint: 'Add the two routes'' slopes: the square contributes 2w and the 3w term contributes 3. The value of L is a separate number from its slope.'
    remediation_scene: automatic-differentiation.s2
    variants:
      - prompt: Use L=w²+3w at w=1. Record L and its full derivative before any detachment.
        answers:
          loss: 4
          gradient: 5
        reason_answer: a
        reason_options:
          - id: a
            text: Add the derivatives from both branches.
          - id: c
            text: Multiply the two branch derivatives.
          - id: b
            text: Use the loss value as its derivative.
        feedback: "L = 1 + 3 = 4. The routes contribute 2 × 1 = 2 and 3, which add to 5. Multiplying them would give 6."
        id: automatic-differentiation.base.v2.1
      - prompt: Use L=w²+3w at w=3. Record L and its full derivative before any detachment.
        answers:
          loss: 18
          gradient: 9
        reason_answer: a
        reason_options:
          - id: c
            text: Multiply the two branch derivatives.
          - id: a
            text: Add the derivatives from both branches.
          - id: b
            text: Use the loss value as its derivative.
        feedback: "L = 9 + 9 = 18. The routes contribute 2 × 3 = 6 and 3, which add to 9. The value 18 is not the slope."
        id: automatic-differentiation.base.v2.2
      - prompt: Use L=w²+3w at w=0. Record L and its full derivative before any detachment.
        answers:
          loss: 0
          gradient: 3
        reason_answer: a
        reason_options:
          - id: c
            text: Multiply the two branch derivatives.
          - id: b
            text: Use the loss value as its derivative.
          - id: a
            text: Add the derivatives from both branches.
        feedback: "L = 0 + 0 = 0, but the slope isn't 0: the square contributes 2 × 0 = 0 and the linear route still contributes 3, for a total of 3."
        id: automatic-differentiation.base.v2.3
      - prompt: Use L=w²+3w at w=-2. Record L and its full derivative before any detachment.
        answers:
          loss: -2
          gradient: -1
        reason_answer: a
        reason_options:
          - id: a
            text: Add the derivatives from both branches.
          - id: c
            text: Multiply the two branch derivatives.
          - id: b
            text: Use the loss value as its derivative.
        feedback: "L = 4 − 6 = −2. The routes contribute 2 × (−2) = −4 and 3, which add to −1. Multiplying them would give −12."
        id: automatic-differentiation.base.v2.4
    numeric_fields:
      - id: loss
        label: Loss-expression value
      - id: gradient
        label: Derivative with respect to w
    absolute_tolerance: 1e-6
  - id: automatic-differentiation.transfer.v2
    objective_ref: objective.automatic-differentiation
    task: transfer
    response_type: single_choice
    points: 1
    hint: A detached value keeps its number but loses its route back; stored gradients add up until they are cleared.
    remediation_scene: automatic-differentiation.s4
    variants:
      - prompt: A square branch is detached while a linear branch remains connected. Why can the forward result still look normal?
        answer: a
        retired: true
        options:
          - id: b
            text: Detachment must replace the square’s value with zero
          - id: c
            text: The optimizer silently repairs missing derivative paths
          - id: a
            text: Detachment changes derivative connections without changing the stored value
        feedback: Values and derivative connectivity are different properties of the computation.
        id: automatic-differentiation.transfer.v2.1
      - prompt: Two backward passes each add gradient 5 to initially zero storage, with no clearing. What is stored?
        answer: a
        retired: true
        options:
          - id: a
            text: '10'
          - id: c
            text: '25'
          - id: b
            text: '5'
        feedback: Accumulation adds contributions; clear or scale according to the intended update rule.
        id: automatic-differentiation.transfer.v2.2
      - prompt: Which describes finite differences rather than autodiff?
        answer: a
        retired: true
        options:
          - id: b
            text: Combine local derivative rules through executed operations
          - id: c
            text: Propagate sensitivities through a recorded graph
          - id: a
            text: Perturb an input and compare the resulting output changes
        feedback: Finite differences approximate derivatives by evaluating nearby inputs.
        id: automatic-differentiation.transfer.v2.3
      - prompt: Autodiff matches a hand calculation but training still optimizes the wrong target. What should be inspected?
        answer: a
        retired: true
        options:
          - id: b
            text: Whether more decimal places in the derivative would redefine the target
          - id: a
            text: The implemented objective and data flow
          - id: c
            text: Whether a backward call can infer the intended task
        feedback: A correct derivative of the wrong objective remains the wrong training signal.
        id: automatic-differentiation.transfer.v2.4
  - id: automatic-differentiation.transfer.v3
    objective_ref: objective.automatic-differentiation
    task: transfer
    response_type: single_choice
    points: 1
    hint: Autodiff is exact about the code that actually ran. Ask what that code recorded, which routes were cut, what piled up in grad, and which loss it was told to differentiate.
    remediation_scene: automatic-differentiation.s4
    variants:
      - id: automatic-differentiation.transfer.v3.1
        prompt: 'During fine-tuning the loss falls, but the embedding layer''s weights never change. The code contains `e = embed(x).detach()`. What is going on?'
        options:
          - id: b
            text: The embedding's learning rate has rounded down to zero
          - id: c
            text: The loss is now too small to produce any gradient
          - id: a
            text: Detaching cut the route, so no gradient reaches the embedding
          - id: d
            text: Autodiff skips layers whose outputs are very large
        answer: a
        feedback: '`.detach()` keeps the embedding''s values in the forward pass but removes its record from the graph, so the backward sweep never reaches its weights. The rest of the model still learns, which is why the loss falls. A small loss still has gradients, and the learning rate is not the cause here.'
      - id: automatic-differentiation.transfer.v3.2
        prompt: A training loop runs forward and backward each step but never clears stored gradients. The true gradient is 5 at every step. What gradient does the optimizer use at the third step?
        options:
          - id: a
            text: '5'
          - id: b
            text: '10'
          - id: c
            text: '15'
          - id: d
            text: '125'
        answer: c
        feedback: 'Each backward pass adds into the stored gradient: 5, then 10, then 15. So the third step is three times too large. Five is what you''d get with zero_grad() each step, and 125 multiplies the contributions instead of adding them.'
      - id: automatic-differentiation.transfer.v3.3
        prompt: A physics library estimates a slope by computing f(w + 0.001) and f(w − 0.001) and dividing their difference by 0.002. Which method is it using?
        options:
          - id: d
            text: Finite differences
          - id: a
            text: Reverse-mode autodiff
          - id: b
            text: Forward-mode autodiff
          - id: c
            text: Symbolic differentiation
        answer: d
        feedback: Nudging the input and measuring the change is a finite difference, an approximation that costs two runs per input. Both autodiff modes combine exact local slopes of recorded operations, and symbolic differentiation rewrites the formula itself.
      - id: automatic-differentiation.transfer.v3.4
        prompt: A climate simulation has 3 input settings and 5,000 outputs, and you need the slope of every output with respect to every setting. Which choice needs the fewest passes?
        options:
          - id: b
            text: 'Reverse mode: 1 sweep, as in training'
          - id: a
            text: 'Forward mode: 3 passes, one per input'
          - id: c
            text: 'Reverse mode: 3 sweeps, one per input'
          - id: d
            text: 'Forward mode: 5,000 passes, one per output'
        answer: a
        feedback: Forward mode needs one pass per input, so 3 passes cover everything. Reverse mode needs one sweep per output, 5,000 here. Training is the opposite shape (one loss, billions of weights), which is why it uses reverse mode.
      - id: automatic-differentiation.transfer.v3.5
        prompt: A model's autodiff gradients match a hand check exactly, yet it learns to predict yesterday's price instead of today's. Where is the bug most likely to be?
        options:
          - id: c
            text: In the chain rule autodiff applies to the price layer
          - id: b
            text: In rounding error building up during the backward pass
          - id: a
            text: In the targets the loss compares the predictions against
          - id: d
            text: In the order the backward sweep visits the graph's nodes
        answer: a
        feedback: Matching the hand check shows the derivatives are right for the code as written. Autodiff faithfully optimizes whatever loss it's given, so if the targets are shifted by a day, it learns the wrong goal perfectly. The chain rule and the sweep order are exactly what the check just confirmed.
