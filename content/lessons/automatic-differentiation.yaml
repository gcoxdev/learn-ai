lesson:
  id: automatic-differentiation
  version: 0.1.0-draft
  title: Let the graph carry derivatives
  state: draft
  summary: Automatic differentiation applies local derivative rules through a computation graph; gradient accumulation,
    graph breaks, and numerical checks determine whether the intended update is implemented.
  slot: M11.5
  category: learning
  minutes: 12
  sources:
  - title: Dive into Deep Learning — authors’ open textbook
    url: https://d2l.ai/
objectives:
- id: objective.automatic-differentiation
  version: 1-draft
  statement: Automatic differentiation applies local derivative rules through a computation graph; gradient accumulation,
    graph breaks, and numerical checks determine whether the intended update is implemented.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - automatic-differentiation.base
  - automatic-differentiation.transfer
  prerequisites:
  - anyOf:
    - objective.backpropagation
  - anyOf:
    - objective.neural-forward-pass
scenes:
- id: automatic-differentiation.s1
  title: Differentiate the executed operations
  type: explanation
  depth: intuition
  objective_refs:
  - objective.automatic-differentiation
  markdown: Automatic differentiation records or transforms a computation composed of operations with known derivative
    rules. Reverse mode efficiently obtains a scalar loss’s derivatives with respect to many inputs. It differs
    from symbolic algebra simplification and from finite differences, though all can help verify a small example.
  text_mode: Automatic differentiation records or transforms a computation composed of operations with known derivative
    rules. Reverse mode efficiently obtains a scalar loss’s derivatives with respect to many inputs. It differs
    from symbolic algebra simplification and from finite differences, though all can help verify a small example.
  bridges: []
- id: automatic-differentiation.s2
  title: Trace a shared variable
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.automatic-differentiation
  markdown: Let y = w × w + w. The variable w influences both multiplication inputs and the added term. Its derivative
    is 2w + 1, so at w = 3 it is 7. Reverse accumulation must add contributions from every path. Ignoring a shared
    path yields an incorrect gradient even if each local derivative is right.
  text_mode: Let y = w × w + w. The variable w influences both multiplication inputs and the added term. Its derivative
    is 2w + 1, so at w = 3 it is 7. Reverse accumulation must add contributions from every path. Ignoring a shared
    path yields an incorrect gradient even if each local derivative is right.
  bridges:
  - chain-rule
- id: automatic-differentiation.s3
  title: Manage gradient buffers deliberately
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.automatic-differentiation
  markdown: Frameworks often accumulate gradients in buffers. Two backward passes can add contributions before one
    optimizer step, enabling microbatch accumulation. Clear buffers at the intended update boundary and weight losses
    correctly. Saving memory by detaching a tensor can also remove a gradient path, which may or may not be intentional.
  text_mode: Frameworks often accumulate gradients in buffers. Two backward passes can add contributions before
    one optimizer step, enabling microbatch accumulation. Clear buffers at the intended update boundary and weight
    losses correctly. Saving memory by detaching a tensor can also remove a gradient path, which may or may not
    be intentional.
  bridges: []
- id: automatic-differentiation.s4
  title: Check what is and is not differentiable
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.automatic-differentiation
  markdown: Discrete sampling or index selection may not have the ordinary derivative a learner expects. Custom
    operations need correct derivative rules. A graph can be valid while representing the wrong loss or targets.
    Use finite-difference checks, tiny cases, and explicit inspection of trainable parameters to verify the implemented
    task.
  text_mode: Discrete sampling or index selection may not have the ordinary derivative a learner expects. Custom
    operations need correct derivative rules. A graph can be valid while representing the wrong loss or targets.
    Use finite-difference checks, tiny cases, and explicit inspection of trainable parameters to verify the implemented
    task.
  bridges: []
- id: automatic-differentiation.check
