lesson:
  id: automatic-differentiation
  version: 0.2.0-draft
  title: Let the graph carry derivatives
  state: draft
  summary: Let a program keep the derivative bookkeeping while you check what it is actually differentiating.
  slot: M11.5
  category: learning
  sources:
  - title: PyTorch — automatic differentiation fundamentals
    url: https://docs.pytorch.org/tutorials/beginner/basics/autogradqs_tutorial.html
  - title: Dive into Deep Learning — forward/backward computation
    url: https://d2l.ai/chapter_multilayer-perceptrons/backprop.html
  archetype: mechanism
objectives:
- id: objective.automatic-differentiation
  version: 2-draft
  statement: Distinguish automatic differentiation from finite differences and symbolic algebra, and diagnose accumulation
    or graph-detachment errors.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - automatic-differentiation.base.v2
  - automatic-differentiation.transfer.v2
  prerequisites:
  - anyOf:
    - objective.backpropagation
  - anyOf:
    - objective.neural-forward-pass
scenes:
- id: automatic-differentiation.s1
  type: explanation
  depth: intuition
  objective_refs:
  - objective.automatic-differentiation
  title: A calculator that remembers its steps
  markdown: Ordinary code can multiply, add, and square numbers to produce a loss. **Automatic differentiation**,
    often shortened to autodiff, attaches derivative rules to supported operations and combines them through the
    executed computation. The program does the chain-rule bookkeeping that you can perform by hand on a small example.
    It is not comparing nearby input values by default, and it does not need to write a giant symbolic formula for
    the whole network.
  text_mode: Ordinary code can multiply, add, and square numbers to produce a loss. **Automatic differentiation**,
    often shortened to autodiff, attaches derivative rules to supported operations and combines them through the
    executed computation. The program does the chain-rule bookkeeping that you can perform by hand on a small example.
    It is not comparing nearby input values by default, and it does not need to write a giant symbolic formula for
    the whole network.
  bridges:
  - backpropagation
- id: automatic-differentiation.s2
  type: explanation
  depth: intuition
  objective_refs:
  - objective.automatic-differentiation
  title: Watch one value take two routes
  markdown: Let u=w², v=3w, and L=u+v. At w=2, the forward values are u=4, v=6, and L=10. The derivative from the
    square branch is 2w=4; the derivative from the linear branch is 3. Add them to get dL/dw=7. An autodiff system
    can store the operations and needed intermediate values, then walk backward from L. Shared values must collect
    contributions from all relevant routes, just as in the manual graph. Here L is a scalar expression chosen to
    practice differentiation; unlike squared error, it can be negative.
  text_mode: Let u=w², v=3w, and L=u+v. At w=2, the forward values are u=4, v=6, and L=10. The derivative from the
    square branch is 2w=4; the derivative from the linear branch is 3. Add them to get dL/dw=7. An autodiff system
    can store the operations and needed intermediate values, then walk backward from L. Shared values must collect
    contributions from all relevant routes, just as in the manual graph. Here L is a scalar expression chosen to
    practice differentiation; unlike squared error, it can be negative.
  bridges: []
- id: automatic-differentiation.s3
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.automatic-differentiation
  title: Forward and reverse are two bookkeeping choices
  markdown: In **forward-mode** differentiation, sensitivities travel with the ordinary computation from selected
    inputs. In **reverse-mode**, sensitivities propagate backward from selected outputs. A scalar training loss
    and many parameters often suit reverse mode, because one reverse traversal yields derivatives for those parameters.
    This is about computation organization, not whether learning itself runs forward or backward in time. Frameworks
    support different combinations, so inspect the chosen operation and requested derivative rather than assuming
    one mode is universal.
  text_mode: In **forward-mode** differentiation, sensitivities travel with the ordinary computation from selected
    inputs. In **reverse-mode**, sensitivities propagate backward from selected outputs. A scalar training loss
    and many parameters often suit reverse mode, because one reverse traversal yields derivatives for those parameters.
    This is about computation organization, not whether learning itself runs forward or backward in time. Frameworks
    support different combinations, so inspect the chosen operation and requested derivative rather than assuming
    one mode is universal.
  bridges: []
- id: automatic-differentiation.s4
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.automatic-differentiation
  title: Know what a broken connection means
  markdown: A **detached** value is treated as no longer connected to the earlier differentiable graph. If u=w²
    is detached before L=u+3w, the numerical forward value at w=2 is still 10, but the derivative through u is absent.
    The remaining gradient is 3. This can be deliberate, for example when holding one computation fixed during another
    update. It can also be a bug. A correct-looking loss value does not prove that every intended gradient path
    remains connected.
  text_mode: A **detached** value is treated as no longer connected to the earlier differentiable graph. If u=w²
    is detached before L=u+3w, the numerical forward value at w=2 is still 10, but the derivative through u is absent.
    The remaining gradient is 3. This can be deliberate, for example when holding one computation fixed during another
    update. It can also be a bug. A correct-looking loss value does not prove that every intended gradient path
    remains connected.
  bridges: []
- id: automatic-differentiation.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.automatic-differentiation
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Automatic differentiation follows the executed operations. Record the graph, propagate derivatives,
    and inspect accumulation before updating parameters.
- id: automatic-differentiation.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.automatic-differentiation
  markdown: Automatic differentiation applies local derivative rules through a computation graph; gradient accumulation,
    graph breaks, and numerical checks determine whether the intended update is implemented.
  text_mode: Automatic differentiation applies local derivative rules through a computation graph; gradient accumulation,
    graph breaks, and numerical checks determine whether the intended update is implemented.
- id: automatic-differentiation.s5
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.automatic-differentiation
  title: Accumulation is a choice to manage
  markdown: Some frameworks add new gradient contributions into existing gradient storage. If one backward pass
    contributes 7 and a second contributes 7 without clearing, the stored value becomes 14. That is useful for deliberate
    accumulation across smaller batches, but wrong if you intended each step to start fresh. Define whether your
    loss is a sum or a mean, clear stored gradients at the intended boundary, then apply one update. A training
    loop must manage both the calculation graph and the lifecycle of gradient storage.
  text_mode: Some frameworks add new gradient contributions into existing gradient storage. If one backward pass
    contributes 7 and a second contributes 7 without clearing, the stored value becomes 14. That is useful for deliberate
    accumulation across smaller batches, but wrong if you intended each step to start fresh. Define whether your
    loss is a sum or a mean, clear stored gradients at the intended boundary, then apply one update. A training
    loop must manage both the calculation graph and the lifecycle of gradient storage.
  bridges: []
- id: automatic-differentiation.s6
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.automatic-differentiation
  title: Check a small case before trusting a large one
  markdown: Compare autodiff with a hand derivative for a tiny smooth expression. Then optionally compare a carefully
    chosen finite-difference estimate. They answer the same derivative question by different procedures and can
    disagree near corners or under limited precision. Autodiff differentiates the implemented computation; it cannot
    know that you used the wrong target, forgot a term, or detached the wrong value. Remember “the graph you wrote,
    not the intention in your head.” Inspect both values and gradient paths.
  text_mode: Compare autodiff with a hand derivative for a tiny smooth expression. Then optionally compare a carefully
    chosen finite-difference estimate. They answer the same derivative question by different procedures and can
    disagree near corners or under limited precision. Autodiff differentiates the implemented computation; it cannot
    know that you used the wrong target, forgot a term, or detached the wrong value. Remember “the graph you wrote,
    not the intention in your head.” Inspect both values and gradient paths.
  bridges: []
- id: automatic-differentiation.s7
  type: question
  depth: mechanics
  objective_refs:
  - objective.automatic-differentiation
  title: The value is right but the derivative is wrong
  markdown: At w=2, L=w²+3w has value 10. The w² branch is detached. What derivative is left?
  text_mode: At w=2, L=w²+3w has value 10. The w² branch is detached. What derivative is left?
  bridges: []
  question:
    response_type: single_choice
    options:
    - id: a
      text: '3'
    - id: b
      text: '7'
    - id: c
      text: '10'
    answer: a
    reveal_markdown: Detaching the square branch removes its derivative contribution. The remaining 3w branch contributes
      3, even though the forward value is unchanged.
    hint: Trace the example using the rule from the preceding pages.
    id: automatic-differentiation.practice.v2.7
