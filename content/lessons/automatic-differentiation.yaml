objectives:
  - id: objective.automatic-differentiation
    version: 3-draft
    statement: Distinguish automatic differentiation from finite differences and symbolic algebra, and diagnose accumulation or graph-detachment errors.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - automatic-differentiation.base.v2
