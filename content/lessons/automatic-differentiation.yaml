scenes:
  - id: automatic-differentiation.s1
    type: explanation
    depth: intuition
    objective_refs:
      - objective.automatic-differentiation
    title: Nobody writes these derivatives by hand
    markdown: |-
      In the backpropagation lesson you worked out a gradient table by hand for a network with seven parameters. A large language model has billions, and its authors never write a single derivative. They write the forward pass, then call `loss.backward()`. How does one line know every slope?

      The trick is **automatic differentiation**, or **autodiff**. While your code runs, each operation (add, multiply, square, ReLU) is recorded in a computational graph along with its local slope. Afterward, one backward sweep applies "multiply along, add across" through that recorded graph. It's backpropagation done by bookkeeping software.

      Autodiff is easy to confuse with two other ways of getting derivatives:

      | Method | How it works | Result |
      | --- | --- | --- |
      | Symbolic differentiation | Rewrites the formula with calculus rules, like a textbook | An exact formula, which can balloon in size |
      | Finite differences | Nudges each input and measures the change | An approximation; two runs per input |
      | Automatic differentiation | Records each operation's local slope as it runs | Exact slopes at this point, for a small multiple of one pass's cost |
    bridges:
      - backpropagation
  - id: automatic-differentiation.s2
    type: explanation
    depth: intuition
    objective_refs:
      - objective.automatic-differentiation
    title: Watch one value take two routes
    markdown: |-
      Here's a small expression where $w$ is used twice: $u = w^2$, $v = 3w$, and $L = u + v$.

      At $w = 2$ the forward pass records $u = 4$, $v = 6$, and $L = 10$, and each operation stores its local slope: the square contributes $2w = 4$, and the "times 3" contributes 3. The backward sweep starts at $L$ with slope 1, passes 1 to both $u$ and $v$ (addition passes gradients through unchanged), then multiplies along each route:

      $$\frac{\partial L}{\partial w} = \underbrace{1 \times 4}_{\text{through } u} + \underbrace{1 \times 3}_{\text{through } v} = 7$$

      The two routes meet at $w$, so their contributions are added: exactly the rule from the backpropagation lesson. (Here $L$ is just an expression for practicing derivatives; unlike squared error, it can be negative.)
    bridges: []
  - id: automatic-differentiation.s9
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.automatic-differentiation
    title: Build a tiny autodiff engine
    markdown: |-
      Autodiff fits in about 30 lines. Each `Value` below holds a number, its gradient, the values it was made from (its parents), and the local slope to each parent. `backward()` lists the nodes so that every node comes after its parents, then sweeps that list in reverse, running "multiply along, add across" at every arrow. Andrej Karpathy's teaching library *micrograd* works the same way, and PyTorch's autograd is this idea scaled up to tensors.

      ```python run
      class Value:
          """A number that remembers how it was made, so it can send gradients back."""
          def __init__(self, data, parents=(), local_grads=()):
              self.data, self.grad = data, 0.0
              self.parents, self.local_grads = parents, local_grads

          def __add__(self, other):
              other = other if isinstance(other, Value) else Value(other)
              return Value(self.data + other.data, (self, other), (1.0, 1.0))

          def __mul__(self, other):
              other = other if isinstance(other, Value) else Value(other)
              return Value(self.data * other.data, (self, other), (other.data, self.data))
          __rmul__ = __mul__

          def __pow__(self, n):
              return Value(self.data ** n, (self,), (n * self.data ** (n - 1),))

          def detach(self):
              return Value(self.data)            # same number, no parents: the graph is cut

          def backward(self):
              order, seen = [], set()
              def visit(v):                      # list every node after its parents
                  if id(v) not in seen:
                      seen.add(id(v))
                      for p in v.parents:
                          visit(p)
                      order.append(v)
              visit(self)
              self.grad = 1.0
              for v in reversed(order):          # sweep from the loss back to the inputs
                  for p, local in zip(v.parents, v.local_grads):
                      p.grad += local * v.grad   # multiply along, add across

      w = Value(2.0)
      L = w**2 + 3*w
      L.backward()
      print("L =", L.data, "  dL/dw =", w.grad)

      w = Value(2.0)
      L = (3*w + (-4))**2                        # the backpropagation lesson's model
      L.backward()
      print("backprop lesson: L =", L.data, "  dL/dw =", w.grad)

      w = Value(2.0)
      L = w.detach()**2 + 3*w                    # square branch cut from the graph
      L.backward()
      print("detached: L =", L.data, "  dL/dw =", w.grad)

      w = Value(2.0)
      for step in (1, 2):                        # two backward passes, grad never cleared
          L = w**2 + 3*w
          L.backward()
          print(f"after backward #{step}: dL/dw =", w.grad)
      ```

      The first two lines reproduce the numbers you calculated by hand: 7 for this lesson's expression, 12 for the backpropagation lesson's model. The last three show the two traps in the next scenes. Try adding a ReLU method, with local slope 1 when the input is positive and 0 otherwise, and backpropagate through the forward-pass network.
    bridges: []
  - id: automatic-differentiation.s3
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.automatic-differentiation
    title: Forward mode and reverse mode
    markdown: |-
      Our engine works in **reverse mode**: run forward once, then sweep back from one output to all inputs. There's also **forward mode**, which carries a slope alongside every value as the code runs. Seed $w$ with the pair (value 2, slope 1), and every operation updates both:

      | Step | Value | Slope with respect to $w$ |
      | --- | ---: | ---: |
      | $w$ | 2 | 1 |
      | $u = w^2$ | 4 | $2w \times 1 = 4$ |
      | $v = 3w$ | 6 | $3 \times 1 = 3$ |
      | $L = u + v$ | 10 | $4 + 3 = 7$ |

      Same answer, 7. The difference is cost. Forward mode needs one pass *per input* you differentiate with respect to. Reverse mode needs one backward sweep *per output*. Training has one output (the loss) and millions or billions of inputs (the weights), so reverse mode wins by a factor of millions. That's why deep learning runs on reverse mode, which Seppo Linnainmaa described in 1970.

      :::mixup "Reverse mode means the network learns by running backward in time."
      "Forward" and "reverse" describe the order in which the bookkeeping multiplies slopes, not anything about time or learning. Learning happens only later, when an optimizer uses the gradients.
      :::
    bridges: []
  - id: automatic-differentiation.s4
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.automatic-differentiation
    title: A detached value keeps its number but loses its slope
    markdown: |-
      Sometimes you want a value to count in the forward pass but block gradients from flowing through it. Frameworks call this **detaching** (PyTorch's `.detach()`, JAX's `stop_gradient`). A detached value is a copy of the number with no record of where it came from.

      Detach $u$ in our example, so $L = \text{detach}(w^2) + 3w$. At $w = 2$ the forward value is still 10. But the square's route is gone, so $\partial L / \partial w = 3$. The engine above prints exactly that.

      Detaching on purpose is common: to hold a target value fixed while you train toward it, or to freeze part of a model. Detaching by accident is a classic silent bug. The loss looks normal, training runs, and part of the network never learns.

      ```python
      import torch
      w = torch.tensor(2.0, requires_grad=True)
      L = w.detach() ** 2 + 3 * w
      L.backward()
      print(L.item(), w.grad)      # 10.0 tensor(3.)
      ```
    bridges: []
  - id: automatic-differentiation.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.automatic-differentiation
    markdown: Differentiate a two-route expression at new points, then diagnose a frozen layer, a doubled gradient, and a method that nudges instead of differentiating.
    takeaway: |-
      Autodiff records each operation's local slope as your code runs, then sweeps backward to get exact gradients. It differentiates the code you actually ran, so watch for detached values and gradients that pile up between steps.
  - id: automatic-differentiation.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.automatic-differentiation
    markdown: |-
      Automatic differentiation applies local derivative rules through a computation graph; gradient accumulation, graph breaks, and numerical checks determine whether the intended update is implemented.
  - id: automatic-differentiation.s5
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.automatic-differentiation
    title: Gradients pile up until you clear them
    markdown: |-
      Look at the last two lines the engine printed: 7, then 14. Each backward pass *adds* into `grad` (the `+=` in the code), and nothing cleared it between passes. PyTorch behaves the same way, which is why a training loop calls `optimizer.zero_grad()` before each backward pass.

      :::predict Three backward passes each contribute 7, with no clearing. The optimizer then steps with learning rate 0.1. How far does w move?
      The stored gradient is 7 + 7 + 7 = 21, so $w$ moves by $0.1 \times 21 = 2.1$ instead of 0.7. The step is three times too large, and nothing crashes to warn you.
      :::

      Adding up is a feature, not a flaw. It's how **gradient accumulation** works (from the lesson on stochastic gradients): when a batch is too big for memory, run backward on several smaller pieces and let their gradients add, then take one step and clear. Just decide where each step's gradient starts and ends, and whether the pieces' losses should be summed or averaged.
    bridges: []
  - id: automatic-differentiation.s6
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.automatic-differentiation
    title: It differentiates the code you wrote
    markdown: |-
      Autodiff is exact, but it's exact about *your code*, not your intentions. If you meant $L = w^2 + 3w$ but typed `w**2 + 3`, it faithfully returns the slope $2w = 4$, with no warning that the $3w$ term went missing. If the loss compares predictions with the wrong column of targets, you get perfect gradients of the wrong goal.

      So test a new model on a tiny input: compare autodiff's gradients with a hand calculation or the central-difference check from the gradient-checking lesson. When they agree, the engine is fine, and any remaining problem lives in what you asked it to differentiate, which is where the checks from the lesson on debugging training runs take over.
    bridges: []
  - id: automatic-differentiation.s7
    type: question
    depth: mechanics
    objective_refs:
      - objective.automatic-differentiation
    title: The value is right but the derivative is wrong
    markdown: At w=2, L=w²+3w has value 10. The w² branch is detached. What derivative is left?
    bridges: []
    question:
      response_type: single_choice
      options:
        - id: a
          text: '3'
        - id: b
          text: '7'
        - id: c
          text: '10'
      answer: a
      reveal_markdown: |-
        Detaching the square branch removes its derivative contribution. The remaining 3w branch contributes 3, even though the forward value is unchanged.
      hint: "A detached branch keeps its value but sends no gradient back. Which route to w is still connected, and what is its slope?"
      id: automatic-differentiation.practice.v2.7
