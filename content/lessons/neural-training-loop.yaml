schema_version: 0.2-draft
lesson:
  id: neural-training-loop
  version: 0.2.1-draft
  title: Connect data, gradients, and saved model state
  state: draft
  summary: Run one complete learning step with a tiny prediction, then identify which parts must repeat and which
    must stay protected.
  slot: M11.7
  category: learning
  sources:
  - title: Dive into Deep Learning — computational graphs and backpropagation
    url: https://d2l.ai/chapter_multilayer-perceptrons/backprop.html
  - title: Biderman et al. — Pythia, a suite for analyzing language-model training
    url: https://arxiv.org/abs/2304.01373
  archetype: mechanism
objectives:
- id: objective.neural-training-loop
  version: 2-draft
  statement: Trace forward loss, backward gradient, and an optimizer update while separating training batches from
    validation and checkpoint selection.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - neural-training-loop.base.v2
  - neural-training-loop.transfer.v2
  prerequisites:
  - anyOf:
    - objective.automatic-differentiation
  - anyOf:
    - objective.stochastic-gradients
  - anyOf:
    - objective.residuals-normalization-dropout
scenes:
- id: neural-training-loop.s1
  type: explanation
  depth: intuition
  objective_refs:
  - objective.neural-training-loop
  title: Give the model a small job
  markdown: A **training loop** repeatedly uses examples to adjust model parameters. A **batch** is the group of
    examples used for a particular calculation. To see the whole loop, use one example with input x=2 and target
    t=5. Our model predicts p=w×x, starting at w=1. The target is provided by the task; the model does not choose
    it to make its score look better. We will use squared error as the loss and an explicitly stated update rule.
  text_mode: A **training loop** repeatedly uses examples to adjust model parameters. A **batch** is the group of
    examples used for a particular calculation. To see the whole loop, use one example with input x=2 and target
    t=5. Our model predicts p=w×x, starting at w=1. The target is provided by the task; the model does not choose
    it to make its score look better. We will use squared error as the loss and an explicitly stated update rule.
  bridges: []
- id: neural-training-loop.s2
  type: explanation
  depth: intuition
  objective_refs:
  - objective.neural-training-loop
  title: Predict, then measure the miss
  markdown: The forward pass gives p=1×2=2. Subtract the target to get residual 2−5=−3. Squaring produces loss 9.
    This step computes values but leaves w unchanged. For a larger batch, define whether its losses are summed or
    averaged. The reduction changes the scale of the gradient. Keep the input, target, prediction, residual, and
    loss in separate table columns; this helps catch a missing target shift or an incorrect sign before changing
    any settings.
  text_mode: The forward pass gives p=1×2=2. Subtract the target to get residual 2−5=−3. Squaring produces loss
    9. This step computes values but leaves w unchanged. For a larger batch, define whether its losses are summed
    or averaged. The reduction changes the scale of the gradient. Keep the input, target, prediction, residual,
    and loss in separate table columns; this helps catch a missing target shift or an incorrect sign before changing
    any settings.
  bridges:
  - neural-forward-pass
- id: neural-training-loop.s3
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.neural-training-loop
  title: Calculate sensitivity and make one update
  markdown: 'The derivative of L=(w×x−t)² with respect to w is 2(w×x−t)×x. Here it is 2×(−3)×2=−12. With learning
    rate 0.1, subtract the scaled derivative: w becomes 1−0.1×(−12)=2.2. This small example uses plain gradient
    descent. Momentum or adaptive optimizers carry additional state and change the update rule, but the boundary
    between calculating a gradient and applying an optimizer step remains useful.'
  text_mode: 'The derivative of L=(w×x−t)² with respect to w is 2(w×x−t)×x. Here it is 2×(−3)×2=−12. With learning
    rate 0.1, subtract the scaled derivative: w becomes 1−0.1×(−12)=2.2. This small example uses plain gradient
    descent. Momentum or adaptive optimizers carry additional state and change the update rule, but the boundary
    between calculating a gradient and applying an optimizer step remains useful.'
  bridges:
  - backpropagation
  - derivatives
  - multivariable-calculus
  - chain-rule
  figure:
    kind: parameter-training
    caption: Extend the one-weight example to a line with both a weight and a bias, fitted to three explicit points.
    description: Fit prediction=weight×input+bias to (0,1), (1,3), and (2,5). Mean squared error depends on both
      parameters. Compute both partial derivatives at the current pair before updating them together.
- id: neural-training-loop.s4
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.neural-training-loop
  title: Recompute instead of recycling old values
  markdown: At the updated weight, p=2.2×2=4.4, residual is −0.6, and loss is 0.36. Reusing the old prediction 2
    would falsely suggest that learning changed nothing. The next step needs a fresh forward calculation and the
    intended gradient-storage reset or accumulation. One **epoch** is a pass through the defined training dataset;
    one optimizer **step** is a parameter update. They coincide only under special choices of dataset and batch
    size.
  text_mode: At the updated weight, p=2.2×2=4.4, residual is −0.6, and loss is 0.36. Reusing the old prediction
    2 would falsely suggest that learning changed nothing. The next step needs a fresh forward calculation and the
    intended gradient-storage reset or accumulation. One **epoch** is a pass through the defined training dataset;
    one optimizer **step** is a parameter update. They coincide only under special choices of dataset and batch
    size.
  bridges: []
- id: neural-training-loop.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.neural-training-loop
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Batch, predict, score, differentiate, update. Validation observes a fixed candidate; it does not join
    the update step.
- id: neural-training-loop.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.neural-training-loop
  markdown: A neural training loop coordinates batches, forward loss, backward derivatives, optimizer updates, evaluation,
    and checkpoints; a restart needs more state than weights alone.
  text_mode: A neural training loop coordinates batches, forward loss, backward derivatives, optimizer updates,
    evaluation, and checkpoints; a restart needs more state than weights alone.
- id: neural-training-loop.s5
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.neural-training-loop
  title: Pause to observe a candidate
  markdown: Validation evaluates current settings without fitting them to those validation examples. It can help
    choose when to stop or which saved **checkpoint** to retain. A checkpoint stores a version of model state; resuming
    the same training process may also require optimizer, random-generator, and data-position state. A falling training
    loss does not guarantee improving validation performance. Keep final test results protected from this repeated
    selection loop.
  text_mode: Validation evaluates current settings without fitting them to those validation examples. It can help
    choose when to stop or which saved **checkpoint** to retain. A checkpoint stores a version of model state; resuming
    the same training process may also require optimizer, random-generator, and data-position state. A falling training
    loss does not guarantee improving validation performance. Keep final test results protected from this repeated
    selection loop.
  bridges: []
- id: neural-training-loop.s6
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.neural-training-loop
  title: Debug the smallest repeatable run
  markdown: Try fitting a tiny clean batch before scaling up. Inspect that the intended parameters receive gradients,
    the optimizer uses the expected rate, and the loss behaves sensibly. Some cases cannot be perfectly fitted because
    the architecture or labels make that impossible, so interpret the diagnostic in context. Record the data version,
    model settings, random seeds, and measurements. Remember “batch, predict, score, differentiate, update,” with
    a separate lane for evaluation and checkpoint decisions.
  text_mode: Try fitting a tiny clean batch before scaling up. Inspect that the intended parameters receive gradients,
    the optimizer uses the expected rate, and the loss behaves sensibly. Some cases cannot be perfectly fitted because
    the architecture or labels make that impossible, so interpret the diagnostic in context. Record the data version,
    model settings, random seeds, and measurements. Remember “batch, predict, score, differentiate, update,” with
    a separate lane for evaluation and checkpoint decisions.
  bridges: []
- id: neural-training-loop.s7
  type: question
  depth: mechanics
  objective_refs:
  - objective.neural-training-loop
  title: A weight changed; what happens next?
  markdown: The optimizer changes w from 1 to 2.2. A learner reports the old prediction 2 as the updated result
    for x=2. Which repair is needed?
  text_mode: The optimizer changes w from 1 to 2.2. A learner reports the old prediction 2 as the updated result
    for x=2. Which repair is needed?
  bridges: []
  question:
    response_type: single_choice
    options:
    - id: a
      text: Run the forward calculation again using w=2.2.
    - id: b
      text: Subtract the learning rate from the old prediction.
    - id: c
      text: Reuse the old prediction because the input stayed fixed.
    answer: a
    reveal_markdown: The input stayed fixed but the model setting changed. Recompute 2.2×2=4.4 before calculating
      the new loss.
    hint: Trace the example using the rule from the preceding pages.
    id: neural-training-loop.practice.v2.7
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - neural-training-loop.s1
    - neural-training-loop.s2
    - neural-training-loop.s3
    - neural-training-loop.s4
    - neural-training-loop.s5
