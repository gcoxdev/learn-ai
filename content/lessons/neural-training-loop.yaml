  numeric_fields:
  - id: loss
    label: Loss before update
  - id: gradient
    label: Full derivative
  - id: next
    label: Weight after update
  absolute_tolerance: 1.0e-06
- id: neural-training-loop.transfer.v2
  objective_ref: objective.neural-training-loop
  task: transfer
  response_type: single_choice
  points: 1
  hint: Work through the example one step at a time before answering.
  remediation_scene: neural-training-loop.s3
  variants:
  - prompt: A dataset has 12 examples and batches of 3, with one update per batch. How many optimizer steps make
      one full pass?
    answer: a
    options:
    - id: b
      text: '3'
    - id: a
      text: '4'
    - id: c
      text: '12'
    feedback: Twelve examples divided into groups of three give four updates per epoch under this setup.
    id: neural-training-loop.transfer.v2.1
  - prompt: Why keep validation outside the gradient-fitting batch?
    answer: a
    options:
    - id: b
      text: Validation examples have no measurable targets
    - id: c
      text: Its loss must be zero before the optimizer is allowed to update
    - id: a
      text: Its role is to guide evaluation and selection of candidates
    feedback: The partition’s job determines its use; validation should not become ordinary fitting data.
    id: neural-training-loop.transfer.v2.2
  - prompt: The next forward pass uses old cached activations after weights changed. What is wrong?
    answer: a
    options:
    - id: a
      text: Those values may no longer match the current model settings
    - id: c
      text: Every activation is an unchanging model parameter
    - id: b
      text: The learning rate must be set to zero permanently
    feedback: Activations depend on the current computation and may need to be recomputed after updates.
    id: neural-training-loop.transfer.v2.3
  - prompt: What can be needed to resume training beyond the saved model weights?
    answer: a
    options:
    - id: c
      text: Only the last validation score
    - id: b
      text: The architecture configuration without the optimizer’s accumulated state
    - id: a
      text: Optimizer, random-generator, and data-position state
    feedback: Training state includes more than the weights needed for a plain forward pass.
    id: neural-training-loop.transfer.v2.4
