assessment_families:
- id: neural-training-loop.base
  objective_ref: objective.neural-training-loop
  task: base
  response_type: single_choice
  points: 1
  hint: 'Trace an accumulation boundary: trace the inputs, operation, and result before choosing.'
  remediation_scene: neural-training-loop.s2
  variants:
  - id: neural-training-loop.base.1
    prompt: Which step changes parameters in an ordinary training loop?
    options:
    - id: a
      text: The optimizer update
    - id: b
      text: Only printing the loss
    - id: c
      text: Only loading a validation image
    answer: a
    feedback: Forward and backward computation supply information; the update applies the change.
  - id: neural-training-loop.base.2
    prompt: What extra state may Adam training resume need beyond weights?
    options:
    - id: b
      text: Only the model title
    - id: c
      text: Only the final output text
    - id: a
      text: Moment buffers and schedule position
    answer: a
    feedback: Optimizer and schedule history affect subsequent updates.
- id: neural-training-loop.transfer
  objective_ref: objective.neural-training-loop
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Check the loop before scaling: trace the inputs, operation, and result before choosing.'
  remediation_scene: neural-training-loop.s4
  variants:
  - id: neural-training-loop.transfer.1
    prompt: Two unequal microbatches are averaged equally despite different example counts. What can change?
    options:
    - id: b
      text: Nothing under all conditions
    - id: c
      text: Only file size
    - id: a
      text: The effective weighting of examples in the objective
    answer: a
    feedback: Equal averages of unequal groups need not equal the overall example mean.
  - id: neural-training-loop.transfer.2
    prompt: Validation loss is accidentally included in backward propagation. What boundary is broken?
    options:
    - id: c
      text: The definition of a matrix
    - id: a
      text: Held-out evaluation now influences training
    - id: b
      text: Only the rendering layout
    answer: a
    feedback: Validation information has entered parameter fitting.
