  - id: neural-training-loop.transfer
    objective_ref: objective.neural-training-loop
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Check the loop before scaling: trace the inputs, operation, and result before choosing.'
    remediation_scene: neural-training-loop.s4
    variants:
      - id: neural-training-loop.transfer.1
        prompt: Two unequal microbatches are averaged equally despite different example counts. What can change?
        options:
          - id: b
            text: Nothing under all conditions
          - id: c
            text: Only file size
          - id: a
            text: The effective weighting of examples in the objective
        answer: a
        feedback: Equal averages of unequal groups need not equal the overall example mean.
        retired: true
      - id: neural-training-loop.transfer.2
        prompt: Validation loss is accidentally included in backward propagation. What boundary is broken?
        options:
          - id: c
            text: The definition of a matrix
          - id: a
            text: Held-out evaluation now influences training
          - id: b
            text: Only the rendering layout
        answer: a
        feedback: Validation information has entered parameter fitting.
        retired: true
  - id: neural-training-loop.base.v2
    objective_ref: objective.neural-training-loop
    task: base
    response_type: numeric_fields_with_reason
    points: 1
    hint: 'Forward: p = w × x and L = (p − t)². Backward: dL/dw = 2(p − t) × x. Update: subtract 0.1 × that gradient from w, keeping its sign.'
    remediation_scene: neural-training-loop.s3
    variants:
      - prompt: Use p=w×x, L=(p−t)², and learning rate 0.1 with w=1, x=2, t=4. Record loss, derivative dL/dw, and next w.
        answers:
          loss: 4
          gradient: -8
          next: 1.8
        reason_answer: a
        reason_options:
          - id: c
            text: Add 0.1 times the signed derivative to w.
          - id: a
            text: Subtract 0.1 times the signed full derivative from w.
          - id: b
            text: Subtract 0.1 times the loss from w.
        feedback: "p = 2, residual −2, loss 4. The gradient is 2 × (−2) × 2 = −8, so w = 1 − 0.1 × (−8) = 1.8. Subtracting a negative gradient raises w, which is what the too-low prediction needs."
        id: neural-training-loop.base.v2.1
      - prompt: Use p=w×x, L=(p−t)², and learning rate 0.1 with w=2, x=1, t=5. Record loss, derivative dL/dw, and next w.
        answers:
          loss: 9
          gradient: -6
          next: 2.6
        reason_answer: a
        reason_options:
          - id: b
            text: Subtract 0.1 times the loss from w.
          - id: c
            text: Add 0.1 times the signed derivative to w.
          - id: a
            text: Subtract 0.1 times the signed full derivative from w.
        feedback: "p = 2, residual −3, loss 9. The gradient is 2 × (−3) × 1 = −6, so w = 2 − 0.1 × (−6) = 2.6. Using the loss 9 in place of the gradient would move w the wrong way."
        id: neural-training-loop.base.v2.2
      - prompt: Use p=w×x, L=(p−t)², and learning rate 0.1 with w=0, x=3, t=2. Record loss, derivative dL/dw, and next w.
        answers:
          loss: 4
          gradient: -12
          next: 1.2
        reason_answer: a
        reason_options:
          - id: a
            text: Subtract 0.1 times the signed full derivative from w.
          - id: b
            text: Subtract 0.1 times the loss from w.
          - id: c
            text: Add 0.1 times the signed derivative to w.
        feedback: "p = 0, residual −2, loss 4. The gradient is 2 × (−2) × 3 = −12, so w = 0 + 1.2 = 1.2. Adding the gradient instead would push w to −1.2."
        id: neural-training-loop.base.v2.3
      - prompt: Use p=w×x, L=(p−t)², and learning rate 0.1 with w=3, x=2, t=4. Record loss, derivative dL/dw, and next w.
        answers:
          loss: 4
          gradient: 8
          next: 2.2
        reason_answer: a
        reason_options:
          - id: a
            text: Subtract 0.1 times the signed full derivative from w.
          - id: b
            text: Subtract 0.1 times the loss from w.
          - id: c
            text: Add 0.1 times the signed derivative to w.
        feedback: "p = 6, residual 2, loss 4. The gradient is 2 × 2 × 2 = 8, so w = 3 − 0.8 = 2.2. The prediction was too high, so w goes down."
        id: neural-training-loop.base.v2.4
    numeric_fields:
      - id: loss
        label: Loss before update
      - id: gradient
        label: Full derivative
      - id: next
        label: Weight after update
    absolute_tolerance: 1e-6
  - id: neural-training-loop.transfer.v2
    objective_ref: objective.neural-training-loop
    task: transfer
    response_type: single_choice
    points: 1
    hint: Separate the loop's lanes; training batches update, validation only watches.
    remediation_scene: neural-training-loop.s5
    variants:
      - prompt: A dataset has 12 examples and batches of 3, with one update per batch. How many optimizer steps make one full pass?
        answer: a
        retired: true
        options:
          - id: b
            text: '3'
          - id: a
            text: '4'
          - id: c
            text: '12'
        feedback: Twelve examples divided into groups of three give four updates per epoch under this setup.
        id: neural-training-loop.transfer.v2.1
      - prompt: Why keep validation outside the gradient-fitting batch?
        answer: a
        retired: true
        options:
          - id: b
            text: Validation examples have no measurable targets
          - id: c
            text: Its loss must be zero before the optimizer is allowed to update
          - id: a
            text: Its role is to guide evaluation and selection of candidates
        feedback: The partition’s job determines its use; validation should not become ordinary fitting data.
        id: neural-training-loop.transfer.v2.2
      - prompt: The next forward pass uses old cached activations after weights changed. What is wrong?
        answer: a
        retired: true
        options:
          - id: a
            text: Those values may no longer match the current model settings
          - id: c
            text: Every activation is an unchanging model parameter
          - id: b
            text: The learning rate must be set to zero permanently
        feedback: Activations depend on the current computation and may need to be recomputed after updates.
        id: neural-training-loop.transfer.v2.3
      - prompt: What can be needed to resume training beyond the saved model weights?
        answer: a
        retired: true
        options:
          - id: c
            text: Only the last validation score
          - id: b
            text: The architecture configuration without the optimizer’s accumulated state
          - id: a
            text: Optimizer, random-generator, and data-position state
        feedback: Training state includes more than the weights needed for a plain forward pass.
        id: neural-training-loop.transfer.v2.4
  - id: neural-training-loop.transfer.v3
    objective_ref: objective.neural-training-loop
    task: transfer
    response_type: single_choice
    points: 1
    hint: Picture the loop and its side lanes. Training batches drive the updates, validation only watches and picks checkpoints, the test set is used once at the end, and a resumable checkpoint holds everything the next step needs.
    remediation_scene: neural-training-loop.s6
    variants:
      - id: neural-training-loop.transfer.v3.1
        prompt: A photo classifier trains on 10,000 images with batches of 50 and one update per batch. How many optimizer steps does it take in 3 epochs?
        options:
          - id: b
            text: '200'
          - id: c
            text: '30,000'
          - id: a
            text: '600'
          - id: d
            text: '150'
        answer: a
        feedback: One epoch is 10,000 / 50 = 200 steps, so 3 epochs are 600. Two hundred is a single epoch, and 30,000 counts examples seen rather than updates.
      - id: neural-training-loop.transfer.v3.2
        prompt: A team saves 40 checkpoints, picks the one with the best test-set score, and reports that score as the final result. What is wrong with this?
        options:
          - id: b
            text: Forty checkpoints are too many to compare fairly
          - id: a
            text: The test set was used to choose, so its score is too rosy
          - id: c
            text: Checkpoints should be chosen by training loss instead
          - id: d
            text: A test score is only valid for the very last checkpoint
        answer: a
        feedback: Choosing by test score turns the test set into a second validation set, and the chosen score is optimistically biased. Choose by validation loss, then evaluate once on the test set. Training loss is a worse guide, since it keeps falling as the model overfits.
      - id: neural-training-loop.transfer.v3.3
        prompt: A run using Adam crashes at step 8,000. You reload the saved weights and continue, and the loss jumps. What most likely went missing from the checkpoint?
        options:
          - id: d
            text: The validation set's labels
          - id: b
            text: The activation functions' settings
          - id: c
            text: The model's architecture file
          - id: a
            text: Adam's running averages and step count
        answer: a
        feedback: Adam keeps two running averages per weight plus a step count, and restarting them from zero changes the next updates, so the loss jumps. The architecture and activations had to be present already for the weights to load, and validation labels play no part in updates.
      - id: neural-training-loop.transfer.v3.4
        prompt: A script updates the weights each step but computes the next loss from the predictions it made before the update. The logged loss never changes. What is the fix?
        options:
          - id: c
            text: Lower the learning rate so the changes show up
          - id: a
            text: Rerun the forward pass with the new weights each step
          - id: b
            text: Clear the gradients right after computing the loss
          - id: d
            text: Save a checkpoint before every single update
        answer: a
        feedback: Predictions depend on the current weights, so each step needs a fresh forward pass after the update; reusing stale predictions hides all progress. A smaller learning rate would make changes even smaller, and clearing gradients or saving checkpoints doesn't recompute anything.
      - id: neural-training-loop.transfer.v3.5
        prompt: 'A model''s epoch log reads: training loss 0.80, 0.45, 0.22, 0.10; validation loss 0.85, 0.55, 0.50, 0.61. Which checkpoint should you keep?'
        options:
          - id: b
            text: Epoch 4, which has the lowest training loss
          - id: c
            text: Epoch 2, where both losses first fall together
          - id: a
            text: Epoch 3, which has the lowest validation loss
          - id: d
            text: Epoch 1, before any overfitting could begin
        answer: a
        feedback: Keep the checkpoint with the lowest validation loss, epoch 3 (0.50). At epoch 4 training loss keeps falling but validation rises, the sign of overfitting. Epochs 1 and 2 are simply less trained.
