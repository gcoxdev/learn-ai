schema_version: 0.2-draft
lesson:
  id: neural-training-loop
  version: 0.4.0-draft
  title: Connect data, gradients, and saved model state
  state: draft
  summary: The same five-line loop trains a four-neuron toy and a chatbot. Run it until a network discovers XOR on its own, then learn which checkpoint to keep.
  slot: M11.7
  category: learning
  sources:
    - title: Dive into Deep Learning — computational graphs and backpropagation
      url: https://d2l.ai/chapter_multilayer-perceptrons/backprop.html
    - title: PyTorch — optimizing model parameters (the training loop)
      url: https://docs.pytorch.org/tutorials/beginner/basics/optimization_tutorial.html
    - title: Biderman et al. — Pythia, a suite for analyzing language-model training
      url: https://arxiv.org/abs/2304.01373
  archetype: mechanism
objectives:
  - id: objective.neural-training-loop
    version: 3-draft
    statement: Trace forward loss, backward gradient, and an optimizer update while separating training batches from validation and checkpoint selection.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - neural-training-loop.base.v2
      - neural-training-loop.transfer.v3
