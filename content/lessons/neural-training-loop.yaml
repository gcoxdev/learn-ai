schema_version: 0.2-draft
lesson:
  id: neural-training-loop
  version: 0.1.0-draft
  title: Connect data, gradients, and saved model state
  state: draft
  summary: A neural training loop coordinates batches, forward loss, backward derivatives, optimizer updates, evaluation,
    and checkpoints; a restart needs more state than weights alone.
  slot: M11.7
  category: learning
  minutes: 12
  sources:
  - title: Dive into Deep Learning — authors’ open textbook
    url: https://d2l.ai/
objectives:
- id: objective.neural-training-loop
  version: 1-draft
  statement: A neural training loop coordinates batches, forward loss, backward derivatives, optimizer updates,
    evaluation, and checkpoints; a restart needs more state than weights alone.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - neural-training-loop.base
  - neural-training-loop.transfer
  prerequisites:
  - anyOf:
    - objective.automatic-differentiation
  - anyOf:
    - objective.stochastic-gradients
  - anyOf:
    - objective.residuals-normalization-dropout
scenes:
- id: neural-training-loop.s1
  title: One update has several stages
  type: explanation
  depth: intuition
  objective_refs:
  - objective.neural-training-loop
  markdown: Choose a batch, clear or manage gradient buffers, compute predictions, calculate the intended loss,
    differentiate it, and apply an optimizer update. The order matters. Evaluation runs a defined forward procedure
    on held-out data, ordinarily without parameter updates. Logging should distinguish training and evaluation metrics.
  text_mode: Choose a batch, clear or manage gradient buffers, compute predictions, calculate the intended loss,
    differentiate it, and apply an optimizer update. The order matters. Evaluation runs a defined forward procedure
    on held-out data, ordinarily without parameter updates. Logging should distinguish training and evaluation metrics.
  bridges: []
- id: neural-training-loop.s2
  title: Trace an accumulation boundary
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.neural-training-loop
  markdown: Suppose two microbatches each contribute half of an intended batch mean loss. Backpropagate both contributions,
    then update once and clear the buffers. Updating after each microbatch is a different trajectory. Unequal microbatch
    sizes or valid-token counts require appropriate weights to match the intended combined objective.
  text_mode: Suppose two microbatches each contribute half of an intended batch mean loss. Backpropagate both contributions,
    then update once and clear the buffers. Updating after each microbatch is a different trajectory. Unequal microbatch
    sizes or valid-token counts require appropriate weights to match the intended combined objective.
  bridges: []
- id: neural-training-loop.s3
  title: Save enough to resume
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.neural-training-loop
  markdown: Weights are sufficient for some inference uses, but resuming training can also require optimizer moments,
    schedule position, random states, data-order state, and configuration. A checkpoint should be versioned and
    recoverable. Restoring only a subset may be useful as a restart, but it is not identical continuation.
  text_mode: Weights are sufficient for some inference uses, but resuming training can also require optimizer moments,
    schedule position, random states, data-order state, and configuration. A checkpoint should be versioned and
    recoverable. Restoring only a subset may be useful as a restart, but it is not identical continuation.
  bridges: []
- id: neural-training-loop.s4
  title: Check the loop before scaling
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.neural-training-loop
  markdown: Try a small clean dataset, inspect parameter changes, and verify that validation examples do not drive
    gradients. Test checkpoint restore on a short run. Many apparent architecture failures come from mismatched
    targets, reductions, modes, or state handling in the loop.
  text_mode: Try a small clean dataset, inspect parameter changes, and verify that validation examples do not drive
    gradients. Test checkpoint restore on a short run. Many apparent architecture failures come from mismatched
    targets, reductions, modes, or state handling in the loop.
  bridges: []
- id: neural-training-loop.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.neural-training-loop
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
- id: neural-training-loop.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.neural-training-loop
  markdown: A neural training loop coordinates batches, forward loss, backward derivatives, optimizer updates, evaluation,
    and checkpoints; a restart needs more state than weights alone.
  text_mode: A neural training loop coordinates batches, forward loss, backward derivatives, optimizer updates,
    evaluation, and checkpoints; a restart needs more state than weights alone.
