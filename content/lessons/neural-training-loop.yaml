scenes:
  - id: neural-training-loop.s1
    type: explanation
    depth: intuition
    objective_refs:
      - objective.neural-training-loop
    title: Five lines that train every model
    markdown: |-
      You now have every piece: a forward pass, a loss, backpropagation, autodiff, and (from the optimization module) an update rule. A **training loop** runs them in a circle, once per batch, thousands or millions of times. In PyTorch the heart of it really is this short:

      ```python
      for x, t in batches:          # 1. take a batch of inputs and targets
          y = model(x)              # 2. forward pass
          loss = loss_fn(y, t)      # 3. score the predictions
          optimizer.zero_grad()     #    clear last step's gradients
          loss.backward()           # 4. backward pass (autodiff)
          optimizer.step()          # 5. update the weights
      ```

      The same loop, with a bigger model and more data, trains an image classifier or a large language model. What changes is scale, not shape. This lesson runs one trip around the loop by hand, then lets the loop teach a network XOR from scratch, and ends with the side lanes that keep a long run honest: validation and checkpoints.
    bridges: []
  - id: neural-training-loop.s2
    type: explanation
    depth: intuition
    objective_refs:
      - objective.neural-training-loop
    title: Steps 1 to 3, predict and measure the miss
    markdown: |-
      Use the smallest model possible so every number is visible: $p = w \times x$, starting at $w = 1$, with one example, input $x = 2$ and target $t = 5$. It's the same kind of one-weight model you updated in the optimization module, so we can move quickly.

      | Step | Calculation | Value |
      | --- | --- | ---: |
      | Forward | $p = 1 \times 2$ | 2 |
      | Residual | $p - t = 2 - 5$ | −3 |
      | Loss | $(-3)^2$ | 9 |

      Nothing has changed yet: $w$ is still 1. With a batch of several examples you'd also choose whether to add their losses or average them. Averaging is the usual choice, and it keeps the gradient's size from growing with the batch size (from the lesson on stochastic gradients).
    bridges:
      - neural-forward-pass
  - id: neural-training-loop.s3
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.neural-training-loop
    title: Steps 4 and 5, blame and update
    markdown: |-
      Backward: by the chain rule, $\partial L / \partial w = 2(p - t) \times x = 2 \times (-3) \times 2 = -12$. Update: with learning rate 0.1, plain gradient descent gives $w = 1 - 0.1 \times (-12) = 2.2$. The negative gradient says "raising $w$ lowers the loss," and the update does exactly that.

      :::papers The update rule, in the notation of papers
      $$\theta_{t+1} = \theta_t - \eta\, \nabla_\theta \frac{1}{|B|} \sum_{i \in B} L\big(f_\theta(x_i), y_i\big)$$
      $\theta$ collects every parameter (here just $w = 1$), $\eta$ is the learning rate (0.1), $B$ is the batch (one example, so $|B| = 1$), and $\nabla_\theta$ is the gradient from backpropagation (−12). So $\theta_1 = 1 - 0.1 \times (-12) = 2.2$. Momentum and Adam (from the optimization module) replace the simple subtraction with a smarter step but keep the same loop.
      :::

      The figure extends this to a line with a weight *and* a bias, fitted to three points. Compute both gradients at the current pair, then update both together.
    bridges:
      - backpropagation
      - derivatives
      - multivariable-calculus
      - chain-rule
    figure:
      kind: parameter-training
      caption: Extend the one-weight example to a line with both a weight and a bias, fitted to three explicit points.
      description: Fit prediction=weight×input+bias to (0,1), (1,3), and (2,5). Mean squared error depends on both parameters. Compute both partial derivatives at the current pair before updating them together.
  - id: neural-training-loop.s4
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.neural-training-loop
    title: Go around again with fresh numbers
    markdown: |-
      The next trip must start with a fresh forward pass using the new weight: $p = 2.2 \times 2 = 4.4$, residual $-0.6$, loss $0.36$, down from 9. Reusing the old prediction of 2 would make it look as if nothing had been learned.

      Two words count trips around the loop. One optimizer **step** is one update of the weights. One **epoch** is one full pass through the training set. With 12 examples in batches of 3, one epoch is 12 / 3 = 4 steps. Papers and logs usually report steps, because epochs depend on the dataset's size.
    bridges: []
  - id: neural-training-loop.s8
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.neural-training-loop
    title: Watch a network discover XOR
    markdown: |-
      In the nonlinearity lesson you built an XOR network by hand. Now give the loop four hidden ReLU units with *random* starting weights and let it find a solution itself. Every line of the loop is here: forward, score, backward (the backpropagation lesson's rules, written for a batch), and update.

      ```python run
      import numpy as np

      X = np.array([[0, 0], [1, 0], [0, 1], [1, 1]], dtype=float)
      t = np.array([0, 1, 1, 0], dtype=float)             # XOR targets

      rng = np.random.default_rng(0)                       # change the seed to try another start
      W1 = rng.normal(0, 1, (2, 4)); b1 = np.zeros(4)      # 2 inputs -> 4 hidden ReLU units
      W2 = rng.normal(0, 1, 4);      b2 = 0.0              # 4 hidden -> 1 output
      lr = 0.1

      for step in range(501):
          Z = X @ W1 + b1; H = np.maximum(0, Z)            # forward
          y = H @ W2 + b2
          loss = ((y - t) ** 2).mean()                     # score
          dy = 2 * (y - t) / len(t)                        # backward
          dW2, db2 = H.T @ dy, dy.sum()
          dZ = np.outer(dy, W2) * (Z > 0)
          dW1, db1 = X.T @ dZ, dZ.sum(axis=0)
          W1 -= lr * dW1; b1 -= lr * db1                   # update
          W2 -= lr * dW2; b2 -= lr * db2
          if step % 100 == 0:
              print(f"step {step:3d}  loss {loss:.4f}")

      print("predictions:   ", y.round(3))
      print("hidden weights:", W1.round(2).tolist())
      print("hidden biases: ", b1.round(2))
      print("output weights:", W2.round(2))
      ```

      The loss falls from 2.33 to essentially 0 in about 400 steps. Now read the learned weights; each column of the hidden weights is one unit. Units 1 and 2 are negative on all four inputs, so they're dead ReLUs contributing nothing. Unit 4 computes about $\text{ReLU}(0.98\,s)$ and unit 3 about $\text{ReLU}(1.21(s - 1))$, where $s = x_1 + x_2$. The output combines them with $1.02 \times 0.98 \approx 1$ and $-1.65 \times 1.21 \approx -2$. The loop rediscovered your hand-built network, $h_1 - 2h_2$.

      :::predict Change the seed from 0 to 5. Will the network still solve XOR?
      No. The loss gets stuck at 0.1667 with predictions near [0.33, 0.33, 1, 0.33]. Two of the four units are dead: one starts with no positive output on any example, and the other gets there within a few steps. A ReLU with slope 0 on every example gets no gradient to revive it, and the two survivors respond only to the (0, 1) input. The architecture can represent XOR (seed 0 proves it), but this start never finds it: expressivity and optimization are different questions. Change the three 4s in the shapes of `W1`, `b1`, and `W2` to 8, giving eight hidden units, and rerun seed 5: with spare units, it solves XOR.
      :::
    bridges: []
  - id: neural-training-loop.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.neural-training-loop
    markdown: Run one loop step by hand at new numbers, then count steps per epoch, pick a checkpoint without peeking at the test set, and repair a resumed run.
    takeaway: |-
      Every model trains with the same loop: batch, forward, loss, backward, update, and around again with fresh numbers. Validation only watches, and it's what you use to choose which saved checkpoint to keep.
  - id: neural-training-loop.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.neural-training-loop
    markdown: |-
      A neural training loop coordinates batches, forward loss, backward derivatives, optimizer updates, evaluation, and checkpoints; a restart needs more state than weights alone.
  - id: neural-training-loop.s5
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.neural-training-loop
    title: Validation watches; it never trains
    markdown: |-
      Training loss tells you how well the model fits the examples it's learning from. To see how it does on new data, set aside a **validation set** and evaluate on it every so often, with no backward pass and no update, and with dropout switched off. Validation examples must never enter a training batch, or they stop measuring anything new.

      A **checkpoint** is a saved snapshot of the run. For choosing a model, the weights are enough. To *resume* training exactly, also save the optimizer's state and the step count, as the Adam lesson showed, plus the random-number and data-position state. Large projects save many checkpoints; the Pythia models, for example, were released with checkpoints from across training so researchers could study how learning unfolds.

      :::mixup "The checkpoint with the lowest training loss is the best model."
      Training loss usually keeps falling long after the model has stopped improving on new data. Choose checkpoints by validation performance.
      :::
    bridges: []
  - id: neural-training-loop.s6
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.neural-training-loop
    title: Pick the checkpoint to keep
    markdown: |-
      A small run has 12 training examples in batches of 3, so each epoch is 4 steps. After every epoch it evaluates on validation data and saves a checkpoint:

      | Epoch | Steps so far | Training loss | Validation loss |
      | ---: | ---: | ---: | ---: |
      | 1 | 4 | 0.90 | 0.95 |
      | 2 | 8 | 0.40 | 0.52 |
      | 3 | 12 | 0.15 | 0.38 |
      | 4 | 16 | 0.05 | 0.47 |

      Keep the epoch-3 checkpoint. Training loss keeps dropping at epoch 4, but validation loss turns up: the model has started memorizing its 12 examples, and the widening difference is the generalization gap. Stopping at the validation minimum is called **early stopping**.

      Then, and only then, evaluate the chosen checkpoint *once* on the test set, and report that number. If you had picked the checkpoint by test score, the test set would have become a second validation set, and its score would be optimistically biased.
    bridges: []
    diagram:
      caption: The training loop, with its two side lanes.
      description: A batch feeds the forward pass, which feeds the loss. The loss feeds the backward pass, which feeds the update, and the update loops back to the next batch. Every epoch, the current weights are also sent to a validation check, which decides which checkpoint to save. Validation never feeds the update.
      nodes:
        - id: batch
          label: Take a batch
          col: 0
          row: 0
          tone: data
        - id: forward
          label: Forward pass
          col: 1
          row: 0
        - id: loss
          label: Loss
          col: 2
          row: 0
          tone: warn
        - id: backward
          label: Backward pass
          col: 2
          row: 1
        - id: update
          label: Update weights
          col: 1
          row: 1
          tone: accent
        - id: validate
          label: Validation check
          note: no backward, no update
          col: 1
          row: 2
          tone: muted
        - id: save
          label: Save checkpoint
          note: best validation wins
          col: 2
          row: 2
          tone: data
      edges:
        - from: batch
          to: forward
        - from: forward
          to: loss
        - from: loss
          to: backward
        - from: backward
          to: update
        - from: update
          to: batch
          label: next step
        - from: update
          to: validate
          label: every epoch
          dashed: true
        - from: validate
          to: save
          dashed: true
  - id: neural-training-loop.s7
    type: question
    depth: mechanics
    objective_refs:
      - objective.neural-training-loop
    title: A weight changed; what happens next?
    markdown: |-
      The optimizer changes w from 1 to 2.2. A learner reports the old prediction 2 as the updated result for x=2. Which repair is needed?
    bridges: []
    question:
      response_type: single_choice
      options:
        - id: a
          text: Run the forward calculation again using w=2.2.
        - id: b
          text: Subtract the learning rate from the old prediction.
        - id: c
          text: Reuse the old prediction because the input stayed fixed.
      answer: a
      reveal_markdown: |-
        The input stayed fixed but the model setting changed. Recompute 2.2×2=4.4 before calculating the new loss.
      hint: "The input stayed the same, but a parameter changed. Which step of the loop depends on the parameters?"
      id: neural-training-loop.practice.v2.7
