schema_version: 0.2-draft
lesson:
  id: federated-and-decentralized-learning
  version: 0.4.0-draft
  title: Coordinate learning while data remain distributed
  state: draft
  summary: Your phone's keyboard gets better at predicting your next word, yet your messages never leave the phone. See how millions of phones train one model, and what privacy that does and doesn't buy.
  slot: M31.8
  category: learning
  sources:
    - title: "Communication-Efficient Learning of Deep Networks from Decentralized Data (McMahan et al., 2017), the FedAvg paper"
      url: https://arxiv.org/abs/1602.05629
    - title: "Federated Learning for Mobile Keyboard Prediction (Hard et al., 2018)"
      url: https://arxiv.org/abs/1811.03604
    - title: "Practical Secure Aggregation for Privacy-Preserving Machine Learning (Bonawitz et al., 2017)"
      url: https://research.google/pubs/practical-secure-aggregation-for-privacy-preserving-machine-learning/
    - title: "Federated Learning with Formal Differential Privacy Guarantees (Google Research blog, 2022)"
      url: https://research.google/blog/federated-learning-with-formal-differential-privacy-guarantees/
    - title: "Federated Learning of Gboard Language Models with Differential Privacy (Xu et al., 2023)"
      url: https://arxiv.org/abs/2305.18465
objectives:
  - id: objective.federated-and-decentralized-learning
    version: 2-draft
    statement: Compute a FedAvg round as a data-weighted average, explain how non-IID clients and local steps cause drift, weigh communication cost, and separate what secure aggregation and differential privacy each protect.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - federated-and-decentralized-learning.base.v2
      - federated-and-decentralized-learning.transfer.v2
      - federated-and-decentralized-learning.calculate
    prerequisites:
      - anyOf:
          - objective.data-parallel-training
      - anyOf:
          - objective.privacy-and-memorization
scenes:
  - id: federated-and-decentralized-learning.s1
    title: The model visits the data
    type: explanation
    depth: intuition
    objective_refs:
      - objective.federated-and-decentralized-learning
    markdown: |-
      A phone keyboard suggests your next word. The best training data for that is what people actually type, which is exactly the data nobody wants uploaded to a server.

      **Federated learning** turns training around: instead of collecting the data, the server sends the model to the data. One **round** goes like this:

      1. The server picks a few hundred phones that are idle, charging, and on Wi-Fi.
      2. Each phone downloads the current model and trains it for a few steps on its owner's recent typing.
      3. Each phone sends back only its updated weights, never the text.
      4. The server averages the weights into a new global model, and the next round begins.

      This is the data-parallel training from module 17, with three hard changes. The "workers" are millions of unreliable phones, each holds data from one person, and they may drop out at any moment.

      Google described this setup for its Gboard keyboard. Hard et al. (2018) trained Gboard's next-word prediction model with federated learning and found better prediction recall than a model trained on the server, because the phones held better data for the job than the server did.
    diagram:
      caption: One round of federated averaging. Weights travel; typing stays on the phones.
      description: The server sends the global model to phones A, B, and C. Each phone trains locally on its own typing and sends updated weights back to the server's averaging step, which weights each phone by how much data it trained on. The average becomes the global model for the next round.
      nodes:
        - id: global
          label: Global model
          note: round t
          col: 0
          row: 1
          tone: accent
        - id: phone-a
          label: Phone A
          note: 100 sentences
          col: 2
          row: 0
          tone: data
        - id: phone-b
          label: Phone B
          note: 300 sentences
          col: 2
          row: 1
          tone: data
        - id: phone-c
          label: Phone C
          note: 600 sentences
          col: 2
          row: 2
          tone: data
        - id: average
          label: Weighted average
          note: "0.1, 0.3, 0.6: next round's global model"
          col: 4
          row: 1
          tone: warn
      edges:
        - from: global
          to: phone-a
          label: send model
        - from: global
          to: phone-b
        - from: global
          to: phone-c
        - from: phone-a
          to: average
          label: local weights
        - from: phone-b
          to: average
        - from: phone-c
          to: average
    bridges: []
  - id: federated-and-decentralized-learning.s5
    title: Average by how much each phone saw
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.federated-and-decentralized-learning
    markdown: |-
      Take a tiny model with two weights. After local training, three phones send back:

      | Phone | Sentences trained on | Share of data | Local weights |
      | --- | ---: | ---: | --- |
      | A | 100 | 0.1 | (1.0, 2.0) |
      | B | 300 | 0.3 | (2.0, 0.0) |
      | C | 600 | 0.6 | (0.5, 1.0) |

      **Federated averaging (FedAvg)** weights each phone by its share of the data:

      $$0.1 \times (1.0, 2.0) + 0.3 \times (2.0, 0.0) + 0.6 \times (0.5, 1.0) = (1.0,\ 0.8)$$

      A plain mean of the three phones would give (1.167, 1.0), counting phone A's 100 sentences as much as phone C's 600.

      :::papers FedAvg (McMahan et al., 2017)
      $$w_{t+1} = \sum_{k=1}^{K} \frac{n_k}{n}\, w_{t+1}^{k}$$

      $w_{t+1}^{k}$ is client $k$'s weights after $E$ local epochs of SGD, starting from the global $w_t$. $n_k$ is client $k$'s number of examples, and $n = \sum_k n_k$ over the clients in this round. Here $n_k / n$ is 0.1, 0.3, and 0.6. The paper showed that running several local epochs before averaging cut the number of communication rounds by 10–100× compared with averaging after every single gradient step.
      :::

      ```python run
      import numpy as np

      # After local training this round: each phone's weights and how many sentences it trained on
      clients = {
          "phone A": (np.array([1.0, 2.0]), 100),
          "phone B": (np.array([2.0, 0.0]), 300),
          "phone C": (np.array([0.5, 1.0]), 600),
      }
      n_total = sum(n for _, n in clients.values())

      fedavg = sum((n / n_total) * w for w, n in clients.values())
      plain = sum(w for w, _ in clients.values()) / len(clients)

      for name, (w, n) in clients.items():
          print(f"{name}: {n:3d} sentences, weight {n / n_total:.1f}, local w = {w}")
      print("FedAvg (weighted by data):", np.round(fedavg, 3))
      print("plain mean of phones:     ", np.round(plain, 3))
      ```

      Weighting by data serves the average *sentence*: the model you'd get by pooling everyone's text. Weighting phones equally serves the average *user*, so light typists count as much as heavy ones. Neither is wrong; choose on purpose. Try giving phone A 1,000 sentences and see the average swing toward (1.0, 2.0).
    bridges: []
  - id: federated-and-decentralized-learning.s2
    title: When every phone pulls a different way
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.federated-and-decentralized-learning
    markdown: |-
      In a data center, each worker gets a random slice of the same shuffled data. Phones don't. One person types in Spanish, another in emoji, a third mostly about football. Data like this, where each client's distribution differs from the whole, is called **non-IID** (not independent and identically distributed).

      Non-IID data makes local steps pull apart. Each phone trains toward what's best for *its* data, and the longer it trains before averaging, the further it drifts. This is **client drift**. In the program, two phones hold equal amounts of data, but phone A's loss $4w^2$ is steep and phone B's loss $(w - 10)^2$ is shallow. The best single model for both minimizes the sum, at $w = (4 \times 0 + 1 \times 10) / 5 = 2$.

      ```python run
      # Two phones with equal data but different local losses:
      #   phone A: 4 * (w - 0)**2      phone B: 1 * (w - 10)**2
      # The best single w for both together is (4*0 + 1*10) / 5 = 2.
      phones = {"A": (4.0, 0.0), "B": (1.0, 10.0)}   # (curvature, local best w)
      lr = 0.05

      def local_train(w, c, target, steps):
          for _ in range(steps):
              w -= lr * 2 * c * (w - target)          # gradient step on c * (w - target)**2
          return w

      for steps in (1, 5, 50):
          w = 0.0
          for _ in range(200):                         # communication rounds
              w = sum(local_train(w, c, t, steps) for c, t in phones.values()) / 2
          print(f"{steps:2d} local steps per round -> FedAvg settles at w = {w:.2f}  (best is 2.00)")
      ```

      :::predict With 50 local steps, each phone reaches its own best w before averaging. Where does FedAvg settle?
      Near 5, halfway between phone A's 0 and phone B's 10. The average of two local optima ignores that phone A's loss is four times steeper. With one local step per round, FedAvg is plain gradient descent on the total loss and finds 2.00; five steps give 3.07.
      :::

      More local steps save communication but cost accuracy on non-IID data. Methods such as FedProx add a penalty that keeps each phone's weights near the global model during local training.
    bridges: []
  - id: federated-and-decentralized-learning.s4
    title: Rounds are the expensive part
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.federated-and-decentralized-learning
    markdown: |-
      A model with 10 million weights stored as 4-byte numbers is 40 MB. Each round, every chosen phone downloads 40 MB and uploads 40 MB, often on a slow home connection. A run of 2,000 rounds with 500 phones per round moves 2,000 × 500 × 80 MB = 80 TB in total. That's why federated systems:

      - **Train longer locally,** to need fewer rounds, and accept some drift.
      - **Compress updates,** for example by sending weights as 8-bit numbers, or only the largest changes.
      - **Expect dropouts.** A phone that gets unplugged mid-round just doesn't report, and the round goes ahead without it.

      Who participates shapes the model too. Phones often idle, charging, and on Wi-Fi are over-represented, so people without home Wi-Fi may be under-served. Measure quality per group of users.

      Some updates are simply wrong: a buggy phone, or an attacker sending huge weights to steer the model. Clipping each update's size, or aggregating with a median instead of a mean, limits the damage.

      **Decentralized learning** drops the central server: devices average weights with their neighbors, peer to peer, until the network agrees. No single party is trusted, but coordination is slower and harder to check.
    bridges: []
  - id: federated-and-decentralized-learning.s3
    title: Keeping data local is only the first layer
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.federated-and-decentralized-learning
    markdown: |-
      The text never leaves the phone, but the update does, and updates can reveal what they were trained on: a rare word whose weights suddenly jump points to someone who typed it. And as the privacy lesson (module 29) showed, the finished model can memorize rare sequences. Two further layers address these risks.

      **Secure aggregation** (Bonawitz et al., 2017) lets the server learn the *sum* of the updates but none of the individual ones. Phones A and B agree on a secret random number, say 7. A adds it to its update and B subtracts it:

      | | True update | Sent to the server |
      | --- | ---: | ---: |
      | Phone A | 3 | 3 + 7 = 10 |
      | Phone B | 5 | 5 − 7 = −2 |
      | **Server's sum** | | **8** |

      The masks cancel in the sum. The real protocol gives every pair of phones its own mask, and uses secret sharing so the sum survives dropouts.

      **Differential privacy (DP)** limits what the *final model* reveals about any one person. Each phone's update is clipped to a maximum size, and calibrated noise is added to the sum, so no single user can change the model much.

      :::story Gboard, step by step
      Gboard's early federated models used plain federated averaging. In 2022 Google announced a Spanish-language next-word model trained with a formal differential privacy guarantee, calling it, to Google's knowledge, the first production neural network trained directly on user data to be announced with one. By 2023, Xu et al. reported that all of Gboard's next-word prediction neural networks had such guarantees, and two of them were also trained with secure aggregation.
      :::

      :::mixup "Federated means private."
      Federated learning keeps raw data local. Secure aggregation hides individual updates from the server. Differential privacy limits what the model can reveal. Each covers a different leak, and a real system needs to say which ones it uses.
      :::
    bridges: []
  - id: federated-and-decentralized-learning.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.federated-and-decentralized-learning
    markdown: FedAvg weights and averages to compute, then hospitals, a privacy promise, overnight-charging phones, a poisoned update, and a bandwidth budget test how you'd run federated training.
    takeaway: |-
      FedAvg averages locally trained weights, weighted by each client's data. Non-IID clients drift apart with long local training, and privacy needs secure aggregation and differential privacy on top of keeping data local.
  - id: federated-and-decentralized-learning.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.federated-and-decentralized-learning
    markdown: |-
      Federated learning combines locally trained updates. Client selection and weighting shape who benefits, while privacy and faulty updates need separate controls.
