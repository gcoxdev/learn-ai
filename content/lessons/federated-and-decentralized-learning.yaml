assessment_families:
  - id: federated-and-decentralized-learning.base
    objective_ref: objective.federated-and-decentralized-learning
    task: base
    response_type: single_choice
    points: 1
    hint: 'Account for heterogeneous clients: trace the inputs, operation, and result before choosing.'
    remediation_scene: federated-and-decentralized-learning.s2
    variants:
      - id: federated-and-decentralized-learning.base.1
        prompt: What is commonly aggregated in federated training?
        options:
          - id: a
            text: Locally computed model updates
          - id: b
            text: Every raw record by definition
          - id: c
            text: Only user display names
        answer: a
        feedback: The protocol combines learned contributions.
        retired: true
      - id: federated-and-decentralized-learning.base.2
        prompt: Do equal-client and equal-record weights define the same objective?
        options:
          - id: b
            text: Always
          - id: c
            text: Only when data are heterogeneous
          - id: a
            text: Not generally
        answer: a
        feedback: Different weighting changes whose loss contributes how much.
        retired: true
  - id: federated-and-decentralized-learning.transfer
    objective_ref: objective.federated-and-decentralized-learning
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Evaluate communication and participation: trace the inputs, operation, and result before choosing.'
    remediation_scene: federated-and-decentralized-learning.s4
    variants:
      - id: federated-and-decentralized-learning.transfer.1
        prompt: Does keeping raw data local guarantee privacy?
        options:
          - id: b
            text: 'Yes'
          - id: c
            text: Only if gradients are sent
          - id: a
            text: 'No'
        answer: a
        feedback: Updates and surrounding systems can still leak information.
        retired: true
      - id: federated-and-decentralized-learning.transfer.2
        prompt: Why test client dropout and uneven data?
        options:
          - id: c
            text: Only server graphics change
          - id: a
            text: They affect realistic convergence, fairness, and communication
          - id: b
            text: All clients are identical by definition
        answer: a
        feedback: Federated assumptions must match the participating population.
        retired: true
  - id: federated-and-decentralized-learning.base.v2
    objective_ref: objective.federated-and-decentralized-learning
    task: base
    response_type: single_choice
    points: 1
    hint: Follow what travels in a round (the model down, weights back up) and how the server combines it (each client's share of the data). Then ask what each extra step hides.
    remediation_scene: federated-and-decentralized-learning.s5
    variants:
      - id: federated-and-decentralized-learning.base.v2.1
        prompt: In one FedAvg round, what does each phone send to the server?
        options:
          - id: b
            text: Its owner's recent typing, encrypted so the server can't read it
          - id: a
            text: Its model weights after a few steps of training on local data
          - id: c
            text: A separate gradient for every sentence its owner typed
        answer: a
        feedback: Phones train locally and send back weights (or the change in weights). Encrypted text would still be the raw data leaving the phone, and per-sentence gradients would cost far more communication and reveal more.
      - id: federated-and-decentralized-learning.base.v2.2
        prompt: Why does FedAvg weight each client by its number of examples?
        options:
          - id: a
            text: So the average matches what training on everyone's pooled data would favor
          - id: b
            text: So clients with more data, which are more trustworthy, get a louder voice
          - id: c
            text: So that each user counts equally regardless of how much they type
        answer: a
        feedback: Weighting by n_k / n makes each example count equally, like pooled training. It has nothing to do with trust, and counting each user equally is the other choice, equal client weighting.
      - id: federated-and-decentralized-learning.base.v2.3
        prompt: In the two-phone drift example, 50 local steps per round leads FedAvg to about 5, while the best shared weight is 2. What causes the gap?
        options:
          - id: c
            text: The learning rate is too high, so each round overshoots the target
          - id: a
            text: Each phone reaches its own optimum, and their plain average ignores the loss shapes
          - id: b
            text: Two hundred rounds are too few for so many local steps to converge
        answer: a
        feedback: With long local training, the phones return 0 and 10, and averaging gives 5 whatever the curvatures. With one local step, the same learning rate finds 2, so the step size isn't the cause, and more rounds wouldn't move the fixed point.
      - id: federated-and-decentralized-learning.base.v2.4
        prompt: What does secure aggregation let the server learn?
        options:
          - id: b
            text: Nothing at all, not even the combined update of all the phones
          - id: c
            text: Each update, but with the phone's identity removed
          - id: a
            text: The sum of the phones' updates, but not any single update
        answer: a
        feedback: The masks cancel in the sum, so the server gets exactly what it needs to average and no individual update. Without the sum it couldn't train, and an anonymized individual update can still reveal its contents.
      - id: federated-and-decentralized-learning.base.v2.5
        prompt: A team increases local training from 1 to 20 epochs per round. What trade-off should it expect on non-IID phones?
        options:
          - id: a
            text: Fewer rounds and less communication, but more client drift
          - id: b
            text: More rounds and more communication, but less client drift
          - id: c
            text: Better privacy, since each phone sends its weights less often
        answer: a
        feedback: Doing more work per round reduces how many rounds are needed, but each phone moves further toward its own optimum. Fewer messages don't add a formal privacy guarantee; that takes secure aggregation or differential privacy.
  - id: federated-and-decentralized-learning.transfer.v2
    objective_ref: objective.federated-and-decentralized-learning
    task: transfer
    response_type: single_choice
    points: 1
    hint: Name the specific risk (whose data dominates, what leaks and to whom, who never participates, or a bad update), then pick the control made for that risk.
    remediation_scene: federated-and-decentralized-learning.s3
    variants:
      - id: federated-and-decentralized-learning.transfer.v2.1
        prompt: Five hospitals train a model with FedAvg. One large city hospital holds 80% of the patients, and a small rural hospital reports the model works poorly for its patients. What should the group do first?
        options:
          - id: b
            text: Drop the rural hospital, since its small dataset adds noise to the average
          - id: a
            text: Measure quality per hospital and consider reweighting or local fine-tuning
          - id: c
            text: Switch to secure aggregation so the city hospital's updates stay hidden
        answer: a
        feedback: Data-weighted averaging serves the city hospital's patients most. Per-hospital results show the gap, and reweighting or local fine-tuning can close it. Secure aggregation protects privacy but doesn't change whose data dominates.
      - id: federated-and-decentralized-learning.transfer.v2.2
        prompt: An app promises, "Your messages never leave your phone, so our model can't reveal them." What is missing from that promise?
        options:
          - id: a
            text: Updates and the final model can still leak, which needs secure aggregation and DP
          - id: c
            text: Nothing, since the phone sends only numbers and never the words themselves
          - id: b
            text: The server needs a copy of the messages to check the updates are honest
        answer: a
        feedback: Weight updates can reveal rare words, and trained models can memorize. Secure aggregation hides individual updates, and differential privacy limits what the model reveals. Numbers can encode text, and sending the messages would break the design.
      - id: federated-and-decentralized-learning.transfer.v2.3
        prompt: A federated keyboard only trains on phones that are charging overnight on home Wi-Fi. Which users is the model likely to under-serve?
        options:
          - id: c
            text: Heavy typists, whose many sentences are down-weighted by FedAvg
          - id: b
            text: Users of the most popular language, whose updates cancel each other out
          - id: a
            text: People without home Wi-Fi or who rarely leave their phone charging
        answer: a
        feedback: The participation rule filters who contributes, so those who rarely qualify are under-represented. FedAvg gives heavy typists more weight, not less, and similar updates reinforce rather than cancel.
      - id: federated-and-decentralized-learning.transfer.v2.4
        prompt: In a federated round, one device sends an update a thousand times larger than the others, steering the global model. Which change limits the damage?
        options:
          - id: a
            text: Clip each update's size, or aggregate with a median instead of a mean
          - id: b
            text: Weight that device by its data size, as in standard FedAvg
          - id: c
            text: Add more local training steps so honest updates grow larger too
        answer: a
        feedback: Clipping and median-style aggregation stop one extreme update from dominating. Standard weighting would still let it through, and a malicious device can also lie about its data size. Longer local training adds drift without addressing the attack.
      - id: federated-and-decentralized-learning.transfer.v2.5
        prompt: A 40 MB model is trained on phones where many users pay for mobile data by the megabyte. Which change best reduces the cost to users?
        options:
          - id: b
            text: Average after every single gradient step, so each update is smaller
          - id: a
            text: Train only on unmetered Wi-Fi, compress updates, and use fewer rounds
          - id: c
            text: Send the raw training text instead, since text is smaller than weights
        answer: a
        feedback: Unmetered connections, compressed updates, and more local work per round all cut paid traffic. Averaging after every step multiplies the number of rounds, each still costing a full 40 MB download, and sending raw text defeats the purpose.
  - id: federated-and-decentralized-learning.calculate
    objective_ref: objective.federated-and-decentralized-learning
    task: base
    response_type: numeric
    points: 1
    hint: Each client's FedAvg weight is its number of examples divided by the round's total. The new global value is the sum of weight × local value.
    remediation_scene: federated-and-decentralized-learning.s5
    absolute_tolerance: 0.01
    variants:
      - id: federated-and-decentralized-learning.calculate.1
        prompt: Three clients in a round hold 200, 300, and 500 examples. What FedAvg weight does the client with 500 examples get?
        answer: 0.5
        feedback: 500 / (200 + 300 + 500) = 500 / 1,000 = 0.5.
      - id: federated-and-decentralized-learning.calculate.2
        prompt: Client A trained on 50 examples and ends with w = 1; client B trained on 150 and ends with w = 5. What is the FedAvg global w?
        answer: 4
        feedback: The weights are 50/200 = 0.25 and 150/200 = 0.75, so 0.25 × 1 + 0.75 × 5 = 0.25 + 3.75 = 4.
      - id: federated-and-decentralized-learning.calculate.3
        prompt: Clients with 100, 100, and 200 examples end with w = 3, 5, and 1. What is the FedAvg global w?
        answer: 2.5
        feedback: The weights are 0.25, 0.25, and 0.5, so 0.75 + 1.25 + 0.5 = 2.5. A plain mean would give 3.
      - id: federated-and-decentralized-learning.calculate.4
        prompt: A client holds 250 of the 1,000 examples in a round. What is its FedAvg weight?
        answer: 0.25
        feedback: 250 / 1,000 = 0.25.
      - id: federated-and-decentralized-learning.calculate.5
        prompt: A client with 400 examples ends with w = 0.2, and one with 600 examples ends with w = 0.7. What is the FedAvg global w?
        answer: 0.5
        feedback: 0.4 × 0.2 + 0.6 × 0.7 = 0.08 + 0.42 = 0.5.
