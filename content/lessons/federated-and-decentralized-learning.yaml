schema_version: 0.2-draft
lesson:
  id: federated-and-decentralized-learning
  version: 0.1.0-draft
  title: Coordinate learning while data remain distributed
  state: draft
  summary: Federated learning aggregates locally computed updates under data and device heterogeneity; keeping raw
    data local does not alone ensure privacy, robustness, or equal participation.
  slot: M31.8
  category: learning
  minutes: 12
  sources:
  - title: Federated Averaging
    url: https://arxiv.org/abs/1602.05629
  - title: Practical Secure Aggregation
    url: https://research.google/pubs/practical-secure-aggregation-for-privacy-preserving-machine-learning/
objectives:
- id: objective.federated-and-decentralized-learning
  version: 1-draft
  statement: Federated learning aggregates locally computed updates under data and device heterogeneity; keeping
    raw data local does not alone ensure privacy, robustness, or equal participation.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - federated-and-decentralized-learning.base
  - federated-and-decentralized-learning.transfer
  prerequisites:
  - anyOf:
    - objective.data-parallel-training
  - anyOf:
    - objective.privacy-and-memorization
scenes:
- id: federated-and-decentralized-learning.s1
  title: Move updates rather than all raw records
  type: explanation
  depth: intuition
  objective_refs:
  - objective.federated-and-decentralized-learning
  markdown: A federated round can send a model to selected clients, train locally, and aggregate their updates.
    Federated averaging weights local results under a defined rule. Decentralized designs can exchange information
    without one central aggregator, introducing other topology and coordination choices.
  text_mode: A federated round can send a model to selected clients, train locally, and aggregate their updates.
    Federated averaging weights local results under a defined rule. Decentralized designs can exchange information
    without one central aggregator, introducing other topology and coordination choices.
  bridges: []
- id: federated-and-decentralized-learning.s2
  title: Account for heterogeneous clients
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.federated-and-decentralized-learning
  markdown: Clients may have different class mixtures, data volumes, compute, and availability. Several local steps
    can move their models in different directions. Weighting by record count optimizes a different objective from
    weighting every client equally; decide which population the model should serve.
  text_mode: Clients may have different class mixtures, data volumes, compute, and availability. Several local steps
    can move their models in different directions. Weighting by record count optimizes a different objective from
    weighting every client equally; decide which population the model should serve.
  bridges: []
- id: federated-and-decentralized-learning.s3
  title: Separate locality from formal privacy
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.federated-and-decentralized-learning
  markdown: Updates can reveal information about local data. Secure aggregation hides some individual updates from
    an aggregator under its protocol assumptions; differential privacy addresses defined information leakage through
    randomized mechanisms. Neither is supplied merely by the phrase federated learning.
  text_mode: Updates can reveal information about local data. Secure aggregation hides some individual updates from
    an aggregator under its protocol assumptions; differential privacy addresses defined information leakage through
    randomized mechanisms. Neither is supplied merely by the phrase federated learning.
  bridges: []
- id: federated-and-decentralized-learning.s4
  title: Evaluate communication and participation
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.federated-and-decentralized-learning
  markdown: Measure rounds, transferred bytes, client selection, dropout, quality across clients, and resilience
    to faulty or malicious updates. A system tested only on balanced always-online clients may fail on realistic
    devices. State who can participate, whose data dominate, and what happens when connectivity fails.
  text_mode: Measure rounds, transferred bytes, client selection, dropout, quality across clients, and resilience
    to faulty or malicious updates. A system tested only on balanced always-online clients may fail on realistic
    devices. State who can participate, whose data dominate, and what happens when connectivity fails.
  bridges: []
- id: federated-and-decentralized-learning.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.federated-and-decentralized-learning
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Federated learning aggregates locally computed updates under data and device heterogeneity; keeping
    raw data local does not alone ensure privacy, robustness, or equal participation.
