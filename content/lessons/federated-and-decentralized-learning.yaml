assessment_families:
- id: federated-and-decentralized-learning.base
  objective_ref: objective.federated-and-decentralized-learning
  task: base
  response_type: single_choice
  points: 1
  hint: 'Account for heterogeneous clients: trace the inputs, operation, and result before choosing.'
  remediation_scene: federated-and-decentralized-learning.s2
  variants:
  - id: federated-and-decentralized-learning.base.1
    prompt: What is commonly aggregated in federated training?
    options:
    - id: a
      text: Locally computed model updates
    - id: b
      text: Every raw record by definition
    - id: c
      text: Only user display names
    answer: a
    feedback: The protocol combines learned contributions.
  - id: federated-and-decentralized-learning.base.2
    prompt: Do equal-client and equal-record weights define the same objective?
    options:
    - id: b
      text: Always
    - id: c
      text: Only when data are heterogeneous
    - id: a
      text: Not generally
    answer: a
    feedback: Different weighting changes whose loss contributes how much.
- id: federated-and-decentralized-learning.transfer
  objective_ref: objective.federated-and-decentralized-learning
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Evaluate communication and participation: trace the inputs, operation, and result before choosing.'
  remediation_scene: federated-and-decentralized-learning.s4
  variants:
  - id: federated-and-decentralized-learning.transfer.1
    prompt: Does keeping raw data local guarantee privacy?
    options:
    - id: b
      text: 'Yes'
    - id: c
      text: Only if gradients are sent
    - id: a
      text: 'No'
    answer: a
    feedback: Updates and surrounding systems can still leak information.
  - id: federated-and-decentralized-learning.transfer.2
    prompt: Why test client dropout and uneven data?
    options:
    - id: c
      text: Only server graphics change
    - id: a
      text: They affect realistic convergence, fairness, and communication
    - id: b
      text: All clients are identical by definition
    answer: a
    feedback: Federated assumptions must match the participating population.
