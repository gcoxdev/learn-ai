assessment_families:
  - id: detection-and-segmentation.base
    objective_ref: objective.detection-and-segmentation
    task: base
    response_type: single_choice
    points: 1
    hint: 'Measure overlap with a box example: trace the inputs, operation, and result before choosing.'
    remediation_scene: detection-and-segmentation.s2
    variants:
      - id: detection-and-segmentation.base.1
        prompt: Intersection area 4 and union area 8 give what IoU?
        options:
          - id: c
            text: '4'
          - id: a
            text: '0.5'
          - id: b
            text: '2'
        answer: a
        feedback: IoU is intersection divided by union.
        retired: true
      - id: detection-and-segmentation.base.2
        prompt: What distinguishes instance segmentation from semantic segmentation?
        options:
          - id: a
            text: It separates individual objects within the same category
          - id: b
            text: It never uses pixels
          - id: c
            text: It predicts only one label for the entire image
        answer: a
        feedback: Instance identity is added to category-level labeling.
        retired: true
  - id: detection-and-segmentation.transfer
    objective_ref: objective.detection-and-segmentation
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Inspect the errors the metric hides: trace the inputs, operation, and result before choosing.'
    remediation_scene: detection-and-segmentation.s4
    variants:
      - id: detection-and-segmentation.transfer.1
        prompt: Two predicted boxes match the same single reference object. Should both automatically count as true positives?
        options:
          - id: a
            text: No; evaluation needs a one-to-one matching convention
          - id: b
            text: Yes; more boxes always improve recall without cost
          - id: c
            text: Only if boxes have the same color
        answer: a
        feedback: Duplicate predictions must be handled by the stated matching protocol.
        retired: true
      - id: detection-and-segmentation.transfer.2
        prompt: A tracker finds boxes accurately but swaps identities between frames. What task-specific failure occurred?
        options:
          - id: b
            text: Only a classification error on the whole video
          - id: c
            text: A guarantee that tracking is solved
          - id: a
            text: An identity association error
        answer: a
        feedback: Temporal identity consistency is separate from per-frame localization.
        retired: true
  - id: detection-and-segmentation.base.v2
    objective_ref: objective.detection-and-segmentation
    task: base
    response_type: single_choice
    points: 1
    hint: Trace the step exactly. IoU is overlap ÷ combined area; NMS keeps the best box and drops its heavy overlaps; AP averages precision at each newly found object; skip connections carry early detail to the decoder.
    remediation_scene: detection-and-segmentation.s5
    variants:
      - id: detection-and-segmentation.base.v2.1
        prompt: "NMS with threshold 0.5 sees three boxes: A (score 0.9), B (0.8, IoU 0.6 with A), and C (0.7, IoU 0.2 with A and 0.1 with B). Which boxes remain?"
        options:
          - id: c
            text: Only A, since B and C both have lower scores than A
          - id: a
            text: A and C, since only B overlaps A by more than 0.5
          - id: b
            text: A, B, and C, since each box has a score above 0.5
        answer: a
        feedback: NMS removes a box only if it overlaps a kept, higher-scoring box by more than the threshold; B does (0.6), C doesn't (0.2). A lower score alone never removes a box, and the 0.5 threshold applies to IoU, not to scores.
      - id: detection-and-segmentation.base.v2.2
        prompt: Two boxes each have area 100, and their overlap is 50. A student computes IoU = 50 / 200 = 0.25. What went wrong?
        options:
          - id: b
            text: IoU should divide by the smaller box's area, giving 0.5
          - id: c
            text: IoU should divide the overlap by itself, giving 1
          - id: a
            text: The overlap was counted twice; the union is 150, giving 0.33
        answer: a
        feedback: The union is 100 + 100 − 50 = 150, because the shared area is inside both boxes. Dividing by the smaller box's area is a different, more forgiving measure.
      - id: detection-and-segmentation.base.v2.3
        prompt: A photo shows three sheep. What does instance segmentation give that semantic segmentation doesn't?
        options:
          - id: a
            text: A separate mask for each sheep, so they can be counted
          - id: b
            text: A box around each sheep instead of a pixel mask
          - id: c
            text: One label, "sheep", for the whole photo at once
        answer: a
        feedback: Semantic segmentation labels every sheep pixel "sheep" without saying which sheep; instance segmentation separates them. Boxes are detection, and one label for the photo is classification.
      - id: detection-and-segmentation.base.v2.4
        prompt: A U-Net-style model's masks have blocky, blurred edges. Its designer had removed the skip connections. Why did that hurt?
        options:
          - id: c
            text: The encoder can no longer shrink the grid, so it runs out of memory
          - id: a
            text: The decoder lost the sharp early features that pooling discarded
          - id: b
            text: The network can no longer produce an output as large as the photo
        answer: a
        feedback: Upsampling alone can only spread coarse values over larger blocks; skip connections bring back the full-resolution edges from early layers. The decoder can still reach full size without skips, just with blurry detail.
  - id: detection-and-segmentation.transfer.v2
    objective_ref: objective.detection-and-segmentation
    task: transfer
    response_type: single_choice
    points: 1
    hint: Start with the answer the user needs (a count, a region, exact pixels, or identity over time), then pick the task and the metric that match it.
    remediation_scene: detection-and-segmentation.s4
    variants:
      - id: detection-and-segmentation.transfer.v2.1
        prompt: A city wants to count how many cars are in each parking-lot camera image. Which output fits best?
        options:
          - id: b
            text: Semantic segmentation, labeling each pixel as car or not car
          - id: a
            text: Detection, giving one box per car that can be counted
          - id: c
            text: Classification, labeling each image "cars present" or not
        answer: a
        feedback: A count needs one result per object, which detection gives. Semantic segmentation merges touching cars into one car region, and classification only says whether any cars are present.
      - id: detection-and-segmentation.transfer.v2.2
        prompt: A sports-video system draws accurate boxes around every player, but player numbers jump between players after they cross. Which measurement will reveal this?
        options:
          - id: c
            text: Mean average precision computed on each frame separately
          - id: b
            text: The average IoU of the player boxes across the whole video
          - id: a
            text: A count of identity switches along each player's track
        answer: a
        feedback: Per-frame mAP and IoU score the boxes, which are fine here; the failure is in linking boxes over time. Identity switches measure exactly that.
      - id: detection-and-segmentation.transfer.v2.3
        prompt: A crowd-counting detector keeps undercounting where people stand shoulder to shoulder. Its NMS threshold is 0.3. What is a likely cause?
        options:
          - id: a
            text: The low threshold deletes real neighbors whose boxes overlap a bit
          - id: b
            text: The low threshold keeps too many duplicate boxes per person
          - id: c
            text: NMS merges nearby boxes into one larger box around the group
        answer: a
        feedback: With a 0.3 threshold, a correct box that overlaps a neighbor's by more than 0.3 is treated as a duplicate and removed. A low threshold removes more boxes, not fewer, and NMS deletes boxes rather than merging them.
      - id: detection-and-segmentation.transfer.v2.4
        prompt: A cleanup crew wants to measure a spill's area in each calibrated overhead image, to the square inch. Which output should the model give?
        options:
          - id: c
            text: A box around the tumor, since its area is easy to compute
          - id: b
            text: A "tumor present" probability, since doctors need the risk
          - id: a
            text: A pixel mask of the tumor, whose pixels can be added up
        answer: a
        feedback: Area needs the exact outline, and a mask gives it pixel by pixel. A box also counts the healthy tissue in its corners, overstating irregular shapes, and a probability says nothing about size.
  - id: detection-and-segmentation.calculate
    objective_ref: objective.detection-and-segmentation
    task: base
    response_type: numeric
    points: 1
    hint: Find the overlap's width and height from the inner edges (larger left, smaller right; larger top, smaller bottom). Then IoU = overlap ÷ (area A + area B − overlap).
    remediation_scene: detection-and-segmentation.s2
    absolute_tolerance: 0.01
    variants:
      - id: detection-and-segmentation.calculate.1
        prompt: Box A is (0, 0, 10, 10) and box B is (5, 0, 15, 10). What is their IoU? Give a decimal.
        answer: 0.333
        feedback: The overlap is 5 × 10 = 50. The union is 100 + 100 − 50 = 150. IoU = 50 / 150 ≈ 0.333.
      - id: detection-and-segmentation.calculate.2
        prompt: Box A is (10, 10, 30, 30) and box B is (20, 20, 40, 40). What is their IoU? Give a decimal.
        answer: 0.143
        feedback: The overlap is 10 × 10 = 100. The union is 400 + 400 − 100 = 700. IoU = 100 / 700 ≈ 0.143.
      - id: detection-and-segmentation.calculate.3
        prompt: Box A is (0, 0, 20, 10) and box B is (0, 0, 10, 10), inside it. What is their IoU? Give a decimal.
        answer: 0.5
        feedback: B lies inside A, so the overlap is B's area, 100, and the union is A's area, 200. IoU = 100 / 200 = 0.5.
      - id: detection-and-segmentation.calculate.4
        prompt: Box A is (0, 0, 6, 6) and box B is (3, 3, 9, 9). What is their IoU? Give a decimal.
        answer: 0.143
        feedback: The overlap is 3 × 3 = 9. The union is 36 + 36 − 9 = 63. IoU = 9 / 63 ≈ 0.143.
      - id: detection-and-segmentation.calculate.5
        prompt: Box A is (0, 0, 10, 10) and box B is (2, 2, 12, 12). What is their IoU? Give a decimal.
        answer: 0.471
        feedback: The overlap runs from 2 to 10 both ways, 8 × 8 = 64. The union is 100 + 100 − 64 = 136. IoU = 64 / 136 ≈ 0.471, just under the usual 0.5 bar even though the boxes are only 2 pixels apart.
