lesson:
  id: detection-and-segmentation
  version: 0.4.0-draft
  title: Locate objects and label their pixels
  state: draft
  summary: To blur a stranger's face, "there's a face in this photo" isn't enough. Learn how models draw boxes, remove duplicates, score themselves, and color in exact pixels.
  slot: M12.4
  category: learning
  sources:
