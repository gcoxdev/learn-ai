scenes:
- id: detection-and-segmentation.s1
  title: Choose the granularity of the output
  type: explanation
  depth: intuition
  objective_refs:
  - objective.detection-and-segmentation
  markdown: 'Classification labels an image. Detection predicts boxes or other locations for object instances.
    Semantic segmentation labels each pixel by category, while instance segmentation distinguishes separate
    objects of the same category. Tracking associates detections across frames and must handle motion, occlusion,
    and reappearance.


    For a photo of two cats, classification might say “cat.” Detection returns two boxes. Semantic segmentation
    marks both cats'' pixels as “cat”; instance segmentation also distinguishes cat 1 from cat 2. **Occlusion**
    means one object blocks the view of another. Tracking tries to keep each cat''s identity consistent as
    it moves between frames.'
  text_mode: 'Classification labels an image. Detection predicts boxes or other locations for object instances.
    Semantic segmentation labels each pixel by category, while instance segmentation distinguishes separate
    objects of the same category. Tracking associates detections across frames and must handle motion, occlusion,
    and reappearance.


