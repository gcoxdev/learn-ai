schema_version: 0.2-draft
lesson:
  id: detection-and-segmentation
  version: 0.3.0-draft
  title: Locate objects and label their pixels
  state: draft
  summary: Tell apart naming an object, drawing its box, coloring its pixels, and following it across frames.
  slot: M12.4
  category: learning
  sources:
  - title: Dive into Deep Learning — authors’ open textbook
    url: https://d2l.ai/
  - title: 'U-Net: Convolutional Networks for Biomedical Image Segmentation'
    url: https://arxiv.org/abs/1505.04597
objectives:
- id: objective.detection-and-segmentation
  version: 1-draft
  statement: Detection predicts object instances and locations, segmentation assigns pixel-level structure,
    and tracking connects instances over time; each needs task-specific matching and metrics.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - detection-and-segmentation.base
  - detection-and-segmentation.transfer
  prerequisites:
  - anyOf:
    - objective.convolutional-networks
scenes:
- id: detection-and-segmentation.s1
  title: What answer do you want from the picture?
  type: explanation
  depth: intuition
  objective_refs:
  - objective.detection-and-segmentation
  markdown: 'Take a photograph of two cats. **Classification** might label the image “cat.” **Detection** returns
    a location, such as a box, for each cat. **Semantic segmentation** labels their pixels as cat pixels; **instance
    segmentation** also distinguishes cat 1 from cat 2.


    Across video frames, **tracking** tries to keep each cat’s identity consistent. This becomes harder when
    they move, cross paths, or hide one another. Such blocking of the view is called **occlusion**. Each task
    needs a different kind of answer and evaluation.'
  text_mode: 'Take a photograph of two cats. **Classification** might label the image “cat.” **Detection**
    returns a location, such as a box, for each cat. **Semantic segmentation** labels their pixels as cat pixels;
    **instance segmentation** also distinguishes cat 1 from cat 2.


    Across video frames, **tracking** tries to keep each cat’s identity consistent. This becomes harder when
    they move, cross paths, or hide one another. Such blocking of the view is called **occlusion**. Each task
    needs a different kind of answer and evaluation.'
  bridges: []
- id: detection-and-segmentation.s2
  title: Measure how much the regions overlap
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.detection-and-segmentation
  markdown: '**Intersection over union (IoU)** divides the overlapping area of predicted and reference regions
    by the area they cover together. Suppose each region has area 8 and their overlap is 6. Their union is
    8 + 8 − 6 = 10: subtract the overlap once because it was counted twice. IoU is therefore 6 / 10 = 0.6.


    Evaluation also needs a rule for matching predictions to reference objects and a confidence threshold.
    Two boxes around the same cat should not count as two detected cats. Good overlap also does not guarantee
    the predicted category is correct.'
  text_mode: '**Intersection over union (IoU)** divides the overlapping area of predicted and reference regions
    by the area they cover together. Suppose each region has area 8 and their overlap is 6. Their union is
    8 + 8 − 6 = 10: subtract the overlap once because it was counted twice. IoU is therefore 6 / 10 = 0.6.


    Evaluation also needs a rule for matching predictions to reference objects and a confidence threshold.
    Two boxes around the same cat should not count as two detected cats. Good overlap also does not guarantee
    the predicted category is correct.'
  bridges:
  - arithmetic
- id: detection-and-segmentation.s3
  title: Recover detail through a U-Net-like structure
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.detection-and-segmentation
  markdown: 'An encoder reduces spatial resolution while building features. A decoder restores resolution,
    and skip connections bring aligned features from earlier stages. This can help preserve localization detail
    for dense outputs. Exact upsampling, channel mixing, and skip conventions vary by implementation.


    “Dense output” here means an answer at many or all pixel positions. U-Net names the U-shaped diagram of
    a shrinking encoder and expanding decoder with cross-connections. Restoring resolution does not automatically
    restore details already discarded; the skip features help supply them.'
  text_mode: 'An encoder reduces spatial resolution while building features. A decoder restores resolution,
    and skip connections bring aligned features from earlier stages. This can help preserve localization detail
    for dense outputs. Exact upsampling, channel mixing, and skip conventions vary by implementation.


    “Dense output” here means an answer at many or all pixel positions. U-Net names the U-shaped diagram of
    a shrinking encoder and expanding decoder with cross-connections. Restoring resolution does not automatically
    restore details already discarded; the skip features help supply them.'
  bridges: []
- id: detection-and-segmentation.s4
  title: Inspect the errors the metric hides
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.detection-and-segmentation
  markdown: 'A large-region average can hide failures on small objects or thin boundaries. Detection average
    precision depends on matching and IoU conventions. Tracking introduces identity switches and missed associations
    beyond per-frame boxes. State annotation rules, ignored regions, and temporal conditions when interpreting
    scores.


    An **identity switch** occurs when the tracker labels the first cat as cat 2 after a crossing. Both boxes
    can be well placed while the tracking identities are wrong. This is why a detection score alone cannot
    describe a tracking system.'
  text_mode: 'A large-region average can hide failures on small objects or thin boundaries. Detection average
    precision depends on matching and IoU conventions. Tracking introduces identity switches and missed associations
    beyond per-frame boxes. State annotation rules, ignored regions, and temporal conditions when interpreting
    scores.


    An **identity switch** occurs when the tracker labels the first cat as cat 2 after a crossing. Both boxes
    can be well placed while the tracking identities are wrong. This is why a detection score alone cannot
    describe a tracking system.'
  bridges: []
