assessment_families:
- id: detection-and-segmentation.base
  objective_ref: objective.detection-and-segmentation
  task: base
  response_type: single_choice
  points: 1
  hint: 'Measure overlap with a box example: trace the inputs, operation, and result before choosing.'
  remediation_scene: detection-and-segmentation.s2
  variants:
  - id: detection-and-segmentation.base.1
    prompt: Intersection area 4 and union area 8 give what IoU?
    options:
    - id: c
      text: '4'
    - id: a
      text: '0.5'
    - id: b
      text: '2'
    answer: a
    feedback: IoU is intersection divided by union.
  - id: detection-and-segmentation.base.2
    prompt: What distinguishes instance segmentation from semantic segmentation?
    options:
    - id: a
      text: It separates individual objects within the same category
    - id: b
      text: It never uses pixels
    - id: c
      text: It predicts only one label for the entire image
    answer: a
    feedback: Instance identity is added to category-level labeling.
- id: detection-and-segmentation.transfer
  objective_ref: objective.detection-and-segmentation
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Inspect the errors the metric hides: trace the inputs, operation, and result before choosing.'
  remediation_scene: detection-and-segmentation.s4
  variants:
  - id: detection-and-segmentation.transfer.1
    prompt: Two predicted boxes match the same single reference object. Should both automatically count as true
      positives?
    options:
    - id: a
      text: No; evaluation needs a one-to-one matching convention
    - id: b
      text: Yes; more boxes always improve recall without cost
    - id: c
      text: Only if boxes have the same color
    answer: a
    feedback: Duplicate predictions must be handled by the stated matching protocol.
  - id: detection-and-segmentation.transfer.2
    prompt: A tracker finds boxes accurately but swaps identities between frames. What task-specific failure occurred?
    options:
    - id: b
      text: Only a classification error on the whole video
    - id: c
      text: A guarantee that tracking is solved
    - id: a
      text: An identity association error
    answer: a
    feedback: Temporal identity consistency is separate from per-frame localization.
