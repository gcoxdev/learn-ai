- id: detection-and-segmentation.s3
  title: Recover detail through a U-Net-like structure
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.detection-and-segmentation
  markdown: 'An encoder reduces spatial resolution while building features. A decoder restores resolution,
    and skip connections bring aligned features from earlier stages. This can help preserve localization detail
    for dense outputs. Exact upsampling, channel mixing, and skip conventions vary by implementation.


    “Dense output” here means an answer at many or all pixel positions. U-Net names the U-shaped diagram of
    a shrinking encoder and expanding decoder with cross-connections. Restoring resolution does not automatically
    restore details already discarded; the skip features help supply them.'
  text_mode: 'An encoder reduces spatial resolution while building features. A decoder restores resolution,
    and skip connections bring aligned features from earlier stages. This can help preserve localization detail
    for dense outputs. Exact upsampling, channel mixing, and skip conventions vary by implementation.


    “Dense output” here means an answer at many or all pixel positions. U-Net names the U-shaped diagram of
    a shrinking encoder and expanding decoder with cross-connections. Restoring resolution does not automatically
    restore details already discarded; the skip features help supply them.'
  bridges: []
- id: detection-and-segmentation.s4
  title: Inspect the errors the metric hides
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.detection-and-segmentation
  markdown: 'A large-region average can hide failures on small objects or thin boundaries. Detection average
    precision depends on matching and IoU conventions. Tracking introduces identity switches and missed associations
    beyond per-frame boxes. State annotation rules, ignored regions, and temporal conditions when interpreting
    scores.


    An **identity switch** occurs when the tracker labels the first cat as cat 2 after a crossing. Both boxes
    can be well placed while the tracking identities are wrong. This is why a detection score alone cannot
    describe a tracking system.'
