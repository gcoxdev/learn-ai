scenes:
- id: detection-and-segmentation.s1
  title: Choose the granularity of the output
  type: explanation
  depth: intuition
  objective_refs:
  - objective.detection-and-segmentation
  markdown: Classification labels an image. Detection predicts boxes or other locations for object instances. Semantic
    segmentation labels each pixel by category, while instance segmentation distinguishes separate objects of the
    same category. Tracking associates detections across frames and must handle motion, occlusion, and reappearance.
  text_mode: Classification labels an image. Detection predicts boxes or other locations for object instances. Semantic
    segmentation labels each pixel by category, while instance segmentation distinguishes separate objects of the
    same category. Tracking associates detections across frames and must handle motion, occlusion, and reappearance.
  bridges: []
- id: detection-and-segmentation.s2
  title: Measure overlap with a box example
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.detection-and-segmentation
  markdown: Intersection over union divides the overlapping area of predicted and reference regions by their combined
    area. If intersection is 6 and union is 10, IoU is 0.6. Detection evaluation also needs confidence thresholds
    and a rule for matching predictions to references; duplicate detections should not count as separate successes.
  text_mode: Intersection over union divides the overlapping area of predicted and reference regions by their combined
    area. If intersection is 6 and union is 10, IoU is 0.6. Detection evaluation also needs confidence thresholds
    and a rule for matching predictions to references; duplicate detections should not count as separate successes.
  bridges:
  - arithmetic
- id: detection-and-segmentation.s3
  title: Recover detail through a U-Net-like structure
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.detection-and-segmentation
  markdown: An encoder reduces spatial resolution while building features. A decoder restores resolution, and skip
    connections bring aligned features from earlier stages. This can help preserve localization detail for dense
    outputs. Exact upsampling, channel mixing, and skip conventions vary by implementation.
  text_mode: An encoder reduces spatial resolution while building features. A decoder restores resolution, and skip
    connections bring aligned features from earlier stages. This can help preserve localization detail for dense
    outputs. Exact upsampling, channel mixing, and skip conventions vary by implementation.
  bridges: []
- id: detection-and-segmentation.s4
  title: Inspect the errors the metric hides
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.detection-and-segmentation
  markdown: A large-region average can hide failures on small objects or thin boundaries. Detection average precision
    depends on matching and IoU conventions. Tracking introduces identity switches and missed associations beyond
    per-frame boxes. State annotation rules, ignored regions, and temporal conditions when interpreting scores.
  text_mode: A large-region average can hide failures on small objects or thin boundaries. Detection average precision
    depends on matching and IoU conventions. Tracking introduces identity switches and missed associations beyond
    per-frame boxes. State annotation rules, ignored regions, and temporal conditions when interpreting scores.
  bridges: []
- id: detection-and-segmentation.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.detection-and-segmentation
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Detection predicts object instances and locations, segmentation assigns pixel-level structure, and tracking
    connects instances over time; each needs task-specific matching and metrics.
