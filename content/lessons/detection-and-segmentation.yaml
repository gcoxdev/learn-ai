    it moves between frames.'
  bridges: []
- id: detection-and-segmentation.s2
  title: Measure overlap with a box example
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.detection-and-segmentation
  markdown: 'Intersection over union divides the overlapping area of predicted and reference regions by their
    combined area. If intersection is 6 and union is 10, IoU is 0.6. Detection evaluation also needs confidence
    thresholds and a rule for matching predictions to references; duplicate detections should not count as
    separate successes.


    If a predicted region has area 8 and the reference has area 8, with overlap 6, their union is 8 + 8 − 6
    = 10. Subtract the overlap once because it was counted twice. IoU, read “intersection over union,” is then
    6/10. High overlap alone does not establish the right object category.'
  text_mode: 'Intersection over union divides the overlapping area of predicted and reference regions by their
    combined area. If intersection is 6 and union is 10, IoU is 0.6. Detection evaluation also needs confidence
    thresholds and a rule for matching predictions to references; duplicate detections should not count as
    separate successes.


    If a predicted region has area 8 and the reference has area 8, with overlap 6, their union is 8 + 8 − 6
