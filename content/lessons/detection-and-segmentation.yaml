    - title: "Segment Anything (Kirillov et al., 2023)"
      url: https://arxiv.org/abs/2304.02643
objectives:
  - id: objective.detection-and-segmentation
    version: 2-draft
    statement: Detection predicts object instances and locations, segmentation assigns pixel-level structure, and tracking connects instances over time; each needs task-specific matching and metrics.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - detection-and-segmentation.base.v2
      - detection-and-segmentation.transfer.v2
      - detection-and-segmentation.calculate
    prerequisites:
      - anyOf:
          - objective.convolutional-networks
scenes:
  - id: detection-and-segmentation.s1
    title: '"There''s a face" isn''t enough to blur it'
    type: explanation
    depth: intuition
    objective_refs:
      - objective.detection-and-segmentation
    markdown: |-
      You're sharing a beach photo, and the photo app offers to blur the strangers behind you. A classifier could say "this photo contains faces", but the blur needs *where* each face is, and exactly which pixels to cover.

      Vision tasks differ mainly in the shape of their answer:

      | Task | Answer | Photo-app use |
      | --- | --- | --- |
      | **Classification** | one label for the whole photo | pet search |
      | **Detection** | a box and label for each object | find the faces to blur |
      | **Semantic segmentation** | a class for every pixel | "these pixels are sky" |
      | **Instance segmentation** | a separate mask for each object | blur *this* stranger, not your friend |
      | **Tracking** | the same identity across video frames | keep the blur on a face as it moves |

      With two dogs in a photo, semantic segmentation paints both "dog"; instance segmentation says "dog 1" and "dog 2". A box is written as $(x_1, y_1, x_2, y_2)$, its left, top, right, and bottom edges, as in the first lesson of this module.
    bridges: []
  - id: detection-and-segmentation.s2
    title: Score a box with intersection over union
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.detection-and-segmentation
    markdown: |-
      The face finder predicts a box at $(10, 10, 50, 50)$. The true face, drawn by a person, is at $(20, 20, 60, 60)$. They look close. How close?

      **Intersection over union (IoU)** divides the area the two boxes share by the area they cover together:

      - Each box is 40 × 40, so each has area 1,600.
      - They overlap from 20 to 50 in both directions: 30 × 30 = 900.
      - Together they cover $1{,}600 + 1{,}600 - 900 = 2{,}300$. Subtract the overlap once, because it was counted in both boxes.
      - IoU $= 900 / 2{,}300 \approx 0.391$.

      A common rule, used by the PASCAL VOC benchmark, counts a detection as correct only if IoU ≥ 0.5. This box misses despite being only 10 pixels off: IoU is harsh on small objects, and a 10-pixel error that ruins a 40-pixel face barely matters on a 400-pixel dog.

      :::predict The prediction moves to (15, 15, 55, 55), only 5 pixels off. What is the IoU now?
      The overlap is 35 × 35 = 1,225. The union is $3{,}200 - 1{,}225 = 1{,}975$. IoU $= 1{,}225 / 1{,}975 \approx 0.620$, which now passes the 0.5 bar.
      :::
    bridges:
      - arithmetic
  - id: detection-and-segmentation.s5
    title: One face, three boxes, and non-maximum suppression
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.detection-and-segmentation
    markdown: |-
      A detector runs a CNN **backbone** over the photo, then a **head** that proposes candidate boxes, each with a score. **YOLO** ("You Only Look Once", Redmon et al., 2015) made this a single pass: it split the photo into a 7 × 7 grid, and each cell predicted boxes and class scores directly, fast enough for live video. **Faster R-CNN** (Ren et al., 2015) works in two stages: first propose regions that might hold objects, then classify and refine each one.

      Either way, one face usually gets several overlapping boxes. **Non-maximum suppression (NMS)** cleans them up: keep the highest-scoring box, delete every remaining box whose IoU with it exceeds a threshold (often 0.5), and repeat with what's left.

      | Box | $(x_1, y_1, x_2, y_2)$ | Score | IoU with box 0 | Result |
      | --- | --- | ---: | ---: | --- |
      | 0 | (100, 100, 200, 200) | 0.95 | — | keep |
      | 1 | (110, 105, 210, 205) | 0.90 | 0.747 | drop |
      | 2 | (300, 120, 380, 200) | 0.85 | 0 | keep (another face) |
      | 3 | (95, 110, 190, 210) | 0.60 | 0.711 | drop |

      ```python run
      import numpy as np

      def iou(a, b):
          """Boxes are (x1, y1, x2, y2). Overlap area divided by combined area."""
          w = max(0, min(a[2], b[2]) - max(a[0], b[0]))
          h = max(0, min(a[3], b[3]) - max(a[1], b[1]))
          inter = w * h
          area = lambda r: (r[2] - r[0]) * (r[3] - r[1])
          return inter / (area(a) + area(b) - inter)

      print("IoU of the worked example:", round(iou((10, 10, 50, 50), (20, 20, 60, 60)), 3))

      boxes = np.array([(100, 100, 200, 200), (110, 105, 210, 205),
                        (300, 120, 380, 200), (95, 110, 190, 210)])
      scores = np.array([0.95, 0.90, 0.85, 0.60])

      def nms(boxes, scores, threshold=0.5):
          order = list(np.argsort(-scores))          # best score first
          keep = []
          while order:
              best = order.pop(0)
              keep.append(int(best))
              for other in order[:]:
                  overlap = iou(boxes[best], boxes[other])
                  if overlap > threshold:
                      print(f"  drop box {other} (IoU {overlap:.3f} with box {best})")
                      order.remove(other)
          return keep

      print("kept boxes:", nms(boxes, scores))
      ```

      Try raising the threshold to 0.75: both duplicates survive, so one face gets three blurs. Set it too low, say 0.1, and of two cheek-to-cheek faces, one box can be deleted, leaving that face unblurred.
    diagram:
      caption: A single-pass detector. Many candidate boxes come out; NMS keeps one per object.
      description: The photo goes into a CNN backbone, which produces feature maps for a detection head. The head outputs many candidate boxes, each with a score. Non-maximum suppression removes boxes that overlap a higher-scoring box too much. The remaining boxes, one per face, go to the blur step.
      nodes:
        - id: photo
          label: Photo
          col: 0
          row: 0
          tone: data
        - id: backbone
          label: CNN backbone
          note: feature maps
          col: 1
          row: 0
        - id: head
          label: Detection head
          note: box + score per cell
          col: 2
          row: 0
        - id: candidates
          label: Candidate boxes
          note: several per face
          col: 3
          row: 0
          tone: data
        - id: nms
          label: Non-max suppression
          note: drop IoU > 0.5
          col: 3
          row: 1
          tone: accent
        - id: blur
          label: Blur each face
          note: one box per face
          col: 2
          row: 1
          tone: warn
      edges:
        - from: photo
          to: backbone
        - from: backbone
          to: head
        - from: head
          to: candidates
        - from: candidates
          to: nms
        - from: nms
          to: blur
          label: kept
  - id: detection-and-segmentation.s4
    title: Mean average precision, and the errors it hides
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.detection-and-segmentation
    markdown: |-
      How good is a face detector overall? Two ratios come first. **Precision** is the fraction of returned boxes that are real faces; **recall** is the fraction of real faces that got a box. A test photo has 3 real faces and the detector returns 4 boxes. Sort them by score and mark each as a true positive (IoU ≥ 0.5 with a face not yet matched) or a false positive:

      | Rank | Match? | Precision so far | Recall so far |
      | ---: | --- | ---: | ---: |
      | 1 | true positive | 1/1 = 1.00 | 1/3 |
      | 2 | true positive | 2/2 = 1.00 | 2/3 |
      | 3 | false positive | 2/3 = 0.67 | 2/3 |
      | 4 | true positive | 3/4 = 0.75 | 3/3 |

      **Average precision (AP)** averages the precision at each rank where a new face was found: $(1.00 + 1.00 + 0.75)/3 \approx 0.917$. It rewards finding every face *and* ranking correct boxes first. **Mean average precision (mAP)**, the standard detector score, averages AP over classes (faces, dogs, signs). COCO, the most-used benchmark, also averages over IoU thresholds from 0.5 to 0.95, so sloppy boxes cost points. Compare mAP only within one benchmark, since the details differ.

      One mAP can hide what matters, so split it by object size: small, distant faces are usually weakest. Video needs its own check: an **identity switch** happens when two people cross and the tracker swaps their labels. Every box can be perfect while the blur jumps to the wrong person.
    bridges: []
  - id: detection-and-segmentation.s3
    title: Masks with a U-shaped network
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.detection-and-segmentation
    markdown: |-
      A box also blurs a slice of background. A clean blur needs a **mask**, a yes/no answer for every pixel: an output as large as the input, from a CNN that shrinks its grid as it learns *what* is there.

      **U-Net** (Ronneberger, Fischer & Brox, 2015, built for microscope images of cells) has two halves. The **encoder** is an ordinary CNN that halves the grid while adding channels; the **decoder** upsamples back to full size. **Skip connections** copy each encoder map across to the decoder stage of the same size, stacked channel-wise, so the decoder gets deep "this is a face" features *and* sharp early edges.

      :::mixup "Upsampling the small feature map is enough to recover sharp boundaries."
      Upsampling 64 × 64 to 256 × 256 spreads each value over a 4 × 4 block, so edges come out blocky. Pooling threw the detail away; skip connections put it back.
      :::

      For instance masks, **Mask R-CNN** (He et al., 2017) added a small mask branch to Faster R-CNN: for each detected box, predict which pixels inside it belong to that object. **Segment Anything (SAM)** (Kirillov et al., 2023), trained on over 1 billion masks from 11 million images, goes further: click a point on almost any object and it returns a mask. Tap a stranger, and the photo app gets a mask to blur.
    diagram:
      caption: A U-Net for face masks. The encoder shrinks, the decoder grows, and skip connections carry fine detail across.
      description: A 256 × 256 photo enters the encoder, which produces 256 × 256 × 64 features, then pools to 128 × 128 × 128, then to a 64 × 64 × 256 bottleneck. The decoder upsamples to 128 × 128 × 128 and then 256 × 256 × 64. Skip connections join the 128 × 128 encoder stage to the 128 × 128 decoder stage, and the 256 × 256 encoder stage to the 256 × 256 decoder stage. A 1 × 1 convolution turns the final features into a 256 × 256 face mask.
      nodes:
        - id: photo
          label: Photo
          note: 256 × 256 × 3
          col: 0
          row: 0
          tone: data
        - id: e1
          label: Encoder
          note: 256 × 256 × 64
          col: 0
          row: 1
        - id: e2
          label: Encoder
          note: 128 × 128 × 128
          col: 1
          row: 2
        - id: bottleneck
          label: Bottleneck
          note: 64 × 64 × 256
          col: 2
          row: 3
          tone: accent
        - id: d2
          label: Decoder
          note: 128 × 128 × 128
          col: 3
          row: 2
        - id: d1
          label: Decoder
          note: 256 × 256 × 64
          col: 4
          row: 1
        - id: mask
          label: Face mask
          note: 256 × 256 × 1
          col: 4
          row: 0
          tone: warn
      edges:
        - from: photo
          to: e1
        - from: e1
          to: e2
          label: pool ÷ 2
        - from: e2
          to: bottleneck
          label: pool ÷ 2
        - from: bottleneck
          to: d2
          label: upsample × 2
        - from: d2
          to: d1
          label: upsample × 2
        - from: d1
          to: mask
          label: 1 × 1 conv
        - from: e1
          to: d1
          label: skip connection
          dashed: true
        - from: e2
          to: d2
          label: skip connection
          dashed: true
  - id: detection-and-segmentation.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.detection-and-segmentation
    markdown: Compute IoU for fresh pairs of boxes, then choose the right output and metric for a parking-lot counter, a road-scene labeler, and a sports-video tracker.
    takeaway: |-
      Pick the answer's shape first: a label, boxes, pixel masks, or tracked identities. Boxes are matched by IoU, duplicates are removed with NMS, and mAP rewards finding every object with the right boxes ranked first.
  - id: detection-and-segmentation.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.detection-and-segmentation
    markdown: |-
      Naming an image, locating objects, labeling pixels, and tracking identities are different tasks. Choose the output and evaluation rules that match the task you want to solve.
