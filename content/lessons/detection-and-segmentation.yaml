schema_version: 0.2-draft
lesson:
  id: detection-and-segmentation
  version: 0.1.0-draft
  title: Locate objects and label their pixels
  state: draft
  summary: Detection predicts object instances and locations, segmentation assigns pixel-level structure, and tracking
    connects instances over time; each needs task-specific matching and metrics.
  slot: M12.4
  category: learning
  minutes: 12
  sources:
  - title: Dive into Deep Learning — authors’ open textbook
    url: https://d2l.ai/
  - title: 'U-Net: Convolutional Networks for Biomedical Image Segmentation'
    url: https://arxiv.org/abs/1505.04597
objectives:
- id: objective.detection-and-segmentation
  version: 1-draft
  statement: Detection predicts object instances and locations, segmentation assigns pixel-level structure, and
    tracking connects instances over time; each needs task-specific matching and metrics.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - detection-and-segmentation.base
  - detection-and-segmentation.transfer
  prerequisites:
  - anyOf:
