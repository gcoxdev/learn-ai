objectives:
- id: objective.detection-and-segmentation
  version: 1-draft
  statement: Detection predicts object instances and locations, segmentation assigns pixel-level structure,
    and tracking connects instances over time; each needs task-specific matching and metrics.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - detection-and-segmentation.base
  - detection-and-segmentation.transfer
  prerequisites:
