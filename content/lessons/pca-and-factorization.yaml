objectives:
- id: objective.pca-and-factorization
  version: 1-draft
  statement: PCA and matrix factorization reduce dimensionality by retaining structured variation; centering,
    scaling, rank, and the downstream task determine what is preserved or lost.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - pca-and-factorization.base
  - pca-and-factorization.transfer
  prerequisites:
  - anyOf:
    - objective.linear-algebra-depth
  - anyOf:
    - objective.random-variables
scenes:
- id: pca-and-factorization.s1
  title: Keep the directions where values vary most
  type: explanation
  depth: intuition
  objective_refs:
  - objective.pca-and-factorization
  markdown: 'Two measurements that move together may contain overlapping information. **Principal component
    analysis (PCA)** finds directions that capture as much of the data’s variation as possible. Retaining a
    few of them gives each example fewer coordinates.


    A **dimension** is one numerical coordinate, and **variance** measures how much values vary around their
    mean. PCA chooses **orthogonal** directions, at right angles to one another. Before fitting, we specify
    **centering**, which subtracts coordinate means, and any **scaling**, which changes their units. Those
    choices affect which variation is largest.'
  text_mode: 'Two measurements that move together may contain overlapping information. **Principal component
    analysis (PCA)** finds directions that capture as much of the data’s variation as possible. Retaining a
    few of them gives each example fewer coordinates.


    A **dimension** is one numerical coordinate, and **variance** measures how much values vary around their
    mean. PCA chooses **orthogonal** directions, at right angles to one another. Before fitting, we specify
    **centering**, which subtracts coordinate means, and any **scaling**, which changes their units. Those
    choices affect which variation is largest.'
  bridges: []
- id: pca-and-factorization.s2
  title: Compress points on a line
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.pca-and-factorization
  markdown: 'Take [1, 1], [2, 2], and [3, 3]. Their mean is [2, 2]. Subtract it to get [−1, −1], [0, 0], and
    [1, 1]. Both coordinates change together, so one number locating each point along the diagonal captures
    all the variation.


    We can reconstruct the originals by recovering their diagonal positions and adding [2, 2] back. This works
    exactly because the points lie on one line. A one-direction reconstruction would discard movement away
    from that line, whether it was unimportant noise or information needed for a later task.'
  text_mode: 'Take [1, 1], [2, 2], and [3, 3]. Their mean is [2, 2]. Subtract it to get [−1, −1], [0, 0], and
    [1, 1]. Both coordinates change together, so one number locating each point along the diagonal captures
    all the variation.


    We can reconstruct the originals by recovering their diagonal positions and adding [2, 2] back. This works
    exactly because the points lie on one line. A one-direction reconstruction would discard movement away
    from that line, whether it was unimportant noise or information needed for a later task.'
  bridges:
  - linear-algebra-depth
- id: pca-and-factorization.s3
  title: Connect the directions to matrix factorization
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.pca-and-factorization
  markdown: 'A **matrix** is a rectangular table of numbers. **Factorization** writes it as a product of simpler
    tables. **Singular value decomposition (SVD)** separates directions from their strengths; applied to centered
    data, it supplies the directions used by PCA.


    **Rank** counts independent directions. Keeping a lower rank reduces storage but usually increases reconstruction
    error. Other factorizations impose different assumptions, such as nonnegative values or a task-specific
    loss. The matrix and linear-algebra side lessons explain the multiplication; here the key question is which
    information the smaller representation preserves.'
  text_mode: 'A **matrix** is a rectangular table of numbers. **Factorization** writes it as a product of simpler
