schema_version: 0.2-draft
lesson:
  id: pca-and-factorization
  version: 0.4.0-draft
  title: Compress variation into fewer directions
  state: draft
  summary: Your height almost tells me your arm span. PCA turns that overlap into compression, swapping two numbers for one, and shows exactly how much you lose.
  slot: M08.3
  category: learning
  sources:
    - title: Deep Learning — linear algebra
      url: https://www.deeplearningbook.org/contents/linear_algebra.html
    - title: An Introduction to Statistical Learning — authors’ materials
      url: https://www.statlearning.com/
    - title: "On Lines and Planes of Closest Fit to Systems of Points in Space (Pearson, 1901)"
      url: https://doi.org/10.1080/14786440109462720
    - title: scikit-learn — principal component analysis
      url: https://scikit-learn.org/stable/modules/decomposition.html#pca
objectives:
  - id: objective.pca-and-factorization
    version: 2-draft
    statement: PCA and matrix factorization reduce dimensionality by retaining structured variation; centering, scaling, rank, and the downstream task determine what is preserved or lost.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - pca-and-factorization.base.v2
      - pca-and-factorization.transfer.v2
      - pca-and-factorization.calc.v2
    prerequisites:
      - anyOf:
          - objective.linear-algebra-depth
      - anyOf:
          - objective.random-variables
scenes:
  - id: pca-and-factorization.s1
    title: Height and arm span tell almost the same story
    type: explanation
    depth: intuition
    objective_refs:
      - objective.pca-and-factorization
    markdown: |-
      Stretch your arms out wide. For most adults, fingertip to fingertip is close to their height. Here are five people, in centimeters:

      | Person | Height | Arm span |
      | --- | ---: | ---: |
      | Ada | 167 | 169 |
      | Ben | 169 | 171 |
      | Cy | 170 | 172 |
      | Dee | 171 | 175 |
      | Eli | 173 | 173 |

      Plot them and the points hug a diagonal line. Knowing someone's height, you could guess their arm span within a couple of centimeters. The two columns mostly repeat one piece of information, something like "overall size."

      **Principal component analysis (PCA)** finds that shared information. It looks for the **direction** through the cloud of points along which they spread out the most, measured by **variance**, roughly the average squared distance from the mean. That direction is the **first principal component**. The second is at right angles to the first (**orthogonal**) and captures what's left. Keep only the first, and each person is described by one number instead of two.
    bridges: []
  - id: pca-and-factorization.s2
    title: Squash two numbers into one
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.pca-and-factorization
    markdown: |-
      Step 1 is **centering**: subtract each column's mean. The mean height is 170 and the mean arm span is 172, so Ada becomes (−3, −3), Dee (1, 3), and Eli (3, 1).

      Step 2 is finding the direction. For these points it's the diagonal, $u = (0.707, 0.707)$, a unit-length arrow pointing equally up and right.

      Step 3 is the **score**, each person's position along that arrow: the dot product of their centered point with $u$. Ada gets $-3 \times 0.707 + -3 \times 0.707 = -4.24$. Dee and Eli both get 2.83. Five people, one number each.

      To rebuild, multiply the score by $u$ and add the means back. Ada comes back exactly as (167, 169), since she sits on the diagonal. Dee comes back as (172, 174) instead of (171, 175): the rebuild misses by 1 cm in each column, a squared error of 2. Eli's squared error is also 2. Everything the first direction can't see, such as Dee's arms being long for her height, is what compression throws away.

      :::predict What share of the total variation does the single score keep?
      90%. Along the diagonal the variance is 9; across it, only 1. The share of variance a component keeps is its **explained variance ratio**, here 9 / (9 + 1) = 0.9. The missing 10% is exactly the off-diagonal wobble of Dee and Eli.
      :::
    bridges:
      - linear-algebra-depth
  - id: pca-and-factorization.s3
    title: Covariance, eigenvectors, and the SVD
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.pca-and-factorization
    markdown: |-
      Where did the diagonal and the 9 come from? From the **covariance matrix**, a small table of how each pair of columns varies together. Its diagonal entries hold each column's variance, and the off-diagonal entries hold how strongly the columns move together. PCA's directions are this matrix's eigenvectors, the directions it only stretches without turning, and each stretch factor (eigenvalue) is the variance along that direction. Run it:

      ```python run
      import numpy as np

      # Height and arm span (cm) for five people
      X = np.array([[167, 169], [169, 171], [170, 172], [171, 175], [173, 173]], dtype=float)

      mean = X.mean(axis=0)
      Xc = X - mean                          # center: subtract each column's mean
      C = Xc.T @ Xc / (len(X) - 1)           # covariance matrix
      eigvals, eigvecs = np.linalg.eigh(C)   # eigh returns smallest first
      order = np.argsort(eigvals)[::-1]
      eigvals, eigvecs = eigvals[order], eigvecs[:, order]

      print("mean:", mean)
      print("covariance:\n", C)
      print("variance along each direction:", np.round(eigvals, 2))
      print("explained variance ratio:", np.round(eigvals / eigvals.sum(), 2))
      pc1 = eigvecs[:, 0] * np.sign(eigvecs[0, 0])  # make it point up-right
      print("first direction:", np.round(pc1, 3))

      scores = Xc @ pc1                        # one number per person
      rebuilt = mean + np.outer(scores, pc1)   # back to two numbers
      print("scores:", np.round(scores, 2))
      print("rebuilt:\n", np.round(rebuilt, 1))
      print("squared reconstruction error:", round(float(((X - rebuilt) ** 2).sum()), 2))

      U, S, Vt = np.linalg.svd(Xc, full_matrices=False)
      print("SVD: first direction", np.round(np.abs(Vt[0]), 3), " S^2/(n-1) =", np.round(S**2 / 4, 2))
      ```

      The covariance is [[5, 4], [4, 5]]: each column has variance 5, and they move together strongly (4). Its eigenvalues are 9 and 1. The total squared rebuild error is 4.0: the leftover variance, 1, times n − 1 = 4. Now give Eli short arms: change his arm span from 173 to 169. The explained variance ratio drops to 0.6, because the points no longer hug one line.

      :::papers PCA as an eigenproblem and as an SVD
      With centered data $X$ ($n$ rows), the covariance is $C = \frac{1}{n-1}X^\top X$. PCA solves $C v_j = \lambda_j v_j$, where $v_j$ is the $j$th direction and $\lambda_j$ its variance. The explained variance ratio of component $j$ is $\lambda_j / \sum_k \lambda_k$: here $9 / 10 = 0.9$.

      The same answer comes from the **singular value decomposition** $X = U \Sigma V^\top$: the rows of $V^\top$ are the directions, and $\lambda_j = \sigma_j^2/(n-1)$, so $\sigma_1^2 = 36$ gives $36/4 = 9$. Keeping the top $k$ singular values gives the best possible **rank**-$k$ approximation of $X$ in squared error (Eckart and Young, 1936). That is a **matrix factorization**: one big table rewritten as the product of two thin ones, scores times directions. The recommendation lesson uses the same trick on a table of ratings.
      :::

      :::story From 1901 to eigenfaces
      Karl Pearson described PCA in 1901 as fitting "lines and planes of closest fit" to points, and Harold Hotelling named the principal components in 1933. In 1991 Turk and Pentland's "eigenfaces" ran PCA on face photos: each face became a short list of scores on component images, so comparing two faces meant comparing a handful of numbers instead of thousands of pixels.
      :::
    bridges: []
  - id: pca-and-factorization.s4
    title: Decide what you can afford to lose
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.pca-and-factorization
    markdown: |-
      PCA only sees variance, so anything that changes variance changes the answer.

      :::predict Record arm span in millimeters but keep height in centimeters. What happens to the first direction?
      It swings almost entirely onto arm span. In millimeters, arm span's variance grows 100-fold to 500, so the first direction becomes about (0.08, 0.997) and claims over 99% of the variance. The data didn't change, only the units. That's why PCA on mixed units usually starts by **standardizing** each column (subtract the mean, divide by the standard deviation), as in the clustering lesson.
      :::

      :::mixup "The directions with the most variance are the ones that matter."
      PCA never looks at your goal. A factory's sensor readings might vary a lot with room temperature, while the faint vibration that warns of a bearing failure lives in a tiny-variance direction. Keep 95% of the variance and you may throw the warning away.
      :::

      Here's how Sam, building that failure detector, uses PCA safely. He fits the centering, scaling, and directions on training data only, so the test set stays unseen. He keeps enough components for 95% of the variance: 12 of 40. Then he trains the detector twice, on all 40 features and on the 12 scores, and compares failures caught on the test set. If the compressed version catches fewer, he adds components back until it doesn't.
    bridges: []
  - id: pca-and-factorization.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.pca-and-factorization
    markdown: Face photos, mixed-unit sensor data, a leaky test set, and a few projections and variance ratios by hand test whether you can run PCA and judge what it discards.
    takeaway: |-
      PCA centers the data, finds the orthogonal directions of greatest variance, and keeps the top few; the explained variance ratio tells you how much spread you kept. Check the units first, and check that what you dropped didn't matter for your task.
  - id: pca-and-factorization.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.pca-and-factorization
    markdown: |-
      PCA compresses data by keeping directions of large variation. Check what it discards: a small variation can still carry information that matters for your task.
