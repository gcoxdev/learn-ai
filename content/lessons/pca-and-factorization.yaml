  bridges: []
- id: pca-and-factorization.s4
  title: Choose compression for a purpose
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.pca-and-factorization
  markdown: A high-variance direction can be unrelated to a target, while a low-variance feature can identify
    a rare class. Fit preprocessing on training data and assess downstream performance separately. A compressed
    representation that reconstructs typical examples well can still erase unusual but consequential cases.
  text_mode: A high-variance direction can be unrelated to a target, while a low-variance feature can identify
    a rare class. Fit preprocessing on training data and assess downstream performance separately. A compressed
    representation that reconstructs typical examples well can still erase unusual but consequential cases.
  bridges: []
- id: pca-and-factorization.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
