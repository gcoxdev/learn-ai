schema_version: 0.2-draft
lesson:
  id: pca-and-factorization
  version: 0.1.0-draft
  title: Compress variation into fewer directions
  state: draft
  summary: PCA and matrix factorization reduce dimensionality by retaining structured variation; centering, scaling,
    rank, and the downstream task determine what is preserved or lost.
  slot: M08.3
  category: learning
  minutes: 12
  sources:
  - title: Deep Learning — linear algebra
    url: https://www.deeplearningbook.org/contents/linear_algebra.html
  - title: An Introduction to Statistical Learning — authors’ materials
    url: https://www.statlearning.com/
objectives:
- id: objective.pca-and-factorization
  version: 1-draft
  statement: PCA and matrix factorization reduce dimensionality by retaining structured variation; centering, scaling,
    rank, and the downstream task determine what is preserved or lost.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - pca-and-factorization.base
  - pca-and-factorization.transfer
  prerequisites:
  - anyOf:
    - objective.linear-algebra-depth
  - anyOf:
    - objective.random-variables
scenes:
- id: pca-and-factorization.s1
  title: Look for redundant directions
  type: explanation
  depth: intuition
  objective_refs:
  - objective.pca-and-factorization
  markdown: If two measurements move together, data may occupy a narrow region of a larger coordinate space. PCA
    finds orthogonal directions of greatest variance after a specified centering and scaling procedure. Keeping
    a few directions gives a compact coordinate representation and a corresponding reconstruction.
  text_mode: If two measurements move together, data may occupy a narrow region of a larger coordinate space. PCA
    finds orthogonal directions of greatest variance after a specified centering and scaling procedure. Keeping
    a few directions gives a compact coordinate representation and a corresponding reconstruction.
  bridges: []
- id: pca-and-factorization.s2
  title: A simple line-shaped example
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.pca-and-factorization
  markdown: Points [1, 1], [2, 2], and [3, 3] vary only along the diagonal after centering. One principal direction
    can represent their variation exactly in this ideal example. Noise away from the line would be discarded by
    a one-direction reconstruction, whether that noise was irrelevant or task-important.
  text_mode: Points [1, 1], [2, 2], and [3, 3] vary only along the diagonal after centering. One principal direction
    can represent their variation exactly in this ideal example. Noise away from the line would be discarded by
    a one-direction reconstruction, whether that noise was irrelevant or task-important.
  bridges:
  - linear-algebra-depth
- id: pca-and-factorization.s3
  title: Relate PCA to matrix factorization
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.pca-and-factorization
  markdown: A singular value decomposition of the centered data matrix provides principal directions and strengths.
    Other factorizations impose different assumptions, such as nonnegative factors or task-specific losses. The
    chosen rank limits the number of retained directions and changes both storage and approximation error.
  text_mode: A singular value decomposition of the centered data matrix provides principal directions and strengths.
    Other factorizations impose different assumptions, such as nonnegative factors or task-specific losses. The
    chosen rank limits the number of retained directions and changes both storage and approximation error.
  bridges: []
- id: pca-and-factorization.s4
  title: Choose compression for a purpose
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.pca-and-factorization
  markdown: A high-variance direction can be unrelated to a target, while a low-variance feature can identify a
    rare class. Fit preprocessing on training data and assess downstream performance separately. A compressed representation
    that reconstructs typical examples well can still erase unusual but consequential cases.
  text_mode: A high-variance direction can be unrelated to a target, while a low-variance feature can identify a
    rare class. Fit preprocessing on training data and assess downstream performance separately. A compressed representation
    that reconstructs typical examples well can still erase unusual but consequential cases.
  bridges: []
- id: pca-and-factorization.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.pca-and-factorization
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
- id: pca-and-factorization.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.pca-and-factorization
  markdown: PCA and matrix factorization reduce dimensionality by retaining structured variation; centering, scaling,
    rank, and the downstream task determine what is preserved or lost.
  text_mode: PCA and matrix factorization reduce dimensionality by retaining structured variation; centering, scaling,
    rank, and the downstream task determine what is preserved or lost.
