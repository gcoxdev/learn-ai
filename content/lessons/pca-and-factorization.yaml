assessment_families:
  - id: pca-and-factorization.base
    objective_ref: objective.pca-and-factorization
    task: base
    response_type: single_choice
    points: 1
    hint: 'A simple line-shaped example: trace the inputs, operation, and result before choosing.'
    remediation_scene: pca-and-factorization.s2
    variants:
      - id: pca-and-factorization.base.1
        prompt: Which criterion does ordinary PCA prioritize?
        options:
          - id: c
            text: The newest features first
          - id: a
            text: Directions of variance under its preprocessing convention
          - id: b
            text: The class labels automatically
        answer: a
        feedback: PCA is an unsupervised variance-based method.
        retired: true
      - id: pca-and-factorization.base.2
        prompt: Centered points lie exactly on one line. How many principal directions capture their nonzero variation?
        options:
          - id: a
            text: One
          - id: b
            text: Two necessarily
          - id: c
            text: As many as there are points
        answer: a
        feedback: The ideal data variation has rank one.
        retired: true
  - id: pca-and-factorization.transfer
    objective_ref: objective.pca-and-factorization
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Choose compression for a purpose: trace the inputs, operation, and result before choosing.'
    remediation_scene: pca-and-factorization.s4
    variants:
      - id: pca-and-factorization.transfer.1
        prompt: A low-variance feature predicts a rare failure. Should it automatically be discarded?
        options:
          - id: a
            text: No; task usefulness differs from variance
          - id: b
            text: Yes; low variance means zero information for every task
          - id: c
            text: Only if PCA is unsupervised
        answer: a
        feedback: Compression criteria must be checked against downstream needs.
        retired: true
      - id: pca-and-factorization.transfer.2
        prompt: A PCA transform is fitted using the final test set. What concern arises?
        options:
          - id: b
            text: No concern because PCA ignores labels
          - id: c
            text: The transform becomes causal
          - id: a
            text: Held-out information entered representation fitting
        answer: a
        feedback: Unsupervised fitting can still leak evaluation information.
        retired: true
  - id: pca-and-factorization.base.v2
    objective_ref: objective.pca-and-factorization
    task: base
    response_type: single_choice
    points: 1
    hint: PCA centers the data, then finds orthogonal directions ranked by how much variance the points have along each. Each eigenvalue is the variance along its direction.
    remediation_scene: pca-and-factorization.s3
    variants:
      - id: pca-and-factorization.base.v2.1
        prompt: Someone runs PCA on raw heights around 170 cm and arm spans around 172 cm but forgets to center them. What goes wrong with the first direction?
        options:
          - id: a
            text: Nothing; PCA only uses differences between the points
          - id: c
            text: It points from zero toward the data's average, not along its spread
          - id: b
            text: It swaps to the direction with the least variance instead
        answer: c
        feedback: Without centering, the huge distance from zero to the cloud's average dominates, so the first direction points at the average rather than along the diagonal spread. The covariance formula assumes centered data.
      - id: pca-and-factorization.base.v2.2
        prompt: 'For two measurements, the covariance matrix has eigenvalues 9 and 1. What does the 1 tell you?'
        options:
          - id: c
            text: The second direction is pure noise and holds no information
          - id: b
            text: Exactly one point lies off the line of the first direction
          - id: a
            text: The variance you'd give up by keeping only the first direction
        answer: a
        feedback: Each eigenvalue is the variance along its direction, so dropping the second loses variance 1 out of 10. That small spread might still matter (it held Dee's long arms), and it comes from several points, not one.
      - id: pca-and-factorization.base.v2.3
        prompt: How do the singular value decomposition of centered data and PCA relate?
        options:
          - id: b
            text: The SVD's right singular vectors are the PCA directions
          - id: c
            text: The SVD finds the least-variance direction first, the reverse of PCA
          - id: a
            text: The SVD uses the class labels, which PCA ignores
        answer: b
        feedback: For centered X = UΣVᵀ, the rows of Vᵀ are the principal directions and σ²/(n − 1) gives each variance. SVD orders singular values from largest down, and neither method uses labels.
      - id: pca-and-factorization.base.v2.4
        prompt: A 1,000 × 50 data table is replaced by its best rank-5 approximation. What does that approximation keep?
        options:
          - id: b
            text: The first five columns of the original table
          - id: a
            text: The five rows holding the largest values
          - id: c
            text: The five directions along which the data vary most
        answer: c
        feedback: The best rank-5 approximation keeps the top five singular directions, mixing all 50 columns. Keeping five original columns or rows discards the others instead of summarizing them.
      - id: pca-and-factorization.base.v2.5
        prompt: Out of every possible direction through a centered cloud of points, which one does PCA pick first?
        options:
          - id: a
            text: The one along which the points' projected scores vary the most
          - id: b
            text: The one that best predicts the label you care about
          - id: c
            text: The one that passes exactly through the most data points
        answer: a
        feedback: PCA maximizes the variance of the scores along the direction, which is the same as minimizing the squared rebuild error. It never sees a label, and it doesn't count points lying exactly on a line.
  - id: pca-and-factorization.transfer.v2
    objective_ref: objective.pca-and-factorization
    task: transfer
    response_type: single_choice
    points: 1
    hint: PCA keeps variance, not usefulness. Check the units, fit it on training data only, and test whether the task still works after compression.
    remediation_scene: pca-and-factorization.s4
    variants:
      - id: pca-and-factorization.transfer.v2.1
        prompt: A health dataset records weight in grams and height in meters. After PCA, the first component is almost exactly the weight column. What is the best fix?
        options:
          - id: a
            text: Standardize both columns before running PCA
          - id: c
            text: Keep more components so that height gets included
          - id: b
            text: Drop the height column, since PCA shows it barely varies
        answer: a
        feedback: Grams produce huge variances next to meters, so weight dominates purely because of units. Standardizing puts both on a common scale. Dropping height mistakes a unit effect for a lack of information.
      - id: pca-and-factorization.transfer.v2.2
        prompt: An engineer compresses 40 sensor features to the components holding 95% of the variance. The fault detector trained on them now misses faults it used to catch. What is the most likely cause?
        options:
          - id: c
            text: PCA mixed up which training examples were labeled as faults
          - id: b
            text: The fault signal lay in a low-variance direction that was dropped
          - id: a
            text: The kept components weren't at right angles to each other
        answer: b
        feedback: PCA ranks directions by variance, not by usefulness, so a faint but telling signal can land in the discarded 5%. PCA never touches the labels, and its components are orthogonal by construction.
      - id: pca-and-factorization.transfer.v2.3
        prompt: A team fits PCA on all its data, including the final test set, then trains and tests a classifier on the scores. What should it do instead?
        options:
          - id: b
            text: Nothing; PCA ignores labels, so test data can't leak into it
          - id: a
            text: Fit a separate PCA on the test set so each set has its own directions
          - id: c
            text: Fit PCA on the training data only, then apply it to the test set
        answer: c
        feedback: The test set's values shaped the mean, scaling, and directions, so information leaked even without labels. Fitting a separate PCA on the test set gives directions the model was never trained on.
      - id: pca-and-factorization.transfer.v2.4
        prompt: Face photos have 10,000 pixels each. PCA keeps 50 components holding 95% of the variance. What does each face become?
        options:
          - id: a
            text: Fifty scores, rebuilt as the mean face plus 50 weighted component images
          - id: b
            text: The fifty pixels that vary the most across all of the photos
          - id: c
            text: Fifty of the original photos that best represent the whole set
        answer: a
        feedback: Each face is stored as 50 scores; rebuilding it adds the mean face to the score-weighted sum of 50 component images, as in eigenfaces. Each component mixes all pixels, so it isn't a selection of pixels or of photos.
  - id: pca-and-factorization.calc.v2
    objective_ref: objective.pca-and-factorization
    task: base
    response_type: numeric
    points: 1
    hint: The explained variance ratio is one eigenvalue divided by the sum of all of them. A score is the dot product of the centered point with the unit direction.
    remediation_scene: pca-and-factorization.s2
    variants:
      - id: pca-and-factorization.calc.v2.1
        prompt: A covariance matrix has eigenvalues 16 and 4. What explained variance ratio does the first principal component have? Give two decimal places.
        answer: 0.8
        feedback: 16 / (16 + 4) = 0.80, so one component keeps 80% of the variance.
      - id: pca-and-factorization.calc.v2.2
        prompt: 'Two columns have covariance matrix [[4, 3], [3, 4]], whose eigenvalues are 4 + 3 and 4 − 3. What explained variance ratio does the first component have? Give two decimal places.'
        answer: 0.875
        feedback: The eigenvalues are 7 and 1, so the ratio is 7 / 8 = 0.875.
      - id: pca-and-factorization.calc.v2.3
        prompt: A centered point is (4, 2), and the first direction is (0.707, 0.707). What is the point's score on that direction? Give two decimal places.
        answer: 4.24
        feedback: 4 × 0.707 + 2 × 0.707 = 6 × 0.707 = 4.24.
      - id: pca-and-factorization.calc.v2.4
        prompt: Three components have eigenvalues 6, 3, and 1. What is the smallest number of components that keeps at least 85% of the variance?
        answer: 2
        feedback: One component keeps 6 / 10 = 60%; two keep 9 / 10 = 90%, which clears 85%.
      - id: pca-and-factorization.calc.v2.5
        prompt: A centered point (5, 1) is compressed to its score on the direction (0.707, 0.707) and then rebuilt as (3, 3). What is its squared reconstruction error?
        answer: 8
        feedback: The misses are 5 − 3 = 2 and 1 − 3 = −2, so the squared error is 4 + 4 = 8.
    absolute_tolerance: 0.01
