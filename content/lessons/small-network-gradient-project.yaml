scenes:
  - id: small-network-gradient-project.s1
    title: 'Your brief: a network that bends where a line can''t'
    type: explanation
    depth: intuition
    objective_refs:
      - objective.small-network-gradient-project
    markdown: |-
      A city bike-share team wants to forecast daily rides from the temperature. Cold days are quiet, mild days are busy, and on the hottest days riders stay home. Plot it and you get a hump. A straight line can only go up or down, so it can't follow a hump. A network with one hidden layer can.

      You'll build that network yourself: no deep-learning library, just NumPy and the rules from the neural-network and optimization modules. Libraries do all of this for you. Doing it once by hand is how you learn to trust them, and to debug them when a model won't train.

      | Brief | |
      | --- | --- |
      | Goal | Fit rides against temperature with a two-layer ReLU network written from scratch |
      | Reader | A teammate who will review your code before it's reused |
      | Data | Twelve days of rides (next page) |
      | Time | About 75 minutes; a paper-and-spreadsheet version takes about 45 |

      **Done looks like:**

      - a one-hidden-unit warm-up traced by hand, with every intermediate number;
      - a forward and backward pass in NumPy, with the shape of every array written down;
      - a gradient check whose worst relative error is below $10^{-6}$;
      - a training curve that falls well below the best straight line's loss;
      - a short note explaining one thing you broke on purpose and how the check or the curve caught it.
    bridges: []
  - id: small-network-gradient-project.data
    title: Twelve days of rides
    type: explanation
    depth: intuition
    objective_refs:
      - objective.small-network-gradient-project
    markdown: |-
      The data is invented but shaped like real bike-share demand. Rides are in thousands.

      | Temperature (°C) | 2 | 5 | 8 | 11 | 14 | 17 | 20 | 23 | 26 | 29 | 32 | 35 |
      | --- | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: |
      | Rides (thousands) | 0.3 | 0.5 | 0.8 | 1.1 | 1.4 | 1.7 | 1.9 | 2.0 | 1.9 | 1.6 | 1.2 | 0.8 |

      Before training, the input is rescaled to $x = (\text{temperature} - 18.5)/10$, so it runs from −1.65 to 1.65. Centering on zero puts every hidden unit's starting corner in the middle of the data (the biases start at zero, so each corner starts at $x = 0$), and small inputs keep the first gradient steps a sensible size.

      :::predict The best possible straight line through these points has a mean squared error of 0.2241. Will a network with 8 hidden ReLU units do much better, or only a little?
      Much better: it gets below 0.001. Each ReLU unit is a "hinge," flat on one side and sloped on the other. Adding a few hinges with different corners lets the output rise, level off, and fall, which is exactly the hump. A straight line has no corners to spend.
      :::
    bridges: []
  - id: small-network-gradient-project.s2
    title: 'Milestone 1: one example, one hidden unit, by hand'
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.small-network-gradient-project
    markdown: |-
      Start with the smallest two-layer network there is, so you can see every number. One example has input $x = 2$ and target $y = 3$. The network is

      $$h = \text{ReLU}(wx), \qquad p = vh, \qquad L = \tfrac{1}{2}(p - y)^2$$

      with starting weights $w = 1$, $v = 1$, no biases, and learning rate 0.1. Draw the computational graph first, as in "How an error reaches earlier weights," then fill it in:

      | Quantity | Rule | Value |
      | --- | --- | ---: |
      | $wx$ | $1 \times 2$ | 2 |
      | $h$ | ReLU(2) | 2 |
      | $p$ | $1 \times 2$ | 2 |
      | $L$ | $\tfrac12(2 - 3)^2$ | 0.5 |
      | $\partial L/\partial p$ | $p - y$ | −1 |
      | $\partial L/\partial v$ | $(p - y)\,h$ | −2 |
      | $\partial L/\partial w$ | $(p - y)\,v \cdot 1 \cdot x$ | −2 |

      The "· 1" is ReLU's slope, which is 1 because $wx = 2$ is positive.

      Now update **both** weights using gradients computed at the *original* values: $w = 1 - 0.1(-2) = 1.2$ and $v = 1.2$. A fresh forward pass gives $h = 2.4$, $p = 2.88$, and $L = 0.0072$, down from 0.5.

      :::predict You update v first, to 1.2, and then compute ∂L/∂w using the new v. What do you get, and is it still gradient descent?
      $(p - y)\,v\,x = (-1)(1.2)(2) = -2.4$, so $w$ would become 1.24 instead of 1.2. That's no longer the gradient at any single point: it mixes old and new weights. Compute every gradient first, then update everything together.
      :::
    bridges:
      - chain-rule
      - derivatives
  - id: small-network-gradient-project.s3
    title: 'Milestones 2–4: forward, backward, and a gradient check'
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.small-network-gradient-project
    markdown: |-
      Now scale up to all twelve days at once and 8 hidden units. Write the shape of every array before writing code; most bugs in hand-written networks are shape bugs.

      | Array | Meaning | Shape |
      | --- | --- | --- |
      | `x` | Scaled temperatures | 12 × 1 |
      | `W1`, `b1` | Input-to-hidden weights and biases | 1 × 8, 8 |
      | `z`, `h` | Pre-activations, then ReLU outputs | 12 × 8 |
      | `W2`, `b2` | Hidden-to-output weights and bias | 8 × 1, 1 |
      | `out` | Predicted rides | 12 × 1 |

      **Milestone 2, forward.** $z = xW_1 + b_1$, $h = \text{ReLU}(z)$, $\text{out} = hW_2 + b_2$, and the loss is the **mean** squared error over the 12 days (the lesson "Trace inputs through layers to a loss" traces this for one input).

      **Milestone 3, backward.** Work right to left, multiplying local slopes along each path and adding across examples:

      :::papers Backpropagation for one hidden layer
      $$\delta_{\text{out}} = \frac{2}{n}(\text{out} - y), \qquad \frac{\partial L}{\partial W_2} = h^\top \delta_{\text{out}}, \qquad \delta_z = \big(\delta_{\text{out}} W_2^\top\big) \odot \mathbb{1}[z > 0], \qquad \frac{\partial L}{\partial W_1} = x^\top \delta_z$$

      Here $n = 12$, $\odot$ multiplies entry by entry, and $\mathbb{1}[z > 0]$ is ReLU's slope: 1 where the unit was on, 0 where it was off. The biases' gradients are the column sums of $\delta_{\text{out}}$ and $\delta_z$. Check the shapes: $h^\top \delta_{\text{out}}$ is (8 × 12)(12 × 1) = 8 × 1, matching $W_2$; $x^\top \delta_z$ is (1 × 12)(12 × 8) = 1 × 8, matching $W_1$.
      :::

      **Milestone 4, gradient check.** Before training, test every gradient entry with the central difference from "Check a derivative against a small change": nudge one weight by ±$10^{-5}$, recompute the loss, and compare the slope with your analytic value using the relative error $|g_a - g_n| / \max(|g_a|, |g_n|)$. A correct backward pass in 64-bit floats gives around $10^{-7}$ or smaller; anything near $10^{-2}$ or above is a bug.
    bridges: []
  - id: small-network-gradient-project.reference
    title: 'Milestone 5: train it and read the curve'
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.small-network-gradient-project
    markdown: |-
      Here is a complete reference solution. Write your own first, then compare. The training loop is the one from "Connect data, gradients, and saved model state": forward, loss, backward, update all weights together, repeat. The row of `#` marks is a text-only training curve.

      ```python run
      import numpy as np

      temp  = np.array([2, 5, 8, 11, 14, 17, 20, 23, 26, 29, 32, 35], dtype=float)  # deg C
      rides = np.array([0.3, 0.5, 0.8, 1.1, 1.4, 1.7, 1.9, 2.0, 1.9, 1.6, 1.2, 0.8])  # thousands
      x = ((temp - 18.5) / 10).reshape(-1, 1)          # scaled input, one column
      y = rides.reshape(-1, 1)

      rng = np.random.default_rng(1)
      H = 8                                            # hidden units
      P = {"W1": rng.normal(0, 1.0, (1, H)), "b1": np.zeros(H),
           "W2": rng.normal(0, 0.5, (H, 1)), "b2": np.zeros(1)}

      def forward(P):
          z = x @ P["W1"] + P["b1"]                    # (12, H) pre-activations
          h = np.maximum(0, z)                         # ReLU
          out = h @ P["W2"] + P["b2"]                  # (12, 1) predictions
          return z, h, out, np.mean((out - y) ** 2)    # mean squared error

      def backward(P):
          z, h, out, loss = forward(P)
          d_out = 2 * (out - y) / len(y)               # dL/d(out)
          d_z = (d_out @ P["W2"].T) * (z > 0)          # back through W2, then ReLU
          return {"W2": h.T @ d_out, "b2": d_out.sum(0),
                  "W1": x.T @ d_z, "b1": d_z.sum(0)}

      # Gradient check: compare every analytic entry with a central difference
      g, eps, worst = backward(P), 1e-5, 0.0
      for k in P:
          for i in range(P[k].size):
              old = P[k].flat[i]
              P[k].flat[i] = old + eps; up = forward(P)[3]
              P[k].flat[i] = old - eps; dn = forward(P)[3]
              P[k].flat[i] = old
              num = (up - dn) / (2 * eps)
              worst = max(worst, abs(num - g[k].flat[i]) / max(abs(num), abs(g[k].flat[i]), 1e-12))
      print(f"gradient check: worst relative error {worst:.1e}")

      # Train with full-batch gradient descent and print the training curve
      lr = 0.1
      for step in range(3001):
          g = backward(P)
          if step in (0, 10, 30, 100, 300, 1000, 3000):
              loss = forward(P)[3]
              print(f"step {step:4d}  loss {loss:.4f}  " + "#" * int(20 * loss))
          for k in P:
              P[k] -= lr * g[k]

      A = np.c_[x, np.ones_like(x)]                    # best straight line, for comparison
      line = A @ np.linalg.lstsq(A, y, rcond=None)[0]
      print(f"best straight line: loss {np.mean((line - y) ** 2):.4f}")
      print("network at 2, 23, 35 C:", forward(P)[2][[0, 7, 11], 0].round(2), " actual:", rides[[0, 7, 11]])
      ```

      **What you should see:**

      ```text
      gradient check: worst relative error 7.1e-10
      step    0  loss 1.8040  ####################################
      step   10  loss 0.3458  ######
      step   30  loss 0.0895  #
      step  100  loss 0.0115
      step  300  loss 0.0011
      step 1000  loss 0.0003
      step 3000  loss 0.0003
      best straight line: loss 0.2241
      network at 2, 23, 35 C: [0.29 2.   0.82]  actual: [0.3 2.  0.8]
      ```

      Read the curve the way you'd read any training log. The loss falls steeply for the first 30 steps, passes the straight line's 0.2241 before step 30, and flattens near 0.0003 by step 1,000. The network catches both the peak at 23 °C and the fall-off at 35 °C.

      :::try Break it on purpose, three ways
      1. In `backward`, delete `* (z > 0)` and rerun. The gradient check jumps to a worst relative error of about 1.5: the ReLU slope was missing, and the check caught it before any training happened.
      2. Put it back and set `lr = 0.5`. The loss plunges to 0.009 by step 30, then bounces back up to about 0.08 and stalls near 0.06: steps that big overshoot the valley.
      3. Set `lr = 0.01`. The curve keeps the same shape but is ten times slower, still at 0.0011 after 3,000 steps.
      :::

      :::mixup "The gradient check passed, so the network will train well."
      The check shows that your gradients are the true slopes of your loss at these weights. Whether training then works depends on the learning rate, the starting weights, and the data, which is exactly what the second and third experiments above show. You need both: the check for the math, the curve for the training.
      :::
    bridges: []
  - id: small-network-gradient-project.mistakes
    title: Six bugs and the symptom each one leaves
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.small-network-gradient-project
    markdown: |-
      Each of these is common, and each leaves a recognizable fingerprint. The lesson "Find the first broken assumption in a training run" has more.

      | Bug | Symptom | Fix |
      | --- | --- | --- |
      | ReLU slope left out of the backward pass | Gradient check fails on `W1` and `b1` only; `W2` and `b2` pass | Multiply by `(z > 0)` on the way back through the hidden layer |
      | Loss averages but backward sums | Every analytic gradient is exactly 12 times the numerical one | Divide `d_out` by the number of examples |
      | Weights updated one at a time | Training still works, but your numbers disagree with the reference | Compute every gradient, then update everything |
      | Transposed matrix | A shape error, or a gradient shaped 8 × 12 instead of 8 × 1 | Write the shape table and check each product |
      | Gradient checked at a ReLU corner | One entry fails while its neighbors pass | Check at a different point; kinks have no single slope |
      | Learning rate too large | Loss falls, then bounces or turns into `nan` | Lower it by 3 to 10 times and rerun |
    bridges: []
  - id: small-network-gradient-project.s4
    title: The no-code path and the rubric
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.small-network-gradient-project
    markdown: |-
      **No code?** Do the whole project for the one-hidden-unit network in a spreadsheet, one row per training step. Columns: $w$, $v$, $h$, $p$, $L$, $\partial L/\partial w$, $\partial L/\partial v$. Each row's weights come from the row above minus 0.1 times its gradients. Your rows should read:

      | Step | $w$ | $v$ | $p$ | $L$ |
      | ---: | ---: | ---: | ---: | ---: |
      | 0 | 1 | 1 | 2 | 0.5 |
      | 1 | 1.2 | 1.2 | 2.88 | 0.0072 |
      | 2 | 1.2288 | 1.2288 | 3.0199 | 0.000198 |
      | 3 | 1.2239 | 1.2239 | 2.9959 | 0.000008 |

      Plot $L$ against step: that's your training curve. Notice step 2 overshoots the target 3 and step 3 comes back. For the gradient check, add cells computing $L$ at $w = 1.001$ and $w = 0.999$ (with $v = 1$); their difference divided by 0.002 should give −2, matching your $\partial L/\partial w$.

      **Rubric.** Score each row 0, 1, or 2:

      | Criterion | 0: missing or wrong | 1: partly there | 2: solid |
      | --- | --- | --- | --- |
      | Forward pass | Values or shapes wrong | Right values, shapes not written down | Right values and a shape table |
      | Backward pass | Missing a chain-rule factor | Right, but not explained | Right, with each factor named |
      | Gradient check | Not done | Done, but only on some weights | Every weight checked, worst error reported |
      | Updates | Weights updated one at a time | Simultaneous, but loss not recomputed | Simultaneous, with a fresh forward pass |
      | Training curve | No curve | Curve shown | Curve compared with the straight line and read aloud |
      | Break-it note | None | One bug described | Bug, symptom, and how it was caught |

      The quiz below checks the ideas; this rubric, used by you or a friend, judges your code and notes.
    bridges: []
  - id: small-network-gradient-project.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.small-network-gradient-project
    markdown: |-
      Hand-traced gradients at new numbers, array shapes, and five strange training logs and gradient checks test whether you could debug a network you wrote yourself.
    takeaway: |-
      Trace the forward pass, multiply local slopes backward, and check every gradient with a small nudge before you train. Then update all weights together and read the loss curve to see whether training works.
  - id: small-network-gradient-project.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.small-network-gradient-project
    markdown: |-
      Trace the forward calculation, work backward through local slopes, update both weights from the original values, and recompute the loss.
