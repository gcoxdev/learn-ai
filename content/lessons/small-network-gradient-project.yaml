  id: small-network-gradient-project
  version: 0.4.0-draft
  title: 'Project: build a two-layer network and check its gradients'
  state: draft
  summary: Bike rides climb with temperature, then fall when it gets too hot, and no straight line can follow. Build the network that can, from scratch in NumPy, and prove its gradients are right.
  slot: M36.3
  category: learning
  minutes: 75
  sources:
    - title: Dive into Deep Learning — authors’ open textbook
      url: https://d2l.ai/
objectives:
  - id: objective.small-network-gradient-project
    version: 2-draft
    statement: Build a two-layer network by hand, compute its forward pass and gradients, confirm them with a gradient check, and train it with simultaneous updates while reading the loss curve.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - small-network-gradient-project.base.v2
      - small-network-gradient-project.transfer.v2
      - small-network-gradient-project.calculate
    prerequisites:
      - anyOf:
          - objective.backpropagation
      - anyOf:
