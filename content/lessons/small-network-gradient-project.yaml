schema_version: 0.2-draft
lesson:
  id: small-network-gradient-project
  version: 0.3.0-draft
  title: 'Project: trace a tiny network and one gradient update'
  state: draft
  summary: Draw a tiny network, calculate its slopes, and check one learning step.
  slot: M36.3
  category: learning
  minutes: 45
  sources:
  - title: Dive into Deep Learning — authors’ open textbook
    url: https://d2l.ai/
objectives:
- id: objective.small-network-gradient-project
  version: 1-draft
  statement: Compute a small network’s forward pass, local derivatives, and simultaneous parameter update,
    then explain where the calculation differs from realistic training.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - small-network-gradient-project.base
  - small-network-gradient-project.transfer
  prerequisites:
  - anyOf:
    - objective.backpropagation
  - anyOf:
    - objective.gradient-checks
scenes:
- id: small-network-gradient-project.s1
  title: Define the whole experiment
  type: explanation
  depth: intuition
  objective_refs:
  - objective.small-network-gradient-project
  markdown: Work on paper, a spreadsheet, or an optional short script. One example has input x=2 and target
    y=3. Define h=ReLU(wx), prediction p=vh, and loss L=(p−y)²/2. Start w=1, v=1 and learning rate 0.1. There
    are no biases. Write the computational graph before evaluating anything; calculus bridges are available
    for each local slope.
  text_mode: Work on paper, a spreadsheet, or an optional short script. One example has input x=2 and target
    y=3. Define h=ReLU(wx), prediction p=vh, and loss L=(p−y)²/2. Start w=1, v=1 and learning rate 0.1. There
    are no biases. Write the computational graph before evaluating anything; calculus bridges are available
    for each local slope.
  bridges: []
- id: small-network-gradient-project.s2
  title: Trace and differentiate
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.small-network-gradient-project
  markdown: Initially wx=2, h=2, p=2, and L=0.5. The output-loss slope is p−y=−1. Thus dL/dv=(p−y)h=−2. ReLU
    has slope 1 at this positive input, so dL/dw=(p−y)v·1·x=−2. Both derivatives use the original parameters;
    updating v early would change the calculation into a different procedure.
  text_mode: Initially wx=2, h=2, p=2, and L=0.5. The output-loss slope is p−y=−1. Thus dL/dv=(p−y)h=−2. ReLU
    has slope 1 at this positive input, so dL/dw=(p−y)v·1·x=−2. Both derivatives use the original parameters;
    updating v early would change the calculation into a different procedure.
  bridges:
  - chain-rule
  - derivatives
- id: small-network-gradient-project.s3
  title: Update and check
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.small-network-gradient-project
  markdown: A simultaneous step gives w=1.2 and v=1.2. Now h=2.4, p=2.88, and L=0.0072. Compare a small finite
    difference of the original loss against the analytic slopes, keeping the other parameter fixed. Avoid crossing
    a ReLU corner for this check. Improvement on this example does not establish generalization or guarantee
    every later step decreases loss.
  text_mode: A simultaneous step gives w=1.2 and v=1.2. Now h=2.4, p=2.88, and L=0.0072. Compare a small finite
    difference of the original loss against the analytic slopes, keeping the other parameter fixed. Avoid crossing
    a ReLU corner for this check. Improvement on this example does not establish generalization or guarantee
    every later step decreases loss.
  bridges: []
- id: small-network-gradient-project.s4
  title: Write a reviewable notebook
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.small-network-gradient-project
  markdown: 'Save the graph, intermediate numbers, derivatives, update, and recomputed loss. Explain what happens
    if wx is negative and why a step size matters. Review four criteria at 0–2 each: correct forward values,
    chain-rule links, simultaneous updates, and stated limitations. The quiz checks this reasoning only; your
    written derivation needs separate self or peer review.'
  text_mode: 'Save the graph, intermediate numbers, derivatives, update, and recomputed loss. Explain what
    happens if wx is negative and why a step size matters. Review four criteria at 0–2 each: correct forward
    values, chain-rule links, simultaneous updates, and stated limitations. The quiz checks this reasoning
    only; your written derivation needs separate self or peer review.'
  bridges: []
- id: small-network-gradient-project.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.small-network-gradient-project
  markdown: Try these questions to check the ideas behind your project. Use the lesson’s rubric for self or
    peer review of your work; the app does not grade the project artifact.
  text_mode: Try these questions to check the ideas behind your project. Use the lesson’s rubric for self or
    peer review of your work; the app does not grade the project artifact.
  takeaway: Trace the forward calculation, work backward through local slopes, update both weights from the
    original values, and recompute the loss.
- id: small-network-gradient-project.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.small-network-gradient-project
  markdown: Trace the forward calculation, work backward through local slopes, update both weights from the
    original values, and recompute the loss.
  text_mode: Trace the forward calculation, work backward through local slopes, update both weights from the
    original values, and recompute the loss.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - small-network-gradient-project.s1
    - small-network-gradient-project.s2
    - small-network-gradient-project.s3
    - small-network-gradient-project.s4
    - small-network-gradient-project.check
    gate_refs:
    - gate.core
  scene_aliases:
    small-network-gradient-project.recap: small-network-gradient-project.check
assessment_families:
- id: small-network-gradient-project.base
  objective_ref: objective.small-network-gradient-project
  task: base
  response_type: single_choice
  points: 1
  hint: 'Trace and differentiate: trace the inputs, operation, and result before choosing.'
  remediation_scene: small-network-gradient-project.s2
  variants:
  - id: small-network-gradient-project.base.1
    prompt: What is the initial prediction?
    options:
    - id: c
      text: '0.5'
    - id: a
      text: '2'
    - id: b
      text: '3'
    answer: a
    feedback: ReLU(1×2)=2 and v=1.
  - id: small-network-gradient-project.base.2
    prompt: What is the initial derivative with respect to v?
    options:
    - id: a
      text: −2
    - id: b
      text: '2'
    - id: c
      text: −1
    answer: a
    feedback: Multiply output-loss slope −1 by h=2.
- id: small-network-gradient-project.transfer
  objective_ref: objective.small-network-gradient-project
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Write a reviewable notebook: trace the inputs, operation, and result before choosing.'
  remediation_scene: small-network-gradient-project.s4
  variants:
  - id: small-network-gradient-project.transfer.1
    prompt: What are the parameters after the simultaneous step?
    options:
    - id: a
      text: w=1.2 and v=1.2
    - id: b
      text: w=0.8 and v=0.8
    - id: c
      text: w=1.24 and v=1.2
    answer: a
    feedback: Both gradients were computed at the original point.
  - id: small-network-gradient-project.transfer.2
    prompt: Does lower loss on this example prove better test performance?
    options:
    - id: b
      text: 'Yes'
    - id: c
      text: Only if both parameters changed
    - id: a
      text: 'No'
    answer: a
    feedback: A training update and generalization are separate observations.
