assessment_families:
  - id: small-network-gradient-project.base
    objective_ref: objective.small-network-gradient-project
    task: base
    response_type: single_choice
    points: 1
    hint: 'Trace and differentiate: trace the inputs, operation, and result before choosing.'
    remediation_scene: small-network-gradient-project.s2
    variants:
      - id: small-network-gradient-project.base.1
        prompt: What is the initial prediction?
        options:
          - id: c
            text: '0.5'
          - id: a
            text: '2'
          - id: b
            text: '3'
        answer: a
        feedback: ReLU(1×2)=2 and v=1.
        retired: true
      - id: small-network-gradient-project.base.2
        prompt: What is the initial derivative with respect to v?
        options:
          - id: a
            text: −2
          - id: b
            text: '2'
          - id: c
            text: −1
        answer: a
        feedback: Multiply output-loss slope −1 by h=2.
        retired: true
  - id: small-network-gradient-project.transfer
    objective_ref: objective.small-network-gradient-project
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Write a reviewable notebook: trace the inputs, operation, and result before choosing.'
    remediation_scene: small-network-gradient-project.s4
    variants:
      - id: small-network-gradient-project.transfer.1
        prompt: What are the parameters after the simultaneous step?
        options:
          - id: a
            text: w=1.2 and v=1.2
          - id: b
            text: w=0.8 and v=0.8
          - id: c
            text: w=1.24 and v=1.2
        answer: a
        feedback: Both gradients were computed at the original point.
        retired: true
      - id: small-network-gradient-project.transfer.2
        prompt: Does lower loss on this example prove better test performance?
        options:
          - id: b
            text: 'Yes'
          - id: c
            text: Only if both parameters changed
          - id: a
            text: 'No'
        answer: a
        feedback: A training update and generalization are separate observations.
        retired: true
  - id: small-network-gradient-project.base.v2
    objective_ref: objective.small-network-gradient-project
    task: base
    response_type: single_choice
    points: 1
    hint: 'Write down the shape and the job of each step: forward values, local slopes multiplied backward, a check against nudges, then one simultaneous update.'
    remediation_scene: small-network-gradient-project.s3
    variants:
      - id: small-network-gradient-project.base.v2.1
        prompt: In the rides network, x is 12 × 1 and W1 is 1 × 8. What shape is the gradient xᵀ δ_z that updates W1?
        options:
          - id: b
            text: 12 × 8, one row per day
          - id: a
            text: 1 × 8, the same shape as W1
          - id: c
            text: 8 × 1, the same shape as W2
        answer: a
        feedback: A gradient always has the shape of the thing it updates. xᵀ is 1 × 12 and δ_z is 12 × 8, so the product is 1 × 8. The 12 × 8 array is δ_z itself, before the days are summed out.
      - id: small-network-gradient-project.base.v2.2
        prompt: Why does the backward pass multiply by (z > 0) on its way back through the hidden layer?
        options:
          - id: c
            text: To keep the hidden layer's weights from turning negative
          - id: b
            text: To remove negative predictions from the network's output
          - id: a
            text: It is ReLU's slope, 1 where a unit was on and 0 where off
        answer: a
        feedback: The chain rule multiplies by each operation's local slope, and ReLU's slope is 1 for positive inputs and 0 for negative ones. Units that were off for an example pass back no gradient from it. It has nothing to do with the sign of weights or outputs.
      - id: small-network-gradient-project.base.v2.3
        prompt: You compute ∂L/∂v, update v, and then compute ∂L/∂w using the new v. What have you changed?
        options:
          - id: a
            text: ∂L/∂w is now taken at a different point, not the original one
          - id: b
            text: Nothing, since the order of the updates doesn't matter
          - id: c
            text: The step is now more accurate because it uses newer values
        answer: a
        feedback: Gradient descent steps along the gradient at one point. Mixing old w with new v gives a slope from somewhere else; in the warm-up it moves w to 1.24 instead of 1.2. Compute all gradients first, then update together.
      - id: small-network-gradient-project.base.v2.4
        prompt: 'Your gradient check prints a worst relative error of 7e-10. What does that tell you?'
        options:
          - id: b
            text: The network will reach a low loss once it trains
          - id: a
            text: The backward pass gives the true slopes at these weights
          - id: c
            text: The learning rate is small enough to be stable
        answer: a
        feedback: A gradient check compares your formulas with the loss's actual slopes, measured by nudging. It says the math is right. Whether training succeeds still depends on the step size and the starting weights.
      - id: small-network-gradient-project.base.v2.5
        prompt: The best straight line reaches loss 0.2241 on the rides data, and the network reaches 0.0003. Why report the line beside the network?
        options:
          - id: c
            text: It checks that the gradient formulas are correct
          - id: b
            text: It shows the network will predict next month's days better
          - id: a
            text: It shows what the hidden layer's bends add over a line
        answer: a
        feedback: The line is the baseline, the best a model with no hidden layer can do on this data. The gap shows the hump needs the ReLU hinges. It says nothing about new days (that needs held-out data) and nothing about gradient correctness.
  - id: small-network-gradient-project.calculate
    objective_ref: objective.small-network-gradient-project
    task: base
    response_type: numeric
    points: 1
    hint: 'Use the warm-up network h = ReLU(wx), p = vh, L = ½(p − y)². Then ∂L/∂v = (p − y)h, and ∂L/∂w = (p − y)·v·(ReLU slope)·x, where the slope is 1 if wx > 0 and 0 otherwise.'
    remediation_scene: small-network-gradient-project.s2
    absolute_tolerance: 0.001
    variants:
      - id: small-network-gradient-project.calculate.1
        prompt: 'In the warm-up network h = ReLU(wx), p = vh, L = ½(p − y)², take x = 1, y = 4, w = 2, v = 1. What is ∂L/∂v?'
        answer: -4
        feedback: 'h = ReLU(2) = 2 and p = 2, so p − y = −2 and ∂L/∂v = (p − y)h = −2 × 2 = −4. Using x instead of h would give −2.'
      - id: small-network-gradient-project.calculate.2
        prompt: 'In the warm-up network h = ReLU(wx), p = vh, L = ½(p − y)², take x = 3, y = 2, w = 1, v = 1. What is ∂L/∂w?'
        answer: 3
        feedback: 'wx = 3, so h = 3, p = 3, and p − y = 1. ReLU''s slope is 1, so ∂L/∂w = 1 × v × 1 × x = 1 × 1 × 1 × 3 = 3. It''s positive because the prediction is too high.'
      - id: small-network-gradient-project.calculate.3
        prompt: 'In the warm-up network h = ReLU(wx), p = vh, L = ½(p − y)², take x = 2, y = 5, w = 1, v = 2. What is ∂L/∂w?'
        answer: -4
        feedback: 'h = 2 and p = 4, so p − y = −1. Then ∂L/∂w = (−1) × v × 1 × x = (−1) × 2 × 2 = −4. Forgetting the factor v gives −2.'
      - id: small-network-gradient-project.calculate.4
        prompt: 'In the warm-up network h = ReLU(wx), p = vh, L = ½(p − y)², take x = −1, y = 2, w = 1, v = 1. What is ∂L/∂w?'
        answer: 0
        feedback: 'wx = −1, so the ReLU is off: h = 0, p = 0, and ReLU''s slope is 0. The chain is multiplied by 0, so ∂L/∂w = 0 even though the prediction is wrong by 2. A unit that is off for an example learns nothing from it.'
      - id: small-network-gradient-project.calculate.5
        prompt: 'Warm-up network h = ReLU(wx), p = vh, L = ½(p − y)², with x = 2, y = 3, w = 1, v = 1. After one simultaneous step with learning rate 0.1, both weights are 1.2. What is the new loss?'
        answer: 0.0072
        feedback: 'h = 1.2 × 2 = 2.4, p = 1.2 × 2.4 = 2.88, and L = ½(2.88 − 3)² = ½ × 0.0144 = 0.0072, down from 0.5.'
  - id: small-network-gradient-project.transfer.v2
    objective_ref: objective.small-network-gradient-project
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Ask which part of the pipeline could produce this exact symptom: a missing chain-rule factor, a sum-versus-mean mismatch, a ReLU corner, dead units, or the step size.'
    remediation_scene: small-network-gradient-project.mistakes
    variants:
      - id: small-network-gradient-project.transfer.v2.1
        prompt: A colleague's gradient check passes for W2 and b2 (about 1e-10) but fails for W1 and b1 (about 1). Where is the bug most likely?
        options:
          - id: b
            text: In the loss function, which feeds the gradients
          - id: c
            text: In the learning rate, which scales the updates
          - id: a
            text: In the step that carries blame back through W2 and the ReLU
        answer: a
        feedback: The output layer's gradients are right, so the loss and its first slope are fine. Only the hidden layer's are wrong, which points at the step back through W2 and ReLU's slope. A loss bug would break every entry, and the learning rate plays no part in a gradient check.
      - id: small-network-gradient-project.transfer.v2.2
        prompt: Every analytic gradient in a 12-example network is exactly 12 times its numerical estimate. What is the likely cause?
        options:
          - id: a
            text: The loss averages over examples but the backward pass sums
          - id: b
            text: The nudge size in the check is too large for this loss
          - id: c
            text: The check was run at a corner of one of the ReLU units
        answer: a
        feedback: A clean factor equal to the batch size points at a sum-versus-mean mismatch. A bad nudge size or a ReLU corner would disturb a few entries by irregular amounts, not all of them by exactly 12.
      - id: small-network-gradient-project.transfer.v2.3
        prompt: A training loss drops fast, then bounces back up and stalls well above what a smaller step size reached. What should you try first?
        options:
          - id: c
            text: Add more hidden units so the network has more capacity
          - id: a
            text: Lower the learning rate and rerun from the same start
          - id: b
            text: Rerun the gradient check with a larger nudge size
        answer: a
        feedback: Falling then bouncing is the signature of steps that overshoot the valley; a smaller step already did better. More units don't fix overshooting, and the gradient check is about correctness, not step size.
      - id: small-network-gradient-project.transfer.v2.4
        prompt: A gradient check fails on one weight whose unit has a pre-activation of 0.000003 for one example. Every other entry passes. What is the best reading?
        options:
          - id: b
            text: The backward pass for that unit has a sign error
          - id: c
            text: The nudge is so small that rounding error dominates
          - id: a
            text: The nudge crosses the ReLU's corner, so recheck elsewhere
        answer: a
        feedback: A nudge of 1e-5 moves that pre-activation across zero, where ReLU has no single slope, so the two methods disagree even with correct code. A real bug would usually show up on more than one entry, and 1e-5 is a normal nudge in 64-bit floats.
      - id: small-network-gradient-project.transfer.v2.5
        prompt: A friend's rides network finishes training at loss 0.2241, the best straight line's loss exactly. What does this suggest?
        options:
          - id: a
            text: The ReLUs aren't bending anything, as if every unit were dead or on
          - id: b
            text: The rides data must be close to linear after all
          - id: c
            text: Training reached the best possible fit for this data
        answer: a
        feedback: A ReLU network whose units are all off, or all on, for every day computes a straight line, so it can only reach the line's loss. The data has a clear hump, and the reference network gets to 0.0003, so neither of the other readings fits.
