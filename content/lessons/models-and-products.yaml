schema_version: 0.2-draft
lesson:
  id: models-and-products
  version: 0.1.0-draft
  title: A model is not the whole product
  state: draft
  summary: A model performs a learned computation. A product can add interfaces, retrieval, tools, checks,
    and rules around that computation.
  slot: M00.2
  category: common
  minutes: 8
  sources:
  - title: 'Artificial Intelligence: A Modern Approach — topic overview'
    url: https://aima.cs.berkeley.edu/contents.html
objectives:
- id: objective.models-and-products
  version: 1-draft
  statement: A model performs a learned computation. A product can add interfaces, retrieval, tools, checks,
    and rules around that computation.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - models-and-products.base
  - models-and-products.transfer
  prerequisites:
  - anyOf:
    - objective.ai-systems
scenes:
- id: models-and-products.s1
  type: explanation
  depth: intuition
  objective_refs:
  - objective.models-and-products
  text_mode: The complete explanation is available as readable text.
  title: Look behind the chat window
  markdown: 'A chat window is an interface. Behind it, software may assemble instructions, retrieve documents,
    run a model, call tools, and display a result.


    The **model** is one component. The **system** is the arrangement of components. Keeping them separate
    helps you explain where a capability or a failure comes from.'
- id: models-and-products.s2
  type: explanation
  depth: intuition
  objective_refs:
  - objective.models-and-products
  text_mode: The complete explanation is available as readable text.
  title: A small system you can trace
  markdown: 'Imagine asking a workplace assistant for the vacation policy. A retrieval component finds policy
    text. The model receives your question and that text. The app displays the answer and a document link.


    If the policy document is stale, a fluent answer can still be wrong. Updating the document may fix the
    system without retraining the model.'
- id: models-and-products.s3
  type: explanation
  depth: intuition
  objective_refs:
  - objective.models-and-products
  text_mode: The complete explanation is available as readable text.
  title: Parameters are not the conversation
  markdown: 'A model’s learned parameters are numbers adjusted during training. The current conversation is
    input available during a request. A tool result is another input.


    Sending a correction in a conversation can change the next answer by changing context. It does not necessarily
    change the model’s learned parameters.'
- id: models-and-products.s4
  type: explanation
  depth: intuition
  objective_refs:
  - objective.models-and-products
  text_mode: The complete explanation is available as readable text.
  title: Give each component a job
  markdown: 'Separate **interface**, **data retrieval**, **model computation**, and **external actions**. When
    something goes wrong, check each boundary.


    An application may use several models. A model may also be used in many applications. Neither one-to-one
    mapping is required.'
- id: models-and-products.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.models-and-products
  markdown: Use two different examples to check your understanding. Hints are available for practice. A later,
    fresh answer without hints can demonstrate personal-study mastery.
  text_mode: Labeled radio options and a submit button; no timing requirement.
- id: models-and-products.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.models-and-products
  markdown: A model performs a learned computation. A product can add interfaces, retrieval, tools, checks,
    and rules around that computation.
  text_mode: A model performs a learned computation. A product can add interfaces, retrieval, tools, checks,
    and rules around that computation.
