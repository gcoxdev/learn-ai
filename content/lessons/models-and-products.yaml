assessment_families:
- id: models-and-products.base
  objective_ref: objective.models-and-products
  task: base
  response_type: single_choice
  points: 1
  hint: 'Trace the example in your own words: what goes in, what happens, and what comes out?'
  variants:
  - id: models-and-products.base.1
    prompt: Which is usually part of the surrounding application?
    options:
    - id: a
      text: A learned weight inside the model.
    - id: b
      text: A matrix multiplication inside a neural layer.
    - id: correct
      text: Retrieving a company document before asking the model.
    answer: correct
    feedback: Retrieving a company document before asking the model.
    retired: true
  - id: models-and-products.base.2
    prompt: What is a model parameter?
    options:
    - id: b
      text: The color of the chat window.
    - id: correct
      text: A learned number used by the model’s computation.
    - id: a
      text: Any message in the current conversation.
    answer: correct
    feedback: A learned number used by the model’s computation.
    retired: true
  - id: models-and-products.base.v2.1
    prompt: Which item is the model in the snack example?
    options:
    - id: c
      text: The button used to request the snack estimate
    - id: a
      text: The rule of two crackers per guest
    - id: b
      text: The guest count supplied for today’s calculation
    answer: a
    feedback: The two-crackers rule turns a guest count into an estimate. The count is the input, while the
      button belongs to the interface.
  - id: models-and-products.base.v2.2
    prompt: Five guests become ten crackers under the same rule. What changed from the three-guest example?
    options:
    - id: a
      text: The input supplied to the rule
    - id: b
      text: The number of crackers per guest
    - id: c
      text: The instruction that says to multiply the numbers
    answer: a
    feedback: The input changed while the rule stayed at two per guest.
  - id: models-and-products.base.v2.3
    prompt: A model names a dog in a photograph. Why can this be called prediction?
    options:
    - id: b
      text: It must be describing what the animal will do next
    - id: c
      text: It must have observed the correct label beforehand
    - id: a
      text: It proposes an answer from supplied information
    answer: a
    feedback: Prediction includes proposing present labels as well as future quantities.
  - id: models-and-products.base.v2.4
    prompt: Which description fits an interface?
    options:
    - id: c
      text: The proposed answer before display
    - id: a
      text: The controls a person interacts with
    - id: b
      text: The examples used to adjust a rule
    answer: a
    feedback: Text boxes and buttons connect the person to the software.
  - id: models-and-products.base.v2.5
    prompt: An app estimates taxi cost using “distance times price per kilometer.” Which part is the model?
    options:
    - id: a
      text: The screen displaying the estimated cost
    - id: b
      text: The payment button below the estimated cost
    - id: c
      text: The rule producing the estimated cost
    answer: c
    feedback: The model is the rule making the prediction. Displaying and collecting payment are other product
      jobs.
  - id: models-and-products.base.v2.6
    prompt: A snack model proposes 10 crackers, but guests eat 12. What is the proposed 10?
    options:
    - id: a
      text: A prediction
    - id: b
      text: The observed target
    - id: c
      text: The guest-count input
    answer: a
    feedback: A prediction is the model’s proposed answer. The observed amount here is 12.
  remediation_scene: models-and-products.s3
- id: models-and-products.transfer
  objective_ref: objective.models-and-products
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Trace the example in your own words: what goes in, what happens, and what comes out?'
  variants:
  - id: models-and-products.transfer.1
    prompt: An assistant quotes an old policy from its search index. What might fix the answer?
    options:
    - id: b
      text: Change the appearance of the input box.
    - id: correct
      text: Update or correct the retrieved source.
    - id: a
      text: Only a larger model can fix any error.
    answer: correct
    feedback: Update or correct the retrieved source.
    retired: true
  - id: models-and-products.transfer.2
    prompt: You correct a chatbot in the current conversation. What can you safely conclude?
    options:
    - id: correct
      text: The correction can influence later answers through context.
    - id: a
      text: Its underlying weights were certainly retrained.
    - id: b
      text: Every other user will now get the correction.
    answer: correct
    feedback: The correction can influence later answers through context.
    retired: true
  - id: models-and-products.transfer.v2.1
    prompt: The estimate is six, but the app prints sixteen. Where should investigation begin?
    options:
    - id: a
      text: The step that displays the estimate
    - id: b
      text: The original two-crackers rule
    - id: c
      text: The examples used to count guests
    answer: a
    feedback: The intermediate estimate is correct; the observed mismatch happens later.
  - id: models-and-products.transfer.v2.2
    prompt: A museum answer uses an outdated schedule. Which change directly addresses that problem?
    options:
    - id: b
      text: Keep the schedule and make the wording more confident
    - id: c
      text: Keep the schedule and ask for a shorter answer
    - id: a
      text: Replace the outdated schedule
    answer: a
    feedback: The external information can be wrong independently of the model.
  - id: models-and-products.transfer.v2.3
    prompt: A person writes a snack rule before collecting examples. How was this model chosen?
    options:
    - id: c
      text: It was learned by reading app clicks
    - id: a
      text: It was specified directly by a person
    - id: b
      text: It was fitted to the collected examples
    answer: a
    feedback: A model can be specified directly; learning from examples is one way of choosing it.
  - id: models-and-products.transfer.v2.4
    prompt: What does retrieval do in the museum example?
    options:
    - id: a
      text: Finds relevant schedule information
    - id: b
      text: Writes a new schedule from the question alone
    - id: c
      text: Checks that each proposed opening time is correct
    answer: a
    feedback: Retrieval finds schedule information. It does not create a replacement schedule or guarantee
      that a proposed answer matches the evidence.
  - id: models-and-products.transfer.v2.5
    prompt: A model calculates 14 minutes correctly, but the app displays 41. Where should you investigate
      first?
    options:
    - id: a
      text: The step that transfers or displays the result
    - id: b
      text: The already checked prediction calculation
    - id: c
      text: The collection of training examples alone
    answer: a
    feedback: Separate the model from the larger product. A correct model result can be changed or shown incorrectly
      afterward.
  - id: models-and-products.transfer.v2.6
    prompt: Two apps use the same prediction rule, but one also checks permissions before acting. What follows?
    options:
    - id: a
      text: Their interfaces must produce the same allowed actions
    - id: b
      text: Their complete behavior can differ despite sharing a model
    - id: c
      text: The permission check is another name for the model’s prediction
    answer: b
    feedback: An application contains other steps around its model. Those steps can change what the product
      does.
  remediation_scene: models-and-products.s3
