schema_version: 0.2-draft
lesson:
  id: models-and-products
  version: 0.4.0-draft
  title: What is a model? A small rule inside a bigger app
  state: draft
  summary: When a chat assistant answers you, the model is only one of the pieces at work. Meet models through a snack-planning rule, then find the other pieces around it.
  slot: M00.4
  category: common
  sources:
    - title: Dive into Deep Learning — linear regression
      url: https://d2l.ai/chapter_linear-regression/linear-regression.html
  archetype: foundation
objectives:
  - id: objective.models-and-products
    version: 3-draft
    statement: 'Tell a model''s computation apart from the rest of a product: its interface, lookups, and other steps.'
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - models-and-products.base
      - models-and-products.transfer.v3
    prerequisites:
      - anyOf:
          - objective.data-and-examples
scenes:
  - id: models-and-products.s1
    title: A small rule for a messy job
    type: explanation
    depth: intuition
    objective_refs:
      - objective.models-and-products
    markdown: |-
      You're hosting a party and need to buy crackers. You don't know exactly how hungry everyone will be, so you use a rule of thumb: *two crackers for each guest*. Three guests? Six crackers.

      That rule is a **model**: a simplified way to turn information into a useful result. It leaves out a lot, like appetite, age, and whether there's also cake. That's fine. A model doesn't have to capture everything; it has to be good enough for the job. The statistician George Box put it memorably: "All models are wrong, but some are useful."

      The models inside AI helpers are far bigger than this one, but they play the same role: information goes in, and the model turns it into an answer.
  - id: models-and-products.s2
    title: A prediction is the model's answer
    type: explanation
    depth: intuition
    objective_refs:
      - objective.models-and-products
    markdown: |-
      The answer a model gives is called a **prediction**. In the snack model, the number of guests is the input and the number of crackers is the prediction.

      | Guests (input) | Rule | Crackers (prediction) |
      | --- | --- | --- |
      | 3 | 2 per guest | 6 |
      | 4 | 2 per guest | 8 |

      :::predict Five guests are coming. What does the model predict?
      Ten crackers: five guests, two each. The rule stayed exactly the same; only the input changed.
      :::

      In AI, "prediction" doesn't have to mean guessing the future. When a photo app says "this picture shows a dog," that's a prediction too: the model's best answer for this input.
  - id: models-and-products.s3
    title: Written by a person, or learned from examples
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.models-and-products
    markdown: |-
      Where did "two per guest" come from? Maybe you just decided it. That's a model written by a person.

      But suppose you kept notes from past parties: how many guests came and how many crackers were actually eaten. You could adjust the rule until it matches those notes. That's the learning-from-examples idea from the first lesson, and those notes are exactly the kind of labeled data you collected in the last one.

      Either way, the result is a model you can use. Learned models in real AI helpers contain many adjustable numbers instead of one. The next lesson gives those numbers a name and lets you turn one yourself.
  - id: models-and-products.s4
    title: The model is one part of a bigger app
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.models-and-products
    markdown: |-
      Now imagine a snack-planning app (short for application, software made for people to use). You type the guest count into a box, press a button, and see a shopping list.

      Only one step in that trip is the model. The box and button are the **interface**: the part you see and touch. The whole arrangement of parts working together is the **system**.

      | Part | Its job in the snack app |
      | --- | --- |
      | Interface | Reads "3" from the box you typed in |
      | Model | Turns 3 guests into 6 crackers |
      | Display | Adds "6 crackers" to the shopping list |

      :::mixup "The chatbot is the model."
      A chat assistant is a whole product. The language model inside it writes the words, but other parts run the chat window, keep track of the conversation, and, in many assistants, search the web or check what the model writes. When something goes wrong, any of those parts might be the cause.
      :::
  - id: models-and-products.s5
    title: Follow a question through a bigger system
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.models-and-products
    markdown: |-
      A museum's website has a chat helper. You ask, "When do you open on Sunday?" Here's what happens behind the scenes:

      1. A lookup step finds the museum's written schedule. Finding useful information like this is called **retrieval**.
      2. The schedule and your question go to a text-writing model.
      3. The model writes a reply, and the page shows it to you.

      That means two quite different mistakes are possible. If the schedule it found is last year's, the model can write a perfect sentence with the wrong time. If the schedule is right but the model misreads it, the fault is in the writing step. Later lessons follow this kind of system in much more detail.
    diagram:
      caption: A museum helper. Retrieval finds the schedule; the model writes the reply.
      description: Your question goes to a retrieval step, which looks up the museum schedule. The retrieved schedule and your question both go to the text-writing model. The model writes a reply that is shown on the page.
      nodes:
        - id: question
          label: Your question
          col: 0
          row: 0
        - id: retrieval
          label: Retrieval
          note: finds the schedule
          col: 1
          row: 0
          tone: data
        - id: model
          label: Text-writing model
          note: writes the reply
          col: 2
          row: 0
          tone: accent
        - id: reply
          label: Reply on the page
          col: 3
          row: 0
      edges:
        - from: question
          to: retrieval
        - from: retrieval
          to: model
          label: question + schedule
        - from: model
          to: reply
  - id: models-and-products.s6
    title: Use the parts to find a mistake
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.models-and-products
    markdown: |-
      Your snack app tells you 3 guests need 6 crackers, but the printed shopping list says 16.

      :::predict Which part would you check first: the model, or the step that prints the list?
      The printing step. The model's answer, 6, was right. The mistake happened after it. Changing the model wouldn't fix a printing bug.
      :::

      It works the other way too. The list could print "6 crackers" perfectly, and the model could still be poor if your guests usually eat four crackers each. Then the model is what needs fixing.

      So when a helper gets something wrong, ask: which part did this? Reading the input, finding information, the model's calculation, or showing the result? Naming the part tells you what to fix.
  - id: models-and-products.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.models-and-products
    markdown: Weather apps, library chat helpers, calorie counters, and ride fares ask you to find which part of a product caused a mistake.
    takeaway: |-
      A model is a simplified rule that turns an input into a prediction. An app wraps it with other parts, like the interface, retrieval, and display, and any of them can cause a mistake.
  - id: models-and-products.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.models-and-products
    markdown: |-
      A model supplies a computation; a product connects it to information, controls, and other steps. Investigate the part that produced the error.
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - models-and-products.s1
        - models-and-products.s2
        - models-and-products.s3
        - models-and-products.s4
        - models-and-products.s5
        - models-and-products.s6
        - models-and-products.check
      gate_refs:
        - gate.core
  scene_aliases:
    models-and-products.recap: models-and-products.check
assessment_families:
  - id: models-and-products.base
    objective_ref: objective.models-and-products
    task: base
    response_type: single_choice
    points: 1
    hint: "The model is the rule that turns the input into a prediction. The guest count is what goes in, and the box, button, and screen belong to the app around it."
    variants:
      - id: models-and-products.base.1
        prompt: Which is usually part of the surrounding application?
        options:
          - id: a
            text: A learned weight inside the model.
          - id: b
            text: A matrix multiplication inside a neural layer.
          - id: correct
            text: Retrieving a company document before asking the model.
        answer: correct
        feedback: Retrieving a company document before asking the model.
        retired: true
      - id: models-and-products.base.2
        prompt: What is a model parameter?
        options:
          - id: b
            text: The color of the chat window.
          - id: correct
            text: A learned number used by the model’s computation.
          - id: a
            text: Any message in the current conversation.
        answer: correct
        feedback: A learned number used by the model’s computation.
        retired: true
      - id: models-and-products.base.v2.1
        prompt: Which item is the model in the snack example?
        options:
          - id: c
            text: The button used to request the snack estimate
          - id: a
            text: The rule of two crackers per guest
          - id: b
            text: The guest count supplied for today’s calculation
        answer: a
        feedback: The two-crackers rule turns a guest count into an estimate. The count is the input, while the button belongs to the interface.
      - id: models-and-products.base.v2.2
        prompt: Five guests become ten crackers under the same rule. What changed from the three-guest example?
        options:
          - id: a
            text: The input supplied to the rule
          - id: b
            text: The number of crackers per guest
          - id: c
            text: The instruction that says to multiply the numbers
        answer: a
        feedback: "Only the guest count changed, from 3 to 5, so the input changed. The rule stayed at two crackers per guest, which is exactly why 5 guests give 10."
      - id: models-and-products.base.v2.3
        prompt: A model names a dog in a photograph. Why can this be called prediction?
        options:
          - id: b
            text: It must be describing what the animal will do next
          - id: c
            text: It must have observed the correct label beforehand
          - id: a
            text: It proposes an answer from supplied information
        answer: a
        feedback: "In AI, a prediction is the model's best answer for an input, whether or not it's about the future. Naming the dog in a photo is a prediction about what the picture shows right now."
      - id: models-and-products.base.v2.4
        prompt: Which description fits an interface?
        options:
          - id: c
            text: The proposed answer before display
          - id: a
            text: The controls a person interacts with
          - id: b
            text: The examples used to adjust a rule
        answer: a
        feedback: "The interface is the part a person sees and touches, like text boxes and buttons. Examples are used to adjust a model, and a proposed answer is the model's prediction."
      - id: models-and-products.base.v2.5
        prompt: An app estimates taxi cost using “distance times price per mile.” Which part is the model?
        options:
          - id: a
            text: The screen displaying the estimated cost
          - id: b
            text: The payment button below the estimated cost
          - id: c
            text: The rule producing the estimated cost
        answer: c
        feedback: The model is the rule making the prediction. Displaying and collecting payment are other product jobs.
      - id: models-and-products.base.v2.6
        prompt: A snack model proposes 10 crackers, but guests eat 12. What is the proposed 10?
        options:
          - id: a
            text: A prediction
          - id: b
            text: The observed target
          - id: c
            text: The guest-count input
        answer: a
        feedback: A prediction is the model’s proposed answer. The observed amount here is 12.
    remediation_scene: models-and-products.s3
  - id: models-and-products.transfer
    objective_ref: objective.models-and-products
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Trace the example in your own words: what goes in, what happens, and what comes out?'
    variants:
      - id: models-and-products.transfer.1
        prompt: An assistant quotes an old policy from its search index. What might fix the answer?
        options:
          - id: b
            text: Change the appearance of the input box.
          - id: correct
            text: Update or correct the retrieved source.
          - id: a
            text: Only a larger model can fix any error.
        answer: correct
        feedback: Update or correct the retrieved source.
        retired: true
      - id: models-and-products.transfer.2
        prompt: You correct a chatbot in the current conversation. What can you safely conclude?
        options:
          - id: correct
            text: The correction can influence later answers through context.
          - id: a
            text: Its underlying weights were certainly retrained.
          - id: b
            text: Every other user will now get the correction.
        answer: correct
        feedback: The correction can influence later answers through context.
        retired: true
      - id: models-and-products.transfer.v2.1
        prompt: The estimate is six, but the app prints sixteen. Where should investigation begin?
        options:
          - id: a
            text: The step that displays the estimate
          - id: b
            text: The original two-crackers rule
          - id: c
            text: The examples used to count guests
        answer: a
        feedback: The intermediate estimate is correct; the observed mismatch happens later.
        retired: true
      - id: models-and-products.transfer.v2.2
        prompt: A museum answer uses an outdated schedule. Which change directly addresses that problem?
        options:
          - id: b
            text: Keep the schedule and make the wording more confident
          - id: c
            text: Keep the schedule and ask for a shorter answer
          - id: a
            text: Replace the outdated schedule
        answer: a
        feedback: The external information can be wrong independently of the model.
        retired: true
      - id: models-and-products.transfer.v2.3
        prompt: A person writes a snack rule before collecting examples. How was this model chosen?
        options:
          - id: c
            text: It was learned by reading app clicks
          - id: a
            text: It was specified directly by a person
          - id: b
            text: It was fitted to the collected examples
        answer: a
        feedback: A model can be specified directly; learning from examples is one way of choosing it.
        retired: true
      - id: models-and-products.transfer.v2.4
        prompt: What does retrieval do in the museum example?
        options:
          - id: a
            text: Finds relevant schedule information
          - id: b
            text: Writes a new schedule from the question alone
          - id: c
            text: Checks that each proposed opening time is correct
        answer: a
        feedback: Retrieval finds schedule information. It does not create a replacement schedule or guarantee that a proposed answer matches the evidence.
        retired: true
      - id: models-and-products.transfer.v2.5
        prompt: A model calculates 14 minutes correctly, but the app displays 41. Where should you investigate first?
        options:
          - id: a
            text: The step that transfers or displays the result
          - id: b
            text: The already checked prediction calculation
          - id: c
            text: The collection of training examples alone
        answer: a
        feedback: Separate the model from the larger product. A correct model result can be changed or shown incorrectly afterward.
        retired: true
      - id: models-and-products.transfer.v2.6
        prompt: Two apps use the same prediction rule, but one also checks permissions before acting. What follows?
        options:
          - id: a
            text: Their interfaces must produce the same allowed actions
          - id: b
            text: Their complete behavior can differ despite sharing a model
          - id: c
            text: The permission check is another name for the model’s prediction
        answer: b
        feedback: An application contains other steps around its model. Those steps can change what the product does.
        retired: true
    remediation_scene: models-and-products.s3
  - id: models-and-products.transfer.v3
    objective_ref: objective.models-and-products
    task: transfer
    response_type: single_choice
    points: 1
    hint: List the parts in order (reading the input, finding information, the model's calculation, showing the result), then find the first part whose output was wrong.
    remediation_scene: models-and-products.s6
    variants:
      - id: models-and-products.transfer.v3.1
        prompt: A weather app's model predicts 68 °F for tomorrow, but the screen shows 86 °F. Where should you look first?
        options:
          - id: a
            text: The model that made the forecast
          - id: b
            text: The step that shows the result
          - id: c
            text: The weather records it learned from
        answer: b
        feedback: The model's answer, 18, was sensible; the digits got swapped afterward. Fixing the model or its data wouldn't touch a display bug.
      - id: models-and-products.transfer.v3.2
        prompt: A library's chat helper says the library closes at 6 pm. The page its lookup step found lists last year's hours. Which fix targets this problem?
        options:
          - id: a
            text: Swap in a larger model that writes better sentences
          - id: b
            text: Make the chat window bigger and easier to read
          - id: c
            text: Update the page that the lookup step retrieves
        answer: c
        feedback: The model faithfully used the information it was given; the retrieved page was out of date. A better writer would state the old hours just as confidently.
      - id: models-and-products.transfer.v3.3
        prompt: You type "two apples" into a calorie app, and it records 20 apples. Its calorie math is correct for 20 apples. Which part failed?
        options:
          - id: c
            text: The model's calorie calculation
          - id: a
            text: The interface reading what you typed
          - id: b
            text: The food list the model learned from
        answer: a
        feedback: The model did the right math on the number it received. The error entered earlier, when "two" was turned into 20, which is the interface's job.
      - id: models-and-products.transfer.v3.4
        prompt: Two ride apps use the same price rule, but one adds a busy-time charge before showing the fare. Why do their fares differ at rush hour?
        options:
          - id: c
            text: A step outside the model changed the result
          - id: b
            text: The two apps must be using different models
          - id: a
            text: One model has learned from many more trips
        answer: c
        feedback: The rule is the same, so the difference comes from another step in one product. Two apps can share a model and still behave differently.
      - id: models-and-products.transfer.v3.5
        prompt: A homework helper finds exactly the right textbook page, but its reply gets the page's key date wrong. Which part is most likely at fault?
        options:
          - id: b
            text: The lookup step that found the textbook page
          - id: a
            text: The model that wrote the reply from the page
          - id: c
            text: The textbook page, which must contain an error
        answer: a
        feedback: Retrieval did its job, since the page was the right one. The mistake appeared when the model turned the page into a reply.
      - id: models-and-products.transfer.v3.6
        prompt: A snack app uses "2 crackers per guest," but at your parties guests eat about 4 each. The input box and the screen work perfectly. What should change?
        options:
          - id: a
            text: The screen that displays the result
          - id: c
            text: The box where you type the guests
          - id: b
            text: The rule inside the model itself
        answer: b
        feedback: Every other part works; the rule itself gives answers that don't match what really happens. That's a model problem, so fix the rule, perhaps by learning it from your party notes.
