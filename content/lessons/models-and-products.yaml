schema_version: 0.2-draft
lesson:
  id: models-and-products
  version: 0.3.0-draft
  title: What is a model? A small rule inside a bigger app
  state: draft
  summary: Use a paper rule to understand a model before looking behind a chat window.
  slot: M00.4
  category: common
  sources:
  - title: Dive into Deep Learning — linear regression
    url: https://d2l.ai/chapter_linear-regression/linear-regression.html
  archetype: foundation
objectives:
- id: objective.models-and-products
  version: 2-draft
  statement: Distinguish a model’s specified or learned computation from the interface, information lookup,
    and other steps of a product.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - models-and-products.base
  - models-and-products.transfer
  prerequisites:
  - anyOf:
    - objective.data-and-examples
scenes:
- id: models-and-products.s1
  title: A small rule can stand in for a messy world
  type: explanation
  depth: intuition
  objective_refs:
  - objective.models-and-products
  markdown: 'Imagine planning snacks. You use a rule: pack two crackers for each guest. For three guests, that
    gives six crackers. This rule is a **model**: a simplified way to turn information into a result. It leaves
    out appetite, age, and other details. A model is useful when its simplification helps with a task. This
    simple rule gives us a starting point for understanding the more complicated models used in AI.'
  text_mode: 'Imagine planning snacks. You use a rule: pack two crackers for each guest. For three guests,
    that gives six crackers. This rule is a **model**: a simplified way to turn information into a result.
    It leaves out appetite, age, and other details. A model is useful when its simplification helps with a
    task. This simple rule gives us a starting point for understanding the more complicated models used in
    AI.'
- id: models-and-products.s2
  title: A prediction is the model’s proposed answer
  type: explanation
  depth: intuition
  objective_refs:
  - objective.models-and-products
  markdown: 'A **prediction** is an answer a model proposes from the information supplied. Predicting does
    not have to mean guessing the future: naming an animal in a picture is also called prediction in machine
    learning. In the snack example, guests are the input and estimated crackers are the output. Three guests
    give six crackers. If you change the guests to five, the same rule gives ten. The rule stayed the same
    while the input changed.'
  text_mode: 'A **prediction** is an answer a model proposes from the information supplied. Predicting does
    not have to mean guessing the future: naming an animal in a picture is also called prediction in machine
    learning. In the snack example, guests are the input and estimated crackers are the output. Three guests
    give six crackers. If you change the guests to five, the same rule gives ten. The rule stayed the same
    while the input changed.'
- id: models-and-products.s3
  title: Models can be written or learned
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.models-and-products
  markdown: 'A person can choose the snack rule directly. A different model could be adjusted using notes of
    how many crackers previous groups actually ate. That is the learning-from-examples idea from our first
    lesson. Modern learned models can contain many adjustable numbers; we will give those numbers names in
    the next lesson. For now, keep the essential distinction: a model is the thing used to produce an answer,
    and learning is one way to choose or improve it.'
  text_mode: 'A person can choose the snack rule directly. A different model could be adjusted using notes
    of how many crackers previous groups actually ate. That is the learning-from-examples idea from our first
    lesson. Modern learned models can contain many adjustable numbers; we will give those numbers names in
    the next lesson. For now, keep the essential distinction: a model is the thing used to produce an answer,
    and learning is one way to choose or improve it.'
- id: models-and-products.s4
  title: The app has more jobs than predicting
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.models-and-products
  markdown: An **app**, short for application, is software made for people to use. An **interface** is the
    part you interact with, such as a text box or button. A snack-planning app might ask for guest count, use
    our model, and show a shopping list. A **system** is the whole arrangement of parts working together. If
    the text box reads “three” incorrectly, the answer can be wrong even when the two-crackers rule was applied
    correctly.
  text_mode: An **app**, short for application, is software made for people to use. An **interface** is the
    part you interact with, such as a text box or button. A snack-planning app might ask for guest count, use
    our model, and show a shopping list. A **system** is the whole arrangement of parts working together. If
    the text box reads “three” incorrectly, the answer can be wrong even when the two-crackers rule was applied
    correctly.
- id: models-and-products.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.models-and-products
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: A model is a simplified way to turn information into a result. The app around it collects inputs,
    shows outputs, and may do other jobs.
- id: models-and-products.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.models-and-products
  markdown: A model supplies a computation; a product connects it to information, controls, and other steps.
    Investigate the part that produced the error.
  text_mode: A model supplies a computation; a product connects it to information, controls, and other steps.
    Investigate the part that produced the error.
- id: models-and-products.s5
  title: Follow a question through a larger system
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.models-and-products
  markdown: Suppose a museum app answers “When do you open?” It can first find the museum’s written schedule,
    then give that schedule and your question to a text-producing model, then display the answer. Finding relevant
    information is called **retrieval**. The retrieved schedule is information supplied to the model, not a
    guarantee that the model will use it correctly. A wrong schedule and a wrongly written answer are different
    possible failures. Later lessons follow this process in more detail.
  text_mode: Suppose a museum app answers “When do you open?” It can first find the museum’s written schedule,
    then give that schedule and your question to a text-producing model, then display the answer. Finding relevant
    information is called **retrieval**. The retrieved schedule is information supplied to the model, not a
    guarantee that the model will use it correctly. A wrong schedule and a wrongly written answer are different
    possible failures. Later lessons follow this process in more detail.
- id: models-and-products.s6
  title: Use the separation to find a mistake
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.models-and-products
  markdown: 'A snack app says six crackers for three guests, but the shopping list prints sixteen. First check
    the step that turns the result into the shopping list. Rebuilding the model may not fix a display mistake.
    Conversely, a perfectly displayed estimate can be a poor snack rule if guests usually eat four crackers
    each. Name the part responsible for each job: collect information, estimate, display, or act. This habit
    will help when the parts become much larger.'
  text_mode: 'A snack app says six crackers for three guests, but the shopping list prints sixteen. First check
    the step that turns the result into the shopping list. Rebuilding the model may not fix a display mistake.
    Conversely, a perfectly displayed estimate can be a poor snack rule if guests usually eat four crackers
    each. Name the part responsible for each job: collect information, estimate, display, or act. This habit
    will help when the parts become much larger.'
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - models-and-products.s1
