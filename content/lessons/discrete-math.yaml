assessment_families:
  - id: discrete-math.base
    objective_ref: objective.discrete-math
    task: base
    response_type: single_choice
    points: 1
    hint: Multiply the number of options at each step.
    remediation_scene: discrete-math.s2
    variants:
      - id: discrete-math.base.1
        retired: true
        prompt: How many length-four binary strings allow either symbol at every position?
        options:
          - id: a
            text: '16'
          - id: b
            text: '8'
          - id: c
            text: '4'
        answer: a
        feedback: Four independent two-way choices give 2⁴ = 16.
      - id: discrete-math.base.2
        retired: true
        prompt: What is {a, b} intersected with {b, c}?
        options:
          - id: b
            text: '{a, b, c}'
          - id: c
            text: '{a, c}'
          - id: a
            text: '{b}'
        answer: a
        feedback: Intersection retains elements present in both sets.
  - id: discrete-math.transfer
    objective_ref: objective.discrete-math
    task: transfer
    response_type: single_choice
    points: 1
    hint: Follow only the arrows that are stated, and remember that one failing case refutes an "always" claim.
    remediation_scene: discrete-math.s4
    variants:
      - id: discrete-math.transfer.1
        retired: true
        prompt: A graph has only A → B and B → C. Is C → A implied?
        options:
          - id: b
            text: Yes, every path is reversible
          - id: c
            text: Yes, because three vertices make a triangle
          - id: a
            text: No; edge direction and existence must be stated
        answer: a
        feedback: Reachability in one direction does not establish a reverse edge.
      - id: discrete-math.transfer.2
        retired: true
        prompt: A search method succeeds on 20 examples. Has that proved success on every possible graph?
        options:
          - id: c
            text: Yes, if the software is fast
          - id: a
            text: No; a universal guarantee needs an argument with assumptions
          - id: b
            text: Yes, if the examples are random
        answer: a
        feedback: Finite experiments do not by themselves prove a universal claim.
  - id: discrete-math.base.v2
    objective_ref: objective.discrete-math
    task: base
    response_type: numeric
    points: 1
    hint: Multiply the number of options at each step. If swapping the order gives the same selection, divide by the number of orderings.
    remediation_scene: discrete-math.s2
    absolute_tolerance: 1e-6
    variants:
      - id: discrete-math.base.v2.1
        prompt: A bike lock has 3 dials, each showing a digit from 0 to 9. How many combinations are possible?
        answer: 1000
        feedback: Each dial has 10 options, so 10 × 10 × 10 = 1000. Adding them, 10 + 10 + 10 = 30, counts the digits rather than the combinations.
      - id: discrete-math.base.v2.2
        prompt: A DJ picks an opening song and a different closing song from 6 songs. How many different (opener, closer) plans are there?
        answer: 30
        feedback: 6 choices for the opener, then 5 for the closer, so 6 × 5 = 30. Order matters here, so don't divide by 2; 6 × 6 = 36 wrongly lets one song play both slots.
      - id: discrete-math.base.v2.3
        prompt: You need a 2-person team from 6 volunteers. How many different teams are possible?
        answer: 15
        feedback: The ordered count is 6 × 5 = 30, and each team appears twice in it, so 30 ÷ 2 = 15. Stopping at 30 counts Ana-Ben and Ben-Ana as different teams.
      - id: discrete-math.base.v2.4
        prompt: A spam filter records 5 yes/no features about each email. How many different combinations of feature values can an email have?
        answer: 32
        feedback: Each feature has 2 options, so 2⁵ = 32. Multiplying 2 × 5 = 10 treats the power as a product.
      - id: discrete-math.base.v2.5
        prompt: A game gives each player 4 possible moves every turn. A program looks 3 turns ahead. How many move sequences must it consider?
        answer: 64
        feedback: Branching factor 4, depth 3, so 4³ = 4 × 4 × 4 = 64. Multiplying 4 × 3 = 12 counts moves, not sequences.
      - id: discrete-math.base.v2.6
        prompt: A sandwich shop offers 3 breads, 4 fillings, and 2 sauces, and you choose one of each. How many different sandwiches are there?
        answer: 24
        feedback: 3 × 4 × 2 = 24. Adding the options, 3 + 4 + 2 = 9, gives the number of menu items, not combinations.
  - id: discrete-math.transfer.v2
    objective_ref: objective.discrete-math
    task: transfer
    response_type: single_choice
    points: 1
    hint: Follow only the arrows that are stated, keep "in both" separate from "in either," and remember that one failing case refutes an "always" claim.
    remediation_scene: discrete-math.s3
    variants:
      - id: discrete-math.transfer.v2.1
        prompt: A town's one-way streets run Market → Park, Park → River, and River → Station. A courier is at Station. Which statement is correct?
        options:
          - id: b
            text: Station can reach Market, since River links it to Park
          - id: a
            text: Station has no outgoing street, so it can't reach Market
          - id: c
            text: Station reaches Market in 3 steps by reversing the route
        answer: a
        feedback: Every stated street points toward Station, and none leaves it, so nothing is reachable from there. Reversing the route would mean driving the wrong way down one-way streets.
      - id: discrete-math.transfer.v2.2
        prompt: 'A recommender compares two users. Maya liked {Up, Heat, Alien}; Leo liked {Alien, Up, Jaws}. Which set holds the movies they both liked?'
        options:
          - id: c
            text: '{Up, Heat, Alien, Jaws}'
          - id: b
            text: '{Heat, Jaws}'
          - id: a
            text: '{Up, Alien}'
        answer: a
        feedback: The intersection keeps only movies in both sets, {Up, Alien}. The four-movie set is the union, and {Heat, Jaws} is what they don't share.
      - id: discrete-math.transfer.v2.3
        prompt: A route planner's rule, "always drive to the nearest unvisited city next," found the shortest tour on 20 test maps. On map 21 it produces a tour longer than the best one. What follows?
        options:
          - id: a
            text: The rule doesn't always find the shortest tour
          - id: b
            text: The rule still always works, since 20 of 21 maps passed
          - id: c
            text: The rule works on all maps with fewer than 21 cities
        answer: a
        feedback: One counterexample refutes an "always" claim, whatever the number of successes. Nothing about the failure depends on the map's number, so the size-based rescue doesn't follow.
      - id: discrete-math.transfer.v2.4
        prompt: Which situation should be counted with permutations (order matters) rather than combinations?
        options:
          - id: b
            text: Choosing 3 features out of 10 to feed a model
          - id: c
            text: Choosing 3 toppings out of 10 for a pizza
          - id: a
            text: Showing 3 of 10 documents as a ranked top-3 list
        answer: a
        feedback: In a ranked list, first, second, and third are different slots, so swapping two documents gives a different result. A set of features or toppings is the same set in any order.
      - id: discrete-math.transfer.v2.5
        prompt: A knowledge graph stores the directed edge Paris —capital of→ France. A query asks whether France —capital of→ Paris. What should the graph answer?
        options:
          - id: c
            text: Yes, because the two nodes are joined by an edge
          - id: a
            text: No such edge is stored; the arrow points one way
          - id: b
            text: Yes, because every edge in a graph works both ways
        answer: a
        feedback: A directed edge carries its direction as part of the fact, and "France is the capital of Paris" is a different claim. Being connected by an edge isn't the same as having an edge in each direction.
