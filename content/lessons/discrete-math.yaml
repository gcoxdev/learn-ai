schema_version: 0.2-draft
lesson:
  id: discrete-math
  version: 0.1.0-draft
  title: Sets, graphs, and counting possibilities
  state: draft
  summary: Sets collect distinct objects, graphs represent relationships, and counting rules explain why search
    can grow rapidly.
  slot: B05
  category: bridge
  sources:
  - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
    url: https://aima.cs.berkeley.edu/
objectives:
- id: objective.discrete-math
  version: 1-draft
  statement: Sets collect distinct objects, graphs represent relationships, and counting rules explain why search
    can grow rapidly.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - discrete-math.base
  - discrete-math.transfer
  prerequisites:
  - anyOf:
    - objective.arithmetic
scenes:
- id: discrete-math.s1
  title: Choose the objects and relations
  type: explanation
  depth: intuition
  objective_refs:
  - objective.discrete-math
  markdown: 'A set contains distinct elements: {red, blue} contains two colors. The union combines elements from
    either set; the intersection keeps shared elements. A graph has vertices and edges. Its vertices might be cities,
    states, people, or concepts; the meaning of an edge must be specified.'
  text_mode: 'A set contains distinct elements: {red, blue} contains two colors. The union combines elements from
    either set; the intersection keeps shared elements. A graph has vertices and edges. Its vertices might be cities,
    states, people, or concepts; the meaning of an edge must be specified.'
  bridges: []
- id: discrete-math.s2
  title: Count choices in sequence
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.discrete-math
  markdown: If a code has three positions and each position allows two symbols, independent choices give 2 × 2 ×
    2 = 8 codes. Ten binary positions give 2¹⁰ = 1024. This multiplication assumes repetition is allowed and every
    combination is valid. Constraints can rule out possibilities.
  text_mode: If a code has three positions and each position allows two symbols, independent choices give 2 × 2
    × 2 = 8 codes. Ten binary positions give 2¹⁰ = 1024. This multiplication assumes repetition is allowed and every
    combination is valid. Constraints can rule out possibilities.
  bridges: []
- id: discrete-math.s3
  title: Trace a tiny graph
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.discrete-math
  markdown: Let directed edges be A → B, A → C, and B → D. D is reachable from A through B, but there is no stated
    route from D to A. A path is a sequence of connected edges. A cycle returns to a previously visited vertex;
    algorithms often track visited states to avoid repetition.
  text_mode: Let directed edges be A → B, A → C, and B → D. D is reachable from A through B, but there is no stated
    route from D to A. A path is a sequence of connected edges. A cycle returns to a previously visited vertex;
    algorithms often track visited states to avoid repetition.
  bridges: []
- id: discrete-math.s4
  title: State what a proof establishes
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.discrete-math
  markdown: 'A counterexample disproves a universal claim: one graph where a method fails refutes “it always works.”
    Checking several examples supports understanding but is not a proof for all graphs. In AI, distinguish a theorem
    under assumptions, an empirical result on a dataset, and a conjecture about future behavior.'
  text_mode: 'A counterexample disproves a universal claim: one graph where a method fails refutes “it always works.”
    Checking several examples supports understanding but is not a proof for all graphs. In AI, distinguish a theorem
    under assumptions, an empirical result on a dataset, and a conjecture about future behavior.'
  bridges: []
- id: discrete-math.check
  title: Review and check your understanding
