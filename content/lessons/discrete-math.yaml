lesson:
  id: discrete-math
  version: 0.3.0-draft
  title: Sets, graphs, and counting possibilities
  state: draft
  summary: A 4-digit PIN has 10,000 possibilities. A game ten moves deep can have trillions. Learn the counting, set, and graph ideas behind every search problem in AI.
  slot: B05
  category: bridge
  sources:
    - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
      url: https://aima.cs.berkeley.edu/
objectives:
  - id: objective.discrete-math
    version: 2-draft
    statement: Combine sets with union and intersection, follow directed edges in a graph, count ordered and unordered choices, and use one counterexample to refute a general claim.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - discrete-math.base.v2
      - discrete-math.transfer.v2
    prerequisites:
      - anyOf:
          - objective.arithmetic
scenes:
  - id: discrete-math.s1
    title: Sets collect things without repeats
    type: explanation
    depth: intuition
    objective_refs:
      - objective.discrete-math
    markdown: |-
      Your phone PIN has 4 digits. How many PINs are possible? A chess program looks several moves ahead. How many positions might it face? Questions like these decide whether an AI method can just try everything or has to be clever.

      **Why AI needs this:** a search problem is a network of states, a vocabulary is a list of distinct tokens, and counting tells you when trying every option is hopeless.

      A **set** is a collection of distinct things, called its **elements**. Two restaurant reviews use these words: A = {great, food, slow} and B = {slow, service, great}.

      | Notation | Means | Here |
      | --- | --- | --- |
      | A ∪ B | **union**: in either set | {great, food, slow, service} |
      | A ∩ B | **intersection**: in both sets | {great, slow} |
      | \|A\| | size: how many elements | 3 |

      Writing "great" twice doesn't add a second element. That's why the union has 4 elements, not 6.
    bridges: []
  - id: discrete-math.s2
    title: Count choices by multiplying
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.discrete-math
    markdown: |-
      When you make several choices in a row and any mix of options is allowed, multiply the number of options at each step. Three worked examples, each a little harder:

      1. **Outfits.** 3 shirts and 4 pairs of trousers: 3 × 4 = 12 outfits.
      2. **PINs.** 4 digits, each 0–9: 10 × 10 × 10 × 10 = 10⁴ = 10,000.
      3. **A podium.** Gold and silver from 5 runners: 5 choices for gold, then 4 left for silver, so 5 × 4 = 20.

      The podium is a **permutation**: order matters, because Ana-gold, Ben-silver differs from Ben-gold, Ana-silver.

      :::predict You need a 2-person team from the same 5 people. How many different teams are there?
      10. The ordered count is 20, but each team shows up twice in it (Ana-Ben and Ben-Ana), so 20 ÷ 2 = 10. An unordered selection like this is a **combination**.
      :::

      :::mixup "Choosing 2 of 5 people gives 5 × 4 = 20 teams."
      That counts every team twice, once in each order. Before multiplying, ask: would swapping the order give something different? For a ranking, yes. For a team, a set of toppings, or a set of features, no, so divide out the orderings.
      :::
    bridges: []
  - id: discrete-math.s5
    title: Why search explodes
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.discrete-math
    markdown: |-
      A game where you have b possible moves each turn, looked at d turns ahead, has b × b × … × b = b^d move sequences. The number b is the **branching factor** and d is the **depth**. Small changes to either make a huge difference:

      ```python run
      from math import comb, perm

      print("PIN codes, 4 digits:    ", 10 ** 4)
      print("ordered pairs from 5:   ", perm(5, 2))
      print("2-person teams from 5:  ", comb(5, 2))

      # A search tree: b choices at every step, looking d steps ahead
      for b, d in [(3, 4), (10, 6), (30, 10)]:
          print(f"branching {b}, depth {d}: {b ** d:,} move sequences")

      vocab = 50_000
      print(f"3-token strings from {vocab:,} tokens: {vocab ** 3:,}")
      ```

      Branching 30 and depth 10 already gives about 590 million million sequences. A language model with 50,000 tokens could write 125 million million different 3-token strings. Nobody checks them all. That's why search methods prune branches and use estimates, and why "Why a small choice can create a huge search" is worth a look next. Try changing depth 10 to 11 and see the count multiply by 30.
    bridges: []
  - id: discrete-math.s3
    title: Follow the arrows in a graph
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.discrete-math
    markdown: |-
      A **graph** is a set of **nodes** (also called vertices) joined by **edges**. The nodes can be cities, web pages, or game positions; you decide what an edge means. On a **directed** edge, drawn as an arrow, the direction is part of the meaning.

      A small one-way rail network: Ashford → Brook, Ashford → Carlow, Brook → Dunmore, and Dunmore → Ashford. A **path** is a chain of edges you can follow. Ashford → Brook → Dunmore is a path of two edges.

      :::predict Can you get from Dunmore to Carlow? Can you get from Carlow to Dunmore?
      Dunmore to Carlow: yes, Dunmore → Ashford → Carlow. Carlow to Dunmore: no. No train leaves Carlow, so being reachable one way says nothing about the way back.
      :::

      Ashford → Brook → Dunmore → Ashford returns to its start: a **cycle**. A search program that follows edges blindly would loop around it forever, so search algorithms keep a set of already-visited nodes and skip them. The knowledge-graph lessons store facts as exactly these kinds of labeled arrows.
    diagram:
      caption: A one-way rail network. Every arrow is a train you can take.
      description: Four stations. Ashford has arrows to Brook and to Carlow. Brook has an arrow to Dunmore. Dunmore has an arrow back to Ashford, closing the cycle Ashford, Brook, Dunmore. Carlow has no outgoing arrows.
      nodes:
        - id: ashford
          label: Ashford
          col: 1
          row: 0
          tone: accent
        - id: brook
          label: Brook
          col: 3
          row: 0
        - id: carlow
          label: Carlow
          note: no trains leave here
          col: 0
          row: 2
          tone: muted
        - id: dunmore
          label: Dunmore
          col: 2
          row: 2
      edges:
        - from: ashford
          to: brook
        - from: ashford
          to: carlow
        - from: brook
          to: dunmore
        - from: dunmore
          to: ashford
  - id: discrete-math.s4
    title: One counterexample beats twenty examples
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.discrete-math
    markdown: |-
      Someone claims: "On this rail network, the route with the fewest stops is always the fastest." You check twenty trips and it holds every time. Then you find one trip where a two-stop express beats a one-stop slow train.

      That single trip is a **counterexample**: one case that breaks an "always" claim. One is enough to show the claim is false. The twenty successes tell you it often works; only a **proof**, an argument that covers every possible case, would show it always works.

      AI papers make all three kinds of claims, so it helps to sort them: a theorem (proved from stated starting assumptions), an experimental result (measured on some data), and a conjecture (a guess not yet settled). The logic lessons build proofs step by step.
    bridges: []
  - id: discrete-math.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.discrete-math
    markdown: Count locks, playlists, and game trees, then reason about one-way streets, shared movie likes, and a claim that fails once.
    takeaway: |-
      Sets hold distinct things, graphs connect them with (sometimes one-way) edges, and counting multiplies choices. Divide out orderings when order doesn't matter, and remember that one counterexample sinks an "always."
  - id: discrete-math.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.discrete-math
    markdown: |-
      Sets collect distinct objects, graphs represent relationships, and counting rules explain why search can grow rapidly.
