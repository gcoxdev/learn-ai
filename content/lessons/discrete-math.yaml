assessment_families:
- id: discrete-math.base
  objective_ref: objective.discrete-math
  task: base
  response_type: single_choice
  points: 1
  hint: 'Count choices in sequence: trace the inputs, operation, and result before choosing.'
  remediation_scene: discrete-math.s2
  variants:
  - id: discrete-math.base.1
    prompt: How many length-four binary strings allow either symbol at every position?
    options:
    - id: a
      text: '16'
    - id: b
      text: '8'
    - id: c
      text: '4'
    answer: a
    feedback: Four independent two-way choices give 2⁴ = 16.
  - id: discrete-math.base.2
    prompt: What is {a, b} intersected with {b, c}?
    options:
    - id: b
      text: '{a, b, c}'
    - id: c
      text: '{a, c}'
    - id: a
      text: '{b}'
    answer: a
    feedback: Intersection retains elements present in both sets.
- id: discrete-math.transfer
  objective_ref: objective.discrete-math
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'State what a proof establishes: trace the inputs, operation, and result before choosing.'
  remediation_scene: discrete-math.s4
  variants:
  - id: discrete-math.transfer.1
    prompt: A graph has only A → B and B → C. Is C → A implied?
    options:
    - id: b
      text: Yes, every path is reversible
    - id: c
      text: Yes, because three vertices make a triangle
    - id: a
      text: No; edge direction and existence must be stated
    answer: a
    feedback: Reachability in one direction does not establish a reverse edge.
  - id: discrete-math.transfer.2
    prompt: A search method succeeds on 20 examples. Has that proved success on every possible graph?
    options:
    - id: c
      text: Yes, if the software is fast
    - id: a
      text: No; a universal guarantee needs an argument with assumptions
    - id: b
      text: Yes, if the examples are random
    answer: a
    feedback: Finite experiments do not by themselves prove a universal claim.
