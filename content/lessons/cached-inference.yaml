assessment_families:
- response_type: single_choice
  hint: Prefill handles the available prompt; decoding extends it using prior compatible activations.
  variants:
  - prompt: For a fresh prompt with no reusable cache, where does the first output-token distribution come from?
    options:
    - id: a
      text: An obligatory optimizer update on the user’s message.
    - id: b
      text: A KV cache that already contains every possible answer.
    - id: answer
      text: The model’s prefill computation over the prompt.
    answer: answer
    feedback: Prefill computes the prompt representations and the final prompt position’s next-token scores. No
      training update is required.
    id: cached-inference.base.1
  - prompt: What does a KV cache primarily retain in a standard causal transformer?
    options:
    - id: b
      text: A certified factual database of all earlier answers.
    - id: answer
      text: Previously computed key and value activations for a compatible prefix.
    - id: a
      text: The optimizer’s gradients for future training.
    answer: answer
    feedback: The cache retains forward-computation activations for attention reuse. It is neither an optimizer
      buffer nor an independently verified knowledge source.
    id: cached-inference.base.2
  id: cached-inference.base
  objective_ref: objective.cached-inference
  task: base
  points: 1
  remediation_scene: cached-inference.s1
- response_type: single_choice
  hint: Past cached vectors may depend on the exact prefix and model that produced them.
  variants:
  - prompt: A user edits an early prompt token. Can all later cached vectors from the old prompt be blindly reused?
    options:
    - id: b
      text: Yes; editing text automatically retrains every cached vector.
    - id: answer
      text: No; those vectors may depend on the changed prefix.
    - id: a
      text: Yes; caches depend only on the number of tokens.
    answer: answer
    feedback: Cache reuse requires compatible computation. Prefix content, positions, and model state can affect
      the values being reused.
    id: cached-inference.transfer.1
  - prompt: A serving system adds a correct KV cache and becomes faster. What changed conceptually?
    options:
    - id: answer
      text: It reused compatible past activations instead of recomputing all of them.
    - id: a
      text: It necessarily learned new model weights from the request.
    - id: b
      text: It removed the need to compute each new token.
    answer: answer
    feedback: Caching saves work on the prefix. Each new token still needs computation, and ordinary cached inference
      leaves the learned parameters fixed.
    id: cached-inference.transfer.2
  id: cached-inference.transfer
  objective_ref: objective.cached-inference
  task: transfer
  points: 1
  remediation_scene: cached-inference.s1
