schema_version: 0.2-draft
lesson:
  id: cached-inference
  version: 0.4.0-draft
  title: From a prompt to a stream of tokens
  state: draft
  summary: Why does a chatbot pause, then type fast? Time the two phases of generation, count the bytes of the cache between them, and reuse the work on a shared prompt.
  slot: M27.2
  category: destination
  sources:
    - title: Hugging Face Transformers documentation, caching (how the KV cache works)
      url: https://huggingface.co/docs/transformers/cache_explanation
    - title: "Efficiently Scaling Transformer Inference (Pope et al., 2022): prefill vs decode costs and memory-bound decoding"
      url: https://arxiv.org/abs/2211.05102
    - title: "SGLang: Efficient Execution of Structured Language Model Programs (Zheng et al., 2023): RadixAttention prefix caching"
      url: https://arxiv.org/abs/2312.07104
    - title: The Llama 3 Herd of Models (Llama Team, Meta, 2024)
      url: https://arxiv.org/abs/2407.21783
objectives:
  - id: objective.cached-inference
    version: 2-draft
    statement: Explain prefill and cached decoding, including how request-specific key/value activations differ from learned model weights.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - cached-inference.base.v2
      - cached-inference.transfer.v2
      - cached-inference.decode-speed
      - cached-inference.kv-bytes
    prerequisites:
      - anyOf:
          - objective.transformer-trace
      - anyOf:
          - objective.inside-a-system
scenes:
  - title: A pause, then a steady stream
    markdown: |-
      A customer asks Fern why her fiddle-leaf fig is dropping leaves. With her watering log and some care-guide notes, the prompt is 2,000 tokens. The reply appears after a pause of about a fifth of a second, then streams at one token every 8 milliseconds. Two different kinds of work make those two phases.

      **Prefill** runs the model over the whole prompt at once: all 2,000 positions pass through each layer together, with the causal mask hiding later positions. The last position's logits give the first reply token.

      **Decode** produces every later token, one per step. Each step feeds in only the newest token, but still runs it through all 32 layers, and it can't run ahead, because step 5 needs the token chosen at step 4.

      The **KV cache** connects them: the keys and values of every position in every layer, kept in GPU memory so decode steps can attend to them without recomputing them. As the transformer trace lesson showed, appending a token never changes earlier tokens' keys and values, so saving them loses nothing.
    id: cached-inference.s1
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.cached-inference
    diagram:
      caption: Prefill fills the cache once; every decode step reads all of it and appends one position.
      description: The prompt goes into prefill, which processes all positions in parallel. Prefill writes keys and values for every prompt position into the KV cache and produces the first new token. Each new token is fed back into a decode step. The decode step reads the whole KV cache, appends the new token's keys and values to it, and samples the next token. Every new token is also streamed to the customer.
      nodes:
        - id: prompt
          label: Prompt
          note: 2,000 tokens
          col: 0
          row: 0
          tone: data
        - id: prefill
          label: Prefill
          note: all positions at once
          col: 1
          row: 0
          tone: accent
        - id: token
          label: New token
          col: 2
          row: 0
        - id: stream
          label: Stream to customer
          col: 3
          row: 0
          tone: muted
        - id: cache
          label: KV cache
          note: keys + values, every layer
          col: 1
          row: 1
          tone: data
        - id: decode
          label: Decode step
          note: one token at a time
          col: 2
          row: 1
          tone: accent
      edges:
        - from: prompt
          to: prefill
        - from: prefill
          to: cache
          label: write K, V
        - from: prefill
          to: token
        - from: token
          to: stream
        - from: token
          to: decode
          label: feed back
          bend: 1
        - from: decode
          to: token
          label: next token
          bend: 1
        - from: cache
          to: decode
          label: read
          bend: 1
        - from: decode
          to: cache
          label: append
          bend: 1
  - title: The cache holds activations, not knowledge
    markdown: |-
      Two very different things share the GPU's memory:

      | | Weights | KV cache |
      | --- | --- | --- |
      | What it is | Learned parameters | Keys and values computed from this request's tokens |
      | Made by | Training | Prefill and decode, during the request |
      | Used by | Every request | One request |
      | Size | Fixed: 16 GB | Grows by one position per token |
      | Lifetime | Until the model is replaced | Freed when the request ends |

      Keys and values are **activations**: this conversation's hidden vectors multiplied by the learned $W_K$ and $W_V$ matrices. The cache holds no weights and learns nothing.

      :::mixup "The KV cache is how the model remembers earlier customers."
      Each request's cache holds only that request's tokens and is freed when the request finishes. Memory across conversations comes from text the server puts back into the prompt, as in the agent memory lesson.
      :::
    id: cached-inference.s2
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.cached-inference
  - title: Trace three steps
    markdown: |-
      Shrink the prompt to three tokens. Prefill writes three positions into the cache; each decode step feeds in one new token, attends to every cached position plus itself, and appends one more. The input stays one token wide however long the chat gets. Only the cache grows.
    type: table
    columns:
      - Moment
      - New model input
      - What is reused
    rows:
      - - Prefill
        - All three prompt tokens
        - No prior prefix cache in this example
      - - First decode step
        - First selected output token
        - Prompt keys and values
      - - Second decode step
        - Next selected output token
        - Prompt and earlier generated keys and values
    id: cached-inference.s3
    depth: mechanics
    objective_refs:
      - objective.cached-inference
  - id: cached-inference.decode-speed
    title: Decode speed is a memory-bandwidth sum
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.cached-inference
    markdown: |-
      Why 8 ms per token? Use the roofline from the lesson on compute and bandwidth. At batch 1, a decode step multiplies one token's vector by every weight matrix: about 2 FLOPs per weight, and 2 bytes read per weight. An arithmetic intensity near 1 FLOP per byte is deep in memory-bound territory, so the step takes as long as reading the weights:

      $$t_{\text{token}} \approx \frac{\text{bytes of weights}}{\text{memory bandwidth}} = \frac{16 \text{ GB}}{2 \text{ TB/s}} = 8 \text{ ms}$$

      That's about 125 tokens per second for one customer, however fast the tensor cores are.

      Prefill is the opposite. The 2,000-token prompt needs about $2 \times 8 \text{ billion} \times 2{,}000 = 32$ trillion FLOPs but reads the weights only once. At the A100's peak of 312 trillion FLOPs per second that's 0.10 s, and real kernels reach roughly half of peak, so about 0.2 s. Prefill is compute-bound.

      ```python run
      PARAMS = 8.0e9          # Llama 3 8B
      BYTES_PER_WEIGHT = 2    # bf16
      BANDWIDTH = 2.0e12      # A100 80 GB: about 2 TB/s
      PEAK = 312e12           # A100 bf16 tensor-core peak, FLOP/s
      KV_PER_TOKEN = 2 * 32 * 8 * 128 * 2   # bytes per cached token

      prompt = 2000
      weight_bytes = PARAMS * BYTES_PER_WEIGHT
      prefill = 2 * PARAMS * prompt / PEAK                 # compute-bound
      decode = weight_bytes / BANDWIDTH                    # memory-bound
      decode_kv = (weight_bytes + KV_PER_TOKEN * prompt) / BANDWIDTH

      print(f"prefill at peak:      {prefill * 1e3:5.0f} ms")
      print(f"decode, weights only: {decode * 1e3:5.2f} ms/token = {1 / decode:3.0f} tokens/s")
      print(f"decode, + KV reads:   {decode_kv * 1e3:5.2f} ms/token = {1 / decode_kv:3.0f} tokens/s")
      ```

      Each step also reads the cache: 2,000 positions add 0.13 ms, so 123 tokens per second instead of 125. Set `BANDWIDTH = 3.35e12`, an H100's bandwidth, and watch decode speed up while prefill, which depends only on `PEAK`, stays put.

      :::predict Fernly shrinks the weights to 4 bits each, about 4 GB in total (a later lesson shows how). What is the new ceiling on decode speed?
      4 GB ÷ 2 TB/s = 2 ms per step, so up to about 500 tokens per second, four times faster. Prefill barely changes, because its limit was arithmetic, not bytes.
      :::
  - title: Count the cache, byte by byte
    markdown: |-
      Every cached position stores one key vector and one value vector for each KV head in each layer:

      $$\text{KV bytes per token} = 2 \times \text{layers} \times \text{KV heads} \times \text{head dim} \times \text{bytes per number}$$

      The lab below uses a tiny model: 4 layers, 2 KV heads, 16 numbers per head, 2 bytes each. That's $2 \times 4 \times 2 \times 16 \times 2 = 512$ bytes per position, so 16 positions take 8 KiB. Predict what doubling the length does before you reveal it, then change the KV heads or the precision.

      Fern's model has 32 layers, 8 KV heads of 128 numbers, and 16-bit values: $2 \times 32 \times 8 \times 128 \times 2 = 131{,}072$ bytes, or 128 KiB per token. It has 32 query heads but only 8 KV heads, thanks to grouped-query attention from the lesson on shared keys and values; with 32 KV heads the cache would be four times larger.

      ```python run
      def kv_bytes_per_token(layers, kv_heads, head_dim, bytes_per_number=2):
          return 2 * layers * kv_heads * head_dim * bytes_per_number   # 2 = key + value

      KiB, MiB = 2**10, 2**20
      lab = kv_bytes_per_token(4, 2, 16)
      fern = kv_bytes_per_token(32, 8, 128)       # Llama 3 8B
      print(f"lab model:  {lab} bytes/token; 16 tokens = {16 * lab / KiB:.0f} KiB")
      print(f"Llama 3 8B: {fern / KiB:.0f} KiB/token")
      for tokens in [2000, 4096, 8192]:
          print(f"  {tokens:5,} tokens: {tokens * fern / MiB:5.0f} MiB")
      print(f"if all 32 heads kept keys and values: {kv_bytes_per_token(32, 32, 128) / KiB:.0f} KiB/token")
      ```

      A 4,096-token conversation holds 512 MiB. If about 60 GiB of the card is left after the weights and working buffers, that's room for 120 such conversations at once.
    id: cached-inference.s4
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.cached-inference
    figure:
      kind: kv-cache
      caption: Append tokens and predict cache growth under explicit layer, KV-head, dimension, and precision settings.
      description: A dense cache payload contains both keys and values for each retained token at each layer. The example fixes batch one, four layers, and head dimension 16; changing token count, KV heads, or bytes per value changes the displayed payload.
  - title: Reuse a prefix only when every token matches
    markdown: |-
      Every Fern request begins with the same 606 tokens: the start token and the 605-token system prompt. Their keys and values come out identical every time: same tokens, same positions, same weights. So the server can compute them once, keep them, and start each new request's prefill at position 607. This is **prefix caching**, and serving engines such as vLLM and SGLang do it automatically by matching the exact token IDs at the start of each prompt. On turn 3 of the earlier five-turn chat, only 609 of the 1,215 prompt tokens now need computing, fewer if the server still holds this customer's earlier turns.

      The match must be exact from the very first token. Change one early token and every later position's keys and values change too, because from the second layer on, each position's keys mix in information from the tokens before it.

      :::predict Fern's system prompt begins "Today is {date}. You are helping {customer name}." How much of it can be reused from one customer to the next?
      Almost nothing. The name differs between customers a few tokens in, so every request has a new prefix from that point on. Move the fixed instructions to the top and put the date and name at the end, and nearly all 606 tokens become shareable again.
      :::
    id: cached-inference.s5
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.cached-inference
  - title: Two waits the customer feels
    markdown: |-
      The customer feels the two phases as two waits. **Time to first token (TTFT)** covers queueing, request preparation, and prefill; after that, each token costs one decode step. For Fern's 2,000-token prompt and a 300-token reply at batch 1:

      - TTFT: about 0.2 s of prefill, plus any time in the queue;
      - the other 299 tokens: 299 × 8 ms ≈ 2.4 s;
      - total: about 2.6 s.

      Streaming sends each token as soon as it's chosen, so the customer starts reading after 0.2 s instead of watching a spinner for 2.6 s, for the same total work.

      The two waits have different fixes: a shorter prompt or a prefix-cache hit cuts TTFT, and fewer bytes per decode step cut the time per token.
    id: cached-inference.s6
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.cached-inference
  - id: cached-inference.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.cached-inference
    markdown: Decode speeds and cache sizes to compute, plus a code assistant, a timestamped system prompt, and a faster GPU, test whether you can tell prefill from decode and predict what each costs.
    takeaway: |-
      Prefill processes the whole prompt at once and is limited by arithmetic; decode makes one token per step and is limited by reading the weights and the KV cache. The cache holds this request's keys and values, not the model's knowledge.
  - id: cached-inference.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.cached-inference
    markdown: |-
      Prefill processes the prompt; decoding extends it. A KV cache reuses computed keys and values for a compatible prefix without changing the trained weights.
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - cached-inference.s1
