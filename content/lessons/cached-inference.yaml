assessment_families:
  - response_type: single_choice
    hint: Prefill handles the available prompt; decoding extends it using prior compatible activations.
    variants:
      - prompt: For a fresh prompt with no reusable cache, where does the first output-token distribution come from?
        options:
          - id: a
            text: An obligatory optimizer update on the user’s message.
          - id: b
            text: A KV cache that already contains every possible answer.
          - id: answer
            text: The model’s prefill computation over the prompt.
        answer: answer
        feedback: Prefill computes the prompt representations and the final prompt position’s next-token scores. No training update is required.
        id: cached-inference.base.1
        retired: true
      - prompt: What does a KV cache primarily retain in a standard causal transformer?
        options:
          - id: b
            text: A certified factual database of all earlier answers.
          - id: answer
            text: Previously computed key and value activations for a compatible prefix.
          - id: a
            text: The optimizer’s gradients for future training.
        answer: answer
        feedback: The cache retains forward-computation activations for attention reuse. It is neither an optimizer buffer nor an independently verified knowledge source.
        id: cached-inference.base.2
        retired: true
    id: cached-inference.base
    objective_ref: objective.cached-inference
    task: base
    points: 1
    remediation_scene: cached-inference.s1
  - response_type: single_choice
    hint: Past cached vectors may depend on the exact prefix and model that produced them.
    variants:
      - prompt: A user edits an early prompt token. Can all later cached vectors from the old prompt be blindly reused?
        options:
          - id: b
            text: Yes; editing text automatically retrains every cached vector.
          - id: answer
            text: No; those vectors may depend on the changed prefix.
          - id: a
            text: Yes; caches depend only on the number of tokens.
        answer: answer
        feedback: Cache reuse requires compatible computation. Prefix content, positions, and model state can affect the values being reused.
        id: cached-inference.transfer.1
        retired: true
      - prompt: A serving system adds a correct KV cache and becomes faster. What changed conceptually?
        options:
          - id: answer
            text: It reused compatible past activations instead of recomputing all of them.
          - id: a
            text: It necessarily learned new model weights from the request.
          - id: b
            text: It removed the need to compute each new token.
        answer: answer
        feedback: Caching saves work on the prefix. Each new token still needs computation, and ordinary cached inference leaves the learned parameters fixed.
        id: cached-inference.transfer.2
        retired: true
    id: cached-inference.transfer
    objective_ref: objective.cached-inference
    task: transfer
    points: 1
    remediation_scene: cached-inference.s1
  - id: cached-inference.base.v2
    objective_ref: objective.cached-inference
    task: base
    response_type: single_choice
    points: 1
    hint: Prefill handles the whole prompt in one pass and is limited by arithmetic; each decode step handles one token and is limited by the bytes it reads.
    remediation_scene: cached-inference.s1
    variants:
      - id: cached-inference.base.v2.1
        prompt: Fern's reply to a 2,000-token prompt starts after 0.2 s, then arrives at one token every 8 ms. Which work mostly decides the 0.2 s?
        options:
          - id: b
            text: The first decode step reading the whole KV cache
          - id: a
            text: Prefill running all 2,000 prompt positions through the model
          - id: c
            text: Copying the weights from disk into GPU memory for the request
        answer: a
        feedback: Before the first token, the model must process every prompt position, and that compute-bound pass takes about 0.2 s. A single decode step takes about 8 ms, and the weights are loaded once when the server starts, not per request.
      - id: cached-inference.base.v2.2
        prompt: Why is a decode step at batch 1 limited by memory bandwidth rather than by arithmetic?
        options:
          - id: c
            text: Softmax over the whole vocabulary needs more arithmetic than the matrix multiplies
          - id: a
            text: Each weight is read from memory and then used for just one token's multiply
          - id: b
            text: The KV cache must be recomputed from scratch at the start of every step
        answer: a
        feedback: With one token, each fetched weight does about 2 FLOPs per 2 bytes, so the cores wait on memory. The cache is reused, not recomputed, and the vocabulary softmax is tiny next to reading 16 GB of weights.
      - id: cached-inference.base.v2.3
        prompt: What does the KV cache hold for one chat request?
        options:
          - id: a
            text: Keys and values computed from this request's tokens, for every layer
          - id: b
            text: A compressed copy of the model's weights, kept close for fast decoding
          - id: c
            text: Facts the model picked up from earlier customers' conversations
        answer: a
        feedback: The cache stores activations made by applying the fixed weights to this conversation's tokens. It holds no weights, and it's freed when the request ends, so nothing carries over between customers.
      - id: cached-inference.base.v2.4
        prompt: A server changes token 5 of a 1,000-token prompt whose keys and values are cached. Which cached entries can it still reuse?
        options:
          - id: b
            text: Every position except position 5, which is recomputed
          - id: c
            text: All of them, since a key depends only on its token and position
          - id: a
            text: Only positions 1 to 4, which come before the change
        answer: a
        feedback: From the second layer on, each position's keys and values mix in the tokens before it, so everything from position 5 onward changes. Only the first layer's keys depend on the token and position alone, which is why answer c is tempting.
  - id: cached-inference.transfer.v2
    objective_ref: objective.cached-inference
    task: transfer
    response_type: single_choice
    points: 1
    hint: Decide whether the problem is the wait before the first token (prefill and prefixes) or the time per later token (bytes read per step).
    remediation_scene: cached-inference.s6
    variants:
      - id: cached-inference.transfer.v2.1
        prompt: A code assistant sends the same 30,000-token repository snapshot before each short question. Replies take 4 s to start, then stream quickly. Which change targets this complaint?
        options:
          - id: b
            text: Quantize the weights so that each decode step reads fewer bytes
          - id: c
            text: Send the streamed tokens in larger chunks to cut network overhead
          - id: a
            text: Cache the repository prefix so repeat prompts skip most of the prefill
        answer: a
        feedback: The slow part is the time to first token, which is prefill over 30,000 tokens that repeat on every request. Reusing their cached keys and values removes most of that work. Faster decode steps or chunked streaming affect only what happens after the first token.
      - id: cached-inference.transfer.v2.2
        prompt: A bank's chatbot starts every system prompt with the current time, to the second. Its prefix cache almost never gets a hit. Why?
        options:
          - id: a
            text: Every request's tokens differ within the first few positions
          - id: b
            text: Timestamps become special tokens, which the cache is built to skip
          - id: c
            text: A prefix cache can store only prompts shorter than 100 tokens
        answer: a
        feedback: A prefix is reusable only up to the first differing token, and the timestamp changes every second right at the start. Putting the fixed instructions first and the time at the end restores the hits.
      - id: cached-inference.transfer.v2.3
        prompt: A team moves its 8B chat model from a GPU with 2 TB/s of memory bandwidth to one with the same compute speed but 4 TB/s. What changes for a single user?
        options:
          - id: c
            text: Both phases get about twice as fast, since the whole model runs faster
          - id: a
            text: Decode steps get about twice as fast, while prefill barely changes
          - id: b
            text: Prefill gets about twice as fast, while decode steps barely change
        answer: a
        feedback: Decode is memory-bound, so its step time is roughly weight bytes divided by bandwidth, which halves. Prefill is compute-bound, and compute didn't change.
      - id: cached-inference.transfer.v2.4
        prompt: A document summarizer turns off its KV cache to save memory. Each new token now takes much longer than before. What work is it repeating?
        options:
          - id: b
            text: Reading the model's weights from disk again at every step
          - id: a
            text: Computing keys and values for every earlier position at every step
          - id: c
            text: Tokenizing the whole document again at every step
        answer: a
        feedback: Without the cache, each step must rebuild the keys and values of all earlier positions before the new token can attend to them. The weights stay in GPU memory either way, and tokenizing is a one-time job.
  - id: cached-inference.decode-speed
    objective_ref: objective.cached-inference
    task: base
    response_type: numeric
    points: 1
    hint: At batch 1, each decode step reads every weight once, so time per token ≈ weight bytes ÷ memory bandwidth, and tokens per second is 1 divided by that time.
    remediation_scene: cached-inference.decode-speed
    absolute_tolerance: 1
    variants:
      - id: cached-inference.decode-speed.1
        prompt: A model has 16 GB of weights on a GPU with 2 TB/s of memory bandwidth. Counting only weight reads, about how many tokens per second can one user get from decoding?
        answer: 125
        feedback: 16 GB ÷ 2,000 GB/s = 0.008 s = 8 ms per token, and 1 ÷ 0.008 = 125 tokens per second.
      - id: cached-inference.decode-speed.2
        prompt: A 7B model stored in 16-bit takes 14 GB. On a GPU with 3.5 TB/s of memory bandwidth, counting only weight reads, how many tokens per second can one user get?
        answer: 250
        feedback: 14 GB ÷ 3,500 GB/s = 4 ms per token, so 250 tokens per second.
      - id: cached-inference.decode-speed.3
        prompt: An 8B model is compressed to 4 GB of weights and runs on a 2 TB/s GPU. Counting only weight reads, how many tokens per second can one user get?
        answer: 500
        feedback: 4 GB ÷ 2,000 GB/s = 2 ms per token, so 500 tokens per second, four times the 16-bit speed.
      - id: cached-inference.decode-speed.4
        prompt: A model has 16 GB of weights on a cheaper card with 0.8 TB/s of memory bandwidth. Counting only weight reads, how many tokens per second can one user get?
        answer: 50
        feedback: 16 GB ÷ 800 GB/s = 20 ms per token, so 50 tokens per second.
  - id: cached-inference.kv-bytes
    objective_ref: objective.cached-inference
    task: base
    response_type: numeric
    points: 1
    hint: 'Bytes per token = 2 (key and value) × layers × KV heads × head dim × bytes per number. Then multiply by the number of tokens, and divide by 1,024 for KiB or 1,048,576 for MiB.'
    remediation_scene: cached-inference.s4
    absolute_tolerance: 0.5
    variants:
      - id: cached-inference.kv-bytes.1
        prompt: A model has 32 layers, 8 KV heads, head dimension 128, and 2-byte values. How many KiB does its KV cache need per token?
        answer: 128
        feedback: 2 × 32 × 8 × 128 × 2 = 131,072 bytes, and 131,072 ÷ 1,024 = 128 KiB.
      - id: cached-inference.kv-bytes.2
        prompt: The same model (32 layers, 8 KV heads, head dimension 128, 2 bytes) holds a 2,048-token conversation. How many MiB is its KV cache?
        answer: 256
        feedback: 128 KiB per token × 2,048 tokens = 262,144 KiB, which is 256 MiB.
      - id: cached-inference.kv-bytes.3
        prompt: A tiny model has 4 layers, 4 KV heads, 16 numbers per head, and 2-byte values. How many KiB does a 32-token cache need?
        answer: 32
        feedback: 2 × 4 × 4 × 16 × 2 = 1,024 bytes per token, and 32 tokens × 1 KiB = 32 KiB.
      - id: cached-inference.kv-bytes.4
        prompt: An older 7B model uses full multi-head attention, so all 32 of its heads keep keys and values. It has 32 layers, head dimension 128, and 2-byte values. How many KiB per token is its KV cache?
        answer: 512
        feedback: 2 × 32 × 32 × 128 × 2 = 524,288 bytes = 512 KiB, four times a model with 8 KV heads.
      - id: cached-inference.kv-bytes.5
        prompt: A model with 32 layers, 8 KV heads, and head dimension 128 stores its cache in 8-bit numbers (1 byte each). How many MiB does a 4,096-token conversation need?
        answer: 256
        feedback: 2 × 32 × 8 × 128 × 1 = 65,536 bytes = 64 KiB per token, and 64 KiB × 4,096 = 256 MiB, half the 16-bit size.
