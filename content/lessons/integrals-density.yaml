schema_version: 0.2-draft
lesson:
  id: integrals-density
  version: 0.4.0-draft
  title: Add up a continuous quantity
  state: draft
  summary: A bell curve can be taller than 1, yet no probability ever is. Learn to add up thin slices, and read a density's probabilities from its area rather than its height.
  slot: B15
  category: bridge
  sources:
    - title: Deep Learning — probability and information theory
      url: https://www.deeplearningbook.org/contents/prob.html
    - title: Dive into Deep Learning — integral calculus
      url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/integral-calculus.html
objectives:
  - id: objective.integrals-density
    version: 2-draft
    statement: An integral accumulates contributions over an interval; continuous probabilities are areas under a density, and numerical integration approximates that accumulation.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - integrals-density.base.v2
      - integrals-density.transfer.v2
    prerequisites:
      - anyOf:
          - objective.functions
      - anyOf:
          - objective.probability
scenes:
  - id: integrals-density.s1
    title: Add up thin slices
    type: explanation
    depth: intuition
    objective_refs:
      - objective.integrals-density
    markdown: |-
      A diffusion model builds images out of noise drawn from a bell curve. A VAE describes each image's code as a small bell-shaped cloud. Bell curves are densities, and getting a probability out of a density means finding an area. This detour shows how.

      Start with distance. A cyclist riding at a steady 2 meters per second for 3 seconds covers 2 × 3 = 6 meters: speed times time, the area of a rectangle. Now let the speed grow steadily, v(t) = 2t, from 0 to 4 m/s over 2 seconds. Chop the time into slices, pretend the speed is constant in each slice, and add the rectangles:

      | Slices | Using each slice's starting speed | Using each slice's ending speed |
      | ---: | ---: | ---: |
      | 2 (1 s each) | (0 + 2) × 1 = 2 | (2 + 4) × 1 = 6 |
      | 4 (0.5 s each) | (0 + 1 + 2 + 3) × 0.5 = 3 | (1 + 2 + 3 + 4) × 0.5 = 5 |

      As the slices get thinner, both columns squeeze toward 4 meters, the area of the triangle under the speed line (½ × 2 × 4 = 4). That limit is the **integral** of the speed from 0 to 2, written

      $$\int_0^2 2t \, dt = 4$$

      The ∫ is a stretched S, for "sum," and dt stands for the slice width.
    bridges: []
  - id: integrals-density.s2
    title: A density is not a probability
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.integrals-density
    markdown: |-
      Pick a random number equally likely to land anywhere between 0 and 2. Every stretch of the same width is equally likely, so we draw a flat line at height 0.5. That line is the variable's **probability density**, and probability is area under it:

      - P(0 < X < 1) = width × height = 1 × 0.5 = 0.5.
      - The whole range has area 2 × 0.5 = 1, as a total probability must.
      - A single exact point has width 0, so its probability is 0, even though the height there is 0.5.

      Now squeeze the range to [0, 0.5]. For the area to stay 1, the height must be 2. P(0 < X < 0.1) = 0.1 × 2 = 0.2.

      :::predict A number is equally likely to land anywhere in [0, 0.25]. How tall is its density, and what is P(0 < X < 0.1)?
      The area must be 1 over a width of 0.25, so the height is 1 ÷ 0.25 = 4. P(0 < X < 0.1) = 0.1 × 4 = 0.4.
      :::

      :::mixup "A density of 2 means a 200% chance, so something is broken."
      Density is probability *per unit of width*, like people per square kilometer. A crowd can pack 2 people into each square meter without anyone being two people. Only areas are probabilities, and only they must stay between 0 and 1. Narrow bell curves are tall for exactly this reason.
      :::
    bridges:
      - functions
      - probability
  - id: integrals-density.s3
    title: Area undoes the slope
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.integrals-density
    markdown: |-
      Rectangles work, but there's a shortcut. The cyclist's distance after t seconds is t², because the derivative of t² is 2t, the speed. Add up a rate and you get the total change in the thing it's the rate of: 2² − 0² = 4 meters, exactly what the thinning rectangles approached. This link, that integrating a derivative gives back net change, is the **fundamental theorem of calculus**.

      Bell curves have no such tidy shortcut, so computers go back to thin slices. The program below measures two normal (bell-shaped) densities, a wide one and a narrow one:

      ```python run
      import numpy as np

      def normal_density(x, sigma):
          return np.exp(-x ** 2 / (2 * sigma ** 2)) / (sigma * np.sqrt(2 * np.pi))

      for sigma in [1.0, 0.1]:
          peak = normal_density(0.0, sigma)
          # Area under the curve: add up thin rectangles of width 0.001
          width = 0.001
          xs = np.arange(-10, 10, width) + width / 2
          total = np.sum(normal_density(xs, sigma) * width)
          print(f"sigma = {sigma}: peak height = {peak:.3f}, total area = {total:.4f}")

      # Probability of landing between -1 and 1 for the standard bell curve
      xs = np.arange(-1, 1, 0.001) + 0.0005
      print("P(-1 < X < 1) ≈", round(float(np.sum(normal_density(xs, 1.0) * 0.001)), 4))
      ```

      The narrow curve's peak is 3.989, far above 1, yet its total area is still 1. And about 68% (0.6827) of the standard bell curve lies within one standard deviation of the middle. Try `sigma = 0.01`: the peak passes 39, and the area stays 1.
    bridges:
      - derivatives
  - id: integrals-density.s4
    title: Averages over a density
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.integrals-density
    markdown: |-
      For a list of outcomes, the expected value adds each value times its probability. For a density, the sum becomes an integral: add each value times its density, slice by slice.

      $$E[X] = \int x \, p(x) \, dx$$

      For the number spread evenly on [0, 2], p(x) = 0.5, so E[X] = ∫₀² 0.5x dx. The derivative of x²/4 is x/2, so the integral is 2²/4 − 0 = 1: the middle, as symmetry says.

      Most integrals in generative models have no shortcut at all: the VAE objective averages over every possible code, and diffusion training averages over every possible noise draw. So they are estimated by drawing samples and averaging, the sampling average from the lesson on averages over uncertain outcomes, known as the Monte Carlo method. The lessons on VAEs, diffusion, and normalizing flows all lean on this idea of area, density, and averages.
    bridges: []
  - id: integrals-density.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.integrals-density
    markdown: Random delays, sensor readings, a tall density, and a slice count that keeps changing the answer ask you to read probability as area and trust an approximation only once it settles.
    takeaway: |-
      An integral adds up thin slices. For a continuous variable, probability is area under the density, so a density can exceed 1 while every probability stays between 0 and 1.
  - id: integrals-density.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.integrals-density
    markdown: |-
      An integral adds contributions across an interval. For a continuous probability distribution, probability comes from area under the density, not from its height alone.
