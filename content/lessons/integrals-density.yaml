assessment_families:
- id: integrals-density.base
  objective_ref: objective.integrals-density
  task: base
  response_type: single_choice
  points: 1
  hint: 'A density is not a point probability: trace the inputs, operation, and result before choosing.'
  remediation_scene: integrals-density.s2
  variants:
  - id: integrals-density.base.1
    prompt: 'Uniform density 0.25 on [0, 4]: what is the probability of [1, 3]?'
    options:
    - id: b
      text: '0.25'
    - id: c
      text: '2'
    - id: a
      text: '0.5'
    answer: a
    feedback: Multiply interval width 2 by density 0.25.
  - id: integrals-density.base.2
    prompt: Can a valid continuous density be larger than 1?
    options:
    - id: c
      text: Only when all probabilities are negative
    - id: a
      text: Yes, if its total area remains 1
    - id: b
      text: No, because density is always a point probability
    answer: a
    feedback: A narrow distribution can have a tall density while its area is normalized.
- id: integrals-density.transfer
  objective_ref: objective.integrals-density
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Connect area to expectation: trace the inputs, operation, and result before choosing.'
  remediation_scene: integrals-density.s4
  variants:
  - id: integrals-density.transfer.1
    prompt: A variable is continuous. Does positive density at exactly 2 imply positive probability of the single
      point {2}?
    options:
    - id: c
      text: Yes; it must equal 1
    - id: a
      text: No; point probability and density differ
    - id: b
      text: Yes; they are the same quantity
    answer: a
    feedback: Probabilities are obtained by integrating over regions, not reading a point height.
  - id: integrals-density.transfer.2
    prompt: A coarse rectangle sum and a finer sum disagree. What is a useful next step?
    options:
    - id: a
      text: Check convergence or an error bound
    - id: b
      text: Declare the larger answer exact
    - id: c
      text: Remove units from the result
    answer: a
    feedback: Numerical integration accuracy depends on the approximation and the function.
