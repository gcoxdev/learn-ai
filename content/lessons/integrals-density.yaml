assessment_families:
  - id: integrals-density.base
    objective_ref: objective.integrals-density
    task: base
    response_type: single_choice
    points: 1
    hint: 'A density is not a point probability: trace the inputs, operation, and result before choosing.'
    remediation_scene: integrals-density.s2
    variants:
      - id: integrals-density.base.1
        prompt: 'Uniform density 0.25 on [0, 4]: what is the probability of [1, 3]?'
        options:
          - id: b
            text: '0.25'
          - id: c
            text: '2'
          - id: a
            text: '0.5'
        answer: a
        feedback: Multiply interval width 2 by density 0.25.
        retired: true
      - id: integrals-density.base.2
        prompt: Can a valid continuous density be larger than 1?
        options:
          - id: c
            text: Only when all probabilities are negative
          - id: a
            text: Yes, if its total area remains 1
          - id: b
            text: No, because density is always a point probability
        answer: a
        feedback: A narrow distribution can have a tall density while its area is normalized.
        retired: true
  - id: integrals-density.transfer
    objective_ref: objective.integrals-density
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Connect area to expectation: trace the inputs, operation, and result before choosing.'
    remediation_scene: integrals-density.s4
    variants:
      - id: integrals-density.transfer.1
        prompt: A variable is continuous. Does positive density at exactly 2 imply positive probability of the single point {2}?
        options:
          - id: c
            text: Yes; it must equal 1
          - id: a
            text: No; point probability and density differ
          - id: b
            text: Yes; they are the same quantity
        answer: a
        feedback: Probabilities are obtained by integrating over regions, not reading a point height.
        retired: true
      - id: integrals-density.transfer.2
        prompt: A coarse rectangle sum and a finer sum disagree. What is a useful next step?
        options:
          - id: a
            text: Check convergence or an error bound
          - id: b
            text: Declare the larger answer exact
          - id: c
            text: Remove units from the result
        answer: a
        feedback: Numerical integration accuracy depends on the approximation and the function.
        retired: true
  - id: integrals-density.base.v2
    objective_ref: objective.integrals-density
    task: base
    response_type: numeric
    points: 1
    hint: For a flat density, the height is 1 divided by the full range's width. The probability of a smaller stretch is that stretch's width times the height.
    remediation_scene: integrals-density.s2
    absolute_tolerance: 0.001
    variants:
      - id: integrals-density.base.v2.1
        prompt: A network delay is equally likely to be anywhere between 0 and 5 seconds. What is the probability that it falls between 1 and 2.5 seconds?
        answer: 0.3
        feedback: The height is 1/5 = 0.2, and the stretch is 1.5 seconds wide, so the area is 1.5 × 0.2 = 0.3. Using the height alone, 0.2, ignores the width.
      - id: integrals-density.base.v2.2
        prompt: A noise value is equally likely to be anywhere in [0, 0.5], so its density is 2. What is the probability that it lands between 0.1 and 0.35?
        answer: 0.5
        feedback: The stretch is 0.25 wide, so the area is 0.25 × 2 = 0.5. The height 2 is a density, not a probability, which is why it can exceed 1.
      - id: integrals-density.base.v2.3
        prompt: A sensor reading is equally likely to be anywhere between 10 and 14 degrees. What is the probability that it lands between 11 and 11.5 degrees?
        answer: 0.125
        feedback: The full range is 4 wide, so the height is 1/4 = 0.25. The stretch is 0.5 wide, so the area is 0.5 × 0.25 = 0.125. Dividing 0.5 by 14 treats the range as starting at 0.
      - id: integrals-density.base.v2.4
        prompt: A robot picks a random heading, equally likely to be anywhere from 0 to 360 degrees. What is the probability that the heading lies between 90 and 180 degrees?
        answer: 0.25
        feedback: The height is 1/360 per degree, and the stretch is 90 degrees wide, so the area is 90/360 = 0.25.
  - id: integrals-density.transfer.v2
    objective_ref: objective.integrals-density
    task: transfer
    response_type: single_choice
    points: 1
    hint: Probabilities are areas, so ask what width goes with each height. A density's height alone is a rate per unit width, and a slice sum is trustworthy once finer slices stop changing it.
    remediation_scene: integrals-density.s2
    variants:
      - id: integrals-density.transfer.v2.1
        prompt: A weather model's density for tomorrow's temperature is 3.2 at 20.0 °C. A teammate says the model must be broken, because no probability can exceed 1. What is the best reply?
        options:
          - id: b
            text: The teammate is right, since a height above 1 is a probability above 1
          - id: a
            text: A density is probability per degree; only areas must stay at or below 1
          - id: c
            text: It's fine as long as some other temperatures get a negative density
        answer: a
        feedback: A narrow, confident forecast has a tall density. Probabilities come from areas, such as 3.2 × 0.1 ≈ 0.32 for a slice 0.1 degrees wide, and the total area is still 1. Densities are never negative.
      - id: integrals-density.transfer.v2.2
        prompt: A continuous reading has density 0.8 at exactly 5.000. What is the probability that the reading is exactly 5.000, to infinite precision?
        options:
          - id: c
            text: 0.8, since that is the curve's height at 5.000
          - id: b
            text: It can't be known without the curve's total area
          - id: a
            text: 0, since a single point has no width
        answer: a
        feedback: Probability is area, and a single point has width 0, so its probability is 0. The height 0.8 tells you that readings near 5 are relatively likely, per unit of width.
      - id: integrals-density.transfer.v2.3
        prompt: Rectangle sums for an area give 3.0 with 4 slices, 3.5 with 8 slices, and 3.75 with 16 slices. What should you conclude?
        options:
          - id: a
            text: The sums are still climbing, so use more slices or an exact method
          - id: c
            text: Report 3.75, because the finest sum you computed is the exact area
          - id: b
            text: Report about 3.42, the average of the three sums you computed
        answer: a
        feedback: Each doubling still moves the answer, by 0.5 and then 0.25, so the sum hasn't settled; here it's heading toward 4. Averaging mixes in the coarsest, least accurate sums.
      - id: integrals-density.transfer.v2.4
        prompt: A delay X is equally likely to be anywhere in [2, 6], so its density is 0.25. Which calculation gives its expected value?
        options:
          - id: b
            text: Multiply the density 0.25 by the width 4, which gives 1
          - id: a
            text: Add up x times 0.25 across [2, 6], which gives 4
          - id: c
            text: Read off the density at the middle point, which gives 0.25
        answer: a
        feedback: E[X] = ∫ x × 0.25 dx over [2, 6] = 0.25 × (6² − 2²)/2 = 4, the middle of the range. Width times density gives the total probability, 1, not the average value.
