scenes:
- id: integrals-density.s1
  title: From repeated addition to accumulation
  type: explanation
  depth: intuition
  objective_refs:
  - objective.integrals-density
  markdown: If a vehicle moves at 2 meters per second for 3 seconds, it travels 6 meters. When speed changes continuously,
    divide time into short intervals, estimate distance in each, and add them. An integral formalizes the limiting
    accumulation as intervals become small, under suitable conditions.
  text_mode: If a vehicle moves at 2 meters per second for 3 seconds, it travels 6 meters. When speed changes continuously,
    divide time into short intervals, estimate distance in each, and add them. An integral formalizes the limiting
    accumulation as intervals become small, under suitable conditions.
  bridges: []
- id: integrals-density.s2
  title: A density is not a point probability
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.integrals-density
  markdown: A uniform variable on [0, 2] has density 0.5 throughout that interval. The probability of falling between
    0 and 1 is the area 1 × 0.5 = 0.5. In a continuous distribution, a single exact point has zero probability even
    where its density is positive. A density can exceed 1 on a sufficiently narrow interval.
  text_mode: A uniform variable on [0, 2] has density 0.5 throughout that interval. The probability of falling between
    0 and 1 is the area 1 × 0.5 = 0.5. In a continuous distribution, a single exact point has zero probability even
    where its density is positive. A density can exceed 1 on a sufficiently narrow interval.
  bridges:
  - functions
  - probability
- id: integrals-density.s3
  title: Approximate an area numerically
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.integrals-density
  markdown: For a line rising from height 0 to 2 over width 2, the triangular area is 2. A left-endpoint approximation
    using two width-one rectangles gives 0 + 1 = 1; right endpoints give 1 + 2 = 3. Finer partitions or trapezoids
    can improve accuracy. An approximation needs an error assessment, not just a decimal result.
  text_mode: For a line rising from height 0 to 2 over width 2, the triangular area is 2. A left-endpoint approximation
    using two width-one rectangles gives 0 + 1 = 1; right endpoints give 1 + 2 = 3. Finer partitions or trapezoids
    can improve accuracy. An approximation needs an error assessment, not just a decimal result.
  bridges: []
- id: integrals-density.s4
  title: Connect area to expectation
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.integrals-density
  markdown: For a continuous variable, expectation accumulates each value multiplied by its density. A uniform variable
    between 0 and 2 has mean 1 by symmetry. In AI, integrals appear when averaging over uncertain latent variables.
    Sampling can approximate such averages when exact integration is difficult, but introduces sampling error.
  text_mode: For a continuous variable, expectation accumulates each value multiplied by its density. A uniform
    variable between 0 and 2 has mean 1 by symmetry. In AI, integrals appear when averaging over uncertain latent
    variables. Sampling can approximate such averages when exact integration is difficult, but introduces sampling
    error.
  bridges: []
