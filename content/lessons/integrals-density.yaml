lesson:
  id: integrals-density
  version: 0.1.0-draft
  title: Add up a continuous quantity
  state: draft
  summary: An integral accumulates contributions over an interval; continuous probabilities are areas under a density,
    and numerical integration approximates that accumulation.
  slot: B15
  category: bridge
  minutes: 12
  sources:
  - title: Deep Learning — probability and information theory
    url: https://www.deeplearningbook.org/contents/prob.html
  - title: Dive into Deep Learning — integral calculus
    url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/integral-calculus.html
objectives:
- id: objective.integrals-density
  version: 1-draft
  statement: An integral accumulates contributions over an interval; continuous probabilities are areas under a
    density, and numerical integration approximates that accumulation.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - integrals-density.base
  - integrals-density.transfer
  prerequisites:
