scenes:
- id: data.s1
  title: Choose one row to mean one thing
  type: explanation
  depth: intuition
  objective_refs:
  - objective.data
  markdown: Our task is to predict delivery duration. One example is one completed trip. A row might record distance
    2 kilometers, departure at noon, and actual duration 8 minutes. A **feature** is a chosen input detail; distance
    and departure time could be features. The duration is the **target**, the answer used to check the prediction.
    A **dataset** is the collection of rows. Define these roles before choosing a complicated model.
  text_mode: Our task is to predict delivery duration. One example is one completed trip. A row might record distance
    2 kilometers, departure at noon, and actual duration 8 minutes. A **feature** is a chosen input detail; distance
    and departure time could be features. The duration is the **target**, the answer used to check the prediction.
    A **dataset** is the collection of rows. Define these roles before choosing a complicated model.
  bridges: []
- id: data.s2
  title: Represent the observations carefully
  type: explanation
  depth: intuition
  objective_refs:
  - objective.data
  markdown: 'A **representation** is how information is written for a model to use. Distance may be stored as a
    number, while departure time could be stored as hour of day. The number 2 needs a unit: two miles is a different
    distance from two kilometers. A code such as 3 for “bicycle” is a category name, not three times the quantity
    of category 1. The computer uses the representation provided, so people must decide what each field means.'
  text_mode: 'A **representation** is how information is written for a model to use. Distance may be stored as a
    number, while departure time could be stored as hour of day. The number 2 needs a unit: two miles is a different
    distance from two kilometers. A code such as 3 for “bicycle” is a category name, not three times the quantity
    of category 1. The computer uses the representation provided, so people must decide what each field means.'
  bridges: []
- id: data.s3
  title: Missing is different from zero
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.data
  markdown: Suppose distance was not recorded. Zero kilometers claims no distance was traveled; a missing value
    says we do not know the distance. They should not be silently treated as the same observation. Record a missing
    marker or use a documented way to fill the value, and consider whether missingness itself is informative. Before
    arithmetic, inspect a few rows by hand for wrong units, impossible values, duplicates, and mistaken targets.
    Cleaning data means addressing such problems consistently.
  text_mode: Suppose distance was not recorded. Zero kilometers claims no distance was traveled; a missing value
    says we do not know the distance. They should not be silently treated as the same observation. Record a missing
    marker or use a documented way to fill the value, and consider whether missingness itself is informative. Before
    arithmetic, inspect a few rows by hand for wrong units, impossible values, duplicates, and mistaken targets.
    Cleaning data means addressing such problems consistently.
  bridges: []
- id: data.s4
  title: Give each split a job
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.data
  markdown: A **training set** supplies examples for fitting model settings. A **validation set** helps choose among
    candidate models or settings. A **test set** checks the chosen procedure on examples kept apart from those choices.
    In a tiny exercise, use the first six suitable trips for training, two for validation, and two for testing.
    That illustrates roles, not a universal split recipe. Real data may need grouping by person or time to prevent
    related examples appearing on both sides.
  text_mode: A **training set** supplies examples for fitting model settings. A **validation set** helps choose
    among candidate models or settings. A **test set** checks the chosen procedure on examples kept apart from those
    choices. In a tiny exercise, use the first six suitable trips for training, two for validation, and two for
    testing. That illustrates roles, not a universal split recipe. Real data may need grouping by person or time
    to prevent related examples appearing on both sides.
  bridges: []
- id: data.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.data
  markdown: Use two different examples to check your understanding. Hints are available for practice. A later, fresh
    answer without hints can demonstrate personal-study mastery.
  text_mode: Labeled radio options and a submit button; no timing requirement.
  takeaway: A useful dataset has clear examples, meaningful measurements, and a fair separation between fitting
    a rule and checking it.
- id: data.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.data
  markdown: Define an example, its representation, and its target; keep evaluation data separate and check what
    the dataset leaves out.
  text_mode: Define an example, its representation, and its target; keep evaluation data separate and check what
    the dataset leaves out.
- id: data.s5
  title: Spot the shortcut in a worked case
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.data
  markdown: Suppose the inputs include a field called “arrival time,” even though the app must predict duration
    before the rider departs. That field contains future information unavailable at the moment of use. **Leakage**
    is inappropriate access to information that makes a training or evaluation task easier than the real one. A
    low error can then reward the shortcut. Remove that field and repeat the development process; do not report
    the leaked score as evidence for the repaired system.
  text_mode: Suppose the inputs include a field called “arrival time,” even though the app must predict duration
    before the rider departs. That field contains future information unavailable at the moment of use. **Leakage**
    is inappropriate access to information that makes a training or evaluation task easier than the real one. A
    low error can then reward the shortcut. Remove that field and repeat the development process; do not report
    the leaked score as evidence for the repaired system.
  bridges: []
- id: data.s6
  title: Ask which trips are missing
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.data
  markdown: If every recorded trip was short and flat, the collection says little about long hill routes. Extra
    copies of short flat trips do not supply that missing experience. Inspect who collected the examples, which
    conditions they cover, and why rows are absent. This history is **provenance**, where the data came from and
    how it was handled. A model can fit the records while failing in the intended setting, so data review belongs
    beside numerical evaluation.
