lesson:
  id: data
  version: 0.1.0-draft
  title: From the world to a dataset
  state: draft
  summary: Define an example, its representation, and its target; keep evaluation data separate and check what
    the dataset leaves out.
  slot: M03.1
  category: learning
  minutes: 9
  sources:
  - title: 'Artificial Intelligence: A Modern Approach — topic overview'
    url: https://aima.cs.berkeley.edu/contents.html
objectives:
- id: objective.data
  version: 1-draft
  statement: Define an example, its representation, and its target; keep evaluation data separate and check
    what the dataset leaves out.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - data.base
  - data.transfer
  prerequisites:
  - anyOf:
