scenes:
- id: data.s1
  type: explanation
  depth: intuition
  objective_refs:
  - objective.data
  text_mode: The complete explanation is available as readable text.
  title: Choose what an example means
  markdown: 'For a delivery-time predictor, one example might describe a delivery: distance, departure time,
    and an observed duration. Distance and time-of-day can become **features**. The observed duration is a
    possible **target**.


    The model receives a representation of the world, not the world itself. Anything omitted or measured badly
    can affect what it learns.'
- id: data.s2
  type: explanation
  depth: intuition
  objective_refs:
  - objective.data
  text_mode: The complete explanation is available as readable text.
  title: Numbers still carry assumptions
  markdown: 'Encoding distance in kilometers or miles changes the numerical scale. A missing value is not always
    the number zero. A category code such as 3 is not automatically three times category 1.


    Choose representations intentionally and record what each field means.'
- id: data.s3
  type: explanation
  depth: intuition
  objective_refs:
  - objective.data
  text_mode: The complete explanation is available as readable text.
  title: Keep a fair test
  markdown: 'Use training data to fit the model. Use validation data to choose settings. Reserve suitable test
    data to estimate performance after those choices.


    If information about the answer leaks into an input—or test examples influenced training—the apparent result
    can be misleading.'
- id: data.s4
  type: explanation
  depth: intuition
  objective_refs:
  - objective.data
  text_mode: The complete explanation is available as readable text.
  title: Ask who and what is missing
  markdown: 'A dataset can overrepresent easy cases, one location, one camera, or one group. More rows do not
    automatically fix missing coverage.


    Before choosing a bigger model, inspect samples, label quality, provenance, and whether the evaluation
    matches the real use.'
- id: data.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.data
  markdown: Use two different examples to check your understanding. Hints are available for practice. A later,
    fresh answer without hints can demonstrate personal-study mastery.
  text_mode: Labeled radio options and a submit button; no timing requirement.
- id: data.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.data
  markdown: Define an example, its representation, and its target; keep evaluation data separate and check
    what the dataset leaves out.
  text_mode: Define an example, its representation, and its target; keep evaluation data separate and check
    what the dataset leaves out.
