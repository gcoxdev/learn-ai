scenes:
  - id: data.s1
    title: What one row means
    type: explanation
    depth: intuition
    objective_refs:
      - objective.data
    markdown: |-
      Every morning at 5 a.m., Rosa decides how many croissants her bakery will bake. Too few, and customers leave empty-handed. Too many, and she throws pastries away at closing. She has a year of notes in a notebook. Could a model make the call?

      The first decision has nothing to do with models: what does one row stand for? Rosa's question is about a whole day, so one row is one day at her shop. (For "which customers buy croissants?", one row would be one purchase.)

      | Date | Day | Forecast | Croissants sold |
      | --- | --- | --- | ---: |
      | 7 Mar | Fri | sunny | 84 |
      | 8 Mar | Sat | rain | 60 |
      | 9 Mar | Sun | sunny | 112 |

      The middle columns are **features**, details Rosa knows at 5 a.m. The last is the **target**, the number the model should predict. Together the rows form a **dataset**.

      :::predict On that Saturday, Rosa baked 60 croissants and sold all 60 by 10 a.m. How many croissants did Saturday's customers want?
      At least 60, and nobody knows how many more. Sales can't exceed what was baked, so on sell-out days the notebook undercounts demand, and a model trained on it learns to bake too few on the busiest days. Statisticians call such a value *censored*. The fix is to record one more fact, whether and when she sold out, so those days count as "60 or more."
      :::
  - id: data.s2
    title: Numbers need meanings
    type: explanation
    depth: intuition
    objective_refs:
      - objective.data
    markdown: |-
      Rosa's nephew types the notebook into a spreadsheet and codes the days as numbers: Monday = 1 up to Sunday = 7. But a model that multiplies each feature by a weight, like the ones in the first module, would treat Sunday as seven times Monday. Days aren't amounts. They're names.

      The usual fix is to give each day its own yes-or-no column, a trick called **one-hot encoding**:

      | Day | is_Fri | is_Sat | is_Sun |
      | --- | ---: | ---: | ---: |
      | Fri | 1 | 0 | 0 |
      | Sat | 0 | 1 | 0 |
      | Sun | 0 | 0 | 1 |

      With one column per day, seven in all, the model can learn a separate bump for each day. How information is written down for a model is its **representation**. Units are part of it too: if one page counts croissants by the dozen, "7" means 84, so put the unit in every column heading.

      :::mixup "If a column holds numbers, the model can do arithmetic with it."
      Codes are numbers that aren't amounts: a day number, a postcode, a product ID. Before handing a number to a model, ask: does a bigger number mean *more of something*? For croissants sold, yes. For day 7, no.
      :::
  - id: data.s3
    title: A blank is not a zero
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.data
    markdown: |-
      On 14 October the register broke and nobody counted, so that day's sales cell is blank. If the spreadsheet quietly turns the blank into 0, the model learns that an ordinary Tuesday sold nothing, and every Tuesday prediction drops. A blank means *unknown*, and a zero means "we counted, and it was none." Mark the blank as missing until you decide how to handle it; the data cleaning lesson shows the options.

      Blanks can also carry a message. If the blank days are mostly hectic Saturdays, when nobody had time to count, then deleting them makes the shop look quieter than it really is.
  - id: data.s5
    title: The column that knows tonight's answer
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.data
    markdown: |-
      Rosa's notebook also records *croissants baked* and *croissants left at closing*. Add them as features, and a model predicts last year's sales perfectly:

      $$\text{sold} = \text{baked} - \text{left at closing}$$

      But at 5 a.m. tonight's leftovers don't exist yet, and "baked" is the very number she's deciding. You've met this trap before, with button photos named `red-button-1.jpg`. It's called **leakage**: information in the inputs that the model won't have when it's really used.

      The test is one question per column: *Would Rosa know this at 5 a.m.?*

      | Column | Known at 5 a.m.? | Role |
      | --- | --- | --- |
      | Day of week | Yes | Feature |
      | Weather forecast | Yes | Feature |
      | Left at closing | No, only tonight | Leak: remove |
      | Croissants sold | No, only tonight | Target |

      :::predict Rosa suggests swapping "weather forecast" for the actual weather, since it's more accurate. Why is that a mistake?
      The actual weather is known only after the day is over. At 5 a.m. Rosa has the forecast, which is sometimes wrong, so a model tested on the real weather gets an easier job than it will face. Train and test on what she'll actually have.
      :::
  - id: data.s4
    title: Give each month a job
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.data
    markdown: |-
      Rosa's notebook runs from March to February. Before trying any model, she splits the months:

      - **Training set** (March to October): rows the model learns from.
      - **Validation set** (November, December): rows for picking between candidate models.
      - **Test set** (January, February): sealed until the end, then used once.

      Why by month instead of shuffling days? Rosa always predicts tomorrow from the past, so the test should come after the training data, just as in real use. The splits lesson later in this module goes deeper.
  - id: data.s6
    title: The rows that never got written
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.data
    markdown: |-
      Look at that split again: the model trains on March to October, so it has never seen winter. And the shop was closed on Mondays until February, so it has never seen a Monday either. Every row is correct. What's wrong is *which* rows exist, and a thousand more summer rows won't teach the model about Mondays. The record of where data came from and how it was collected is its **provenance**, the subject of a lesson coming soon.

      :::predict Rosa's cousin runs an ice-cream stand and predicts each day's sales at 8 a.m. from these columns: date, forecast high, actual high, scoops sold, tubs opened. Which are features, target, and leaks?
      Features: the date (as day of week and season) and the forecast high. Target: scoops sold. Leaks: the actual high, known only that afternoon, and tubs opened, which rises with the scoops already served.
      :::
  - id: data.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.data
    markdown: A school cafeteria, a bike-share dock, a clinic, and a bookshop ask you to pick the right row, read a blank, and spot the column that knows the answer.
    takeaway: |-
      Decide what one row means, write every column so its numbers mean something, and use only what you'd know at the moment of prediction. Then ask which rows never got written down.
  - id: data.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.data
    markdown: |-
      Define an example, its representation, and its target; keep evaluation data separate and check what the dataset leaves out.
