assessment_families:
  - id: data.base
    objective_ref: objective.data
    task: base
    response_type: single_choice
    points: 1
    hint: Define an example, its representation, and its target; keep evaluation data separate and check what the dataset leaves out.
    variants:
      - id: data.base.1
        prompt: For a delivery-time predictor, the observed duration is usually what?
        options:
          - id: a
            text: A guarantee of perfect future predictions.
          - id: b
            text: Always an input available before departure.
          - id: correct
            text: A target the model may learn to predict.
        answer: correct
        feedback: A target the model may learn to predict.
        retired: true
      - id: data.base.2
        prompt: A category is encoded as the number 3. What can you infer?
        options:
          - id: b
            text: It cannot be used in any model.
          - id: correct
            text: Only what the encoding definition says; numerical distance may have no meaning.
          - id: a
            text: It is inherently three times category 1.
        answer: correct
        feedback: Only what the encoding definition says; numerical distance may have no meaning.
        retired: true
  - id: data.transfer
    objective_ref: objective.data
    task: transfer
    response_type: single_choice
    points: 1
    hint: Define an example, its representation, and its target; keep evaluation data separate and check what the dataset leaves out.
    variants:
      - id: data.transfer.1
        prompt: A model receives a field filled in only after the outcome is known. What could go wrong?
        options:
          - id: b
            text: There is no issue if the field is numeric.
          - id: correct
            text: The field can leak the target into an apparently predictive input.
          - id: a
            text: The model will necessarily become more reliable in advance.
        answer: correct
        feedback: The field can leak the target into an apparently predictive input.
        retired: true
      - id: data.transfer.2
        prompt: A camera dataset contains only clear daylight photos. What remains uncertain?
        options:
          - id: correct
            text: How a model will behave under different lighting or weather.
          - id: a
            text: Whether the dataset has any rows.
          - id: b
            text: Whether numerical computation is possible.
        answer: correct
        feedback: How a model will behave under different lighting or weather.
        retired: true
  - id: data.base.v2
    objective_ref: objective.data
    task: base
    response_type: single_choice
    points: 1
    hint: For each column, ask two things. Would you know it at the moment you make the prediction? And does a bigger number really mean more of something?
    remediation_scene: data.s5
    variants:
      - id: data.base.v2.1
        prompt: At 9 a.m. a school cafeteria predicts how many hot lunches it will sell that day. Its table has the day of week, the menu, lunches sold, and trays washed after lunch. Which column is a leak?
        options:
          - id: a
            text: Lunches sold, because it's the number being predicted
          - id: b
            text: Trays washed after lunch, because it's counted after the sales
          - id: c
            text: The menu, because some dishes sell much better than others
        answer: b
        feedback: Trays washed is counted after lunch and rises in step with lunches sold, so it hands the model the answer. Lunches sold isn't a leak; it's the target. The menu is known in the morning, so it's a fair feature even though it matters a lot.
      - id: data.base.v2.2
        prompt: Days are coded Monday = 1 through Sunday = 7, and the model multiplies each feature by a weight. What goes wrong?
        options:
          - id: c
            text: It learns a separate effect for each day, which wastes weights
          - id: b
            text: It can't use the column, because weights need decimal inputs
          - id: a
            text: It treats Sunday as seven times Monday, though days aren't amounts
        answer: a
        feedback: A single weight times the day number makes each day "more" than the one before, which means nothing for names. A separate effect per day is what one-hot encoding gives you, and it's the fix, not the problem.
      - id: data.base.v2.3
        prompt: One Tuesday's sales entry is blank because the register broke. The spreadsheet fills the blank with 0. What will a model learn from that row?
        options:
          - id: a
            text: That an ordinary Tuesday sold nothing, pulling Tuesday guesses down
          - id: b
            text: Nothing at all, because a zero adds no information to training
          - id: c
            text: That the shop was closed that day, which is useful to know
        answer: a
        feedback: A zero is a real value, so the model treats it as a real Tuesday with no sales. It doesn't mean "closed" either, since the shop was open. The blank should stay marked as missing until someone decides how to handle it.
      - id: data.base.v2.4
        prompt: A bakery baked 80 croissants one Saturday and sold all 80 by noon. What does the "sold" number tell you about that day's demand?
        options:
          - id: b
            text: Demand was exactly 80, since every croissant was bought
          - id: c
            text: Demand can't be judged, so the day should be deleted
          - id: a
            text: Demand was at least 80, and the true number is unknown
        answer: a
        feedback: Sales can't exceed what was baked, so a sell-out gives only a lower bound. Deleting the day throws away the busiest days, which makes the shop look quieter than it is; recording the sell-out time keeps the information.
  - id: data.transfer.v2
    objective_ref: objective.data
    task: transfer
    response_type: single_choice
    points: 1
    hint: Picture the exact moment the prediction is made. What does one prediction cover, what is known right then, and which situations never made it into the records?
    remediation_scene: data.s6
    variants:
      - id: data.transfer.v2.1
        prompt: A bike-share company predicts at 6 a.m. how many bikes each dock will need that day. A teammate adds "bikes returned to this dock today" as a feature, and test error halves. What's the best explanation?
        options:
          - id: c
            text: Returns are a strong real signal, so the model found a useful pattern
          - id: a
            text: The feature comes from later in the day, so it isn't known at 6 a.m.
          - id: b
            text: The model now has too many features, so the error is unreliable
        answer: a
        feedback: Today's returns only exist after the day unfolds, so the improvement comes from peeking at the future. It would vanish at 6 a.m. in real use. The number of features isn't the problem; one leaky column is.
      - id: data.transfer.v2.2
        prompt: A clinic wants to text a reminder before any appointment likely to be missed. What should one row of its dataset be?
        options:
          - id: a
            text: One patient, since patients are the ones who miss visits
          - id: b
            text: One day, since the clinic plans its staffing by the day
          - id: c
            text: One appointment, since each prediction is about one booking
        answer: c
        feedback: The decision, whether to send a reminder, is made per booking, so each row should be one appointment. A row per patient would blur together visits they kept and missed; a row per day answers a staffing question instead.
      - id: data.transfer.v2.3
        prompt: A bookshop's sales records start in June. In November the owner trains a model to predict December sales. What should worry her most?
        options:
          - id: b
            text: The holiday rush never appears in her data, so the model has no example of it
          - id: a
            text: Summer rows outnumber autumn rows, so the model will lean toward summer
          - id: c
            text: Six months of rows is too few for a model to be trained at all
        answer: b
        feedback: December's rush is a situation the records simply don't contain, and no amount of summer data can show it. Having more summer rows than autumn rows is a smaller worry, and small models can be trained on six months of daily data.
      - id: data.transfer.v2.4
        prompt: A team predicting daily ice-cream demand shuffles two years of days at random into training and test sets. Which split better matches how the model will be used?
        options:
          - id: b
            text: Shuffle again, checking that every month appears in both sets
          - id: c
            text: Put the busiest days in the test set so the test is harder
          - id: a
            text: Train on the earlier months and test on the later months
        answer: a
        feedback: In use, the model always predicts future days from past ones, so the test should be later in time than training. Making sure every month appears in both sets is exactly what lets the model peek at neighbors of the test days.
