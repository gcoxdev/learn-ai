assessment_families:
- id: data.base
  objective_ref: objective.data
  task: base
  response_type: single_choice
  points: 1
  hint: Define an example, its representation, and its target; keep evaluation data separate and check what
    the dataset leaves out.
  variants:
  - id: data.base.1
    prompt: For a delivery-time predictor, the observed duration is usually what?
    options:
    - id: a
      text: A guarantee of perfect future predictions.
    - id: b
      text: Always an input available before departure.
    - id: correct
      text: A target the model may learn to predict.
    answer: correct
    feedback: A target the model may learn to predict.
  - id: data.base.2
    prompt: A category is encoded as the number 3. What can you infer?
    options:
    - id: b
      text: It cannot be used in any model.
    - id: correct
      text: Only what the encoding definition says; numerical distance may have no meaning.
    - id: a
      text: It is inherently three times category 1.
    answer: correct
    feedback: Only what the encoding definition says; numerical distance may have no meaning.
- id: data.transfer
  objective_ref: objective.data
  task: transfer
  response_type: single_choice
  points: 1
  hint: Define an example, its representation, and its target; keep evaluation data separate and check what
    the dataset leaves out.
  variants:
  - id: data.transfer.1
    prompt: A model receives a field filled in only after the outcome is known. What could go wrong?
    options:
    - id: b
      text: There is no issue if the field is numeric.
    - id: correct
      text: The field can leak the target into an apparently predictive input.
    - id: a
      text: The model will necessarily become more reliable in advance.
    answer: correct
    feedback: The field can leak the target into an apparently predictive input.
  - id: data.transfer.2
    prompt: A camera dataset contains only clear daylight photos. What remains uncertain?
    options:
    - id: correct
      text: How a model will behave under different lighting or weather.
    - id: a
      text: Whether the dataset has any rows.
    - id: b
      text: Whether numerical computation is possible.
    answer: correct
    feedback: How a model will behave under different lighting or weather.
