lesson:
  id: data
  version: 0.4.0-draft
  title: From the world to a dataset
  state: draft
  summary: A baker wants a model to decide how many croissants to bake. Turn her messy notebook into a dataset, and catch the column that secretly knows tonight's answer.
  slot: M03.1
  category: learning
  sources:
    - title: Dive into Deep Learning — data preprocessing
      url: https://d2l.ai/chapter_preliminaries/pandas.html
  archetype: foundation
objectives:
  - id: objective.data
    version: 2-draft
    statement: Define an example, its representation, and its target; keep evaluation data separate and check what the dataset leaves out.
    depths:
      - intuition
