assessment_families:
- id: weights-and-predictions.base
  objective_ref: objective.weights-and-predictions
  task: base
  response_type: single_choice
  points: 1
  variants:
  - id: weights-and-predictions.base.v2.1
    prompt: With a weight of 2 crackers per guest, what is predicted for four guests?
    options:
    - id: a
      text: 8 crackers
    - id: b
      text: 6 crackers
    - id: c
      text: 2 crackers
    answer: a
    feedback: Four groups of two give eight. Six comes from adding instead of multiplying.
  - id: weights-and-predictions.base.v2.2
    prompt: Keep three guests and change the weight from 2 to 4. What prediction follows?
    options:
    - id: b
      text: 7 crackers
    - id: c
      text: 6 crackers
    - id: a
      text: 12 crackers
    answer: a
    feedback: The new rule gives three groups of four; six was the earlier prediction.
  - id: weights-and-predictions.base.v2.3
    prompt: Which stored number is the weight in our toy rule?
    options:
    - id: c
      text: The crackers actually eaten today
    - id: a
      text: The crackers-per-guest setting
    - id: b
      text: The guests in today’s request
    answer: a
    feedback: The weight controls the contribution of the input; request and target play different roles.
  - id: weights-and-predictions.base.v2.4
    prompt: The weight stays 2, but the guest count changes from 3 to 5. What changed?
    options:
    - id: a
      text: The input to the model
    - id: b
      text: The stored weight of the model
    - id: c
      text: The observed target from yesterday
    answer: a
    feedback: Changing a question does not itself change the stored rule.
  - id: weights-and-predictions.base.v2.5
    prompt: A toy snack rule uses 4 crackers per guest. For 6 guests, what does it predict?
    options:
    - id: a
      text: 10 crackers
    - id: b
      text: 4 crackers
    - id: c
      text: 24 crackers
    answer: c
    feedback: 'Multiply the input 6 by the weight 4: six groups of four make 24.'
  - id: weights-and-predictions.base.v2.6
    prompt: Keep 5 guests fixed and change the crackers-per-guest setting from 2 to 3. Which part changed?
    options:
    - id: a
      text: The weight
    - id: b
      text: The guest-count input
    - id: c
      text: The observed amount eaten
    answer: a
    feedback: The stored multiplier changed. The input remains 5, and no observed amount was supplied.
  hint: 'Trace the example in your own words: what goes in, what happens, and what comes out?'
  remediation_scene: weights-and-predictions.s3
- id: weights-and-predictions.transfer
  objective_ref: objective.weights-and-predictions
  task: transfer
  response_type: single_choice
  points: 1
  variants:
  - id: weights-and-predictions.transfer.v2.1
    prompt: A model predicts 6 crackers when 9 were eaten. How far short was it?
    options:
    - id: b
      text: 15 crackers
    - id: c
      text: 9 crackers
    - id: a
      text: 3 crackers
    answer: a
    feedback: 'Count from six to nine: the shortfall is three.'
  - id: weights-and-predictions.transfer.v2.2
    prompt: Which description fits a parameter?
    options:
    - id: c
      text: An example supplied for the current calculation
    - id: a
      text: A stored number affecting the model’s calculation
    - id: b
      text: An answer printed by the current calculation
    answer: a
    feedback: Parameters help determine the rule rather than naming the current question or answer.
  - id: weights-and-predictions.transfer.v2.3
    prompt: Turning the activity’s weight dial yourself demonstrates which operation?
    options:
    - id: a
      text: Manually changing a model setting
    - id: b
      text: Collecting a new observed target
    - id: c
      text: Automatically learning from many examples
    answer: a
    feedback: The control shows the effect of a parameter; it does not run an automatic learning procedure.
  - id: weights-and-predictions.transfer.v2.4
    prompt: Weight 3 fits one observed snack example. What would help test that rule?
    options:
    - id: b
      text: Compare that same matching example several more times
    - id: c
      text: Count the one fitted example as evidence for every group
    - id: a
      text: Compare its answers with other groups
    answer: a
    feedback: Other observed groups can reveal whether the match extends beyond one example.
  - id: weights-and-predictions.transfer.v2.5
    prompt: A toy model predicts 16 crackers, but the group eats 12. How does its prediction compare with the
      observation?
    options:
    - id: a
      text: It is 4 crackers too high
    - id: b
      text: It is 4 crackers too low
    - id: c
      text: It matches because both amounts are totals
    answer: a
    feedback: The prediction exceeds the observation by 16 − 12 = 4. Keep both the size and direction of the
      error clear.
  - id: weights-and-predictions.transfer.v2.6
    prompt: You drag a model’s weight from 2 to 5 without supplying any examples. What did you demonstrate?
    options:
    - id: a
      text: Learning that selected a setting from examples
    - id: b
      text: A manual change to a stored setting
    - id: c
      text: An observation of how many crackers were eaten
    answer: b
    feedback: The control shows what changing a weight does. Moving it yourself is not automatic learning from
      examples.
  hint: 'Trace the example in your own words: what goes in, what happens, and what comes out?'
  remediation_scene: weights-and-predictions.s3
