schema_version: 0.2-draft
lesson:
  id: weights-and-predictions
  version: 0.4.0-draft
  title: 'Weights: the adjustable numbers in a model'
  summary: Big AI models are built from billions of adjustable numbers called weights. Turn one yourself on a snack model and see exactly what it changes.
  state: draft
  slot: M00.5
  category: common
  archetype: foundation
  sources:
    - title: Dive into Deep Learning — linear regression
      url: https://d2l.ai/chapter_linear-regression/linear-regression.html
objectives:
  - id: objective.weights-and-predictions
    version: 3-draft
    statement: A weight is an adjustable number that multiplies an input. Changing the input asks a new question; changing the weight changes the rule used to answer it.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - weights-and-predictions.base
      - weights-and-predictions.transfer.v3
    prerequisites:
      - anyOf:
          - objective.models-and-products
scenes:
  - id: weights-and-predictions.s1
    title: A rule with a dial on it
    type: explanation
    depth: intuition
    objective_refs:
      - objective.weights-and-predictions
    markdown: |-
      When people talk about how big an AI model is, they usually count its adjustable numbers. GPT-3, a language model released in 2020, had 175 billion of them. That sounds impossible to picture, so let's picture just one.

      Take the snack model from the last lesson, but put a dial on the "crackers per guest" number. The dial is set to 2. For three guests, the model counts two crackers three times: 2 + 2 + 2 = 6.

      The number of guests is the input. Six crackers is the prediction. The dial decides how much each guest adds. In this lesson we'll turn the dial and change the input, one at a time, so you can see exactly what each one does.
  - id: weights-and-predictions.s2
    title: Name the dial
    type: explanation
    depth: intuition
    objective_refs:
      - objective.weights-and-predictions
    markdown: |-
      A **weight** is a number that multiplies an input. Our weight is 2 crackers per guest. The whole model fits in one line:

      $$\text{prediction} = \text{weight} \times \text{input}$$

      The × sign means "groups of": three groups of two make six. If multiplying feels rusty, the arithmetic side lesson is a quick refresher.

      A **parameter** is any stored, adjustable number that shapes a model's answers. A weight is one kind of parameter. Those 175 billion numbers in GPT-3 are parameters, and most of them are weights doing this same multiplying job.
    bridges:
      - arithmetic
  - id: weights-and-predictions.s3
    title: Change the question, keep the dial
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.weights-and-predictions
    markdown: |-
      Leave the weight at 2 and try different parties. Here is the snack model as a four-line Python program. Press Run.

      ```python run
      weight = 2
      for guests in [2, 3, 4]:
          prediction = weight * guests
          print(guests, "guests ->", prediction, "crackers")
      ```

      - `weight = 2` sets the dial.
      - `for guests in [2, 3, 4]:` repeats the next lines three times, with `guests` set to 2, then 3, then 4. These are three different inputs.
      - `prediction = weight * guests` is the model. In Python, `*` means multiply.
      - `print(...)` shows each input and its prediction.

      It prints `2 guests -> 4 crackers`, `3 guests -> 6 crackers`, and `4 guests -> 8 crackers`. The predictions changed because the inputs changed. The weight never moved.

      Now change the first line to `weight = 3` and run it again. Every prediction changes, because you changed the rule itself.
  - id: weights-and-predictions.s4
    title: Change the dial, keep the question
    type: simulation
    depth: mechanics
    objective_refs:
      - objective.weights-and-predictions
    markdown: |-
      Keep three guests and turn the weight from 2 to 3. The prediction becomes three groups of three: 9 crackers. Same input, different rule, different answer.

      :::predict Keep three guests and turn the dial all the way down to 0. What does the model predict?
      Zero crackers, and it would predict zero for *any* number of guests, because anything times 0 is 0. A weight of 0 switches that input off completely.
      :::

      Use the controls below to check. Slide the guests first, then the weight, and say out loud which one you just changed: the question or the rule. Here, you're turning the dial by hand; in the next lesson, the computer learns to turn it.
    simulation: weighted-rule
  - id: weights-and-predictions.s5
    title: Check the dial against a real party
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.weights-and-predictions
    markdown: |-
      Your notes say that at last week's party, 3 guests ate 9 crackers. That recorded amount is the target. How well does each weight do?

      | Weight | Prediction for 3 guests | Compared with 9 eaten |
      | --- | ---: | --- |
      | 1 | 3 | 6 too few |
      | 2 | 6 | 3 too few |
      | 3 | 9 | exactly right |
      | 4 | 12 | 3 too many |

      Weight 3 matches this party. Before you trust it, check it on another party too. Suppose 2 guests once ate 7 crackers. Weight 3 predicts 6, which is 1 short: close, but not perfect. Real guests don't eat in neat multiples, so the goal is a weight that's close for most parties.

      Measuring the misses and changing the weight to shrink them is the heart of training, done automatically by a computer. That's the next lesson.
  - id: weights-and-predictions.s6
    title: From one dial to billions
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.weights-and-predictions
    markdown: |-
      Real models combine many inputs, each with its own weight. Say children eat less than adults:

      $$\text{crackers} = 3 \times \text{adults} + 1.5 \times \text{children}$$

      For 4 adults and 2 children: 3 × 4 = 12, plus 1.5 × 2 = 3, for 15 crackers. Weights can be fractions like 1.5, and they can be negative, which makes an input pull the prediction down.

      :::mixup "Each weight in a big AI model stands for one clear fact, like 'crackers per guest.'"
      Our weights have tidy meanings because we built a tiny model on purpose. In a big model, weights are set by training, and a single weight usually has no everyday meaning at all. What matters is the job every weight does: multiply an input, and add its share to the answer.
      :::
  - id: weights-and-predictions.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.weights-and-predictions
    markdown: Crackers, watering cans, taxi fares, and lemonade stands ask you to tell the weight from the input and work out fresh predictions.
    takeaway: |-
      A weight is an adjustable number that multiplies an input. Changing the input asks the model a new question; changing the weight changes the rule it uses to answer.
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - weights-and-predictions.s1
        - weights-and-predictions.s2
        - weights-and-predictions.s3
        - weights-and-predictions.s4
        - weights-and-predictions.s5
        - weights-and-predictions.s6
        - weights-and-predictions.check
      gate_refs:
        - gate.core
  scene_aliases: {}
assessment_families:
  - id: weights-and-predictions.base
    objective_ref: objective.weights-and-predictions
    task: base
    response_type: single_choice
    points: 1
    variants:
      - id: weights-and-predictions.base.v2.1
        prompt: With a weight of 2 crackers per guest, what is predicted for four guests?
        options:
          - id: a
            text: 8 crackers
          - id: b
            text: 6 crackers
          - id: c
            text: 2 crackers
        answer: a
        feedback: Four groups of two give eight. Six comes from adding instead of multiplying.
      - id: weights-and-predictions.base.v2.2
        prompt: Keep three guests and change the weight from 2 to 4. What prediction follows?
        options:
          - id: b
            text: 7 crackers
          - id: c
            text: 6 crackers
          - id: a
            text: 12 crackers
        answer: a
        feedback: The new rule gives three groups of four; six was the earlier prediction.
      - id: weights-and-predictions.base.v2.3
        prompt: Which stored number is the weight in our toy rule?
        options:
          - id: c
            text: The crackers actually eaten today
          - id: a
            text: The crackers-per-guest setting
          - id: b
            text: The guests in today’s request
        answer: a
        feedback: "The crackers-per-guest setting multiplies the input, so it's the weight. The guest count is the input, and the crackers actually eaten are the target."
      - id: weights-and-predictions.base.v2.4
        prompt: The weight stays 2, but the guest count changes from 3 to 5. What changed?
        options:
          - id: a
            text: The input to the model
          - id: b
            text: The stored weight of the model
          - id: c
            text: The observed target from yesterday
        answer: a
        feedback: "A new guest count is a new question, so the input changed. The weight stayed at 2, so the rule itself didn't change, and no target was involved."
      - id: weights-and-predictions.base.v2.5
        prompt: A toy snack rule uses 4 crackers per guest. For 6 guests, what does it predict?
        options:
          - id: a
            text: 10 crackers
          - id: b
            text: 4 crackers
          - id: c
            text: 24 crackers
        answer: c
        feedback: 'Multiply the input 6 by the weight 4: six groups of four make 24.'
      - id: weights-and-predictions.base.v2.6
        prompt: Keep 5 guests fixed and change the crackers-per-guest setting from 2 to 3. Which part changed?
        options:
          - id: a
            text: The weight
          - id: b
            text: The guest-count input
          - id: c
            text: The observed amount eaten
        answer: a
        feedback: The stored multiplier changed. The input remains 5, and no observed amount was supplied.
    hint: "Write prediction = weight × input. Then ask which of the two numbers changed: a new input is a new question, and a new weight is a new rule."
    remediation_scene: weights-and-predictions.s3
  - id: weights-and-predictions.transfer
    objective_ref: objective.weights-and-predictions
    task: transfer
    response_type: single_choice
    points: 1
    variants:
      - id: weights-and-predictions.transfer.v2.1
        prompt: A model predicts 6 crackers when 9 were eaten. How far short was it?
        options:
          - id: b
            text: 15 crackers
          - id: c
            text: 9 crackers
          - id: a
            text: 3 crackers
        answer: a
        feedback: 'Count from six to nine: the shortfall is three.'
        retired: true
      - id: weights-and-predictions.transfer.v2.2
        prompt: Which description fits a parameter?
        options:
          - id: c
            text: An example supplied for the current calculation
          - id: a
            text: A stored number affecting the model’s calculation
          - id: b
            text: An answer printed by the current calculation
        answer: a
        feedback: Parameters help determine the rule rather than naming the current question or answer.
        retired: true
      - id: weights-and-predictions.transfer.v2.3
        prompt: Turning the activity’s weight dial yourself demonstrates which operation?
        options:
          - id: a
            text: Manually changing a model setting
          - id: b
            text: Collecting a new observed target
          - id: c
            text: Automatically learning from many examples
        answer: a
        feedback: The control shows the effect of a parameter; it does not run an automatic learning procedure.
        retired: true
      - id: weights-and-predictions.transfer.v2.4
        prompt: Weight 3 fits one observed snack example. What would help test that rule?
        options:
          - id: b
            text: Compare that same matching example several more times
          - id: c
            text: Count the one fitted example as evidence for every group
          - id: a
            text: Compare its answers with other groups
        answer: a
        feedback: Other observed groups can reveal whether the match extends beyond one example.
        retired: true
      - id: weights-and-predictions.transfer.v2.5
        prompt: A toy model predicts 16 crackers, but the group eats 12. How does its prediction compare with the observation?
        options:
          - id: a
            text: It is 4 crackers too high
          - id: b
            text: It is 4 crackers too low
          - id: c
            text: It matches because both amounts are totals
        answer: a
        feedback: The prediction exceeds the observation by 16 − 12 = 4. Keep both the size and direction of the error clear.
        retired: true
      - id: weights-and-predictions.transfer.v2.6
        prompt: You drag a model’s weight from 2 to 5 without supplying any examples. What did you demonstrate?
        options:
          - id: a
            text: Learning that selected a setting from examples
          - id: b
            text: A manual change to a stored setting
          - id: c
            text: An observation of how many crackers were eaten
        answer: b
        feedback: The control shows what changing a weight does. Moving it yourself is not automatic learning from examples.
        retired: true
    hint: 'Trace the example in your own words: what goes in, what happens, and what comes out?'
    remediation_scene: weights-and-predictions.s3
  - id: weights-and-predictions.transfer.v3
    objective_ref: objective.weights-and-predictions
    task: transfer
    response_type: numeric
    points: 1
    hint: Write prediction = weight × input, and decide which number is the weight (the "per" number) and which is the input before you multiply.
    remediation_scene: weights-and-predictions.s5
    absolute_tolerance: 1e-6
    variants:
      - id: weights-and-predictions.transfer.v3.1
        prompt: A plant-watering model predicts cups of water = weight × plants, with a weight of 3 cups per plant. How many cups does it predict for 7 plants?
        answer: 21
        feedback: The weight is 3 and the input is 7, so 3 × 7 = 21 cups. Adding them (10) is the most common slip; each plant adds a whole group of 3.
      - id: weights-and-predictions.transfer.v3.2
        prompt: A taxi model predicts fare in dollars = weight × miles. The weight is changed from 2 to 3 dollars per mile. What does the new rule predict for an 8-mile ride?
        answer: 24
        feedback: The rule changed to 3 per mile, and the input is still 8, so 3 × 8 = 24. The old rule would have said 16.
      - id: weights-and-predictions.transfer.v3.3
        prompt: A pizza model uses slices = weight × people. It predicts 12 slices for 4 people. What is its weight, in slices per person?
        answer: 3
        feedback: Ask what number times 4 gives 12. That's 3, because 3 × 4 = 12, so the rule allows 3 slices per person.
      - id: weights-and-predictions.transfer.v3.4
        prompt: A snack model with weight 2 predicts 10 crackers for a party. You keep the same party and turn the weight up to 5. What does it predict now?
        answer: 25
        feedback: 10 crackers at 2 each means 5 guests. The guests stay the same, and the new rule gives 5 × 5 = 25.
      - id: weights-and-predictions.transfer.v3.5
        prompt: A lemonade stand's model predicts cups sold = 6 × sunny hours. On a day with 4 sunny hours, the stand actually sells 20 cups. By how many cups was the prediction too high?
        answer: 4
        feedback: The prediction is 6 × 4 = 24 cups, and 24 − 20 = 4, so it was 4 cups too high.
      - id: weights-and-predictions.transfer.v3.6
        prompt: A reading model predicts pages read = weight × days, with a weight of 15 pages per day. What does it predict for 6 days?
        answer: 90
        feedback: The weight is 15 and the input is 6, so 15 × 6 = 90 pages. The weight stays put; only the number of days is new.
