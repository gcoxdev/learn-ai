schema_version: 0.2-draft
lesson:
  id: weights-and-predictions
  version: 0.2.1-draft
  title: 'Weights: the adjustable numbers in a model'
  summary: Turn one simple dial and watch how it changes a prediction. No algebra is required.
  state: draft
  slot: M00.5
  category: common
  archetype: foundation
  sources:
  - title: Dive into Deep Learning — linear regression
    url: https://d2l.ai/chapter_linear-regression/linear-regression.html
objectives:
- id: objective.weights-and-predictions
  version: 2-draft
  statement: A weight is an adjustable number that multiplies an input. Changing the input asks a new question;
    changing the weight changes the rule used to answer it.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - weights-and-predictions.base
  - weights-and-predictions.transfer
  prerequisites:
  - anyOf:
    - objective.models-and-products
scenes:
- id: weights-and-predictions.s1
  title: Build a rule you can hold in your head
  type: explanation
  depth: intuition
  objective_refs:
  - objective.weights-and-predictions
  markdown: 'Keep our snack-planning model, but leave the crackers-per-guest number adjustable. Picture a dial
    set to 2. For three guests, count two crackers three times: 2 + 2 + 2 = 6. The guest count is the input.
    Six crackers is the prediction. The dial sets how strongly that input contributes. We will change one thing
    at a time so it is easy to see what each part does.'
  text_mode: 'Keep our snack-planning model, but leave the crackers-per-guest number adjustable. Picture a
    dial set to 2. For three guests, count two crackers three times: 2 + 2 + 2 = 6. The guest count is the
    input. Six crackers is the prediction. The dial sets how strongly that input contributes. We will change
    one thing at a time so it is easy to see what each part does.'
- id: weights-and-predictions.s2
  title: Name the dial
  type: explanation
  depth: intuition
  objective_refs:
  - objective.weights-and-predictions
  markdown: 'A **weight** is a number used to multiply an input in many numerical models. Multiplying means
    adding equal groups: three groups of two make six. Our weight is 2 crackers per guest. A **parameter**
    is a stored, adjustable number that helps determine a model’s calculation. A weight is one kind of parameter.
    A weight in AI is not how heavy the computer is, and it is not a grade for how important a person is.'
  text_mode: 'A **weight** is a number used to multiply an input in many numerical models. Multiplying means
    adding equal groups: three groups of two make six. Our weight is 2 crackers per guest. A **parameter**
    is a stored, adjustable number that helps determine a model’s calculation. A weight is one kind of parameter.
    A weight in AI is not how heavy the computer is, and it is not a grade for how important a person is.'
  bridges:
  - arithmetic
- id: weights-and-predictions.s3
  title: Change the question while keeping the dial
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.weights-and-predictions
  markdown: 'Leave the weight at 2. Two guests produce 4 crackers. Four guests produce 8. The predictions changed
    because the inputs changed. The stored rule did not change. Try saying each calculation aloud as groups:
    four groups of two make eight. Later you will see the compact notation prediction = weight × input. The
    multiplication symbol × means “groups of” here. We use the same calculation whether we write it in words
    or symbols.'
  text_mode: 'Leave the weight at 2. Two guests produce 4 crackers. Four guests produce 8. The predictions
    changed because the inputs changed. The stored rule did not change. Try saying each calculation aloud as
    groups: four groups of two make eight. Later you will see the compact notation prediction = weight × input.
    The multiplication symbol × means “groups of” here. We use the same calculation whether we write it in
    words or symbols.'
- id: weights-and-predictions.s4
  title: Change the dial while keeping the question
  type: simulation
  depth: mechanics
  objective_refs:
  - objective.weights-and-predictions
  markdown: Now keep three guests and turn the weight from 2 to 3. The prediction becomes three groups of three,
    or 9 crackers. This is a different rule for the same input. Use the controls below to compare the two situations.
    You are moving the dial yourself; the computer is not learning automatically in this activity. Notice that
    a weight of zero would make this particular model predict zero for every guest count.
  text_mode: Now keep three guests and turn the weight from 2 to 3. The prediction becomes three groups of
    three, or 9 crackers. This is a different rule for the same input. Use the controls below to compare the
    two situations. You are moving the dial yourself; the computer is not learning automatically in this activity.
    Notice that a weight of zero would make this particular model predict zero for every guest count.
  simulation: weighted-rule
- id: weights-and-predictions.s5
  title: Check against something observed
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.weights-and-predictions
  markdown: Suppose your notes say three guests actually ate 9 crackers. That recorded amount is the target.
    With weight 2, the model predicts 6, which is 3 crackers too few. With weight 3, it predicts 9, matching
    this example. Trying different weights and checking their answers prepares us for training. One matching
    example does not prove the rule fits a different group. We need more examples and a way to compare mistakes.
  text_mode: Suppose your notes say three guests actually ate 9 crackers. That recorded amount is the target.
    With weight 2, the model predicts 6, which is 3 crackers too few. With weight 3, it predicts 9, matching
    this example. Trying different weights and checking their answers prepares us for training. One matching
    example does not prove the rule fits a different group. We need more examples and a way to compare mistakes.
- id: weights-and-predictions.s6
  title: Keep the toy and the larger idea separate
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.weights-and-predictions
  markdown: Real models can combine many inputs with many weights, and some weights can be negative or fractional.
    A negative weight can subtract a contribution; a fraction can contribute part of an input. You do not need
    those calculations yet. The snack model uses one positive whole number so the role is visible. A real model’s
    weight usually does not have a tidy label like crackers per guest. Remember the role of the dial rather
    than assuming every weight has an everyday meaning.
  text_mode: Real models can combine many inputs with many weights, and some weights can be negative or fractional.
    A negative weight can subtract a contribution; a fraction can contribute part of an input. You do not need
    those calculations yet. The snack model uses one positive whole number so the role is visible. A real model’s
    weight usually does not have a tidy label like crackers per guest. Remember the role of the dial rather
    than assuming every weight has an everyday meaning.
- id: weights-and-predictions.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.weights-and-predictions
  markdown: Try a fresh example using the ideas above.
  text_mode: Untimed practice with feedback.
  takeaway: A weight is an adjustable number that multiplies an input. Changing the input asks a new question;
    changing the weight changes the rule used to answer it.
