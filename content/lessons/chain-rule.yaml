        feedback: The derivative is 2(w×x−t)×x. Retain its sign when applying the update.
        id: chain-rule.transfer.v2.2
      - prompt: For L=(w×x−t)², use w=2, x=2, t=2, and step size 0.1. Record the full derivative and next weight.
        answers:
          gradient: 8
          next: 1.2
        reason_answer: a
        reason_options:
          - id: b
            text: Add 0.1 times the full derivative to w.
          - id: c
            text: Subtract 0.1 times the residual without its chain factors.
          - id: a
            text: Subtract 0.1 times the full derivative from w.
        feedback: The derivative is 2(w×x−t)×x. Retain its sign when applying the update.
        id: chain-rule.transfer.v2.3
      - prompt: For L=(w×x−t)², use w=1, x=3, t=6, and step size 0.1. Record the full derivative and next weight.
        answers:
          gradient: -18
          next: 2.8
        reason_answer: a
        reason_options:
          - id: c
            text: Subtract 0.1 times the residual without its chain factors.
          - id: a
            text: Subtract 0.1 times the full derivative from w.
          - id: b
            text: Add 0.1 times the full derivative to w.
        feedback: The derivative is 2(w×x−t)×x. Retain its sign when applying the update.
        id: chain-rule.transfer.v2.4
