schema_version: 0.2-draft
lesson:
  id: chain-rule
  version: 0.3.0-draft
  title: The chain rule, one step at a time
  state: draft
  summary: Follow a small change through two connected calculations and multiply their local rates to find
    the overall effect.
  slot: B14
  category: bridge
  sources:
  - title: Dive into Deep Learning — calculus
    url: https://d2l.ai/chapter_preliminaries/calculus.html
  - title: Rumelhart, Hinton, and Williams — back-propagating errors (1986)
    url: https://www.nature.com/articles/323533a0
  archetype: foundation
objectives:
- id: objective.chain-rule
  version: 2-draft
  statement: Trace a composed loss and multiply its local derivatives to calculate a weight update with the
    correct sign.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - chain-rule.base.v2
  - chain-rule.transfer.v2
  prerequisites:
  - anyOf:
    - objective.derivatives
scenes:
- id: chain-rule.s1
  type: explanation
  depth: intuition
  objective_refs:
  - objective.chain-rule
  title: One calculation feeds another
  markdown: 'Imagine a toy machine that triples a number, then squares the result. The first rule is u = 3x.
    The second is y = u². Combining rules this way is called **composition**: the output of one becomes the
    input of another. At x = 2, the intermediate value u is 6 and the final output y is 36. Knowing the final
    value is one question. Knowing how sensitive y is to a small change in x is another. The chain rule answers
    that second question.'
  text_mode: 'Imagine a toy machine that triples a number, then squares the result. The first rule is u = 3x.
    The second is y = u². Combining rules this way is called **composition**: the output of one becomes the
    input of another. At x = 2, the intermediate value u is 6 and the final output y is 36. Knowing the final
    value is one question. Knowing how sensitive y is to a small change in x is another. The chain rule answers
    that second question.'
  bridges:
  - functions
  - derivatives
- id: chain-rule.s2
  type: explanation
  depth: intuition
  objective_refs:
  - objective.chain-rule
  title: Follow the units of a change
  markdown: 'The first rule changes u by about three units for each extra unit of x. At u = 6, the square rule
    has derivative 2u = 12, so y changes by about twelve units per extra unit of u. Together the rates multiply:
    3 × 12 = 36 units of y per unit of x. The intermediate units cancel. This is the **chain rule**: the local
    rate of the outer calculation times the local rate of the inner calculation. The values must be evaluated
    at the matching intermediate point.'
  text_mode: 'The first rule changes u by about three units for each extra unit of x. At u = 6, the square
    rule has derivative 2u = 12, so y changes by about twelve units per extra unit of u. Together the rates
    multiply: 3 × 12 = 36 units of y per unit of x. The intermediate units cancel. This is the **chain rule**:
    the local rate of the outer calculation times the local rate of the inner calculation. The values must
    be evaluated at the matching intermediate point.'
  bridges: []
- id: chain-rule.s3
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.chain-rule
  title: Check the local estimate against a real step
  markdown: Increase x from 2 to 2.01. The intermediate value becomes 6.03 and its square is 36.3609. The actual
    output increase is 0.3609. The derivative predicts approximately 36 × 0.01 = 0.36, which is close but not
    identical. A derivative is a local approximation for a nonzero step. A smaller step makes the approximation
    closer for this smooth function. Adding the rates, 3 + 12, would give the wrong answer; the second rule
    acts on the change produced by the first.
  text_mode: Increase x from 2 to 2.01. The intermediate value becomes 6.03 and its square is 36.3609. The
    actual output increase is 0.3609. The derivative predicts approximately 36 × 0.01 = 0.36, which is close
    but not identical. A derivative is a local approximation for a nonzero step. A smaller step makes the approximation
    closer for this smooth function. Adding the rates, 3 + 12, would give the wrong answer; the second rule
    acts on the change produced by the first.
  bridges: []
- id: chain-rule.s4
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.chain-rule
  title: Place a prediction inside a loss
  markdown: 'Use a one-input model p = w × x and squared loss L = (p − t)², where x is a fixed input, w is
    a weight, and t is the target. Let x = 2, w = 1, and t = 6. The prediction p is 2, the residual p−t is
    −4, and the loss is 16. The local loss rate with respect to p is 2(p−t) = −8. The local prediction rate
    with respect to w is x = 2. Multiply them: dL/dw = −8 × 2 = −16.'
  text_mode: 'Use a one-input model p = w × x and squared loss L = (p − t)², where x is a fixed input, w is
    a weight, and t is the target. Let x = 2, w = 1, and t = 6. The prediction p is 2, the residual p−t is
    −4, and the loss is 16. The local loss rate with respect to p is 2(p−t) = −8. The local prediction rate
    with respect to w is x = 2. Multiply them: dL/dw = −8 × 2 = −16.'
  bridges: []
  figure:
    kind: chain-rule
    caption: 'Follow a second worked fixture: input 2, target 6, prediction=2×weight, and squared error.'
    description: Trace weight→prediction→squared error. Multiply the loss-to-prediction derivative by the prediction-to-weight
      derivative to obtain the total sensitivity to the weight. The diagram uses fixed input 2 and target 6.
- id: chain-rule.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.chain-rule
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: For one chain of calculations, multiply local rates along the chain. When a value influences the
    result along multiple paths, add the path contributions.
- id: chain-rule.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.chain-rule
  markdown: For composed functions, multiply local derivatives along each path; when several paths contribute,
    add their contributions.
  text_mode: For composed functions, multiply local derivatives along each path; when several paths contribute,
    add their contributions.
- id: chain-rule.s5
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.chain-rule
  title: Use the complete rate to change the weight
  markdown: 'With step size 0.1, the update is w_new = 1 − 0.1 × (−16) = 2.6. The new prediction is 5.2 and
    the new loss is (5.2 − 6)² = 0.64. Using just −8 would omit the effect of w on the prediction. Using the
    loss 16 as a rate would also be wrong: loss measures a mismatch, while a derivative measures sensitivity.
    Keep a table for prediction, residual, loss, each local rate, and their product. That makes a dropped factor
    or sign visible.'
  text_mode: 'With step size 0.1, the update is w_new = 1 − 0.1 × (−16) = 2.6. The new prediction is 5.2 and
    the new loss is (5.2 − 6)² = 0.64. Using just −8 would omit the effect of w on the prediction. Using the
    loss 16 as a rate would also be wrong: loss measures a mismatch, while a derivative measures sensitivity.
    Keep a table for prediction, residual, loss, each local rate, and their product. That makes a dropped factor
    or sign visible.'
  bridges: []
- id: chain-rule.s6
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.chain-rule
  title: A branching graph adds another operation
  markdown: A **computational graph** is a diagram of intermediate values and the operations connecting them.
    If the same weight affects two loss terms, it has two routes to the total. For example, L = (w−1)² + (w−3)²
    has derivative 2(w−1) + 2(w−3). At w = 2, the contributions +2 and −2 cancel. Multiply rates along each
    route, then add contributions where routes meet. **Backpropagation** efficiently organizes these chain-rule
    calculations through a large graph; it does not change the underlying calculus.
  text_mode: A **computational graph** is a diagram of intermediate values and the operations connecting them.
    If the same weight affects two loss terms, it has two routes to the total. For example, L = (w−1)² + (w−3)²
    has derivative 2(w−1) + 2(w−3). At w = 2, the contributions +2 and −2 cancel. Multiply rates along each
    route, then add contributions where routes meet. **Backpropagation** efficiently organizes these chain-rule
    calculations through a large graph; it does not change the underlying calculus.
  bridges: []
