scenes:
- id: chain-rule.s1
  type: explanation
  depth: intuition
  objective_refs:
  - objective.chain-rule
  text_mode: The complete explanation is available as readable text.
  title: One rule inside another
  markdown: 'Let u=3w and L=u². The weight changes u, and u changes L. We want the effect of w on L.


    The chain rule connects these local effects: dL/dw = (dL/du) × (du/dw). Read dL/dw as “the derivative of
    L with respect to w.”'
- id: chain-rule.s2
  type: explanation
  depth: intuition
  objective_refs:
  - objective.chain-rule
  text_mode: The complete explanation is available as readable text.
  title: Put numbers on the chain
  markdown: 'At w=2, u=6. The local derivative of u² with respect to u is 2u=12. The derivative of 3w with
    respect to w is 3.


    Multiply: 12 × 3 = 36. Checking directly, L=(3w)²=9w², whose derivative at w=2 is 18w=36.'
- id: chain-rule.s3
  type: explanation
  depth: intuition
  objective_refs:
  - objective.chain-rule
  text_mode: The complete explanation is available as readable text.
  title: A loss on a prediction
  markdown: 'For L=(wx−y)², the inner quantity is wx−y. Holding example input x and target y fixed, its derivative
    with respect to w is x. The outer square contributes twice the inner value.


    Together: dL/dw = 2(wx−y)x. Grouping the prediction-minus-target difference matters.'
- id: chain-rule.s4
  type: explanation
  depth: intuition
  objective_refs:
  - objective.chain-rule
  text_mode: The complete explanation is available as readable text.
  title: From a chain to a graph
  markdown: 'If an earlier value affects a result through multiple paths, calculate each path’s contribution
    and add them. Backpropagation organizes this work across a computation graph.


    This scalar bridge supplies the core idea; vector and matrix derivatives require their own shape-aware
    treatment.'
- id: chain-rule.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.chain-rule
  markdown: Use two different examples to check your understanding. Hints are available for practice. A later,
    fresh answer without hints can demonstrate personal-study mastery.
  text_mode: Labeled radio options and a submit button; no timing requirement.
- id: chain-rule.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
