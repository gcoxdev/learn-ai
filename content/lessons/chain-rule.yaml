assessment_families:
  - id: chain-rule.base
    objective_ref: objective.chain-rule
    task: base
    response_type: single_choice
    points: 1
    hint: For composed functions, multiply local derivatives along each path; when several paths contribute, add their contributions.
    variants:
      - id: chain-rule.base.1
        prompt: For u=3w and L=u² at w=2, what is dL/dw?
        options:
          - id: a
            text: '12'
          - id: b
            text: '3'
          - id: correct
            text: '36'
        answer: correct
        feedback: At w=2, u=6; multiply the local derivatives 2u=12 and 3 to get 36.
        retired: true
      - id: chain-rule.base.2
        prompt: For a simple composition, what does the chain rule combine?
        options:
          - id: b
            text: The names of the functions without their derivatives.
          - id: correct
            text: The local derivatives of the connected functions.
          - id: a
            text: Only the final output values.
        answer: correct
        feedback: The local derivatives of the connected functions.
        retired: true
  - id: chain-rule.transfer
    objective_ref: objective.chain-rule
    task: transfer
    response_type: single_choice
    points: 1
    hint: For composed functions, multiply local derivatives along each path; when several paths contribute, add their contributions.
    variants:
      - id: chain-rule.transfer.1
        prompt: For L=(wx−y)², which factor comes from differentiating wx−y with respect to w?
        options:
          - id: b
            text: The entire squared loss.
          - id: correct
            text: x, when x and y are held fixed.
          - id: a
            text: y in every case.
        answer: correct
        feedback: Holding x and y fixed, differentiating wx−y with respect to w leaves x.
        retired: true
      - id: chain-rule.transfer.2
        prompt: An input influences a result through two paths. How are those derivative contributions combined?
        options:
          - id: correct
            text: Add the contributions from the paths.
          - id: a
            text: Ignore one path arbitrarily.
          - id: b
            text: Always subtract the longer path.
        answer: correct
        feedback: Add the contributions from the paths.
        retired: true
  - id: chain-rule.base.v2
    objective_ref: objective.chain-rule
    task: base
    response_type: numeric_fields_with_reason
    points: 1
    hint: Go forward first to get p = w × x. Then the outer rate is dL/dp = 2(p − t), the inner rate is dp/dw = x, and dL/dw is their product.
    remediation_scene: chain-rule.s4
    variants:
      - prompt: Use p=w×x and L=(p−t)² with w=1, x=3, t=5. Record p, local rate dL/dp, local rate dp/dw, and total dL/dw.
        answers:
          p: 3
          outer: -4
          inner: 3
          total: -12
        reason_answer: a
        reason_options:
          - id: c
            text: Use the loss value as the total rate.
          - id: a
            text: Multiply the two local rates evaluated at this example.
          - id: b
            text: Add the two local rates to combine the stages.
        feedback: Prediction is w×x; the outer rate is 2(p−t), the inner rate is x, and the total is their product.
        id: chain-rule.base.v2.1
      - prompt: Use p=w×x and L=(p−t)² with w=2, x=2, t=3. Record p, local rate dL/dp, local rate dp/dw, and total dL/dw.
        answers:
          p: 4
          outer: 2
          inner: 2
          total: 4
        reason_answer: a
        reason_options:
          - id: a
            text: Multiply the two local rates evaluated at this example.
          - id: b
            text: Add the two local rates to combine the stages.
          - id: c
            text: Use the loss value as the total rate.
        feedback: Prediction is w×x; the outer rate is 2(p−t), the inner rate is x, and the total is their product.
        id: chain-rule.base.v2.2
      - prompt: Use p=w×x and L=(p−t)² with w=1, x=2, t=5. Record p, local rate dL/dp, local rate dp/dw, and total dL/dw.
        answers:
          p: 2
          outer: -6
          inner: 2
          total: -12
        reason_answer: a
        reason_options:
          - id: b
            text: Add the two local rates to combine the stages.
          - id: c
            text: Use the loss value as the total rate.
          - id: a
            text: Multiply the two local rates evaluated at this example.
        feedback: Prediction is w×x; the outer rate is 2(p−t), the inner rate is x, and the total is their product.
        id: chain-rule.base.v2.3
      - prompt: Use p=w×x and L=(p−t)² with w=3, x=1, t=1. Record p, local rate dL/dp, local rate dp/dw, and total dL/dw.
        answers:
          p: 3
          outer: 4
          inner: 1
          total: 4
        reason_answer: a
        reason_options:
          - id: c
            text: Use the loss value as the total rate.
          - id: a
            text: Multiply the two local rates evaluated at this example.
          - id: b
            text: Add the two local rates to combine the stages.
        feedback: Prediction is w×x; the outer rate is 2(p−t), the inner rate is x, and the total is their product.
        id: chain-rule.base.v2.4
    numeric_fields:
      - id: p
        label: Prediction p
      - id: outer
        label: Local loss rate dL/dp
      - id: inner
        label: Local prediction rate dp/dw
      - id: total
        label: Total loss rate dL/dw
    absolute_tolerance: 1e-6
  - id: chain-rule.transfer.v2
    objective_ref: objective.chain-rule
    task: transfer
    response_type: numeric_fields_with_reason
    points: 1
    hint: The full derivative is 2(w × x − t) × x; keep its sign. The next weight is w − 0.1 × that derivative, so a negative derivative raises w.
    remediation_scene: chain-rule.s5
    variants:
      - prompt: For L=(w×x−t)², use w=0, x=2, t=3, and step size 0.1. Record the full derivative and next weight.
        answers:
          gradient: -12
          next: 1.2
        reason_answer: a
        reason_options:
          - id: c
            text: Subtract 0.1 times the residual without its chain factors.
          - id: a
            text: Subtract 0.1 times the full derivative from w.
          - id: b
            text: Add 0.1 times the full derivative to w.
        feedback: The derivative is 2(w×x−t)×x. Retain its sign when applying the update.
        id: chain-rule.transfer.v2.1
      - prompt: For L=(w×x−t)², use w=2, x=1, t=5, and step size 0.1. Record the full derivative and next weight.
        answers:
