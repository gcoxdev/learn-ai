assessment_families:
- id: chain-rule.base
  objective_ref: objective.chain-rule
  task: base
  response_type: single_choice
  points: 1
  hint: For composed functions, multiply local derivatives along each path; when several paths contribute,
    add their contributions.
  variants:
  - id: chain-rule.base.1
    prompt: For u=3w and L=u² at w=2, what is dL/dw?
    options:
    - id: a
      text: '12'
    - id: b
      text: '3'
    - id: correct
      text: '36'
    answer: correct
    feedback: At w=2, u=6; multiply the local derivatives 2u=12 and 3 to get 36.
  - id: chain-rule.base.2
    prompt: For a simple composition, what does the chain rule combine?
    options:
    - id: b
      text: The names of the functions without their derivatives.
    - id: correct
      text: The local derivatives of the connected functions.
    - id: a
      text: Only the final output values.
    answer: correct
    feedback: The local derivatives of the connected functions.
- id: chain-rule.transfer
  objective_ref: objective.chain-rule
  task: transfer
  response_type: single_choice
  points: 1
  hint: For composed functions, multiply local derivatives along each path; when several paths contribute,
    add their contributions.
  variants:
  - id: chain-rule.transfer.1
    prompt: For L=(wx−y)², which factor comes from differentiating wx−y with respect to w?
    options:
    - id: b
      text: The entire squared loss.
    - id: correct
      text: x, when x and y are held fixed.
    - id: a
      text: y in every case.
    answer: correct
    feedback: Holding x and y fixed, differentiating wx−y with respect to w leaves x.
  - id: chain-rule.transfer.2
    prompt: An input influences a result through two paths. How are those derivative contributions combined?
    options:
    - id: correct
      text: Add the contributions from the paths.
    - id: a
      text: Ignore one path arbitrarily.
    - id: b
      text: Always subtract the longer path.
    answer: correct
    feedback: Add the contributions from the paths.
