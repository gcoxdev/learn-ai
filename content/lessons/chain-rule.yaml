schema_version: 0.2-draft
lesson:
  id: chain-rule
  version: 0.4.0-draft
  title: The chain rule, one step at a time
  state: draft
  summary: Backpropagation is one calculus rule used billions of times. Follow a nudge through a chain of calculations, multiply the local rates, and check the answer with a real step.
  slot: B14
  category: bridge
  sources:
    - title: Dive into Deep Learning — calculus
      url: https://d2l.ai/chapter_preliminaries/calculus.html
    - title: Rumelhart, Hinton, and Williams — back-propagating errors (1986)
      url: https://www.nature.com/articles/323533a0
  archetype: foundation
objectives:
  - id: objective.chain-rule
    version: 2-draft
    statement: Trace a composed loss and multiply its local derivatives to calculate a weight update with the correct sign.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - chain-rule.base.v2
      - chain-rule.transfer.v2
    prerequisites:
      - anyOf:
          - objective.derivatives
scenes:
  - id: chain-rule.s1
    type: explanation
    depth: intuition
    objective_refs:
      - objective.chain-rule
    title: One calculation feeds another
    markdown: |-
      Backpropagation, the algorithm that trains neural networks, is one calculus rule applied over and over. In a network each layer feeds the next, so the rule answers this: when one calculation feeds another, how does a nudge at the start travel to the end?

      Take a tiny machine that triples a number, then squares the result: u = 3x, then y = u². Feeding one rule's output into another is called **composition**. At x = 2, the middle value is u = 6 and the output is y = 36.

      Knowing y is 36 is one thing. Knowing how fast y changes when x changes is another, and that's the question training asks about every weight.
    bridges:
      - functions
      - derivatives
  - id: chain-rule.s2
    type: explanation
    depth: intuition
    objective_refs:
      - objective.chain-rule
    title: Multiply the rates along the chain
    markdown: |-
      Follow a small nudge through the machine, one stage at a time:

      | Stage | Local rate | At x = 2 |
      | --- | --- | ---: |
      | x → u = 3x | du/dx = 3 | 3 |
      | u → y = u² | dy/du = 2u | 2 × 6 = 12 |

      Each unit of x makes 3 units of u, and each unit of u makes 12 units of y. So each unit of x makes 3 × 12 = 36 units of y. That's the **chain rule**:

      $$\frac{dy}{dx} = \frac{dy}{du} \times \frac{du}{dx}$$

      It reads like fractions cancelling, which is a handy memory aid. One detail matters: evaluate each local rate at the value that stage actually sees. The square's rate is 2u at u = 6, giving 12, not 2 × 2 = 4 at x = 2.

      :::mixup "Add the stage rates: 3 + 12 = 15."
      The square doesn't act on x. It acts on the *change the first stage produced*, which is already 3 times bigger. Scaling a change by 3 and then by 12 scales it by 36. Rates multiply along a chain.
      :::
    bridges: []
  - id: chain-rule.s3
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.chain-rule
    title: Check it with a real nudge
    markdown: |-
      Test the 36 with a real step. Move x from 2 to 2.01:

      - u becomes 3 × 2.01 = 6.03
      - y becomes 6.03² = 36.3609
      - y rose by 0.3609

      The chain rule predicted 36 × 0.01 = 0.36. The adding mistake would have predicted 15 × 0.01 = 0.15, nowhere close. The small leftover, 0.0009, comes from the square's curve bending across the step; it shrinks rapidly as the step gets smaller.
    bridges: []
  - id: chain-rule.s4
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.chain-rule
    title: Place a prediction inside a loss
    markdown: |-
      Now the real use. A one-weight model predicts p = w × x, and its loss is the squared error L = (p − t)², where x is the input and t the target. Write it as three stages: p = w × x, then the residual r = p − t, then L = r².

      With x = 2, w = 1, and t = 6, go forward and then backward:

      | Forward | Value | Backward: local rate | Value |
      | --- | ---: | --- | ---: |
      | p = w × x | 2 | dp/dw = x | 2 |
      | r = p − t | −4 | dr/dp = 1 | 1 |
      | L = r² | 16 | dL/dr = 2r | −8 |

      Multiply the local rates: dL/dw = −8 × 1 × 2 = **−16**. The negative sign says raising w lowers the loss.

      In the lab, reveal the three factors one at a time and watch the running product go −8, −8, −16. Then drag the weight to 3: the prediction hits 6, the residual is 0, and the running product stays 0, because the loss is already at its bottom.
    bridges: []
    figure:
      kind: chain-rule
      caption: 'Follow a second worked fixture: input 2, target 6, prediction=2×weight, and squared error.'
      description: Trace weight→prediction→squared error. Multiply the loss-to-prediction derivative by the prediction-to-weight derivative to obtain the total sensitivity to the weight. The diagram uses fixed input 2 and target 6.
  - id: chain-rule.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.chain-rule
    markdown: New inputs, weights, and targets for the one-weight model ask you to find each local rate, multiply them, and take a correctly signed step.
    takeaway: |-
      Multiply local rates along a chain, each evaluated at the value that stage sees. When a weight reaches the loss by several routes, add the routes.
  - id: chain-rule.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.chain-rule
    markdown: |-
      For composed functions, multiply local derivatives along each path; when several paths contribute, add their contributions.
  - id: chain-rule.s5
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.chain-rule
    title: Drop a factor and the step goes wrong
    markdown: |-
      Gradient descent with learning rate 0.1 uses the full −16:

      w_new = 1 − 0.1 × (−16) = 2.6, so p = 5.2 and the loss falls from 16 to (5.2 − 6)² = 0.64.

      :::predict Someone forgets the last factor, dp/dw = x = 2, and uses −8. What goes wrong?
      Their step is 1 − 0.1 × (−8) = 1.8: right direction, half the size, and the loss only falls to (3.6 − 6)² = 5.76. With other inputs the missing factor could even flip the sign, since x can be negative.
      :::

      A nudge check catches a dropped factor. Run this, then delete the `* x` at the end of the `chain` line:

      ```python run
      x, t = 2.0, 6.0

      def loss(w):
          return (w * x - t) ** 2

      w = 1.0
      p = w * x
      chain = 2 * (p - t) * 1 * x          # dL/dr × dr/dp × dp/dw
      h = 1e-4
      nudged = (loss(w + h) - loss(w - h)) / (2 * h)
      print("chain rule:", chain, "  nudge check:", round(nudged, 6))

      w_new = w - 0.1 * chain
      print("new weight:", w_new, "  loss:", loss(w), "->", round(loss(w_new), 4))
      ```

      With the factor, both methods say −16. Without it, the chain says −8 while the nudge still says −16.
    bridges: []
  - id: chain-rule.s6
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.chain-rule
    title: Two routes to the loss? Add them
    markdown: |-
      Sometimes one weight reaches the loss by two routes. Take L = (w − 1)² + (w − 3)², two error terms sharing one weight. Multiply along each route, then **add** the routes:

      $$\frac{dL}{dw} = 2(w - 1) + 2(w - 3)$$

      At w = 2 the routes give +2 and −2, which cancel to 0: w = 2 sits exactly between the two targets. At w = 0 they give −2 and −6, a total of −8.

      A diagram of every intermediate value and the operations joining them is a **computational graph**. **Backpropagation** walks such a graph from the loss back to the weights, multiplying along routes and adding where routes meet, and reuses each intermediate result, so finding every slope costs only a few times as much as one forward pass. The lessons on backpropagation and automatic differentiation build this up from exactly these two rules.
    bridges: []
