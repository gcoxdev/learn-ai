schema_version: 0.2-draft
lesson:
  id: chain-rule
  version: 0.1.0-draft
  title: The chain rule, one step at a time
  state: draft
  summary: For composed functions, multiply local derivatives along each path; when several paths contribute,
    add their contributions.
  slot: B14
  category: bridge
  minutes: 8
  sources:
  - title: 'Artificial Intelligence: A Modern Approach — topic overview'
    url: https://aima.cs.berkeley.edu/contents.html
objectives:
- id: objective.chain-rule
  version: 1-draft
  statement: For composed functions, multiply local derivatives along each path; when several paths contribute,
    add their contributions.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - chain-rule.base
  - chain-rule.transfer
  prerequisites:
  - anyOf:
