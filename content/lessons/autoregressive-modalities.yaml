schema_version: 0.2-draft
lesson:
  id: autoregressive-modalities
  version: 0.1.0-draft
  title: Generate different kinds of data one unit at a time
  state: draft
  summary: Autoregressive generation factors a joint distribution into conditional predictions; representation and
    ordering determine whether the generated units are text, pixels, audio codes, or structured fields.
  slot: M22.2
  category: learning
  sources:
  - title: Pixel Recurrent Neural Networks
    url: https://arxiv.org/abs/1601.06759
  - title: WaveNet
    url: https://arxiv.org/abs/1609.03499
objectives:
- id: objective.autoregressive-modalities
  version: 1-draft
  statement: Autoregressive generation factors a joint distribution into conditional predictions; representation
    and ordering determine whether the generated units are text, pixels, audio codes, or structured fields.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - autoregressive-modalities.base
  - autoregressive-modalities.transfer
  prerequisites:
  - anyOf:
    - objective.generative-models
  - anyOf:
    - objective.next-token
scenes:
- id: autoregressive-modalities.s1
  title: Use the probability chain rule
  type: explanation
  depth: intuition
  objective_refs:
  - objective.autoregressive-modalities
  markdown: 'A joint distribution over units can be written as a product of each unit’s probability given earlier
    units. The model learns those conditional predictions. The units need not be words: they can be quantized image
    patches, audio codec IDs, or fields in a structured record.'
  text_mode: 'A joint distribution over units can be written as a product of each unit’s probability given earlier
    units. The model learns those conditional predictions. The units need not be words: they can be quantized image
    patches, audio codec IDs, or fields in a structured record.'
  bridges: []
- id: autoregressive-modalities.s2
  title: Choose an order and representation
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.autoregressive-modalities
  markdown: A tiny image might generate pixels row by row, while another model generates learned image codes. An
    audio system can organize codebooks and time steps through a chosen ordering. That order defines which information
    is available for each prediction and how many sequential decisions generation requires.
  text_mode: A tiny image might generate pixels row by row, while another model generates learned image codes. An
    audio system can organize codebooks and time steps through a chosen ordering. That order defines which information
    is available for each prediction and how many sequential decisions generation requires.
  bridges: []
- id: autoregressive-modalities.s3
  title: Condition on other information
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.autoregressive-modalities
  markdown: A caption can condition image-token predictions; text can condition speech-code predictions. The conditioning
    representation may enter through a prefix or cross-attention. Generating three codes from a caption still requires
    a decoder or codec to turn those codes into the final image or waveform.
  text_mode: A caption can condition image-token predictions; text can condition speech-code predictions. The conditioning
    representation may enter through a prefix or cross-attention. Generating three codes from a caption still requires
    a decoder or codec to turn those codes into the final image or waveform.
  bridges: []
- id: autoregressive-modalities.s4
  title: Evaluate coherence and cost
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.autoregressive-modalities
  markdown: Local prediction accuracy does not guarantee global structure, long-term consistency, or valid field
    relationships. Sampling errors can affect later decisions. Compare likelihood where meaningful, task quality,
    diversity, and sequential latency; autoregressive is a factorization and execution family, not one modality
    or quality level.
  text_mode: Local prediction accuracy does not guarantee global structure, long-term consistency, or valid field
    relationships. Sampling errors can affect later decisions. Compare likelihood where meaningful, task quality,
    diversity, and sequential latency; autoregressive is a factorization and execution family, not one modality
    or quality level.
  bridges: []
- id: autoregressive-modalities.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.autoregressive-modalities
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Autoregressive generation factors a joint distribution into conditional predictions; representation
    and ordering determine whether the generated units are text, pixels, audio codes, or structured fields.
