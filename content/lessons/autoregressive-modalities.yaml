assessment_families:
  - id: autoregressive-modalities.base
    objective_ref: objective.autoregressive-modalities
    task: base
    response_type: single_choice
    points: 1
    hint: 'Choose an order and representation: trace the inputs, operation, and result before choosing.'
    remediation_scene: autoregressive-modalities.s2
    variants:
      - id: autoregressive-modalities.base.1
        prompt: Must autoregressive units be text tokens?
        options:
          - id: b
            text: 'Yes'
          - id: c
            text: Only for every neural model
          - id: a
            text: 'No'
        answer: a
        feedback: The factorization can apply to many representations.
        retired: true
      - id: autoregressive-modalities.base.2
        prompt: What does generation order determine?
        options:
          - id: c
            text: Only output file extension
          - id: a
            text: Which earlier units condition each prediction
          - id: b
            text: The dataset’s ownership automatically
        answer: a
        feedback: Ordering defines the conditional information boundary.
        retired: true
  - id: autoregressive-modalities.transfer
    objective_ref: objective.autoregressive-modalities
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Evaluate coherence and cost: trace the inputs, operation, and result before choosing.'
    remediation_scene: autoregressive-modalities.s4
    variants:
      - id: autoregressive-modalities.transfer.1
        prompt: A model generates audio codec IDs. What produces the waveform?
        options:
          - id: c
            text: The optimizer’s moment arrays
          - id: a
            text: The compatible codec decoder
          - id: b
            text: The text tokenizer alone
        answer: a
        feedback: Codes need their defined reconstruction interface.
        retired: true
      - id: autoregressive-modalities.transfer.2
        prompt: Does good local prediction guarantee valid global structure?
        options:
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
          - id: c
            text: Only if every unit is discrete
        answer: a
        feedback: Global constraints can fail despite plausible local decisions.
        retired: true
  - id: autoregressive-modalities.base.v2
    objective_ref: objective.autoregressive-modalities
    task: base
    response_type: single_choice
    points: 1
    hint: Each factor conditions on everything generated earlier. Training can compute all factors at once from real data; sampling must go one unit at a time.
    remediation_scene: autoregressive-modalities.s5
    variants:
      - id: autoregressive-modalities.base.v2.1
        prompt: A PixelCNN trains quickly but takes minutes to sample one image. What explains the gap?
        options:
          - id: b
            text: Sampling uses a bigger network than training does
          - id: c
            text: Training skips the color channels and sampling includes them
          - id: a
            text: Training sees every real pixel at once; sampling waits for each pick
        answer: a
        feedback: With a real image, all the conditionals can be computed in one masked pass. When sampling, each pixel depends on pixels not yet drawn, so the steps must run in order. The network is the same in both cases.
      - id: autoregressive-modalities.base.v2.2
        prompt: 'A student computes p(a, b, c) as p(a) × p(b) × p(c) for an autoregressive model. What did they leave out?'
        options:
          - id: c
            text: The final normalization that divides by the number of units
          - id: a
            text: Conditioning each factor on the units that came before it
          - id: b
            text: A sum over every possible ordering of the three units
        answer: a
        feedback: The chain rule is p(a) × p(b | a) × p(c | a, b). Dropping the conditioning assumes independence, which the chain rule never does. One fixed ordering suffices, and the product needs no extra normalization.
      - id: autoregressive-modalities.base.v2.3
        prompt: Why did DALL·E (2021) predict a 32 × 32 grid of image tokens rather than raw pixel values?
        options:
          - id: a
            text: It cuts the sequence from 196,608 values to 1,024 steps
          - id: b
            text: Transformers can read pixel values but can't produce them
          - id: c
            text: Image tokens make each prediction independent of the others
        answer: a
        feedback: Each token stands for a whole patch, so the sequence is 192 times shorter. Transformers can predict pixel values (as 256-way choices), and the tokens are still predicted one given another.
      - id: autoregressive-modalities.base.v2.4
        prompt: In a text-to-image token model, how does the caption influence the image tokens?
        options:
          - id: b
            text: It is appended after the image tokens as a final check
          - id: a
            text: It comes first as a prefix, so every image token is conditioned on it
          - id: c
            text: It replaces the codebook, choosing which patches exist
        answer: a
        feedback: The caption tokens sit at the start of the sequence, so each image token's prediction sees them. Putting them after the image would mean no image token could use them. The codebook is fixed after training.
      - id: autoregressive-modalities.base.v2.5
        prompt: An autoregressive model has 92% per-token accuracy on held-out images, yet its samples often show a face with three eyes. What best explains this?
        options:
          - id: a
            text: While sampling, early odd choices become context for later ones
          - id: c
            text: The accuracy was measured with the wrong codebook
          - id: b
            text: Autoregressive models can only capture local texture
        answer: a
        feedback: Held-out accuracy is measured with real earlier tokens as context. When sampling, the model conditions on its own picks, and a strange early choice spreads. The chain rule can express global structure; the model just has to learn and follow it.
  - id: autoregressive-modalities.transfer.v2
    objective_ref: objective.autoregressive-modalities
    task: transfer
    response_type: single_choice
    points: 1
    hint: Pick the units and the order first, then ask what each prediction is conditioned on and how many sequential steps sampling needs.
    remediation_scene: autoregressive-modalities.s3
    variants:
      - id: autoregressive-modalities.transfer.v2.1
        prompt: A team wants a model that composes piano music as a sequence of note events. How should they apply the autoregressive idea?
        options:
          - id: c
            text: Predict all note events at once, then sort them by time
          - id: a
            text: Predict each note event given all the earlier events in time order
          - id: b
            text: Predict each note event from the note immediately before it only
        answer: a
        feedback: Conditioning on everything earlier is the chain rule. Predicting all at once loses the dependence between notes, and using only the previous note throws away the melody's longer structure.
      - id: autoregressive-modalities.transfer.v2.2
        prompt: 'A model fills in database rows field by field: country, then city, then postcode. Why is this order better than postcode first?'
        options:
          - id: a
            text: Each later field is easier to predict given the broader fields before it
          - id: b
            text: The chain rule is only valid when broad fields are predicted first
          - id: c
            text: Postcodes are numbers, and numbers must come at the end
        answer: a
        feedback: Any order gives a valid factorization, so the chain rule doesn't require broad fields first. Country first means the model picks a city from within one country and a postcode from within one city; postcode first means guessing a precise code with no context at all.
      - id: autoregressive-modalities.transfer.v2.3
        prompt: A video model uses 256 tokens per frame at 24 frames per second. How many sequential token steps does a 5-second clip take?
        options:
          - id: c
            text: 1,280, from 256 tokens for each second
          - id: b
            text: 120, from one step for each frame
          - id: a
            text: 30,720, from one step per token
        answer: a
        feedback: 256 tokens per frame × 24 frames per second × 5 seconds = 30,720 tokens, each one step. Counting frames or seconds instead of tokens underestimates the wait.
      - id: autoregressive-modalities.transfer.v2.4
        prompt: A speech system generates codec tokens, and some words sound muffled. The token model's predictions score well. Where should you look next?
        options:
          - id: b
            text: At the text tokenizer, since it chose the codebook entries
          - id: a
            text: At the codec, since its codebook may not capture that detail
          - id: c
            text: At the word order, since the chain rule failed on those words
        answer: a
        feedback: If the tokens are right but the sound isn't, the loss is in compression; the decoder can only draw what the codebook can represent. The tokenizer handles text, and the chain rule doesn't fail.
  - id: autoregressive-modalities.calculate
    objective_ref: objective.autoregressive-modalities
    task: base
    response_type: numeric
    points: 1
    hint: Multiply the first unit's probability by each later unit's probability given all the units before it.
    remediation_scene: autoregressive-modalities.s1
    absolute_tolerance: 0.0005
    variants:
      - id: autoregressive-modalities.calculate.1
        prompt: 'A model gives p(top = green) = 0.3, p(middle = green | green) = 0.5, and p(bottom = blue | green, green) = 0.3. What is p(green, green, blue)?'
        answer: 0.045
        feedback: 0.3 × 0.5 × 0.3 = 0.045. Each factor is conditioned on the pixels already painted.
      - id: autoregressive-modalities.calculate.2
        prompt: 'A melody model gives p(C) = 0.4, p(E | C) = 0.5, and p(G | C, E) = 0.6. What is the probability of the melody C, E, G?'
        answer: 0.12
        feedback: 0.4 × 0.5 × 0.6 = 0.12. Adding the factors (1.5) or using only the last one (0.6) are the common slips.
      - id: autoregressive-modalities.calculate.3
        prompt: 'An image-token model gives the first token probability 0.2, the second (given the first) 0.25, and the third (given both) 0.8. What is the probability of the three-token sequence?'
        answer: 0.04
        feedback: 0.2 × 0.25 × 0.8 = 0.04.
      - id: autoregressive-modalities.calculate.4
        prompt: 'A three-token sequence has probability 0.18, and the first two factors are 0.5 and 0.4. What must the third factor be?'
        answer: 0.9
        feedback: 0.18 / (0.5 × 0.4) = 0.18 / 0.2 = 0.9. The chain rule works backward too.
      - id: autoregressive-modalities.calculate.5
        prompt: 'A record model gives p(country = France) = 0.1, p(city = Lyon | France) = 0.05, and p(postcode = 69001 | France, Lyon) = 0.2. What is the probability of the whole record?'
        answer: 0.001
        feedback: 0.1 × 0.05 × 0.2 = 0.001. Long records get small probabilities quickly, which is why models work with sums of logs.
