schema_version: 0.2-draft
lesson:
  id: autoregressive-modalities
  version: 0.4.0-draft
  title: Generate different kinds of data one unit at a time
  state: draft
  summary: A language model writes one word at a time. The same trick can paint a picture one pixel at a time, or one image token at a time. Here's the rule that makes it exact.
  slot: M22.2
  category: learning
  sources:
    - title: Pixel Recurrent Neural Networks (van den Oord, Kalchbrenner & Kavukcuoglu, 2016)
      url: https://arxiv.org/abs/1601.06759
    - title: Conditional Image Generation with PixelCNN Decoders (van den Oord et al., 2016)
      url: https://arxiv.org/abs/1606.05328
    - title: "WaveNet: A Generative Model for Raw Audio (van den Oord et al., 2016)"
      url: https://arxiv.org/abs/1609.03499
    - title: Neural Discrete Representation Learning (VQ-VAE; van den Oord, Vinyals & Kavukcuoglu, 2017)
      url: https://arxiv.org/abs/1711.00937
    - title: Zero-Shot Text-to-Image Generation (DALL·E; Ramesh et al., 2021)
      url: https://arxiv.org/abs/2102.12092
objectives:
  - id: objective.autoregressive-modalities
    version: 2-draft
    statement: Autoregressive generation factors a joint distribution into conditional predictions; representation and ordering determine whether the generated units are text, pixels, audio codes, or structured fields.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - autoregressive-modalities.base.v2
      - autoregressive-modalities.transfer.v2
      - autoregressive-modalities.calculate
    prerequisites:
      - anyOf:
          - objective.generative-models
      - anyOf:
          - objective.next-token
scenes:
  - id: autoregressive-modalities.s1
    title: Three pixels, three predictions
    type: explanation
    depth: intuition
    objective_refs:
      - objective.autoregressive-modalities
    markdown: |-
      Paint a tiny strip of three pixels, top to bottom, each blue, yellow, or green. How likely is the strip blue, yellow, green? You don't need a table of all 27 strips. Predict one pixel at a time, each given the ones already painted:

      | Step | Prediction | Probability |
      | --- | --- | ---: |
      | 1 | top is blue | 0.5 |
      | 2 | middle is yellow, given blue above | 0.4 |
      | 3 | bottom is green, given blue then yellow | 0.9 |

      Multiply: $0.5 \times 0.4 \times 0.9 = 0.18$. This is the **chain rule of probability**: any joint probability equals the first piece's probability times each later piece's probability given everything before it. It's exact, with no assumption about how the pieces relate. A model built this way is **autoregressive**: it predicts each unit from its own earlier outputs, just like the next-token language model in module 14, which multiplies next-word probabilities.

      :::papers The autoregressive factorization
      $$p(x) = \prod_{i=1}^{n} p(x_i \mid x_{<i}) \qquad\text{so}\qquad \log p(x) = \sum_{i=1}^{n} \log p(x_i \mid x_{<i})$$

      Here $n = 3$, $x_{<3}$ means "blue, yellow", and the three factors are 0.5, 0.4, and 0.9. Training maximizes the sum of logs: $\ln 0.18 \approx -1.715$. Because this probability is exact, autoregressive models are often compared by their likelihood on held-out data, reported for images in **bits per dimension**: the average $-\log_2$ probability of each color value.
      :::

      :::predict The model gives "middle blue, given blue above" 0.4, and "bottom green, given blue then blue" 0.5. What is p(blue, blue, green)?
      $0.5 \times 0.4 \times 0.5 = 0.10$. It's a less likely strip than blue, yellow, green (0.18), because green is much more certain under a yellow pixel.
      :::
    bridges: []
  - id: autoregressive-modalities.s5
    title: Run the chain rule and sample
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.autoregressive-modalities
    markdown: |-
      Here is the full three-pixel model. It scores a strip with the chain rule, checks that all 27 strips add to 1, and samples four new strips, one pixel at a time.

      ```python run
      import itertools
      import numpy as np

      colors = ["blue", "yellow", "green"]

      def p1():               # top pixel
          return {"blue": 0.5, "yellow": 0.2, "green": 0.3}
      def p2(x1):             # middle pixel, given the top one
          if x1 == "blue":
              return {"blue": 0.4, "yellow": 0.4, "green": 0.2}
          return {"blue": 0.2, "yellow": 0.3, "green": 0.5}
      def p3(x1, x2):         # bottom pixel, given both above
          if x2 == "yellow":
              return {"blue": 0.05, "yellow": 0.05, "green": 0.9}
          return {"blue": 0.3, "yellow": 0.2, "green": 0.5}

      def prob(x1, x2, x3):   # the chain rule: multiply the three conditionals
          return p1()[x1] * p2(x1)[x2] * p3(x1, x2)[x3]

      print("p(blue, yellow, green) =", round(prob("blue", "yellow", "green"), 4))
      total = sum(prob(*s) for s in itertools.product(colors, repeat=3))
      print("sum over all 27 strips =", round(total, 6))

      rng = np.random.default_rng(3)
      def pick(dist):
          return rng.choice(list(dist), p=list(dist.values()))
      for _ in range(4):      # sample: top, then middle, then bottom
          x1 = pick(p1()); x2 = pick(p2(x1)); x3 = pick(p3(x1, x2))
          print("sample:", x1, x2, x3, " p =", round(prob(x1, x2, x3), 4))
      ```

      The sum is exactly 1, so the three small tables define a proper distribution over every strip. Notice the two jobs. **Scoring** a known strip is three lookups that could all run at once. **Sampling** a new strip must go in order, because the middle pixel's table depends on the top pixel you just drew. Try changing the 0.9 to 0.5 and watch green bottoms get rarer.

      :::mixup "The chain rule treats each pixel as independent of the others."
      Independence would be $p(x_1)\,p(x_2)\,p(x_3)$, with no conditioning. The chain rule conditions every factor on everything earlier, so it can capture any dependence. What limits a real model is how well its network learns those conditionals.
      :::
    bridges: []
  - id: autoregressive-modalities.s2
    title: "PixelCNN: an image one value at a time"
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.autoregressive-modalities
    markdown: |-
      In 2016, van den Oord and colleagues at DeepMind applied the chain rule to whole photos with **PixelRNN** and **PixelCNN**. They read an image in **raster order**, row by row, left to right, like text on a page. Each pixel's red value is predicted from all earlier pixels; then green given red; then blue given red and green. Each prediction is a 256-way choice, one for each possible brightness level, exactly like choosing the next word from a vocabulary.

      PixelCNN uses **masked convolutions**: filters with the weights for "future" positions zeroed out, so each output sees only pixels above and to the left. That makes training fast, since every pixel's prediction comes out of one pass over a real image. Sampling is another story. A 256 × 256 color image has $256 \times 256 \times 3 = 196{,}608$ values, so drawing one takes 196,608 network steps in a row. WaveNet, from the speech generation lesson, hit the same wall with 16,000 audio samples per second.
    bridges: []
  - id: autoregressive-modalities.s3
    title: Tokens make the sequence shorter
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.autoregressive-modalities
    markdown: |-
      The fix is to predict fewer, bigger units. First train an autoencoder that turns each patch of an image into one entry from a learned list of vectors, called a **codebook**. Each patch becomes a single integer, its codebook index: an **image token**. **VQ-VAE** (van den Oord, Vinyals & Kavukcuoglu, 2017) introduced this kind of discrete code, and its decoder turns a grid of indices back into pixels.

      OpenAI's **DALL·E** (Ramesh et al., 2021) took this token route to text-to-image. A discrete VAE compressed each 256 × 256 image into a 32 × 32 grid of tokens, each one of 8,192 codebook entries. A 12-billion-parameter transformer read up to 256 text tokens of caption, then predicted the 1,024 image tokens one at a time. That's $196{,}608 / 1{,}024 = 192$ times fewer steps than PixelCNN at the same resolution.

      Audio works the same way. As in the speech generation lesson, EnCodec's 24 kHz model at 6 kbps makes 75 frames per second with 8 codebook tokens each: 600 tokens per second instead of 24,000 samples.

      The caption is the **condition**: it goes first as a prefix, so every image token is predicted given the words. The trade is detail: whatever the codebook can't represent, the decoder can't draw.
    diagram:
      caption: The token route to text-to-image, as in DALL·E (2021).
      description: The caption is split into text tokens, which go first into an autoregressive transformer. The transformer predicts image tokens one at a time, each fed back as context for the next. The finished 32 by 32 grid of image tokens goes to the codebook decoder, which turns it into a 256 by 256 image. During training, an encoder turned real images into the image tokens the transformer learned to predict.
      nodes:
        - id: caption
          label: Caption
          note: '"a cat in a hat"'
          col: 0
          row: 0
        - id: text
          label: Text tokens
          note: up to 256
          col: 1
          row: 0
          tone: data
        - id: model
          label: Autoregressive transformer
          col: 2
          row: 0
          tone: accent
        - id: tokens
          label: Image tokens
          note: 32 × 32 grid, 8,192 codes
          col: 3
          row: 0
          tone: data
        - id: decoder
          label: Codebook decoder
          col: 3
          row: 1
        - id: image
          label: 256 × 256 image
          col: 2
          row: 1
        - id: encoder
          label: Encoder (training only)
          note: real image → tokens
          col: 4
          row: 0
          tone: muted
      edges:
        - from: caption
          to: text
        - from: text
          to: model
          label: prefix
        - from: model
          to: tokens
          label: one token per step
        - from: tokens
          to: model
          label: fed back
          dashed: true
          bend: 1
        - from: tokens
          to: decoder
        - from: decoder
          to: image
        - from: encoder
          to: tokens
          dashed: true
    bridges: []
  - id: autoregressive-modalities.s4
    title: Early mistakes become context
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.autoregressive-modalities
    markdown: |-
      During training, every prediction is conditioned on real data. During sampling, it's conditioned on the model's own earlier picks. If an early image token draws half a dog's head at the wrong scale, every later token has to make that head fit, and a strange first choice can spread down the picture. This gap between training on real context and sampling from your own is called **exposure bias**. Ordering matters for the same reason: whatever comes first is decided with the least context.

      Practitioners use this in two ways. To judge an image model, look at whole samples, not just its per-token accuracy, which can be high while the picture falls apart. To choose a design, count sequential steps: tokens per second of audio, or tokens per image, times the time per step, tells you how long a user waits.
    bridges: []
  - id: autoregressive-modalities.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.autoregressive-modalities
    markdown: Chain-rule products to compute, plus a music generator, a spreadsheet filler, and a slow video model, test whether you can apply one-unit-at-a-time generation to new kinds of data.
    takeaway: |-
      Any joint distribution is a product of next-piece predictions. Choosing the pieces (pixels, image tokens, audio codes) and their order decides how long generation takes and what the model can capture.
  - id: autoregressive-modalities.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.autoregressive-modalities
    markdown: |-
      Autoregressive generation predicts one unit from earlier units. The units and their order determine how that idea produces text, images, audio, or structured records.
