schema_version: 0.2-draft
lesson:
  id: citations-and-evidence-fidelity
  version: 0.1.0-draft
  title: Check whether a source supports the claim beside it
  state: draft
  summary: Grounded answer evaluation separates correctness, citation support, citation coverage, and source quality;
    a real link can still be irrelevant, misread, or insufficient.
  slot: M26.6
  category: learning
  minutes: 12
  sources:
  - title: Enabling Large Language Models to Generate Text with Citations
    url: https://arxiv.org/abs/2305.14627
  - title: Retrieval-Augmented Generation
    url: https://arxiv.org/abs/2005.11401
objectives:
- id: objective.citations-and-evidence-fidelity
  version: 1-draft
  statement: Grounded answer evaluation separates correctness, citation support, citation coverage, and source quality;
    a real link can still be irrelevant, misread, or insufficient.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - citations-and-evidence-fidelity.base
  - citations-and-evidence-fidelity.transfer
  prerequisites:
  - anyOf:
    - objective.rag-evidence-pipeline
  - anyOf:
    - objective.reasoning-and-explanations
scenes:
- id: citations-and-evidence-fidelity.s1
  title: A citation is a claim about support
  type: explanation
  depth: intuition
  objective_refs:
  - objective.citations-and-evidence-fidelity
  markdown: Attaching a source asserts that it provides evidence for the associated statement. A valid URL or retrieved
    document ID only identifies a source. The passage must actually support the claim at the stated scope, including
    dates, quantities, exceptions, and uncertainty.
  text_mode: Attaching a source asserts that it provides evidence for the associated statement. A valid URL or retrieved
    document ID only identifies a source. The passage must actually support the claim at the stated scope, including
    dates, quantities, exceptions, and uncertainty.
  bridges: []
- id: citations-and-evidence-fidelity.s2
  title: Distinguish support from coverage
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.citations-and-evidence-fidelity
  markdown: Citation support asks whether cited evidence justifies a claim. Coverage asks whether claims needing
    evidence have it. An answer can cite one sentence correctly while leaving several invented details unsupported.
    Conversely, many citations can all point to irrelevant passages.
  text_mode: Citation support asks whether cited evidence justifies a claim. Coverage asks whether claims needing
    evidence have it. An answer can cite one sentence correctly while leaving several invented details unsupported.
    Conversely, many citations can all point to irrelevant passages.
  bridges: []
- id: citations-and-evidence-fidelity.s3
  title: Trace a qualification
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.citations-and-evidence-fidelity
  markdown: A source says a method improved performance on one dataset under one budget. An answer claiming it always
    outperforms every alternative overstates the evidence. Preserve experimental conditions and distinguish source-reported
    findings from your own inference or comparison.
  text_mode: A source says a method improved performance on one dataset under one budget. An answer claiming it
    always outperforms every alternative overstates the evidence. Preserve experimental conditions and distinguish
    source-reported findings from your own inference or comparison.
  bridges: []
- id: citations-and-evidence-fidelity.s4
  title: Score abstention and usefulness together
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.citations-and-evidence-fidelity
  markdown: When evidence is missing or contradictory, a qualified answer or abstention may be appropriate. Measure
    answerability, correctness, support, and unnecessary refusal under the task rubric. Independent checks are needed
    because the generator and a model judge may share the same blind spots.
  text_mode: When evidence is missing or contradictory, a qualified answer or abstention may be appropriate. Measure
    answerability, correctness, support, and unnecessary refusal under the task rubric. Independent checks are needed
    because the generator and a model judge may share the same blind spots.
  bridges: []
- id: citations-and-evidence-fidelity.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.citations-and-evidence-fidelity
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Grounded answer evaluation separates correctness, citation support, citation coverage, and source quality;
    a real link can still be irrelevant, misread, or insufficient.
- id: citations-and-evidence-fidelity.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.citations-and-evidence-fidelity
  markdown: Grounded answer evaluation separates correctness, citation support, citation coverage, and source quality;
    a real link can still be irrelevant, misread, or insufficient.
  text_mode: Grounded answer evaluation separates correctness, citation support, citation coverage, and source quality;
    a real link can still be irrelevant, misread, or insufficient.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - citations-and-evidence-fidelity.s1
    - citations-and-evidence-fidelity.s2
    - citations-and-evidence-fidelity.s3
    - citations-and-evidence-fidelity.s4
    - citations-and-evidence-fidelity.check
    gate_refs:
    - gate.core
  scene_aliases:
    citations-and-evidence-fidelity.recap: citations-and-evidence-fidelity.check
assessment_families:
- id: citations-and-evidence-fidelity.base
  objective_ref: objective.citations-and-evidence-fidelity
  task: base
  response_type: single_choice
  points: 1
  hint: 'Distinguish support from coverage: trace the inputs, operation, and result before choosing.'
  remediation_scene: citations-and-evidence-fidelity.s2
  variants:
  - id: citations-and-evidence-fidelity.base.1
    prompt: Does a working URL prove the adjacent claim is supported?
    options:
    - id: c
      text: Only if the domain is familiar
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    answer: a
    feedback: The content must entail or substantiate the claim.
  - id: citations-and-evidence-fidelity.base.2
    prompt: What does citation coverage assess?
    options:
    - id: a
      text: Whether claims needing evidence have support attached
    - id: b
      text: Only whether links load
    - id: c
      text: Only how many words are generated
    answer: a
    feedback: Coverage concerns the extent of supported claims.
- id: citations-and-evidence-fidelity.transfer
  objective_ref: objective.citations-and-evidence-fidelity
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Score abstention and usefulness together: trace the inputs, operation, and result before choosing.'
  remediation_scene: citations-and-evidence-fidelity.s4
  variants:
  - id: citations-and-evidence-fidelity.transfer.1
    prompt: One-dataset improvement becomes “always best.” What changed?
    options:
    - id: a
      text: The claim exceeds the evidence’s scope
    - id: b
      text: Only the sentence length
    - id: c
      text: Nothing meaningful
    answer: a
    feedback: Experimental conditions limit generalization.
  - id: citations-and-evidence-fidelity.transfer.2
    prompt: Why evaluate unnecessary abstention too?
    options:
    - id: b
      text: Abstention is always a perfect outcome
    - id: c
      text: Only correctness matters in every task
    - id: a
      text: Excessive refusal can reduce useful supported answers
    answer: a
    feedback: The desired behavior balances evidence limits with usefulness.
