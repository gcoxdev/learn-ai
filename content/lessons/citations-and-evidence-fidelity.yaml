schema_version: 0.2-draft
lesson:
  id: citations-and-evidence-fidelity
  version: 0.4.0-draft
  title: Check whether a source supports the claim beside it
  state: draft
  summary: An answer cites the real returns policy, the link works, and the claim is still wrong. Learn to check citations claim by claim, and to score an honest "I don't know".
  slot: M26.6
  category: learning
  sources:
    - title: Enabling Large Language Models to Generate Text with Citations (Gao et al., 2023)
      url: https://arxiv.org/abs/2305.14627
    - title: Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks (Lewis et al., 2020)
      url: https://arxiv.org/abs/2005.11401
objectives:
  - id: objective.citations-and-evidence-fidelity
    version: 2-draft
    statement: Evaluate a grounded answer on correctness, citation support, coverage, and source quality; a real link can still be irrelevant or misread.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - citations-and-evidence-fidelity.base.v2
      - citations-and-evidence-fidelity.transfer.v2
      - citations-and-evidence-fidelity.calc
    prerequisites:
      - anyOf:
          - objective.rag-evidence-pipeline
      - anyOf:
          - objective.reasoning-and-explanations
scenes:
  - id: citations-and-evidence-fidelity.s1
    title: A real source, a wrong claim
    type: explanation
    depth: intuition
    objective_refs:
      - objective.citations-and-evidence-fidelity
    markdown: |-
      Sprocket's assistant tells a customer: *"Opened batteries can be returned within 30 days for a full refund [S1]."* Click [S1] and you land on the real returns policy. The link works. The page is on topic. And it says, in plain words, "Opened batteries cannot be returned."

      A citation is itself a claim: *this passage backs up this sentence.* Checking it means reading the passage against the sentence, not checking that the link opens. For each claim-and-source pair there are four possible verdicts:

      | Verdict | Meaning | Example against the returns policy |
      | --- | --- | --- |
      | Supported | The passage says it | "Unused items can be returned within 30 days." |
      | Partially supported | Some of it is there; a condition or detail was changed or dropped | "Items can be returned within 30 days." (drops "unused") |
      | Contradicted | The passage says the opposite | "Opened batteries can be returned." |
      | Unrelated | The passage doesn't address it | "Return shipping is free." |

      Only the first verdict earns the citation. A merely *relevant* citation, like [S1] above, can be worse than none: it makes a wrong answer look checked.
    bridges: []
  - id: citations-and-evidence-fidelity.s2
    title: Support and coverage are different numbers
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.citations-and-evidence-fidelity
    markdown: |-
      To grade a whole answer, split it into single factual claims and judge each one:

      | # | Claim | Cited | Verdict |
      | ---: | --- | --- | --- |
      | 1 | Unused items can be returned within 30 days | S1 | Supported |
      | 2 | Opened batteries can be returned | S1 | Contradicted |
      | 3 | Refunds reach your card within 5 business days | S3 | Partially supported |
      | 4 | The KB-110 charger fits older models | S2 | Supported |
      | 5 | Return shipping is free | none | (no citation) |

      Two questions, two numbers:

      - **Citation coverage**: of the claims that need a source, how many have one? Here 4 of 5, so **0.8**.
      - **Citation support**: of the cited claims, how many are fully supported by their source? Claims 1 and 4 out of 4 cited: **0.5**.

      Coverage looks healthy; support shows half the citations are decoration. Only 2 of the 5 claims are both cited and supported: 0.4.

      :::papers How ALCE scores citations (Gao et al., 2023)
      The ALCE benchmark scores cited answers automatically. Its **citation recall** is our combined number: the fraction of statements fully supported by the passages they cite, with uncited statements counting as unsupported (2/5 = 0.4 above). Its **citation precision** checks each individual citation. A citation counts as irrelevant when it supports nothing on its own and the statement stays supported without it, like two padding sources cited beside the one that does the work.
      :::

      :::mixup "More citations means a better-grounded answer."
      Citation count measures effort, not support. Count verdicts, not brackets.
      :::
    bridges: []
  - id: citations-and-evidence-fidelity.s3
    title: The claim quietly got bigger
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.citations-and-evidence-fidelity
    markdown: |-
      Look again at claim 3. The refunds page says: *"Refunds go to your original payment method within 5 business days of the return arriving."* The answer says: *"Refunds reach your card within 5 business days."*

      Two things changed. "Original payment method" became "your card", wrong for anyone who paid with a gift card. And "of the return arriving" vanished, so the customer starts counting from the day they post the parcel. Each change is small, and each makes the claim bigger than the evidence.

      When you check a claim, compare these parts word for word:

      - **Numbers and dates**: 5 days, not "about a week"; 2024 models, not "newer models".
      - **Conditions**: "if unused", "after the return arrives", "except batteries".
      - **Who and what**: which product, which customers, which payment method.
      - **Certainty**: "may" and "usually" must not become "will" and "always".

      Support tells you the answer matches its source. Whether the source is current and trustworthy is a separate check, which the last lesson in this module returns to.
    bridges: []
  - id: citations-and-evidence-fidelity.nli
    title: Checking thousands of answers
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.citations-and-evidence-fidelity
    markdown: |-
      Checking claims by hand doesn't scale. ALCE and many teams use a **natural language inference (NLI)** model: a classifier that reads a *premise* (the cited passage) and a *hypothesis* (the claim) and outputs one of three labels.

      | Premise (source) | Hypothesis (claim) | NLI label |
      | --- | --- | --- |
      | "Opened batteries cannot be returned." | "Opened batteries can be returned." | contradiction |
      | "Return unused items within 30 days for a full refund." | "Unused items can be returned within 30 days." | entailment |
      | "Return unused items within 30 days for a full refund." | "Return shipping is free." | neutral |

      Only *entailment* counts as supported. Many teams now use a language model as the judge instead, asking for the same three labels. Either way, calibrate the judge: hand-label a random sample of 100 claims, run the judge on the same 100, and see where they disagree.

      :::predict On 100 hand-labeled claims, the judge marks 90 as supported. Your hand labels say 80 are supported, and every disagreement is a claim that dropped a condition. What do you do with the judge's score of 0.95 on this week's full set?
      Treat it as too optimistic. On the sample the judge passed 10 unsupported claims, all with dropped conditions: that's its blind spot. Add test cases with dropped conditions, try a stricter judging prompt, and keep hand-checking a weekly sample until the two agree.
      :::
    bridges: []
  - id: citations-and-evidence-fidelity.s4
    title: Give "I don't know" a fair score
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.citations-and-evidence-fidelity
    markdown: |-
      Some questions have no answer in the collection. The honest reply is to say so and hand off to a person, which is called **abstaining**. But a system that abstains too readily is useless, so a fair test includes both kinds of question and scores both kinds of mistake.

      Sprocket tests two versions on 40 questions: 32 answerable from its help pages, 8 not.

      | Outcome | A: always answers | B: can abstain |
      | --- | ---: | ---: |
      | Answerable, answered correctly | 28 | 26 |
      | Answerable, answered wrongly | 4 | 2 |
      | Answerable, but it abstained | 0 | 4 |
      | Unanswerable, it made something up | 8 | 2 |
      | Unanswerable, it correctly abstained | 0 | 6 |

      A gets more right (28 vs 26), but gives 12 wrong or invented answers to B's 4. Which is better depends on what a mistake costs. For Sprocket, a wrong policy answer (an angry customer, a refund dispute) is about five times worse than an unneeded hand-off. Counting wrong answers as 5 and unneeded hand-offs as 1, A costs 12 × 5 = 60 and B costs 4 × 5 + 4 × 1 = 24. Sprocket ships B, then works on its 4 unneeded hand-offs.
    bridges: []
  - id: citations-and-evidence-fidelity.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.citations-and-evidence-fidelity
    markdown: A research summary, a stale price, a cautious legal bot, and some claim tables to score test whether you can tell a real citation from a decorative one.
    takeaway: |-
      A citation is a claim that the passage backs the sentence, so check each claim against its source, including numbers and conditions. Measure coverage and support separately, and score wrong answers and unneeded refusals together.
  - id: citations-and-evidence-fidelity.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.citations-and-evidence-fidelity
    markdown: |-
      A citation should support the claim beside it, including its qualifications. Also check uncited claims and whether the source itself is reliable.
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - citations-and-evidence-fidelity.s1
        - citations-and-evidence-fidelity.s2
        - citations-and-evidence-fidelity.s3
        - citations-and-evidence-fidelity.nli
        - citations-and-evidence-fidelity.s4
        - citations-and-evidence-fidelity.check
      gate_refs:
        - gate.core
  scene_aliases:
    citations-and-evidence-fidelity.recap: citations-and-evidence-fidelity.check
assessment_families:
  - id: citations-and-evidence-fidelity.base
    objective_ref: objective.citations-and-evidence-fidelity
    task: base
    response_type: single_choice
    points: 1
    hint: 'Distinguish support from coverage: trace the inputs, operation, and result before choosing.'
    remediation_scene: citations-and-evidence-fidelity.s2
    variants:
      - id: citations-and-evidence-fidelity.base.1
        prompt: Does a working URL prove the adjacent claim is supported?
        options:
          - id: c
            text: Only if the domain is familiar
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
        answer: a
        feedback: The content must entail or substantiate the claim.
        retired: true
      - id: citations-and-evidence-fidelity.base.2
        prompt: What does citation coverage assess?
        options:
          - id: a
            text: Whether claims needing evidence have support attached
          - id: b
            text: Only whether links load
          - id: c
            text: Only how many words are generated
        answer: a
        feedback: Coverage concerns the extent of supported claims.
        retired: true
  - id: citations-and-evidence-fidelity.transfer
    objective_ref: objective.citations-and-evidence-fidelity
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Score abstention and usefulness together: trace the inputs, operation, and result before choosing.'
    remediation_scene: citations-and-evidence-fidelity.s4
    variants:
      - id: citations-and-evidence-fidelity.transfer.1
        prompt: One-dataset improvement becomes “always best.” What changed?
        options:
          - id: a
            text: The claim exceeds the evidence’s scope
          - id: b
            text: Only the sentence length
          - id: c
            text: Nothing meaningful
        answer: a
        feedback: Experimental conditions limit generalization.
        retired: true
      - id: citations-and-evidence-fidelity.transfer.2
        prompt: Why evaluate unnecessary abstention too?
        options:
          - id: b
            text: Abstention is always a perfect outcome
          - id: c
            text: Only correctness matters in every task
          - id: a
            text: Excessive refusal can reduce useful supported answers
        answer: a
        feedback: The desired behavior balances evidence limits with usefulness.
        retired: true
  - id: citations-and-evidence-fidelity.base.v2
    objective_ref: objective.citations-and-evidence-fidelity
    task: base
    response_type: single_choice
    points: 1
    hint: Read the cited passage against the claim word for word. Does it say the same thing, part of it, the opposite, or something else?
    remediation_scene: citations-and-evidence-fidelity.s1
    variants:
      - id: citations-and-evidence-fidelity.base.v2.1
        prompt: 'An answer says "Express orders ship free [S4]." [S4] is the real shipping page, it loads fine, and it says "Express shipping costs $15." What is the verdict for this citation?'
        options:
          - id: b
            text: Supported, because the cited page is about express shipping
          - id: c
            text: Partially supported, because the page names the right service
          - id: a
            text: Contradicted, because the page states the opposite of the claim
        answer: a
        feedback: A citation earns "supported" only when the passage says what the claim says. Being on the right topic, or naming the right service, doesn't count when the price is the opposite of free.
      - id: citations-and-evidence-fidelity.base.v2.2
        prompt: An answer makes 10 factual claims and cites a source for every one. Checking shows that 4 of the sources don't back their claims. Which metric reveals the problem?
        options:
          - id: a
            text: Citation support, which is 6/10 = 0.6
          - id: b
            text: Citation coverage, which is 6/10 = 0.6
          - id: c
            text: Citation coverage, which is 4/10 = 0.4
        answer: a
        feedback: Every claim has a citation, so coverage is 10/10 = 1.0. The weakness is support, since only 6 of the 10 cited claims are backed by their sources.
      - id: citations-and-evidence-fidelity.base.v2.3
        prompt: 'The source says "Members get free returns on orders over $50." The answer says "Returns are free [S2]." What is the best verdict?'
        options:
          - id: c
            text: Supported, since the source does say that returns are free
          - id: a
            text: Partially supported, since two conditions were dropped
          - id: b
            text: Unrelated, since the source is about a membership scheme
        answer: a
        feedback: The source backs free returns only for members and only over $50. Dropping both conditions makes the claim bigger than the evidence. The source is clearly on topic, so "unrelated" doesn't fit.
      - id: citations-and-evidence-fidelity.base.v2.4
        prompt: An automatic judge rates 97% of this week's claims as supported. Last month, on a hand-labeled sample, it missed most claims that dropped a condition. What should the team do?
        options:
          - id: b
            text: Report 97%, since the judge applies the same rule to every claim
          - id: a
            text: Hand-check a fresh sample, looking hard at dropped conditions
          - id: c
            text: Replace the judge with the model that wrote the answers
        answer: a
        feedback: The judge has a known blind spot, so 97% is probably too high; a fresh hand-labeled sample shows by how much. Consistency doesn't fix a blind spot, and the answering model tends to share the same one.
  - id: citations-and-evidence-fidelity.transfer.v2
    objective_ref: objective.citations-and-evidence-fidelity
    task: transfer
    response_type: single_choice
    points: 1
    hint: Separate three questions. Does the source say this? Is the source current and trustworthy? Was answering, rather than abstaining, the right call?
    remediation_scene: citations-and-evidence-fidelity.s3
    variants:
      - id: citations-and-evidence-fidelity.transfer.v2.1
        prompt: 'A research assistant writes "Method X outperforms Method Y [paper]." The paper tested one dataset at one model size and found X better there. What is wrong?'
        options:
          - id: a
            text: The claim drops the conditions under which the paper found the result
          - id: b
            text: The paper is the wrong kind of source for comparing two methods
          - id: c
            text: The claim needs a second citation before it can count as supported
        answer: a
        feedback: The source supports "X beat Y on this dataset at this size". The unconditional version is bigger than the evidence. A paper is a fine source, and adding a second citation doesn't fix an overstated claim.
      - id: citations-and-evidence-fidelity.transfer.v2.2
        prompt: 'A travel bot says "The museum ticket costs €12 [S1]." [S1] is a 2019 blog post that does say €12. The price is now €18. What went wrong?'
        options:
          - id: c
            text: Nothing, since the claim is fully supported by its source
          - id: b
            text: The citation is contradicted, since the true price differs
          - id: a
            text: The claim is supported, but the source is out of date
        answer: a
        feedback: Support compares the claim with its source, and here they match. The failure is source quality. Calling it contradicted mixes the two checks; the source says €12 just as the claim does.
      - id: citations-and-evidence-fidelity.transfer.v2.3
        prompt: 'A legal-information bot never gives a wrong answer on its test set, but it says "I can''t help with that" on 30% of questions its documents do answer. How should the team judge it?'
        options:
          - id: b
            text: As a success, because abstaining is the safest possible outcome
          - id: a
            text: As too cautious, since unneeded refusals are also mistakes to count
          - id: c
            text: As broken, because a grounded system shouldn't need to refuse
        answer: a
        feedback: A fair score counts both wrong answers and unneeded refusals. Zero wrong answers bought with 30% refusals may be a poor trade. Refusing sometimes is right, because some questions have no answer in the documents.
      - id: citations-and-evidence-fidelity.transfer.v2.4
        prompt: 'A medical-information assistant retrieves two current leaflets that disagree on a maximum daily dose. What should the answer do?'
        options:
          - id: c
            text: Give the lower dose and cite both leaflets as support
          - id: a
            text: Report both figures with their sources and flag the disagreement
          - id: b
            text: Pick the leaflet the reranker scored higher and cite only that one
        answer: a
        feedback: Neither leaflet supports a single number, so the honest answer shows both and points out the conflict. Citing both for one figure claims support that one of them doesn't give, and the reranker's score measures relevance, not correctness.
  - id: citations-and-evidence-fidelity.calc
    objective_ref: objective.citations-and-evidence-fidelity
    task: base
    response_type: numeric_fields_with_reason
    points: 1
    hint: Coverage = cited claims ÷ claims needing a source. Support = cited claims that their source fully backs ÷ cited claims.
    remediation_scene: citations-and-evidence-fidelity.s2
    variants:
      - id: citations-and-evidence-fidelity.calc.1
        prompt: An answer has 6 claims that need a source. All 6 have citations, but only 3 of the cited sources fully back their claims. Compute citation coverage and citation support, then choose the main weakness.
        feedback: Coverage is 6/6 = 1.0 and support is 3/6 = 0.5. Every claim is cited, but half the citations don't back their claims.
        answers:
          coverage: 1
          support: 0.5
        reason_answer: unsupported
        reason_options:
          - id: uncited
            text: Many claims that need a source have none.
          - id: unsupported
            text: Citations are attached, but many don't back their claims.
          - id: unreliable
            text: The cited sources themselves are probably wrong.
      - id: citations-and-evidence-fidelity.calc.2
        prompt: An answer has 8 claims that need a source. 4 have citations, and all 4 cited sources fully back their claims. Compute citation coverage and citation support, then choose the main weakness.
        feedback: Coverage is 4/8 = 0.5 and support is 4/4 = 1.0. The citations that exist are good, but half the claims have none.
        answers:
          coverage: 0.5
          support: 1
        reason_answer: uncited
        reason_options:
          - id: unsupported
            text: Citations are attached, but many don't back their claims.
          - id: unreliable
            text: The cited sources themselves are probably wrong.
          - id: uncited
            text: Many claims that need a source have none.
      - id: citations-and-evidence-fidelity.calc.3
        prompt: An answer has 5 claims that need a source. 4 have citations, and 2 of those cited sources fully back their claims. Compute citation coverage and citation support, then choose the main weakness.
        feedback: Coverage is 4/5 = 0.8 and support is 2/4 = 0.5. Most claims are cited, but half the citations don't back their claims.
        answers:
          coverage: 0.8
          support: 0.5
        reason_answer: unsupported
        reason_options:
          - id: unreliable
            text: The cited sources themselves are probably wrong.
          - id: uncited
            text: Many claims that need a source have none.
          - id: unsupported
            text: Citations are attached, but many don't back their claims.
      - id: citations-and-evidence-fidelity.calc.4
        prompt: An answer has 10 claims that need a source. 5 have citations, and all 5 cited sources fully back their claims. Compute citation coverage and citation support, then choose the main weakness.
        feedback: Coverage is 5/10 = 0.5 and support is 5/5 = 1.0. Every citation is sound, but half the claims go uncited.
        answers:
          coverage: 0.5
          support: 1
        reason_answer: uncited
        reason_options:
          - id: uncited
            text: Many claims that need a source have none.
          - id: unsupported
            text: Citations are attached, but many don't back their claims.
          - id: unreliable
            text: The cited sources themselves are probably wrong.
    absolute_tolerance: 0.01
    numeric_fields:
      - id: coverage
        label: Citation coverage (0 to 1)
      - id: support
        label: Citation support (0 to 1)
