schema_version: 0.2-draft
lesson:
  id: causal-evaluation-and-negative-results
  version: 0.1.0-draft
  title: Make conclusions match the strength of the experiment
  state: draft
  summary: Causal evaluation changes controlled factors and tests alternatives; reproducible suites and negative
    results constrain hypotheses without turning limited evidence into universal claims.
  slot: M28.8
  category: learning
  minutes: 12
  sources:
  - title: HELM
    url: https://arxiv.org/abs/2211.09110
  - title: Deep Reinforcement Learning that Matters
    url: https://arxiv.org/abs/1709.06560
objectives:
- id: objective.causal-evaluation-and-negative-results
  version: 1-draft
  statement: Causal evaluation changes controlled factors and tests alternatives; reproducible suites and negative
    results constrain hypotheses without turning limited evidence into universal claims.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - causal-evaluation-and-negative-results.base
  - causal-evaluation-and-negative-results.transfer
  prerequisites:
  - anyOf:
    - objective.mechanistic-interpretability
  - anyOf:
    - objective.benchmark-design-and-comparison
scenes:
- id: causal-evaluation-and-negative-results.s1
  title: Separate association from an intervention
  type: explanation
  depth: intuition
  objective_refs:
  - objective.causal-evaluation-and-negative-results
  markdown: A model with more layers may score better, but it may also use different data and training compute.
    An ablation that changes one component under matched conditions provides stronger evidence about that component.
    Even then, optimization interactions and implementation differences can limit interpretation.
  text_mode: A model with more layers may score better, but it may also use different data and training compute.
    An ablation that changes one component under matched conditions provides stronger evidence about that component.
    Even then, optimization interactions and implementation differences can limit interpretation.
  bridges: []
- id: causal-evaluation-and-negative-results.s2
  title: Predefine the claim and comparison
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.causal-evaluation-and-negative-results
  markdown: State the expected effect, relevant metric, budget, and alternative explanations before inspecting outcomes
    where feasible. A toy experiment can compare one feature enabled versus disabled across several seeds. Report
    the actual change and uncertainty rather than only whether a threshold was crossed.
  text_mode: State the expected effect, relevant metric, budget, and alternative explanations before inspecting
    outcomes where feasible. A toy experiment can compare one feature enabled versus disabled across several seeds.
    Report the actual change and uncertainty rather than only whether a threshold was crossed.
  bridges: []
- id: causal-evaluation-and-negative-results.s3
  title: Interpret a negative result carefully
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.causal-evaluation-and-negative-results
  markdown: No detected improvement can mean the mechanism does not help in that setting, the experiment lacks power,
    or the implementation failed to test the intended idea. Check sensitivity and controls. A negative result still
    narrows evidence when the procedure and limits are clear.
  text_mode: No detected improvement can mean the mechanism does not help in that setting, the experiment lacks
    power, or the implementation failed to test the intended idea. Check sensitivity and controls. A negative result
    still narrows evidence when the procedure and limits are clear.
  bridges: []
- id: causal-evaluation-and-negative-results.s4
  title: Package a repeatable evaluation
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.causal-evaluation-and-negative-results
  markdown: Version tasks, artifacts, environments, seeds, scorers, and analysis. Include expected outputs for small
    sanity checks and retain failure cases. A reproducible suite supports future comparisons and regression detection;
    it does not freeze the world or eliminate the need to update the tested distribution.
  text_mode: Version tasks, artifacts, environments, seeds, scorers, and analysis. Include expected outputs for
    small sanity checks and retain failure cases. A reproducible suite supports future comparisons and regression
    detection; it does not freeze the world or eliminate the need to update the tested distribution.
  bridges: []
- id: causal-evaluation-and-negative-results.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.causal-evaluation-and-negative-results
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
- id: causal-evaluation-and-negative-results.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.causal-evaluation-and-negative-results
  markdown: Causal evaluation changes controlled factors and tests alternatives; reproducible suites and negative
    results constrain hypotheses without turning limited evidence into universal claims.
  text_mode: Causal evaluation changes controlled factors and tests alternatives; reproducible suites and negative
    results constrain hypotheses without turning limited evidence into universal claims.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - causal-evaluation-and-negative-results.s1
    - causal-evaluation-and-negative-results.s2
