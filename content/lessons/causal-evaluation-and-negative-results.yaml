schema_version: 0.2-draft
lesson:
  id: causal-evaluation-and-negative-results
  version: 0.4.0-draft
  title: Make conclusions match the strength of the experiment
  state: draft
  summary: The new model scored 7 points higher, on an easier month of chats. Learn to change one thing at a time, report a "no effect" honestly, and write the plan before the scores come in.
  slot: M28.8
  category: learning
  sources:
    - title: "On the State of the Art of Evaluation in Neural Language Models (Melis et al., 2017)"
      url: https://arxiv.org/abs/1707.05589
    - title: "Are GANs Created Equal? A Large-Scale Study (Lucic et al., 2017)"
      url: https://arxiv.org/abs/1711.10337
    - title: "Equivalence Tests: A Practical Primer for t Tests, Correlations, and Meta-Analyses (Lakens, 2017)"
      url: https://doi.org/10.1177/1948550617697177
    - title: "Adding Error Bars to Evals: A Statistical Approach to Language Model Evaluations (Miller, 2024)"
      url: https://arxiv.org/abs/2411.00640
    - title: Deep Reinforcement Learning that Matters
      url: https://arxiv.org/abs/1709.06560
    - title: HELM
      url: https://arxiv.org/abs/2211.09110
objectives:
  - id: objective.causal-evaluation-and-negative-results
    version: 2-draft
    statement: Causal evaluation changes controlled factors and tests alternatives; reproducible suites and negative results constrain hypotheses without turning limited evidence into universal claims.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - causal-evaluation-and-negative-results.base.v2
      - causal-evaluation-and-negative-results.transfer.v2
    prerequisites:
      - anyOf:
          - objective.mechanistic-interpretability
      - anyOf:
          - objective.benchmark-design-and-comparison
scenes:
  - id: causal-evaluation-and-negative-results.s1
    title: B won, and so did the easier month
    type: explanation
    depth: intuition
    objective_refs:
      - objective.causal-evaluation-and-negative-results
    markdown: |-
      Before Kestrel built its frozen test set, an engineer compared the models the quick way: A on 200 chats from March, B on 200 chats from June. B scored 82%, A 75%. Seven points!

      Then someone split the chats by difficulty:

      | | March, model A | June, model B |
      | --- | ---: | ---: |
      | Easy chats (password resets and the like) | 72 of 80 (90%) | 126 of 140 (90%) |
      | Hard chats | 78 of 120 (65%) | 38 of 60 (63%) |
      | **Overall** | **150 of 200 (75%)** | **164 of 200 (82%)** |

      :::predict Which model is better on easy chats, and which on hard ones?
      They tie on easy chats, and A is slightly ahead on hard ones. B's 7-point lead comes entirely from June having more easy chats: 140 of 200 against 80. The month changed along with the model, and the month moved the score.
      :::

      Something that changes along with the thing you're comparing, and also affects the result, is a **confounder**. In evaluation, the usual suspects are the test items, the prompt template, the judge's version, and the tuning budget. Melis et al. (2017) gave plain LSTM language models and several newer architectures the same large tuning budget, and the plain LSTMs came out ahead. Lucic et al. (2017) found that, with enough tuning, most GAN variants reached similar scores.

      The fix is the one from the lesson on controlled experiments: hold everything fixed except the one factor you're testing. Here that means the same items for both models, compared pair by pair.
    diagram:
      caption: A confounded comparison. The month of chats affects both which model was tested and how easy the test was.
      description: The month of chats determines which model was tested, since A ran in March and B in June. The month also sets the share of easy chats, which raises or lowers the score. The model itself also affects the score. Because the month feeds both, its effect gets mixed into the apparent model effect.
      nodes:
        - id: month
          label: Month of chats
          note: the confounder
          col: 0
          row: 1
          tone: warn
        - id: model
          label: Which model was tested
          col: 1
          row: 0
        - id: mix
          label: Share of easy chats
          col: 1
          row: 2
          tone: data
        - id: score
          label: Accuracy score
          col: 2
          row: 1
          tone: accent
      edges:
        - from: month
          to: model
          label: A in March, B in June
        - from: month
          to: mix
          label: more resets in June
        - from: model
          to: score
          label: the effect we want
        - from: mix
          to: score
          label: easier items, higher score
  - id: causal-evaluation-and-negative-results.s2
    title: Remove one part, measure the drop
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.causal-evaluation-and-negative-results
    markdown: |-
      B's system has three parts besides the model: retrieval of help pages, a reranker that orders them, and a list of policy rules in the system prompt. Which parts earn their keep? An **ablation** removes one part and reruns everything else unchanged. It is an intervention: you set the factor yourself instead of hoping it varied by chance.

      Kestrel runs each version on the 800-chat private set, with the same templates and three seeds, and compares each with the full system pair by pair:

      | Version | Accuracy | Change vs full, 95% CI |
      | --- | ---: | ---: |
      | Full system | 81.0% | |
      | Without retrieval | 69.5% | −11.5 ± 2.4 |
      | Without reranker | 80.4% | −0.6 ± 2.1 |
      | Without policy rules | 79.2% | −1.8 ± 1.9 |
      | Without reranker *and* rules | 76.0% | −5.0 ± 2.3 |

      Retrieval clearly matters. The last row is the surprise. Removed separately, the reranker and rules cost 0.6 + 1.8 = 2.4 points, but removed together they cost 5.0. The two parts **interact**: each partly covers for the other. One-at-a-time ablations miss this, so when two parts might back each other up, remove them together too.
    bridges: []
  - id: causal-evaluation-and-negative-results.s3
    title: '"No significant effect" is not "no effect"'
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.causal-evaluation-and-negative-results
    markdown: |-
      The reranker costs money on every chat. Its ablation shows −0.6 points, 95% CI −2.7 to +1.5. A manager asks, "So it does nothing. Can we cut it?"

      A **null result**, finding no detectable effect, has three possible explanations, and each needs a different check:

      1. **There's no meaningful effect.** Possible.
      2. **The test was too small.** Here the standard error is about 1.07 points. A test detects an effect reliably (80% of the time, at the 5% level) only if it's about $(1.96 + 0.84) \times 1.07 \approx 3$ points or larger. A real 2-point effect would slip past this test about half the time.
      3. **The ablation didn't do what you think.** Kestrel checks the logs: without the reranker, the order of pages really did change in 40% of chats. So the intervention happened.

      To claim "no meaningful effect," set a margin in advance: the smallest effect you would care about. An **equivalence test** asks whether the whole interval sits inside that margin (Lakens, 2017). With a margin of ± 3 points, −2.7 to +1.5 fits: effects larger than 3 points either way are ruled out. With a margin of ± 2 points it doesn't fit, and the honest answer is "we don't know yet."

      :::mixup "The interval includes zero, so the reranker has no effect."
      Zero is inside the interval, but so is −2.7. The data are consistent with no effect and also with a loss of more than 2 points. Report the interval, not just the verdict.
      :::

      Kestrel's report says exactly that: "Removing the reranker changed accuracy by −0.6 points (95% CI −2.7 to +1.5; 800 paired chats, 3 seeds). Effects over 3 points are ruled out; smaller ones are not." Keeping the result in the record matters as much as how it's written. Otherwise the next team runs the same ablation again.
    bridges: []
  - id: causal-evaluation-and-negative-results.s4
    title: Write the plan before the run
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.causal-evaluation-and-negative-results
    markdown: |-
      The lesson on controlled experiments introduced **preregistration**: writing down the question, the analysis, and the decision rule before seeing results. Here is Kestrel's plan for the release decision, dated before B's final run:

      | Plan item | Kestrel's choice |
      | --- | --- |
      | Question | Does B answer support chats correctly more often than A? |
      | Items | The 800-chat private set, frozen 1 September |
      | Conditions | Same 3 templates and 3 seeds for both; same judge version, swap-tested, κ ≥ 0.6 against the leads |
      | Primary analysis | Paired difference in accuracy, with a 95% CI |
      | Ship rule | Lower CI bound above 0, *and* no language or topic slice below 75%, *and* risk at most 10% at the chosen threshold |
      | Exploratory | Any other slice, labeled as exploratory and retested on fresh chats |
      | Reporting | Publish the result internally whatever it shows |

      The run comes back: B leads by 3.0 points (0.9 to 5.1), and its risk is 9%. But the Polish slice, after fixes, reaches only 71%. By the plan, B doesn't ship yet.

      Without the plan, a lead of 3 points with an interval above zero would have been hard to argue with. The written rule made the slice floor count. The team fine-tunes on Polish chats, freezes a fresh private set, and reruns the same plan.
    bridges: []
  - id: causal-evaluation-and-negative-results.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.causal-evaluation-and-negative-results
    markdown: A language-model paper, a data-cleaning experiment, a tutoring release plan, and a retrieval ablation that didn't happen test whether you can find the confounder and report a null result honestly.
    takeaway: |-
      Change one thing, hold everything else fixed, and remove parts together when they may interact. Report a null result as an interval with the effect sizes it rules out, and write the decision rule before the run.
  - id: causal-evaluation-and-negative-results.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.causal-evaluation-and-negative-results
    markdown: |-
      Change the factor you want to study under matched conditions. Report variation, alternative explanations, and negative results so the conclusion stays within the evidence.
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - causal-evaluation-and-negative-results.s1
        - causal-evaluation-and-negative-results.s2
        - causal-evaluation-and-negative-results.s3
        - causal-evaluation-and-negative-results.s4
        - causal-evaluation-and-negative-results.check
      gate_refs:
        - gate.core
  scene_aliases:
    causal-evaluation-and-negative-results.recap: causal-evaluation-and-negative-results.check
assessment_families:
  - id: causal-evaluation-and-negative-results.base
    objective_ref: objective.causal-evaluation-and-negative-results
    task: base
    response_type: single_choice
    points: 1
    hint: 'Predefine the claim and comparison: trace the inputs, operation, and result before choosing.'
    remediation_scene: causal-evaluation-and-negative-results.s2
    variants:
      - id: causal-evaluation-and-negative-results.base.1
        prompt: A larger model also uses better data. Can the gain be attributed solely to depth?
        options:
          - id: b
            text: 'Yes'
          - id: c
            text: Only if the score is higher
          - id: a
            text: 'No'
        answer: a
        feedback: Multiple changing factors confound attribution.
        retired: true
      - id: causal-evaluation-and-negative-results.base.2
        prompt: What makes an ablation informative?
        options:
          - id: c
            text: Only renaming the model
          - id: a
            text: A controlled change with relevant matched conditions and measurements
          - id: b
            text: Only deleting random code
        answer: a
        feedback: The intervention must test the intended factor.
        retired: true
  - id: causal-evaluation-and-negative-results.transfer
    objective_ref: objective.causal-evaluation-and-negative-results
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Package a repeatable evaluation: trace the inputs, operation, and result before choosing.'
    remediation_scene: causal-evaluation-and-negative-results.s4
    variants:
      - id: causal-evaluation-and-negative-results.transfer.1
        prompt: Does no statistically detected gain prove a method never helps?
        options:
          - id: c
            text: Only with a negative average
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
        answer: a
        feedback: Power, setting, and implementation limit the conclusion.
        retired: true
      - id: causal-evaluation-and-negative-results.transfer.2
        prompt: Why preserve negative and failure cases in a suite?
        options:
          - id: a
            text: They constrain claims and help detect future regressions
          - id: b
            text: They must always be discarded
          - id: c
            text: Only success examples matter
        answer: a
        feedback: Unfavorable evidence is part of a useful evaluation record.

        retired: true
  - id: causal-evaluation-and-negative-results.base.v2
    objective_ref: objective.causal-evaluation-and-negative-results
    task: base
    response_type: single_choice
    points: 1
    hint: List everything that differed between the two runs, not just the factor you meant to change. For a null result, read the interval's edges against a margin set in advance.
    remediation_scene: causal-evaluation-and-negative-results.s3
    variants:
      - id: causal-evaluation-and-negative-results.base.v2.1
        prompt: Model A was tested on March chats and model B on June chats, and June had many more easy password resets. B scores 7 points higher. What is the problem?
        options:
          - id: b
            text: Nothing, as long as each month's chats were sampled at random
          - id: a
            text: The easier June mix changed along with the model and can explain the gain
          - id: c
            text: June's extra easy chats make B's score more precise than A's
        answer: a
        feedback: The month is a confounder. It decided which model was tested and how hard the test was. Random sampling within each month doesn't help, because the months themselves differ. Put both models on the same items instead.
      - id: causal-evaluation-and-negative-results.base.v2.2
        prompt: What makes "remove the reranker" an informative ablation?
        options:
          - id: c
            text: It runs on a fresh set of chats, so the result is independent
          - id: a
            text: Just the reranker changes; items, prompts, seeds, and judge stay fixed
          - id: b
            text: The reranker is removed from both the system and the scoring
        answer: a
        feedback: An ablation is an intervention on one factor. Fresh chats would add a second difference, the items, and the scoring must stay the same so the two runs are measured alike.
      - id: causal-evaluation-and-negative-results.base.v2.3
        prompt: Removing a component changes accuracy by −0.6 points (95% CI −2.7 to +1.5). The team set a margin of ±3 points in advance. What can they conclude?
        options:
          - id: a
            text: Effects bigger than 3 points in either direction are ruled out
          - id: b
            text: The component has no effect, since the estimate is near zero
          - id: c
            text: Nothing can be concluded, since the interval includes zero
        answer: a
        feedback: The whole interval sits inside ±3, so large effects are excluded. Smaller effects, including a 2-point loss, remain possible, so "no effect" overclaims. And an interval that includes zero still rules out everything outside it.
      - id: causal-evaluation-and-negative-results.base.v2.4
        prompt: Removing the reranker costs 0.6 points and removing the policy rules costs 1.8, but removing both together costs 5.0. What does this show?
        options:
          - id: b
            text: One of the three measurements must contain an error
          - id: c
            text: The rules matter most, since they cost the most on their own
          - id: a
            text: The two parts interact, which one-at-a-time ablations missed
        answer: a
        feedback: Together they cost more than the 2.4-point sum of their separate costs, so each partly covers for the other. That's an interaction, not a measurement error, and ranking the parts by their separate costs misses it.
  - id: causal-evaluation-and-negative-results.transfer.v2
    objective_ref: objective.causal-evaluation-and-negative-results
    task: transfer
    response_type: single_choice
    points: 1
    hint: Ask whether the intervention really happened and was the only difference, and whether the test was big enough to see the effect you care about.
    remediation_scene: causal-evaluation-and-negative-results.s1
    variants:
      - id: causal-evaluation-and-negative-results.transfer.v2.1
        prompt: A paper reports that its new architecture beats an LSTM baseline by 4 perplexity points. The authors ran 200 tuning trials for their model and 10 for the LSTM. What is the main concern?
        options:
          - id: a
            text: Tuning effort changed with the architecture; tune both equally
          - id: b
            text: A 4-point perplexity gap is too small to report at all
          - id: c
            text: The LSTM should get fewer trials because it's a simpler design
        answer: a
        feedback: The tuning budget is a confounder, the problem Melis et al. found in language modeling. Giving both models the same budget isolates the architecture. The gap's size isn't the issue; its cause is.
      - id: causal-evaluation-and-negative-results.transfer.v2.2
        prompt: A data-cleaning step changes accuracy by +0.3 points (95% CI −4.0 to +4.6) on 150 test items. How should the team report it?
        options:
          - id: c
            text: As a small positive effect, since the estimate is above zero
          - id: b
            text: As showing the step has no effect, so it can be dropped
          - id: a
            text: As inconclusive, since effects of about 4 points can't be ruled out
        answer: a
        feedback: The interval is wide enough to include a 4-point loss or gain, so this test can't tell. Calling it no effect or a positive effect reads more into 150 items than they hold. Report the interval and plan a larger test.
      - id: causal-evaluation-and-negative-results.transfer.v2.3
        prompt: A school is about to evaluate a new tutoring model. Which part of the plan best protects against talking themselves into shipping it after seeing the scores?
        options:
          - id: b
            text: Running many extra slice analyses once the results are in
          - id: a
            text: A ship rule written in advance, such as the CI's lower bound above 0
          - id: c
            text: Using a larger test set than they used for the last model
        answer: a
        feedback: A decision rule fixed before the run can't be bent to fit the result. Extra slices afterwards invite finding something that looks good by chance, and a bigger test set reduces noise but doesn't stop a flexible reading of it.
      - id: causal-evaluation-and-negative-results.transfer.v2.4
        prompt: A "remove retrieval" ablation shows no change. The logs show the retriever returned the same default page for every query in both runs. What does the null result mean?
        options:
          - id: a
            text: Little about retrieval yet, since the intervention never took effect
          - id: b
            text: Retrieval doesn't help this model, so it can safely be removed
          - id: c
            text: Retrieval helps only on queries whose answer is on the default page
        answer: a
        feedback: If retrieval was already broken, removing it changed nothing, so the experiment never tested retrieval. Fix the retriever, confirm it returns relevant pages, and rerun the ablation.
