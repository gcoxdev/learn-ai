schema_version: 0.2-draft
lesson:
  id: stakeholders-and-deployment-decisions
  version: 0.1.0-draft
  title: Decide whose problem the system solves and who bears its errors
  state: draft
  summary: AI deployment decisions should connect objectives, affected stakeholders, error consequences, human agency,
    and viable alternatives before optimizing a model score.
  slot: M29.1
  category: learning
  sources:
  - title: NIST AI Risk Management Framework
    url: https://www.nist.gov/itl/ai-risk-management-framework
  - title: Model Cards for Model Reporting
    url: https://arxiv.org/abs/1810.03993
objectives:
- id: objective.stakeholders-and-deployment-decisions
  version: 1-draft
  statement: AI deployment decisions should connect objectives, affected stakeholders, error consequences, human
    agency, and viable alternatives before optimizing a model score.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - stakeholders-and-deployment-decisions.base
  - stakeholders-and-deployment-decisions.transfer
  prerequisites:
  - anyOf:
    - objective.evaluation-metrics-and-uncertainty
  - anyOf:
    - objective.models-and-products
scenes:
- id: stakeholders-and-deployment-decisions.s1
  title: Map the affected people
  type: explanation
  depth: intuition
  objective_refs:
  - objective.stakeholders-and-deployment-decisions
  markdown: The purchaser, operator, end user, data contributor, and person affected by a decision may be different
    people. A scheduling optimizer that saves operator time can create unpredictable shifts for workers. Identify
    benefits, burdens, and who can contest an outcome.
  text_mode: The purchaser, operator, end user, data contributor, and person affected by a decision may be different
    people. A scheduling optimizer that saves operator time can create unpredictable shifts for workers. Identify
    benefits, burdens, and who can contest an outcome.
  bridges: []
- id: stakeholders-and-deployment-decisions.s2
  title: Translate objectives into consequences
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.stakeholders-and-deployment-decisions
  markdown: An accuracy gain matters differently when errors waste a minute versus deny access to an important service.
    Define error types, frequency, reversibility, and who absorbs the cost. A metric selected by the developer may
    omit effects that stakeholders consider central.
  text_mode: An accuracy gain matters differently when errors waste a minute versus deny access to an important
    service. Define error types, frequency, reversibility, and who absorbs the cost. A metric selected by the developer
    may omit effects that stakeholders consider central.
  bridges: []
- id: stakeholders-and-deployment-decisions.s3
  title: Compare alternatives including nondeployment
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.stakeholders-and-deployment-decisions
  markdown: A simpler rule, better interface, additional staff training, or changing the process may address the
    problem without a complex model. Compare expected benefit, evidence quality, operating cost, and oversight capacity.
    Technical feasibility alone does not establish that deployment is worthwhile.
  text_mode: A simpler rule, better interface, additional staff training, or changing the process may address the
    problem without a complex model. Compare expected benefit, evidence quality, operating cost, and oversight capacity.
    Technical feasibility alone does not establish that deployment is worthwhile.
  bridges: []
- id: stakeholders-and-deployment-decisions.s4
  title: Preserve meaningful human agency
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.stakeholders-and-deployment-decisions
  markdown: Users need understandable options, correction paths, and appropriate escalation. A nominal human reviewer
    cannot help if they lack time, evidence, or authority to challenge outputs. Define ownership of monitoring and
    response after release, because the decision remains consequential as conditions change.
  text_mode: Users need understandable options, correction paths, and appropriate escalation. A nominal human reviewer
    cannot help if they lack time, evidence, or authority to challenge outputs. Define ownership of monitoring and
    response after release, because the decision remains consequential as conditions change.
  bridges: []
- id: stakeholders-and-deployment-decisions.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.stakeholders-and-deployment-decisions
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: AI deployment decisions should connect objectives, affected stakeholders, error consequences, human
    agency, and viable alternatives before optimizing a model score.
- id: stakeholders-and-deployment-decisions.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.stakeholders-and-deployment-decisions
  markdown: AI deployment decisions should connect objectives, affected stakeholders, error consequences, human
    agency, and viable alternatives before optimizing a model score.
  text_mode: AI deployment decisions should connect objectives, affected stakeholders, error consequences, human
    agency, and viable alternatives before optimizing a model score.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - stakeholders-and-deployment-decisions.s1
    - stakeholders-and-deployment-decisions.s2
    - stakeholders-and-deployment-decisions.s3
    - stakeholders-and-deployment-decisions.s4
    - stakeholders-and-deployment-decisions.check
    gate_refs:
    - gate.core
  scene_aliases:
    stakeholders-and-deployment-decisions.recap: stakeholders-and-deployment-decisions.check
assessment_families:
- id: stakeholders-and-deployment-decisions.base
  objective_ref: objective.stakeholders-and-deployment-decisions
  task: base
  response_type: single_choice
  points: 1
  hint: 'Translate objectives into consequences: trace the inputs, operation, and result before choosing.'
  remediation_scene: stakeholders-and-deployment-decisions.s2
  variants:
  - id: stakeholders-and-deployment-decisions.base.1
    prompt: Must the buyer and the person affected by a prediction be the same?
    options:
    - id: c
      text: Only for automated systems
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    answer: a
    feedback: Different stakeholders can receive benefits and bear costs.
  - id: stakeholders-and-deployment-decisions.base.2
    prompt: Why distinguish reversible and irreversible errors?
    options:
    - id: a
      text: Their consequences and recovery options differ
    - id: b
      text: Only the metric name changes
    - id: c
      text: Every error has identical impact
    answer: a
    feedback: Error handling depends on what can be repaired.
- id: stakeholders-and-deployment-decisions.transfer
  objective_ref: objective.stakeholders-and-deployment-decisions
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Preserve meaningful human agency: trace the inputs, operation, and result before choosing.'
  remediation_scene: stakeholders-and-deployment-decisions.s4
  variants:
  - id: stakeholders-and-deployment-decisions.transfer.1
    prompt: Does technical feasibility alone justify deployment?
    options:
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    - id: c
      text: Only if the model is accurate on one test
    answer: a
    feedback: Usefulness and consequences require broader evidence.
  - id: stakeholders-and-deployment-decisions.transfer.2
    prompt: What makes human review meaningful?
    options:
    - id: b
      text: A reviewer title alone
    - id: c
      text: Automatically accepting every output
    - id: a
      text: Time, evidence, authority, and a usable correction path
    answer: a
    feedback: Oversight needs practical ability to intervene.
