assessment_families:
  - id: stakeholders-and-deployment-decisions.base
    objective_ref: objective.stakeholders-and-deployment-decisions
    task: base
    response_type: single_choice
    points: 1
    hint: 'Translate objectives into consequences: trace the inputs, operation, and result before choosing.'
    remediation_scene: stakeholders-and-deployment-decisions.s2
    variants:
      - id: stakeholders-and-deployment-decisions.base.1
        prompt: Must the buyer and the person affected by a prediction be the same?
        options:
          - id: c
            text: Only for automated systems
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
        answer: a
        feedback: Different stakeholders can receive benefits and bear costs.
        retired: true
      - id: stakeholders-and-deployment-decisions.base.2
        prompt: Why distinguish reversible and irreversible errors?
        options:
          - id: a
            text: Their consequences and recovery options differ
          - id: b
            text: Only the metric name changes
          - id: c
            text: Every error has identical impact
        answer: a
        feedback: Error handling depends on what can be repaired.
        retired: true
  - id: stakeholders-and-deployment-decisions.transfer
    objective_ref: objective.stakeholders-and-deployment-decisions
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Preserve meaningful human agency: trace the inputs, operation, and result before choosing.'
    remediation_scene: stakeholders-and-deployment-decisions.s4
    variants:
      - id: stakeholders-and-deployment-decisions.transfer.1
        prompt: Does technical feasibility alone justify deployment?
        options:
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
          - id: c
            text: Only if the model is accurate on one test
        answer: a
        feedback: Usefulness and consequences require broader evidence.
        retired: true
      - id: stakeholders-and-deployment-decisions.transfer.2
        prompt: What makes human review meaningful?
        options:
          - id: b
            text: A reviewer title alone
          - id: c
            text: Automatically accepting every output
          - id: a
            text: Time, evidence, authority, and a usable correction path
        answer: a
        feedback: Oversight needs practical ability to intervene.
        retired: true
  - id: stakeholders-and-deployment-decisions.base.v2
    objective_ref: objective.stakeholders-and-deployment-decisions
    task: base
    response_type: single_choice
    points: 1
    hint: For each kind of error, ask who absorbs it and whether it can be undone before you compare totals.
    remediation_scene: stakeholders-and-deployment-decisions.s2
    variants:
      - id: stakeholders-and-deployment-decisions.base.v2.1
        prompt: In a second ward's trial, the roster model cuts overstaffed nights from 20 to 6 but raises understaffed nights from 2 to 5. Which number should weigh most in the decision?
        options:
          - id: b
            text: The total error count, which fell by half and favors going live
          - id: a
            text: The rise in understaffed nights, which patients bear and can't undo
          - id: c
            text: The drop in overstaffed nights, since that is where the money goes
        answer: a
        feedback: Understaffing falls on patients and nurses and can't be reversed, so its rise matters more than the lower total. Overstaffing costs money but a manager can fix it the same night by moving a nurse, which is why totals mislead here.
      - id: stakeholders-and-deployment-decisions.base.v2.2
        prompt: Which pairing from Riverbend's stakeholder table shows the gap a stakeholder map is meant to reveal?
        options:
          - id: c
            text: Ward managers save hours, and nurses may get fairer rotations
          - id: b
            text: The vendor builds the model, and ward managers review its drafts
          - id: a
            text: Finance chooses the tool, and patients bear the short-staffed nights
        answer: a
        feedback: The map exists to expose who decides versus who lives with the errors. Finance chose; patients, who had no say, absorb understaffing. The other pairings describe roles or benefits, not a mismatch between choice and risk.
      - id: stakeholders-and-deployment-decisions.base.v2.3
        prompt: Why did Riverbend write its go-live gate (no more understaffed nights than today) before the shadow-mode trial began?
        options:
          - id: a
            text: So good-looking results can't quietly redefine what counts as enough
          - id: b
            text: So the vendor can tune the model to pass the gate during the trial
          - id: c
            text: So the trial can stop early as soon as the model looks promising
        answer: a
        feedback: A gate set in advance can't drift toward whatever the results happen to show. Tuning to pass during the trial would turn the test into training, and stopping at the first promising sign is exactly the goalpost-moving the gate prevents.
      - id: stakeholders-and-deployment-decisions.base.v2.4
        prompt: A charge nurse must approve each roster, but gets two minutes a week, can't see the forecast, and needs finance's sign-off to add a nurse. What does her review lack?
        options:
          - id: c
            text: A second approver from finance, so two people sign each roster
          - id: a
            text: Time, information, and the authority to change the outcome
          - id: b
            text: A more accurate model, so approvals are rarely needed at all
        answer: a
        feedback: Meaningful oversight needs time to look, information to judge, and authority to act. She has none, so her approval is a formality. Another signature or a better model leaves her just as unable to change a bad roster.
  - id: stakeholders-and-deployment-decisions.transfer.v2
    objective_ref: objective.stakeholders-and-deployment-decisions
    task: transfer
    response_type: single_choice
    points: 1
    hint: Name who gains, who bears each error, and whether it can be reversed. Then pick the step that protects the people carrying the risk.
    remediation_scene: stakeholders-and-deployment-decisions.gates
    variants:
      - id: stakeholders-and-deployment-decisions.transfer.v2.1
        prompt: A city trains a model to rank potholes for repair using complaints from its reporting app, which is used mostly in wealthier neighborhoods. What should happen before deployment?
        options:
          - id: b
            text: Tune the model for the highest accuracy on the complaints received
          - id: c
            text: Ask the app's most active users to rate the model's first rankings
          - id: a
            text: Check which areas the complaints miss, and who would wait longest
        answer: a
        feedback: Residents of neighborhoods that rarely use the app bear the delays but barely appear in the data. Tuning on existing complaints or asking the most active users only amplifies the voices already counted.
      - id: stakeholders-and-deployment-decisions.transfer.v2.2
        prompt: A bank switches on a new credit-limit model. Its written rollback trigger is "complaints above last quarter's rate." In week three, complaints double. What should happen next?
        options:
          - id: a
            text: Revert to the previous model, kept ready, and then investigate
          - id: b
            text: Keep the new model running and add an apology to rejection letters
          - id: c
            text: Retrain the new model on this week's complaints and redeploy it
        answer: a
        feedback: The trigger was set in advance, so honor it. Customers stop bearing the new errors while the team finds the cause. A rushed retrain ships an untested model, and an apology leaves the harm in place.
      - id: stakeholders-and-deployment-decisions.transfer.v2.3
        prompt: A platform's model removes posts automatically, and wrongly removed posts stay down 30 days before any person looks. Which change most directly restores human agency?
        options:
          - id: c
            text: A notice telling users that the model is 95% accurate overall
          - id: b
            text: A stricter removal threshold, so the model removes fewer posts
          - id: a
            text: A quick appeal to a reviewer who has the power to restore posts
        answer: a
        feedback: Agency means the affected person can contest the outcome and someone can fix it. A stricter threshold reduces errors but still leaves no way to challenge one, and an accuracy notice changes nothing for the person whose post was wrongly removed.
      - id: stakeholders-and-deployment-decisions.transfer.v2.4
        prompt: A school wants a model predicting which students will skip class, so counsellors can call home. Teachers already know most at-risk students. What comparison comes first?
        options:
          - id: b
            text: Two model architectures, to find the more accurate of the pair
          - id: a
            text: The model against a simple option, like teachers sharing weekly lists
          - id: c
            text: The model's accuracy on last year's students against this year's
        answer: a
        feedback: The model must beat the best simple alternative, not just nothing. If teachers' lists already catch most students, a model adds cost and new errors for little gain. Comparing architectures or years skips that question.
