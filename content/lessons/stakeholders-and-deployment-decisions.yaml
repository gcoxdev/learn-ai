schema_version: 0.2-draft
lesson:
  id: stakeholders-and-deployment-decisions
  version: 0.4.0-draft
  title: Decide whose problem the system solves and who bears its errors
  state: draft
  summary: A hospital buys a tool that writes nurse rosters. Finance loves it; the night shift doesn't. Learn to map who gains, who carries the risk, and when to hold back.
  slot: M29.1
  category: learning
  sources:
    - title: NIST AI Risk Management Framework (AI RMF 1.0, January 2023)
      url: https://www.nist.gov/itl/ai-risk-management-framework
    - title: Model Cards for Model Reporting (Mitchell et al., 2019)
      url: https://arxiv.org/abs/1810.03993
    - title: "External Validation of a Widely Implemented Proprietary Sepsis Prediction Model in Hospitalized Patients (Wong et al., JAMA Internal Medicine, 2021)"
      url: https://jamanetwork.com/journals/jamainternalmedicine/fullarticle/2781307
    - title: Moffatt v. Air Canada, 2024 BCCRT 149 (Civil Resolution Tribunal of British Columbia)
      url: https://www.canlii.org/en/bc/bccrt/doc/2024/2024bccrt149/2024bccrt149.html
objectives:
  - id: objective.stakeholders-and-deployment-decisions
    version: 2-draft
    statement: AI deployment decisions should connect objectives, affected stakeholders, error consequences, human agency, and viable alternatives before optimizing a model score.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - stakeholders-and-deployment-decisions.base.v2
      - stakeholders-and-deployment-decisions.transfer.v2
    prerequisites:
      - anyOf:
          - objective.evaluation-metrics-and-uncertainty
      - anyOf:
          - objective.models-and-products
scenes:
  - id: stakeholders-and-deployment-decisions.s1
    title: Who asked for the roster tool?
    type: explanation
    depth: intuition
    objective_refs:
      - objective.stakeholders-and-deployment-decisions
    markdown: |-
      Riverbend General, a mid-sized hospital, is buying a model that writes nurse rosters. It forecasts how many patients each ward will have on each shift and staffs to match. Before asking "is it accurate?", ask three other questions: who gains, who carries the risk, and who decides?

      | Group | What they gain | What they risk | Say in the decision |
      | --- | --- | --- | --- |
      | Finance office | Less overtime and agency-nurse spending | Little | Signs the contract |
      | Ward managers | Hours back from building rosters by hand | Blame when a shift is short | Consulted |
      | Nurses | Possibly fairer rotations | Short-notice changes, lost weekends, unsafe workloads | Usually none |
      | Patients | Staffing that tracks demand | Too few nurses on a busy night | None |
      | Vendor | Revenue and a reference customer | Reputation | Designs the model |

      A **stakeholder** is anyone who affects, or is affected by, the system. The table shows the usual pattern: the people who choose a system are often not the people who live with its mistakes. A good decision brings the second group into the room: a nurse representative on the project, and a way for any nurse to flag an unsafe roster.
    diagram:
      caption: Riverbend's stakeholder map. The people who carry the risk sit at the far end, with no channel back to the people who decide.
      description: The finance office, above the roster model, buys it, and the vendor, to its left, builds it. The model sends draft rosters to ward managers, who publish shifts to nurses. Nurses give care to patients. A dashed arrow from nurses back up to the finance office carries concerns, and that channel is often missing.
      nodes:
        - id: finance
          label: Finance office
          note: chooses and pays
          col: 1
          row: 0
        - id: vendor
          label: Vendor
          note: builds the model
          col: 0
          row: 1
          tone: muted
        - id: model
          label: Roster model
          col: 1
          row: 1
          tone: accent
        - id: managers
          label: Ward managers
          note: review drafts
          col: 2
          row: 1
        - id: nurses
          label: Nurses
          note: work the shifts
          col: 3
          row: 1
          tone: warn
        - id: patients
          label: Patients
          note: receive the care
          col: 4
          row: 1
          tone: warn
      edges:
        - from: finance
          to: model
          label: buys
        - from: vendor
          to: model
          label: builds
        - from: model
          to: managers
          label: drafts
        - from: managers
          to: nurses
          label: shifts
        - from: nurses
          to: patients
          label: care
        - from: nurses
          to: finance
          label: concerns (often no channel)
          dashed: true
    bridges: []
  - id: stakeholders-and-deployment-decisions.s2
    title: Fewer errors, worse errors
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.stakeholders-and-deployment-decisions
    markdown: |-
      The vendor runs a 90-night trial on one ward. A night is *understaffed* if patients per nurse exceeded the ward's safe limit, and *overstaffed* if a nurse could have been sent elsewhere.

      | 90 nights | Old hand-built rosters | Model rosters |
      | --- | ---: | ---: |
      | Overstaffed nights | 25 | 10 |
      | Understaffed nights | 3 | 6 |
      | Total errors | 28 | 16 |
      | Overtime and agency cost | \$41,000 | \$29,000 |

      :::predict The vendor's report says errors fell from 28 to 16, a 43% improvement. Would you sign off?
      Not yet. Look at *which* errors changed. Overstaffing costs money, and it's reversible: a manager can move the extra nurse to a busier ward that night. Understaffing falls on patients and nurses, and it can't be undone: a late medication round has already happened. The model cut the cheap, fixable error and doubled the harmful, permanent one.
      :::

      So before adding errors together, write three things next to each kind: how often it happens, who absorbs it, and whether it can be undone. Six understaffed nights in 90 is one every fifteen nights, borne by people who had no say.

      :::mixup "A more accurate model is a safer model."
      Accuracy counts every error as equal, and deployment decisions almost never should. As the lesson on classification metrics showed, one summary number can hide exactly the errors you care about most. Ask which errors went down, which went up, and who pays for each.
      :::
    bridges: []
  - id: stakeholders-and-deployment-decisions.s3
    title: Compare against doing something else, including nothing
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.stakeholders-and-deployment-decisions
    markdown: |-
      Riverbend has at least three options, not two:

      | Option | Extra cost | Understaffing risk | Evidence so far |
      | --- | --- | --- | --- |
      | Keep hand-built rosters, add a float pool of 2 night nurses | Salaries for 2 nurses | Lowest | Used on other wards |
      | Show the model's forecast as advice; managers still write rosters | License | About today's level | None yet |
      | Let the model write rosters | License | Doubled in the trial | One 90-night trial |

      The first option has no AI in it, and it might be the right answer. The honest question is whether the model beats the best simple alternative, not whether it beats doing nothing. And check any claimed performance on your own patients.

      :::story The sepsis alert nobody had checked locally
      Hundreds of US hospitals switched on a sepsis-warning model built into Epic, their electronic health record system. In 2021, Andrew Wong and colleagues at Michigan Medicine tested it on about 38,000 of their own hospital stays. Its area under the ROC curve (the ranking score from the lesson on classification metrics, where 0.5 is chance) was 0.63, well below the 0.76 to 0.83 the developer had reported. It missed about two-thirds of sepsis cases while alerting on 18% of all patients, a recipe for alarm fatigue.
      :::
    bridges: []
  - id: stakeholders-and-deployment-decisions.s4
    title: A human who can actually say no
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.stakeholders-and-deployment-decisions
    markdown: |-
      Riverbend's plan says a charge nurse "reviews every roster." That protects no one if she gets two minutes on a Sunday night, can't see why the model staffed a ward as it did, and needs finance's signature to add a nurse. Meaningful oversight needs three things: **time** to look, **information** to judge (the forecast and its uncertainty, not just the roster), and **authority** to change the outcome without asking permission.

      Without those, people drift into accepting whatever the system suggests, a habit called **automation bias**. And the deployer can't hand the blame to the model.

      :::story Air Canada's chatbot, 2024
      After his grandmother died in 2022, Jake Moffatt asked Air Canada's website chatbot about bereavement fares. It told him he could claim the discount after travelling, contradicting the airline's own policy page. When he was refused, Air Canada argued that it couldn't be held liable for what the chatbot said. British Columbia's Civil Resolution Tribunal rejected this in February 2024: the airline is responsible for all the information on its website, chatbot included. It ordered Air Canada to compensate him.
      :::

      So Riverbend, not the vendor or the model, answers for an unsafe roster, and it must own the override button, the complaint channel, and the off switch.
    bridges: []
  - id: stakeholders-and-deployment-decisions.gates
    title: Set the gates before you see the results
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.stakeholders-and-deployment-decisions
    markdown: |-
      Riverbend's team picks the advice-only option and writes its rules down *before* the next trial, so good-looking results can't quietly move the goalposts:

      1. **Shadow mode** for 8 weeks: the model writes rosters nobody uses, and the team compares them with the real ones.
      2. **Gate to go live:** no more understaffed nights than the current process (3 per 90), and nurses rate schedule predictability no worse than today.
      3. **Staged rollout:** one ward for a month, then three.
      4. **Monitoring:** every week, count understaffed nights, manager overrides, and nurse incident reports.
      5. **Rollback trigger:** 2 understaffed nights in any 30 sends the ward back to hand-built rosters, which stay in use elsewhere so managers keep the skill.

      :::predict A month into the ward rollout, managers are overriding 40% of the model's suggested shifts. Success or failure?
      Neither yet; it's a signal to investigate. If the overrides prevented understaffed nights, the human check is working and the model isn't ready to run alone. Worry more about the opposite pattern: overrides falling to 2% while understaffed nights rise. That's automation bias.
      :::

      :::papers The NIST AI Risk Management Framework
      NIST's AI Risk Management Framework (January 2023) organizes this work into four functions. **Govern**: who decides and who can stop the system (Riverbend's off switch). **Map**: the context and the people affected (the stakeholder table). **Measure**: the errors, by type and by who bears them (the 90-night trial). **Manage**: act on what you measured (gates, monitoring, rollback).
      :::
    bridges: []
  - id: stakeholders-and-deployment-decisions.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.stakeholders-and-deployment-decisions
    markdown: Riverbend's roster trial, then a pothole map, a credit-limit rollout, a moderation queue, and a school attendance model test whether you can spot who carries the risk and which safeguard protects them.
    takeaway: |-
      Before deploying, map who gains, who bears each kind of error, and who decides. Compare against simpler options, write gates and a rollback plan in advance, and give the humans in the loop real authority.
  - id: stakeholders-and-deployment-decisions.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.stakeholders-and-deployment-decisions
    markdown: |-
      Before deployment, identify who benefits, who bears errors, and who can challenge an outcome. Compare the system with practical alternatives.
