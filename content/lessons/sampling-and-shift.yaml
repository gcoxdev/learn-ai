schema_version: 0.2-draft
lesson:
  id: sampling-and-shift
  version: 0.3.0-draft
  title: Who is represented by the data?
  state: draft
  summary: Check whether your examples represent the people and conditions you want to serve.
  slot: M03.6
  category: learning
  sources:
  - title: An Introduction to Statistical Learning — authors’ materials
    url: https://www.statlearning.com/
  - title: Dive into Deep Learning — authors’ open textbook
    url: https://d2l.ai/
objectives:
- id: objective.sampling-and-shift
  version: 1-draft
  statement: Sampling and deployment conditions determine which population a model’s results describe; distribution
    shift can change inputs, labels, or their relationships.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - sampling-and-shift.base
  - sampling-and-shift.transfer
  prerequisites:
  - anyOf:
    - objective.data
  - anyOf:
    - objective.random-variables
scenes:
- id: sampling-and-shift.s1
  title: Who do your examples describe?
  type: explanation
  depth: intuition
  objective_refs:
  - objective.sampling-and-shift
  markdown: 'A **population** is the full group you want to describe, such as all visitors to a museum. A **sample**
    is the smaller group you actually observe.


    Suppose 80 of 100 visitors who answer a website survey prefer audio guides. That is 80% of respondents.
    It may not be 80% of all visitors: people interested in audio guides could be more likely to answer. Before
    training on these responses, compare who answered with the people the model is meant to serve.'
  text_mode: 'A **population** is the full group you want to describe, such as all visitors to a museum. A
    **sample** is the smaller group you actually observe.


    Suppose 80 of 100 visitors who answer a website survey prefer audio guides. That is 80% of respondents.
    It may not be 80% of all visitors: people interested in audio guides could be more likely to answer. Before
    training on these responses, compare who answered with the people the model is meant to serve.'
  bridges: []
- id: sampling-and-shift.s2
  title: Three ways the data can change
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.sampling-and-shift
  markdown: 'A **distribution** describes possible values and how often they occur. The data a model encounters
    can change in several ways. For a delivery model:


    - More long-distance trips change the mix of inputs.

    - More late deliveries change how common the target category is.

    - A road closure changes how long a given trip takes, so the relationship between input and outcome changes.


    Several changes can happen together. Identifying them helps you decide what to investigate; it does not
    guarantee that one simple adjustment will fix the model.'
  text_mode: 'A **distribution** describes possible values and how often they occur. The data a model encounters
    can change in several ways. For a delivery model:


    - More long-distance trips change the mix of inputs.

    - More late deliveries change how common the target category is.

    - A road closure changes how long a given trip takes, so the relationship between input and outcome changes.


    Several changes can happen together. Identifying them helps you decide what to investigate; it does not
    guarantee that one simple adjustment will fix the model.'
  bridges: []
- id: sampling-and-shift.s3
  title: Consider a changing camera
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.sampling-and-shift
  markdown: A vision model trained on clear daytime images is evaluated at night. Lower light, motion blur,
    and different object frequencies can all change its inputs. More confidence on those images is not evidence
    of correctness. Collect representative evaluation cases and inspect errors by condition.
  text_mode: A vision model trained on clear daytime images is evaluated at night. Lower light, motion blur,
    and different object frequencies can all change its inputs. More confidence on those images is not evidence
    of correctness. Collect representative evaluation cases and inspect errors by condition.
  bridges: []
- id: sampling-and-shift.s4
  title: Measure coverage before claiming universality
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.sampling-and-shift
  markdown: Weighting or adaptation can help when their assumptions hold, but cannot recover information about
    groups absent from the data without additional evidence. Document sample selection, missing populations,
    and uncertainty. A model’s good average score can coexist with poor service to a smaller or newly encountered
    group.
  text_mode: Weighting or adaptation can help when their assumptions hold, but cannot recover information about
    groups absent from the data without additional evidence. Document sample selection, missing populations,
    and uncertainty. A model’s good average score can coexist with poor service to a smaller or newly encountered
    group.
  bridges: []
- id: sampling-and-shift.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.sampling-and-shift
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: Ask who and what your examples cover. When the conditions of use change, check whether the model
    still works for the people and situations it needs to serve.
- id: sampling-and-shift.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.sampling-and-shift
  markdown: Ask who and what your examples cover. When the conditions of use change, check whether the model
    still works for the people and situations it needs to serve.
  text_mode: Ask who and what your examples cover. When the conditions of use change, check whether the model
    still works for the people and situations it needs to serve.
