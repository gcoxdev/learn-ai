schema_version: 0.2-draft
lesson:
  id: sampling-and-shift
  version: 0.1.0-draft
  title: Who is represented by the data?
  state: draft
  summary: Sampling and deployment conditions determine which population a model’s results describe; distribution
    shift can change inputs, labels, or their relationships.
  slot: M03.6
  category: learning
  minutes: 12
  sources:
  - title: An Introduction to Statistical Learning — authors’ materials
    url: https://www.statlearning.com/
  - title: Dive into Deep Learning — authors’ open textbook
    url: https://d2l.ai/
objectives:
- id: objective.sampling-and-shift
  version: 1-draft
  statement: Sampling and deployment conditions determine which population a model’s results describe; distribution
    shift can change inputs, labels, or their relationships.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - sampling-and-shift.base
  - sampling-and-shift.transfer
  prerequisites:
  - anyOf:
    - objective.data
  - anyOf:
    - objective.random-variables
scenes:
- id: sampling-and-shift.s1
  title: Name the target population
  type: explanation
  depth: intuition
  objective_refs:
  - objective.sampling-and-shift
  markdown: A survey of people who click a banner represents respondents under that selection process, not automatically
    every visitor. A model trained on those records can inherit the selection pattern. Define who or what should
    be served, and compare that population with the data actually observed.
  text_mode: A survey of people who click a banner represents respondents under that selection process, not automatically
    every visitor. A model trained on those records can inherit the selection pattern. Define who or what should
    be served, and compare that population with the data actually observed.
  bridges: []
- id: sampling-and-shift.s2
  title: Separate kinds of change
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.sampling-and-shift
  markdown: Input distributions can change while the label relationship is relatively stable. Class prevalence can
    change. The relationship between inputs and outcomes can also change. These descriptions guide investigation,
    but real deployments can contain several shifts at once and may not satisfy the assumptions needed for a simple
    correction.
  text_mode: Input distributions can change while the label relationship is relatively stable. Class prevalence
    can change. The relationship between inputs and outcomes can also change. These descriptions guide investigation,
    but real deployments can contain several shifts at once and may not satisfy the assumptions needed for a simple
    correction.
  bridges: []
- id: sampling-and-shift.s3
  title: Consider a changing camera
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.sampling-and-shift
  markdown: A vision model trained on clear daytime images is evaluated at night. Lower light, motion blur, and
    different object frequencies can all change its inputs. More confidence on those images is not evidence of correctness.
    Collect representative evaluation cases and inspect errors by condition.
  text_mode: A vision model trained on clear daytime images is evaluated at night. Lower light, motion blur, and
    different object frequencies can all change its inputs. More confidence on those images is not evidence of correctness.
    Collect representative evaluation cases and inspect errors by condition.
  bridges: []
- id: sampling-and-shift.s4
  title: Measure coverage before claiming universality
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.sampling-and-shift
  markdown: Weighting or adaptation can help when their assumptions hold, but cannot recover information about groups
    absent from the data without additional evidence. Document sample selection, missing populations, and uncertainty.
    A model’s good average score can coexist with poor service to a smaller or newly encountered group.
  text_mode: Weighting or adaptation can help when their assumptions hold, but cannot recover information about
    groups absent from the data without additional evidence. Document sample selection, missing populations, and
    uncertainty. A model’s good average score can coexist with poor service to a smaller or newly encountered group.
  bridges: []
- id: sampling-and-shift.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.sampling-and-shift
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
- id: sampling-and-shift.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.sampling-and-shift
  markdown: Sampling and deployment conditions determine which population a model’s results describe; distribution
    shift can change inputs, labels, or their relationships.
  text_mode: Sampling and deployment conditions determine which population a model’s results describe; distribution
    shift can change inputs, labels, or their relationships.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - sampling-and-shift.s1
    - sampling-and-shift.s2
    - sampling-and-shift.s3
    - sampling-and-shift.s4
    - sampling-and-shift.check
    - sampling-and-shift.recap
    gate_refs:
    - gate.core
assessment_families:
- id: sampling-and-shift.base
  objective_ref: objective.sampling-and-shift
  task: base
  response_type: single_choice
  points: 1
  hint: 'Separate kinds of change: trace the inputs, operation, and result before choosing.'
  remediation_scene: sampling-and-shift.s2
  variants:
  - id: sampling-and-shift.base.1
    prompt: A voluntary online poll directly describes which observed group?
    options:
    - id: c
      text: Only people who disagreed
    - id: a
      text: People who responded under that collection process
    - id: b
      text: Every person in the country automatically
    answer: a
    feedback: Selection affects the population represented by observed data.
  - id: sampling-and-shift.base.2
    prompt: A rise in the frequency of positive labels is a change in what?
    options:
    - id: a
      text: Class prevalence
    - id: b
      text: The spelling of the model name
    - id: c
      text: Necessarily the processor type
    answer: a
    feedback: Label proportions can shift even without changing every conditional relationship.
- id: sampling-and-shift.transfer
  objective_ref: objective.sampling-and-shift
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Measure coverage before claiming universality: trace the inputs, operation, and result before choosing.'
  remediation_scene: sampling-and-shift.s4
  variants:
  - id: sampling-and-shift.transfer.1
    prompt: A daytime camera model moves to nighttime use. What should evaluation include?
    options:
    - id: a
      text: Representative nighttime conditions and error analysis
    - id: b
      text: Only the original daytime score
    - id: c
      text: Only a larger confidence threshold with no data
    answer: a
    feedback: The new conditions require evidence rather than an assumption of transfer.
  - id: sampling-and-shift.transfer.2
    prompt: Can reweighting fully establish performance on a population with no observed coverage?
    options:
    - id: b
      text: Yes; any missing group can be invented by weights
    - id: c
      text: Only if weights sum to one
    - id: a
      text: No; absent information limits what weighting can support
    answer: a
    feedback: Weighting changes emphasis on available information, not the existence of missing observations.
