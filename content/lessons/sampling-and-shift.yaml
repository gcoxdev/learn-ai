schema_version: 0.2-draft
lesson:
  id: sampling-and-shift
  version: 0.4.0-draft
  title: Who is represented by the data?
  state: draft
  summary: In 1936 a magazine polled 2.4 million people and called the election for the wrong man. Learn why size can't fix a skewed sample, and how the world shifts under a model.
  slot: M03.6
  category: learning
  sources:
    - title: An Introduction to Statistical Learning — authors’ materials
      url: https://www.statlearning.com/
    - title: Dive into Deep Learning — environment and distribution shift
      url: https://d2l.ai/chapter_linear-classification/environment-and-distribution-shift.html
    - title: "Why the 1936 Literary Digest Poll Failed (Squire, 1988)"
      url: https://doi.org/10.1086/269085
    - title: "The Parable of Google Flu: Traps in Big Data Analysis (Lazer et al., 2014)"
      url: https://doi.org/10.1126/science.1248506
objectives:
  - id: objective.sampling-and-shift
    version: 2-draft
    statement: Sampling and deployment conditions determine which population a model’s results describe; distribution shift can change inputs, labels, or their relationships.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - sampling-and-shift.base.v2
      - sampling-and-shift.transfer.v2
      - sampling-and-shift.weights.v2
    prerequisites:
      - anyOf:
          - objective.data
      - anyOf:
          - objective.random-variables
scenes:
  - id: sampling-and-shift.s1
    title: The poll with 2.4 million answers
    type: explanation
    depth: intuition
    objective_refs:
      - objective.sampling-and-shift
    markdown: |-
      In 1936, the *Literary Digest*, a popular American magazine, ran one of the biggest election polls ever. It mailed about 10 million ballots and got about 2.4 million back. Its verdict: Alf Landon would beat President Franklin Roosevelt, who would get only about 43% of the vote.

      Roosevelt won about 61% of the vote and 46 of the 48 states. A young pollster named George Gallup, asking only about 50,000 people, had called Roosevelt the winner.

      The **population** is the whole group you want to learn about: every voter. The **sample** is the part you actually observe: the 2.4 million returned ballots. When the way a sample is chosen makes it systematically different from the population, that's **sampling bias**. Every training set faces this risk: a model learns about whoever made it into the data.

      :::story How the biggest poll went wrong
      The Digest built its mailing list largely from telephone directories, car registrations, and its own subscribers. In the Great Depression, people with phones and cars were better off than average, and better-off voters leaned toward Landon. Only about a quarter of the ballots came back, and later analysis (Squire, 1988) suggests Landon's supporters were keener to return them. Two filters, tilted the same way. Gallup's much smaller sample was chosen to mirror the whole electorate, so it came far closer. The Digest folded within two years.
      :::
    diagram:
      caption: Two filters stood between the voters and the Digest's prediction, and both tilted toward Landon.
      description: All voters pass through the mailing list, which kept mostly people with phones, cars, or subscriptions. The mailing list then passes through a second filter, the voters who chose to mail ballots back. Those returned ballots produced the prediction that Landon would win.
      nodes:
        - id: voters
          label: All voters
          note: the population
          col: 0
          row: 0
          tone: data
        - id: list
          label: Mailing list
          note: phones, cars, readers
          col: 2
          row: 0
          tone: warn
        - id: returned
          label: Returned ballots
          note: the sample, 2.4 million
          col: 2
          row: 1
          tone: warn
        - id: result
          label: Landon wins
          note: the Digest's forecast
          col: 0
          row: 1
          tone: accent
      edges:
        - from: voters
          to: list
          label: who got a ballot
        - from: list
          to: returned
          label: who mailed it back
        - from: returned
          to: result
  - id: sampling-and-shift.s5
    title: A bigger biased sample is still biased
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.sampling-and-shift
    markdown: |-
      :::predict If the Digest had mailed 20 million ballots instead of 10 million, would its prediction have been closer?
      No. Twice the ballots, sent through the same two filters, gives twice as many answers with the same tilt. More data shrinks random wobble, not bias.
      :::

      Check it yourself. In this town of 200,000 voters, 61% back candidate R. The mail poll uses two tilted filters like the Digest's; the other poll picks 1,000 voters at random.

      ```python run
      import random
      random.seed(1936)

      # A town where 61% of voters back candidate R.
      voters = ["R" if random.random() < 0.61 else "L" for _ in range(200_000)]

      def share_R(sample):
          return 100 * sample.count("R") / len(sample)

      # Biased poll: L voters are more likely to be on the mailing list
      # (40% vs 30%) and more likely to mail the ballot back (30% vs 20%).
      listed = {"R": 0.30, "L": 0.40}
      replies = {"R": 0.20, "L": 0.30}
      mail_poll = [v for v in voters if random.random() < listed[v] * replies[v]]

      # Small poll: 1,000 voters picked completely at random.
      random_poll = random.sample(voters, 1000)

      print(f"truth:        R has {share_R(voters):.1f}%")
      print(f"mail poll:    R has {share_R(mail_poll):.1f}%   ({len(mail_poll):,} replies)")
      print(f"random poll:  R has {share_R(random_poll):.1f}%   (1,000 replies)")
      ```

      The mail poll's 16,625 replies say R has 44.1%. The random poll's 1,000 replies say 63.0%, within two points of the true 61.1%. Change `200_000` to `2_000_000`: the mail poll grows to about 167,000 replies and still says about 44%. Then make both `listed` values 0.30 and both `replies` values 0.20, and the mail poll snaps back to the truth.
  - id: sampling-and-shift.s6
    title: Reweighting fixes some skews, not all
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.sampling-and-shift
    markdown: |-
      Sometimes you can repair a skewed sample. A museum's website survey asks, "Would you use an audio guide?" Of 100 replies, 80 come from visitors under 40, yet ticket sales show visitors are split 50/50 by age.

      | Group | Replies | Say yes | Share of real visitors |
      | --- | ---: | ---: | ---: |
      | Under 40 | 80 | 72 (90%) | 50% |
      | 40 and over | 20 | 8 (40%) | 50% |

      The raw answer is (72 + 8) ÷ 100 = 80%, but younger visitors are over-represented. **Reweighting** counts each group by its share of the real population, not its share of the replies:

      $$\text{estimate} = 0.5 \times 90\% + 0.5 \times 40\% = 65\%$$

      Machine learning calls this **importance weighting**: each example's weight is how common its kind is in real use divided by how common it is in the data (here 0.5 ÷ 0.8 = 0.625 per under-40 reply and 0.5 ÷ 0.2 = 2.5 per older one).

      But reweighting only stretches the answers you have. If school groups never visit the website, they have zero replies, and no weight times zero tells you what they think. For them, collect new responses, perhaps with paper forms at the door.
  - id: sampling-and-shift.s2
    title: Three ways the world can move
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.sampling-and-shift
    markdown: |-
      Even a perfect sample describes the world *when it was collected*. When the data a model meets in use differs from its training data, that's **distribution shift**, which you met in the first module. It comes in three main kinds, shown here for Priya's leaf app and a flu clinic:

      | Kind | What changes | Leaf app | Flu clinic |
      | --- | --- | --- | --- |
      | **Covariate shift** | The mix of inputs | More photos taken at dusk | A new branch near a retirement village |
      | **Label shift** | How common each outcome is | Wet summer: blight rises from 5% to 30% of photos | Flu season: flu rises from 2% to 30% of visits |
      | **Concept shift** | What a given input means | A new disease whose spots look like early blight | A new virus: fever and cough may not mean flu |

      Covariate shift sends a model into territory it rarely saw, though each input's right answer hasn't changed. Label shift (also called prior shift) keeps each outcome looking the same but makes the model's sense of "how likely" out of date. Concept shift is the worst: the old answers are now wrong, and only fresh labeled data can teach the new ones.

      :::predict Scammers start writing polite, typo-free emails that look just like the ones a spam filter learned to trust. Which kind of shift is that?
      Concept shift: the inputs look like the old safe emails, but their right label has changed. Google Flu Trends, which estimated flu levels from searches, hit a version of this in 2012–13: it badly overestimated flu, partly because news coverage and changes to Google's own search tools shifted what people searched for (Lazer et al., 2014).
      :::
  - id: sampling-and-shift.s3
    title: The night-shift camera
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.sampling-and-shift
    markdown: |-
      A parking-lot camera learned to read license plates from daytime photos, and now runs around the clock. A test split by condition shows:

      | Test photos | Share of real traffic | Read correctly |
      | --- | ---: | ---: |
      | Daytime | 80% | 96% |
      | Night | 20% | 71% |
      | **Overall** | 100% | 0.8 × 96 + 0.2 × 71 = 91% |

      A 91% average sounds fine. But more than one plate in four is misread at night, exactly when the lot's owner most needs the camera. Only splitting the results by condition revealed it.

      :::mixup "The model is still confident on night photos, so it must be doing fine."
      Confidence is the model's own opinion, and under shift it's often badly off: a model can be 99% sure of a plate it misread. Only labeled examples from the new condition show how it's really doing.
      :::
  - id: sampling-and-shift.s4
    title: The delivery company goes to the suburbs
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.sampling-and-shift
    markdown: |-
      A delivery company's time estimates were trained on city trips. Next month it adds suburban routes, about a quarter of all deliveries. Here's what its data team does:

      1. **Name the shift.** More long trips is covariate shift. Highway routes may also change how distance turns into minutes: possible concept shift.
      2. **Check coverage.** Only 40 of 20,000 training trips are over 15 miles. Reweighting 40 trips can't stand in for thousands of new routes.
      3. **Collect and test.** Drivers run 300 suburban deliveries. The model's average error there is 9 minutes, against 3 in the city.
      4. **Decide.** Retrain with the suburban data; until then, show suburban customers a wider arrival window.
      5. **Keep watching.** Report city and suburban error separately every week, so the next shift shows up in a chart, not in complaints.
  - id: sampling-and-shift.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.sampling-and-shift
    markdown: Reweight four skewed surveys by hand, then name the shift and the fix for house prices, flu season, card fraud, a drought, and a voice assistant.
    takeaway: |-
      A sample describes the people and conditions that got into it, and a bigger sample from the same skewed source is still skewed. When the world moves, name the kind of shift, test on data from the new conditions, and collect what's missing.
  - id: sampling-and-shift.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.sampling-and-shift
    markdown: |-
      Ask who and what your examples cover. When the conditions of use change, check whether the model still works for the people and situations it needs to serve.
