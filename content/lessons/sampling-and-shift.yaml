assessment_families:
  - id: sampling-and-shift.base
    objective_ref: objective.sampling-and-shift
    task: base
    response_type: single_choice
    points: 1
    hint: 'Separate kinds of change: trace the inputs, operation, and result before choosing.'
    remediation_scene: sampling-and-shift.s2
    variants:
      - id: sampling-and-shift.base.1
        prompt: A voluntary online poll directly describes which observed group?
        options:
          - id: c
            text: Only people who disagreed
          - id: a
            text: People who responded under that collection process
          - id: b
            text: Every person in the country automatically
        answer: a
        feedback: Selection affects the population represented by observed data.
        retired: true
      - id: sampling-and-shift.base.2
        prompt: A rise in the frequency of positive labels is a change in what?
        options:
          - id: a
            text: Class prevalence
          - id: b
            text: The spelling of the model name
          - id: c
            text: Necessarily the processor type
        answer: a
        feedback: Label proportions can shift even without changing every conditional relationship.
        retired: true
  - id: sampling-and-shift.transfer
    objective_ref: objective.sampling-and-shift
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Measure coverage before claiming universality: trace the inputs, operation, and result before choosing.'
    remediation_scene: sampling-and-shift.s4
    variants:
      - id: sampling-and-shift.transfer.1
        prompt: A daytime camera model moves to nighttime use. What should evaluation include?
        options:
          - id: a
            text: Representative nighttime conditions and error analysis
          - id: b
            text: Only the original daytime score
          - id: c
            text: Only a larger confidence threshold with no data
        answer: a
        feedback: The new conditions require evidence rather than an assumption of transfer.
        retired: true
      - id: sampling-and-shift.transfer.2
        prompt: Can reweighting fully establish performance on a population with no observed coverage?
        options:
          - id: b
            text: Yes; any missing group can be invented by weights
          - id: c
            text: Only if weights sum to one
          - id: a
            text: No; absent information limits what weighting can support
        answer: a
        feedback: Weighting changes emphasis on available information, not the existence of missing observations.
        retired: true
  - id: sampling-and-shift.base.v2
    objective_ref: objective.sampling-and-shift
    task: base
    response_type: single_choice
    points: 1
    hint: "Ask what changed: who got into the sample, the mix of inputs, how common each outcome is, or what a given input now means."
    remediation_scene: sampling-and-shift.s2
    variants:
      - id: sampling-and-shift.base.v2.1
        prompt: A magazine's reader poll gets 2 million replies; a pollster's random sample gets 50,000. Their predictions disagree, and the small poll turns out right. Why?
        options:
          - id: b
            text: Big polls collect more careless answers, which adds noise
          - id: a
            text: The magazine's sample was tilted, and more replies can't undo a tilt
          - id: c
            text: The small poll was lucky; it would usually lose to 2 million replies
        answer: a
        feedback: Who ends up in a sample matters more than how many. A larger sample shrinks random wobble, but every extra reply from the same tilted source carries the same tilt. Luck can't explain a gap this large with 50,000 random replies.
      - id: sampling-and-shift.base.v2.2
        prompt: A house-price model trained on city apartments is used in the suburbs, where homes are much larger. Price per square foot follows the same pattern as before. Which shift is this?
        options:
          - id: c
            text: Concept shift, because the model now sees different houses
          - id: b
            text: Label shift, because suburban prices are higher on average
          - id: a
            text: Covariate shift, because the mix of inputs has changed
        answer: a
        feedback: The inputs (house sizes) moved into a new range, but the link between size and price held, which is covariate shift. Concept shift would mean the same house now sells for a different price.
      - id: sampling-and-shift.base.v2.3
        prompt: In flu season, flu jumps from 2% of a clinic's visits to 30%, though flu patients show the same symptoms as ever. Which shift is this?
        options:
          - id: a
            text: Label shift, because how common each diagnosis is has changed
          - id: b
            text: Concept shift, because the right diagnosis for symptoms changed
          - id: c
            text: Covariate shift, because the patients are older in the winter
        answer: a
        feedback: The share of each outcome changed while each outcome looks the same, which is label (prior) shift. Nothing says the meaning of the symptoms changed, which concept shift would require, and nothing says the patients got older.
      - id: sampling-and-shift.base.v2.4
        prompt: Fraudsters start copying the exact shopping habits of real customers, so purchases that used to mean "safe" now often mean "fraud." Which shift is this?
        options:
          - id: b
            text: Covariate shift, because customers are buying different things
          - id: a
            text: Concept shift, because the same inputs now call for a new label
          - id: c
            text: Label shift, because fraud is now slightly more common
        answer: a
        feedback: The inputs look the same as before, but the correct answer for them has changed, which is concept shift. That's the hardest kind to fix, because only freshly labeled examples can teach the new meaning.
  - id: sampling-and-shift.transfer.v2
    objective_ref: objective.sampling-and-shift
    task: transfer
    response_type: single_choice
    points: 1
    hint: Name who or what is missing or has changed, then choose the action that brings real evidence about that group into view. Averages and reweighting can't show you what isn't there.
    remediation_scene: sampling-and-shift.s4
    variants:
      - id: sampling-and-shift.transfer.v2.1
        prompt: A restaurant app surveys people who open it every day and concludes that most diners want late-night delivery. It wants to know about all its diners. What's the main problem?
        options:
          - id: c
            text: The survey is too small, so it needs twice as many replies
          - id: b
            text: Daily users differ from occasional ones, so the sample is tilted
          - id: a
            text: The question was worded as yes or no, so the answers are vague
        answer: b
        feedback: Heavy users are a special slice of diners, so their answers can't stand in for everyone. Doubling the replies from the same slice would keep the same tilt; the fix is to reach occasional users too.
      - id: sampling-and-shift.transfer.v2.2
        prompt: A crop-yield model was trained on ten years that were all wet. This year is a severe drought. Before trusting its forecast, what should the team do?
        options:
          - id: b
            text: Rely on its confidence, since the model is sure about this year
          - id: c
            text: Reweight the wet years so that drier ones count for more
          - id: a
            text: Test it on yields from past droughts, or collect drought data
        answer: a
        feedback: A drought is far outside anything the model trained on, so only evidence from dry years can show how it behaves. Its confidence isn't evidence, and reweighting wet years can't create drought examples that don't exist.
      - id: sampling-and-shift.transfer.v2.3
        prompt: A voice assistant is 95% accurate overall but 70% accurate for speakers with a strong regional accent, who make up 5% of users. What should the team report?
        options:
          - id: a
            text: Accuracy for each group of speakers, alongside the overall figure
          - id: b
            text: The 95% overall figure, since it covers the full set of users
          - id: c
            text: The 95% figure, with the accent group removed as an outlier
        answer: a
        feedback: An average weighted toward the majority hides the 70%, and those users are real customers, not outliers. Reporting by group makes the gap visible so it can be fixed.
      - id: sampling-and-shift.transfer.v2.4
        prompt: An online health survey has plenty of replies from people under 70 but none from anyone older. The team wants results for all adults. What should it do?
        options:
          - id: c
            text: Give the oldest respondents in the sample much larger weights
          - id: a
            text: Collect new responses from people over 70, perhaps by phone or mail
          - id: b
            text: Assume people over 70 answer like people in their sixties
        answer: a
        feedback: Reweighting stretches answers you have; with zero replies from a group, there's nothing to stretch. Weighting up the 69-year-olds or assuming they speak for older adults is a guess. New responses are the only real evidence.
  - id: sampling-and-shift.weights.v2
    objective_ref: objective.sampling-and-shift
    task: base
    response_type: numeric
    points: 1
    hint: Weight each group's "yes" rate by that group's share of the real population, not by its share of the replies. Then add the weighted rates.
    remediation_scene: sampling-and-shift.s6
    absolute_tolerance: 0.5
    variants:
      - id: sampling-and-shift.weights.v2.1
        prompt: A survey gets 60 replies from city residents (70% say yes) and 40 from rural residents (30% say yes). The real population is 30% city and 70% rural. What is the reweighted "yes" percentage?
        answer: 42
        feedback: 0.3 × 70 + 0.7 × 30 = 21 + 21 = 42%. The raw sample would give 0.6 × 70 + 0.4 × 30 = 54%, because city residents are over-represented.
      - id: sampling-and-shift.weights.v2.2
        prompt: A campus survey gets 50 replies from students (80% like the new menu) and 50 from staff (20% like it). The campus is 90% students and 10% staff. What is the reweighted percentage who like the menu?
        answer: 74
        feedback: 0.9 × 80 + 0.1 × 20 = 72 + 2 = 74%. The raw 50/50 sample gives 50%, which gives staff far more say than their share of the campus.
      - id: sampling-and-shift.weights.v2.3
        prompt: A gym survey gets 25 replies from weekday members (60% want longer hours) and 75 from weekend members (20% want them). Members are really split 50/50. What is the reweighted percentage?
        answer: 40
        feedback: 0.5 × 60 + 0.5 × 20 = 30 + 10 = 40%. The raw sample says 0.25 × 60 + 0.75 × 20 = 30%, because weekend members replied more.
      - id: sampling-and-shift.weights.v2.4
        prompt: A museum survey gets 90 replies from visitors under 40 (80% want an audio guide) and 10 from visitors 40 and over (50% want one). Visitors are really 60% under 40 and 40% older. What is the reweighted percentage?
        answer: 68
        feedback: 0.6 × 80 + 0.4 × 50 = 48 + 20 = 68%. The raw sample gives 0.9 × 80 + 0.1 × 50 = 77%, because younger visitors are over-represented.
