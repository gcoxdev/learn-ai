assessment_families:
  - id: bias-variance.base
    objective_ref: objective.bias-variance
    task: base
    response_type: single_choice
    points: 1
    hint: 'Imagine repeating the dataset: trace the inputs, operation, and result before choosing.'
    remediation_scene: bias-variance.s2
    variants:
      - id: bias-variance.base.1
        prompt: A model fits random training noise and worsens on new data. What is this pattern called?
        options:
          - id: a
            text: Overfitting
          - id: b
            text: Guaranteed optimality
          - id: c
            text: Only underflow
        answer: a
        feedback: The model captured sample-specific variation that does not transfer.
        retired: true
      - id: bias-variance.base.2
        prompt: What does estimator variance describe?
        options:
          - id: b
            text: Only the spread of label names
          - id: c
            text: A fixed physical constant for each architecture
          - id: a
            text: Sensitivity of the fit across sampled datasets
        answer: a
        feedback: Variance concerns the behavior of an estimation procedure under resampling.
        retired: true
  - id: bias-variance.transfer
    objective_ref: objective.bias-variance
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Read learning curves: trace the inputs, operation, and result before choosing.'
    remediation_scene: bias-variance.s4
    variants:
      - id: bias-variance.transfer.1
        prompt: Regularization lowers validation error while raising training error. Can that be useful?
        options:
          - id: b
            text: No; training error is the only objective that matters
          - id: c
            text: Only if validation labels are hidden forever
          - id: a
            text: Yes; less sample fitting can improve transfer
        answer: a
        feedback: A deliberate complexity preference can improve generalization.
        retired: true
      - id: bias-variance.transfer.2
        prompt: Both training and validation errors are high. Is overfitting the only explanation?
        options:
          - id: c
            text: Only the model’s age matters
          - id: a
            text: No; underfitting, weak information, or noise may matter
          - id: b
            text: Yes; high error always means overfitting
        answer: a
        feedback: Diagnostic patterns require examining data, model, and objective together.
        retired: true
  - id: bias-variance.base.v2
    objective_ref: objective.bias-variance
    task: base
    response_type: single_choice
    points: 1
    hint: Imagine refitting on many fresh samples. Error that survives averaging the refits is bias; error that comes from refits disagreeing is variance; noise in the target can't be removed by any model.
    remediation_scene: bias-variance.s2
    variants:
      - id: bias-variance.base.v2.1
        prompt: Five hundred teams each fit a straight line to their own noisy sample from the same curved relationship. Their lines are nearly identical, and all of them miss the peak. How would you describe this error?
        options:
          - id: b
            text: High variance, because each line misses the peak
          - id: a
            text: High bias, because the average line misses the peak
          - id: c
            text: Mostly noise, because the samples were noisy
        answer: a
        feedback: The lines agree with each other (low variance) but share the same systematic miss, which is bias. Noise would scatter individual points, not make every fitted line miss the peak the same way.
      - id: bias-variance.base.v2.2
        prompt: A degree-12 polynomial passes exactly through 13 training points. Refit on fresh samples, the curves swing in very different directions between the points. Which part of the error dominates?
        options:
          - id: c
            text: Bias, since the curve is so complicated
          - id: a
            text: Noise, since the points were measured with error
          - id: b
            text: Variance, since the refits disagree so much
        answer: b
        feedback: Disagreement between refits on different samples is exactly what variance measures. A flexible curve can have almost no bias, because its average over many samples tracks the truth.
      - id: bias-variance.base.v2.3
        prompt: In the decomposition of expected squared error into bias², variance, and noise, which part stays the same no matter which model you choose?
        options:
          - id: a
            text: The noise term σ²
          - id: b
            text: The variance term
          - id: c
            text: The bias² term
        answer: a
        feedback: σ² is the randomness in the target itself, such as sensor error, so no prediction can remove it. Bias and variance both change with the model's flexibility, the amount of data, and regularization.
      - id: bias-variance.base.v2.4
        prompt: A straight-line model of a curved pattern has test MSE 0.30, and the noise variance is 0.09. Doubling the training data barely changes its error. What is the best explanation?
        options:
          - id: c
            text: Its error has reached the noise floor of 0.09
          - id: b
            text: Doubling the data raised its variance
          - id: a
            text: Its error is mostly bias, which more data leaves alone
        answer: a
        feedback: More data shrinks variance, but a straight line misses a curve the same way however many points it sees. The error of 0.30 is far above the noise floor of 0.09, so the floor isn't the limit.
      - id: bias-variance.base.v2.5
        prompt: You fit a degree-9 polynomial with a ridge penalty and raise λ from nearly 0 to a large value. What happens to bias and variance?
        options:
          - id: b
            text: Bias falls and variance rises
          - id: a
            text: Bias rises and variance falls
          - id: c
            text: Both fall, which is why ridge helps
        answer: a
        feedback: The penalty pulls coefficients toward zero, which steadies the curve across samples (less variance) but flattens it away from the truth (more bias). Ridge helps when the variance saved is larger than the bias added, not because both fall.
  - id: bias-variance.transfer.v2
    objective_ref: objective.bias-variance
    task: transfer
    response_type: single_choice
    points: 1
    hint: Read the training error first. If it's already too high, the model is too rigid; if it's low but validation error is much higher, the model is too sensitive to its sample.
    remediation_scene: bias-variance.s4
    variants:
      - id: bias-variance.transfer.v2.1
        prompt: A delivery-time model has a training error of 14 minutes and a validation error of 15 minutes. The business needs under 5. What is the most promising next step?
        options:
          - id: b
            text: Collect ten times more of the same kind of data
          - id: c
            text: Add a stronger regularization penalty
          - id: a
            text: Add informative inputs or use a more flexible model
        answer: a
        feedback: Both errors are high and close together, the signature of bias, so the model needs more capacity or better inputs. More data mainly reduces variance, and a stronger penalty would make the model even more rigid.
      - id: bias-variance.transfer.v2.2
        prompt: A crop-yield model has 2% training error and 19% validation error. Which change is most likely to help?
        options:
          - id: a
            text: A stronger penalty on complexity, or more training farms
          - id: b
            text: A more flexible model with extra layers and features
          - id: c
            text: Training for longer until training error reaches 0%
        answer: a
        feedback: A 17-point gap with low training error points to high variance, which regularization and more data reduce. A more flexible model or longer training would push training error down and widen the gap.
      - id: bias-variance.transfer.v2.3
        prompt: As a speech model's training set grows from 1,000 to 50,000 clips, validation error falls from 30% to 12% while training error rises from 1% to 9%. How should you read this?
        options:
          - id: b
            text: The model is underfitting more as the data grows
          - id: a
            text: The gap is closing as variance falls, so data is helping
          - id: c
            text: Rising training error shows the pipeline broke
        answer: a
        feedback: A flexible model can memorize a small set (1% training error) but not a large one, so training error rises while validation error falls, and the gap shrinks from 29 to 3 points. That is the high-variance learning curve improving, not a failure.
      - id: bias-variance.transfer.v2.4
        prompt: A forecaster averages the predictions of 50 decision trees, each trained on a different resample of the same data. Which part of the error does the averaging mainly reduce?
        options:
          - id: c
            text: The bias of each individual tree
          - id: b
            text: The noise in the recorded weather
          - id: a
            text: The variance across the individual trees
        answer: a
        feedback: Trees trained on different resamples disagree, and averaging cancels much of that disagreement, which is variance. The average of many similar trees keeps roughly their shared bias, and no model removes noise in the target.
  - id: bias-variance.calculate
    objective_ref: objective.bias-variance
    task: base
    response_type: numeric
    points: 1
    hint: Expected squared error = bias² + variance + σ². If you're given the noise standard deviation, square it first.
    remediation_scene: bias-variance.s2
    absolute_tolerance: 0.005
    variants:
      - id: bias-variance.calculate.1
        prompt: A model has bias² = 0.04 and variance = 0.10, and the noise has standard deviation 0.2. What expected squared error on new data does the decomposition predict?
        answer: 0.18
        feedback: σ² = 0.2² = 0.04, so 0.04 + 0.10 + 0.04 = 0.18.
      - id: bias-variance.calculate.2
        prompt: A model's expected test MSE is 0.50, its bias² is 0.05, and the noise variance σ² is 0.25. What is its variance?
        answer: 0.2
        feedback: 0.50 − 0.05 − 0.25 = 0.20.
      - id: bias-variance.calculate.3
        prompt: At one input, four refits on different samples predict 2, 4, 3, and 3. The true value is 2.5. What is the bias² at this input?
        answer: 0.25
        feedback: The average prediction is 12/4 = 3, which misses 2.5 by 0.5, and 0.5² = 0.25.
      - id: bias-variance.calculate.4
        prompt: At one input, four refits predict 2, 4, 3, and 3. What is their variance (the average squared distance from their mean)?
        answer: 0.5
        feedback: The mean is 3; the squared distances are 1, 1, 0, 0, which average to 2/4 = 0.5.
      - id: bias-variance.calculate.5
        prompt: A model has bias² = 0.10 and variance = 0.15, and the noise has standard deviation 0.5. What is the expected squared error on new data?
        answer: 0.5
        feedback: σ² = 0.5² = 0.25, so 0.10 + 0.15 + 0.25 = 0.50.
