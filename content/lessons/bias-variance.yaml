schema_version: 0.2-draft
lesson:
  id: bias-variance
  version: 0.4.0-draft
  title: Why a simpler model can predict better
  state: draft
  summary: Draw a straight line, a gentle curve, and a wild curve through ten noisy tide readings. The wildest fits perfectly and predicts worst. Three numbers explain why.
  slot: M09.2
  category: learning
  sources:
    - title: An Introduction to Statistical Learning — authors’ materials
      url: https://www.statlearning.com/
    - title: Dive into Deep Learning — authors’ open textbook
      url: https://d2l.ai/
    - title: Pattern Recognition and Machine Learning, chapter 1 (Bishop, 2006)
      url: https://www.microsoft.com/en-us/research/publication/pattern-recognition-machine-learning/
objectives:
  - id: objective.bias-variance
    version: 2-draft
    statement: Underfitting and overfitting describe failures of fit and transfer; bias, variance, and regularization help explain how model choices interact with sample size and noise.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - bias-variance.base.v2
      - bias-variance.transfer.v2
      - bias-variance.calculate
    prerequisites:
      - anyOf:
          - objective.generalization
scenes:
  - id: bias-variance.s1
    title: Three curves through ten tide readings
    type: explanation
    depth: intuition
    objective_refs:
      - objective.bias-variance
    markdown: |-
      A harbor sensor records the water level ten times, evenly spaced over one tide cycle. The real tide is a smooth wave, but the cheap sensor's readings are typically off by about 30 cm. You want a curve that predicts the level between readings.

      You try three polynomials. A **polynomial of degree d** is a curve built from powers of time up to $t^d$: degree 1 is a straight line, degree 3 can bend twice, and degree 9 has ten coefficients, just enough to pass through all ten readings.

      - *Degree 1* slants through the wave, missing high and low water, and it would miss the same way with any ten readings. It's too rigid for the pattern: **underfitting**.
      - *Degree 3* rises, falls, and rises again, like the tide, passing near most readings but not through them.
      - *Degree 9* threads through every reading, swinging wildly between them to do it. It has fit the noise as if it were tide: **overfitting**.

      :::predict Which degree has the lowest error on its ten training readings? Which does best on 1,000 new readings?
      Degree 9 is perfect on its training readings, and degree 3 wins on new ones. Errors here are **mean squared error (MSE)**, the average squared gap between prediction and reading, in square meters:

      | Degree | Training MSE | Test MSE (1,000 new readings) |
      | --- | ---: | ---: |
      | 1 (straight line) | 0.220 | 0.325 |
      | 3 (gentle curve) | 0.086 | 0.125 |
      | 9 (through every point) | 0.000 | 0.701 |

      Training error falls as the curve gets more flexible; test error falls, then shoots back up, the classic U shape. No curve can average much below 0.09 on new readings, because that's the sensor noise itself (0.3² = 0.09).
      :::
    bridges: []
  - id: bias-variance.fit
    title: Fit the three curves yourself
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.bias-variance
    markdown: |-
      This program makes the ten readings and 1,000 fresh test readings, fits each polynomial with `np.polyfit`, and prints the table you just saw.

      ```python run
      import numpy as np

      rng = np.random.default_rng(2)

      def tide(t):
          """True tide height in meters over one cycle (t runs from 0 to 1)."""
          return np.sin(2 * np.pi * t)

      train_t = np.linspace(0, 1, 10)                     # 10 evenly spaced readings
      train_h = tide(train_t) + rng.normal(0, 0.3, 10)   # sensor noise, sd 0.3 m
      test_t = rng.uniform(0, 1, 1000)                    # 1,000 new readings
      test_h = tide(test_t) + rng.normal(0, 0.3, 1000)

      for degree in [1, 3, 9]:
          coefs = np.polyfit(train_t, train_h, degree)
          train_mse = np.mean((np.polyval(coefs, train_t) - train_h) ** 2)
          test_mse = np.mean((np.polyval(coefs, test_t) - test_h) ** 2)
          print(f"degree {degree}: train MSE {train_mse:.3f}   test MSE {test_mse:.3f}")
      ```

      :::try Change the seed
      Change `default_rng(2)` to `default_rng(6)`. The numbers move, but the pattern holds: degree 9 has zero training error and the worst test error, and degree 3 wins. Add degrees 5 and 7 to the list to watch training error keep falling while test error turns around.
      :::
  - id: bias-variance.s2
    title: Imagine 500 sensors in the same harbor
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.bias-variance
    markdown: |-
      One fit mixes two kinds of error. To pull them apart, picture 500 identical sensors in the same harbor, each recording its own ten noisy readings, with a curve fitted to each.

      - **Bias** is how far the *average* of the 500 curves sits from the true tide. The straight lines all tilt the same way, so their average misses high water too.
      - **Variance** is how much the 500 curves disagree with one another. Each degree-9 curve chases its own sensor's noise, so they splay apart between readings, even though their average traces the tide almost perfectly.

      ```python run
      import numpy as np

      rng = np.random.default_rng(0)
      tide = lambda t: np.sin(2 * np.pi * t)   # the true tide
      n = 10                                   # readings per sensor
      train_t = np.linspace(0, 1, n)
      grid = np.linspace(0, 1, 101)            # times where we compare curves
      sigma = 0.3                              # sensor noise, sd in meters

      for degree in [1, 3, 9]:
          preds = []
          for _ in range(500):                 # 500 imaginary sensors
              h = tide(train_t) + rng.normal(0, sigma, n)
              preds.append(np.polyval(np.polyfit(train_t, h, degree), grid))
          preds = np.array(preds)              # 500 curves x 101 times
          bias2 = np.mean((preds.mean(axis=0) - tide(grid)) ** 2)
          var = np.mean(preds.var(axis=0))
          print(f"degree {degree}: bias^2 {bias2:.3f}  variance {var:.3f}  "
                f"noise {sigma**2:.3f}  total {bias2 + var + sigma**2:.3f}")
      ```

      | Degree | Bias² | Variance | Noise | Total |
      | --- | ---: | ---: | ---: | ---: |
      | 1 | **0.225** | 0.016 | 0.090 | 0.331 |
      | 3 | 0.007 | 0.031 | 0.090 | 0.127 |
      | 9 | 0.001 | **0.623** | 0.090 | 0.714 |

      The straight line's error is almost all bias; degree 9's is almost all variance. The totals closely match the single-sensor test errors in the first table (0.325, 0.125, 0.701).

      :::papers The bias–variance decomposition
      $$\mathbb{E}\big[(y-\hat f(x))^2\big] = \underbrace{\big(\mathbb{E}[\hat f(x)] - f(x)\big)^2}_{\text{bias}^2} + \underbrace{\mathbb{E}\big[(\hat f(x) - \mathbb{E}[\hat f(x)])^2\big]}_{\text{variance}} + \sigma^2$$

      $f(x)$ is the true tide at time $x$, and $\hat f(x)$ is a fitted curve's prediction, which is random because its training readings were. $\mathbb{E}[\hat f(x)]$ is the average over all possible training sets (our 500 sensors), and $y$ is a fresh noisy reading with noise variance $\sigma^2 = 0.09$. For degree 3: $0.007 + 0.031 + 0.090 \approx 0.127$. This exact split holds for squared error.
      :::

      :::mixup "Bias here is the bias number inside a neuron, or unfairness."
      Same word, three meanings. Statistical bias is the systematic miss of the *average* fit. A neuron's bias is an added constant. Unfair treatment of groups is covered in the safety module.
      :::
  - id: bias-variance.s3
    title: Three cures for variance, and what they cost
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.bias-variance
    markdown: |-
      **More data.** Set `n = 100` in the program. Degree 9's variance falls from 0.623 to 0.009, because with readings packed that close together there's no room to swing between them. The straight line's bias² barely moves (0.225 to 0.203). More data cures variance, not bias.

      **A penalty on complexity.** **Regularization** adds a cost for large coefficients to the training objective. The most common version, **ridge regression** (called **weight decay** in neural networks), minimizes

      $$\sum_{i} \big(y_i - \hat f(x_i)\big)^2 + \lambda \sum_j w_j^2$$

      where the $w_j$ are the polynomial's coefficients and $\lambda$ sets the strength of the penalty. Running the same 500-sensor experiment on degree 9 with a penalty added gives:

      | Degree 9, ten readings | Bias² | Variance | Total |
      | --- | ---: | ---: | ---: |
      | λ = 0.0001 | 0.001 | 0.040 | 0.131 |
      | λ = 0.01 | 0.062 | 0.027 | 0.180 |
      | λ = 1 | 0.261 | 0.012 | 0.364 |

      A tiny penalty cuts the variance from 0.623 to 0.040, making the flexible curve nearly as good as degree 3. Push λ too high and the curve flattens toward a line, so bias takes over. You choose λ the way you'd choose a degree: by validation error, as in the regularization lesson.

      **Averaging.** **Bagging** trains many models on different resamples of the data and averages their predictions, so their disagreements cancel and variance falls. A random forest bags decision trees, and also lets each split consider only a random subset of the inputs.
  - id: bias-variance.s4
    title: Diagnose a model from two numbers
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.bias-variance
    markdown: |-
      In real work you don't have 500 sensors, but training and validation error together point to the problem:

      | Training error | Validation error | Likely problem | What usually helps |
      | --- | --- | --- | --- |
      | High | High, close to training | High bias (underfitting) | More flexible model, better features |
      | Low | Much higher | High variance (overfitting) | More data, stronger regularization, simpler model |
      | Low | Low, close to training | A good fit | Confirm on the untouched test set |

      The distance between the two columns is the generalization gap from the previous lesson.

      :::example A power-demand forecast, twice
      A utility needs next-day demand forecasts within 2%. Version 1 errs by 6% on training days and 6.5% on validation days: a small gap, both far too high, so bias. More of the same data won't help much; a temperature forecast as an input might. Version 2, a huge model, errs by 0.5% on training and 5% on validation. That 4.5-point gap says variance: add data or regularize.
      :::

      A **learning curve** plots both errors as the training set grows. With high variance, the gap narrows as data arrives. With high bias, both curves flatten early at an error that's too high.

      One modern twist: very large models can break the U shape, with test error falling again once they're big enough to fit their training data exactly. That's **double descent**, covered in the scaling lesson.
    bridges: []
  - id: bias-variance.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.bias-variance
    markdown: Crop yields, delivery times, sensor refits, and ridge penalties ask you to split an error into bias, variance, and noise, and to pick the fix that matches.
    takeaway: |-
      A model that is too rigid misses the pattern the same way every time (bias); one that is too flexible chases the noise in its particular sample (variance). Pick the flexibility, data, and regularization that minimize error on new data.
  - id: bias-variance.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.bias-variance
    markdown: |-
      A model can be too rigid to capture a pattern or too sensitive to the particular training sample. Use validation to choose a useful balance for the task.
navigation:
