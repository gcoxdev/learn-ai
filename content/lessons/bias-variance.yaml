assessment_families:
- id: bias-variance.base
  objective_ref: objective.bias-variance
  task: base
  response_type: single_choice
  points: 1
  hint: 'Imagine repeating the dataset: trace the inputs, operation, and result before choosing.'
  remediation_scene: bias-variance.s2
  variants:
  - id: bias-variance.base.1
    prompt: A model fits random training noise and worsens on new data. What is this pattern called?
    options:
    - id: a
      text: Overfitting
    - id: b
      text: Guaranteed optimality
    - id: c
      text: Only underflow
    answer: a
    feedback: The model captured sample-specific variation that does not transfer.
  - id: bias-variance.base.2
    prompt: What does estimator variance describe?
    options:
    - id: b
      text: Only the spread of label names
    - id: c
      text: A fixed physical constant for each architecture
    - id: a
      text: Sensitivity of the fit across sampled datasets
    answer: a
    feedback: Variance concerns the behavior of an estimation procedure under resampling.
- id: bias-variance.transfer
  objective_ref: objective.bias-variance
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Read learning curves: trace the inputs, operation, and result before choosing.'
  remediation_scene: bias-variance.s4
  variants:
  - id: bias-variance.transfer.1
    prompt: Regularization lowers validation error while raising training error. Can that be useful?
    options:
    - id: b
      text: No; training error is the only objective that matters
    - id: c
      text: Only if validation labels are hidden forever
    - id: a
      text: Yes; less sample fitting can improve transfer
    answer: a
    feedback: A deliberate complexity preference can improve generalization.
  - id: bias-variance.transfer.2
    prompt: Both training and validation errors are high. Is overfitting the only explanation?
    options:
    - id: c
      text: Only the model’s age matters
    - id: a
      text: No; underfitting, weak information, or noise may matter
    - id: b
      text: Yes; high error always means overfitting
    answer: a
    feedback: Diagnostic patterns require examining data, model, and objective together.
