schema_version: 0.2-draft
lesson:
  id: bias-variance
  version: 0.1.0-draft
  title: Why a simpler model can predict better
  state: draft
  summary: Underfitting and overfitting describe failures of fit and transfer; bias, variance, and regularization
    help explain how model choices interact with sample size and noise.
  slot: M09.2
  category: learning
  minutes: 12
  sources:
  - title: An Introduction to Statistical Learning — authors’ materials
    url: https://www.statlearning.com/
  - title: Dive into Deep Learning — authors’ open textbook
    url: https://d2l.ai/
objectives:
- id: objective.bias-variance
  version: 1-draft
  statement: Underfitting and overfitting describe failures of fit and transfer; bias, variance, and regularization
    help explain how model choices interact with sample size and noise.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - bias-variance.base
  - bias-variance.transfer
  prerequisites:
  - anyOf:
    - objective.generalization
scenes:
- id: bias-variance.s1
  title: Too rigid or too responsive
  type: explanation
  depth: intuition
  objective_refs:
  - objective.bias-variance
  markdown: 'A straight line can miss a curved relationship: underfitting. A highly flexible curve can track random
    measurement wiggles: overfitting. These terms concern the relation among model class, fitting procedure, data,
    and evaluation, not just a fixed count of parameters.'
  text_mode: 'A straight line can miss a curved relationship: underfitting. A highly flexible curve can track random
    measurement wiggles: overfitting. These terms concern the relation among model class, fitting procedure, data,
    and evaluation, not just a fixed count of parameters.'
  bridges: []
- id: bias-variance.s2
  title: Imagine repeating the dataset
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.bias-variance
  markdown: Statistical bias describes systematic discrepancy in an estimator, while variance describes how its
    fit changes across sampled datasets. Under squared error and suitable assumptions, prediction error can be decomposed
    into bias, variance, and irreducible noise. Other losses require different analyses.
  text_mode: Statistical bias describes systematic discrepancy in an estimator, while variance describes how its
    fit changes across sampled datasets. Under squared error and suitable assumptions, prediction error can be decomposed
    into bias, variance, and irreducible noise. Other losses require different analyses.
  bridges: []
- id: bias-variance.s3
  title: Use regularization to change the balance
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.bias-variance
  markdown: 'Shrinking coefficients or restricting a tree can make fitted models less sensitive to sample fluctuations,
    possibly introducing more systematic error. If validation error improves, that tradeoff helped under the tested
    conditions. More regularization is not always better: too much can discard real signal.'
  text_mode: 'Shrinking coefficients or restricting a tree can make fitted models less sensitive to sample fluctuations,
    possibly introducing more systematic error. If validation error improves, that tradeoff helped under the tested
    conditions. More regularization is not always better: too much can discard real signal.'
  bridges: []
- id: bias-variance.s4
  title: Read learning curves
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.bias-variance
  markdown: Compare training and validation behavior as data size or model flexibility changes. High errors on both
    may indicate underfitting, weak features, or a difficult noisy task. A large fit-transfer gap suggests overfitting
    or leakage in the comparison setup. Use these patterns as diagnostic clues, not automatic diagnoses.
  text_mode: Compare training and validation behavior as data size or model flexibility changes. High errors on
    both may indicate underfitting, weak features, or a difficult noisy task. A large fit-transfer gap suggests
    overfitting or leakage in the comparison setup. Use these patterns as diagnostic clues, not automatic diagnoses.
  bridges: []
