schema_version: 0.2-draft
lesson:
  id: bias-variance
  version: 0.3.0-draft
  title: Why a simpler model can predict better
  state: draft
  summary: Imagine fitting the same method to different samples to understand systematic error and sensitivity
    to the data.
  slot: M09.2
  category: learning
  sources:
  - title: An Introduction to Statistical Learning — authors’ materials
    url: https://www.statlearning.com/
  - title: Dive into Deep Learning — authors’ open textbook
    url: https://d2l.ai/
objectives:
- id: objective.bias-variance
  version: 1-draft
  statement: Underfitting and overfitting describe failures of fit and transfer; bias, variance, and regularization
    help explain how model choices interact with sample size and noise.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - bias-variance.base
  - bias-variance.transfer
  prerequisites:
  - anyOf:
    - objective.generalization
scenes:
- id: bias-variance.s1
  title: Too rigid or too responsive
  type: explanation
  depth: intuition
  objective_refs:
  - objective.bias-variance
  markdown: 'A straight line can miss a curved relationship: underfitting. A highly flexible curve can track
    random measurement wiggles: overfitting. These terms concern the relation among model class, fitting procedure,
    data, and evaluation, not just a fixed count of parameters.'
  text_mode: 'A straight line can miss a curved relationship: underfitting. A highly flexible curve can track
    random measurement wiggles: overfitting. These terms concern the relation among model class, fitting procedure,
    data, and evaluation, not just a fixed count of parameters.'
  bridges: []
- id: bias-variance.s2
  title: Imagine repeating the dataset
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.bias-variance
  markdown: 'Imagine collecting many different training datasets from the same process and fitting the model
    each time. **Statistical bias** describes how the average fitted prediction differs systematically from
    the true average target. **Variance** describes how much those fitted predictions change across datasets.


    For squared error, under the usual regression assumptions, expected prediction error separates into **squared
    bias**, variance, and irreducible noise. This statistical bias is not the additive bias parameter in a
    neuron and is not itself a definition of social unfairness.


    For a true average target of 10, predictions clustered near 7 have a systematic offset. Predictions scattered
    around 10 can have little average offset but large variance. One fitted model on one dataset does not reveal
    this whole repeated-sampling picture.'
  text_mode: 'Imagine collecting many different training datasets from the same process and fitting the model
    each time. **Statistical bias** describes how the average fitted prediction differs systematically from
    the true average target. **Variance** describes how much those fitted predictions change across datasets.


    For squared error, under the usual regression assumptions, expected prediction error separates into **squared
    bias**, variance, and irreducible noise. This statistical bias is not the additive bias parameter in a
    neuron and is not itself a definition of social unfairness.


    For a true average target of 10, predictions clustered near 7 have a systematic offset. Predictions scattered
    around 10 can have little average offset but large variance. One fitted model on one dataset does not reveal
    this whole repeated-sampling picture.'
  bridges: []
- id: bias-variance.s3
  title: Use regularization to change the balance
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.bias-variance
  markdown: 'Shrinking coefficients or restricting a tree can make fitted models less sensitive to sample fluctuations,
    possibly introducing more systematic error. If validation error improves, that tradeoff helped under the
    tested conditions. More regularization is not always better: too much can discard real signal.'
  text_mode: 'Shrinking coefficients or restricting a tree can make fitted models less sensitive to sample
    fluctuations, possibly introducing more systematic error. If validation error improves, that tradeoff helped
    under the tested conditions. More regularization is not always better: too much can discard real signal.'
  bridges: []
- id: bias-variance.s4
  title: Read learning curves
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.bias-variance
  markdown: Compare training and validation behavior as data size or model flexibility changes. High errors
    on both may indicate underfitting, weak features, or a difficult noisy task. A large fit-transfer gap suggests
    overfitting or leakage in the comparison setup. Use these patterns as diagnostic clues, not automatic diagnoses.
  text_mode: Compare training and validation behavior as data size or model flexibility changes. High errors
    on both may indicate underfitting, weak features, or a difficult noisy task. A large fit-transfer gap suggests
    overfitting or leakage in the comparison setup. Use these patterns as diagnostic clues, not automatic diagnoses.
  bridges: []
- id: bias-variance.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.bias-variance
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: A model can be too rigid to capture a pattern or too sensitive to the particular training sample.
    Use validation to choose a useful balance for the task.
- id: bias-variance.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.bias-variance
  markdown: A model can be too rigid to capture a pattern or too sensitive to the particular training sample.
    Use validation to choose a useful balance for the task.
  text_mode: A model can be too rigid to capture a pattern or too sensitive to the particular training sample.
