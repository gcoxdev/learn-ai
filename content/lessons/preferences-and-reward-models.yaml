schema_version: 0.2-draft
lesson:
  id: preferences-and-reward-models
  version: 0.3.0-draft
  title: Learn a scoring signal from response comparisons
  state: draft
  summary: Learn from comparisons of two answers while keeping the scoring rule separate from truth or universal
    preference.
  slot: M20.4
  category: learning
  sources:
  - title: InstructGPT
    url: https://arxiv.org/abs/2203.02155
  - title: Learning to summarize from human feedback
    url: https://arxiv.org/abs/2009.01325
objectives:
- id: objective.preferences-and-reward-models
  version: 1-draft
  statement: Preference data records judgments under a rubric, and reward models fit those judgments; disagreement,
    sampling bias, and reward exploitation limit what a high score establishes.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - preferences-and-reward-models.base
  - preferences-and-reward-models.transfer
  prerequisites:
  - anyOf:
    - objective.supervised-fine-tuning
  - anyOf:
    - objective.logistic-regression
scenes:
- id: preferences-and-reward-models.s1
  title: Compare responses to the same prompt
  type: explanation
  depth: intuition
  objective_refs:
  - objective.preferences-and-reward-models
  markdown: 'Suppose two answers give different closing times for a library. A reviewer compares them using
    a **rubric**, a set of judging criteria. The rubric might favor a correct time supported by the supplied
    schedule and penalize an invented time.


    A preference record can mark answer A as better than B, or record a tie or uncertainty. Reviewers may disagree,
    especially when criteria such as brevity and detail compete. Keep the judging instructions and information
    about how the answers were selected: a preference label records a judgment under those conditions.'
  text_mode: 'Suppose two answers give different closing times for a library. A reviewer compares them using
    a **rubric**, a set of judging criteria. The rubric might favor a correct time supported by the supplied
    schedule and penalize an invented time.


    A preference record can mark answer A as better than B, or record a tie or uncertainty. Reviewers may disagree,
    especially when criteria such as brevity and detail compete. Keep the judging instructions and information
    about how the answers were selected: a preference label records a judgment under those conditions.'
  bridges: []
- id: preferences-and-reward-models.s2
  title: Fit relative scores
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.preferences-and-reward-models
  markdown: 'A **reward model** learns to score answers from comparisons like these. In a common pairwise setup,
    it subtracts B''s score from A''s and passes the difference through a logistic, or sigmoid, function to
    predict how likely A is to be preferred.


    If both answers score 2, the difference is zero and the predicted preference probability is 0.5. Raising
    both scores to 12 leaves the difference and prediction unchanged. This explains why a raw reward score
    is not automatically a probability that an answer is correct.'
  text_mode: 'A **reward model** learns to score answers from comparisons like these. In a common pairwise
    setup, it subtracts B''s score from A''s and passes the difference through a logistic, or sigmoid, function
    to predict how likely A is to be preferred.


    If both answers score 2, the difference is zero and the predicted preference probability is 0.5. Raising
    both scores to 12 leaves the difference and prediction unchanged. This explains why a raw reward score
    is not automatically a probability that an answer is correct.'
  bridges: []
- id: preferences-and-reward-models.s3
  title: Watch shortcuts in the data
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.preferences-and-reward-models
  markdown: If preferred answers are consistently longer or formatted differently, a reward model may use those
    cues instead of correctness. Split by prompts and sources to reduce leakage, inspect disagreement, and
    test intentionally challenging pairs. Preference quality depends on which alternatives were shown.
  text_mode: If preferred answers are consistently longer or formatted differently, a reward model may use
    those cues instead of correctness. Split by prompts and sources to reduce leakage, inspect disagreement,
    and test intentionally challenging pairs. Preference quality depends on which alternatives were shown.
  bridges: []
- id: preferences-and-reward-models.s4
  title: Do not equate reward with the real goal
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.preferences-and-reward-models
  markdown: Optimizing a learned reward can push the policy toward outputs outside the reward model’s reliable
    training distribution. Audit factual errors, style exploitation, and subgroup effects with independent
    evaluations. The reward is a proxy used for training, not a certificate that the response is good.
  text_mode: Optimizing a learned reward can push the policy toward outputs outside the reward model’s reliable
    training distribution. Audit factual errors, style exploitation, and subgroup effects with independent
    evaluations. The reward is a proxy used for training, not a certificate that the response is good.
  bridges: []
- id: preferences-and-reward-models.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.preferences-and-reward-models
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: A reward model learns the preferences represented in its comparisons. A high score can reflect
    the judging rules or a shortcut, so check quality independently.
- id: preferences-and-reward-models.recap
  title: One idea to take with you
  type: recap
  depth: intuition
