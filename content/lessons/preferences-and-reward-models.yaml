assessment_families:
  - id: preferences-and-reward-models.base
    objective_ref: objective.preferences-and-reward-models
    task: base
    response_type: single_choice
    points: 1
    hint: 'Fit relative scores: trace the inputs, operation, and result before choosing.'
    remediation_scene: preferences-and-reward-models.s2
    variants:
      - id: preferences-and-reward-models.base.1
        prompt: What does a preference label represent?
        options:
          - id: b
            text: Universal agreement by definition
          - id: c
            text: A guaranteed factual proof
          - id: a
            text: A judgment under a particular comparison and rubric
        answer: a
        feedback: Judgments depend on criteria and annotators.
        retired: true
      - id: preferences-and-reward-models.base.2
        prompt: Adding five to both pairwise reward scores changes their difference how?
        options:
          - id: c
            text: It reverses it
          - id: a
            text: It leaves it unchanged
          - id: b
            text: It doubles it
        answer: a
        feedback: Relative-score models depend on differences.
        retired: true
  - id: preferences-and-reward-models.transfer
    objective_ref: objective.preferences-and-reward-models
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Do not equate reward with the real goal: trace the inputs, operation, and result before choosing.'
    remediation_scene: preferences-and-reward-models.s4
    variants:
      - id: preferences-and-reward-models.transfer.1
        prompt: Preferred examples are nearly always longer. What shortcut should be tested?
        options:
          - id: c
            text: A guaranteed improvement in truth
          - id: a
            text: Rewarding length instead of the intended quality
          - id: b
            text: Ignoring every response token
        answer: a
        feedback: Correlated superficial cues can predict labels.
        retired: true
      - id: preferences-and-reward-models.transfer.2
        prompt: A policy obtains very high learned reward. What is still needed?
        options:
          - id: a
            text: Independent evaluation of intended behavior and failures
          - id: b
            text: No further measurement
          - id: c
            text: Only printing the reward more precisely
        answer: a
        feedback: A proxy can be exploited or fail under distribution shift.
        retired: true
  - id: preferences-and-reward-models.base.v2
    objective_ref: objective.preferences-and-reward-models
    task: base
    response_type: single_choice
    points: 1
    hint: "Only the gap between two scores enters σ(r_chosen − r_rejected). Ask what the gap means, and what gap the labels are pushing toward."
    remediation_scene: preferences-and-reward-models.s2
    variants:
      - id: preferences-and-reward-models.base.v2.1
        prompt: "A reward model scores answer A at 14.2 and answer B at 13.2 for the same prompt. What does it predict?"
        options:
          - id: b
            text: Both answers are very good, since both scores are high
          - id: c
            text: A is 14.2% likely to be correct and B is 13.2% likely
          - id: a
            text: People prefer A about 73% of the time, since σ(1) ≈ 0.73
        answer: a
        feedback: Only the gap of 1 matters, and σ(1) ≈ 0.73. The raw level of 14 carries no meaning, because adding the same number to every score changes no prediction; and the scores aren't probabilities of correctness.
      - id: preferences-and-reward-models.base.v2.2
        prompt: "During training, a pair's chosen answer scores 0.2 and its rejected answer scores 1.8. What does the loss do?"
        options:
          - id: a
            text: It is large, and pushes the chosen score up and the rejected one down
          - id: c
            text: It is zero, since both scores are small positive numbers
          - id: b
            text: It is small, since the model is confident about this pair
        answer: a
        feedback: The model gives the chosen answer only σ(−1.6) ≈ 0.17, so the loss −ln 0.17 ≈ 1.8 is large, and its gradient widens the gap in the right direction. The model is confident, but confidently wrong.
      - id: preferences-and-reward-models.base.v2.3
        prompt: "Across many judges, answer A beats answer B in 3 of every 4 votes. After enough training on these votes, what score gap should the reward model settle on?"
        options:
          - id: c
            text: As large as possible, since A wins the majority
          - id: a
            text: About ln 3 ≈ 1.1, so that σ(gap) = 0.75
          - id: b
            text: About 0.75, the fraction of votes A won
        answer: a
        feedback: The loss is lowest when the predicted probability matches the vote share, σ(gap) = 0.75, which gives gap = ln 3 ≈ 1.1. A huge gap overcommits against the one-in-four voters, and 0.75 is the probability, not the gap.
      - id: preferences-and-reward-models.base.v2.4
        prompt: "A labeler ranks five answers to one prompt from best to worst. How many preference pairs does that ranking give?"
        options:
          - id: b
            text: 4, one for each neighbouring pair in the ranking
          - id: a
            text: 10, one for every pair of answers
          - id: c
            text: 25, one for each answer paired with each answer
        answer: a
        feedback: A full ranking says how every answer compares with every other, so it gives C(5, 2) = 10 pairs. Counting only neighbours (4) throws away information the ranking contains, and 25 wrongly counts each answer against itself and each pair twice.
  - id: preferences-and-reward-models.transfer.v2
    objective_ref: objective.preferences-and-reward-models
    task: transfer
    response_type: single_choice
    points: 1
    hint: The reward model learns whatever predicts the judges' choices. Look for a pattern in the data that is easier to spot than real quality.
    remediation_scene: preferences-and-reward-models.s4
    variants:
      - id: preferences-and-reward-models.transfer.v2.1
        prompt: "A cooking app's reward model gives its highest scores to recipes that include step-by-step photos, even when the photos don't match the steps. Most chosen answers in its training pairs had photos. What should the team do first?"
        options:
          - id: a
            text: Test it on pairs where the answer with photos is the worse one
          - id: b
            text: Collect more pairs in the same way to average out the effect
          - id: c
            text: Raise the reward model's size so it can see past the photos
        answer: a
        feedback: Contrast pairs, where the shortcut and real quality disagree, show how much the reward model relies on photos. More pairs of the same kind carry the same bias, and a bigger model learns the same shortcut if the data still rewards it.
      - id: preferences-and-reward-models.transfer.v2.2
        prompt: "A tax helper's labelers split roughly 50–50 on whether answers should cite tax-code sections or explain in plain words. What is the best next step?"
        options:
          - id: c
            text: Keep only the pairs where most labelers agreed and drop the rest
          - id: a
            text: Decide the rule in the rubric and relabel the affected pairs
          - id: b
            text: Pick one labeler's votes, since consistency matters most
        answer: a
        feedback: A 50–50 split means the rubric hasn't said what "better" is on this point, so the reward model would learn a coin flip. Settling it in the rubric fixes the cause. Dropping split pairs hides the question, and one labeler's taste is a different kind of bias.
      - id: preferences-and-reward-models.transfer.v2.3
        prompt: "A code-review assistant's reward model prefers reviews that list many issues. On 40 contrast pairs where a short review catches the one real bug and a long review lists trivial style nits, it picks the short review 18 times. What does this show?"
        options:
          - id: b
            text: The reward model is well calibrated, since 18 of 40 is close to half
          - id: a
            text: It mostly rewards length, picking the real bug only 45% of the time
          - id: c
            text: Contrast pairs are too artificial to tell us anything useful
        answer: a
        feedback: On pairs built so that length and quality disagree, it chose the correct review only 18 / 40 = 45% of the time, worse than a coin flip. Calibration is about matching vote shares, not about hitting 50%, and contrast pairs are exactly the test that reveals shortcuts.
      - id: preferences-and-reward-models.transfer.v2.4
        prompt: "A team collects pairs by showing labelers two answers from the same weak early model. Later they use the reward model to score answers from a much stronger model. What risk should they check?"
        options:
          - id: c
            text: The scores will all be shifted up, which breaks the sigmoid
          - id: b
            text: The stronger model's answers will all get the same score
          - id: a
            text: The reward model never saw answers this good and may rank them poorly
        answer: a
        feedback: A reward model learns to rank the kinds of answers it was shown. Much better answers are outside that range, so its ranking there can be unreliable; add pairs from the newer model. A uniform shift wouldn't matter, since only gaps count.
  - id: preferences-and-reward-models.calculate
    objective_ref: objective.preferences-and-reward-models
    task: base
    response_type: numeric
    points: 1
    hint: "Subtract B's score from A's, then apply σ(z) = 1 / (1 + e^(−z)). A gap of 0 gives 0.5, and a negative gap gives less than 0.5."
    remediation_scene: preferences-and-reward-models.s2
    absolute_tolerance: 0.01
    variants:
      - id: preferences-and-reward-models.calculate.1
        prompt: A reward model scores answer A at 1.0 and answer B at 0.0. Under the Bradley–Terry model, what is P(A preferred to B)? Give a decimal.
        answer: 0.731
        feedback: The gap is 1.0, and σ(1) = 1 / (1 + e^(−1)) = 1 / 1.368 ≈ 0.731.
      - id: preferences-and-reward-models.calculate.2
        prompt: A reward model scores answer A at 3.2 and answer B at 1.2. What is P(A preferred to B)? Give a decimal.
        answer: 0.881
        feedback: The gap is 2.0, and σ(2) = 1 / (1 + e^(−2)) = 1 / 1.135 ≈ 0.881.
      - id: preferences-and-reward-models.calculate.3
        prompt: A reward model scores answer A at 0.5 and answer B at 1.5. What is P(A preferred to B)? Give a decimal.
        answer: 0.269
        feedback: The gap r_A − r_B is −1.0, and σ(−1) = 1 / (1 + e^1) ≈ 0.269. B is favoured, so A's probability is below one half.
      - id: preferences-and-reward-models.calculate.4
        prompt: A reward model scores answer A at 10.3 and answer B at 10.0. What is P(A preferred to B)? Give a decimal.
        answer: 0.574
        feedback: Only the gap of 0.3 matters, not the large scores. σ(0.3) = 1 / (1 + e^(−0.3)) ≈ 0.574.
      - id: preferences-and-reward-models.calculate.5
        prompt: A reward model scores answer A at −0.8 and answer B at −2.3. What is P(A preferred to B)? Give a decimal.
        answer: 0.818
        feedback: The gap is −0.8 − (−2.3) = 1.5, and σ(1.5) ≈ 0.818. Negative scores are fine; only the difference counts.
