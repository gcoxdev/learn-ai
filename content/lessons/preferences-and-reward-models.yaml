schema_version: 0.2-draft
lesson:
  id: preferences-and-reward-models
  version: 0.4.0-draft
  title: Learn a scoring signal from response comparisons
  state: draft
  summary: Nobody can say an answer is worth "7.3". But people can say which of two answers is better, and one small formula turns thousands of those choices into a score.
  slot: M20.4
  category: learning
  sources:
    - title: "Training language models to follow instructions with human feedback (InstructGPT; Ouyang et al., 2022)"
      url: https://arxiv.org/abs/2203.02155
    - title: "Learning to summarize from human feedback (Stiennon et al., 2020)"
      url: https://arxiv.org/abs/2009.01325
    - title: "Deep reinforcement learning from human preferences (Christiano et al., 2017)"
      url: https://arxiv.org/abs/1706.03741
    - title: "Rank analysis of incomplete block designs: I. The method of paired comparisons (Bradley & Terry, Biometrika, 1952)"
      url: https://doi.org/10.2307/2334029
    - title: "A Long Way to Go: Investigating Length Correlations in RLHF (Singhal et al., 2023)"
      url: https://arxiv.org/abs/2310.03716
objectives:
  - id: objective.preferences-and-reward-models
    version: 2-draft
    statement: Reward models learn to predict which answer people prefer; disagreement, biased samples, and exploitation mean a high reward score isn't proof of a good answer.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - preferences-and-reward-models.base.v2
      - preferences-and-reward-models.transfer.v2
      - preferences-and-reward-models.calculate
    prerequisites:
      - anyOf:
          - objective.supervised-fine-tuning
      - anyOf:
          - objective.logistic-regression
scenes:
  - id: preferences-and-reward-models.s1
    title: Two answers, one winner
    type: explanation
    depth: intuition
    objective_refs:
      - objective.preferences-and-reward-models
    markdown: |-
      A customer asks Ferncliff's assistant, "Can I get my bike back by Saturday?" The SFT model writes two different answers:

      > **A:** Most repairs take two to three days. Call your shop and they'll confirm whether Saturday works.
      > **B:** Yes, definitely! We'll have it ready Saturday.

      Ask a staff member to score answer A from 1 to 10 and you'll get a shrug. Ask which answer is better and you'll get "A" in two seconds: B promises something nobody checked. That judgment, saved as a record of (prompt, chosen answer, rejected answer), is a **preference pair**.

      Ferncliff speeds things up the way InstructGPT did: the model writes four answers to each question and a staff member ranks them. A ranking of 4 answers contains $\binom{4}{2} = 6$ pairs (also written C(4, 2): the number of ways to choose 2 of 4), since every answer is compared with every other. InstructGPT's labelers ranked between 4 and 9 answers at a time; 9 answers give 36 pairs.

      Judges follow a **rubric**, a short written list of what "better" means. Ferncliff's says: correct facts first, then no promises the shop can't keep, then brevity. Without it, one person rewards friendliness and another rewards detail, and the data mixes both.

      :::story Teaching a backflip with clicks
      Preference learning began outside language. In 2017, Christiano and colleagues trained a simulated robot to do a backflip without ever writing a reward for it. A person watched pairs of short clips and clicked the one that looked more like a backflip, about 900 times in all. The system learned a reward from those clicks, then learned the flip by reinforcement learning.
      :::
    bridges: []
  - id: preferences-and-reward-models.s2
    title: Turn a score gap into a probability
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.preferences-and-reward-models
    markdown: |-
      A **reward model** reads a prompt and an answer and outputs one number, its score. Usually it's a copy of the SFT model whose final layer has been swapped: instead of probabilities for the next token, it outputs a single number. InstructGPT's reward model had 6 billion parameters.

      How can single scores learn from pairs? By assuming that the bigger the score gap, the more likely people prefer the higher-scoring answer. Squash the gap with the sigmoid function $\sigma(z) = 1/(1 + e^{-z})$, familiar from logistic regression:

      $$P(A \succ B) = \sigma(r_A - r_B)$$

      Here $A \succ B$ means "A is preferred to B" and $r_A$, $r_B$ are the two scores. Suppose the reward model gives Ferncliff's answer A $r_A = 2.0$ and answer B $r_B = 0.5$. The gap is 1.5, so $P(A \succ B) = \sigma(1.5) = 0.818$.

      Training pushes that probability toward the staff's choice. The loss is $-\ln$ of the probability given to the answer they actually chose. They chose A, so the loss is $-\ln 0.818 = 0.201$. Had they chosen B, it would be $-\ln(1 - 0.818) = 1.701$: a confident wrong prediction costs a lot.

      ```python run
      import numpy as np

      def sigmoid(z):
          return 1 / (1 + np.exp(-z))

      r_A, r_B = 2.0, 0.5                  # reward-model scores for answers A and B
      p = sigmoid(r_A - r_B)
      print(f"P(A preferred) = sigmoid({r_A - r_B}) = {p:.3f}")
      print(f"loss if staff chose A: {-np.log(p):.3f}")
      print(f"loss if staff chose B: {-np.log(1 - p):.3f}")
      print(f"add 10 to both scores: P = {sigmoid((r_A + 10) - (r_B + 10)):.3f}")

      # four staff judge one pair: three pick A, one picks B
      for margin in [0.0, 0.5, 1.0, np.log(3), 1.5, 3.0]:
          avg = (3 * -np.log(sigmoid(margin)) + 1 * -np.log(sigmoid(-margin))) / 4
          print(f"margin {margin:.2f}: P(A) = {sigmoid(margin):.3f}, average loss {avg:.3f}")
      ```

      Adding 10 to both scores changes nothing, because only the gap enters the formula. So a reward of 12 means nothing on its own; it only says which answers the model ranks above which.

      :::papers The Bradley–Terry model and the reward-model loss
      $$P(y_w \succ y_l \mid x) = \sigma\big(r_\phi(x, y_w) - r_\phi(x, y_l)\big) \qquad \mathcal{L}(\phi) = -\mathbb{E}\Big[\log \sigma\big(r_\phi(x, y_w) - r_\phi(x, y_l)\big)\Big]$$

      $x$ is the prompt, $y_w$ the chosen ("winning") answer, $y_l$ the rejected ("losing") one, and $r_\phi$ the reward model with weights $\phi$. With $r_\phi(x, y_w) = 2.0$ and $r_\phi(x, y_l) = 0.5$, one pair's loss is $-\log \sigma(1.5) = 0.201$. The probability model comes from Bradley and Terry (1952), who built it to rank items from paired comparisons. InstructGPT and the summarization work before it (Stiennon et al., 2020) trained their reward models with exactly this loss.
      :::
    bridges: []
  - id: preferences-and-reward-models.s3
    title: When the staff disagree
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.preferences-and-reward-models
    markdown: |-
      People often disagree about which answer is better. InstructGPT reported that its trained labelers agreed with each other about 73% of the time. At Ferncliff, four staff judge one pair about a customer who asks for "everything about disc brakes." Three prefer the short answer; one prefers the detailed one.

      :::predict What gap between the two scores gives the lowest average loss on those four labels?
      The gap where $\sigma(\text{gap}) = 0.75$, matching the 3-to-1 vote: $\text{gap} = \ln 3 \approx 1.10$. The last lines of the code show it. The average loss is 0.562 there, and it rises on both sides: 0.693 at a gap of 0, and 0.799 at a gap of 3.
      :::

      So a reward model trained on split votes learns a *modest* preference, not certainty. That's the right outcome, and a reason to keep disagreements in the data instead of throwing them out. Disagreement also tells you something: if staff split 50–50 on "short or detailed," the rubric hasn't settled that question. Settle it in the rubric, or accept that the reward model will learn whatever mix of opinions your judges happen to hold.

      :::mixup "Majority vote cleans the data, so train on the winner with full confidence."
      Turning a 3-to-1 vote into a unanimous label tells the reward model to push the gap toward infinity for a question where a quarter of your staff disagree. It learns false certainty. Keep each judgment as its own pair, or train toward 0.75.
      :::
    bridges: []
  - id: preferences-and-reward-models.s4
    title: The reward model learns your judges' shortcuts
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.preferences-and-reward-models
    markdown: |-
      The reward model learns whatever predicts the labels, whether you meant it or not. Ferncliff checks its 5,000 pairs and finds that the chosen answer is the longer one 70% of the time. Longer answers were often more complete, but the reward model can't tell completeness from length, so it learns that length pays.

      This is a well-documented pattern. Studies of RLHF found that reward models often favor longer answers, and that a lot of what RLHF "improves" can come from answers simply getting longer (Singhal et al., 2023).

      The test is to build **contrast pairs**, where the shortcut and the real goal disagree. Ferncliff writes 50 pairs in which the shorter answer is the correct one, such as a two-line correct price against a five-line wrong one. The reward model picks the correct answer in only 31 of them, 62%. That number is the one to fix before any training uses this reward model, because the next lesson optimizes hard against it, and every shortcut it rewards will be found.

      A reward model also knows only the kinds of answers it was shown. Ferncliff's pairs came from the SFT model, so if the assistant later writes much better, or much stranger, answers, the scores there are guesswork. When that happens, judge fresh pairs from the newer model.
    bridges: []
  - id: preferences-and-reward-models.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.preferences-and-reward-models
    markdown: Turn a few score gaps into preference probabilities, then diagnose reward models for a cooking app, a tax helper, and a code reviewer.
    takeaway: |-
      A reward model scores answers so that σ(r_chosen − r_rejected) matches how often people prefer the chosen one. Only gaps matter, split votes should give modest gaps, and whatever shortcut the judges' choices contain, the reward model learns too.
  - id: preferences-and-reward-models.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.preferences-and-reward-models
    markdown: |-
      A reward model learns the preferences represented in its comparisons. A high score can reflect the judging rules or a shortcut, so check quality independently.
