schema_version: 0.2-draft
lesson:
  id: preferences-and-reward-models
  version: 0.1.0-draft
  title: Learn a scoring signal from response comparisons
  state: draft
  summary: Preference data records judgments under a rubric, and reward models fit those judgments; disagreement,
    sampling bias, and reward exploitation limit what a high score establishes.
  slot: M20.4
  category: learning
  minutes: 12
  sources:
  - title: InstructGPT
    url: https://arxiv.org/abs/2203.02155
  - title: Learning to summarize from human feedback
    url: https://arxiv.org/abs/2009.01325
objectives:
- id: objective.preferences-and-reward-models
  version: 1-draft
  statement: Preference data records judgments under a rubric, and reward models fit those judgments; disagreement,
    sampling bias, and reward exploitation limit what a high score establishes.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - preferences-and-reward-models.base
  - preferences-and-reward-models.transfer
  prerequisites:
  - anyOf:
    - objective.supervised-fine-tuning
  - anyOf:
    - objective.logistic-regression
scenes:
- id: preferences-and-reward-models.s1
  title: Compare responses to the same prompt
  type: explanation
  depth: intuition
  objective_refs:
  - objective.preferences-and-reward-models
  markdown: A preference record may mark response A preferred to B, a tie, or an uncertain judgment under a rubric.
    Annotators can disagree about helpfulness, correctness, tone, and safety. Record instructions and selection
    conditions; a preference label is evidence about a judgment, not an objective universal ranking.
  text_mode: A preference record may mark response A preferred to B, a tie, or an uncertain judgment under a rubric.
    Annotators can disagree about helpfulness, correctness, tone, and safety. Record instructions and selection
    conditions; a preference label is evidence about a judgment, not an objective universal ranking.
  bridges: []
- id: preferences-and-reward-models.s2
  title: Fit relative scores
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.preferences-and-reward-models
  markdown: A common pairwise model predicts preference probability from the difference r(prompt,A) minus r(prompt,B),
    passed through a logistic function. Adding the same constant to both scores does not change that probability.
    The learned numeric reward therefore needs an interpretation tied to its training objective.
  text_mode: A common pairwise model predicts preference probability from the difference r(prompt,A) minus r(prompt,B),
    passed through a logistic function. Adding the same constant to both scores does not change that probability.
    The learned numeric reward therefore needs an interpretation tied to its training objective.
  bridges: []
- id: preferences-and-reward-models.s3
  title: Watch shortcuts in the data
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.preferences-and-reward-models
  markdown: If preferred answers are consistently longer or formatted differently, a reward model may use those
    cues instead of correctness. Split by prompts and sources to reduce leakage, inspect disagreement, and test
    intentionally challenging pairs. Preference quality depends on which alternatives were shown.
  text_mode: If preferred answers are consistently longer or formatted differently, a reward model may use those
    cues instead of correctness. Split by prompts and sources to reduce leakage, inspect disagreement, and test
    intentionally challenging pairs. Preference quality depends on which alternatives were shown.
  bridges: []
- id: preferences-and-reward-models.s4
  title: Do not equate reward with the real goal
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.preferences-and-reward-models
  markdown: Optimizing a learned reward can push the policy toward outputs outside the reward model’s reliable training
    distribution. Audit factual errors, style exploitation, and subgroup effects with independent evaluations. The
    reward is a proxy used for training, not a certificate that the response is good.
  text_mode: Optimizing a learned reward can push the policy toward outputs outside the reward model’s reliable
    training distribution. Audit factual errors, style exploitation, and subgroup effects with independent evaluations.
    The reward is a proxy used for training, not a certificate that the response is good.
  bridges: []
- id: preferences-and-reward-models.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.preferences-and-reward-models
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
- id: preferences-and-reward-models.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.preferences-and-reward-models
  markdown: Preference data records judgments under a rubric, and reward models fit those judgments; disagreement,
    sampling bias, and reward exploitation limit what a high score establishes.
  text_mode: Preference data records judgments under a rubric, and reward models fit those judgments; disagreement,
    sampling bias, and reward exploitation limit what a high score establishes.
navigation:
  routes:
  - id: route.core
    scene_sequence:
