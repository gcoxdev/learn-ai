assessment_families:
- id: preferences-and-reward-models.base
  objective_ref: objective.preferences-and-reward-models
  task: base
  response_type: single_choice
  points: 1
  hint: 'Fit relative scores: trace the inputs, operation, and result before choosing.'
  remediation_scene: preferences-and-reward-models.s2
  variants:
  - id: preferences-and-reward-models.base.1
    prompt: What does a preference label represent?
    options:
    - id: b
      text: Universal agreement by definition
    - id: c
      text: A guaranteed factual proof
    - id: a
      text: A judgment under a particular comparison and rubric
    answer: a
    feedback: Judgments depend on criteria and annotators.
  - id: preferences-and-reward-models.base.2
    prompt: Adding five to both pairwise reward scores changes their difference how?
    options:
    - id: c
      text: It reverses it
    - id: a
      text: It leaves it unchanged
    - id: b
      text: It doubles it
    answer: a
    feedback: Relative-score models depend on differences.
- id: preferences-and-reward-models.transfer
  objective_ref: objective.preferences-and-reward-models
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Do not equate reward with the real goal: trace the inputs, operation, and result before choosing.'
  remediation_scene: preferences-and-reward-models.s4
  variants:
  - id: preferences-and-reward-models.transfer.1
    prompt: Preferred examples are nearly always longer. What shortcut should be tested?
    options:
    - id: c
      text: A guaranteed improvement in truth
    - id: a
      text: Rewarding length instead of the intended quality
    - id: b
      text: Ignoring every response token
    answer: a
    feedback: Correlated superficial cues can predict labels.
  - id: preferences-and-reward-models.transfer.2
    prompt: A policy obtains very high learned reward. What is still needed?
    options:
    - id: a
      text: Independent evaluation of intended behavior and failures
    - id: b
      text: No further measurement
    - id: c
      text: Only printing the reward more precisely
    answer: a
    feedback: A proxy can be exploited or fail under distribution shift.
