schema_version: 0.2-draft
lesson:
  id: evaluation-releases-and-rollback
  version: 0.2.0-draft
  title: Release changes with evidence and a recovery path
  state: draft
  summary: Run a small release rehearsal, set stop rules, and keep a working route back.
  slot: M33.3
  category: learning
  sources:
  - title: Breck et al. — The ML Test Score
    url: https://research.google/pubs/the-ml-test-score-a-rubric-for-ml-production-readiness-and-technical-debt-reduction/
  - title: Sculley et al. — Hidden Technical Debt in Machine Learning Systems
    url: https://research.google/pubs/hidden-technical-debt-in-machine-learning-systems/
  archetype: mechanism
objectives:
- id: objective.evaluation-releases-and-rollback
  version: 2-draft
  statement: Distinguish offline, shadow, canary, and controlled comparison evidence and plan rollback of the compatible
    system.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - evaluation-releases-and-rollback.base.v2
  - evaluation-releases-and-rollback.transfer.v2
  prerequisites:
  - anyOf:
    - objective.production-data-and-model-artifacts
  - anyOf:
    - objective.evaluation-selection
scenes:
- id: evaluation-releases-and-rollback.s1
  type: explanation
  depth: intuition
  objective_refs:
  - objective.evaluation-releases-and-rollback
  title: Treat a release as a change in behavior
  markdown: 'A **release** makes a particular system version available for use. Our library assistant gets a new
    prompt and model. Before visitors see it, run stored questions with known scoring rules. This is **offline evaluation**:
    testing saved cases outside live decisions. Include ordinary questions, missing schedules, conflicting documents,
    and input compatibility. Test the exact package you intend to release, not a nearby experiment with different
    settings.'
  text_mode: 'A **release** makes a particular system version available for use. Our library assistant gets a new
    prompt and model. Before visitors see it, run stored questions with known scoring rules. This is **offline evaluation**:
    testing saved cases outside live decisions. Include ordinary questions, missing schedules, conflicting documents,
    and input compatibility. Test the exact package you intend to release, not a nearby experiment with different
    settings.'
  bridges: []
- id: evaluation-releases-and-rollback.s2
  type: explanation
  depth: intuition
  objective_refs:
  - objective.evaluation-releases-and-rollback
  title: Rehearse without sending the answer
  markdown: In a **shadow deployment**, the candidate receives appropriate copies of live inputs, but its answers
    do not control the user-facing result. This can expose new request patterns and timing problems. It does not
    directly measure how users respond to the candidate’s answers. Protect the same data boundaries as in normal
    operation. A tool-using candidate must not accidentally perform real actions while supposedly only rehearsing.
  text_mode: In a **shadow deployment**, the candidate receives appropriate copies of live inputs, but its answers
    do not control the user-facing result. This can expose new request patterns and timing problems. It does not
    directly measure how users respond to the candidate’s answers. Protect the same data boundaries as in normal
    operation. A tool-using candidate must not accidentally perform real actions while supposedly only rehearsing.
  bridges: []
- id: evaluation-releases-and-rollback.s3
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.evaluation-releases-and-rollback
  title: Open a small door
  markdown: A **canary release** sends a limited portion of real traffic to a candidate while the rest uses the
    existing version. At 5% of 1000 requests, about 50 requests receive the candidate; actual assignment can vary.
    A canary limits initial exposure and helps find operational failures. An **A/B experiment** assigns comparison
    groups under a defined design to estimate differences. Small exposure by itself does not make the comparison
    statistically conclusive.
  text_mode: A **canary release** sends a limited portion of real traffic to a candidate while the rest uses the
    existing version. At 5% of 1000 requests, about 50 requests receive the candidate; actual assignment can vary.
    A canary limits initial exposure and helps find operational failures. An **A/B experiment** assigns comparison
    groups under a defined design to estimate differences. Small exposure by itself does not make the comparison
    statistically conclusive.
  bridges: []
- id: evaluation-releases-and-rollback.s4
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.evaluation-releases-and-rollback
  title: Agree when to continue and when to stop
  markdown: Suppose the pilot requires correct source links and acceptable response time. Define the measurements,
    observation period, and incident triggers before starting. If links break, stop exposure and investigate even
    if average answer ratings look good. Separately define how much evidence supports a success claim. Repeatedly
    peeking at noisy results and declaring victory on a lucky day can bias that claim. Operational stop rules and
    statistical comparison rules serve different purposes.
  text_mode: Suppose the pilot requires correct source links and acceptable response time. Define the measurements,
    observation period, and incident triggers before starting. If links break, stop exposure and investigate even
    if average answer ratings look good. Separately define how much evidence supports a success claim. Repeatedly
    peeking at noisy results and declaring victory on a lucky day can bias that claim. Operational stop rules and
    statistical comparison rules serve different purposes.
  bridges: []
- id: evaluation-releases-and-rollback.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.evaluation-releases-and-rollback
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Rehearse, limit exposure, watch the agreed signals, and keep the compatible previous release ready.
- id: evaluation-releases-and-rollback.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.evaluation-releases-and-rollback
  markdown: AI releases combine offline evaluation, controlled online experiments, artifact promotion, and rollback;
    define acceptance criteria and monitor the exact behavior changed by a release.
  text_mode: AI releases combine offline evaluation, controlled online experiments, artifact promotion, and rollback;
    define acceptance criteria and monitor the exact behavior changed by a release.
- id: evaluation-releases-and-rollback.s5
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.evaluation-releases-and-rollback
  title: Pack a usable way back
  markdown: '**Rollback** restores a previous operating version after a problematic change. Keep its weights, tokenizer,
    prompt, index, and configuration together. Reverting only the weights may leave incompatible pieces behind.
    Rehearse restoring a known request and checking its result. Some changes, such as sent messages or physical
    actions, cannot be undone by replacing software. Limit actions during the rollout and plan how to handle consequences
    separately from restoring the service.'
  text_mode: '**Rollback** restores a previous operating version after a problematic change. Keep its weights, tokenizer,
    prompt, index, and configuration together. Reverting only the weights may leave incompatible pieces behind.
    Rehearse restoring a known request and checking its result. Some changes, such as sent messages or physical
    actions, cannot be undone by replacing software. Limit actions during the rollout and plan how to handle consequences
    separately from restoring the service.'
  bridges: []
- id: evaluation-releases-and-rollback.s6
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.evaluation-releases-and-rollback
  title: Write the release postcard
  markdown: Record what changed, which cases passed, who is watching, how much traffic is exposed, when to stop,
    and how to restore the previous version. Save failures for investigation after recovery. Do not quietly redefine
    success because the candidate misses a requirement. The memory cue is “rehearse, release a little, watch, recover.”
    This applies to prompts, retrieval data, and tools as well as newly trained weights.
  text_mode: Record what changed, which cases passed, who is watching, how much traffic is exposed, when to stop,
    and how to restore the previous version. Save failures for investigation after recovery. Do not quietly redefine
    success because the candidate misses a requirement. The memory cue is “rehearse, release a little, watch, recover.”
    This applies to prompts, retrieval data, and tools as well as newly trained weights.
  bridges: []
- id: evaluation-releases-and-rollback.s7
  type: question
  depth: mechanics
  objective_refs:
  - objective.evaluation-releases-and-rollback
  title: Shadow or canary?
  markdown: A candidate answers copied requests, but visitors still receive answers only from the old system. What
    is this?
  text_mode: A candidate answers copied requests, but visitors still receive answers only from the old system. What
    is this?
  bridges: []
  question:
    response_type: single_choice
    options:
    - id: a
      text: A shadow deployment.
    - id: b
      text: A canary sending candidate answers to some visitors.
    - id: c
      text: A completed A/B test of visitor satisfaction.
    answer: a
    reveal_markdown: The candidate has no user-facing effect in this setup. You can inspect its behavior, but cannot
      infer how visitors reacted to answers they never saw.
    hint: Trace the example using the rule from the preceding pages.
    id: evaluation-releases-and-rollback.practice.v2.7
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - evaluation-releases-and-rollback.s1
    - evaluation-releases-and-rollback.s2
    - evaluation-releases-and-rollback.s3
    - evaluation-releases-and-rollback.s4
    - evaluation-releases-and-rollback.s5
    - evaluation-releases-and-rollback.s6
    - evaluation-releases-and-rollback.s7
    - evaluation-releases-and-rollback.check
    gate_refs:
    - gate.core
  scene_aliases:
    evaluation-releases-and-rollback.recap: evaluation-releases-and-rollback.check
assessment_families:
- id: evaluation-releases-and-rollback.base
  objective_ref: objective.evaluation-releases-and-rollback
  task: base
  response_type: single_choice
  points: 1
  hint: 'Use controlled online exposure: trace the inputs, operation, and result before choosing.'
  remediation_scene: evaluation-releases-and-rollback.s2
  variants:
  - id: evaluation-releases-and-rollback.base.1
    prompt: What does shadow deployment avoid doing by definition here?
    options:
    - id: b
      text: Generating any candidate output
    - id: c
      text: Collecting any evaluation evidence
    - id: a
      text: Using candidate outputs to control the user-facing decision
    answer: a
    feedback: It observes behavior without making it the active decision path.
    retired: true
  - id: evaluation-releases-and-rollback.base.2
    prompt: How does a canary limit exposure?
    options:
    - id: c
      text: It eliminates monitoring
    - id: a
      text: It serves a bounded portion of traffic
    - id: b
      text: It guarantees no user impact
    answer: a
    feedback: Limited rollout reduces the scope of early exposure.
    retired: true
- id: evaluation-releases-and-rollback.transfer
  objective_ref: objective.evaluation-releases-and-rollback
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Revert the complete change: trace the inputs, operation, and result before choosing.'
  remediation_scene: evaluation-releases-and-rollback.s4
  variants:
  - id: evaluation-releases-and-rollback.transfer.1
    prompt: Why predefine experiment stopping rules?
    options:
    - id: c
      text: Only to name the release
    - id: a
      text: To avoid selectively declaring success from repeated noisy checks
    - id: b
      text: To prevent every operational stop
    answer: a
    feedback: Adaptive peeking can bias statistical conclusions.
    retired: true
  - id: evaluation-releases-and-rollback.transfer.2
    prompt: Why might rolling back only weights be insufficient?
    options:
    - id: a
      text: Prompts, schemas, indexes, or features may also have changed
    - id: b
      text: Weights never affect behavior
    - id: c
      text: Only the UI can regress
    answer: a
    feedback: The deployed system is a set of coupled artifacts.
    retired: true
- id: evaluation-releases-and-rollback.base.v2
  objective_ref: objective.evaluation-releases-and-rollback
  task: base
  response_type: single_choice
  points: 1
  hint: Work through the example one step at a time before answering.
  remediation_scene: evaluation-releases-and-rollback.s3
  variants:
  - prompt: What does offline evaluation use?
    answer: a
    options:
    - id: b
      text: Only live visitors assigned to the new release
    - id: c
      text: Only the new model’s training loss
    - id: a
      text: Saved cases tested outside live decisions
    feedback: Offline tests provide evidence before user exposure.
    id: evaluation-releases-and-rollback.base.v2.1
  - prompt: Which setup sends candidate answers to a limited portion of visitors?
    answer: a
    options:
    - id: b
      text: A shadow run with outputs discarded
    - id: c
      text: A local evaluation of saved cases
    - id: a
      text: A canary release
    feedback: A canary limits initial real exposure.
    id: evaluation-releases-and-rollback.base.v2.2
  - prompt: What should rollback preserve?
    answer: a
    options:
    - id: b
      text: Only the previous weights regardless of other changes
    - id: a
      text: The previous compatible artifact set
    - id: c
      text: Only the new release’s evaluation report
    feedback: Restoration needs matching system components.
    id: evaluation-releases-and-rollback.base.v2.3
  - prompt: Why separate incident stops from success rules?
    answer: a
    options:
    - id: a
      text: Urgent recovery and reliable effect estimation answer different questions
    - id: b
      text: Incident rules can replace evaluation sample size
    - id: c
      text: Success rules apply only before live traffic
    feedback: An operational problem can justify stopping without proving a statistical effect.
    id: evaluation-releases-and-rollback.base.v2.4
- id: evaluation-releases-and-rollback.transfer.v2
  objective_ref: objective.evaluation-releases-and-rollback
  task: transfer
  response_type: single_choice
  points: 1
  hint: Work through the example one step at a time before answering.
  remediation_scene: evaluation-releases-and-rollback.s3
  variants:
  - prompt: A shadow agent sends real booking emails while its text output is discarded. What went wrong?
    answer: a
    options:
    - id: b
      text: Discarding the text makes it a harmless shadow run
    - id: a
      text: The rehearsal still caused external actions
    - id: c
      text: It became a valid A/B experiment automatically
    feedback: Control tool effects as well as visible text during rehearsal.
    id: evaluation-releases-and-rollback.transfer.v2.1
  - prompt: A team checks scores daily and stops only on the first favorable result. What is a concern?
    answer: a
    options:
    - id: a
      text: The stopping rule can favor a lucky fluctuation
    - id: c
      text: Offline evaluation is no longer possible
    - id: b
      text: The candidate must have changed its weights each day
    feedback: Choose an appropriate evidence and stopping policy before interpreting comparisons.
    id: evaluation-releases-and-rollback.transfer.v2.2
  - prompt: A rollback restores weights but retains an incompatible tokenizer. What is missing?
    answer: a
    options:
    - id: a
      text: Restoration of the matching input and output definitions
    - id: b
      text: A larger sample of the broken release’s answers
    - id: c
      text: Re-evaluation of the mixed artifact set without restoring compatibility
    feedback: A partial rollback can leave the original incompatibility unresolved.
    id: evaluation-releases-and-rollback.transfer.v2.3
  - prompt: A bad release already sent incorrect messages. What can reverting software accomplish?
    answer: a
    options:
    - id: c
      text: Prove that the previous version caused no errors
    - id: b
      text: Erase recipients’ previously delivered messages
    - id: a
      text: Restore later operation while sent messages need separate handling
    feedback: Recovery of a service does not reverse every consequence.
    id: evaluation-releases-and-rollback.transfer.v2.4
