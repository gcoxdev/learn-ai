schema_version: 0.2-draft
lesson:
  id: evaluation-releases-and-rollback
  version: 0.3.0-draft
  title: Release changes with evidence and a recovery path
  state: draft
  summary: A new prompt passes every test, then misleads real visitors. Learn the release ladder, how long a 5% canary must run, and how to roll back everything at once.
  slot: M33.3
  category: learning
  sources:
    - title: The ML Test Score (Breck et al., 2017)
      url: https://research.google/pubs/the-ml-test-score-a-rubric-for-ml-production-readiness-and-technical-debt-reduction/
    - title: "Trustworthy Online Controlled Experiments: A Practical Guide to A/B Testing (Kohavi, Tang & Xu, 2020)"
      url: https://doi.org/10.1017/9781108653985
    - title: SEC order on Knight Capital Americas LLC (Release No. 34-70694, 2013)
      url: https://www.sec.gov/litigation/admin/2013/34-70694.pdf
    - title: Google SRE Workbook, "Canarying Releases"
      url: https://sre.google/workbook/canarying-releases/
  archetype: mechanism
objectives:
  - id: objective.evaluation-releases-and-rollback
    version: 3-draft
    statement: Move a release through offline gates, shadow mode, a canary, and an A/B test; size a canary to catch a given rise in errors; and roll back the whole release, including its prompt and retrieval settings.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - evaluation-releases-and-rollback.base.v3
      - evaluation-releases-and-rollback.transfer.v3
      - evaluation-releases-and-rollback.calc.v3
    prerequisites:
      - anyOf:
          - objective.production-data-and-model-artifacts
      - anyOf:
          - objective.evaluation-selection
scenes:
  - id: evaluation-releases-and-rollback.s1
    type: explanation
    depth: intuition
    objective_refs:
      - objective.evaluation-releases-and-rollback
    title: Gate the candidate before anyone sees it
    markdown: |-
      By autumn Linden's assistant serves all 14 county branches, about 2,000 questions a day, running manifest r14. The candidate, r15, has a new prompt and retrieves 8 chunks instead of 5.

      A **release** puts one exact manifest in front of users. Before that, the candidate faces **offline evaluation**: a run over saved test questions with known answers, as in the lesson "Build a test whose score supports the intended claim." Each row below is a **gate**, a pass rule written down before the run:

      | Gate | r14 (live) | r15 | Rule | Result |
      | --- | ---: | ---: | --- | --- |
      | Overall correct | 196/200 | 197/200 | no worse than r14 | pass |
      | Holiday questions | 38/40 | 35/40 | no worse than r14 | **fail** |
      | Unanswerable → fallback | 9/10 | 10/10 | at least 9 | pass |
      | p95 time to answer | 2.1 s | 2.4 s | under 3 s | pass |

      Overall went up while holidays went down: the extra chunks pulled in regular-hours text that drowned out holiday notices. r15 is blocked. The fixed candidate, r16, passes all four gates.
    bridges: []
    diagram:
      caption: The release ladder. Each step exposes more users only after the previous gate passes.
      description: A candidate manifest goes to offline gates on saved questions. If they pass, it runs in shadow mode on copies of live traffic, then as a 5% canary, then in full rollout. From the canary, a stop rule leads to rollback, which restores the previous release r14 in full. A failed offline gate sends the candidate back to be fixed.
      nodes:
        - id: cand
          label: Candidate r16
          note: one manifest
          col: 0
          row: 0
          tone: accent
        - id: gates
          label: Offline gates
          note: 200 saved questions
          col: 1
          row: 0
        - id: shadow
          label: Shadow mode
          note: live copies, answers hidden
          col: 2
          row: 0
        - id: canary
          label: 5% canary
          note: real visitors, stop rules armed
          col: 3
          row: 0
        - id: full
          label: Full rollout
          col: 4
          row: 0
          tone: data
        - id: rollback
          label: Roll back to r14
          note: model, prompt, index, config
          col: 3
          row: 1
          tone: warn
      edges:
        - from: cand
          to: gates
        - from: gates
          to: shadow
          label: pass
        - from: shadow
          to: canary
          label: pass
        - from: canary
          to: full
          label: pass
        - from: canary
          to: rollback
          label: stop rule fires
        - from: gates
          to: cand
          label: fail
          dashed: true
          bend: 2
  - id: evaluation-releases-and-rollback.s2
    type: explanation
    depth: intuition
    objective_refs:
      - objective.evaluation-releases-and-rollback
    title: Rehearse on live traffic, show nothing
    markdown: |-
      Saved questions can't cover what real visitors type. In **shadow mode**, the candidate gets a copy of every live question, but only r14's answer reaches the visitor. Two days of shadow gives r16 about 4,000 questions:

      - no crashes; p95 time 2.3 s, under the 3 s guardrail
      - 6% of answers give different hours from r14's, so staff read 50 of them: r16 is right in 31, r14 in 16, and 3 are unclear

      Shadow mode can't tell you how visitors react, because none of them saw r16. And a candidate that can act, such as placing holds, must have those tools switched off in shadow, or its rehearsal makes real changes.
    bridges: []
  - id: evaluation-releases-and-rollback.s3
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.evaluation-releases-and-rollback
    title: Canary for safety, A/B test for proof
    markdown: |-
      A **canary release** sends a small share of real traffic, here 5%, to the candidate while everyone else stays on r14. Its job is to catch breakage early, while few people are exposed. The name comes from the canaries miners carried to warn of bad air.

      An **A/B test** has a different job: to measure whether the candidate is *better*. Visitors are randomly assigned to r14 or r16, the success metric and sample size are fixed in advance, and the difference is reported with a confidence interval, as in the lesson "Change one thing and measure what follows." A canary is usually too small and too short for that. It answers "is r16 broken?", not "is r16 better?"
    bridges: []
  - id: evaluation-releases-and-rollback.canary-math
    title: How long must a 5% canary run?
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.evaluation-releases-and-rollback
    markdown: |-
      A nightly check finds wrong hours in about 1% of r14's answers. The canary should catch r16 if it *doubles* that to 2%. A 5% canary sees 100 answers a day, so on day one a healthy r16 makes about 1 error and a broken one about 2, which nobody can tell apart.

      For each day, the program sets the alarm at the fewest errors a healthy 1% release would reach less than 5% of the time, then asks how often a broken 2% release sets it off:

      ```python run
      from math import comb

      def tail(n, k, p):
          """Chance of k or more errors in n answers when each fails with probability p."""
          return 1 - sum(comb(n, i) * p**i * (1 - p)**(n - i) for i in range(k))

      p_old, p_bad = 0.01, 0.02   # current error rate, and the doubled rate to catch
      per_day = 2000 * 0.05       # a 5% canary of 2,000 questions a day

      print("day  answers  alarm at  false alarm  catch chance")
      for day in range(1, 11):
          n = int(day * per_day)
          k = next(k for k in range(n + 1) if tail(n, k, p_old) <= 0.05)
          print(f"{day:3}  {n:7}  {k:8}  {tail(n, k, p_old):11.3f}  {tail(n, k, p_bad):12.2f}")
      ```

      The catch chance first reaches 80% on day 10, after 1,000 answers, with the alarm at 16 wrong answers. (It wobbles because errors come in whole numbers.)

      :::predict Change p_bad to 0.03. How long does it take to catch a *tripling*?
      Three days: at 300 answers the catch chance reaches 0.80. Bigger failures show up much sooner. A 20% canary (per_day = 400) also catches the doubling in three days, but exposes four times as many visitors.
      :::

      :::papers Sample size for detecting a rise in a rate
      Using the normal approximation, the answers needed to tell rate $p_1$ from $p_0$ are about
      $$n \approx \left(\frac{z_{\alpha}\sqrt{p_0(1-p_0)} + z_{\beta}\sqrt{p_1(1-p_1)}}{p_1 - p_0}\right)^2$$
      With $p_0 = 0.01$, $p_1 = 0.02$, $z_\alpha = 1.645$ (5% false alarms) and $z_\beta = 0.84$ (80% catch chance), $n \approx 790$; the exact count above is a little higher. The key is the denominator: halve the gap you want to catch and you need roughly four times the traffic. Treating $p_0$ as known is fair here, because the other 95% of traffic measures it precisely.
      :::

      :::mixup "The canary ran all day with zero errors, so it's safe."
      With 100 answers and no errors, the true rate could still be as high as about 3/100 = 3%. That's the **rule of three**: after zero failures in $n$ tries, the 95% upper bound on the failure rate is roughly $3/n$.
      :::
  - id: evaluation-releases-and-rollback.s4
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.evaluation-releases-and-rollback
    title: Write the stop rules before you start
    markdown: |-
      Before r16 takes a single live question, the team writes its stop rules, the conditions that end the canary at once:

      | Signal | Stop when |
      | --- | --- |
      | Wrong hours in the canary | 16 or more in the first 1,000 answers |
      | p95 time to answer | over 3 s for 15 minutes |
      | Any answer showing account data | one occurrence |

      Stop rules protect visitors, so they act fast on thin evidence. A claim that r16 is *better* needs the opposite: the A/B test's full, pre-set sample. Checking an A/B test every morning and stopping on the first good-looking day will, sooner or later, crown a lucky fluctuation.
    bridges: []
  - id: evaluation-releases-and-rollback.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.evaluation-releases-and-rollback
    markdown: A bank's fraud screen, a travel agent's booking tool, a shop's ranking experiment, and a speech model's canary test whether you can pick the right release step and read its evidence.
    takeaway: "Climb the ladder: offline gates, shadow, a canary sized to catch the failure you fear, then an A/B test if you need proof of improvement. Write stop rules first, and roll back the whole manifest, prompt and retrieval settings included."
  - id: evaluation-releases-and-rollback.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.evaluation-releases-and-rollback
    markdown: |-
      AI releases combine offline evaluation, controlled online experiments, artifact promotion, and rollback; define acceptance criteria and monitor the exact behavior changed by a release.
  - id: evaluation-releases-and-rollback.s5
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.evaluation-releases-and-rollback
    title: Roll back everything, together
    markdown: |-
      **Rollback** restores the previous release. The unit of rollback is the manifest from the previous lesson, not the model. r16 changed the prompt and the retrieval settings but kept the same model, so "restore the old model" would restore nothing. Rolling back means redeploying r14 whole: model snapshot, prompt v7, the 10 March index, and 5 chunks.

      :::story A rollback that made things worse
      In August 2012 the trading firm Knight Capital deployed new code to seven of its eight order servers, missing one. The new code reused an old configuration flag, which on the missed server switched on long-retired trading logic. To stop the flood of orders, staff removed the new code from the seven good servers, but orders still carried the reused flag, so those servers ran the old logic too. In about 45 minutes Knight lost more than \$460 million (SEC order, 2013).
      :::

      Some effects can't be rolled back at all. A wrong answer already read, or a hold already placed, needs its own follow-up. That's one more reason canaries start small.
    bridges: []
  - id: evaluation-releases-and-rollback.s6
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.evaluation-releases-and-rollback
    title: One page per release
    markdown: "r16's plan fits on one page: what changed, gate results, shadow findings, canary size and its 10 days, stop rules, who watches, and the manifest to roll back to. Any change that can alter answers, whether a prompt, an index, or a model, climbs the same ladder."
    bridges: []
  - id: evaluation-releases-and-rollback.s7
    type: question
    depth: mechanics
    objective_refs:
      - objective.evaluation-releases-and-rollback
    title: Shadow or canary?
    markdown: |-
      A candidate answers copied requests, but visitors still receive answers only from the old system. What is this?
    bridges: []
    question:
      response_type: single_choice
      options:
        - id: a
          text: A shadow deployment.
        - id: b
          text: A canary sending candidate answers to some visitors.
        - id: c
          text: A completed A/B test of visitor satisfaction.
      answer: a
      reveal_markdown: Copies of real requests, with visitors still served by the old system, is shadow mode. It shows how the candidate behaves on live inputs, but it can't show how visitors react to answers they never saw, which is what a canary or A/B test adds.
      hint: Ask whether any visitor saw the candidate's answers.
      id: evaluation-releases-and-rollback.practice.v2.7
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - evaluation-releases-and-rollback.s1
        - evaluation-releases-and-rollback.s2
        - evaluation-releases-and-rollback.s3
        - evaluation-releases-and-rollback.canary-math
        - evaluation-releases-and-rollback.s4
        - evaluation-releases-and-rollback.s5
        - evaluation-releases-and-rollback.s6
        - evaluation-releases-and-rollback.s7
        - evaluation-releases-and-rollback.check
      gate_refs:
        - gate.core
  scene_aliases:
    evaluation-releases-and-rollback.recap: evaluation-releases-and-rollback.check
assessment_families:
  - id: evaluation-releases-and-rollback.base
    objective_ref: objective.evaluation-releases-and-rollback
    task: base
    response_type: single_choice
    points: 1
    hint: 'Use controlled online exposure: trace the inputs, operation, and result before choosing.'
    remediation_scene: evaluation-releases-and-rollback.s2
    variants:
      - id: evaluation-releases-and-rollback.base.1
        prompt: What does shadow deployment avoid doing by definition here?
        options:
          - id: b
            text: Generating any candidate output
          - id: c
            text: Collecting any evaluation evidence
          - id: a
            text: Using candidate outputs to control the user-facing decision
        answer: a
        feedback: It observes behavior without making it the active decision path.
        retired: true
      - id: evaluation-releases-and-rollback.base.2
        prompt: How does a canary limit exposure?
        options:
          - id: c
            text: It eliminates monitoring
          - id: a
            text: It serves a bounded portion of traffic
          - id: b
            text: It guarantees no user impact
        answer: a
        feedback: Limited rollout reduces the scope of early exposure.
        retired: true
  - id: evaluation-releases-and-rollback.transfer
    objective_ref: objective.evaluation-releases-and-rollback
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Revert the complete change: trace the inputs, operation, and result before choosing.'
    remediation_scene: evaluation-releases-and-rollback.s4
    variants:
      - id: evaluation-releases-and-rollback.transfer.1
        prompt: Why predefine experiment stopping rules?
        options:
          - id: c
            text: Only to name the release
          - id: a
            text: To avoid selectively declaring success from repeated noisy checks
          - id: b
            text: To prevent every operational stop
        answer: a
        feedback: Adaptive peeking can bias statistical conclusions.
        retired: true
      - id: evaluation-releases-and-rollback.transfer.2
        prompt: Why might rolling back only weights be insufficient?
        options:
          - id: a
            text: Prompts, schemas, indexes, or features may also have changed
          - id: b
            text: Weights never affect behavior
          - id: c
            text: Only the UI can regress
        answer: a
        feedback: The deployed system is a set of coupled artifacts.
        retired: true
  - id: evaluation-releases-and-rollback.base.v2
    objective_ref: objective.evaluation-releases-and-rollback
    task: base
    response_type: single_choice
    points: 1
    hint: Work through the example one step at a time before answering.
    remediation_scene: evaluation-releases-and-rollback.s3
    variants:
      - prompt: What does offline evaluation use?
        answer: a
        options:
          - id: b
            text: Only live visitors assigned to the new release
          - id: c
            text: Only the new model’s training loss
          - id: a
            text: Saved cases tested outside live decisions
        feedback: Offline tests provide evidence before user exposure.
        id: evaluation-releases-and-rollback.base.v2.1
        retired: true
      - prompt: Which setup sends candidate answers to a limited portion of visitors?
        answer: a
        options:
          - id: b
            text: A shadow run with outputs discarded
          - id: c
            text: A local evaluation of saved cases
          - id: a
            text: A canary release
        feedback: A canary limits initial real exposure.
        id: evaluation-releases-and-rollback.base.v2.2
        retired: true
      - prompt: What should rollback preserve?
        answer: a
        options:
          - id: b
            text: Only the previous weights regardless of other changes
          - id: a
            text: The previous compatible artifact set
          - id: c
            text: Only the new release’s evaluation report
        feedback: Restoration needs matching system components.
        id: evaluation-releases-and-rollback.base.v2.3
        retired: true
      - prompt: Why separate incident stops from success rules?
        answer: a
        options:
          - id: a
            text: Urgent recovery and reliable effect estimation answer different questions
          - id: b
            text: Incident rules can replace evaluation sample size
          - id: c
            text: Success rules apply only before live traffic
        feedback: An operational problem can justify stopping without proving a statistical effect.
        id: evaluation-releases-and-rollback.base.v2.4
        retired: true
  - id: evaluation-releases-and-rollback.transfer.v2
    objective_ref: objective.evaluation-releases-and-rollback
    task: transfer
    response_type: single_choice
    points: 1
    hint: Work through the example one step at a time before answering.
    remediation_scene: evaluation-releases-and-rollback.s3
    variants:
      - prompt: A shadow agent sends real booking emails while its text output is discarded. What went wrong?
        answer: a
        options:
          - id: b
            text: Discarding the text makes it a harmless shadow run
          - id: a
            text: The rehearsal still caused external actions
          - id: c
            text: It became a valid A/B experiment automatically
        feedback: Control tool effects as well as visible text during rehearsal.
        id: evaluation-releases-and-rollback.transfer.v2.1
        retired: true
      - prompt: A team checks scores daily and stops only on the first favorable result. What is a concern?
        answer: a
        options:
          - id: a
            text: The stopping rule can favor a lucky fluctuation
          - id: c
            text: Offline evaluation is no longer possible
          - id: b
            text: The candidate must have changed its weights each day
        feedback: Choose an appropriate evidence and stopping policy before interpreting comparisons.
        id: evaluation-releases-and-rollback.transfer.v2.2
        retired: true
      - prompt: A rollback restores weights but retains an incompatible tokenizer. What is missing?
        answer: a
        options:
          - id: a
            text: Restoration of the matching input and output definitions
          - id: b
            text: A larger sample of the broken release’s answers
          - id: c
            text: Re-evaluation of the mixed artifact set without restoring compatibility
        feedback: A partial rollback can leave the original incompatibility unresolved.
        id: evaluation-releases-and-rollback.transfer.v2.3
        retired: true
      - prompt: A bad release already sent incorrect messages. What can reverting software accomplish?
        answer: a
        options:
          - id: c
            text: Prove that the previous version caused no errors
          - id: b
            text: Erase recipients’ previously delivered messages
          - id: a
            text: Restore later operation while sent messages need separate handling
        feedback: Recovery of a service does not reverse every consequence.
        id: evaluation-releases-and-rollback.transfer.v2.4
        retired: true
  - id: evaluation-releases-and-rollback.base.v3
    objective_ref: objective.evaluation-releases-and-rollback
    task: base
    response_type: single_choice
    points: 1
    hint: "Place the evidence on the ladder: offline gates test saved cases, shadow mode sees live inputs but shows nothing, a canary exposes a few users to catch breakage, and an A/B test measures a difference."
    remediation_scene: evaluation-releases-and-rollback.s3
    variants:
      - id: evaluation-releases-and-rollback.base.v3.1
        prompt: A candidate runs in shadow mode for two days on copies of all live questions. Which question can this run answer?
        options:
          - id: b
            text: Whether visitors find its answers more satisfying than the old ones
          - id: a
            text: Whether it crashes or slows down on the questions real visitors ask
          - id: c
            text: Whether its answers make visitors come back to the library more often
        answer: a
        feedback: Shadow mode sees real inputs, so it exposes crashes, slowdowns, and answer differences. No visitor saw its answers, so it can't measure satisfaction or return visits; that takes a canary or A/B test.
      - id: evaluation-releases-and-rollback.base.v3.2
        prompt: A team sends 5% of traffic to a candidate for one day to watch for errors and slowdowns. Which claim can this support?
        options:
          - id: c
            text: The candidate improves satisfaction by a measurable amount
          - id: b
            text: The candidate will have no incidents once it serves everyone
          - id: a
            text: The candidate isn't obviously broken on real traffic so far
        answer: a
        feedback: A short canary catches gross breakage. It's too small and too brief to measure an improvement, which needs a pre-planned A/B test, and one clean day can't rule out problems that only appear at full load.
      - id: evaluation-releases-and-rollback.base.v3.3
        prompt: Release r16 kept the same model but changed the prompt and raised retrieved chunks from 5 to 8. Answers get worse, and the team rolls back. What must the rollback restore?
        options:
          - id: a
            text: The whole previous manifest, including prompt and retrieval settings
          - id: b
            text: The previous model weights, since the model writes the answers
          - id: c
            text: The previous prompt, since the chunk count is a minor setting
        answer: a
        feedback: The unit of rollback is the manifest. The model didn't change, so restoring it does nothing, and leaving 8 chunks in place keeps half of the change that caused the problem.
      - id: evaluation-releases-and-rollback.base.v3.4
        prompt: A candidate scores 197/200 overall against the live release's 196/200, but holiday questions fall from 38/40 to 35/40. The gate says no slice may get worse. What happens?
        options:
          - id: b
            text: It passes, because the overall score went up by one question
          - id: a
            text: It is blocked until the holiday regression is fixed
          - id: c
            text: It moves to a canary so holiday questions can be watched live
        answer: a
        feedback: Gates are written in advance so a better average can't hide a worse slice. Sending a known regression to real visitors, even a few, would knowingly give some of them wrong holiday hours.
  - id: evaluation-releases-and-rollback.transfer.v3
    objective_ref: objective.evaluation-releases-and-rollback
    task: transfer
    response_type: single_choice
    points: 1
    hint: Ask what could go wrong for real users, how much traffic it takes to see it, and which parts a rollback must bring back together.
    remediation_scene: evaluation-releases-and-rollback.canary-math
    variants:
      - id: evaluation-releases-and-rollback.transfer.v3.1
        prompt: A bank's new fraud model runs in shadow mode. It would block 3% of card payments, against 1% for the current model. What is the best next step?
        options:
          - id: a
            text: Review a sample of payments that only the new model would block
          - id: c
            text: Start a 50% A/B test to measure the effect on customers directly
          - id: b
            text: Roll it out, since shadow mode showed no crashes or slowdowns
        answer: a
        feedback: Shadow mode's gift is a list of disagreements to inspect before anyone is affected. Tripling blocks could mean better fraud catching or many angry customers; a 50% test would find out at the expense of half of them.
      - id: evaluation-releases-and-rollback.transfer.v3.2
        prompt: A travel agent's candidate model runs in shadow mode with its booking tool still connected. Its text replies are thrown away. What is the problem?
        options:
          - id: b
            text: Shadow mode can't measure the candidate's response time
          - id: a
            text: Its bookings are real actions that no customer asked for
          - id: c
            text: Throwing away its replies wastes useful evaluation data
        answer: a
        feedback: Hiding the text doesn't hide the actions. In shadow mode, tools that change the world must be switched off or pointed at a test system. Shadow runs do measure latency, and logging replies rather than discarding them is an easy fix for the smaller issue.
      - id: evaluation-releases-and-rollback.transfer.v3.3
        prompt: An online shop checks its A/B test of a new product ranking every morning and stops on the first day the new ranking looks significantly better. What is the risk?
        options:
          - id: c
            text: The canary will expose too many shoppers to the new ranking
          - id: b
            text: The offline gates will no longer apply to the final result
          - id: a
            text: Repeated checks make it likely a chance blip is declared a win
        answer: a
        feedback: Each look is another chance for noise to cross the line, so stopping at the first good-looking day inflates false wins. Fix the sample size in advance, or use a method designed for repeated looks. Canary exposure and offline gates are separate questions.
      - id: evaluation-releases-and-rollback.transfer.v3.4
        prompt: A new speech model handles 300 calls as a canary with zero transcription failures. The old model fails on 0.5% of calls. What can the team conclude?
        options:
          - id: a
            text: Its failure rate could still be near 1%, so the canary should continue
          - id: b
            text: Its failure rate is now zero, so it can be rolled out to everyone
          - id: c
            text: It has at least halved the old failure rate, so it is an improvement
        answer: a
        feedback: By the rule of three, zero failures in 300 calls still allows a rate up to about 3/300 = 1%, double the old rate. Even the old 0.5% model would show zero failures in 300 calls about one time in five, so this proves little either way.
  - id: evaluation-releases-and-rollback.calc.v3
    objective_ref: objective.evaluation-releases-and-rollback
    task: base
    response_type: numeric
    points: 1
    hint: "Canary answers per day = total questions per day × canary share. Days = answers needed ÷ answers per day. Rule of three: zero failures in n tries allows a rate up to about 3/n."
    remediation_scene: evaluation-releases-and-rollback.canary-math
    absolute_tolerance: 0.05
    variants:
      - id: evaluation-releases-and-rollback.calc.v3.1
        prompt: A canary needs about 800 answers to catch a doubling of the error rate. The service gets 4,000 questions a day, and the canary takes 5% of them. How many days must it run?
        answer: 4
        feedback: 5% of 4,000 is 200 canary answers a day, and 800 ÷ 200 = 4 days.
      - id: evaluation-releases-and-rollback.calc.v3.2
        prompt: A canary needs about 900 answers to catch the failure the team fears. The service gets 1,500 questions a day, and the canary takes 10% of them. How many days must it run?
        answer: 6
        feedback: 10% of 1,500 is 150 answers a day, and 900 ÷ 150 = 6 days.
      - id: evaluation-releases-and-rollback.calc.v3.3
        prompt: A canary needs 1,000 answers, and the team wants a verdict in 2 days. The service gets 2,000 questions a day. What canary share, in percent, is needed?
        answer: 25
        feedback: 1,000 answers over 2 days is 500 a day, and 500 ÷ 2,000 = 25% of traffic, five times the exposure of a 5% canary.
      - id: evaluation-releases-and-rollback.calc.v3.4
        prompt: A canary served 600 answers with zero errors. Using the rule of three, what is the approximate upper bound on its error rate, in percent?
        answer: 0.5
        feedback: 3 ÷ 600 = 0.005, or 0.5%. Zero errors so far is consistent with any rate up to about half a percent.
