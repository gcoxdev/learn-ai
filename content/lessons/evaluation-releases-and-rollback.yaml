schema_version: 0.2-draft
lesson:
  id: evaluation-releases-and-rollback
  version: 0.1.0-draft
  title: Release changes with evidence and a recovery path
  state: draft
  summary: AI releases combine offline evaluation, controlled online experiments, artifact promotion, and rollback;
    define acceptance criteria and monitor the exact behavior changed by a release.
  slot: M33.3
  category: learning
  minutes: 12
  sources:
  - title: The ML Test Score
    url: https://research.google/pubs/the-ml-test-score-a-rubric-for-ml-production-readiness-and-technical-debt-reduction/
  - title: NIST AI Risk Management Framework
    url: https://www.nist.gov/itl/ai-risk-management-framework
objectives:
- id: objective.evaluation-releases-and-rollback
  version: 1-draft
  statement: AI releases combine offline evaluation, controlled online experiments, artifact promotion, and rollback;
    define acceptance criteria and monitor the exact behavior changed by a release.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - evaluation-releases-and-rollback.base
  - evaluation-releases-and-rollback.transfer
  prerequisites:
  - anyOf:
    - objective.production-data-and-model-artifacts
  - anyOf:
    - objective.evaluation-selection
scenes:
- id: evaluation-releases-and-rollback.s1
  title: Gate on offline evidence
  type: explanation
  depth: intuition
  objective_refs:
  - objective.evaluation-releases-and-rollback
  markdown: Run representative task tests, critical failure cases, and compatibility checks before exposing a change.
    Include data, prompt, retrieval, tool, and model updates as relevant. A new model revision is only one possible
    source of changed product behavior.
  text_mode: Run representative task tests, critical failure cases, and compatibility checks before exposing a change.
    Include data, prompt, retrieval, tool, and model updates as relevant. A new model revision is only one possible
    source of changed product behavior.
  bridges: []
- id: evaluation-releases-and-rollback.s2
  title: Use controlled online exposure
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.evaluation-releases-and-rollback
  markdown: A shadow deployment can observe candidate outputs without using them for user decisions. A canary exposes
    a limited portion of traffic; an A/B experiment compares assigned groups under a defined design. Each answers
    different questions and needs appropriate task and data boundaries.
  text_mode: A shadow deployment can observe candidate outputs without using them for user decisions. A canary exposes
    a limited portion of traffic; an A/B experiment compares assigned groups under a defined design. Each answers
    different questions and needs appropriate task and data boundaries.
  bridges: []
- id: evaluation-releases-and-rollback.s3
  title: Predefine decision and stopping rules
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.evaluation-releases-and-rollback
  markdown: Specify success metrics, guardrails, duration or evidence requirements, and conditions that halt exposure.
    Repeatedly checking a noisy metric and stopping only when it looks favorable can bias conclusions. Operational
    incident stops and statistical success rules serve different purposes.
  text_mode: Specify success metrics, guardrails, duration or evidence requirements, and conditions that halt exposure.
    Repeatedly checking a noisy metric and stopping only when it looks favorable can bias conclusions. Operational
    incident stops and statistical success rules serve different purposes.
  bridges: []
- id: evaluation-releases-and-rollback.s4
  title: Revert the complete change
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.evaluation-releases-and-rollback
  markdown: Rollback may need the prior model, prompt, schema, index, and feature definitions. A database migration
    can complicate reversal. Test recovery and retain exact artifacts so the team can restore a known operating
    state and investigate the cause of a regression.
  text_mode: Rollback may need the prior model, prompt, schema, index, and feature definitions. A database migration
    can complicate reversal. Test recovery and retain exact artifacts so the team can restore a known operating
    state and investigate the cause of a regression.
  bridges: []
- id: evaluation-releases-and-rollback.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.evaluation-releases-and-rollback
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: AI releases combine offline evaluation, controlled online experiments, artifact promotion, and rollback;
    define acceptance criteria and monitor the exact behavior changed by a release.
- id: evaluation-releases-and-rollback.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.evaluation-releases-and-rollback
  markdown: AI releases combine offline evaluation, controlled online experiments, artifact promotion, and rollback;
    define acceptance criteria and monitor the exact behavior changed by a release.
  text_mode: AI releases combine offline evaluation, controlled online experiments, artifact promotion, and rollback;
    define acceptance criteria and monitor the exact behavior changed by a release.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - evaluation-releases-and-rollback.s1
    - evaluation-releases-and-rollback.s2
    - evaluation-releases-and-rollback.s3
    - evaluation-releases-and-rollback.s4
    - evaluation-releases-and-rollback.check
    gate_refs:
    - gate.core
  scene_aliases:
    evaluation-releases-and-rollback.recap: evaluation-releases-and-rollback.check
assessment_families:
- id: evaluation-releases-and-rollback.base
  objective_ref: objective.evaluation-releases-and-rollback
  task: base
  response_type: single_choice
  points: 1
  hint: 'Use controlled online exposure: trace the inputs, operation, and result before choosing.'
  remediation_scene: evaluation-releases-and-rollback.s2
  variants:
  - id: evaluation-releases-and-rollback.base.1
    prompt: What does shadow deployment avoid doing by definition here?
    options:
    - id: b
      text: Generating any candidate output
    - id: c
      text: Collecting any evaluation evidence
    - id: a
      text: Using candidate outputs to control the user-facing decision
    answer: a
    feedback: It observes behavior without making it the active decision path.
  - id: evaluation-releases-and-rollback.base.2
    prompt: How does a canary limit exposure?
    options:
    - id: c
      text: It eliminates monitoring
    - id: a
      text: It serves a bounded portion of traffic
    - id: b
      text: It guarantees no user impact
    answer: a
    feedback: Limited rollout reduces the scope of early exposure.
- id: evaluation-releases-and-rollback.transfer
  objective_ref: objective.evaluation-releases-and-rollback
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Revert the complete change: trace the inputs, operation, and result before choosing.'
  remediation_scene: evaluation-releases-and-rollback.s4
  variants:
  - id: evaluation-releases-and-rollback.transfer.1
    prompt: Why predefine experiment stopping rules?
    options:
    - id: c
      text: Only to name the release
    - id: a
      text: To avoid selectively declaring success from repeated noisy checks
    - id: b
      text: To prevent every operational stop
    answer: a
    feedback: Adaptive peeking can bias statistical conclusions.
  - id: evaluation-releases-and-rollback.transfer.2
    prompt: Why might rolling back only weights be insufficient?
    options:
    - id: a
      text: Prompts, schemas, indexes, or features may also have changed
    - id: b
      text: Weights never affect behavior
    - id: c
      text: Only the UI can regress
    answer: a
    feedback: The deployed system is a set of coupled artifacts.
