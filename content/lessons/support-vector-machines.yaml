assessment_families:
- id: support-vector-machines.base
  objective_ref: objective.support-vector-machines
  task: base
  response_type: single_choice
  points: 1
  hint: 'Allow imperfect separation: trace the inputs, operation, and result before choosing.'
  remediation_scene: support-vector-machines.s2
  variants:
  - id: support-vector-machines.base.1
    prompt: Which points most directly define a maximum-margin boundary?
    options:
    - id: c
      text: Every possible future example
    - id: a
      text: Support vectors near the margin
    - id: b
      text: Only the farthest correctly classified points
    answer: a
    feedback: Support vectors constrain the fitted margin solution.
  - id: support-vector-machines.base.2
    prompt: What does a kernel provide in this setting?
    options:
    - id: a
      text: Inner products in an implicit feature space
    - id: b
      text: A guaranteed probability calibration
    - id: c
      text: An automatic causal model
    answer: a
    feedback: The kernel specifies geometry used by the optimization.
- id: support-vector-machines.transfer
  objective_ref: objective.support-vector-machines
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Evaluate the complete classifier: trace the inputs, operation, and result before choosing.'
  remediation_scene: support-vector-machines.s4
  variants:
  - id: support-vector-machines.transfer.1
    prompt: A raw SVM score is 2. Is it automatically a probability?
    options:
    - id: a
      text: No; scores need a defined calibration procedure for that use
    - id: b
      text: Yes; every score lies between zero and one
    - id: c
      text: Only when the kernel is nonlinear
    answer: a
    feedback: Decision scores and calibrated probabilities are different outputs.
  - id: support-vector-machines.transfer.2
    prompt: Feature units change dramatically without rescaling. Can the margin solution change?
    options:
    - id: b
      text: No; every SVM ignores feature scale
    - id: c
      text: Only if labels are text
    - id: a
      text: Yes; the geometry and regularization are affected
    answer: a
    feedback: Distances and inner products depend on representation scale.
