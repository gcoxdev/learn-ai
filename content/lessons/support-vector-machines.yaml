scenes:
- id: support-vector-machines.s1
  title: A separating line can leave different gaps
  type: explanation
  depth: intuition
  objective_refs:
  - objective.support-vector-machines
  markdown: When two classes are linearly separable, several boundaries may classify training points correctly.
    A maximum-margin classifier favors a boundary far from the nearest points under its geometry. Those influential
    nearby points are support vectors. Margin is a property of the model and representation, not a universal robustness
    guarantee.
  text_mode: When two classes are linearly separable, several boundaries may classify training points correctly.
    A maximum-margin classifier favors a boundary far from the nearest points under its geometry. Those influential
    nearby points are support vectors. Margin is a property of the model and representation, not a universal robustness
    guarantee.
  bridges: []
- id: support-vector-machines.s2
  title: Allow imperfect separation
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.support-vector-machines
  markdown: Soft-margin SVMs trade a large margin against violations. The parameter commonly called C controls the
    penalty on violations in a standard formulation. Larger C emphasizes fitting violations more strongly; scaling
    conventions vary, so read the actual objective. Outliers and feature units can strongly affect the boundary.
  text_mode: Soft-margin SVMs trade a large margin against violations. The parameter commonly called C controls
    the penalty on violations in a standard formulation. Larger C emphasizes fitting violations more strongly; scaling
    conventions vary, so read the actual objective. Outliers and feature units can strongly affect the boundary.
  bridges:
  - geometry-and-symmetry
  - optimization-math
- id: support-vector-machines.s3
  title: Use a kernel to change the geometry
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.support-vector-machines
  markdown: A kernel computes inner products in an implicit feature space. A suitable nonlinear kernel can produce
    a nonlinear boundary in the original input. The kernel must satisfy the required mathematical conditions for
    the intended method. This is not arbitrary similarity plugged into an otherwise guaranteed algorithm.
  text_mode: A kernel computes inner products in an implicit feature space. A suitable nonlinear kernel can produce
    a nonlinear boundary in the original input. The kernel must satisfy the required mathematical conditions for
    the intended method. This is not arbitrary similarity plugged into an otherwise guaranteed algorithm.
  bridges: []
- id: support-vector-machines.s4
  title: Evaluate the complete classifier
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.support-vector-machines
  markdown: Tune regularization and kernel settings using validation within the training process. Prediction scores
    are not automatically calibrated probabilities. Kernel methods can become costly with many training examples,
    while linear methods can scale differently. Compare margin, task performance, memory, and inference cost under
    the same data split.
  text_mode: Tune regularization and kernel settings using validation within the training process. Prediction scores
    are not automatically calibrated probabilities. Kernel methods can become costly with many training examples,
    while linear methods can scale differently. Compare margin, task performance, memory, and inference cost under
    the same data split.
  bridges: []
