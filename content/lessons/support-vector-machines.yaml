schema_version: 0.2-draft
lesson:
  id: support-vector-machines
  version: 0.3.0-draft
  title: Choose a boundary with a margin
  state: draft
  summary: Draw a boundary between two groups and examine the gap around it before allowing imperfect separation.
  slot: M07.6
  category: learning
  sources:
  - title: An Introduction to Statistical Learning — authors’ materials
    url: https://www.statlearning.com/
objectives:
- id: objective.support-vector-machines
  version: 1-draft
  statement: Support vector machines balance margin and classification errors; kernels define feature-space
    similarities without requiring every transformed coordinate to be written explicitly.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - support-vector-machines.base
  - support-vector-machines.transfer
  prerequisites:
  - anyOf:
    - objective.logistic-regression
  - anyOf:
    - objective.geometry-and-symmetry
  - anyOf:
    - objective.optimization-math
scenes:
- id: support-vector-machines.s1
  title: Leave room around the boundary
  type: explanation
  depth: intuition
  objective_refs:
  - objective.support-vector-machines
  markdown: 'Picture red points on one side of a line and blue points on the other. Several lines may separate
    the training points correctly. A **maximum-margin** classifier chooses the boundary with the largest gap
    to the nearest points under its distance measure.


    Those nearest points are the **support vectors**. **Support vector machines (SVMs)** are a family of methods
    built around this idea. In a hard-margin solution, moving a support vector may move the best line, while
    a distant point can have no effect. The margin depends on the representation; a large gap alone does not
    establish reliability on every new input.'
  text_mode: 'Picture red points on one side of a line and blue points on the other. Several lines may separate
    the training points correctly. A **maximum-margin** classifier chooses the boundary with the largest gap
    to the nearest points under its distance measure.


    Those nearest points are the **support vectors**. **Support vector machines (SVMs)** are a family of methods
    built around this idea. In a hard-margin solution, moving a support vector may move the best line, while
    a distant point can have no effect. The margin depends on the representation; a large gap alone does not
    establish reliability on every new input.'
  bridges: []
- id: support-vector-machines.s2
  title: Allow imperfect separation
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.support-vector-machines
  markdown: 'Soft-margin SVMs trade a large margin against violations. The parameter commonly called C controls
    the penalty on violations in a standard formulation. Larger C emphasizes fitting violations more strongly;
    scaling conventions vary, so read the actual objective. Outliers and feature units can strongly affect
    the boundary.


    A **violation** includes a point inside the intended margin, even if it remains on the correct side, as
    well as a misclassified point. A soft margin allows such compromises. Raising C makes those violations
    more expensive relative to the margin term; it does not mean “increase accuracy by C percent.”'
  text_mode: 'Soft-margin SVMs trade a large margin against violations. The parameter commonly called C controls
    the penalty on violations in a standard formulation. Larger C emphasizes fitting violations more strongly;
    scaling conventions vary, so read the actual objective. Outliers and feature units can strongly affect
    the boundary.


    A **violation** includes a point inside the intended margin, even if it remains on the correct side, as
    well as a misclassified point. A soft margin allows such compromises. Raising C makes those violations
    more expensive relative to the margin term; it does not mean “increase accuracy by C percent.”'
  bridges:
  - geometry-and-symmetry
  - optimization-math
- id: support-vector-machines.s3
  title: Use a kernel to change the geometry
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.support-vector-machines
  markdown: 'An **inner product** multiplies matching coordinates and adds the results: [1, 2] with [3, 4]
    gives 1 × 3 + 2 × 4 = 11.


    A **kernel** can compute an inner product after an implied feature transformation without constructing
    all the transformed coordinates. A suitable nonlinear kernel lets a simple boundary in the transformed
    space become a curved boundary in the original input space.


    The kernel must satisfy the mathematical conditions required by the method. An arbitrary similarity score
    does not automatically preserve its guarantees. The vector and linear-algebra side lessons explain the
    underlying calculation.'
  text_mode: 'An **inner product** multiplies matching coordinates and adds the results: [1, 2] with [3, 4]
    gives 1 × 3 + 2 × 4 = 11.


