assessment_families:
  - id: support-vector-machines.base
    objective_ref: objective.support-vector-machines
    task: base
    response_type: single_choice
    points: 1
    hint: 'Allow imperfect separation: trace the inputs, operation, and result before choosing.'
    remediation_scene: support-vector-machines.s2
    variants:
      - id: support-vector-machines.base.1
        prompt: Which points most directly define a maximum-margin boundary?
        options:
          - id: c
            text: Every possible future example
          - id: a
            text: Support vectors near the margin
          - id: b
            text: Only the farthest correctly classified points
        answer: a
        feedback: Support vectors constrain the fitted margin solution.
        retired: true
      - id: support-vector-machines.base.2
        prompt: What does a kernel provide in this setting?
        options:
          - id: a
            text: Inner products in an implicit feature space
          - id: b
            text: A guaranteed probability calibration
          - id: c
            text: An automatic causal model
        answer: a
        feedback: The kernel specifies geometry used by the optimization.
        retired: true
  - id: support-vector-machines.transfer
    objective_ref: objective.support-vector-machines
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Evaluate the complete classifier: trace the inputs, operation, and result before choosing.'
    remediation_scene: support-vector-machines.s4
    variants:
      - id: support-vector-machines.transfer.1
        prompt: A raw SVM score is 2. Is it automatically a probability?
        options:
          - id: a
            text: No; scores need a defined calibration procedure for that use
          - id: b
            text: Yes; every score lies between zero and one
          - id: c
            text: Only when the kernel is nonlinear
        answer: a
        feedback: Decision scores and calibrated probabilities are different outputs.
        retired: true
      - id: support-vector-machines.transfer.2
        prompt: Feature units change dramatically without rescaling. Can the margin solution change?
        options:
          - id: b
            text: No; every SVM ignores feature scale
          - id: c
            text: Only if labels are text
          - id: a
            text: Yes; the geometry and regularization are affected
        answer: a
        feedback: Distances and inner products depend on representation scale.
        retired: true
  - id: support-vector-machines.base.v2
    objective_ref: objective.support-vector-machines
    task: base
    response_type: numeric_fields_with_reason
    points: 1
    hint: Score f = w · x + b. The hinge loss is max(0, 1 − y × f), and the margin's full width is 2 divided by the length of w.
    remediation_scene: support-vector-machines.s5
    variants:
      - id: support-vector-machines.base.v2.1
        prompt: 'An SVM has w = (1, 0) and b = −2. A training point at (3, 5) has label y = +1. Find its score f, its hinge loss, and the margin width 2 / ‖w‖.'
        feedback: f = 1 × 3 + 0 × 5 − 2 = 1, so y × f = 1 and the hinge loss is max(0, 0) = 0; the point sits exactly on its margin line. ‖w‖ = 1, so the margin is 2.
        answers:
          score: 1
          hinge: 0
          margin: 2
        reason_answer: intrude
        reason_options:
          - id: intrude
            text: Zero once y × f reaches 1, then rising steadily as the point intrudes.
          - id: zero-one
            text: One for each misclassified point and zero for each correct one.
          - id: squared
            text: The squared distance from the point to the decision boundary.
      - id: support-vector-machines.base.v2.2
        prompt: 'An SVM has w = (0.5, 0.5) and b = −2. A training point at (2, 1) has label y = +1. Find its score f, its hinge loss, and the margin width 2 / ‖w‖ (two decimals).'
        feedback: f = 1 + 0.5 − 2 = −0.5, on the wrong side, so the hinge loss is max(0, 1 − (−0.5)) = 1.5. ‖w‖ = √0.5 ≈ 0.707, so the margin is about 2.83.
        answers:
          score: -0.5
          hinge: 1.5
          margin: 2.83
        reason_answer: intrude
        reason_options:
          - id: zero-one
            text: One for each misclassified point and zero for each correct one.
          - id: intrude
            text: Zero once y × f reaches 1, then rising steadily as the point intrudes.
          - id: squared
            text: The squared distance from the point to the decision boundary.
      - id: support-vector-machines.base.v2.3
        prompt: 'An SVM has w = (2, 0) and b = −1. A training point at (0.25, 3) has label y = −1. Find its score f, its hinge loss, and the margin width 2 / ‖w‖.'
        feedback: f = 2 × 0.25 − 1 = −0.5. The label is −1, so y × f = 0.5, and the hinge loss is 1 − 0.5 = 0.5. The point is on the correct side but inside the margin. ‖w‖ = 2, so the margin is 1.
        answers:
          score: -0.5
          hinge: 0.5
          margin: 1
        reason_answer: intrude
        reason_options:
          - id: squared
            text: The squared distance from the point to the decision boundary.
          - id: zero-one
            text: One for each misclassified point and zero for each correct one.
          - id: intrude
            text: Zero once y × f reaches 1, then rising steadily as the point intrudes.
      - id: support-vector-machines.base.v2.4
        prompt: 'An SVM has w = (3, 4) and b = 0. A training point at (−1, 0.5) has label y = +1. Find its score f, its hinge loss, and the margin width 2 / ‖w‖.'
        feedback: f = −3 + 2 = −1, on the wrong side, so the hinge loss is 1 − (−1) = 2. ‖w‖ = √(9 + 16) = 5, so the margin is 2/5 = 0.4. A long w means a narrow margin.
        answers:
          score: -1
          hinge: 2
          margin: 0.4
        reason_answer: intrude
        reason_options:
          - id: intrude
            text: Zero once y × f reaches 1, then rising steadily as the point intrudes.
          - id: squared
            text: The squared distance from the point to the decision boundary.
          - id: zero-one
            text: One for each misclassified point and zero for each correct one.
    absolute_tolerance: 0.01
    numeric_fields:
      - id: score
        label: Score f
      - id: hinge
        label: Hinge loss
      - id: margin
        label: Margin width
  - id: support-vector-machines.transfer.v2
    objective_ref: objective.support-vector-machines
    task: transfer
    response_type: single_choice
    points: 1
    hint: C prices margin violations against margin width, distances depend on each feature's units, and an SVM score is a distance-like number rather than a probability.
    remediation_scene: support-vector-machines.s4
    variants:
      - id: support-vector-machines.transfer.v2.1
        prompt: 'An SVM for sorting support tickets is tried with three values of C. C = 0.01: 81% validation accuracy. C = 1: 88%. C = 100: 84%, with 100% training accuracy. Which C should the team keep?'
        options:
          - id: a
            text: C = 100, since it classifies every training ticket correctly
          - id: b
            text: C = 1, since it scores best on the validation tickets
          - id: c
            text: C = 0.01, since it gives the widest and safest margin
        answer: b
        feedback: Validation accuracy stands in for new tickets, and C = 1 leads. C = 100 bends the boundary around every training ticket, noise included; C = 0.01 tolerates so many violations that it underfits.
      - id: support-vector-machines.transfer.v2.2
        prompt: 'An SVM predicts loan default from income in dollars (20,000 to 200,000) and years at the current job (0 to 40). Its boundary ignores job tenure almost entirely. What should be done first?'
        options:
          - id: a
            text: Raise C so that tenure-related errors cost more
          - id: b
            text: Switch to an RBF kernel so the boundary can curve
          - id: c
            text: Standardize both features before training again
        answer: c
        feedback: The margin is a distance, so income, with differences in the tens of thousands, swamps tenure. Standardizing puts both on comparable scales. Raising C or curving the boundary still measures distance mostly in dollars.
      - id: support-vector-machines.transfer.v2.3
        prompt: A hospital wants a risk probability for each patient from its SVM, whose scores range from about −3 to 3. What is the sound approach?
        options:
          - id: b
            text: Pass each raw score through a sigmoid with no further fitting
          - id: c
            text: Treat any score of 1 or more as a 100% risk
          - id: a
            text: Fit a sigmoid that maps scores to rates on held-out patients
        answer: a
        feedback: SVM scores measure position relative to the margin, not frequency. Fitting a sigmoid to held-out outcomes (Platt scaling) turns scores into calibrated probabilities. An unfitted sigmoid gives numbers between 0 and 1 that need not match real rates, and a score past the margin isn't certainty.
      - id: support-vector-machines.transfer.v2.4
        prompt: In a motor-sensor dataset, faulty readings cluster in the middle of the plot and healthy readings form a ring around them. A linear SVM does little better than guessing. What should you try?
        options:
          - id: c
            text: An RBF kernel, or adding the feature x₁² + x₂²
          - id: b
            text: A much larger C, so the line fits the points harder
          - id: a
            text: More training readings of the same two features
        answer: c
        feedback: No straight line separates a disk from a ring around it, so no C or amount of data fixes a linear SVM here. A squared-radius feature, or an RBF kernel that does this implicitly, makes the classes separable.
      - id: support-vector-machines.transfer.v2.5
        prompt: A team trains an RBF-kernel SVM on 2 million labeled transactions, and training hasn't finished after two days. What is the best explanation and fix?
        options:
          - id: a
            text: C is set too high; lowering it would speed up the training
          - id: b
            text: Kernel SVMs compare pairs; use a linear SVM or boosted trees
          - id: c
            text: The features need scaling first, which will fix the slowdown
        answer: b
        feedback: Two million examples make about 2 × 10¹² pairs of points for the kernel to compare. Linear SVMs and gradient-boosted trees scale to this size. C and scaling affect the fit but can't remove the pairwise cost.
