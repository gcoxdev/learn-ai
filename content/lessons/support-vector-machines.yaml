  bridges: []
- id: support-vector-machines.s4
  title: Evaluate the complete classifier
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.support-vector-machines
  markdown: Tune regularization and kernel settings using validation within the training process. Prediction
    scores are not automatically calibrated probabilities. Kernel methods can become costly with many training
    examples, while linear methods can scale differently. Compare margin, task performance, memory, and inference
    cost under the same data split.
  text_mode: Tune regularization and kernel settings using validation within the training process. Prediction
    scores are not automatically calibrated probabilities. Kernel methods can become costly with many training
    examples, while linear methods can scale differently. Compare margin, task performance, memory, and inference
    cost under the same data split.
  bridges: []
