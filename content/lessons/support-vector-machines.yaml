lesson:
  id: support-vector-machines
  version: 0.4.0-draft
  title: Choose a boundary with a margin
  state: draft
  summary: Many lines can separate handwritten 0s from 1s. Support vector machines pick the one with the most breathing room, and a kernel lets that line bend.
  slot: M07.6
  category: learning
  sources:
    - title: An Introduction to Statistical Learning — authors’ materials
      url: https://www.statlearning.com/
    - title: "Cortes & Vapnik (1995), Support-vector networks"
      url: https://doi.org/10.1007/BF00994018
objectives:
  - id: objective.support-vector-machines
    version: 2-draft
    statement: Support vector machines trade a wide margin against training errors; kernels measure similarity in a richer feature space without building it.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - support-vector-machines.base.v2
      - support-vector-machines.transfer.v2
    prerequisites:
      - anyOf:
          - objective.logistic-regression
      - anyOf:
          - objective.geometry-and-symmetry
      - anyOf:
          - objective.optimization-math
scenes:
  - id: support-vector-machines.s1
    title: Draw the line with the most breathing room
    type: explanation
    depth: intuition
    objective_refs:
      - objective.support-vector-machines
    markdown: |-
      A scanner must tell handwritten 0s from 1s. For each digit it measures two things: how much ink it uses, $x_1$, and how wide it is, $x_2$, both rescaled to small numbers. Thin 1s land near the bottom-left of a plot and round 0s toward the top-right. Many straight lines separate the training digits perfectly. Which should you pick?

      The one that stays farthest from both groups, so a slightly thin 0 or an inky 1 still lands on the right side. The empty band around the boundary, reaching out to the closest training points on each side, is the **margin**, and a **maximum-margin classifier** chooses the line that makes this band as wide as possible.

      Only the closest points matter. They're called **support vectors** because they hold the boundary in place, like tent poles. Move a digit far from the line and nothing changes; move a support vector and the line moves with it. **Support vector machines (SVMs)** are the family of methods built on this idea.

      :::story From margins to kernels
      Vladimir Vapnik and Alexey Chervonenkis studied maximum-margin lines in the Soviet Union in the 1960s. Boser, Guyon, and Vapnik added kernels in 1992, and Cortes and Vapnik the "soft margin" in 1995. Through the 2000s, SVMs were among the strongest methods for text classification and handwritten digits, until deep networks pulled ahead on images in the early 2010s.
      :::
    bridges: []
  - id: support-vector-machines.s2
    title: "Measure the margin: 2 divided by the length of w"
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.support-vector-machines
    markdown: |-
      An SVM scores a digit with a linear score, just like logistic regression: $f(\mathbf{x}) = \mathbf{w}^\top\mathbf{x} + b$. Label the classes $y = +1$ for a 0 and $y = -1$ for a 1; the boundary is where $f = 0$. The SVM adds one convention: the closest points on each side must score exactly +1 or −1. The margin's edges are then the lines $f = +1$ and $f = -1$, and geometry gives its width:

      $$\text{margin} = \frac{2}{\lVert \mathbf{w} \rVert}$$

      where $\lVert\mathbf{w}\rVert$ is the length of the weight vector. Take support vectors at (1, 1), a 1, and (3, 3), a 0. The widest line between them is $x_1 + x_2 = 4$, written with $\mathbf{w} = (0.5, 0.5)$ and $b = -2$:

      - $f(3, 3) = 0.5 \times 3 + 0.5 \times 3 - 2 = +1$
      - $f(1, 1) = 0.5 + 0.5 - 2 = -1$
      - $\lVert\mathbf{w}\rVert = \sqrt{0.25 + 0.25} \approx 0.707$, so the margin is $2 / 0.707 \approx 2.83$, exactly the distance from (1, 1) to (3, 3).

      A wide margin means a short $\mathbf{w}$. So the SVM minimizes $\tfrac{1}{2}\lVert\mathbf{w}\rVert^2$ while requiring $y_i f(\mathbf{x}_i) \ge 1$ for every training digit.

      :::predict The scanner meets a cramped 0 at (2.5, 2). Which side does it land on, and how comfortably?
      $f = 0.5 \times 2.5 + 0.5 \times 2 - 2 = 0.25$. It's positive, so it's read as a 0, but it's below +1: the digit sits inside the margin, where no training point was supposed to be.
      :::
    bridges:
      - geometry-and-symmetry
      - optimization-math
  - id: support-vector-machines.s5
    title: Charge for intruders with the hinge loss
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.support-vector-machines
    markdown: |-
      Real data is messy: some points land inside the margin or on the wrong side. A soft-margin SVM allows that, but charges each point a **hinge loss**:

      $$\ell = \max\big(0,\; 1 - y\,f(\mathbf{x})\big)$$

      | Digit (label 0, so y = +1) | Score f | Hinge loss |
      | --- | ---: | ---: |
      | (4, 4) | 2 | 0: safely beyond the margin |
      | (2.5, 2) | 0.25 | 0.75: inside, right side |
      | (2, 1) | −0.5 | 1.5: wrong side |

      The loss is zero once a point is past its margin line and grows steadily as it intrudes. Unlike cross-entropy, it stops caring once a point is safe, which is why only support vectors shape an SVM. The soft-margin objective is

      $$\min_{\mathbf{w},\,b}\; \tfrac{1}{2}\lVert\mathbf{w}\rVert^2 + C\sum_i \max\big(0,\; 1 - y_i f(\mathbf{x}_i)\big)$$

      The number $C$ is the price of one unit of hinge loss, measured against the width term. Compare two lines for the digits (1, 1), (3, 3), and the cramped 0 at (2.5, 2): the wide line A from before, and line B, with $\mathbf{w} = (1, 1)$ and $b = -3.25$, which clears all three but has a margin of only 1.41:

      ```python run
      import numpy as np

      X = np.array([[1, 1], [3, 3], [2.5, 2]])    # a "1", a "0", and a cramped "0"
      y = np.array([-1, 1, 1])                     # +1 = zero, -1 = one
      candidates = {"A (wide)": (np.array([0.5, 0.5]), -2.0),
                    "B (narrow)": (np.array([1.0, 1.0]), -3.25)}

      for name, (w, b) in candidates.items():
          hinge = np.maximum(0, 1 - y * (X @ w + b))
          print(f"{name}: margin {2 / np.linalg.norm(w):.2f}, hinge losses {hinge}")

      for C in (0.1, 0.5, 2, 10):
          cost = {}
          for name, (w, b) in candidates.items():
              hinge = np.maximum(0, 1 - y * (X @ w + b)).sum()
              cost[name] = 0.5 * w @ w + C * hinge          # the soft-margin objective
          best = min(cost, key=cost.get)
          print(f"C = {C:4}: A costs {cost['A (wide)']:.3f}, B costs {cost['B (narrow)']:.3f} -> pick {best}")
      ```

      Line A costs 0.25 + 0.75C and line B costs 1, so they break even at C = 1 (put 0.9 and 1.1 in the list to watch the switch). Below that, the wide margin wins and the cramped 0 is tolerated; above it, the line squeezes to fit every training digit. Large C makes violations expensive, so the boundary bends toward odd or mislabeled points; small C keeps a wide, calm margin. Choose C by validation.
    bridges: []
  - id: support-vector-machines.s3
    title: Bend the boundary with a kernel
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.support-vector-machines
    markdown: |-
      Some data no straight line can split. Picture sensor readings where faulty motors cluster in the middle and healthy ones form a ring around them. Add a new feature, $x_1^2 + x_2^2$ (the squared distance from the center), and a flat cut on that feature separates them: a circle in the original plot.

      Adding features by hand gets expensive fast. But an SVM's training and predictions can be written entirely in terms of **inner products** between pairs of points: multiply matching coordinates and add. For $\mathbf{x} = [1, 2]$ and $\mathbf{z} = [3, 4]$, that's $1 \times 3 + 2 \times 4 = 11$. A **kernel** is a function that returns the inner product of two points *after* a feature transformation, without ever building the new features.

      Check one. The kernel $K(\mathbf{x}, \mathbf{z}) = (\mathbf{x}^\top\mathbf{z})^2$ gives $11^2 = 121$. The transformation it stands for is $\phi(\mathbf{x}) = (x_1^2,\ \sqrt{2}\,x_1x_2,\ x_2^2)$. Built by hand, $\phi(\mathbf{x}) = (1,\ 2\sqrt{2},\ 4)$ and $\phi(\mathbf{z}) = (9,\ 12\sqrt{2},\ 16)$, and their inner product is 9 + 48 + 64 = 121. Same answer, without the detour. This shortcut is called the **kernel trick**.

      The most popular choice, the RBF (radial basis function) kernel $K(\mathbf{x}, \mathbf{z}) = e^{-\gamma\lVert\mathbf{x} - \mathbf{z}\rVert^2}$, corresponds to infinitely many features, something you could never build by hand. Its setting $\gamma$ controls how far each training point's influence reaches.
    bridges: []
  - id: support-vector-machines.s4
    title: Using an SVM well
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.support-vector-machines
    markdown: |-
      Say you have 5,000 labeled product reviews, each described by a few thousand word counts: medium-sized data with many features, classic SVM territory. Four habits make it work:

      1. **Scale the features first.** The margin is a distance, so, as with nearest neighbors, a feature in large units takes over.
      2. **Tune C and γ together** on held-out data, trying a grid such as C in {0.1, 1, 10, 100}. The next lesson's cross-validation is the standard way to do it.
      3. **Don't read the score as a probability.** A score of 2 means "well past the margin," not "90% likely." If you need probabilities, fit a sigmoid to the scores on held-out data (Platt scaling).
      4. **Watch the size.** A kernel SVM compares training points in pairs, so 100,000 examples mean about 5 billion pairs. At that scale, use a linear SVM or gradient-boosted trees instead.

      :::mixup "C is like a confidence setting: C = 10 makes the classifier 10 times more accurate."
      C sets a price, not a promise. It says how much one unit of hinge loss costs compared with a narrower margin. Raising it fits the training points more tightly, which can help or hurt on new data; only validation tells you which.
      :::
    bridges: []
  - id: support-vector-machines.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.support-vector-machines
    markdown: Compute scores, hinge losses, and margin widths by hand, then choose C, kernels, and scaling for noisy labels, ring-shaped sensor data, and hospital risk scores.
    takeaway: |-
      An SVM picks the boundary with the widest margin, 2 / ‖w‖, and uses C to price the points that intrude on it. A kernel lets that boundary curve by measuring similarity in a richer feature space.
  - id: support-vector-machines.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.support-vector-machines
    markdown: |-
      An SVM seeks a boundary with a useful margin while accounting for violations. Kernels change the geometry in which that boundary is chosen.
