lesson:
  id: support-vector-machines
  version: 0.1.0-draft
  title: Choose a boundary with a margin
  state: draft
  summary: Support vector machines balance margin and classification errors; kernels define feature-space similarities
    without requiring every transformed coordinate to be written explicitly.
  slot: M07.6
  category: learning
  sources:
  - title: An Introduction to Statistical Learning — authors’ materials
    url: https://www.statlearning.com/
objectives:
- id: objective.support-vector-machines
  version: 1-draft
  statement: Support vector machines balance margin and classification errors; kernels define feature-space similarities
    without requiring every transformed coordinate to be written explicitly.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - support-vector-machines.base
  - support-vector-machines.transfer
  prerequisites:
