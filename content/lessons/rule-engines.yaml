schema_version: 0.2-draft
lesson:
  id: rule-engines
  version: 0.1.0-draft
  title: From facts to conclusions—and backward from a goal
  state: draft
  summary: Rule engines apply explicit conditions; forward chaining starts from facts, while backward chaining searches
    for support for a requested conclusion.
  slot: M04.3
  category: learning
  minutes: 12
  sources:
  - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
    url: https://aima.cs.berkeley.edu/
objectives:
- id: objective.rule-engines
  version: 1-draft
  statement: Rule engines apply explicit conditions; forward chaining starts from facts, while backward chaining
    searches for support for a requested conclusion.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - rule-engines.base
  - rule-engines.transfer
  prerequisites:
  - anyOf:
    - objective.first-order-logic
scenes:
- id: rule-engines.s1
  title: Separate knowledge from inference
  type: explanation
  depth: intuition
  objective_refs:
  - objective.rule-engines
  markdown: A rule base stores conditions and conclusions. An inference engine decides which rules to apply. A working
    memory holds current facts. For example, “paid and in stock implies ready to ship” is knowledge; checking its
    conditions against an order is an inference operation.
  text_mode: A rule base stores conditions and conclusions. An inference engine decides which rules to apply. A
    working memory holds current facts. For example, “paid and in stock implies ready to ship” is knowledge; checking
    its conditions against an order is an inference operation.
  bridges: []
- id: rule-engines.s2
  title: Forward chaining follows available facts
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.rule-engines
  markdown: Start with Paid(order7) and InStock(order7). The shipping rule derives Ready(order7). A second rule
    might derive NotifyWarehouse(order7). Forward chaining continues from newly available facts until no useful
    new conclusion is produced or a stopping condition is reached.
  text_mode: Start with Paid(order7) and InStock(order7). The shipping rule derives Ready(order7). A second rule
    might derive NotifyWarehouse(order7). Forward chaining continues from newly available facts until no useful
    new conclusion is produced or a stopping condition is reached.
  bridges: []
- id: rule-engines.s3
  title: Backward chaining starts with the question
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.rule-engines
  markdown: To establish Ready(order7), look for a rule with that conclusion, then try to prove Paid(order7) and
    InStock(order7). These become subgoals. The approach can avoid deriving unrelated facts, but repeated goals,
    loops, and alternative rules need bookkeeping and a clear search strategy.
  text_mode: To establish Ready(order7), look for a rule with that conclusion, then try to prove Paid(order7) and
    InStock(order7). These become subgoals. The approach can avoid deriving unrelated facts, but repeated goals,
    loops, and alternative rules need bookkeeping and a clear search strategy.
  bridges: []
- id: rule-engines.s4
  title: Inspect conflicts and missing knowledge
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.rule-engines
  markdown: Rules can conflict, use stale facts, or omit an exception. A trace shows which premises and rules produced
    a conclusion; it does not prove those premises were correct. Decide how priorities, negation, updates, and uncertainty
    behave. A reliable expert system needs maintained knowledge as well as a correct engine.
  text_mode: Rules can conflict, use stale facts, or omit an exception. A trace shows which premises and rules produced
    a conclusion; it does not prove those premises were correct. Decide how priorities, negation, updates, and uncertainty
    behave. A reliable expert system needs maintained knowledge as well as a correct engine.
  bridges: []
- id: rule-engines.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.rule-engines
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Rule engines apply explicit conditions; forward chaining starts from facts, while backward chaining
    searches for support for a requested conclusion.
- id: rule-engines.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.rule-engines
  markdown: Rule engines apply explicit conditions; forward chaining starts from facts, while backward chaining
    searches for support for a requested conclusion.
  text_mode: Rule engines apply explicit conditions; forward chaining starts from facts, while backward chaining
    searches for support for a requested conclusion.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - rule-engines.s1
    - rule-engines.s2
    - rule-engines.s3
    - rule-engines.s4
    - rule-engines.check
    gate_refs:
    - gate.core
  scene_aliases:
    rule-engines.recap: rule-engines.check
assessment_families:
- id: rule-engines.base
  objective_ref: objective.rule-engines
  task: base
  response_type: single_choice
  points: 1
  hint: 'Forward chaining follows available facts: trace the inputs, operation, and result before choosing.'
  remediation_scene: rule-engines.s2
  variants:
  - id: rule-engines.base.1
    prompt: Which approach starts from available facts and derives new facts?
    options:
    - id: b
      text: Backward chaining only
    - id: c
      text: Token sampling
    - id: a
      text: Forward chaining
    answer: a
    feedback: Forward chaining propagates consequences from the working facts.
  - id: rule-engines.base.2
    prompt: Which approach starts by asking what could establish a goal?
    options:
    - id: c
      text: Only data normalization
    - id: a
      text: Backward chaining
    - id: b
      text: Random pixel generation
    answer: a
    feedback: Backward chaining turns a requested conclusion into supporting subgoals.
- id: rule-engines.transfer
  objective_ref: objective.rule-engines
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Inspect conflicts and missing knowledge: trace the inputs, operation, and result before choosing.'
  remediation_scene: rule-engines.s4
  variants:
  - id: rule-engines.transfer.1
    prompt: A shipping rule requires payment and stock. Only payment is known. Is readiness established?
    options:
    - id: c
      text: Yes; unknown always means true
    - id: a
      text: No; the stock condition still needs support
    - id: b
      text: Yes; one condition is enough
    answer: a
    feedback: A conjunction requires support for both conditions.
  - id: rule-engines.transfer.2
    prompt: An explanation lists every rule used. Does it certify the real-world facts?
    options:
    - id: a
      text: No; a valid trace can still use stale or wrong inputs
    - id: b
      text: Yes; traces make collection errors impossible
    - id: c
      text: Only if printed in a table
    answer: a
    feedback: Inference transparency and factual validity are separate.
