schema_version: 0.2-draft
lesson:
  id: rule-engines
  version: 0.3.0-draft
  title: From facts to conclusions—and backward from a goal
  state: draft
  summary: Follow a shipping rule forward from known facts or backward from the question you want answered.
  slot: M04.3
  category: learning
  sources:
  - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
    url: https://aima.cs.berkeley.edu/
objectives:
- id: objective.rule-engines
  version: 1-draft
  statement: Rule engines apply explicit conditions; forward chaining starts from facts, while backward chaining
    searches for support for a requested conclusion.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - rule-engines.base
  - rule-engines.transfer
  prerequisites:
  - anyOf:
    - objective.first-order-logic
scenes:
- id: rule-engines.s1
  title: Separate the rule from the facts
  type: explanation
  depth: intuition
  objective_refs:
  - objective.rule-engines
  markdown: 'Consider a shipping rule: “If an order is paid for and its items are in stock, it is ready to
    ship.” The **rule base** stores this condition and conclusion. **Working memory** holds the facts about
    current orders. The **inference engine** checks which rules those facts allow it to apply.


    We can write “order 7 has been paid for” as Paid(order7). The name in parentheses matters: a payment for
    order 8 cannot satisfy the condition for order 7. The engine must match facts about the same order.'
  text_mode: 'Consider a shipping rule: “If an order is paid for and its items are in stock, it is ready to
    ship.” The **rule base** stores this condition and conclusion. **Working memory** holds the facts about
    current orders. The **inference engine** checks which rules those facts allow it to apply.


    We can write “order 7 has been paid for” as Paid(order7). The name in parentheses matters: a payment for
    order 8 cannot satisfy the condition for order 7. The engine must match facts about the same order.'
  bridges: []
- id: rule-engines.s2
  title: Forward chaining follows available facts
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.rule-engines
  markdown: Start with Paid(order7) and InStock(order7). The shipping rule derives Ready(order7). A second
    rule might derive NotifyWarehouse(order7). Forward chaining continues from newly available facts until
    no useful new conclusion is produced or a stopping condition is reached.
  text_mode: Start with Paid(order7) and InStock(order7). The shipping rule derives Ready(order7). A second
    rule might derive NotifyWarehouse(order7). Forward chaining continues from newly available facts until
    no useful new conclusion is produced or a stopping condition is reached.
  bridges: []
- id: rule-engines.s3
  title: Backward chaining starts with the question
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.rule-engines
  markdown: 'To establish Ready(order7), look for a rule with that conclusion, then try to prove Paid(order7)
    and InStock(order7). These become subgoals. The approach can avoid deriving unrelated facts, but repeated
    goals, loops, and alternative rules need bookkeeping and a clear search strategy.


    Try both directions with one missing fact. Starting forward with only Paid(order7) gives no shipping conclusion.
    Starting backward from Ready(order7) creates two questions: “Was it paid?” and “Is it in stock?” The first
    is answered; the second remains open. “Not established” is different from “proved false.” Fetch a stock
    record before claiming readiness.'
  text_mode: 'To establish Ready(order7), look for a rule with that conclusion, then try to prove Paid(order7)
    and InStock(order7). These become subgoals. The approach can avoid deriving unrelated facts, but repeated
    goals, loops, and alternative rules need bookkeeping and a clear search strategy.


    Try both directions with one missing fact. Starting forward with only Paid(order7) gives no shipping conclusion.
    Starting backward from Ready(order7) creates two questions: “Was it paid?” and “Is it in stock?” The first
    is answered; the second remains open. “Not established” is different from “proved false.” Fetch a stock
    record before claiming readiness.'
  bridges: []
- id: rule-engines.s4
  title: Inspect conflicts and missing knowledge
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.rule-engines
  markdown: Rules can conflict, use stale facts, or omit an exception. A trace shows which premises and rules
    produced a conclusion; it does not prove those premises were correct. Decide how priorities, negation,
    updates, and uncertainty behave. A reliable expert system needs maintained knowledge as well as a correct
    engine.
  text_mode: Rules can conflict, use stale facts, or omit an exception. A trace shows which premises and rules
    produced a conclusion; it does not prove those premises were correct. Decide how priorities, negation,
    updates, and uncertainty behave. A reliable expert system needs maintained knowledge as well as a correct
    engine.
  bridges: []
- id: rule-engines.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.rule-engines
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: Forward chaining starts with known facts and follows rules to conclusions. Backward chaining starts
    with a question and looks for the facts needed to answer it.
- id: rule-engines.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.rule-engines
  markdown: Forward chaining starts with known facts and follows rules to conclusions. Backward chaining starts
    with a question and looks for the facts needed to answer it.
  text_mode: Forward chaining starts with known facts and follows rules to conclusions. Backward chaining starts
    with a question and looks for the facts needed to answer it.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - rule-engines.s1
    - rule-engines.s2
    - rule-engines.s3
    - rule-engines.s4
    - rule-engines.check
    gate_refs:
    - gate.core
  scene_aliases:
    rule-engines.recap: rule-engines.check
assessment_families:
- id: rule-engines.base
  objective_ref: objective.rule-engines
  task: base
  response_type: single_choice
  points: 1
  hint: 'Forward chaining follows available facts: trace the inputs, operation, and result before choosing.'
  remediation_scene: rule-engines.s2
  variants:
  - id: rule-engines.base.1
    prompt: Which approach starts from available facts and derives new facts?
    options:
    - id: b
      text: Backward chaining only
    - id: c
      text: Token sampling
    - id: a
      text: Forward chaining
    answer: a
    feedback: Forward chaining propagates consequences from the working facts.
  - id: rule-engines.base.2
    prompt: Which approach starts by asking what could establish a goal?
    options:
    - id: c
      text: Only data normalization
    - id: a
      text: Backward chaining
    - id: b
      text: Random pixel generation
    answer: a
    feedback: Backward chaining turns a requested conclusion into supporting subgoals.
- id: rule-engines.transfer
  objective_ref: objective.rule-engines
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Inspect conflicts and missing knowledge: trace the inputs, operation, and result before choosing.'
  remediation_scene: rule-engines.s4
  variants:
  - id: rule-engines.transfer.1
    prompt: A shipping rule requires payment and stock. Only payment is known. Is readiness established?
    options:
    - id: c
      text: Yes; unknown always means true
    - id: a
      text: No; the stock condition still needs support
    - id: b
      text: Yes; one condition is enough
    answer: a
    feedback: A conjunction requires support for both conditions.
  - id: rule-engines.transfer.2
    prompt: An explanation lists every rule used. Does it certify the real-world facts?
    options:
    - id: a
      text: No; a valid trace can still use stale or wrong inputs
    - id: b
      text: Yes; traces make collection errors impossible
    - id: c
      text: Only if printed in a table
    answer: a
    feedback: Inference transparency and factual validity are separate.
