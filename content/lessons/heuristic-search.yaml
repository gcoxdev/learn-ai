  - id: heuristic-search.s2
    title: Add the cost so far to the estimate
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.heuristic-search
    markdown: |-
      **A\*** (say "A-star") fixes greedy's blind spot. It ranks each waiting route by

      $$f = g + h$$

      where $g$ is the cost already paid (as in uniform-cost search), $h$ is the estimate of what remains, and $f$ is the estimated cost of the whole trip. A\* always expands the smallest $f$ and, like uniform-cost search, stops when a goal route comes *off* the frontier.

      | Step | Take off (g + h = f) | Add (g + h = f) | Frontier afterwards (f) |
      | ---: | --- | --- | --- |
      | 1 | A (0 + 10 = 10) | B 5 + 8 = 13, C 3 + 8 = 11, F 2 + 11 = 13 | C 11, B 13, F 13 |
      | 2 | C (3 + 8 = 11) | E 7 + 4 = 11 | E 11, B 13, F 13 |
      | 3 | E (7 + 4 = 11) | G 12 + 0 = 12 | G 12, B 13, F 13 |
      | 4 | G (12 + 0 = 12) | goal! | |

      A\* returns the 12-mile route after expanding 4 towns. Uniform-cost search needed 7 for the same answer. Fairview and Brook are never expanded, and Dunmore is never even reached: an $f$ of 13 says any trip through them costs at least 13 miles, and a 12-mile trip is already in hand.

      :::story Built for a robot
      A\* was published in 1968 by Peter Hart, Nils Nilsson, and Bertram Raphael at the Stanford Research Institute (SRI), for the Shakey robot you met in the history module. Shakey needed to plan paths across a room, quickly and provably well. Variants of A\* still move characters around video-game maps, and navigation systems build on the same ideas.
      :::

      Run it and compare with uniform-cost search, which is just A\* with $h = 0$:

      ```python run
      import heapq

      roads = {}
      for x, y, miles in [("A", "B", 5), ("A", "C", 3), ("A", "F", 2), ("B", "D", 5),
                       ("B", "G", 12), ("C", "E", 4), ("D", "G", 4), ("E", "G", 5)]:
          roads.setdefault(x, {})[y] = miles
          roads.setdefault(y, {})[x] = miles

      # Straight-line ("as the crow flies") miles from each town to Greyhaven
      crow = {"A": 10, "B": 8, "C": 8, "D": 3, "E": 4, "F": 11, "G": 0}

      def astar(start, goal, h):
          frontier, best, order = [(h[start], 0, [start])], {start: 0}, []
          while frontier:
              f, g, path = heapq.heappop(frontier)       # smallest f = g + h first
              if g > best[path[-1]]:
                  continue
              order.append(path[-1])
              if path[-1] == goal:
                  return path, g, order
              for nxt, miles in roads[path[-1]].items():
                  if g + miles < best.get(nxt, float("inf")):
                      best[nxt] = g + miles
                      heapq.heappush(frontier, (g + miles + h[nxt], g + miles, path + [nxt]))

      zero = {town: 0 for town in crow}                  # h = 0 turns A* into UCS
      for name, h in [("UCS (h = 0)", zero), ("A* (crow)", crow)]:
          path, miles, order = astar("A", "G", h)
          print(f"{name:12} route {'-'.join(path)}, {miles} miles, expanded {len(order)}: {' '.join(order)}")
      ```
    bridges:
      - algebra-notation
  - id: heuristic-search.s3
    title: When does the estimate keep the best route?
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.heuristic-search
    markdown: |-
      :::predict In the program above, change Elmwood's estimate to `"E": 20`, a wild overestimate (the true distance left is 5 miles). What will A\* return?
      A\* now returns A → B → D → G, 14 miles, after expanding 6 towns. Elmwood's route gets $f = 7 + 20 = 27$, so it sits at the back of the frontier while the 14-mile route through Dunmore reaches Greyhaven first. The best route was hidden behind a pessimistic guess.
      :::

      The fix is a rule about the estimate. A heuristic is **admissible** if it never overestimates: $h(n)$ is at most the true cheapest cost from $n$ to the goal. Straight-line distance is admissible because no road can be shorter than a straight line. At Ashford, $h = 10$ while the best real route is 12 miles. With an admissible heuristic, A\* always returns an optimal route.

      A slightly stronger rule, **consistency**, says the estimate can't drop by more than the road you just drove: for every road from $n$ to $n'$, $h(n) \le \text{cost}(n, n') + h(n')$. On the Cliff–Elmwood road, $8 \le 4 + 4$. Every road on the map passes this check. With a consistent heuristic, the first time A\* expands a town it has already found the cheapest way there. With one that is admissible but not consistent, A\* must be ready to **reopen** a town: put it back on the frontier when a cheaper route to it turns up later.

      :::mixup "Any sensible estimate lets A\* find the cheapest route."
      Only estimates that never overestimate do. An estimate that's usually close but occasionally too high, like $h(E) = 20$, can hide the best route. Small average error doesn't help; one overestimate on the right town is enough.
      :::
  - id: heuristic-search.s4
    title: Better estimates, fewer expansions
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.heuristic-search
    markdown: |-
      How good the estimate is decides how much A\* explores:

      | Heuristic | Admissible? | Towns expanded | Route found |
      | --- | --- | ---: | --- |
      | $h = 0$ (uniform-cost) | Yes | 7 | 12 miles |
      | Straight-line distance | Yes | 4 | 12 miles |
      | Elmwood overestimated (20) | No | 6 | 14 miles |

      Among admissible heuristics, bigger is better: if $h_2(n) \ge h_1(n)$ for every town and both are admissible, A\* with $h_2$ never has to expand a town that A\* with $h_1$ would skip. The ideal is the exact remaining cost, which would lead A\* straight to the goal.

      Sometimes speed matters more than perfection. **Weighted A\*** ranks routes by $g + w \cdot h$ with a weight $w > 1$. The inflated estimate drives the search harder toward the goal. If $h$ itself is admissible, the route it returns costs at most $w$ times the best one. A game that must plan a path in a millisecond might happily take a route up to 20% longer ($w = 1.2$).

      A neural network trained to predict the remaining cost can guide A\* well too, but it will sometimes overestimate, so measure how often its routes are worse than the best before relying on it.

      :::papers The A\* evaluation function
      $$f(n) = g(n) + h(n), \qquad h(n) \le h^*(n) \ \text{(admissible)}, \qquad h(n) \le c(n, n') + h(n') \ \text{(consistent)}$$
      Here $g(n)$ is the cost of the route found to $n$, $h^*(n)$ is the true cheapest cost from $n$ to a goal, and $c(n, n')$ is the cost of the road from $n$ to a neighbour $n'$. On our map: $f(\text{Elmwood}) = 7 + 4 = 11$, $h(\text{Ashford}) = 10 \le h^*(\text{Ashford}) = 12$, and $h(\text{Cliff}) = 8 \le 4 + h(\text{Elmwood})$.
      :::
    bridges: []
  - id: heuristic-search.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.heuristic-search
    markdown: Fresh frontiers, grid games, and learned estimates ask you to compute f = g + h, predict which route A* expands, and judge when its cheapest-route promise holds.
    takeaway: |-
      A* expands the route with the smallest cost so far plus estimated cost to go. If the estimate never overestimates, A* returns the cheapest route, and a better estimate means fewer expansions.
  - id: heuristic-search.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.heuristic-search
    markdown: |-
      A-star ranks routes by cost so far plus estimated cost remaining. To claim a cheapest-route guarantee, check the estimate’s properties and how the search handles improved paths.
