schema_version: 0.2-draft
lesson:
  id: heuristic-search
  version: 0.3.0-draft
  title: Use an estimate without confusing it with a guarantee
  state: draft
  summary: Add the cost paid so far to a remaining-distance estimate, then learn when that shortcut preserves
    the cheapest route.
  slot: M05.3
  category: learning
  sources:
  - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
    url: https://aima.cs.berkeley.edu/
objectives:
- id: objective.heuristic-search
  version: 1-draft
  statement: Heuristics estimate remaining cost; A* combines that estimate with cost already paid, and its
    guarantees depend on admissibility, consistency, and correct graph handling.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - heuristic-search.base
  - heuristic-search.transfer
  prerequisites:
  - anyOf:
    - objective.uninformed-search
scenes:
- id: heuristic-search.s1
  title: An estimate guides attention
  type: explanation
  depth: intuition
  objective_refs:
  - objective.heuristic-search
  markdown: A heuristic h estimates the remaining cost from a state to a goal. Straight-line distance can be
    a lower bound on road distance under suitable units and geometry. Greedy best-first search prioritizes
    h alone, which can be fast but ignores how much has already been spent reaching a state.
  text_mode: A heuristic h estimates the remaining cost from a state to a goal. Straight-line distance can
    be a lower bound on road distance under suitable units and geometry. Greedy best-first search prioritizes
    h alone, which can be fast but ignores how much has already been spent reaching a state.
  bridges: []
- id: heuristic-search.s2
  title: Add the cost so far to the estimate
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.heuristic-search
  markdown: '**A-star**, usually written A*, ranks a candidate using f = g + h. Here g is the cost already
    paid, h estimates what remains, and f is their total.


    Candidate A has g = 4 and h = 3, so f = 7. Candidate B has g = 1 and h = 8, so f = 9. A-star explores A
    first even though B has the cheaper first part. A third candidate with g = 2 and h = 4 would come first
    with f = 6.


    If h is zero everywhere, the ranking depends only on g and becomes uniform-cost search.'
  text_mode: '**A-star**, usually written A*, ranks a candidate using f = g + h. Here g is the cost already
    paid, h estimates what remains, and f is their total.


    Candidate A has g = 4 and h = 3, so f = 7. Candidate B has g = 1 and h = 8, so f = 9. A-star explores A
    first even though B has the cheaper first part. A third candidate with g = 2 and h = 4 would come first
    with f = 6.


    If h is zero everywhere, the ranking depends only on g and becomes uniform-cost search.'
  bridges:
  - algebra-notation
- id: heuristic-search.s3
  title: When does the estimate preserve the best route?
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.heuristic-search
  markdown: 'An **admissible** heuristic never overestimates the true remaining cost. A **consistent** heuristic
    also limits how estimates change along an edge: the estimate cannot fall by more than the cost of that
    step. If a step costs 2 and its neighbor estimates 3 remaining, the current estimate must be at most 5.


    Consistency lets standard graph-search A-star finish exploring a state without reopening it. An admissible
    but inconsistent heuristic may require **reopening**: reconsidering a state when a cheaper path reaches
    it. Lowest-cost guarantees depend on this bookkeeping and the method’s cost and termination assumptions,
    not just on having a plausible estimate.'
  text_mode: 'An **admissible** heuristic never overestimates the true remaining cost. A **consistent** heuristic
    also limits how estimates change along an edge: the estimate cannot fall by more than the cost of that
    step. If a step costs 2 and its neighbor estimates 3 remaining, the current estimate must be at most 5.


    Consistency lets standard graph-search A-star finish exploring a state without reopening it. An admissible
    but inconsistent heuristic may require **reopening**: reconsidering a state when a cheaper path reaches
    it. Lowest-cost guarantees depend on this bookkeeping and the method’s cost and termination assumptions,
    not just on having a plausible estimate.'
  bridges: []
- id: heuristic-search.s4
  title: Treat learned heuristics as measured components
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.heuristic-search
  markdown: A neural heuristic may improve search order, but training accuracy does not establish admissibility.
    Weighted or approximate variants can deliberately trade optimality for speed. Report returned cost, search
    effort, memory, and any guarantee being claimed. A useful estimate and a proven lower bound are different
    objects.
  text_mode: A neural heuristic may improve search order, but training accuracy does not establish admissibility.
    Weighted or approximate variants can deliberately trade optimality for speed. Report returned cost, search
    effort, memory, and any guarantee being claimed. A useful estimate and a proven lower bound are different
    objects.
  bridges: []
- id: heuristic-search.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.heuristic-search
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: A-star ranks routes by cost so far plus estimated cost remaining. To claim a cheapest-route guarantee,
    check the estimate’s properties and how the search handles improved paths.
- id: heuristic-search.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.heuristic-search
  markdown: A-star ranks routes by cost so far plus estimated cost remaining. To claim a cheapest-route guarantee,
    check the estimate’s properties and how the search handles improved paths.
