lesson:
  id: heuristic-search
  version: 0.4.0-draft
  title: Use an estimate without confusing it with a guarantee
  state: draft
  summary: Uniform-cost search wasted time driving the wrong way. Give it a sense of direction, and meet A*, the 1968 algorithm behind route planners and game characters.
  slot: M05.3
  category: learning
  sources:
    - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
      url: https://aima.cs.berkeley.edu/
    - title: 'A Formal Basis for the Heuristic Determination of Minimum Cost Paths (Hart, Nilsson & Raphael, 1968)'
      url: https://doi.org/10.1109/TSSC.1968.300136
objectives:
  - id: objective.heuristic-search
    version: 2-draft
    statement: Heuristics estimate remaining cost; A* combines that estimate with cost already paid, and its guarantees depend on admissibility, consistency, and correct graph handling.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - heuristic-search.base.v2
      - heuristic-search.transfer.v2
      - heuristic-search.calc.v2
    prerequisites:
      - anyOf:
          - objective.uninformed-search
scenes:
  - id: heuristic-search.s1
    title: A sense of direction
    type: explanation
    depth: intuition
    objective_refs:
      - objective.heuristic-search
    markdown: |-
      In the last lesson, uniform-cost search expanded Fairview second, just because the road there was short. Anyone glancing at the map would skip it: Fairview lies *away* from Greyhaven.

      A **heuristic** is a quick estimate of the cost still to go, written $h(n)$ for a town $n$. A natural one for road trips is the straight-line distance, "as the crow flies," to Greyhaven. The map below shows it under each town's name.

      The simplest way to use it is **greedy best-first search**: always expand the town that *looks* closest to the goal, the one with the smallest $h$.

      | Step | Take off (h) | Frontier afterwards (h) |
      | ---: | --- | --- |
      | 1 | A (10) | B 8, C 8, F 11 |
      | 2 | B (8), first alphabetically | G 0, D 3, C 8, F 11 |
      | 3 | G (0) | goal! |

      Only 3 expansions, but greedy returns A → B → G: 17 miles. It rushed down the long 12-mile road because Greyhaven *looked* close from Brook. Greedy ignores what it has already paid to get somewhere.
