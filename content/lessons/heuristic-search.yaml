schema_version: 0.2-draft
lesson:
  id: heuristic-search
  version: 0.1.0-draft
  title: Use an estimate without confusing it with a guarantee
  state: draft
  summary: Heuristics estimate remaining cost; A* combines that estimate with cost already paid, and its guarantees
    depend on admissibility, consistency, and correct graph handling.
  slot: M05.3
  category: learning
  minutes: 12
  sources:
  - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
    url: https://aima.cs.berkeley.edu/
objectives:
- id: objective.heuristic-search
  version: 1-draft
  statement: Heuristics estimate remaining cost; A* combines that estimate with cost already paid, and its guarantees
    depend on admissibility, consistency, and correct graph handling.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - heuristic-search.base
  - heuristic-search.transfer
  prerequisites:
  - anyOf:
    - objective.uninformed-search
scenes:
- id: heuristic-search.s1
  title: An estimate guides attention
  type: explanation
  depth: intuition
  objective_refs:
  - objective.heuristic-search
  markdown: A heuristic h estimates the remaining cost from a state to a goal. Straight-line distance can be a lower
    bound on road distance under suitable units and geometry. Greedy best-first search prioritizes h alone, which
    can be fast but ignores how much has already been spent reaching a state.
  text_mode: A heuristic h estimates the remaining cost from a state to a goal. Straight-line distance can be a
    lower bound on road distance under suitable units and geometry. Greedy best-first search prioritizes h alone,
    which can be fast but ignores how much has already been spent reaching a state.
  bridges: []
- id: heuristic-search.s2
  title: Add past cost to estimated future cost
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.heuristic-search
  markdown: A* prioritizes f = g + h, where g is accumulated path cost. If candidate A has g = 4 and h = 3, its
    f is 7. Candidate B with g = 1 and h = 8 has f = 9. A* prefers A under this priority even though B has the cheaper
    prefix.
  text_mode: A* prioritizes f = g + h, where g is accumulated path cost. If candidate A has g = 4 and h = 3, its
    f is 7. Candidate B with g = 1 and h = 8 has f = 9. A* prefers A under this priority even though B has the cheaper
    prefix.
  bridges:
  - algebra-notation
- id: heuristic-search.s3
  title: State the conditions for a guarantee
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.heuristic-search
  markdown: An admissible heuristic never overestimates the true remaining cost. A consistent heuristic also respects
    each transition cost in its neighboring estimates. Standard graph-search A* can close states safely with consistency;
    with an admissible but inconsistent heuristic, improved paths may require reopening states. Appropriate cost
    and termination assumptions still matter.
  text_mode: An admissible heuristic never overestimates the true remaining cost. A consistent heuristic also respects
    each transition cost in its neighboring estimates. Standard graph-search A* can close states safely with consistency;
    with an admissible but inconsistent heuristic, improved paths may require reopening states. Appropriate cost
    and termination assumptions still matter.
  bridges: []
- id: heuristic-search.s4
  title: Treat learned heuristics as measured components
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.heuristic-search
  markdown: A neural heuristic may improve search order, but training accuracy does not establish admissibility.
    Weighted or approximate variants can deliberately trade optimality for speed. Report returned cost, search effort,
    memory, and any guarantee being claimed. A useful estimate and a proven lower bound are different objects.
  text_mode: A neural heuristic may improve search order, but training accuracy does not establish admissibility.
    Weighted or approximate variants can deliberately trade optimality for speed. Report returned cost, search effort,
    memory, and any guarantee being claimed. A useful estimate and a proven lower bound are different objects.
  bridges: []
- id: heuristic-search.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.heuristic-search
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Heuristics estimate remaining cost; A* combines that estimate with cost already paid, and its guarantees
    depend on admissibility, consistency, and correct graph handling.
- id: heuristic-search.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.heuristic-search
  markdown: Heuristics estimate remaining cost; A* combines that estimate with cost already paid, and its guarantees
    depend on admissibility, consistency, and correct graph handling.
  text_mode: Heuristics estimate remaining cost; A* combines that estimate with cost already paid, and its guarantees
    depend on admissibility, consistency, and correct graph handling.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - heuristic-search.s1
    - heuristic-search.s2
