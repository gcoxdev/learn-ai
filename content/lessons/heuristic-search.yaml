assessment_families:
  - id: heuristic-search.base
    objective_ref: objective.heuristic-search
    task: base
    response_type: single_choice
    points: 1
    hint: 'Add past cost to estimated future cost: trace the inputs, operation, and result before choosing.'
    remediation_scene: heuristic-search.s2
    variants:
      - id: heuristic-search.base.1
        prompt: A* has g = 5 and h = 2. What priority value is used?
        options:
          - id: c
            text: '10'
          - id: a
            text: '7'
          - id: b
            text: '3'
        answer: a
        feedback: A* adds cost already paid and estimated remaining cost.
        retired: true
      - id: heuristic-search.base.2
        prompt: What does admissibility require?
        options:
          - id: a
            text: The heuristic never overestimates true remaining cost
          - id: b
            text: The heuristic is always exactly zero
          - id: c
            text: The heuristic is a trained neural network
        answer: a
        feedback: A lower-bound condition supports optimal-search reasoning.
        retired: true
  - id: heuristic-search.transfer
    objective_ref: objective.heuristic-search
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Treat learned heuristics as measured components: trace the inputs, operation, and result before choosing.'
    remediation_scene: heuristic-search.s4
    variants:
      - id: heuristic-search.transfer.1
        prompt: A learned estimate sometimes exceeds actual remaining cost. Is admissibility established?
        options:
          - id: a
            text: 'No'
          - id: b
            text: Yes, if average error is small
          - id: c
            text: Yes, if it is fast
        answer: a
        feedback: Admissibility is a per-state bound, not an average-accuracy claim.
        retired: true
      - id: heuristic-search.transfer.2
        prompt: An admissible heuristic is inconsistent. What may correct graph-search A* need?
        options:
          - id: b
            text: Ignoring all improved paths
          - id: c
            text: Returning the first generated goal without checks
          - id: a
            text: Reopening a state when a better path is found
        answer: a
        feedback: Inconsistency can invalidate a simple never-reopen closed-set policy.
        retired: true
  - id: heuristic-search.base.v2
    objective_ref: objective.heuristic-search
    task: base
    response_type: single_choice
    points: 1
    hint: Compute f = g + h for each waiting route. A* expands the smallest f, uniform-cost the smallest g, and greedy best-first the smallest h.
    remediation_scene: heuristic-search.s2
    variants:
      - id: heuristic-search.base.v2.1
        prompt: 'An A* frontier holds P (g = 6, h = 3), Q (g = 2, h = 8), and R (g = 4, h = 4). Which route does A* expand next?'
        options:
          - id: b
            text: Q, which has the lowest cost so far
          - id: c
            text: P, which has the smallest estimate left
          - id: a
            text: R, which has the lowest f of 8
        answer: a
        feedback: The f values are P 9, Q 10, and R 8, so R goes next. Picking Q uses g alone (uniform-cost), and picking P uses h alone (greedy best-first).
      - id: heuristic-search.base.v2.2
        prompt: 'A frontier holds J (g = 1, h = 9), K (g = 7, h = 2), and L (g = 3, h = 5). Which route does greedy best-first search expand next?'
        options:
          - id: a
            text: K, which has the smallest estimate left
          - id: c
            text: L, which has the lowest f of 8
          - id: b
            text: J, which has the lowest cost so far
        answer: a
        feedback: Greedy looks only at h, and K's is smallest (2). A* would pick L (f = 8), and uniform-cost would pick J (g = 1).
      - id: heuristic-search.base.v2.3
        prompt: A heuristic estimates 6 miles from Mill to the goal, but the cheapest real route from Mill is 5 miles. What does that tell you?
        options:
          - id: c
            text: It is admissible, since 6 is close to 5
          - id: a
            text: It is not admissible, since it overestimates at Mill
          - id: b
            text: It is admissible but not consistent at Mill
        answer: a
        feedback: Admissible means never above the true remaining cost, and 6 > 5 breaks that at Mill. Closeness doesn't matter, and an admissible heuristic can't overestimate anywhere.
      - id: heuristic-search.base.v2.4
        prompt: You set h = 0 for every town and run A*. Which search are you now running?
        options:
          - id: a
            text: Uniform-cost search, ordered by g
          - id: b
            text: Greedy best-first search, ordered by h
          - id: c
            text: Breadth-first search, ordered by depth
        answer: a
        feedback: With h = 0, f = g, which is exactly uniform-cost search. Greedy would need f = h, and breadth-first ignores costs altogether.
      - id: heuristic-search.base.v2.5
        prompt: A road from X to Y costs 2, and h(Y) = 3. Which value of h(X) would make the heuristic inconsistent on this road?
        options:
          - id: b
            text: h(X) = 5
          - id: c
            text: h(X) = 4
          - id: a
            text: h(X) = 6
        answer: a
        feedback: Consistency needs h(X) ≤ 2 + h(Y) = 5, so 6 breaks it. A value of exactly 5 is still allowed, because the rule uses ≤.
  - id: heuristic-search.transfer.v2
    objective_ref: objective.heuristic-search
    task: transfer
    response_type: single_choice
    points: 1
    hint: A* keeps its cheapest-route promise only if the estimate never overestimates. Ask whether it can overestimate, and what you trade when you inflate it for speed.
    remediation_scene: heuristic-search.s3
    variants:
      - id: heuristic-search.transfer.v2.1
        prompt: A robot on a grid moves up, down, left, or right, and each move costs 1. Which heuristic keeps A* optimal?
        options:
          - id: c
            text: Twice the rows plus columns to the goal, to push harder
          - id: a
            text: The rows plus columns between the robot and the goal
          - id: b
            text: The squared straight-line distance to the goal
        answer: a
        feedback: Every move changes the row or column by one, so rows plus columns (the Manhattan distance) can't overestimate. Doubling it, or squaring the distance, overestimates on longer trips.
      - id: heuristic-search.transfer.v2.2
        prompt: A neural network estimates the remaining cost for A*. Testing shows it overestimates on 3% of states. What can you expect?
        options:
          - id: b
            text: Optimal routes, since 97% of its estimates are safe
          - id: a
            text: Mostly good routes, with some costlier than the best
          - id: c
            text: Greedy behaviour, since learned estimates replace g
        answer: a
        feedback: One overestimate on the right state can hide the best route, as h(E) = 20 did on the town map, so optimality is lost. A* still adds g, so it doesn't turn into greedy search.
      - id: heuristic-search.transfer.v2.3
        prompt: A game must plan paths within one millisecond and can accept paths up to 20% longer than the best. What fits?
        options:
          - id: a
            text: Weighted A* with w = 1.2
          - id: b
            text: Plain A* with h = 0 for speed
          - id: c
            text: Uniform-cost search to be safe
        answer: a
        feedback: Weighted A* inflates h to expand fewer nodes, and w = 1.2 keeps the route within 20% of the best. Setting h = 0 is uniform-cost search, the slowest option here.
      - id: heuristic-search.transfer.v2.4
        prompt: 'Two admissible heuristics guide a warehouse robot. Everywhere, h₂ is at least as large as h₁. Which one should make A* expand fewer shelves?'
        options:
          - id: c
            text: h₁, since smaller estimates are safer
          - id: a
            text: h₂, since it's closer to the true costs
          - id: b
            text: Neither, since both return the best route
        answer: a
        feedback: Both return the best route, but the larger admissible estimate is closer to the true cost, so it prunes more. Smaller isn't safer once both already never overestimate.
      - id: heuristic-search.transfer.v2.5
        prompt: 'A trip planner minimizes ticket price in dollars but uses "straight-line distance in miles" as its estimate. Why is that risky?'
        options:
          - id: b
            text: Straight lines are longer than real routes
          - id: c
            text: Estimates can't be used when cost is money
          - id: a
            text: The miles number can exceed the cheapest fare left
        answer: a
        feedback: An estimate must be in the same units as the cost and never exceed it. 800 miles could be a 60-dollar fare, which overestimates badly. Straight lines are never longer than real routes, and money costs can have good estimates.
  - id: heuristic-search.calc.v2
    objective_ref: objective.heuristic-search
    task: base
    response_type: numeric_fields_with_reason
    points: 1
    hint: Add up the roads driven so far to get g, then add the town's estimate h to get f = g + h.
    remediation_scene: heuristic-search.s2
    numeric_fields:
      - id: g
        label: Cost so far, g
      - id: f
        label: A* priority, f
    variants:
      - id: heuristic-search.calc.v2.1
        prompt: A* reaches Oak by the route Start → Pine (3 miles) → Oak (4 miles). The estimate at Oak is h = 5. Record g and f for this route.
        feedback: g = 3 + 4 = 7, and f = 7 + 5 = 12. Using h alone (5) is greedy's number, not A*'s.
        answers:
          g: 7
          f: 12
        reason_answer: sum
        reason_options:
          - id: sum
            text: f adds the cost already paid to the estimate of what remains.
          - id: est
            text: f is the estimate of what remains; the cost paid doesn't count.
          - id: last
            text: f adds only the last road's cost to the estimate.
      - id: heuristic-search.calc.v2.2
        prompt: A* reaches Ridge by the route Start → Quay (6 miles) → Ridge (2 miles). The estimate at Ridge is h = 9. Record g and f for this route.
        feedback: g = 6 + 2 = 8, and f = 8 + 9 = 17. Adding only the last road (2 + 9 = 11) forgets the first 6 miles.
        answers:
          g: 8
          f: 17
        reason_answer: sum
        reason_options:
          - id: last
            text: f adds only the last road's cost to the estimate.
          - id: sum
            text: f adds the cost already paid to the estimate of what remains.
          - id: est
            text: f is the estimate of what remains; the cost paid doesn't count.
      - id: heuristic-search.calc.v2.3
        prompt: A* reaches Zell by the route Start → Xan (2 miles) → Yarrow (5 miles) → Zell (1 mile). The estimate at Zell is h = 4. Record g and f for this route.
        feedback: g = 2 + 5 + 1 = 8, and f = 8 + 4 = 12.
        answers:
          g: 8
          f: 12
        reason_answer: sum
        reason_options:
          - id: est
            text: f is the estimate of what remains; the cost paid doesn't count.
          - id: last
            text: f adds only the last road's cost to the estimate.
          - id: sum
            text: f adds the cost already paid to the estimate of what remains.
      - id: heuristic-search.calc.v2.4
        prompt: A* reaches the goal town Kell by a single 10-mile road from the start. At the goal, h = 0. Record g and f for this route.
        feedback: g = 10, and at the goal h = 0, so f = 10 + 0 = 10. At a goal, f is the route's true cost.
        answers:
          g: 10
          f: 10
        reason_answer: sum
        reason_options:
          - id: sum
            text: f adds the cost already paid to the estimate of what remains.
          - id: last
            text: f adds only the last road's cost to the estimate.
          - id: est
            text: f is the estimate of what remains; the cost paid doesn't count.
      - id: heuristic-search.calc.v2.5
        prompt: A* reaches Nest by the route Start → Moss (1 mile) → Nest (1 mile). The estimate at Nest is h = 11. Record g and f for this route.
        feedback: g = 1 + 1 = 2, and f = 2 + 11 = 13. A cheap start doesn't help much when the town looks far from the goal.
        answers:
          g: 2
          f: 13
        reason_answer: sum
        reason_options:
          - id: last
            text: f adds only the last road's cost to the estimate.
          - id: est
            text: f is the estimate of what remains; the cost paid doesn't count.
          - id: sum
            text: f adds the cost already paid to the estimate of what remains.
