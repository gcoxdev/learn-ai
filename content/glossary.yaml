- id: little-s-law
  term: Little's law
  definition: The average number in a system equals the arrival rate times the average time spent inside (L = λW).
  lesson: operational-capacity-and-reliability
  aliases: []
- id: error-budget
  term: Error budget
  definition: The share of failures a service-level objective allows, such as 43.2 minutes per 30 days at 99.9%.
  lesson: operational-capacity-and-reliability
  aliases:
  - error budgets
- id: burn-rate
  term: Burn rate
  definition: 'How fast the error budget is being spent: the current bad rate divided by the allowed rate.'
  lesson: operational-capacity-and-reliability
  aliases:
  - burn rates
- id: service-level-objective
  term: Service level objective
  definition: A target for a measured service quantity, such as 99.9% of requests good.
  lesson: operational-capacity-and-reliability
  aliases:
  - service level objectives
- id: load-shedding
  term: Load shedding
  definition: Refusing some work early so the rest is served on time.
  lesson: operational-capacity-and-reliability
  aliases: []
- id: open-weight-model
  term: Open-weight model
  definition: A release with downloadable final weights but not the training data or full training pipeline.
  lesson: model-report-and-artifact-inventory
  aliases:
  - open-weight models
- id: fully-open-model
  term: Fully open model
  definition: A release that also publishes its training data, training code, and intermediate checkpoints.
  lesson: model-report-and-artifact-inventory
  aliases:
  - fully open models
- id: thinking-budget
  term: Thinking budget
  definition: A token cap on a model's reasoning, after which it must answer.
  lesson: qwen-three-case-study
  aliases:
  - thinking budgets
- id: multi-token-prediction
  term: Multi-token prediction
  definition: An extra training target for tokens beyond the next one.
  lesson: deepseek-v3-case-study
  aliases: []
- id: midtraining
  term: Midtraining
  definition: Next-token training on a small, skill-focused data mix between pretraining and post-training.
  lesson: olmo-three-case-study
  aliases: []
- id: sliding-window-attention
  term: Sliding-window attention
  definition: Attention where each token sees only a fixed number of recent tokens, capping that layer's cache.
  lesson: olmo-three-case-study
  aliases: []
- id: system-card
  term: System card
  definition: A document reporting a model's risk evaluations and safeguards, usually not its architecture.
  lesson: proprietary-model-evidence-boundaries
  aliases:
  - system cards
- id: preregistration
  term: Preregistration
  definition: Writing down the question, comparison, metric, and decision rule before running an experiment.
  lesson: ablation-and-reproduction-project
  aliases:
  - preregistrations
- id: keyframe
  term: Keyframe
  definition: A frame the model generates directly, with the frames between keyframes filled in afterwards.
  lesson: video-generation-project
  aliases:
  - keyframes
- id: obstacle-inflation
  term: Obstacle inflation
  definition: Enlarging obstacles by the robot's radius plus a margin before planning a path.
  lesson: robotics-system-project
  aliases:
  - obstacle inflations
- id: oja-s-rule
  term: Oja's rule
  definition: A Hebbian update with a forgetting term whose weights converge to the first principal component.
  lesson: hebbian-and-local-learning
  aliases: []
- id: three-factor-rule
  term: Three-factor rule
  definition: A Hebbian update multiplied by a broadcast signal such as reward.
  lesson: hebbian-and-local-learning
  aliases:
  - three-factor rules
- id: restricted-boltzmann-machine
  term: Restricted Boltzmann machine
  definition: A Boltzmann machine with connections only between its visible and hidden layers.
  lesson: associative-memory-and-boltzmann-models
  aliases: []
- id: contrastive-divergence
  term: Contrastive divergence
  definition: Training an energy model by running its sampler only a few steps from the data.
  lesson: associative-memory-and-boltzmann-models
  aliases:
  - contrastive divergences
- id: sparse-coding
  term: Sparse coding
  definition: Rebuilding an input from a few atoms of a large dictionary.
  lesson: sparse-coding-and-self-organizing-maps
  aliases: []
- id: rheobase
  term: Rheobase
  definition: The smallest steady input that makes a neuron fire.
  lesson: integrate-and-fire-neurons
  aliases:
  - rheobases
- id: stdp
  term: STDP
  definition: Spike-timing-dependent plasticity; strengthens connections where the input spikes just before the
    output, and weakens the reverse.
  lesson: spike-timing-and-surrogate-gradients
  aliases: []
- id: surrogate-gradient
  term: Surrogate gradient
  definition: A smooth stand-in for a spike's derivative, used when training spiking networks.
  lesson: spike-timing-and-surrogate-gradients
  aliases:
  - surrogate gradients
- id: echo-state-property
  term: Echo state property
  definition: A reservoir's state depends on its input history, not on its starting state.
  lesson: reservoir-computing
  aliases: []
- id: spectral-radius
  term: Spectral radius
  definition: The largest absolute eigenvalue of a matrix.
  lesson: reservoir-computing
  aliases: []
- id: adjoint-method
  term: Adjoint method
  definition: Computing gradients through an ODE solver by solving a second ODE backward in time.
  lesson: neural-ordinary-differential-equations
  aliases:
  - adjoint methods
- id: squared-error
  term: Squared error
  definition: The difference between a prediction and the target, multiplied by itself, so misses in either direction
    cost the same.
  lesson: arithmetic
  aliases:
  - squared errors
- id: permutation
  term: Permutation
  definition: An ordered selection; choosing 2 of 5 in order gives 20 permutations.
  lesson: discrete-math
  aliases:
  - permutations
- id: transpose
  term: Transpose
  definition: Swapping a matrix's rows and columns.
  lesson: matrices-tensors
  aliases:
  - transposes
- id: eigenvector
  term: Eigenvector
  definition: A direction a matrix only stretches, without turning it.
  lesson: linear-algebra-depth
  aliases:
  - eigenvectors
- id: singular-value-decomposition
  term: Singular value decomposition
  definition: Writing any matrix as a rotation, a stretch, and another rotation.
  lesson: linear-algebra-depth
  aliases:
  - singular value decompositions
- id: conditional-probability
  term: Conditional probability
  definition: The chance of an outcome counted only among the cases where a given condition holds, written P(A |
    B).
  lesson: probability
  aliases: []
- id: random-variable
  term: Random variable
  definition: A number whose value depends on a chance outcome.
  lesson: random-variables
  aliases:
  - random variables
- id: expected-value
  term: Expected value
  definition: The probability-weighted average of a random variable's values; its long-run average.
  lesson: random-variables
  aliases:
  - expected values
- id: standard-deviation
  term: Standard deviation
  definition: The square root of the variance; spread in the variable's own units.
  lesson: random-variables
  aliases:
  - standard deviations
- id: standard-error
  term: Standard error
  definition: How much an estimate typically wobbles from one sample to the next.
  lesson: statistics-evidence
  aliases:
  - standard errors
- id: confidence-interval
  term: Confidence interval
  definition: A range built by a method that covers the true value a stated share of the time across repeated samples.
  lesson: statistics-evidence
  aliases:
  - confidence intervals
- id: p-value
  term: P-value
  definition: The probability, if nothing real were going on, of a result at least as extreme as the one observed.
  lesson: statistics-evidence
  aliases:
  - p-values
- id: partial-derivative
  term: Partial derivative
  definition: The rate of change of an output with respect to one input while the other inputs are held still.
  lesson: multivariable-calculus
  aliases:
  - partial derivatives
- id: probability-density
  term: Probability density
  definition: Probability per unit of width; areas under it are probabilities, and its height can exceed 1.
  lesson: integrals-density
  aliases: []
- id: hessian
  term: Hessian
  definition: The table of all second derivatives of a loss with respect to its weights.
  lesson: optimization-math
  aliases: []
- id: cross-entropy
  term: Cross-entropy
  definition: The average cost, in bits or nats, of scoring real outcomes with a model's probabilities.
  lesson: information-theory
  aliases: []
- id: kl-divergence
  term: KL divergence
  definition: 'Cross-entropy minus entropy: the extra cost of predicting with one distribution when the truth is
    another. It changes if you swap the two.'
  lesson: information-theory
  aliases: []
- id: floating-point
  term: Floating point
  definition: Storing a number as a sign, a significand, and an exponent in a fixed number of bits.
  lesson: numerical-computing
  aliases:
  - floating points
- id: nan
  term: NaN
  definition: '"Not a number": the result of an invalid operation such as infinity minus infinity or 0 ÷ 0.'
  lesson: numerical-computing
  aliases: []
- id: log-sum-exp
  term: Log-sum-exp
  definition: Computing log Σ e^z safely by subtracting the largest score first and adding it back afterward.
  lesson: numerical-computing
  aliases:
  - log-sum-exps
- id: euler-s-method
  term: Euler's method
  definition: Stepping a changing quantity forward with new state = state + step size × rate.
  lesson: dynamics-and-noise
  aliases: []
- id: brownian-motion
  term: Brownian motion
  definition: Random wandering whose steps over time h have mean 0 and variance h.
  lesson: dynamics-and-noise
  aliases: []
- id: nash-equilibrium
  term: Nash equilibrium
  definition: A set of choices from which no player gains by switching alone.
  lesson: decisions-and-games
  aliases: []
- id: big-o-notation
  term: Big-O notation
  definition: A description of how the number of steps grows for large inputs, ignoring constants.
  lesson: algorithm-cost
  aliases: []
- id: euclidean-distance
  term: Euclidean distance
  definition: Straight-line distance between two points.
  lesson: geometry-and-symmetry
  aliases: []
- id: system-one-model
  term: System One model
  definition: A model that takes a situation plus questions with fixed answer sets and returns a probability for
    every allowed answer, instead of writing a free-text reply.
  lesson: system-one-decisions
  aliases: []
- id: closed-answer-set
  term: Closed answer set
  definition: The list of allowed answers the model must choose from, fixed by the time it scores the input.
  lesson: system-one-decisions
  aliases:
  - closed answer sets
- id: noul
  term: Noul
  definition: A yes/no decision question that returns the probability the answer is yes.
  lesson: typed-decision-questions
  aliases:
  - nouls
- id: atomic-question
  term: Atomic question
  definition: A decision question about one idea, combined with others in code.
  lesson: typed-decision-questions
  aliases:
  - atomic questions
- id: top-probability
  term: Top probability
  definition: The probability a decision model gives its highest-scoring answer. It is not the same number as a
    provider's reported confidence.
  lesson: typed-decision-questions
  aliases:
  - top probabilities
- id: escape-option
  term: Escape option
  definition: A candidate such as "Other topic" or "Not enough information" that lets a decision model avoid forcing
    a message onto a real route.
  lesson: typed-decision-questions
  aliases:
  - escape options
- id: option-budget
  term: Option budget
  definition: The fixed number of tokens an encoder-style decision model gives to all of a question's options.
  lesson: one-pass-decision-architectures
  aliases:
  - option budgets
- id: action-caching
  term: Action caching
  definition: Embedding candidate answers once and reusing them for every new input.
  lesson: one-pass-decision-architectures
  aliases: []
- id: proper-scoring-rule
  term: Proper scoring rule
  definition: A way of scoring probability forecasts whose expected score is best when the forecast matches the
    forecaster's actual belief; strictly proper if only that belief scores best. It encourages, but does not guarantee,
    honest probabilities.
  lesson: calibrated-decision-training
  aliases:
  - proper scoring rules
- id: brier-score
  term: Brier score
  definition: The squared gap between forecast probabilities and what happened; lower is better.
  lesson: calibrated-decision-training
  aliases: []
- id: ranked-probability-score
  term: Ranked probability score
  definition: A loss for ordered answers that penalizes far misses more than near misses; lower is better.
  lesson: calibrated-decision-training
  aliases:
  - ranked probability scores
- id: rlcd
  term: RLCD
  definition: Reinforcement learning for calibrated decisions; training a decision model with a reward from a proper
    scoring rule, so that reporting its actual probabilities scores best on average.
  lesson: calibrated-decision-training
  aliases: []
- id: confidence-gated-routing
  term: Confidence-gated routing
  definition: Acting on a model's answer only when a named number, such as its top probability, clears a threshold,
    and sending the rest to a person.
  lesson: building-with-decision-models
  aliases: []
- id: automation-rate
  term: Automation rate
  definition: The share of inputs a system handles without a person.
  lesson: building-with-decision-models
  aliases:
  - automation rates
- id: selective-risk
  term: Selective risk
  definition: The error rate among the inputs a system chooses to act on.
  lesson: building-with-decision-models
  aliases:
  - selective risks
- id: model-cascade
  term: Model cascade
  definition: Running a cheap model first and a costly one only on the uncertain cases.
  lesson: building-with-decision-models
  aliases:
  - model cascades
- id: vendor-built-eval
  term: Vendor-built eval
  definition: A benchmark designed by the team that sells the system.
  lesson: comparing-decision-models
  aliases:
  - vendor-built evals
- id: bake-off
  term: Bake-off
  definition: Running every candidate system on the same labelled examples from your own traffic.
  lesson: comparing-decision-models
  aliases:
  - bake-offs
- id: reliability-table
  term: Reliability table
  definition: Confidence bands with their counts, mean confidence, and actual accuracy.
  lesson: comparing-decision-models
  aliases:
  - reliability tables
