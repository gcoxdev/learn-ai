      - lesson: vision-failures
        why: "Shortcuts, adversarial pixels, and occlusion: stress-test what an image model really learned."
      - lesson: autoencoders-and-vaes
        why: "The compress-and-reconstruct idea behind latent diffusion's image encoder."
      - lesson: multimodal-training-lifecycle
        why: "How text-to-image and text-to-audio systems are trained stage by stage."
      - lesson: privacy-and-memorization
        why: "Can a model leak its training data? Memorization, extraction, and differential privacy."
      - lesson: robustness-and-slice-testing
        why: "Find the groups a model quietly fails, hidden inside a good average score. The same slice tests work for photos and text."
      - lesson: fairness-definitions-and-tradeoffs
        why: "Measure whether an image system works equally well for different groups, and why fairness definitions conflict."
      - lesson: classical-prediction-project
        why: "Build a baseline-vs-learned comparison end to end on a tiny dataset before tackling images."
      - lesson: small-network-gradient-project
        why: "Trace one full forward and backward pass by hand before training image models."
