  - id: audio
    title: Speech & audio
    subtitle: Shared foundations, then a system you can explain
    question: How does a system recognize speech and generate sound?
    description: Start with sound stored as numbers. Follow a system that turns
      speech into text and text back into speech, then check the words, sound, and
      timing.
    outcome: By the end, you can distinguish recognition from synthesis and evaluate
      words, audio duration, and end-to-end behavior.
    reference: Connect waveform representations, recognition, synthesis, alignment,
      and sequence evaluation in a modular audio workflow. Music and general
      sound generation remain extensions beyond the speech reference.
