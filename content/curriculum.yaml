- id: M34
  title: Scientific AI and emerging research
  lessons:
  - Graph neural networks, message passing, and relational inductive bias.
  - Geometric/equivariant learning for molecules, shapes, and physical systems.
  - Scientific machine learning, physics-informed models, and neural operators.
  - Biology, protein/molecular modeling, materials, and scientific evaluation.
  - Neuromorphic and biologically inspired scientific applications, connected to the dedicated mechanisms in M37.
  - Automated discovery, experiment selection, and AI-assisted research.
  - 'Emerging ideas such as quantum ML and new memory/reasoning architectures: evidence and limitations.'
  - 'A maintained research frontier: replications, competing hypotheses, and open problems.'
- id: M35
  title: Model and system case-study atlas
  lessons:
  - Reading a model card/report and inventorying released artifacts.
  - 'A documented dense decoder system: Llama 3 as an initial historical anchor.'
  - 'Dense/MoE family comparisons and configurable reasoning: Qwen3 as an anchor.'
  - 'Sparse architecture and distributed engineering: DeepSeek-V3 as an anchor.'
  - 'Reasoning-oriented post-training and distillation: DeepSeek-R1 as an anchor.'
  - 'An inspectable training lifecycle: Olmo 3 as an anchor.'
  - Vision/language, generative image/audio, and state-space model comparisons.
  - Publicly disclosed proprietary systems, unknown internals, and a regularly updated comparison exercise.
- id: M36
  title: Synthesis, projects, and research literacy
  lessons:
  - Explain AI’s history and families using a connected concept map.
  - Build and evaluate a classical prediction system, with a no-code option.
  - Implement or manually trace a small neural network and its gradients.
  - Train a tiny language model and compare checkpoints.
  - Compare a documented dense model with an MoE from training through serving.
  - Build or analyze a retrieval/tool workflow and evaluate its failure cases.
  - Reproduce a small research result, run an ablation, and write a limitations section.
  - 'Final defense: choose an architecture and learning recipe for a new problem, justify tradeoffs, and answer
    challenges.'
  - Specify a conditional image generator and evaluate adherence, diversity, and failures.
  - "Project: trace and evaluate a tiny video generator"
  - "Project: trace a speech and audio system"
  - "Project: trace a robot sensing and control loop"
- id: M37
  title: Alternative neural models and biological learning
  lessons:
  - Hebbian learning, local update rules, stability, and historical context.
  - Associative memory, Hopfield networks, Boltzmann models, and energy-based learning/inference distinctions.
  - Sparse coding, dictionary learning, self-organizing maps, and competitive/neighborhood updates.
  - Leaky integrate-and-fire neurons, spike/reset dynamics, and rate/temporal coding.
  - Spike-timing-dependent plasticity, surrogate-gradient methods, and other spiking-network learning choices.
  - Reservoir computing, echo-state/liquid-state approaches, fixed dynamics, and trained readouts.
  - Neural ODEs, vector fields, numerical solvers, continuous depth, and learning through a solution.
  - Compare assumptions, learning mechanisms, hardware, energy/latency measurements, and suitable tasks.
