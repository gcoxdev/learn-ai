  - id: retrieval
    title: Search & grounded answers
    subtitle: Shared foundations, then a system you can explain
    question: How does a system retrieve evidence and use it in an answer?
    description: Start with a question and a collection of documents. Learn how a
      system finds useful passages, builds an answer from them, and checks whether
      those passages actually support its claims.
    outcome: By the end, you can explain how evidence enters an answer and test
      relevance, citations, access, freshness, and failure cases.
    reference: Build from lexical search to vector retrieval and a
      retrieval-augmented answer with citations, freshness, and access
      boundaries. A graph neural network is an optional retrieval design, not a
      required component.
