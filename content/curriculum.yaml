  - "Project: build a two-layer network in NumPy, check its gradients, and plot its training curve."
  - "Project: from bigram counts to a tiny neural language model, with held-out perplexity and sampling."
  - "Project: compare dense and mixture-of-experts designs on memory, compute, and a toy router."
  - "Project: search 20 help pages, check citations, abstain when unsure, and call a booking tool safely."
  - "Project: reproduce a result and run a seeded 2×2 ablation with confidence intervals."
  - "Project: choose and defend an architecture under memory, latency, and training budgets."
  - "Project: build a toy diffusion generator and evaluate condition, variety, quality, and copying."
  - "Project: plan keyframes under a budget and check every frame of a tiny video for consistency."
  - "Project: detect sounds from a spectrogram and measure word error rate by condition."
  - "Project: plan, control, and evaluate a simulated kitchen robot with safety checks."
