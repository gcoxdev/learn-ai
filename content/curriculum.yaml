      programs to a small workflow with clear limits.
    outcome: By the end, you can trace a controlled tool workflow and evaluate its
      state changes, authority, and recovery.
    reference: Trace a language-assisted tool workflow with explicit state,
      permissions, planning, recovery, and task evaluation. Reinforcement
      learning and multi-agent coordination are extensions.
