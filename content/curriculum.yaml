  - id: vision
    title: Computer vision
    subtitle: Shared foundations, then a system you can explain
    question: How does a system recognize and locate objects in an image?
    description: Follow how stored pixels become clues about what is in a picture
      and where it is. Learn how models use those clues and how to check when
      their answers fail.
    outcome: By the end, you can explain a recognition/detection pipeline and
      investigate errors under changed visual conditions.
    reference: Trace an image-recognition and detection pipeline, with convolutional
      features, labeled examples, localization, and tests for changed viewing
      conditions.
