    subtitle: Shared foundations, then a system you can explain
    question: How can AI run under device limits, and when do alternative
      architectures help?
    description: Explore AI that runs on a nearby device and compare different
      ways of computing with neural models. Follow the tradeoffs between memory,
      speed, energy, and useful answers; special hardware is one possible branch.
    outcome: By the end, you can compare device budgets and alternative computation
      using stated workload and measurement assumptions.
    reference: Compare resource limits and conventional edge inference with
      neuromorphic and other computational approaches. Edge describes deployment
      location; it does not imply spiking hardware.
