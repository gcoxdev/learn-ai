  - id: video
    title: Video generation
    subtitle: Shared foundations, then a system you can explain
    question: How can a generator keep objects and events consistent across frames?
    description: Build on pictures to follow a sequence of frames. Explore how a
      generator learns movement, follows a description, and keeps objects
      consistent as the scene changes.
    outcome: By the end, you can connect a video generator’s lifecycle, compute its
      representation size and timing, and evaluate temporal failures.
    reference: Follow a conditional latent video diffusion design, with spatial
      representation, temporal information, clip-level training splits, and
      separate appearance and motion evaluation.
