  - id: images
    title: Image generation
    subtitle: Shared foundations, then a system you can explain
    question: How can a model create an image from noise and a description?
    description: Start with how computers store pictures. Learn how a model learns
      from examples and gradually turns random visual noise into a picture guided
      by a description.
    outcome: By the end, you can explain conditional image generation and review a
      small image-system project.
    reference: Follow a conditional latent diffusion design through representations,
      training, denoising, and evaluation. GANs, autoregressive models, and flow
      models offer comparisons, not universal prerequisites.
