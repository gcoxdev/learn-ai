  - id: robotics
    title: Robotics
    subtitle: Shared foundations, then a system you can explain
    question: How does a robot connect sensing, planning, and control?
    description: Start with a robot trying to reach a target. Follow how it
      measures its surroundings, plans a move, acts, and uses new measurements to
      adjust. Learning actions from examples and autonomous driving are further
      topics.
    outcome: By the end, you can trace a bounded control loop, distinguish observed
      and true state, and evaluate a simplified robot system.
    reference: Trace an observed-state feedback controller and its sensing,
      localization, planning, and evaluation boundaries. Learned policies and
      vision-language-action designs extend this reference; autonomous driving
      needs additional domain-specific coverage.
