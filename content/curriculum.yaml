catalog:
- id: M00
  title: 'First steps: everyday ideas, AI words, and learning habits'
  lessons:
  - What is AI? Start with an everyday task
  - 'Inputs and outputs: what goes in and what comes out'
  - 'Data and examples: what a computer can learn from'
  - What is a model? A small rule inside a bigger app
  - 'Weights: the adjustable numbers in a model'
  - 'Training and inference: changing a rule or using it'
  - Follow one small AI system from start to finish
  - Different ways to solve the same problem
  - How to tell whether an AI answer is useful
  - How to use this school without getting lost
  - Practice, progress, and knowing what you understand
- id: M01
  title: History, research traditions, and turning points
  lessons:
  - Foundations in logic, computation, neuroscience, statistics, and cybernetics.
  - Early artificial neurons, learning rules, Turing’s questions, and the Dartmouth proposal.
  - Symbolic programs, game playing, early language systems, and ambitious predictions.
  - Perceptrons, limitations, funding cycles, and AI winters.
  - Expert systems, knowledge engineering, and the statistical learning revival.
  - Neural-network revival, backpropagation, convolution, large datasets, and accelerators.
  - Deep reinforcement learning, attention, transformers, generative models, and foundation models.
  - 'A research timeline: what changed, what persisted, and what remains unresolved.'
- id: M02
  title: Computation, representations, and algorithms
  lessons:
  - Bits, numbers, text, images, audio, and structured records.
  - Programs, algorithms, functions, and pseudocode.
  - Features, representations, embeddings, and inductive bias.
  - Scalars, vectors, matrices, tensors, and shape tracing.
  - Search spaces, combinatorial growth, runtime, and memory.
  - Randomness, pseudorandom seeds, determinism, and reproducibility.
  - CPUs, GPUs, accelerators, memory, and parallel computation.
  - Simulations, datasets, software systems, and the limits of a toy example.
- id: M03
  title: Data and problem formulation
  lessons:
  - Examples, features, targets, labels, and prediction tasks.
  - Supervised, unsupervised, self-supervised, and reinforcement-learning data.
  - Collection, consent, provenance, annotation, and documentation.
  - Missing values, outliers, duplicates, class imbalance, and preprocessing.
  - Train/validation/test splits, temporal splits, and leakage.
  - Sampling bias, representativeness, distribution shift, and dataset limits.
  - Augmentation, synthetic data, quality filters, and feedback loops.
  - Baselines, success criteria, error costs, and when learning is unnecessary.
- id: M04
  title: Logic, knowledge representation, and symbolic reasoning
  lessons:
  - Propositional logic, truth tables, and inference.
  - Predicates, quantifiers, first-order logic, and unification.
  - Rule engines, forward chaining, backward chaining, and expert systems.
  - Proof search, resolution, satisfiability, and automated theorem proving.
  - Ontologies, knowledge graphs, semantic relationships, and queries.
  - Defaults, exceptions, nonmonotonic reasoning, and commonsense difficulties.
  - Program synthesis, inductive logic programming, and learned rules.
  - Strengths and limits of explicit knowledge; connections to neural systems.
- id: M05
  title: Search, constraints, and planning
  lessons:
  - States, actions, goals, transitions, and search trees.
  - Breadth-first, depth-first, uniform-cost, and iterative-deepening search.
  - Heuristics, greedy search, A*, and admissibility.
  - Constraint satisfaction, propagation, backtracking, SAT, and SMT.
  - Minimax, alpha-beta pruning, and Monte Carlo tree search.
  - Classical planning, action representations, hierarchical and temporal planning.
  - Partial observability, replanning, and uncertain environments.
  - Local search, scheduling, optimization, and practical tradeoffs.
- id: M06
  title: Probability, uncertainty, and Bayesian AI
  lessons:
  - Uncertainty, probability, likelihood, and prior knowledge.
  - Bayes’ rule through a small classification example.
  - Naive Bayes and conditional-independence assumptions.
  - Bayesian networks, factor graphs, and probabilistic inference.
  - Hidden Markov models, state estimation, and Kalman-filter intuition.
  - Sampling, Monte Carlo, Markov chains, and approximate inference.
  - Gaussian processes, variational inference, Bayesian learning, and probabilistic programming.
  - Decision theory, calibration, and different sources of uncertainty.
- id: M07
  title: Supervised machine learning
  lessons:
  - Linear regression, predictions, residuals, and a simple fitted model.
  - Logistic regression and classification probabilities.
  - Nearest neighbors and distance-based prediction.
  - Decision trees, splits, and model complexity.
  - Random forests, bagging, boosting, and gradient-boosted trees.
  - Support vector machines, margins, and kernels.
  - Regularization, feature engineering, cross-validation, and tuning.
  - Metrics, threshold selection, error analysis, and model choice.
- id: M08
  title: Unsupervised learning, representation learning, and recommendation
  lessons:
  - 'Clustering: k-means, hierarchical methods, and density-based methods.'
  - Mixture models, latent variables, and expectation-maximization.
  - PCA, matrix factorization, and dimensionality reduction.
  - Nonlinear embeddings, self-organizing maps, and the pitfalls of interpreting 2D plots.
  - Anomaly detection, density estimation, and unusual examples.
  - Self-supervised objectives, contrastive learning, and learned representations.
  - Collaborative filtering, recommenders, ranking, and cold starts.
  - Recommendation feedback loops, exposure bias, and evaluation.
- id: M09
  title: Generalization, learning theory, and experiments
  lessons:
  - Empirical error, expected error, and generalization.
  - Underfitting, overfitting, bias, variance, and regularization.
  - Capacity, sample complexity, PAC learning, and VC-dimension intuition.
  - Distribution shift, out-of-distribution behavior, and robustness.
  - Hyperparameter selection, nested evaluation, and repeated testing.
  - Ablations, controls, confidence intervals, and statistical uncertainty.
  - Scaling behavior, double descent, memorization, and open questions.
  - Reproducibility, negative results, benchmark limitations, and reporting.
- id: M10
  title: 'Optimization: how learning changes a model'
  lessons:
  - Loss functions and the intuition of a loss landscape.
  - Derivatives, gradients, and finite-difference checks.
  - Gradient descent, stochastic gradients, and mini-batches.
  - Learning rate, schedules, momentum, and Adam-family optimizers.
  - Constraints, penalties, weight decay, and clipping.
  - Convex and nonconvex problems, saddle points, and curvature.
  - Initialization, normalization, numerical precision, and instability.
  - Debugging divergence, plateaus, noisy metrics, and broken objectives.
- id: M11
  title: Neural networks and backpropagation
  lessons:
  - 'A neuron: weights, bias, activation, output, and the perceptron as an early example.'
  - Nonlinearity, multilayer networks, expressivity, and representations.
  - Forward passes, batches, tensor shapes, and loss.
  - Backpropagation as the chain rule on a computation graph.
  - Automatic differentiation, gradient accumulation, and gradient checking.
  - Residual connections, normalization, dropout, and initialization.
  - Training loops, optimizers, checkpoints, and debugging.
  - What a network learns, transfer learning, memorization, and limitations.
- id: M12
  title: Computer vision and visual understanding
  lessons:
  - Pixels, color, geometry, invariance, and classical visual features.
  - Convolution, filters, channels, stride, pooling, and receptive fields.
  - Convolutional networks, residual networks, and image classification.
  - Object detection, segmentation, U-Net structure, tracking, and task-specific metrics.
  - Vision transformers, image patches, and positional information.
  - Self-supervised visual representations and transfer learning.
  - Depth, motion, 3D representations, and reconstruction.
  - Occlusion, shortcuts, adversarial examples, and distribution shift.
- id: M13
  title: Sequences, time series, speech, and audio
  lessons:
  - Time series, forecasting, seasonality, and temporal leakage.
  - Recurrent networks, hidden states, and backpropagation through time.
  - LSTMs, GRUs, gating, and long-range dependencies.
  - Sequence-to-sequence learning, alignment, and teacher forcing.
  - Waveforms, frequency, spectrograms, and audio representations.
  - Speech recognition, acoustic/language modeling, and recognition metrics.
  - Speech synthesis, vocoders, audio generation, and streaming.
  - Sequence evaluation, multilingual speech, latency, and robustness.
- id: M14
  title: Language, tokenization, and early NLP
  lessons:
  - Language structure, ambiguity, syntax, semantics, and pragmatics.
  - Rules, parsing, tagging, named entities, and information extraction.
  - Bag of words, TF-IDF, n-grams, and statistical language models.
  - Character, byte, word, and subword tokenization.
  - Word embeddings, distributional meaning, and embedding limitations.
  - BPE and unigram tokenizers, vocabularies, and special tokens.
  - Multilingual text, code, rare strings, and tokenization tradeoffs.
  - Next-token prediction, context, perplexity, and generation basics.
- id: M15
  title: Attention and transformer internals
  lessons:
  - Why attention was introduced; sequence bottlenecks and contextual representations.
  - Queries, keys, values, dot products, and attention weights.
  - Scaled dot-product attention, softmax, and masking.
  - Multiple heads, output projections, and tensor shapes.
  - Positions, sinusoidal encodings, learned encodings, and rotary embeddings.
  - Feed-forward layers, gated activations, residual streams, and normalization.
  - Encoder-only, decoder-only, and encoder-decoder models; training objectives.
  - End-to-end token tracing, context cost, and attention’s limitations.
- id: M16
  title: Language-model data and pretraining
  lessons:
  - Base models, initialization, architecture configuration, and tokenizer design.
  - Data sourcing, licensing records, filtering, deduplication, and contamination checks.
  - Data mixtures, sampling weights, multilingual/code data, and synthetic data.
  - Sequence packing, masking, document boundaries, and training batches.
  - Next-token, masked-token, denoising, and multi-token objectives.
  - Forward pass, loss, backward pass, optimizer update, and scheduling.
  - Scaling laws, compute/data tradeoffs, checkpoints, and training evaluation.
  - Continued pretraining, domain adaptation, long-context stages, and base-model release.
- id: M17
  title: Training infrastructure and hardware
  lessons:
  - FLOPs, memory bandwidth, interconnects, accelerator utilization, and bottlenecks.
  - Parameters, gradients, optimizer states, activations, and memory accounting.
  - Data parallelism and gradient synchronization.
  - Tensor, pipeline, sequence/context, and expert parallelism.
  - Sharding, optimizer-state partitioning, and activation checkpointing.
  - Mixed precision, loss scaling, low-precision formats, and numerical stability.
  - Efficient attention kernels, communication overlap, and throughput measurements.
  - Checkpoint recovery, reproducibility, energy/resource estimates, and operational failures.
- id: M18
  title: Mixture-of-experts systems
  lessons:
  - Conditional computation, dense layers, and mixtures of experts.
  - Expert feed-forward networks, router scores, gating, and top-k selection.
  - Dispatching a token, executing experts, and combining weighted outputs.
  - Total versus active parameters; compute, memory, and communication.
  - Capacity, load balancing, overflow/dropping policies, and routing collapse.
  - Shared/routed experts, specialization, granularity, and routing alternatives.
  - Training gradients, balancing strategies, expert parallelism, and all-to-all traffic.
  - Serving MoEs, batching, placement, dense comparisons, and evidence-based case studies.
- id: M19
  title: Efficient architectures and alternatives to standard attention
  lessons:
  - Dense, sliding-window, sparse, and global attention patterns.
  - Multi-query, grouped-query, and latent attention; cache tradeoffs.
  - Linear attention, recurrent formulations, and approximation choices.
  - Structured and selective state-space models.
  - Mamba-style sequence modeling and hardware-aware execution.
  - Hybrid attention/state-space/recurrent architectures.
  - Long-context training, positional extension, compression, and external memory.
  - Compare quality, latency, memory, workload, and reported evidence.
- id: M20
  title: Post-training, adaptation, and alignment methods
  lessons:
  - Base, instruction, chat, domain-adapted, and reasoning-oriented models.
  - 'Supervised fine-tuning: demonstrations, formatting, loss masks, and data mixtures.'
  - Full fine-tuning, adapters, LoRA, QLoRA, and parameter-efficient adaptation.
  - Preference data, annotator disagreement, reward models, and feedback quality.
  - RLHF/RLAIF, policy optimization, KL control, and PPO intuition.
  - Direct preference optimization and related offline preference objectives.
  - Distillation, rejection sampling, safety tuning, and capability retention.
  - Evaluate before/after behavior, regressions, reward hacking, and stage alternatives.
- id: M21
  title: Reasoning, verifiable rewards, and inference-time computation
  lessons:
  - Reasoning tasks, intermediate steps, and limits of generated explanations.
  - Reasoning demonstrations, cold starts, and curriculum construction.
  - Reinforcement learning with verifiable rewards and verifier design.
  - Group-relative policy optimization and comparisons with other policy objectives.
  - Outcome versus process feedback, reward exploitation, and evaluation leakage.
  - Sampling multiple candidates, self-consistency, search, and reranking.
  - Tool-assisted reasoning, executable checks, budgets, and stopping decisions.
  - Distilling reasoning behavior; measuring quality against latency and cost.
- id: M22
  title: Generative models beyond next-token language modeling
  lessons:
  - Discriminative versus generative objectives; latent variables and sampling.
  - Autoregressive generation across text, images, audio, and structured data.
  - Autoencoders, variational autoencoders, and latent spaces.
  - GANs, adversarial objectives, training instability, and mode collapse.
  - Normalizing flows, energy-based models, and likelihood tradeoffs; associative-memory connections in M37.2.
  - Diffusion, denoising, noise schedules, and score-based modeling.
  - Latent diffusion, U-Nets, diffusion transformers, conditioning, and guidance.
  - Flow matching, direct sampling versus MCMC, generation solvers, evaluation, and speed/quality tradeoffs.
- id: M23
  title: Multimodal models, video, and world models
  lessons:
  - Modalities, alignment, fusion, and shared representations.
  - Contrastive image/text learning and CLIP-style embeddings.
  - Vision encoders, projectors, cross-attention, and multimodal language models.
  - Image/audio/video tokenization and modality-specific processing.
  - Multimodal pretraining, instruction data, and post-training.
  - Video understanding/generation, temporal consistency, and 3D structure.
  - World models, JEPA/predictive representations, and action-conditioned dynamics.
  - Grounding, spatial reasoning, modality failures, and multimodal evaluation.
- id: M24
  title: Reinforcement learning and sequential decisions
  lessons:
  - Agents, environments, observations, actions, rewards, and returns.
  - Bandits, exploration/exploitation, and contextual decisions.
  - Markov decision processes, Bellman equations, and dynamic programming.
  - Monte Carlo methods, temporal-difference learning, and Q-learning.
  - Deep Q-networks, replay, target networks, and stability.
  - Policy gradients, actor-critic methods, and PPO.
  - Model-based RL, partial observability, planning, and learned dynamics.
  - Offline RL, imitation learning, reward design, and safe exploration.
- id: M25
  title: Agents, tools, and multi-agent systems
  lessons:
  - Classical agents, workflows, autonomous loops, and language-model agents.
  - Tool interfaces, structured outputs, state, observations, and errors.
  - Planning, task decomposition, execution, monitoring, and recovery.
  - Working memory, persistent memory, retrieval, and context construction.
  - Cooperation, competition, communication, and coordination.
  - Game theory, multi-agent RL, self-play, and nonstationarity.
  - Permissions, untrusted inputs, oversight, and bounded environments.
  - Agent evaluation, reproducible tasks, failure traces, and system complexity.
- id: M26
  title: Information retrieval, search, and RAG
  lessons:
  - Information retrieval, inverted indexes, lexical matching, and ranking.
  - Dense embeddings, vector search, approximate neighbors, and similarity limits.
  - Documents, chunking, metadata, indexing, and ingestion updates.
  - Query rewriting, hybrid search, reranking, and retrieval evaluation.
  - 'Retrieval-augmented generation: assembling and using evidence.'
  - Citations, evidence fidelity, abstention, and answer evaluation.
  - Retrieval versus long context, fine-tuning, and model memory.
  - Stale data, access control, poisoning, prompt injection, and failure diagnosis.
- id: M27
  title: Inference, serving, and deployment optimization
  lessons:
  - Loading weights, tokenizer/chat templates, inputs, and request preparation.
  - Prefill, decoding, key/value caches, and autoregressive execution.
  - Logits, temperature, top-k/top-p, beam search, constraints, and stopping.
  - Batching, scheduling, streaming, prefix caching, and paged cache management.
  - Quantization, calibration, pruning, distillation, and hardware tradeoffs.
  - Speculative decoding, draft/verification, and correctness conditions.
  - Model/expert parallel serving, offloading, edge devices, and distributed bottlenecks.
  - Latency, throughput, context memory, cost, observability, and deployment choices.
- id: M28
  title: Evaluation, reliability, and interpretability
  lessons:
  - Task metrics, baselines, calibration, and uncertainty estimates.
  - Benchmark construction, contamination, leakage, and statistical comparison.
  - Human evaluation, model judges, rubric quality, and judge bias.
  - Robustness, adversarial testing, subgroup analysis, and distribution shift.
  - Hallucination, abstention, factuality, and grounded generation.
  - Feature attribution, counterfactual explanations, and explanation limits.
  - Probing, activation interventions, circuits, sparse autoencoders, and mechanistic hypotheses.
  - Causal evidence, reproducible evaluation suites, and interpreting negative results.
- id: M29
  title: Safety, security, ethics, and society
  lessons:
  - Objectives, stakeholders, human agency, and choosing whether to deploy.
  - Bias, fairness definitions, measurement choices, and conflicting goals.
  - Privacy, memorization, data extraction, and privacy-preserving learning.
  - Adversarial inputs, data poisoning, backdoors, and supply-chain risks.
  - Prompt injection, tool abuse, sensitive data, and application boundaries.
  - Alignment, oversight, robustness, misuse, and limits of safety evaluations.
  - Labor, access, environmental effects, authorship, provenance, and governance.
  - AGI debates, consciousness claims, uncertainty, and responsible communication.
- id: M30
  title: Robotics, control, and embodied AI
  lessons:
  - Sensors, actuators, geometry, coordinate frames, and embodiment.
  - Feedback control, PID intuition, optimal control, and model-predictive control.
  - Localization, mapping, SLAM, and sensor fusion.
  - Motion planning, kinematics, manipulation, and navigation.
  - Imitation learning, behavior cloning, and learning from demonstrations.
  - Robotic RL, simulation, domain randomization, and sim-to-real transfer.
  - Vision-language-action systems and action-generation policies.
  - Physical uncertainty, safety constraints, evaluation, and deployment limits.
- id: M31
  title: Causality, transfer, and learning over time
  lessons:
  - Correlation, interventions, confounding, and causal graphs.
  - Counterfactuals, identification assumptions, and causal discovery limits.
  - Transfer learning, domain adaptation, and domain generalization.
  - Few-shot learning, meta-learning, and in-context learning distinctions.
  - Continual/online learning, catastrophic forgetting, and replay.
  - Active learning, curriculum learning, and data-selection strategies.
  - Semi-supervised learning, weak supervision, and learning with limited labels.
  - Federated and decentralized learning, communication, and privacy tradeoffs.
- id: M32
  title: Evolutionary, fuzzy, and hybrid AI
  lessons:
  - Evolutionary search, genetic algorithms, mutation, and selection.
  - Genetic programming, neuroevolution, and architecture search.
  - Swarm methods, particle swarm optimization, and ant-colony intuition.
  - Fuzzy sets, graded membership, rules, and fuzzy control.
  - Case-based reasoning, expert knowledge, and hybrid decision systems.
  - Neuro-symbolic methods, differentiable reasoning, and constraints in learning.
  - Bayesian optimization, AutoML, and automated model selection.
  - Compare assumptions, search cost, interpretability, and suitable applications.
- id: M33
  title: Building and operating AI applications
  lessons:
  - Problem framing, baselines, build/buy choices, and product evaluation.
  - Data pipelines, feature systems, model registries, and reproducible artifacts.
  - Offline/online evaluation, experiments, releases, and rollback.
  - Drift, feedback, monitoring, incident diagnosis, and retraining.
  - Model APIs, local inference, caching, queues, and system boundaries.
  - Human-in-the-loop workflows, review, escalation, and user experience.
  - Operational cost, energy/resource tradeoffs, reliability, and capacity.
  - Applied cases in recommendation, forecasting, search, accessibility, and decision support.
- id: M34
  title: Scientific AI and emerging research
  lessons:
  - Graph neural networks, message passing, and relational inductive bias.
  - Geometric/equivariant learning for molecules, shapes, and physical systems.
  - Scientific machine learning, physics-informed models, and neural operators.
  - Biology, protein/molecular modeling, materials, and scientific evaluation.
  - Neuromorphic and biologically inspired scientific applications, connected to the dedicated mechanisms in M37.
  - Automated discovery, experiment selection, and AI-assisted research.
  - 'Emerging ideas such as quantum ML and new memory/reasoning architectures: evidence and limitations.'
  - 'A maintained research frontier: replications, competing hypotheses, and open problems.'
- id: M35
  title: Model and system case-study atlas
  lessons:
  - Reading a model card/report and inventorying released artifacts.
  - 'A documented dense decoder system: Llama 3 as an initial historical anchor.'
  - 'Dense/MoE family comparisons and configurable reasoning: Qwen3 as an anchor.'
  - 'Sparse architecture and distributed engineering: DeepSeek-V3 as an anchor.'
  - 'Reasoning-oriented post-training and distillation: DeepSeek-R1 as an anchor.'
  - 'An inspectable training lifecycle: Olmo 3 as an anchor.'
  - Vision/language, generative image/audio, and state-space model comparisons.
  - Publicly disclosed proprietary systems, unknown internals, and a regularly updated comparison exercise.
- id: M36
  title: Synthesis, projects, and research literacy
  lessons:
  - Explain AI’s history and families using a connected concept map.
  - Build and evaluate a classical prediction system, with a no-code option.
  - Implement or manually trace a small neural network and its gradients.
  - Train a tiny language model and compare checkpoints.
  - Compare a documented dense model with an MoE from training through serving.
  - Build or analyze a retrieval/tool workflow and evaluate its failure cases.
  - Reproduce a small research result, run an ablation, and write a limitations section.
  - 'Final defense: choose an architecture and learning recipe for a new problem, justify tradeoffs, and answer
    challenges.'
  - Specify a conditional image generator and evaluate adherence, diversity, and failures.
- id: M37
  title: Alternative neural models and biological learning
  lessons:
  - Hebbian learning, local update rules, stability, and historical context.
  - Associative memory, Hopfield networks, Boltzmann models, and energy-based learning/inference distinctions.
  - Sparse coding, dictionary learning, self-organizing maps, and competitive/neighborhood updates.
  - Leaky integrate-and-fire neurons, spike/reset dynamics, and rate/temporal coding.
  - Spike-timing-dependent plasticity, surrogate-gradient methods, and other spiking-network learning choices.
  - Reservoir computing, echo-state/liquid-state approaches, fixed dynamics, and trained readouts.
  - Neural ODEs, vector fields, numerical solvers, continuous depth, and learning through a solution.
  - Compare assumptions, learning mechanisms, hardware, energy/latency measurements, and suitable tasks.
