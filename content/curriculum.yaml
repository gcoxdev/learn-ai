- id: images
  title: Image generation
  subtitle: From visual representations to generative model lifecycles
  question: How can a model create an image from noise?
  description: 'Start without prior AI vocabulary: learn inputs, data, models, and weights through small examples.
    Learn shared foundations, visual representations, generative objectives, latent diffusion, flow matching, multimodal
    conditioning, and evaluation. Math side lessons are available as each mechanism needs them.'
  outcome: Compare autoregressive, VAE, GAN, diffusion, and flow-based generation; trace latent image generation
    and multimodal training; evaluate quality, grounding, and failure cases. Finish by specifying and testing a
    conditional image generator, with manual examples and a self or peer-review rubric.
