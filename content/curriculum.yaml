  - id: forecasting
    title: Time-series forecasting
    subtitle: Shared foundations, then a system you can explain
    question: How can a system predict future values without using future information?
    description: Use earlier observations to predict what may happen next. Compare
      a simple starting guess with a learned model, keep future information out of
      training, and check errors at different time horizons.
    outcome: By the end, you can specify temporal inputs, a baseline, a forecast
      horizon, and evaluation that excludes future information.
    reference: Use a temporal baseline, chronological evaluation, uncertainty, and
      state estimation to frame a forecasting system. Neural sequence
      architectures are alternatives to explore after the basic forecasting
      contract.
