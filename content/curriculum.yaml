recipes:
- id: language
  title: Language models
  subtitle: From shared foundations to modern model lifecycles
  question: How does a language model make a response?
  description: 'Start without prior AI vocabulary: learn inputs, data, models, and weights through small examples.
    Build from shared foundations through tokenization, attention, pretraining, sparse experts, reasoning post-training,
    retrieval, and efficient inference. Compare documented Llama, Qwen, DeepSeek, and Olmo releases.'
  outcome: Trace a modern language-model lifecycle, compare dense and MoE architectures, explain post-training and
    reasoning methods, and connect model artifacts to grounded applications and serving costs. Finish with worked
    language, retrieval, and architecture-comparison projects. Project artifacts use self or peer review; quiz checks
    record the supporting concepts.
