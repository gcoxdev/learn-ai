version: prototype-1
recipes:
  - id: language
    title: Language models
    subtitle: Shared foundations, then a system you can explain
    question: How does a language model turn a prompt into a response?
    description: Begin with everyday examples of inputs, data, and learning. Then
      follow how a language model learns from text, writes a response, and becomes
      part of a chatbot.
    outcome: By the end, you can explain how a language model is trained and used,
      build a tiny next-token model by hand, and explain how a team decides when
      to release, monitor, or roll back a model.
    reference: Trace a dense transformer language model from tokenization and
      pretraining through instruction tuning and inference. Chatbots add
      interfaces and application behavior around that model.
    roots:
      - objective.ai-systems
      - objective.inputs-and-outputs
      - objective.data-and-examples
      - objective.models-and-products
      - objective.weights-and-predictions
      - objective.training-and-inference
      - objective.inside-a-system
      - objective.ai-traditions
      - objective.thinking-critically
      - objective.history
      - objective.digital-representations
      - objective.algorithms-and-programs
      - objective.features-and-bias
      - objective.ways-to-learn
      - objective.count-based-language
      - objective.tokenizer-training
      - objective.transformer-trace
      - objective.pretraining-objectives
      - objective.training-data-mixtures
      - objective.neural-training-loop
      - objective.supervised-fine-tuning
      - objective.decoding-and-sampling
      - objective.cached-inference
      - objective.benchmark-design-and-comparison
      - objective.human-and-model-judges
      - objective.stakeholders-and-deployment-decisions
      - objective.evaluation-releases-and-rollback
      - objective.monitoring-drift-and-retraining
      - objective.human-review-and-user-experience
      - objective.tiny-language-model-project
    destination: tiny-language-model-project
    color: sage
    group: Create
    icon: chat
    extensions:
      - lesson: learning-routes
        why: "Optional orientation: how paths, side lessons, and practice fit together, plus study habits that make learning stick."
      - lesson: mastery-and-placement
        why: "Optional orientation: use practice, mistakes, and spaced review to find out what you really understand."
      - lesson: misuse-and-synthetic-media
        why: "A familiar face or voice is no longer proof of who is speaking. Learn how misuse works and the checks that still hold."
      - lesson: prompting-in-practice
        why: "Get better answers from any chat assistant today: say what you want, show an example, give it the facts, and check what comes back."
      - lesson: routers-and-top-k
        why: Route tokens through selected expert networks and compare active work with total model capacity.
      - lesson: state-space-sequences
        why: "The recurrence behind S4 and Mamba, which also runs as a convolution and is a classic forecasting tool."
      - lesson: llama-three-case-study
        why: "Follow the published Llama 3 training recipe step by step, and learn to tell what the report says from what people guess."
      - lesson: qwen-three-case-study
        why: Compare documented dense and expert designs in the Qwen3 family.
      - lesson: deepseek-r1-case-study
        why: Connect documented reasoning post-training stages to the mechanisms you have learned.
      - lesson: olmo-three-case-study
        why: Inspect a documented open training recipe and its reproducibility artifacts.
      - lesson: architecture-defense-project
        why: Defend an architecture choice against explicit task and resource constraints.
      - lesson: dense-and-moe-comparison-project
        why: Compare dense and expert computation with a supplied quantitative fixture.
      - lesson: tensor-shape-tracing
        why: "Follow array shapes through a batch: the everyday skill of reading and debugging model code."
      - lesson: search-growth
        why: "Why trying every possibility explodes, and why language models can't search every sentence."
      - lesson: processors-and-parallelism
        why: "Why GPUs made modern AI possible, and why more chips don't always mean more speed."
      - lesson: toy-model-limits
        why: "Practice a scientist's habits (counterexamples, exhaustive tests, held-out data) on a model small enough to check completely."
      - lesson: architecture-tradeoff-study
        why: "Transformers vs state-space and hybrid models: compare them honestly on quality, memory, and speed."
      - lesson: posttraining-evaluation
        why: "Did fine-tuning help, or quietly break something? Measure before and after."
      - lesson: retrieval-boundaries-and-failures
        why: "Stale documents, leaked permissions, and poisoned sources: how retrieval-backed chatbots fail."
      - lesson: agent-evaluation
        why: "Language models increasingly act. Learn how to check that an agent actually finished the job."
      - lesson: privacy-and-memorization
        why: "Can a model leak its training data? Memorization, extraction, and differential privacy."
      - lesson: factuality-and-abstention
        why: "Why chatbots 'hallucinate', and how to measure and reduce confident wrong answers."
      - lesson: application-security-boundaries
        why: "Prompt injection and tool misuse: keep a chatbot's text from gaining powers it shouldn't have."
      - lesson: retrieval-and-tool-workflow-project
        why: "Build a small grounded answerer with a guarded tool action, on paper or in code."
      - lesson: early-ai-proposals
        why: "Meet Turing's test, the Dartmouth workshop, and a checkers program that outplayed its author."
      - lesson: symbolic-era
        why: "See how Shakey planned with symbols and why ELIZA fooled people."
      - lesson: ai-winters
        why: "Find out what the XOR proof really showed and why AI funding froze twice."
      - lesson: expert-to-statistical
        why: "Compare hand-written expert rules with filters that learn from data."
      - lesson: deep-learning-revival
        why: "See the four ingredients behind AlexNet's 2012 landslide."
      - lesson: foundation-model-era
        why: "Trace the path from AlphaGo's move 37 to ChatGPT."
      - lesson: loss-landscapes
        why: "Picture training as walking downhill: valleys, saddles, and why neural networks train at all."
      - lesson: training-debugging
        why: "Find the first broken step when a training run goes wrong."
      - lesson: linguistic-annotation
        why: "Parse sentences into parts of speech, names, and relations: classic NLP that still powers pipelines."
      - lesson: tokenization-tradeoffs
        why: "Why some languages cost more tokens, and why models stumble on numbers and spelling."
      - lesson: attention-motivation
        why: "Why attention was invented: the bottleneck it removed and the idea behind the whole transformer."
      - lesson: linear-attention
        why: "Attention that stays fast on very long inputs, and what it gives up to get there."
      - lesson: low-rank-adaptation
        why: "LoRA: fine-tune a big language model on a laptop by learning a small update."
      - lesson: proprietary-model-evidence-boundaries
        why: "Learn what companies' reports about GPT-4 and Gemini really disclose, and what they leave out."
      - lesson: history-and-concept-map-project
        why: "Draw your own map connecting AI's big ideas from logic to large language models."
      - lesson: ablation-and-reproduction-project
        why: "Rerun a small result yourself, remove one ingredient, and see which part really made the difference."

      - lesson: python-experiments
        why: "Write small Python experiments you can rerun and trust."
      - lesson: experts
        why: "A quick preview of mixture-of-experts routing, the trick behind many of the largest models."
    related:
      - retrieval
      - agents
      - audio
      - multimodal
  - id: images
    title: Image generation
    subtitle: Shared foundations, then a system you can explain
    question: How can a model create an image from noise and a description?
    description: Start with how computers store pictures. Learn how a model learns
      from examples and gradually turns random visual noise into a picture guided
      by a description.
    outcome: By the end, you can explain conditional image generation and review a
      small image-system project.
    reference: Follow a conditional latent diffusion design through representations,
      training, denoising, and evaluation. GANs, autoregressive models, and flow
      models offer comparisons, not universal prerequisites.
