catalog:
- id: M00
  title: 'First steps: everyday ideas, AI words, and learning habits'
  lessons:
  - What is AI? Start with an everyday task
  - 'Inputs and outputs: what goes in and what comes out'
  - 'Data and examples: what a computer can learn from'
  - What is a model? A small rule inside a bigger app
  - 'Weights: the adjustable numbers in a model'
  - 'Training and inference: changing a rule or using it'
  - Follow one small AI system from start to finish
  - Different ways to solve the same problem
  - How to tell whether an AI answer is useful
  - How to use this school without getting lost
  - Practice, progress, and knowing what you understand
- id: M01
  title: History, research traditions, and turning points
  lessons:
  - Foundations in logic, computation, neuroscience, statistics, and cybernetics.
  - Early artificial neurons, learning rules, Turing’s questions, and the Dartmouth proposal.
  - Symbolic programs, game playing, early language systems, and ambitious predictions.
  - Perceptrons, limitations, funding cycles, and AI winters.
  - Expert systems, knowledge engineering, and the statistical learning revival.
  - Neural-network revival, backpropagation, convolution, large datasets, and accelerators.
  - Deep reinforcement learning, attention, transformers, generative models, and foundation models.
  - 'A research timeline: what changed, what persisted, and what remains unresolved.'
- id: M02
  title: Computation, representations, and algorithms
  lessons:
  - Bits, numbers, text, images, audio, and structured records.
  - Programs, algorithms, functions, and pseudocode.
  - Features, representations, embeddings, and inductive bias.
  - Scalars, vectors, matrices, tensors, and shape tracing.
  - Search spaces, combinatorial growth, runtime, and memory.
  - Randomness, pseudorandom seeds, determinism, and reproducibility.
  - CPUs, GPUs, accelerators, memory, and parallel computation.
  - Simulations, datasets, software systems, and the limits of a toy example.
- id: M03
  title: Data and problem formulation
  lessons:
  - Examples, features, targets, labels, and prediction tasks.
  - Supervised, unsupervised, self-supervised, and reinforcement-learning data.
  - Collection, consent, provenance, annotation, and documentation.
  - Missing values, outliers, duplicates, class imbalance, and preprocessing.
  - Train/validation/test splits, temporal splits, and leakage.
  - Sampling bias, representativeness, distribution shift, and dataset limits.
  - Augmentation, synthetic data, quality filters, and feedback loops.
  - Baselines, success criteria, error costs, and when learning is unnecessary.
- id: M04
  title: Logic, knowledge representation, and symbolic reasoning
  lessons:
  - Propositional logic, truth tables, and inference.
  - Predicates, quantifiers, first-order logic, and unification.
  - Rule engines, forward chaining, backward chaining, and expert systems.
  - Proof search, resolution, satisfiability, and automated theorem proving.
  - Ontologies, knowledge graphs, semantic relationships, and queries.
  - Defaults, exceptions, nonmonotonic reasoning, and commonsense difficulties.
  - Program synthesis, inductive logic programming, and learned rules.
  - Strengths and limits of explicit knowledge; connections to neural systems.
- id: M05
  title: Search, constraints, and planning
  lessons:
  - States, actions, goals, transitions, and search trees.
  - Breadth-first, depth-first, uniform-cost, and iterative-deepening search.
  - Heuristics, greedy search, A*, and admissibility.
  - Constraint satisfaction, propagation, backtracking, SAT, and SMT.
  - Minimax, alpha-beta pruning, and Monte Carlo tree search.
  - Classical planning, action representations, hierarchical and temporal planning.
  - Partial observability, replanning, and uncertain environments.
  - Local search, scheduling, optimization, and practical tradeoffs.
- id: M06
  title: Probability, uncertainty, and Bayesian AI
  lessons:
  - Uncertainty, probability, likelihood, and prior knowledge.
  - Bayes’ rule through a small classification example.
  - Naive Bayes and conditional-independence assumptions.
  - Bayesian networks, factor graphs, and probabilistic inference.
  - Hidden Markov models, state estimation, and Kalman-filter intuition.
  - Sampling, Monte Carlo, Markov chains, and approximate inference.
  - Gaussian processes, variational inference, Bayesian learning, and probabilistic programming.
  - Decision theory, calibration, and different sources of uncertainty.
- id: M07
  title: Supervised machine learning
  lessons:
  - Linear regression, predictions, residuals, and a simple fitted model.
  - Logistic regression and classification probabilities.
  - Nearest neighbors and distance-based prediction.
  - Decision trees, splits, and model complexity.
  - Random forests, bagging, boosting, and gradient-boosted trees.
  - Support vector machines, margins, and kernels.
  - Regularization, feature engineering, cross-validation, and tuning.
  - Metrics, threshold selection, error analysis, and model choice.
- id: M08
  title: Unsupervised learning, representation learning, and recommendation
  lessons:
  - 'Clustering: k-means, hierarchical methods, and density-based methods.'
  - Mixture models, latent variables, and expectation-maximization.
  - PCA, matrix factorization, and dimensionality reduction.
  - Nonlinear embeddings, self-organizing maps, and the pitfalls of interpreting 2D plots.
  - Anomaly detection, density estimation, and unusual examples.
  - Self-supervised objectives, contrastive learning, and learned representations.
  - Collaborative filtering, recommenders, ranking, and cold starts.
  - Recommendation feedback loops, exposure bias, and evaluation.
- id: M09
  title: Generalization, learning theory, and experiments
  lessons:
  - Empirical error, expected error, and generalization.
  - Underfitting, overfitting, bias, variance, and regularization.
  - Capacity, sample complexity, PAC learning, and VC-dimension intuition.
  - Distribution shift, out-of-distribution behavior, and robustness.
  - Hyperparameter selection, nested evaluation, and repeated testing.
  - Ablations, controls, confidence intervals, and statistical uncertainty.
  - Scaling behavior, double descent, memorization, and open questions.
  - Reproducibility, negative results, benchmark limitations, and reporting.
- id: M10
  title: 'Optimization: how learning changes a model'
  lessons:
  - Loss functions and the intuition of a loss landscape.
  - Derivatives, gradients, and finite-difference checks.
  - Gradient descent, stochastic gradients, and mini-batches.
  - Learning rate, schedules, momentum, and Adam-family optimizers.
  - Constraints, penalties, weight decay, and clipping.
  - Convex and nonconvex problems, saddle points, and curvature.
  - Initialization, normalization, numerical precision, and instability.
  - Debugging divergence, plateaus, noisy metrics, and broken objectives.
- id: M11
  title: Neural networks and backpropagation
  lessons:
  - 'A neuron: weights, bias, activation, output, and the perceptron as an early example.'
  - Nonlinearity, multilayer networks, expressivity, and representations.
  - Forward passes, batches, tensor shapes, and loss.
  - Backpropagation as the chain rule on a computation graph.
  - Automatic differentiation, gradient accumulation, and gradient checking.
  - Residual connections, normalization, dropout, and initialization.
  - Training loops, optimizers, checkpoints, and debugging.
  - What a network learns, transfer learning, memorization, and limitations.
- id: M12
  title: Computer vision and visual understanding
  lessons:
  - Pixels, color, geometry, invariance, and classical visual features.
  - Convolution, filters, channels, stride, pooling, and receptive fields.
  - Convolutional networks, residual networks, and image classification.
  - Object detection, segmentation, U-Net structure, tracking, and task-specific metrics.
  - Vision transformers, image patches, and positional information.
  - Self-supervised visual representations and transfer learning.
  - Depth, motion, 3D representations, and reconstruction.
  - Occlusion, shortcuts, adversarial examples, and distribution shift.
- id: M13
  title: Sequences, time series, speech, and audio
  lessons:
  - Time series, forecasting, seasonality, and temporal leakage.
  - Recurrent networks, hidden states, and backpropagation through time.
  - LSTMs, GRUs, gating, and long-range dependencies.
  - Sequence-to-sequence learning, alignment, and teacher forcing.
  - Waveforms, frequency, spectrograms, and audio representations.
  - Speech recognition, acoustic/language modeling, and recognition metrics.
  - Speech synthesis, vocoders, audio generation, and streaming.
  - Sequence evaluation, multilingual speech, latency, and robustness.
- id: M14
  title: Language, tokenization, and early NLP
  lessons:
  - Language structure, ambiguity, syntax, semantics, and pragmatics.
  - Rules, parsing, tagging, named entities, and information extraction.
  - Bag of words, TF-IDF, n-grams, and statistical language models.
  - Character, byte, word, and subword tokenization.
  - Word embeddings, distributional meaning, and embedding limitations.
  - BPE and unigram tokenizers, vocabularies, and special tokens.
  - Multilingual text, code, rare strings, and tokenization tradeoffs.
  - Next-token prediction, context, perplexity, and generation basics.
- id: M15
  title: Attention and transformer internals
  lessons:
  - Why attention was introduced; sequence bottlenecks and contextual representations.
  - Queries, keys, values, dot products, and attention weights.
  - Scaled dot-product attention, softmax, and masking.
  - Multiple heads, output projections, and tensor shapes.
  - Positions, sinusoidal encodings, learned encodings, and rotary embeddings.
  - Feed-forward layers, gated activations, residual streams, and normalization.
  - Encoder-only, decoder-only, and encoder-decoder models; training objectives.
  - End-to-end token tracing, context cost, and attention’s limitations.
- id: M16
  title: Language-model data and pretraining
  lessons:
  - Base models, initialization, architecture configuration, and tokenizer design.
  - Data sourcing, licensing records, filtering, deduplication, and contamination checks.
  - Data mixtures, sampling weights, multilingual/code data, and synthetic data.
  - Sequence packing, masking, document boundaries, and training batches.
  - Next-token, masked-token, denoising, and multi-token objectives.
  - Forward pass, loss, backward pass, optimizer update, and scheduling.
  - Scaling laws, compute/data tradeoffs, checkpoints, and training evaluation.
  - Continued pretraining, domain adaptation, long-context stages, and base-model release.
- id: M17
  title: Training infrastructure and hardware
  lessons:
  - FLOPs, memory bandwidth, interconnects, accelerator utilization, and bottlenecks.
