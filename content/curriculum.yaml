  - id: prediction
    title: Prediction & anomaly detection
    subtitle: Shared foundations, then a system you can explain
    question: How does a predictor learn from examples and flag unusual cases?
    description: Use past examples to predict an amount or a category and notice
      unusual cases. Compare simple methods, test on examples kept out of
      training, and investigate different kinds of mistakes.
    outcome: By the end, you can compare a baseline with a learned predictor and
      distinguish predictive errors from unusual observations.
    reference: Compare a simple tabular predictor with a baseline, inspect
      uncertainty and unusual cases, and test on reserved data. Unusual does not
      automatically mean erroneous or harmful.
